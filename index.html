<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Phase 2 — IMAX Shield Shatter</title>

<style>
body {
  margin: 0;
  height: 100vh;
  background: radial-gradient(#0b0f1c, #02040a);
  display: flex;
  justify-content: center;
  align-items: center;
  overflow: hidden;
  font-family: Cinzel, serif;
}

/* -------------------- SHIELD CONTAINER -------------------- */
#shieldWrapper {
  position: relative;
  width: 420px;
  height: 420px;
  transition: opacity 0.4s ease-out;
}

/* -------------------- SHIELD BASE -------------------- */
#shield {
  width: 100%;
  height: 100%;
  border-radius: 50%;
  background:
    radial-gradient(circle, rgba(255,255,255,0.2) 0%, transparent 60%),
    conic-gradient(
      #7a0f14 0deg 90deg,      /* outer dark red */
      #5f5f5f 90deg 180deg,   /* dark metallic white */
      #7a0f14 180deg 270deg,  /* dark red */
      #0a1a3d 270deg 360deg   /* navy blue */
    );
  box-shadow:
      0 0 40px rgba(255,255,255,0.05),
      inset 0 0 60px rgba(0,0,0,0.7),
      inset 0 0 30px rgba(255,255,255,0.15);
  position: absolute;
  top: 0;
  left: 0;
  overflow: visible;
}

/* -------------------- STAR -------------------- */
#star {
  position: absolute;
  top: 50%;
  left: 50%;
  width: 52%;
  height: 52%;
  transform: translate(-50%, -50%);
  clip-path: polygon(
    50% 0%, 61% 35%, 98% 35%,
    68% 57%, 79% 91%, 50% 70%,
    21% 91%, 32% 57%, 2% 35%,
    39% 35%
  );
  background: linear-gradient(135deg, #d8d8d8, #8a8a8a, #ffffff);
  filter: drop-shadow(0 0 25px rgba(255,255,255,0.15));
  transition: transform 1.2s ease-out;
}

/* -------------------- STAR ROTATION -------------------- */
.spinStar {
  animation: spin 2.4s linear forwards;
}

@keyframes spin {
  from { transform: translate(-50%, -50%) rotate(0deg); }
  to   { transform: translate(-50%, -50%) rotate(1080deg); }
}

/* -------------------- SHATTER PARTICLES -------------------- */
.shard {
  position: absolute;
  width: 22px;
  height: 22px;
  background: linear-gradient(135deg,#c0c0c0,#6a6a6a);
  border-radius: 4px;
  opacity: 0;
  pointer-events: none;
  transform: translate(200px,200px);
}

@keyframes burstShard {
  0% {
    opacity: 1;
    transform: translate(200px,200px) scale(1);
  }
  100% {
    opacity: 0;
    transform: translate(var(--x), var(--y)) scale(0.1);
  }
}
</style>
</head>

<body>

<div id="shieldWrapper">
  <div id="shield"></div>
  <div id="star"></div>
</div>

<script>
const star = document.getElementById("star");
const shield = document.getElementById("shield");
const wrapper = document.getElementById("shieldWrapper");

star.addEventListener("click", () => {
  
  /* 1 — Start star spin */
  star.classList.add("spinStar");

  /* 2 — Create metallic shatter effect */
  createShatter();

  /* 3 — Remove shield after shatter */
  setTimeout(() => {
    shield.style.opacity = "0";
  }, 300);

  /* 4 — Remove shield fully */
  setTimeout(() => {
    shield.remove();
  }, 900);
});


/********** METALLIC SHATTER FUNCTION **********/
function createShatter() {
  const count = 32; // number of shards

  for (let i = 0; i < count; i++) {
    const shard = document.createElement("div");
    shard.classList.add("shard");

    const angle = Math.random() * 2 * Math.PI;
    const distance = 200 + Math.random() * 200;

    shard.style.setProperty("--x", Math.cos(angle) * distance + "px");
    shard.style.setProperty("--y", Math.sin(angle) * distance + "px");

    wrapper.appendChild(shard);

    shard.style.animation = `burstShard 0.8s ease-out forwards`;

    setTimeout(() => shard.remove(), 900);
  }
}
</script>

</body>
</html>
