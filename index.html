<head>

<title>IMAX – HAPPY BIRTHDAY PRINCE</title>
<style>
  body { margin:0; overflow:hidden; background:#000; }
  canvas { display:block; }
</style>
</head>
<body>

<!-- ---------------- PHASE 1 ---------------- -->
<div id="stage1">
    <div id="instruction">Drag the moon to the end</div>
    <canvas id="stars"></canvas>
    <div id="ambient"></div>
    <div id="moon"></div>
    <div id="sun"></div>
    <div id="message">ON THIS CALM BIRTHDAY EVE SO NEW, GOD SOFTLY WHISPERS, MY PLANS ARE MADE FOR YOU.</div>
    <audio id="whoosh" src="https://cdn.pixabay.com/download/audio/2021/09/16/audio_4f1c1c9f28.mp3?filename=woosh-14795.mp3"></audio>
</div>

<!-- ---------------- PHASE 2 ---------------- -->
<div id="stage2">
    <div id="instruction">Click the star at the center of the shield</div>
    <canvas id="shieldCanvas"></canvas>
    <div id="verse">He counts the stars and calls them each by name — Psalm 147:4</div>
</div>

<!-- ---------------- PHASE 3 ---------------- -->
<div id="stage3">
    <canvas id="c"></canvas>
    <button id="clickBtn">Click Here</button>
</div>

<!-- ---------------- PHASE 4 ---------------- -->
<div id="phase4" style="display:none;"></div>

<!-- ---------------- THREE.JS ---------------- -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/examples/js/loaders/FontLoader.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/examples/js/geometries/TextGeometry.js"></script>

<!-- ---------------- PHASE 4 SCRIPT ---------------- -->
<script>
function startPhase4(){
    document.getElementById("phase4").style.display = "block";

    // ---------------- Scene + Camera ----------------
    let scene = new THREE.Scene();
    scene.fog = new THREE.FogExp2(0x000000, 0.0012);

    let camera = new THREE.PerspectiveCamera(60, window.innerWidth/window.innerHeight, 0.1, 3000);
    camera.position.set(0, 50, 400);

    let renderer = new THREE.WebGLRenderer({antialias:true});
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(window.devicePixelRatio);
    document.getElementById("phase4").appendChild(renderer.domElement);

    // ---------------- Stars ----------------
    let starGeo = new THREE.BufferGeometry();
    let starCount = 2500;
    let starArr = new Float32Array(starCount * 3);
    for(let i=0;i<starCount*3;i++){
        starArr[i] = (Math.random() - 0.5) * 3000;
    }
    starGeo.setAttribute("position", new THREE.BufferAttribute(starArr, 3));

    let starMat = new THREE.PointsMaterial({ color:0xffffff, size:2.2 });
    let stars = new THREE.Points(starGeo, starMat);
    scene.add(stars);

    let starVel = new Float32Array(starCount);
    for(let i=0;i<starCount;i++){ starVel[i] = Math.random()*0.02 + 0.01; }

    // ---------------- Lights ----------------
    let ambient = new THREE.AmbientLight(0x666666, 0.5);
    scene.add(ambient);

    let keyLight = new THREE.PointLight(0x99ccff, 2, 2000);
    keyLight.position.set(180, 200, 140);
    scene.add(keyLight);

    let warmLight = new THREE.PointLight(0xffddaa, 1.8, 2000);
    warmLight.position.set(-120, 160, -80);
    scene.add(warmLight);

    // ---------------- Glowing Nebula Shader ----------------
    const nebulaMat = new THREE.ShaderMaterial({
        uniforms: { time:{ value:0 } },
        vertexShader: `...`, // Your Phase 4 vertex shader
        fragmentShader: `...`, // Your Phase 4 fragment shader
        metalness: 1,
        roughness: 0.25,
        transparent: true
    });

    // ---------------- Text ----------------
    let princeLetters = [];
    let birthdayMesh=null, oneMesh=null;
    const princeText = "PRINCE";
    let loadedFont=null;

    new THREE.FontLoader().load(
        "https://threejs.org/examples/fonts/helvetiker_bold.typeface.json",
        font => {
            loadedFont = font;

            // Background "1"
            let oneGeo = new THREE.TextGeometry("1",{font: font, size:120, height:10, bevelEnabled:true, bevelThickness:5, bevelSize:3});
            oneGeo.center();
            let oneMat = new THREE.MeshStandardMaterial({ color:0x3399ff, emissive:0x112244, metalness:0.5, roughness:0.6 });
            oneMesh = new THREE.Mesh(oneGeo, oneMat);
            oneMesh.position.y = 180; oneMesh.position.z = -50;
            scene.add(oneMesh);

            // HAPPY BIRTHDAY
            let birthdayGeo = new THREE.TextGeometry("HAPPY BIRTHDAY",{ font: font, size:36, height:6, bevelEnabled:true, bevelThickness:3, bevelSize:1.5 });
            birthdayGeo.center();
            let birthdayMat = new THREE.MeshStandardMaterial({ color:0xffd98c, emissive:0xffaa33, metalness:0.8, roughness:0.35 });
            birthdayMesh = new THREE.Mesh(birthdayGeo, birthdayMat);
            birthdayMesh.position.y = 180; 
            scene.add(birthdayMesh);

            // PRINCE letters
            createPrinceLetters();
            setTimeout(revealNextLetter, 800);
        }
    );

    /* Include all Phase 4 helper functions (createPrinceLetters, revealNextLetter, animate, resize handling) exactly as in your code */
}

/* ---------------- Trigger Phase 4 ---------------- */
setTimeout(()=>{
    document.getElementById("stage1").style.display = "none";
    document.getElementById("stage2").style.display = "none";
    document.getElementById("stage3").style.display = "none";
    startPhase4();
}, 3000);
</script>

</body>
</html>
