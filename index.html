<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cinematic Night Sky</title>
<style>
  body, html {
    margin: 0;
    padding: 0;
    overflow: hidden;
    width: 100%;
    height: 100%;
    background: linear-gradient(to top, #06070f, #0d1023, #1a1c3d);
    font-family: 'Cinzel', serif;
  }

  /* Stars */
  .star {
    position: absolute;
    width: 2px;
    height: 2px;
    background: white;
    border-radius: 50%;
    opacity: 0.8;
    box-shadow: 0 0 6px rgba(255,255,255,0.7);
    animation: twinkle 2s infinite alternate;
  }

  @keyframes twinkle {
    0% { opacity: 0.3; transform: scale(1); }
    50% { opacity: 1; transform: scale(1.4); }
    100% { opacity: 0.3; transform: scale(1); }
  }

  /* Aurora */
  .aurora {
    position: absolute;
    top: 0;
    width: 100%;
    height: 40vh;
    background: radial-gradient(circle at 50% 20%, rgba(0,255,200,0.3), transparent),
                radial-gradient(circle at 30% 10%, rgba(0,150,255,0.25), transparent),
                radial-gradient(circle at 70% 5%, rgba(150,80,255,0.25), transparent);
    filter: blur(30px);
    animation: auroraMove 20s ease-in-out infinite alternate;
  }

  @keyframes auroraMove {
    0% { transform: translateY(0px) scale(1); }
    100% { transform: translateY(-20px) scale(1.1); }
  }

  /* Clouds */
  .cloud {
    position: absolute;
    width: 250px;
    height: 100px;
    background: rgba(255,255,255,0.07);
    border-radius: 50%;
    filter: blur(25px);
    animation: moveCloud linear infinite;
  }

  @keyframes moveCloud {
    0% { left: -300px; }
    100% { left: 110%; }
  }

  /* Moon */
  .moon {
    position: absolute;
    width: 140px;
    height: 140px;
    background: radial-gradient(circle, #fffde6 0%, #f3e4b0 60%, #d9c180 100%);
    border-radius: 50%;
    top: 80px;
    left: -120px;
    box-shadow: 0 0 18px 4px rgba(255,255,200,0.4);
    animation: moonMove 55s linear infinite;
  }

  @keyframes moonMove {
    0% { left: -150px; }
    100% { left: calc(100% - 100px); }
  }

  /* Shooting stars */
  .shooting-star {
    position: absolute;
    width: 6px;
    height: 2px;
    background: linear-gradient(0deg, rgba(255,255,255,0), white);
    border-radius: 50%;
    opacity: 0;
    transform-origin: top left;
    animation: shoot 2.5s linear forwards;
  }

  @keyframes shoot {
    0% { transform: translate(0,0) rotate(-45deg); opacity: 1; }
    100% { transform: translate(-70vw,70vh) rotate(-45deg); opacity: 0; }
  }

  /* Message reveal */
  #message {
    position: absolute;
    top: 60%;
    width: 100%;
    text-align: center;
    font-size: 28px;
    color: #f9e9c9;
    opacity: 0;
    letter-spacing: 3px;
  }

  .letter {
    opacity: 0;
    display: inline-block;
    animation: revealLetter 0.6s forwards;
  }

  @keyframes revealLetter {
    0% { opacity: 0; filter: blur(6px); transform: translateY(5px); }
    100% { opacity: 1; filter: blur(0); transform: translateY(0); }
  }
</style>
</head>
<body>

<div class="aurora"></div>
<div class="moon"></div>
<div id="message"></div>

<script>
  /* Stars */
  const starCount = 160;
  for(let i=0;i<starCount;i++){
    const star=document.createElement('div');
    star.classList.add('star');
    star.style.top=Math.random()*window.innerHeight+'px';
    star.style.left=Math.random()*window.innerWidth+'px';
    document.body.appendChild(star);
  }

  /* Clouds */
  const cloudCount = 6;
  for(let i=0;i<cloudCount;i++){
    const cloud=document.createElement('div');
    cloud.classList.add('cloud');
    cloud.style.top=(50 + Math.random()*250)+'px';
    cloud.style.animationDuration=(35 + Math.random()*40)+'s';
    document.body.appendChild(cloud);
  }

  /* Shooting stars */
  function createShootingStar(){
    const star=document.createElement('div');
    star.classList.add('shooting-star');
    star.style.top=Math.random()*200+'px';
    star.style.left=window.innerWidth+'px';
    const duration=2 + Math.random()*1.3;
    star.style.animationDuration=duration+'s';
    document.body.appendChild(star);
    setTimeout(()=>{ star.remove(); }, duration*1000);
  }
  setInterval(createShootingStar, 1800);

  /* Message reveal synced with moon */
  const msg = "On this calm birthday eve so new, God softly whispers, my plans are made for you.";
  const messageDiv = document.getElementById("message");

  function revealMessage(){
    let delay = 0;
    msg.split("").forEach((char,i)=>{
      const span=document.createElement('span');
      span.classList.add('letter');
      span.textContent = char === ' ' ? '\u00A0' : char;
      span.style.animationDelay = (0.1 * i)+'s';
      messageDiv.appendChild(span);
    });
    messageDiv.style.opacity = 1;
  }

  /* Trigger reveal when moon reaches 70% of screen */
  const moon=document.querySelector('.moon');
  function checkMoon(){
    const rect=moon.getBoundingClientRect();
    if(rect.left > window.innerWidth*0.55){
      revealMessage();
      clearInterval(interval);
    }
  }
  const interval = setInterval(checkMoon, 200);
</script>

</body>
</html>
