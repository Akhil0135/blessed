<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>PHASE 1 — IMAX CINEMATIC EXPERIENCE</title>

<style>
    html, body {
        margin: 0;
        padding: 0;
        width: 100%; height: 100%;
        overflow: hidden;
        background: #000;
        font-family: "Cinzel", serif;
        transition: background 2.5s ease;
    }

    /* Cinematic camera zoom */
    body.zoom-in {
        transform: scale(1.05);
        transition: transform 6s ease-out;
    }

    /* Stars */
    .star {
        position: absolute;
        width: 2px; height: 2px;
        background: white;
        border-radius: 50%;
        opacity: 0;
        animation: twinkle 4s infinite ease-in-out alternate;
    }
    @keyframes twinkle {
        0% { opacity: 0.1; transform: scale(0.4); }
        50% { opacity: 1; transform: scale(1.3); }
        100% { opacity: 0.2; transform: scale(0.5); }
    }

    /* MOON */
    #moon {
        position: absolute;
        width: 130px; height: 130px;
        top: 60px; left: 60px;
        border-radius: 50%;
        background: radial-gradient(circle at 30% 30%, #fff, #d6d6d6, #9b9b9b);
        box-shadow: 0 0 40px 20px rgba(255,255,255,0.45);
        cursor: grab;
    }

    /* SUN (bigger, clean, no rays) */
    #sun {
        position: absolute;
        width: 260px; height: 260px;
        top: -300px; right: -300px;
        border-radius: 50%;
        opacity: 0;
        background: radial-gradient(circle at 30% 30%, #fff8d6, #ffd444, #ff8c00);
        box-shadow: 0 0 90px 45px rgba(255,180,0,0.55);
        transition: all 2.8s ease-out;
        animation: rotateSun 22s linear infinite;
    }

    @keyframes rotateSun {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
    }

    /* Lens flares only — NO god rays */
    .flare {
        position: absolute;
        width: 3px; height: 100vh;
        background: rgba(255,200,80,0.25);
        top: 0;
        left: 50%;
        transform: translateX(-50%) scaleY(0);
        opacity: 0;
        pointer-events: none;
    }

    /* Message */
    #msg {
        position: absolute;
        width: 100%;
        bottom: 15%;
        text-align: center;
        font-size: 22px;
        letter-spacing: 2px;
        color: #ffd88a;
        opacity: 0;
        text-shadow: 0 0 6px #644400;
    }
</style>
</head>

<body>

<!-- Moon -->
<div id="moon"></div>

<!-- Sun -->
<div id="sun"></div>

<!-- Lens flares -->
<div class="flare" id="flare1"></div>
<div class="flare" id="flare2" style="left: 40%;"></div>
<div class="flare" id="flare3" style="left: 60%;"></div>

<!-- Message -->
<div id="msg"></div>

<script>
/* STARS */
for (let i = 0; i < 260; i++) {
    const s = document.createElement("div");
    s.className = "star";
    s.style.left = Math.random() * window.innerWidth + "px";
    s.style.top = Math.random() * window.innerHeight + "px";
    s.style.animationDelay = (Math.random() * 3) + "s";
    document.body.appendChild(s);
}

const moon = document.getElementById("moon");
const sun = document.getElementById("sun");
const msg = document.getElementById("msg");

let dragging = false;

/* Message */
const fullText =
"ON THIS CALM BIRTHDAY EVE SO NEW, GOD SOFTLY WHISPERS, MY PLANS ARE MADE FOR YOU.";
let revealed = 0;

/* Dragging */
moon.addEventListener("mousedown", () => dragging = true);
window.addEventListener("mouseup", () => dragging = false);

window.addEventListener("mousemove", (e) => {
    if (!dragging) return;

    moon.style.left = (e.clientX - 65) + "px";
    moon.style.top = (e.clientY - 65) + "px";

    const progress = Math.min(e.clientX / window.innerWidth, 1);

    /* Fade stars */
    document.querySelectorAll(".star").forEach(star => {
        star.style.opacity = 1 - progress;
    });

    /* Reveal message */
    let letters = Math.floor(progress * fullText.length);
    if (letters > revealed) {
        revealed = letters;
        msg.textContent = fullText.substring(0, revealed);
        msg.style.opacity = 1;
    }

    /* Sun entrance */
    if (revealed >= fullText.length) {
        moon.style.transition = "1.5s ease";
        moon.style.opacity = 0;

        sun.style.opacity = 1;
        sun.style.top = "60px";
        sun.style.right = "60px";

        document.body.classList.add("zoom-in");

        activateLensFlare();

        document.body.style.background =
            "linear-gradient(#001122, #004466, #447799)";
    }
});

/* Lens flares */
function activateLensFlare() {
    const flares = ["flare1", "flare2", "flare3"].map(id => document.getElementById(id));

    flares.forEach((f, i) => {
        setTimeout(() => {
            f.style.opacity = 1;
            f.style.transform = "translateX(-50%) scaleY(1)";
            f.style.transition = "transform 1.8s ease, opacity 1.8s ease";
        }, i * 250);
    });

    setTimeout(() => {
        flares.forEach(f => f.style.opacity = 0);
    }, 2000);
}
</script>

</body>
</html>
