<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Captain America Shield — Phase 2 (Divine Light Reveal)</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
html, body {
    margin:0;
    padding:0;
    overflow:hidden;
    background: radial-gradient(circle at center, #0a0d19 0%, #05060f 60%, #010208 100%);
    font-family:"Cinzel", serif;
}
canvas { display:block; }

/* Divine light beam */
#light-beam {
    position: absolute;
    top: -500px;
    left: 50%;
    transform: translateX(-50%);
    width: 10px;
    height: 500px;
    background: radial-gradient(circle, rgba(255,255,255,0.95) 0%, rgba(255,255,255,0) 80%);
    opacity: 0;
    pointer-events:none;
    transition: top 2s ease-out, opacity 1.2s ease-out;
}

/* Verse letters */
.verse-letter {
    position:absolute;
    font-size:36px;
    color:#ffd977;
    text-shadow:0 0 15px #ffe9b0;
    opacity:0;
    transform: scale(0.5);
    transition: opacity 1s ease-out, transform 1s ease-out;
    white-space: pre;
    pointer-events:none;
}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="light-beam"></div>

<script>
const canvas=document.getElementById('c');
const ctx=canvas.getContext('2d');
const lightBeam=document.getElementById('light-beam');

function resize(){canvas.width=window.innerWidth;canvas.height=window.innerHeight;}
resize();
window.onresize=resize;

// ------------------ Background stars ------------------
const bgStars=[];
for(let i=0;i<150;i++){
    bgStars.push({
        x: Math.random()*canvas.width,
        y: Math.random()*canvas.height,
        z: Math.random()*1.5 + 0.5,
        tw: Math.random()*0.02 + 0.005
    });
}
function drawBackgroundStars(){
    ctx.fillStyle="#0a0d19";
    ctx.fillRect(0,0,canvas.width,canvas.height);
    bgStars.forEach(s=>{
        const glow=(Math.sin(Date.now()*s.tw)+1)*0.5;
        ctx.fillStyle=`rgba(255,255,255,${glow})`;
        ctx.beginPath();
        ctx.arc(s.x,s.y,s.z,0,Math.PI*2);
        ctx.fill();
    });
}

// ------------------ Shield ------------------
let shieldX, shieldY, R;
let starSpin=false;
let starAngle=0;

function drawShield(){
    shieldX=canvas.width/2;
    shieldY=canvas.height/2;
    R=Math.min(canvas.width,canvas.height)/3;

    ctx.save();
    ctx.translate(shieldX,shieldY);

    // Outer red
    const g1=ctx.createRadialGradient(0,0,R*0.2,0,0,R);
    g1.addColorStop(0,"#3c0000"); g1.addColorStop(1,"#7a0000");
    ctx.fillStyle=g1; ctx.beginPath(); ctx.arc(0,0,R,0,Math.PI*2); ctx.fill();

    // White
    const g2=ctx.createRadialGradient(0,0,R*0.1,0,0,R*0.75);
    g2.addColorStop(0,"#dadada"); g2.addColorStop(1,"#f5f5f5");
    ctx.fillStyle=g2; ctx.beginPath(); ctx.arc(0,0,R*0.75,0,Math.PI*2); ctx.fill();

    // Inner red
    const g3=ctx.createRadialGradient(0,0,R*0.1,0,0,R*0.5);
    g3.addColorStop(0,"#4b0000"); g3.addColorStop(1,"#8c0000");
    ctx.fillStyle=g3; ctx.beginPath(); ctx.arc(0,0,R*0.5,0,Math.PI*2); ctx.fill();

    // Blue metallic center
    const g4=ctx.createRadialGradient(0,0,R*0.05,0,0,R*0.35);
    g4.addColorStop(0,"#b4c7e0"); g4.addColorStop(1,"#001933");
    ctx.fillStyle=g4; ctx.beginPath(); ctx.arc(0,0,R*0.35,0,Math.PI*2); ctx.fill();

    // Star
    ctx.save();
    if(starSpin) ctx.rotate(starAngle);
    const starR=R*0.28;
    ctx.beginPath();
    for(let i=0;i<5;i++){
        let o=(Math.PI*2/5)*i - Math.PI/2;
        let n=o+Math.PI/5;
        ctx.lineTo(Math.cos(o)*starR, Math.sin(o)*starR);
        ctx.lineTo(Math.cos(n)*(starR*0.45), Math.sin(n)*(starR*0.45));
    }
    ctx.closePath();
    ctx.shadowColor="rgba(255,255,255,0.25)";
    ctx.shadowBlur=5;
    const sg=ctx.createRadialGradient(0,0,starR*0.1,0,0,starR);
    sg.addColorStop(0,"#ffffff"); sg.addColorStop(0.4,"#eeeeee"); sg.addColorStop(1,"#7a7a7a");
    ctx.fillStyle=sg; ctx.fill();
    ctx.restore();
    ctx.restore();
}

// ------------------ Animate ------------------
function loop(){
    drawBackgroundStars();
    drawShield();
    if(starSpin) starAngle+=0.04;
    requestAnimationFrame(loop);
}
loop();

// ------------------ Click event ------------------
canvas.addEventListener("click",(e)=>{
    let dx=e.clientX-shieldX, dy=e.clientY-shieldY;
    if(Math.sqrt(dx*dx+dy*dy)<=R*0.28){
        if(!starSpin){
            starSpin=true;
            revealVerseWithLight();
        }
    }
});

// ------------------ Divine light revealing the verse ------------------
function revealVerseWithLight(){
    lightBeam.style.opacity=1;
    lightBeam.style.top="0px";

    const verse="He counts the stars and calls them each by name — Psalm 147:4";
    const letters = [...verse];
    const startX=canvas.width/2 - (verse.length*18)/2;
    const startY=0;

    letters.forEach((char,i)=>{
        setTimeout(()=>{
            const span=document.createElement("div");
            span.className="verse-letter";
            span.textContent=char;
            span.style.left=startX + i*18 + "px";
            span.style.top=startY + "px";
            span.style.opacity=0;
            span.style.transform="scale(0.5)";
            document.body.appendChild(span);

            // Animate opacity when light reaches
            setTimeout(()=>{
                span.style.opacity=1;
                span.style.transform="scale(1)";
            }, i*120 + 400); // delay to simulate light spreading
        }, i*100);
    });
}
</script>
</body>
</html>
