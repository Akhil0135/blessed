<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Phase 4 — Happy Birthday Prince</title>

<style>
    html, body {
        margin: 0;
        padding: 0;
        overflow: hidden;
        background: black;
        font-family: "Cinzel", serif;
    }

    /* Galaxy background */
    body {
        background-image: url("https://upload.wikimedia.org/wikipedia/commons/4/4f/NASA-Hubble-Galaxy.jpg");
        background-size: cover;
        background-position: center;
        background-repeat: no-repeat;
    }

    /* Cinematic text */
    #title {
        position: absolute;
        top: 50%;
        left: 50%;
        transform-style: preserve-3d;
        transform: translate(-50%, -50%) rotateY(0deg);
        font-size: 70px;
        color: #fff2cc;
        text-shadow: 0 0 20px #ffd27a, 0 0 40px #ffb300;
        letter-spacing: 8px;
        white-space: nowrap;
    }
</style>
</head>

<body>

<div id="title">HAPPY BIRTHDAY PRINCE</div>

<script>
let angle = 0;

function animateCamera() {
    angle += 0.1; // rotation speed
    const title = document.getElementById("title");

    // camera-like rotation effect
    title.style.transform =
        `translate(-50%, -50%) rotateY(${Math.sin(angle * 0.02) * 35}deg) 
         rotateX(${Math.cos(angle * 0.015) * 15}deg) 
         scale(${1 + Math.sin(angle * 0.01) * 0.1})`;

    requestAnimationFrame(animateCamera);
}

animateCamera();
</script>

</body>
</html>
