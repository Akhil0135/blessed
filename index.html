<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Cinematic Night to Day</title>

<style>
html,body{
  height:100%;
  margin:0;
  background:#000;
  overflow:hidden;
  font-family: "Cinzel", serif;
}

/* ---------- Scene Container ----------- */
#scene{
  position:relative;
  width:100%;
  height:100%;
  overflow:hidden;
}

/* ---------- SKY GRADIENT ----------- */
#sky{
  position:absolute;
  inset:0;
  background:linear-gradient(to bottom,#030014,#120034 40%,#1a0046 70%);
  transition:background 1.2s ease;
  pointer-events:none;
}

/* ---------- MOON ----------- */
#moon{
  position:absolute;
  width:160px;
  height:160px;
  border-radius:50%;
  background:#d9d8ff;
  box-shadow:0 0 40px #b8b6ff;
  top:25%;
  left:20%;
  transform:translate(-50%,-50%);
  transition:opacity 1.4s ease, transform 1.4s ease;
  pointer-events:none;
}

/* ---------- CINEMATIC SUN (TOP-RIGHT RISE) ----------- */
#sun{
  position:absolute;
  width:280px;
  height:280px;
  border-radius:50%;
  background: radial-gradient(circle, #ffd27f, #ff9a00);
  box-shadow: 0 0 160px #ffae42, 0 0 280px #ff7b00;
  opacity:0;
  transform: translate(300px,300px) scale(0.4);
  right: -200px;
  top: -200px;
  transition:opacity 1.4s ease, transform 1.4s ease;
  pointer-events:none;
}

/* ---------- MESSAGE TEXT ----------- */
#msg{
  position:absolute;
  width:100%;
  text-align:center;
  bottom:22%;
  color:#c38bff;
  font-size:2rem;
  font-weight:700;
  opacity:0;
  text-shadow:0 0 25px #8e3fff;
  transition:opacity 1.4s ease;
  pointer-events:none;
}

/* ---------- BUTTON ----------- */
#btn{
  position:absolute;
  left:50%;
  bottom:16%;
  transform:translateX(-50%);
  background:linear-gradient(to right,#6a00ff,#c200ff);
  color:#fff;
  font-size:1.2rem;
  padding:14px 32px;
  border:none;
  border-radius:14px;
  cursor:pointer;
  box-shadow:0 0 18px #9400ff;
  transition:opacity 0.6s ease;
}

/* ---------- IMAX CHRISTIAN CROSS ----------- */
#cross{
  position:absolute;
  left:50%;
  transform:translateX(-50%);
  top:18%; /* HIGH, MAJESTIC spacing */
  width:0;
  height:0;
  opacity:0;
  pointer-events:none;
  transition:opacity 1.4s ease, transform 1.4s ease;
}

.cross-vertical{
  position:absolute;
  left:50%;
  transform:translateX(-50%);
  width:22px;
  height:240px;
  background:#30006b;
  box-shadow:0 0 32px #7900ff;
}

.cross-horizontal{
  position:absolute;
  left:50%;
  transform:translateX(-50%);
  width:160px;
  height:22px;

  /* Horizontal bar placed at EXACT 35% of vertical bar */
  top: calc(240px * 0.35);

  background:#30006b;
  box-shadow:0 0 32px #7900ff;
}

/* Day Mode Sky */
.daySky{
  background:linear-gradient(to bottom,#4ac8ff,#ffe29f 60%,#ffcf71 90%);
}
</style>
</head>

<body>
<div id="scene">
  <div id="sky"></div>
  <div id="moon"></div>
  <div id="sun"></div>

  <div id="msg">
    On this calm birthday eve so new, God softly whispers, my plans are made for you.
  </div>

  <button id="btn">Click Here</button>

  <div id="cross">
    <div class="cross-vertical"></div>
    <div class="cross-horizontal"></div>
  </div>
</div>

<script>
let revealDone = false;
let sunLocked = false;

/* CLICK → reveal message, then reveal cross */
btn.addEventListener('click', ()=>{
  btn.style.opacity = 0;
  setTimeout(()=>btn.style.display="none",600);

  msg.style.opacity = 1;

  setTimeout(()=>{
    cross.style.opacity = 1;
    cross.style.transform = "translateX(-50%) scale(1.06)";
  },1200);

  revealDone = true;
});

/* CINEMATIC SUN RISE + LOCK */
let progress = 0;

document.addEventListener('pointermove', (e)=>{
  if(!revealDone) return;
  if(sunLocked) return;

  let y = e.clientY;
  let screenH = window.innerHeight;

  progress = 1 - (y / screenH);
  progress = Math.max(0, Math.min(1, progress));

  /* Sun arc motion */
  sun.style.opacity = progress;
  sun.style.transform =
    `translate(${(1-progress)*300}px, ${(1-progress)*300}px) scale(${0.4 + progress*0.6})`;

  /* Moon fade-out */
  moon.style.opacity = (1-progress);

  /* Sky transition */
  if(progress > 0.4){
    sky.classList.add("daySky");
  }

  /* LOCK when sun fully risen */
  if(progress >= 1){
    sunLocked = true;
  }
});
</script>
</body>
</html>
