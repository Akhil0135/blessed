<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Phase 4 — HAPPY BIRTHDAY PRINCE</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  body { margin:0; overflow:hidden; background:#000; }
  canvas { display:block; }
</style>
</head>
<body>

<script src="https://cdn.jsdelivr.net/npm/three@0.159.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.159.0/examples/js/geometries/TextGeometry.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.159.0/examples/js/loaders/FontLoader.js"></script>

<script>
let scene = new THREE.Scene();
let camera = new THREE.PerspectiveCamera(60, window.innerWidth/window.innerHeight, 0.1, 2000);
camera.position.set(0, 80, 250);

let renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(window.devicePixelRatio);
document.body.appendChild(renderer.domElement);

// ---------- Galaxy Nebula Background ----------
let starGeo = new THREE.BufferGeometry();
let starCount = 3000;
let starPositions = new Float32Array(starCount * 3);
for (let i = 0; i < starCount * 3; i++) {
    starPositions[i] = (Math.random() - 0.5) * 3000;
}
starGeo.setAttribute("position", new THREE.BufferAttribute(starPositions, 3));
let starMat = new THREE.PointsMaterial({
    color: 0xffffff,
    size: 2,
    transparent: true,
    opacity: 0.9
});
let stars = new THREE.Points(starGeo, starMat);
scene.add(stars);

// ---------- Nebula fog ----------
let fogColor = 0x000011;
scene.fog = new THREE.FogExp2(fogColor, 0.0009);

// ---------- Lighting ----------
let ambientLight = new THREE.AmbientLight(0xffffff, 1.0);
scene.add(ambientLight);

let glowLight = new THREE.PointLight(0xffdd88, 2, 800);
glowLight.position.set(0, 120, 120);
scene.add(glowLight);

// ---------- Text ----------
let textMesh;
let loader = new THREE.FontLoader();
loader.load(
    "https://threejs.org/examples/fonts/helvetiker_regular.typeface.json",
    function(font) {

        let textGeo = new THREE.TextGeometry("HAPPY BIRTHDAY PRINCE", {
            font: font,
            size: 18,
            height: 6,
            curveSegments: 14,
            bevelEnabled: true,
            bevelThickness: 2,
            bevelSize: 1.2,
            bevelSegments: 6
        });

        textGeo.center();

        let textMat = new THREE.MeshStandardMaterial({
            color: 0xffc93c,
            emissive: 0xffa722,
            metalness: 0.9,
            roughness: 0.15
        });

        textMesh = new THREE.Mesh(textGeo, textMat);
        textMesh.position.y = 0;
        scene.add(textMesh);
    }
);

// ---------- Camera Orbit ----------
let angle = 0;
function animate() {
    requestAnimationFrame(animate);

    // Rotate galaxy very slowly
    stars.rotation.y += 0.0004;

    // Camera rotation around scene
    angle += 0.0025;
    camera.position.x = Math.sin(angle) * 250;
    camera.position.z = Math.cos(angle) * 250;
    camera.lookAt(0, 0, 0);

    renderer.render(scene, camera);
}
animate();

// ---------- Resize ----------
window.addEventListener("resize", () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
});
</script>

</body>
</html>
