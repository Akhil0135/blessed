<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>IMAX – HAPPY BIRTHDAY PRINCE</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  body { margin:0; overflow:hidden; background:#000; }
  canvas { display:block; }
</style>
</head>
<body>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/examples/js/loaders/FontLoader.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/examples/js/geometries/TextGeometry.js"></script>

<script>
// ---------------- Scene + Camera ----------------
let scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x000000, 0.0012);

let camera = new THREE.PerspectiveCamera(60, window.innerWidth/window.innerHeight, 0.1, 3000);
camera.position.set(0, 50, 400);

let renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(window.devicePixelRatio);
document.body.appendChild(renderer.domElement);

// ---------------- Lights ----------------
let ambient = new THREE.AmbientLight(0x666666, 0.5);
scene.add(ambient);

let keyLight = new THREE.PointLight(0x99ccff, 2, 2000);
keyLight.position.set(180, 200, 140);
scene.add(keyLight);

let warmLight = new THREE.PointLight(0xffddaa, 1.8, 2000);
warmLight.position.set(-120, 160, -80);
scene.add(warmLight);

// ---------------- Text ----------------
let princeLetters = [];
let birthdayMesh=null, oneMesh=null;
const princeText = "PRINCE";
let loadedFont=null;

// ---------------- Load Font ----------------
new THREE.FontLoader().load(
    "https://threejs.org/examples/fonts/helvetiker_bold.typeface.json",
    font => {
        loadedFont = font;

        // Background "1"
        let oneGeo = new THREE.TextGeometry("1",{
            font: font,
            size: 120,
            height: 10,
            bevelEnabled:true,
            bevelThickness:5,
            bevelSize:3
        });
        oneGeo.center();
        let oneMat = new THREE.MeshStandardMaterial({
            color:0x3399ff,
            emissive:0x112244,
            metalness:0.5,
            roughness:0.6
        });
        oneMesh = new THREE.Mesh(oneGeo, oneMat);
        oneMesh.position.y = 180;
        oneMesh.position.z = -50;
        scene.add(oneMesh);

        // HAPPY BIRTHDAY
        let birthdayGeo = new THREE.TextGeometry("HAPPY BIRTHDAY",{
            font: font,
            size: 36,
            height: 6,
            bevelEnabled:true,
            bevelThickness:3,
            bevelSize:1.5
        });
        birthdayGeo.center();
        let birthdayMat = new THREE.MeshStandardMaterial({
            color:0xffd98c,
            emissive:0xffaa33,
            metalness:0.8,
            roughness:0.35
        });
        birthdayMesh = new THREE.Mesh(birthdayGeo, birthdayMat);
        birthdayMesh.position.y = 180; 
        scene.add(birthdayMesh);

        // PRINCE letters
        createPrinceLetters();
        setTimeout(revealNextLetter, 800);
    }
);

// ---------------- Create letters with proper spacing ----------------
function createPrinceLetters(){
    const total = princeText.length;
    const size = 180; // reduced to fit screen
    const height = 15;
    const meshes = [];

    // Measure width of each letter
    let totalWidth = 0;
    let letterWidths = [];

    for(let i=0;i<total;i++){
        let geo = new THREE.TextGeometry(princeText[i],{
            font: loadedFont,
            size: size,
            height: height,
            bevelEnabled:true,
            bevelThickness:5,
            bevelSize:3
        });
        geo.computeBoundingBox();
        let w = geo.boundingBox.max.x - geo.boundingBox.min.x;
        letterWidths.push(w);
        totalWidth += w;
    }

    // Add small spacing between letters
    const spacing = 15; 
    totalWidth += spacing * (total - 1);
    let xOffset = -totalWidth/2;

    for(let i=0;i<total;i++){
        let geo = new THREE.TextGeometry(princeText[i],{
            font: loadedFont,
            size: size,
            height: height,
            bevelEnabled:true,
            bevelThickness:5,
            bevelSize:3
        });
        geo.center();
        let mesh = new THREE.Mesh(geo, new THREE.MeshStandardMaterial({color:0xffffff}));
        mesh.position.y = 0;
        mesh.position.x = xOffset + letterWidths[i]/2;
        mesh.position.z = -800;
        mesh.scale.set(0.1,0.1,0.1); 
        mesh.rotation.x = (Math.random()-0.5)*0.3; 
        mesh.rotation.y = (Math.random()-0.5)*0.3;
        mesh.visible = false;
        princeLetters.push(mesh);
        scene.add(mesh);
        xOffset += letterWidths[i] + spacing;
    }
}

// ---------------- Animate letters ----------------
let currentLetter = 0;
function revealNextLetter(){
    if(currentLetter < princeLetters.length){
        let mesh = princeLetters[currentLetter];
        mesh.visible = true;
        let finalZ = 0;
        let duration = 120;
        let frame = 0;

        function animateLetter(){
            if(frame <= duration){
                let t = frame/duration;
                let overshoot = 1 + 0.2*Math.sin(t*Math.PI);
                mesh.position.z = -800*(1-t) + finalZ*t;
                mesh.scale.set((0.1 + 0.9*t)*overshoot,(0.1 + 0.9*t)*overshoot,(0.1 + 0.9*t)*overshoot);
                frame++;
                requestAnimationFrame(animateLetter);
            }
        }
        animateLetter();
        currentLetter++;
        setTimeout(revealNextLetter, 350);
    }
}

// ---------------- Animate ----------------
let angle=0;
function animate(){
    requestAnimationFrame(animate);
    angle += 0.0012;
    camera.position.x = Math.sin(angle)*400;
    camera.position.z = Math.cos(angle)*400;
    camera.lookAt(0,50,0);
    renderer.render(scene,camera);
}
animate();

// ---------------- Responsive ----------------
window.addEventListener("resize",()=>{
    camera.aspect = window.innerWidth/window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
});
</script>

</body>
</html>
