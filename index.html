<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Phase 1 – IMAX Nolan Night</title>

<!-- Ben-Hur Style Cinematic Font -->
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&display=swap" rel="stylesheet">

<style>
    body {
        margin: 0;
        overflow: hidden;
        background: radial-gradient(ellipse at center, #04040E 0%, #000000 85%);
        height: 100vh;
        font-family: "Cinzel", serif;
    }

    /* IMAX twinkling stars */
    .star {
        position: absolute;
        width: 2px;
        height: 2px;
        background: white;
        border-radius: 50%;
        opacity: 0.3;
        animation: twinkle 2.2s infinite ease-in-out alternate;
    }

    @keyframes twinkle {
        from { opacity: 0.15; transform: scale(1); }
        to   { opacity: 1;   transform: scale(1.7); }
    }

    /* Moon */
    #moon {
        position: absolute;
        top: 40px;
        left: 40px;
        width: 130px;
        height: 130px;
        background: radial-gradient(circle at 30% 30%, #FFFFFF, #D8D8D8 40%, #9B9B9B 70%, #4B4B4B 100%);
        border-radius: 50%;
        box-shadow: 0 0 45px rgba(255,255,255,0.35);
        cursor: grab;
        transition: box-shadow 0.3s ease;
    }

    /* Text Reveal */
    #message {
        position: absolute;
        bottom: 70px;
        width: 100%;
        text-align: center;
        font-size: 32px;
        font-weight: 600;
        opacity: 0;
        letter-spacing: 1.5px;
        color: #F5F2E9;
        text-shadow: 0 0 18px rgba(255,255,255,0.7), 0 0 40px rgba(200,200,255,0.4);
        transition: opacity 0.1s linear;
        white-space: nowrap;
    }
</style>
</head>
<body>

<div id="moon"></div>

<div id="message">
On this calm birthday eve so new, God softly whispers, my plans are made for you.
</div>

<script>
/* ------------------ STARS ------------------ */
for (let i = 0; i < 170; i++) {
    let s = document.createElement("div");
    s.className = "star";
    s.style.left = Math.random() * window.innerWidth + "px";
    s.style.top = Math.random() * window.innerHeight + "px";
    s.style.animationDelay = (Math.random() * 2) + "s";
    document.body.appendChild(s);
}

/* ------------------ MOON DRAG ------------------ */
const moon = document.getElementById("moon");
const message = document.getElementById("message");

let isDragging = false;
let offsetX = 0;

moon.addEventListener("mousedown", e => {
    isDragging = true;
    offsetX = e.clientX - moon.offsetLeft;
    moon.style.cursor = "grabbing";
});

document.addEventListener("mouseup", () => {
    isDragging = false;
    moon.style.cursor = "grab";
});

document.addEventListener("mousemove", e => {
    if (!isDragging) return;

    let newX = e.clientX - offsetX;

    const minX = 20;
    const maxX = window.innerWidth - 150;

    if (newX < minX) newX = minX;
    if (newX > maxX) newX = maxX;

    moon.style.left = newX + "px";

    /* Parallel text reveal */
    let progress = (newX - minX) / (maxX - minX);  // 0 to 1 scale
    message.style.opacity = progress * 1.1;        // Smooth IMAX fade
});
</script>

</body>
</html>
