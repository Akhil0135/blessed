<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>IMAX Nolan Sunrise — Akhil Sir</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&family=IM+Fell+English+SC&display=swap" rel="stylesheet">
<style>
:root{
  --night-black:#000000;
  --night-deep:#001122;
  --day-blue:#0b3d91;
  --gold:#ffd46b;
}

/* BASE */
html, body{
  margin:0;
  height:100%;
  background:var(--night-black);
  font-family:"Cinzel", serif;
  overflow:hidden;
  color:var(--gold);
  transition:background 2s ease-in-out;
}

/* STAGE */
#stage{
  position:relative;
  width:100%;
  height:100%;
  perspective:1600px;
  overflow:hidden;
}

/* STARS */
.star{
  position:absolute;
  width:2px;
  height:2px;
  border-radius:50%;
  background:white;
  opacity:0.2;
  animation:twinkle 3s infinite alternate ease-in-out;
  filter:blur(0.3px);
}
.star.depth2{opacity:0.5; animation:twinkle2 3.8s infinite alternate;}
.star.depth3{opacity:0.8; animation:twinkle3 4.2s infinite alternate;}
@keyframes twinkle{0%{opacity:0.05;}100%{opacity:0.25;}}
@keyframes twinkle2{0%{opacity:0.2;}100%{opacity:0.6;}}
@keyframes twinkle3{0%{opacity:0.3;}100%{opacity:1;}}

/* CLOUDS */
.cloud{
  position:absolute;
  background:rgba(255,255,255,0.06);
  border-radius:50%;
  filter:blur(16px);
  pointer-events:none;
}
.cloud.layer1{width:500px;height:120px;top:15%;left:-600px;animation:cloudMove 120s linear infinite;}
.cloud.layer2{width:650px;height:150px;top:35%;left:-700px;animation:cloudMove 150s linear infinite;opacity:0.08;}
.cloud.layer3{width:800px;height:200px;top:55%;left:-800px;animation:cloudMove 180s linear infinite;opacity:0.06;}
.cloud.layer4{width:1000px;height:250px;top:70%;left:-1000px;animation:cloudMove 200s linear infinite;opacity:0.04;}
@keyframes cloudMove{0%{transform:translateX(0);}100%{transform:translateX(120vw);}}

/* FOG */
.fog{
  position:absolute;
  width:200vw;
  height:200px;
  top:50%;
  left:-50%;
  background:radial-gradient(circle, rgba(255,255,255,0.02), transparent 80%);
  border-radius:50%;
  filter:blur(60px);
  animation:fogDrift linear infinite;
  pointer-events:none;
}
.fog.layer1{top:60%;animation-duration:160s;}
.fog.layer2{top:50%;animation-duration:200s;opacity:0.06;}
.fog.layer3{top:40%;animation-duration:240s;opacity:0.04;}
@keyframes fogDrift{0%{transform:translateX(0);}100%{transform:translateX(120vw);}}

/* LIGHT BEAMS */
.light-beam{
  position:absolute;
  width:15px;
  height:800px;
  background:linear-gradient(to bottom, rgba(255,235,180,0.15), transparent 70%);
  top:-200px;
  left:50%;
  transform:translateX(-50%) rotate(0deg);
  filter:blur(24px);
  opacity:0;
  pointer-events:none;
  animation:beamRotate 40s linear infinite;
  z-index:5;
}
.light-beam.layer1{animation-duration:45s;}
.light-beam.layer2{animation-duration:50s;opacity:0.12;}
.light-beam.layer3{animation-duration:60s;opacity:0.08;}
@keyframes beamRotate{0%{transform:translateX(-50%) rotate(0deg);}100%{transform:translateX(-50%) rotate(360deg);}}

/* DUST PARTICLES */
.dust{
  position:absolute;
  width:2px;
  height:2px;
  background:rgba(255,235,180,0.12);
  border-radius:50%;
  filter:blur(1px);
  pointer-events:none;
  opacity:0;
}

/* MOON */
#moon{
  position:absolute;
  width:180px;
  height:180px;
  border-radius:50%;
  background:radial-gradient(circle at 40% 34%, #ffffff, #000000 80%);
  top:28%;
  left:10%;
  box-shadow:0 0 80px rgba(255,245,200,0.2);
  cursor:grab;
  transform:translate(-50%,-50%);
  transition:opacity 0.25s linear;
}
#moon:active{cursor:grabbing;}
#moon .flare{
  position:absolute;
  inset:-50px;
  border-radius:50%;
  background:radial-gradient(circle, rgba(255,240,200,0.1), transparent 70%);
  filter:blur(60px);
}

/* SUN */
#sun{
  position:absolute;
  width:360px;
  height:360px;
  border-radius:50%;
  top:-200px;
  right:-200px;
  opacity:0;
  pointer-events:none;
  background:radial-gradient(circle at 38% 34%,
      #fffbe8 0%,
      #ffe79c 14%,
      #ffbe55 38%,
      #ff8e2d 58%,
      rgba(180,60,10,0.4) 80%,
      rgba(150,40,0,0) 100%);
  box-shadow:0 0 230px 50px rgba(255,180,80,0.14),
             0 0 480px 120px rgba(255,150,60,0.08);
  transition:opacity 1.4s ease-in-out, top 2.1s ease-out, right 2.1s ease-out;
}

/* MESSAGE */
#message{
  position:absolute;
  bottom:6%;
  left:50%;
  transform:translateX(-50%);
  white-space:nowrap;
  font-size:19px;
  letter-spacing:3px;
  font-family:"IM Fell English SC", serif;
  color:white;
  opacity:0;
  transition:color 2s ease-out, opacity 2s ease-out;
}
.letter{
  display:inline-block;
  opacity:0;
  transform:translateY(10px);
  transition:opacity .12s ease, transform .12s ease;
}
</style>
</head>
<body>
<div id="stage">
  <div id="stars"></div>
  <div class="cloud layer1"></div>
  <div class="cloud layer2"></div>
  <div class="cloud layer3"></div>
  <div class="cloud layer4"></div>
  <div class="fog layer1"></div>
  <div class="fog layer2"></div>
  <div class="fog layer3"></div>
  <div class="light-beam layer1"></div>
  <div class="light-beam layer2"></div>
  <div class="light-beam layer3"></div>
  <div id="moon"><div class="flare"></div></div>
  <div id="sun"></div>
  <div id="message"></div>
</div>

<script>
const fullText = "ON THIS CALM BIRTHDAY EVE SO NEW, GOD SOFTLY WHISPERS, MY PLANS ARE MADE FOR YOU.";
const moon=document.getElementById("moon");
const sun=document.getElementById("sun");
const starsWrap=document.getElementById("stars");
const message=document.getElementById("message");
const beams=document.querySelectorAll(".light-beam");

let dragging=false;
let lastX=0;
let progress=0;
let mouseX=0;
let mouseY=0;

/* STARS */
for(let i=0;i<170;i++){
  const s=document.createElement("div");
  let depth=Math.random();
  s.className=depth<0.33?"star":"star depth2";
  s.style.left=Math.random()*100+"%";
  s.style.top=Math.random()*80+"%";
  starsWrap.appendChild(s);
}

/* MESSAGE LETTERS */
const letters=[];
for(let i=0;i<fullText.length;i++){
  const L=document.createElement("span");
  L.className="letter";
  L.textContent = fullText[i]===" "?"\u00A0":fullText[i];
  message.appendChild(L);
  letters.push(L);
}

/* DUST PARTICLES */
const dustParticles=[];
for(let i=0;i<60;i++){
  const d=document.createElement("div");
  d.className="dust";
  d.style.left=Math.random()*100+"%";
  d.style.top=(40 + Math.random()*60)+"%";
  document.getElementById("stage").appendChild(d);
  dustParticles.push(d);
}

/* DRAG LOGIC */
moon.addEventListener("pointerdown", e=>{
  dragging=true;
  lastX=e.clientX;
});
document.addEventListener("pointerup", ()=>dragging=false);
document.addEventListener("pointermove", e=>{
  if(!dragging) return;
  let dx=e.clientX-lastX;
  lastX=e.clientX;
  if(dx<=0) return;
  progress+=dx*0.0025;
  if(progress>1) progress=1;
  update(progress);
});

/* MOUSE MOVE PARALLAX */
document.addEventListener("mousemove", e=>{
  mouseX = (e.clientX/window.innerWidth - 0.5) * 40; // rotate max ±20deg
  mouseY = (e.clientY/window.innerHeight - 0.5) * 20; // tilt max ±10deg
  beams.forEach((b,i)=>{
    b.style.transform = `translateX(-50%) rotate(${mouseX + i*15}deg) skewY(${mouseY}deg)`;
  });
});

/* UPDATE SCENE */
function update(t){
  // Moon fade and move
  moon.style.opacity=1-t;
  moon.style.left=(10 + t*50)+"%";

  // Background
  if(t<0.4){
    document.body.style.background="linear-gradient(to bottom, #000000 0%, #001122 100%)";
  } else {
    document.body.style.background="linear-gradient(to bottom, #001637 0%, #0b3d91 100%)";
  }

  // Sun appear
  sun.style.opacity=t;
  if(t>0.7){ sun.style.top="40px"; sun.style.right="40px"; }

  // Stars fade
  [...starsWrap.children].forEach(s=>{
    s.style.opacity=Math.max(0, 0.3*(1-t*1.2));
  });

  // Clouds fade softly
  document.querySelectorAll(".cloud").forEach(c=>{
    c.style.opacity=Math.max(0.01, 0.08*(1-t*1.2));
  });

  // Fog drift effect
  document.querySelectorAll(".fog").forEach((f,i)=>{
    f.style.left=`${-50 + t*120 + i*5}vw`;
  });

  // Light beams appear
  beams.forEach((b,i)=>{
    if(t>0.6){ 
      b.style.opacity=0.05 + i*0.02 + t*0.2; 
    } else {
      b.style.opacity=0;
    }
  });

  // Dust particles float in beams
  dustParticles.forEach(d=>{
    if(t>0.6){
      d.style.opacity=0.02 + Math.random()*0.05;
      d.style.top=parseFloat(d.style.top) - 0.15 + "%";
      if(parseFloat(d.style.top)<10) d.style.top=80 + "%";
    } else d.style.opacity=0;
  });

  // Message reveal
  let show=Math.floor(t*letters.length);
  for(let i=0;i<letters.length;i++){
    if(i<show){ letters[i].style.opacity=1; letters[i].style.transform="translateY(0)"; }
  }
  if(t>0.7){ message.style.color="var(--gold)"; message.style.opacity=1; }
}
</script>
</body>
</html>
