<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Cinematic Birthday Eve — "On this calm birthday eve so new"</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&display=swap');

  /* Base */
  html,body{height:100%;margin:0;background:linear-gradient(to top,#030416 0%,#07122b 45%,#0b1833 100%);overflow:hidden}
  body{font-family:Georgia, 'Times New Roman', serif;color:#fff}

  /* STAR FIELD */
  .star{position:absolute;width:2px;height:2px;border-radius:50%;background:#fff;box-shadow:0 0 6px rgba(255,255,255,0.6);opacity:0.9;animation:tw 2.5s infinite alternate}
  @keyframes tw{0%{opacity:0.25;transform:scale(1)}50%{opacity:1;transform:scale(1.6)}100%{opacity:0.25;transform:scale(1)}}

  /* MOON (reduced glow) */
  .moon{position:absolute;width:140px;height:140px;border-radius:50%;background:radial-gradient(circle,#fffbe0 0%,#efe0a0 60%,#d7c07a 100%);top:40px;left:-240px;box-shadow:0 0 12px 3px rgba(255,245,200,0.45);z-index:40;animation:moonMove 70s linear infinite}
  @keyframes moonMove{0%{left:-240px;top:60px}50%{left:45%;top:80px}100%{left:115%;top:60px}}

  /* AURORA (waving) */
  .aurora{position:absolute;top:0;left:0;width:200%;height:45vh;background:linear-gradient(120deg,rgba(0,210,140,0.12),rgba(110,20,255,0.10),rgba(0,150,255,0.08));filter:blur(48px);opacity:0.28;z-index:10;animation:auroraX 16s ease-in-out infinite alternate,auroraWave 6s ease-in-out infinite}
  @keyframes auroraX{0%{transform:translateX(-6%)}100%{transform:translateX(6%)}}
  @keyframes auroraWave{0%{transform:translateY(0)}50%{transform:translateY(18px)}100%{transform:translateY(0)}}

  /* HORIZON GLOW */
  .horizon{position:absolute;left:0;right:0;bottom:0;height:18vh;background:linear-gradient(180deg,rgba(10,20,40,0) 0%,rgba(4,8,20,0.35) 60%,rgba(6,10,25,0.6)100%);z-index:5}

  /* ORIGINAL CINEMATIC CLOUDS (large soft shapes) */
  .cloud{position:absolute;width:360px;height:140px;background:rgba(255,255,255,0.06);border-radius:50%;filter:blur(24px);box-shadow:0 0 30px rgba(255,255,255,0.04);animation:morph 8s ease-in-out infinite;opacity:1}
  .cloud::before,.cloud::after{content:"";position:absolute;background:rgba(255,255,255,0.06);width:220px;height:110px;border-radius:50%;filter:blur(24px)}
  .cloud::before{left:60px;top:-34px}.cloud::after{left:160px;top:18px}
  @keyframes morph{0%{transform:scale(1)}50%{transform:scale(1.08,0.94)}100%{transform:scale(1)}}

  /* CLOUD LAYERS (parallax) */
  .cloud.layer-back{z-index:12;opacity:0.55}
  .cloud.layer-mid{z-index:28;opacity:0.85}
  .cloud.layer-front{z-index:48;opacity:1}

  /* MOVING CLOUDS keyframe dynamic applied inline via JS for different durations */

  /* MIST (rolling subtle fog) */
  .mist{position:absolute;left:-8%;width:116%;height:220px;bottom:0;background:radial-gradient(circle at 50% 40%,rgba(255,255,255,0.06)0%,rgba(255,255,255,0)55%);filter:blur(26px);z-index:22;opacity:0.85;animation:mistMove 20s linear infinite}
  @keyframes mistMove{0%{transform:translateX(0)}100%{transform:translateX(80px)}}

  /* SHOOTING STARS */
  .shoot{position:absolute;width:10px;height:3px;border-radius:50%;background:linear-gradient(0deg,rgba(255,255,255,0)0%,#fff 100%);transform-origin:top left;filter:drop-shadow(0 0 6px rgba(255,255,255,0.6));z-index:60}

  /* MESSAGE (SERIF chosen) */
  .messageWrap{position:absolute;left:50%;top:48%;transform:translate(-50%,-50%);z-index:70;pointer-events:none}
  .messageLine{font-family:'Playfair Display', Georgia, serif;color:#fff;font-size:36px;letter-spacing:0.6px;line-height:1.3;opacity:0;transform:translateY(8px);text-align:center;max-width:88vw;text-shadow:0 0 12px rgba(255,255,255,0.65);}
  .messageLine.revealed{opacity:1;transform:translateY(0);transition:opacity 1.2s ease,transform 1.2s ease}

  /* small pulse for final word */
  .messageStrong{display:inline-block;color:#fff;font-weight:700;text-shadow:0 0 18px rgba(0,255,200,0.9)}

  /* subtle vignette */
  .vignette{position:fixed;inset:0;pointer-events:none;background:radial-gradient(ellipse at center,rgba(0,0,0,0)40%,rgba(0,0,0,0.35)85%);z-index:120}

  /* Responsive tweak */
  @media (max-width:600px){.messageLine{font-size:20px}}


/* Aurora Shimmer Reveal */
.text-container {
  position: absolute;
  top: 45%;
  width: 100%;
  text-align: center;
  opacity: 0;
  animation: shimmerReveal 6s ease forwards;
}
.text-container .line {
  display: block;
  font-family: "Georgia", serif;
  font-size: 32px;
  letter-spacing: 1.5px;
  color: #fff4d6;
  text-shadow: 0 0 8px rgba(255,240,200,0.4), 0 0 20px rgba(255,240,200,0.2);
}
@keyframes shimmerReveal {
  0% { opacity: 0; filter: blur(8px); }
  30% { opacity: 1; filter: blur(3px); }
  55% { text-shadow: 0 0 20px rgba(180,255,255,0.7), 0 0 40px rgba(120,200,255,0.4); }
  80% { opacity: 1; filter: blur(0px); }
  100% { opacity: 1; }
}

</style>
</head>
<body>

<div class="aurora"></div>
<div class="moon" aria-hidden="true"></div>

<!-- Clouds will be injected by JS with parallax layers -->
<div id="cloudRoot"></div>

<div class="mist" aria-hidden="true"></div>

<div class="messageWrap" aria-hidden="false">
  <div id="line1" class="messageLine">On this calm birthday eve so new,</div>
  <div id="line2" class="messageLine">God softly whispers, <span class="messageStrong">‘My plans are made for you.’</span></div>
</div>

<div class="vignette"></div>

<script>
// Create stars with twinkle variability
const STAR_COUNT = 220;
for(let i=0;i<STAR_COUNT;i++){
  const s = document.createElement('div');
  s.className='star';
  s.style.left = Math.random()*100 + 'vw';
  s.style.top = Math.random()*100 + 'vh';
  const size = Math.random()*2+0.6;
  s.style.width = s.style.height = size + 'px';
  s.style.animationDuration = (2 + Math.random()*2.5) + 's';
  s.style.opacity = 0.45 + Math.random()*0.6;
  document.body.appendChild(s);
}

// CLOUD GENERATION: restore original cinematic clouds across parallax layers
const cloudRoot = document.getElementById('cloudRoot');
const layers = [
  {class:'layer-back',count:3,minTop:30,maxTop:130,durBase:80,opacity:0.5},
  {class:'layer-mid',count:3,minTop:90,maxTop:220,durBase:60,opacity:0.8},
  {class:'layer-front',count:3,minTop:160,maxTop:320,durBase:40,opacity:1}
];

layers.forEach(layer=>{
  for(let i=0;i<layer.count;i++){
    const c = document.createElement('div');
    c.className = 'cloud '+layer.class;
    c.style.top = (Math.random()*(layer.maxTop-layer.minTop)+layer.minTop)+'px';
    c.style.opacity = layer.opacity;
    const duration = layer.durBase + Math.random()*30;
    // set individual move keyframes via inline animation to create different speeds
    c.style.animation = `moveCloud ${duration}s linear infinite, morph ${6 + Math.random()*4}s ease-in-out infinite`;
    // stagger starting position
    c.style.left = (-200 - Math.random()*800) + 'px';
    cloudRoot.appendChild(c);
  }
});

// Inject dynamic keyframes for moveCloud so each cloud uses page width
const dynStyle = document.createElement('style');
const vw = Math.max(document.documentElement.clientWidth || 0, window.innerWidth || 0);
const fromX = -700; const toX = vw + 200;
dynStyle.innerHTML = `@keyframes moveCloud { 0%{transform:translateX(${fromX}px)} 100%{transform:translateX(${toX}px)} }`;
document.head.appendChild(dynStyle);

// Slight moon parallax (subtle scale) using JS for natural movement
const moon = document.querySelector('.moon');
let t0 = performance.now();
function moonParallax(){
  const t = (performance.now()-t0)/1000;
  const sx = 1 + Math.sin(t*0.02)*0.002; // tiny scale
  const sy = 1 + Math.cos(t*0.018)*0.002;
  moon.style.transform = `scale(${sx},${sy})`;
  requestAnimationFrame(moonParallax);
}
moonParallax();

// Shooting stars: increased, with random start offsets and trails
function spawnShootingStar(){
  const s = document.createElement('div');
  s.className='shoot';
  const startY = Math.random()*180; // px from top
  s.style.top = startY + 'px';
  s.style.left = window.innerWidth + 'px';
  const dur = 1.2 + Math.random()*1.6;
  s.style.transition = `transform ${dur}s linear, opacity ${dur}s linear`;
  document.body.appendChild(s);
  // force reflow
  void s.offsetWidth;
  s.style.opacity = '1';
  s.style.transform = `translate(-${(60 + Math.random()*140)}vw, ${40 + Math.random()*80}vh) rotate(-45deg)`;
  setTimeout(()=>{ s.style.opacity='0' }, dur*650);
  setTimeout(()=> s.remove(), dur*1100);
}
// spawn multiple intervals to feel organic
setInterval(spawnShootingStar, 1200);
setInterval(spawnShootingStar, 2000);
setInterval(spawnShootingStar, 2800);

// Rolling mist already present as .mist — subtle vertical motion handled by CSS

// Message reveal with glow and slight float
const line1 = document.getElementById('line1');
const line2 = document.getElementById('line2');
function revealMessage(){
  line1.classList.add('revealed');
  setTimeout(()=> line2.classList.add('revealed'), 700);
  // small gentle float loop on the messageWrap
  const mw = document.querySelector('.messageWrap');
  let dir = 1;
  setInterval(()=>{
    mw.style.transform = `translate(-50%,-50%) translateY(${dir * 2}px)`;
    dir = -dir;
  }, 2200);
}
setTimeout(revealMessage, 1800);

// subtle responsiveness: reposition clouds on resize
window.addEventListener('resize', ()=>{
  const newVW = Math.max(document.documentElement.clientWidth || 0, window.innerWidth || 0);
  dynStyle.innerHTML = `@keyframes moveCloud { 0%{transform:translateX(${fromX}px)} 100%{transform:translateX(${newVW+200}px)} }`;
});

</script>
</body>
</html>
