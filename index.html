<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>IMAX Nolan Cinematic Scene</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700&display=swap" rel="stylesheet">
<style>
html,body{
  margin:0;
  padding:0;
  height:100%;
  overflow:hidden;
  background:black;
  font-family:"Cinzel", serif;
}
#scene{
  position:absolute;top:0;left:0;width:100%;height:100%;
  background:linear-gradient(to top, #020202, #03030a, #08081f);
  overflow:hidden;
}

/* --------------------- SUN ---------------------- */
#sun{
  position:absolute;
  top:55%;
  left:50%;
  width:260px;
  height:260px;
  background:radial-gradient(circle, #ffefbb, #ffcb55, #da8b1a 75%);
  border-radius:50%;
  transform:translate(-50%, -50%);
  opacity:0;
  filter:brightness(1.7) blur(2px);
  transition:opacity 2s ease;
  z-index:20;
}

/* --------------------- CROSS (IMAX / NOLAN STYLE) ---------------------- */
#cross {
  position:absolute;
  top:13%;      
  left:50%;
  width:5px;
  height:200px;
  background:rgba(255,255,255,0.92);
  border-radius:2px;
  transform:translateX(-50%) scale(0.7);
  opacity:0;
  transition:opacity 2s ease, transform 2s ease;
  z-index:99999;
  filter:
    drop-shadow(0 0 18px rgba(255,255,255,0.8))
    drop-shadow(0 0 40px rgba(255,255,255,0.7));
}

#cross::before {
  content:"";
  position:absolute;
  left:50%;
  top:38%;
  width:110px;
  height:5px;
  background:rgba(255,255,255,0.92);
  border-radius:2px;
  transform:translateX(-50%);
  filter:drop-shadow(0 0 15px rgba(255,255,255,0.75));
}

/* ---------------- MESSAGE ------------------ */
#msg{
  position:absolute;
  top:70%;
  left:50%;
  transform:translate(-50%, -50%);
  color:white;
  font-size:28px;
  letter-spacing:2px;
  opacity:0;
  text-align:center;
  width:90%;
  transition:opacity 2.5s ease;
}

/* ------------ CLICK BUTTON ------------- */
#clickBtn{
  position:absolute;
  top:82%;
  left:50%;
  transform:translateX(-50%);
  padding:14px 28px;
  background:rgba(255,255,255,0.1);
  border:1px solid rgba(255,255,255,0.3);
  border-radius:12px;
  color:white;
  font-size:22px;
  letter-spacing:1px;
  cursor:pointer;
  opacity:0;
  transition:opacity 1.5s ease;
  backdrop-filter:blur(6px);
}

/* ------------ BIRTHDAY OVERLAY ------------ */
#birthdayOverlay{
  position:absolute;
  top:0;left:0;width:100%;height:100%;
  background:linear-gradient(to top, rgba(0,0,0,0.8), rgba(0,0,0,0.05));
  opacity:0;
  transition:opacity 2s ease;
  z-index:9000;
}

#happy{
  position:absolute;
  top:50%;
  left:50%;
  transform:translate(-50%, -50%) scale(0.9);
  color:white;
  font-size:38px;
  letter-spacing:3px;
  opacity:0;
  transition:opacity 2.2s ease, transform 2.2s ease;
}

/* FINAL BIRTHDAY MESSAGE */
#birthdayFinalMessage{
  position:absolute;
  top:70%;
  left:50%;
  transform:translate(-50%, -50%) scale(0.85);
  color:white;
  font-size:32px;
  opacity:0;
  text-align:center;
  width:90%;
  transition:opacity 2.5s ease, transform 2.5s ease;
}

/* FIREWORKS */
.firework{
  position:absolute;
  width:6px;
  height:6px;
  background:white;
  border-radius:50%;
  opacity:0.9;
}
</style>
</head>

<body>

<div id="scene"></div>
<div id="sun"></div>
<div id="cross"></div>

<div id="msg">A New Dawn Begins…</div>
<div id="clickBtn">Click here</div>

<div id="birthdayOverlay"></div>
<div id="happy">HAPPY BIRTHDAY</div>
<div id="birthdayFinalMessage">May God bless you always.</div>

<script>
/* ------------------ SCENE START -------------------- */
setTimeout(()=>{ document.getElementById("sun").style.opacity = 1; }, 1500);
setTimeout(()=>{ document.getElementById("msg").style.opacity = 1; }, 3000);
setTimeout(()=>{ document.getElementById("clickBtn").style.opacity = 1; }, 5000);


/* ------------------ CLICK PHASE LOGIC ------------------ */
let clickStage = 0;

document.getElementById("clickBtn").onclick = () => {

  if(clickStage === 0){
    // Hide button
    clickBtn.style.opacity = 0;

    // Reveal Cross
    setTimeout(()=>{
      const cross = document.getElementById("cross");
      cross.style.opacity = 1;
      cross.style.transform = "translateX(-50%) scale(1)";
    }, 700);

    // DIM THE SUN for IMAX contrast
    setTimeout(()=>{
      document.getElementById("sun").style.filter = "brightness(0.35) blur(2px)";
    }, 1000);

    // Birthday overlay
    setTimeout(()=>{ birthdayOverlay.style.opacity = 1; }, 1700);

    setTimeout(()=>{
      happy.style.opacity = 1;
      happy.style.transform = "translate(-50%, -50%) scale(1)";
    }, 2600);

    // Re-enable button for second click
    setTimeout(()=>{
      clickBtn.innerText = "Click here";
      clickBtn.style.opacity = 1;
      clickBtn.style.pointerEvents = "auto";
    }, 3600);

    clickStage = 1;
  }

  else if(clickStage === 1){
    clickBtn.style.opacity = 0;

    setTimeout(()=>{
      birthdayFinalMessage.style.opacity = 1;
      birthdayFinalMessage.style.transform = "translate(-50%, -50%) scale(1)";
    }, 600);

    clickStage = 2;
  }
};


/* ------------------ FIREWORKS ---------------------- */
function spawnFireworks(){
  const f = document.createElement("div");
  f.className = "firework";
  document.body.appendChild(f);

  let x = Math.random()*window.innerWidth;
  let y = Math.random()*window.innerHeight*0.6;

  f.style.left = x + "px";
  f.style.top = y + "px";

  setTimeout(()=>{ f.remove(); }, 1200);
}

setInterval(spawnFireworks, 1400);
</script>

</body>
</html>
