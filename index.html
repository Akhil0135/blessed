<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>IMAX Cinematic Full</title>
<style>
html, body {
    margin: 0;
    padding: 0;
    overflow: hidden;
    background: #000;
}
canvas { display: block; }

/* ---------------- Stage 1 ---------------- */
#stage1 { position: relative; width: 100%; height: 100%; }
#stage1 #instruction {
    position: absolute;
    top: 20px;
    width: 100%;
    text-align: center;
    font-size: 22px;
    color: #fff;
    text-shadow: 0 0 8px #000;
    opacity: 0.9;
    pointer-events: none;
    z-index: 5;
}
#stage1 #message {
    position: absolute;
    bottom: 80px;
    width: 100%;
    text-align: center;
    font-size: 26px;
    font-weight: 600;
    color: #ffd27f;
    letter-spacing: 2px;
    text-shadow: 0 0 5px #d9a441;
    opacity: 0;
    transition: opacity 1.5s ease;
    z-index: 5;
}
#stage1 #sun {
    position: absolute;
    width: 260px;
    height: 260px;
    border-radius: 50%;
    background: radial-gradient(circle, #fff7c0 0%, #ffcc33 40%, #d68b00 70%, #000 100%);
    box-shadow: 0 0 50px #ffb300;
    top: -300px;
    right: -300px;
    opacity: 0;
    transition: all 2.5s ease-in-out;
    z-index: 3;
}
#stage1 #moon {
    position: absolute;
    width: 200px;
    height: 200px;
    left: 40px;
    top: 40px;
    border-radius: 50%;
    cursor: grab;
    background: radial-gradient(circle at 30% 30%, 
        #d9d9d9 0%, 
        #c0c0c0 20%, 
        #9a9a9a 45%, 
        #6d6d6d 70%, 
        #2a2a2a 100%);
    box-shadow: 0 0 15px rgba(180,180,255,0.8), inset -20px -20px 40px rgba(0,0,0,0.5);
    transition: box-shadow 0.3s ease;
    z-index: 5;
}
#stage1 #ambient {
    position: absolute;
    width: 100%;
    height: 100%;
    background: radial-gradient(circle at 50% 70%, rgba(30,60,150,0.25), transparent 70%);
    pointer-events: none;
    z-index: 1;
}

/* ---------------- Stage 2 ---------------- */
#stage2 { display:none; position:absolute; width:100%; height:100%; top:0; left:0; }
#stage2 #clickStar {
    position: absolute;
    top: 20px;
    width: 100%;
    text-align: center;
    font-size: 22px;
    color: #fff;
    text-shadow: 0 0 8px #000;
    z-index: 5;
}
#stage2 #verse {
    position:absolute;
    top:60px;
    left:50%;
    transform:translateX(-50%) scale(0.2);
    font-size:32px;
    color:#ffe9a6;
    text-shadow:0 0 8px #fff2b3,0 0 15px #e6d37a;
    opacity:0;
    transition: all 1s ease-out;
    white-space:nowrap;
    pointer-events:none;
    z-index:5;
}

/* ---------------- Stage 3 ---------------- */
#stage3 { display:none; position:absolute; width:100%; height:100%; top:0; left:0; }
#stage3 #clickBtn {
    position: absolute;
    bottom: 40px;
    left: 50%;
    transform: translateX(-50%);
    padding: 15px 30px;
    font-size: 20px;
    font-weight: bold;
    background: linear-gradient(90deg, #ff0066, #ffcc00, #00ccff);
    border: none;
    border-radius: 10px;
    cursor: pointer;
    box-shadow: 0 0 20px rgba(255,255,255,0.6);
    color: #fff;
    opacity: 0;
    transition: opacity 1s ease;
    z-index: 1000;
}

/* ---------------- Phase 4 ---------------- */
canvas.threejs { display:block; }
</style>
</head>
<body>

<!-- Stage 1 -->
<div id="stage1">
    <div id="instruction">Drag the moon to the end</div>
    <canvas id="stars"></canvas>
    <div id="ambient"></div>
    <div id="moon"></div>
    <div id="sun"></div>
    <div id="message">ON THIS CALM BIRTHDAY EVE SO NEW, GOD SOFTLY WHISPERS, MY PLANS ARE MADE FOR YOU.</div>
    <audio id="whoosh" src="https://cdn.pixabay.com/download/audio/2021/09/16/audio_4f1c1c9f28.mp3?filename=woosh-14795.mp3"></audio>
</div>

<!-- Stage 2 -->
<div id="stage2">
    <canvas id="shieldCanvas"></canvas>
    <div id="clickStar">Click the star</div>
    <div id="verse">He counts the stars and calls them each by name — Psalm 147:4</div>
</div>

<!-- Stage 3 -->
<div id="stage3">
    <canvas id="c"></canvas>
    <button id="clickBtn">Click Here</button>
</div>

<!-- Phase 4 -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/examples/js/loaders/FontLoader.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/examples/js/geometries/TextGeometry.js"></script>

<script>
// ---------------- STAGE 1 SCRIPT ----------------
const stage1=document.getElementById("stage1");
const moon=document.getElementById("moon");
const message=document.getElementById("message");
const sun=document.getElementById("sun");
const whoosh=document.getElementById("whoosh");
const starsCanvas=document.getElementById("stars");
const starsCtx=starsCanvas.getContext("2d");

function resize1(){ starsCanvas.width=window.innerWidth; starsCanvas.height=window.innerHeight; }
resize1(); window.onresize=resize1;

let stars=[]; for(let i=0;i<250;i++){ stars.push({x:Math.random()*starsCanvas.width, y:Math.random()*starsCanvas.height, z:Math.random()*1.5+0.5, tw:Math.random()*0.02+0.005}); }

function drawStars(){ starsCtx.clearRect(0,0,starsCanvas.width,starsCanvas.height); stars.forEach(s=>{ let glow=(Math.sin(Date.now()*s.tw)+1)*0.5; starsCtx.fillStyle=`rgba(255,255,255,${glow})`; starsCtx.beginPath(); starsCtx.arc(s.x,s.y,s.z,0,Math.PI*2); starsCtx.fill(); }); }

let dragging=false, offsetX, offsetY, revealIndex=0;
const fullMsg=message.innerText; message.innerText="";

moon.addEventListener("mousedown", e=>{ dragging=true; offsetX=e.clientX-moon.offsetLeft; offsetY=e.clientY-moon.offsetTop; moon.style.cursor="grabbing"; whoosh.currentTime=0; whoosh.play(); });
document.addEventListener("mouseup", ()=>{ dragging=false; moon.style.cursor="grab"; });
document.addEventListener("mousemove", e=>{ 
    if(!dragging) return;
    moon.style.left=(e.clientX-offsetX)+"px"; moon.style.top=(e.clientY-offsetY)+"px";
    if(revealIndex<fullMsg.length){ message.style.opacity=1; message.innerText=fullMsg.substring(0,revealIndex++);}
    stars.forEach(s=>s.tw=0);
    if(revealIndex>=fullMsg.length){ moon.style.opacity=0;
        setTimeout(()=>{ sun.style.opacity=1; sun.style.top="40px"; sun.style.right="40px"; stars=[]; setTimeout(()=>{ startStage2(); },5000); },800);
    }
});

function animate1(){ drawStars(); requestAnimationFrame(animate1); }
animate1();

// ---------------- STAGE 2 SCRIPT ----------------
const stage2=document.getElementById("stage2");
const shieldCanvas=document.getElementById("shieldCanvas");
const shieldCtx=shieldCanvas.getContext("2d");
let width=window.innerWidth, height=window.innerHeight;
shieldCanvas.width=width; shieldCanvas.height=height;

let shieldX=width/2, shieldY=height/2;
let R=Math.min(width,height)/3;
let starSpin=false, starAngle=0;

const bgStars2=[]; for(let i=0;i<200;i++){ bgStars2.push({x:Math.random()*width,y:Math.random()*height,r:Math.random()*1.5+0.5,tw:Math.random()*0.02+0.005}); }

function drawShield(){ 
    shieldCtx.save();
    shieldCtx.translate(shieldX,shieldY);
    let g1=shieldCtx.createRadialGradient(0,0,R*0.2,0,0,R); g1.addColorStop(0,"#3c0000"); g1.addColorStop(1,"#7a0000"); shieldCtx.fillStyle=g1; shieldCtx.beginPath(); shieldCtx.arc(0,0,R,0,Math.PI*2); shieldCtx.fill();
    let g2=shieldCtx.createRadialGradient(0,0,R*0.1,0,0,R*0.75); g2.addColorStop(0,"#dadada"); g2.addColorStop(1,"#f5f5f5"); shieldCtx.fillStyle=g2; shieldCtx.beginPath(); shieldCtx.arc(0,0,R*0.75,0,Math.PI*2); shieldCtx.fill();
    let g3=shieldCtx.createRadialGradient(0,0,R*0.1,0,0,R*0.5); g3.addColorStop(0,"#4b0000"); g3.addColorStop(1,"#8c0000"); shieldCtx.fillStyle=g3; shieldCtx.beginPath(); shieldCtx.arc(0,0,R*0.5,0,Math.PI*2); shieldCtx.fill();
    let g4=shieldCtx.createRadialGradient(0,0,R*0.05,0,0,R*0.35); g4.addColorStop(0,"#b4c7e0"); g4.addColorStop(1,"#001933"); shieldCtx.fillStyle=g4; shieldCtx.beginPath(); shieldCtx.arc(0,0,R*0.35,0,Math.PI*2); shieldCtx.fill();
    shieldCtx.save(); if(starSpin) shieldCtx.rotate(starAngle);
    let starR=R*0.28; shieldCtx.beginPath(); for(let i=0;i<5;i++){ let o=(Math.PI*2/5)*i-Math.PI/2; let n=o+Math.PI/5; shieldCtx.lineTo(Math.cos(o)*starR,Math.sin(o)*starR); shieldCtx.lineTo(Math.cos(n)*starR*0.45,Math.sin(n)*starR*0.45);} shieldCtx.closePath();
    shieldCtx.shadowColor="rgba(255,255,255,0.25)"; shieldCtx.shadowBlur=5;
    let sg=shieldCtx.createRadialGradient(0,0,starR*0.1,0,0,starR); sg.addColorStop(0,"#ffffff"); sg.addColorStop(0.4,"#eeeeee"); sg.addColorStop(1,"#7a7a7a"); shieldCtx.fillStyle=sg; shieldCtx.fill();
    shieldCtx.restore(); shieldCtx.restore();
}

function animate2(){ 
    shieldCtx.fillStyle="#0a0d19"; shieldCtx.fillRect(0,0,width,height);
    bgStars2.forEach(s=>{ const glow=(Math.sin(Date.now()*s.tw)+1)*0.5; shieldCtx.fillStyle=`rgba(255,255,255,${glow})`; shieldCtx.beginPath(); shieldCtx.arc(s.x,s.y,s.r,0,Math.PI*2); shieldCtx.fill(); });
    drawShield();
    if(starSpin) starAngle+=0.035;
    requestAnimationFrame(animate2);
}

function startStage2(){ stage1.style.display="none"; stage2.style.display="block"; animate2(); }

const verseDiv=document.getElementById("verse");
shieldCanvas.addEventListener("click", e=>{
    const dx=e.clientX-shieldX; const dy=e.clientY-shieldY;
    if(Math.sqrt(dx*dx+dy*dy)<=R*0.28){
        starSpin=true;
        verseDiv.style.opacity=1;
        verseDiv.style.transform="translateX(-50%) scale(1)";
        document.getElementById("clickStar").style.opacity=0;
        setTimeout(()=>{ startStage3(); },7000);
    }
});

// ---------------- STAGE 3 + PHASE 4 SCRIPT ----------------
const stage3=document.getElementById("stage3");
const clickBtn=document.getElementById("clickBtn");

function startStage3(){
    stage2.style.display="none";
    stage3.style.display="block";

    // ---------------- THREE.JS PHASE 4 ----------------
    let scene = new THREE.Scene();
    scene.fog = new THREE.FogExp2(0x000000, 0.0012);

    let camera = new THREE.PerspectiveCamera(60, window.innerWidth/window.innerHeight, 0.1, 3000);
    camera.position.set(0, 50, 400);

    let renderer = new THREE.WebGLRenderer({antialias:true, canvas:document.getElementById("c")});
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(window.devicePixelRatio);

    // Stars
    let starGeo = new THREE.BufferGeometry();
    let starCount = 2500;
    let starArr = new Float32Array(starCount*3);
    for(let i=0;i<starCount*3;i++){ starArr[i]=(Math.random()-0.5)*3000; }
    starGeo.setAttribute("position", new THREE.BufferAttribute(starArr,3));
    let starMat = new THREE.PointsMaterial({ color:0xffffff, size:2.2 });
    let stars = new THREE.Points(starGeo, starMat);
    scene.add(stars);
    let starVel = new Float32Array(starCount); for(let i=0;i<starCount;i++){ starVel[i]=Math.random()*0.02+0.01; }

    // Lights
    let ambient = new THREE.AmbientLight(0x666666, 0.5); scene.add(ambient);
    let keyLight = new THREE.PointLight(0x99ccff, 2, 2000); keyLight.position.set(180,200,140); scene.add(keyLight);
    let warmLight = new THREE.PointLight(0xffddaa,1.8,2000); warmLight.position.set(-120,160,-80); scene.add(warmLight);

    // Nebula shader
    const nebulaMat = new THREE.ShaderMaterial({
        uniforms:{ time:{ value:0 } },
        vertexShader:`varying vec2 vUv;void main(){vUv=uv;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0);}`,
        fragmentShader:`varying vec2 vUv;uniform float time;float hash(vec2 p){return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5453123);}float noise(vec2 p){vec2 i=floor(p);vec2 f=fract(p);float a=hash(i);float b=hash(i+vec2(1.0,0.0));float c=hash(i+vec2(0.0,1.0));float d=hash(i+vec2(1.0,1.0));vec2 u=f*f*(3.0-2.0*f);return mix(a,b,u.x)+(c-a)*u.y*(1.0-u.x)+(d-b)*u.x*u.y;}void main(){float t=time*0.3;float n=noise(vUv*10.0+vec2(t*0.5,-t*0.3));float glow=smoothstep(0.2,0.7,n);vec3 col=vec3(0.3+glow*0.7,0.2+glow*0.5,0.6+glow*0.9);gl_FragColor=vec4(col,1.0);}`,
        metalness:1, roughness:0.25, transparent:true
    });

    // PRINCE letters
    let princeLetters=[]; let birthdayMesh=null, oneMesh=null;
    const princeText="PRINCE"; let loadedFont=null;

    new THREE.FontLoader().load("https://threejs.org/examples/fonts/helvetiker_bold.typeface.json", font=>{
        loadedFont=font;
        // "1"
        let oneGeo=new THREE.TextGeometry("1",{font:font,size:120,height:10,bevelEnabled:true,bevelThickness:5,bevelSize:3});
        oneGeo.center();
        let oneMat=new THREE.MeshStandardMaterial({ color:0x3399ff, emissive:0x112244, metalness:0.5, roughness:0.6 });
        oneMesh=new THREE.Mesh(oneGeo,oneMat);
        oneMesh.position.y=180; oneMesh.position.z=-80; scene.add(oneMesh);

        // PRINCE letters
        let offset=-200;
        for(let i=0;i<princeText.length;i++){
            let geo=new THREE.TextGeometry(princeText[i], {font:font,size:120,height:10,bevelEnabled:true,bevelThickness:5,bevelSize:3});
            geo.center();
            let mat=new THREE.MeshStandardMaterial({color:0xffcc00,emissive:0x332200,metalness:0.5,roughness:0.3});
            let mesh=new THREE.Mesh(geo,mat);
            mesh.position.x=offset; mesh.position.y=0; mesh.position.z=0;
            scene.add(mesh);
            princeLetters.push(mesh); offset+=130;
        }
    });

    let clock = new THREE.Clock();
    function animate3(){
        requestAnimationFrame(animate3);
        let t=clock.getElapsedTime();
        stars.geometry.attributes.position.needsUpdate=true;
        for(let i=0;i<starCount;i++){ starArr[i*3+2]+=starVel[i]*5; if(starArr[i*3+2]>1500) starArr[i*3+2]=-1500; }
        camera.position.x=Math.sin(t*0.2)*350; camera.position.z=Math.cos(t*0.2)*400; camera.lookAt(0,50,0);
        renderer.render(scene,camera);
    }
    animate3();

    clickBtn.style.opacity=1;
}
</script>
</body>
</html>
