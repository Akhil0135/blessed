<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Shield → Constellation → Verse</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
html,body{
    margin:0;
    padding:0;
    overflow:hidden;
    background:#02030a;
}

canvas{
    display:block;
}
</style>
</head>

<body>
<canvas id="space"></canvas>
<canvas id="shield"></canvas>
<canvas id="constellation"></canvas>

<script>
/* --------------------------------------------------
   REFERENCES
   spaceCanvas = background flying stars
   shieldCanvas = Captain America shield
   constCanvas = constellation + verse stars
-------------------------------------------------- */

const space = document.getElementById("space");
const shield = document.getElementById("shield");
const constel = document.getElementById("constellation");

const sctx = space.getContext("2d");
const shctx = shield.getContext("2d");
const cctx = constel.getContext("2d");

function resize(){
    space.width = shield.width = constel.width = window.innerWidth;
    space.height = shield.height = constel.height = window.innerHeight;
}
resize();
window.onresize = resize;

/* --------------------------------------------------
   1. BACKGROUND FLYING STARS
-------------------------------------------------- */

let stars = [];
for(let i=0;i<200;i++){
    stars.push({
        x: Math.random()*space.width,
        y: Math.random()*space.height,
        z: Math.random()*3 + 1
    });
}

let bgMove = true;

function drawSpace(){
    sctx.clearRect(0,0,space.width,space.height);

    if(bgMove){
        for(let s of stars){
            s.x -= s.z*0.6;
            if(s.x < 0){
                s.x = space.width;
                s.y = Math.random()*space.height;
            }
        }
    }

    sctx.fillStyle = "white";
    for(let s of stars){
        sctx.fillRect(s.x, s.y, 2, 2);
    }

    requestAnimationFrame(drawSpace);
}
drawSpace();

/* --------------------------------------------------
   2. CAPTAIN AMERICA SHIELD
-------------------------------------------------- */

let spinning = false;
let angle = 0;

function drawShield(){
    shctx.clearRect(0,0,shield.width,shield.height);

    const cx = shield.width/2;
    const cy = shield.height/2;
    const R = Math.min(shield.width, shield.height)/3;

    shctx.save();
    shctx.translate(cx,cy);

    /* OUTER RED */
    let g1 = shctx.createRadialGradient(0,0,R*0.3,0,0,R);
    g1.addColorStop(0,"#3c0000");
    g1.addColorStop(1,"#7a0000");
    shctx.fillStyle = g1;
    shctx.beginPath();
    shctx.arc(0,0,R,0,Math.PI*2);
    shctx.fill();

    /* WHITE */
    let g2 = shctx.createRadialGradient(0,0,R*0.2,0,0,R*0.75);
    g2.addColorStop(0,"#c7c7c7");
    g2.addColorStop(1,"#e7e7e7");
    shctx.fillStyle = g2;
    shctx.beginPath();
    shctx.arc(0,0,R*0.75,0,Math.PI*2);
    shctx.fill();

    /* INNER RED */
    let g3 = shctx.createRadialGradient(0,0,R*0.2,0,0,R*0.5);
    g3.addColorStop(0,"#4e0000");
    g3.addColorStop(1,"#900000");
    shctx.fillStyle = g3;
    shctx.beginPath();
    shctx.arc(0,0,R*0.5,0,Math.PI*2);
    shctx.fill();

    /* BLUE CENTER */
    let g4 = shctx.createRadialGradient(0,0,R*0.1,0,0,R*0.35);
    g4.addColorStop(0,"#b9cce6");
    g4.addColorStop(1,"#002044");
    shctx.fillStyle = g4;
    shctx.beginPath();
    shctx.arc(0,0,R*0.35,0,Math.PI*2);
    shctx.fill();

    /* STAR */
    shctx.save();
    if(spinning){
        angle += 0.05;
        shctx.rotate(angle);
    }

    let starR = R*0.28;

    shctx.shadowColor = "rgba(255,255,255,0.15)"; // REDUCED MORE
    shctx.shadowBlur = 4;

    shctx.beginPath();
    for(let i=0;i<5;i++){
        let o = (Math.PI*2/5)*i - Math.PI/2;
        let inner = o + Math.PI/5;
        shctx.lineTo(Math.cos(o)*starR,   Math.sin(o)*starR);
        shctx.lineTo(Math.cos(inner)*(starR*0.45), Math.sin(inner)*(starR*0.45));
    }
    shctx.closePath();

    let sg = shctx.createRadialGradient(0,0,starR*0.1,0,0,starR);
    sg.addColorStop(0,"#ffffff");
    sg.addColorStop(1,"#777");
    shctx.fillStyle = sg;
    shctx.fill();

    shctx.restore();
    shctx.restore();

    requestAnimationFrame(drawShield);
}
drawShield();

/* --------------------------------------------------
   3. CONSTELLATION → VERSE
-------------------------------------------------- */

const verse = "He counts the stars and calls them each by name";
const points = [];
const letterPoints = [];

function createConstellation(){
    points.length = 0;

    let w = constel.width;
    let h = constel.height;

    for(let i=0;i<80;i++){
        points.push({
            x: Math.random()*w,
            y: Math.random()*h,
            tx: 0,
            ty: 0
        });
    }
}

function createVersePoints(){
    const temp = document.createElement("canvas");
    temp.width = constel.width;
    temp.height = constel.height;
    const tctx = temp.getContext("2d");

    tctx.fillStyle = "white";
    tctx.font = "48px Cinzel";
    tctx.fillText(verse, 50, constel.height/2);

    let img = tctx.getImageData(0,0,temp.width,temp.height);

    for(let y=0;y<img.height;y+=8){
        for(let x=0;x<img.width;x+=8){
            let i = (y*img.width + x)*4;
            if(img.data[i+3] > 200){
                letterPoints.push({x,y});
            }
        }
    }
}

createConstellation();
createVersePoints();

let showConstellation = false;
let morphToText = false;

function drawConstellation(){
    cctx.clearRect(0,0,constel.width,constel.height);

    if(showConstellation){
        // Move random stars to constellation shape (center)
        let cx = constel.width/2;
        let cy = constel.height/2;

        for(let p of points){
            p.tx = cx + (Math.random()*200 - 100);
            p.ty = cy + (Math.random()*200 - 100);

            p.x += (p.tx - p.x)*0.05;
            p.y += (p.ty - p.y)*0.05;

            cctx.fillStyle = "white";
            cctx.fillRect(p.x,p.y,3,3);
        }
    }

    if(morphToText){
        for(let i=0;i<points.length;i++){
            let target = letterPoints[i % letterPoints.length];

            points[i].x += (target.x - points[i].x)*0.04;
            points[i].y += (target.y - points[i].y)*0.04;

            cctx.fillStyle = "white";
            cctx.fillRect(points[i].x, points[i].y, 3,3);
        }
    }

    requestAnimationFrame(drawConstellation);
}
drawConstellation();

/* --------------------------------------------------
   CLICK INTERACTION
-------------------------------------------------- */

shield.addEventListener("click", ()=>{
    spinning = true;
    bgMove = false;

    setTimeout(()=>{
        showConstellation = true;
    },1000);

    setTimeout(()=>{
        morphToText = true;
    },3000);
});

</script>
</body>
</html>
