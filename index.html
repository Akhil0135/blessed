<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Meteor Shower Reveals Message</title>
<style>
  body, html {
    margin: 0;
    padding: 0;
    overflow: hidden;
    width: 100%;
    height: 100%;
    background: linear-gradient(to top, #0b0c2a, #1a1a3b);
    font-family: 'Segoe UI', sans-serif;
  }

  /* Stars */
  .star {
    position: absolute;
    border-radius: 50%;
    background: white;
    opacity: 0.8;
    box-shadow: 0 0 6px rgba(255,255,255,0.7);
    animation: twinkle 2s infinite alternate;
  }
  @keyframes twinkle {
    0% { opacity: 0.3; transform: scale(1); }
    50% { opacity: 1; transform: scale(1.5); }
    100% { opacity: 0.3; transform: scale(1); }
  }

  /* Moon */
  .moon {
    position: absolute;
    width: 120px;
    height: 120px;
    background: radial-gradient(circle, #fefbd8 0%, #f5e7a0 70%, #e0c97f 100%);
    border-radius: 50%;
    top: 50px;
    left: -150px;
    box-shadow: 0 0 30px 10px #fffacd;
    animation: moveMoon 60s linear infinite;
  }
  @keyframes moveMoon {
    0% { left: -150px; top: 80px; }
    50% { left: 50%; top: 120px; }
    100% { left: 100%; top: 80px; }
  }

  /* Clouds */
  .cloud {
    position: absolute;
    width: 250px;
    height: 100px;
    background: rgba(255,255,255,0.05);
    border-radius: 50%;
    filter: blur(20px);
    box-shadow: 0 0 30px rgba(255,255,255,0.05);
    animation: moveCloud linear infinite, morphCloud ease-in-out infinite alternate;
  }
  .cloud::before, .cloud::after {
    content: '';
    position: absolute;
    background: rgba(255,255,255,0.05);
    width: 150px;
    height: 80px;
    border-radius: 50%;
    filter: blur(20px);
  }
  .cloud::before { top: -30px; left: 50px; }
  .cloud::after { top: 20px; left: 100px; }
  @keyframes moveCloud { 0% { left: -300px; } 100% { left: 100%; } }
  @keyframes morphCloud { 0% { transform: scale(1,1); } 50% { transform: scale(1.1, 0.9); } 100% { transform: scale(1,1); } }

  /* Meteor */
  .meteor {
    position: absolute;
    width: 8px;
    height: 2px;
    background: linear-gradient(0deg, rgba(255,255,255,0) 0%, white 100%);
    border-radius: 50%;
    opacity: 0.9;
    transform-origin: top left;
  }

  /* Message letters */
  .message-letter {
    position: absolute;
    color: white;
    font-size: 2rem;
    text-shadow: 0 0 10px #fff, 0 0 20px #a0c4ff;
    opacity: 0;
    pointer-events: none;
  }
</style>
</head>
<body>

<div class="moon"></div>

<script>
  // Stars
  for(let i=0;i<150;i++){
    const star=document.createElement('div');
    star.classList.add('star');
    star.style.top=Math.random()*window.innerHeight+'px';
    star.style.left=Math.random()*window.innerWidth+'px';
    star.style.width=star.style.height=Math.random()*3+1+'px';
    document.body.appendChild(star);
  }

  // Clouds
  for(let i=0;i<5;i++){
    const cloud=document.createElement('div');
    cloud.classList.add('cloud');
    cloud.style.top=Math.random()*300+'px';
    cloud.style.animationDuration=(40 + Math.random()*40)+'s, '+(6 + Math.random()*4)+'s';
    cloud.style.opacity = 0.05 + Math.random()*0.1;
    document.body.appendChild(cloud);
  }

  // Message
  const messageText = "The night whispers secrets to those who listen...";
  const letters = [];
  messageText.split("").forEach(char=>{
    const letter = document.createElement('div');
    letter.className = 'message-letter';
    letter.innerText = char;
    document.body.appendChild(letter);
    letters.push(letter);
  });

  // Function to create a meteor
  function createMeteor(index) {
    const meteor = document.createElement('div');
    meteor.className = 'meteor';
    document.body.appendChild(meteor);

    const startX = Math.random()*window.innerWidth;
    const startY = -50;
    const endX = window.innerWidth/2 - letters.length*6 + index*14;
    const endY = window.innerHeight/2 + Math.sin(index/letters.length*Math.PI*2)*20;
    const duration = 1500 + Math.random()*1000;
    const startTime = performance.now();

    function step(now){
      const elapsed = now - startTime;
      const t = Math.min(elapsed/duration,1);

      // Linear diagonal movement
      const x = startX + (endX - startX)*t;
      const y = startY + (endY - startY)*t;
      meteor.style.left = x + "px";
      meteor.style.top = y + "px";

      if(t === 1){
        meteor.remove();
        letters[index].style.left = endX + "px";
        letters[index].style.top = endY + "px";
        letters[index].style.opacity = 1;
      } else {
        requestAnimationFrame(step);
      }
    }

    requestAnimationFrame(step);
  }

  // Start meteor shower to write message
  messageText.split("").forEach((_, i)=>{
    setTimeout(() => {
      createMeteor(i);
    }, i*250); // stagger meteors for cinematic effect
  });

</script>

</body>
</html>
