<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>IMAX — Nolan Cosmic • Steel Shield — Final</title>
<style>
  /* ---------- Reset & base ---------- */
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;background:#01010b;font-family:Inter,system-ui,Segoe UI,Roboto,'Helvetica Neue',Arial;color:#fff;overflow:hidden}
  :root{--accent:#e5f1ff}
  .stage{position:fixed;inset:0;display:grid;place-items:center;overflow:hidden}

  /* ---------- Cosmic background ---------- */
  .background{position:absolute;inset:0;z-index:1;overflow:hidden}
  .nebula{position:absolute;inset:-30%;filter:blur(120px) saturate(1.4);mix-blend-mode:screen;opacity:0.95}
  .neb1{background:radial-gradient(circle at 18% 35%, rgba(255,100,150,0.9), transparent 20%);animation:drift1 160s linear infinite}
  .neb2{background:radial-gradient(circle at 78% 65%, rgba(90,150,255,0.75), transparent 25%);animation:drift2 200s linear infinite}
  .neb3{background:radial-gradient(circle at 50% 55%, rgba(120,200,255,0.6), transparent 30%);animation:drift3 220s linear infinite}
  @keyframes drift1{0%{transform:translate(0,0)}50%{transform:translate(220px,-150px)}100%{transform:translate(0,0)}}
  @keyframes drift2{0%{transform:translate(0,0)}50%{transform:translate(-200px,120px)}100%{transform:translate(0,0)}}
  @keyframes drift3{0%{transform:translate(0,0)}50%{transform:translate(150px,-60px)}100%{transform:translate(0,0)}}

  .stars{position:absolute;inset:0;z-index:2;pointer-events:none;background-image:
    radial-gradient(#fff 1.3px, transparent 1px),
    radial-gradient(#fff 0.8px, transparent 1px);
    background-size:420px 420px, 120px 120px;filter:blur(.35px);opacity:0.9;animation:starMove 180s linear infinite}
  @keyframes starMove{0%{transform:translate(0,0)}100%{transform:translate(-240px,160px)}}

  .bloom{position:absolute;inset:0;z-index:3;pointer-events:none;mix-blend-mode:screen;background:
    radial-gradient(circle at 50% 38%, rgba(255,200,120,0.06), transparent 15%);opacity:0.28}

  /* subtle floating dust / embers */
  .ember{position:absolute;width:3px;height:3px;border-radius:50%;background:linear-gradient(#ffd880,#ffb140);opacity:0.95;filter:blur(0.6px);pointer-events:none;mix-blend-mode:screen}

  /* ---------- Shield container ---------- */
  .shield-wrap{position:relative;z-index:10;display:grid;place-items:center;width:62vmin;height:62vmin;transform:translateZ(0)}
  svg.shield{width:100%;height:100%;display:block;transform-origin:center center;filter:drop-shadow(0 30px 90px rgba(0,0,0,0.7))}

  /* ---------- Gradients + glint ---------- */
  /* defined inside SVG defs */

  /* ---------- Star ---------- */
  #shield-star{transform-box:fill-box;transform-origin:center center;cursor:pointer;filter:drop-shadow(0 6px 12px rgba(255,255,255,0.06));transition:transform .6s linear}

  /* ---------- Shard style (applies to generated shards) ---------- */
  .shard{
    transform-origin:100px 100px;
    mix-blend-mode:screen;
    filter:drop-shadow(0 0 10px rgba(255,230,160,0.12)) blur(0.2px);
  }
  .shard-edge{
    stroke:rgba(255,200,100,0.85);
    stroke-width:1.2;
    stroke-linecap:round;
    stroke-linejoin:round;
    filter:drop-shadow(0 0 10px rgba(255,200,120,0.85)) blur(0.6px);
    opacity:0.9;
  }

  /* ---------- Sparks ---------- */
  .spark{position:absolute;width:2px;height:2px;border-radius:50%;background:rgba(255,240,160,1);box-shadow:0 0 8px rgba(255,200,90,0.95);pointer-events:none;mix-blend-mode:screen;opacity:1}

  /* ---------- Ember/dust trail ---------- */
  .dust{position:absolute;width:6px;height:6px;border-radius:50%;background:rgba(200,190,180,0.08);filter:blur(0.6px);pointer-events:none;opacity:0.9}

  /* ---------- helper animations ---------- */
  @keyframes sparkFly{
    0%{transform:translate(0,0) scale(1);opacity:1}
    100%{transform:translate(var(--sx,0),var(--sy,0)) scale(0.1);opacity:0}
  }
  @keyframes emberFloat{
    0%{transform:translateY(0) scale(1);opacity:1}
    100%{transform:translateY(-200px) scale(0.2);opacity:0}
  }
  @keyframes shardBounce {
    0% { transform: translate(0,0) rotate(0) scale(1) }
    30% { transform: translate(var(--bx,0),var(--by,0)) rotate(var(--br,0)) scale(1.08) }
    60% { transform: translate(calc(var(--bx,0)*0.8), calc(var(--by,0)*0.8)) rotate(calc(var(--br,0)*0.6)) scale(1.02) }
    100% { transform: translate(calc(var(--bx,0)*1), calc(var(--by,0)*1)) rotate(var(--br,0)) scale(1) }
  }

  /* keep the UI clean on small screens */
  @media (max-width:520px){
    .shield-wrap{width:88vmin;height:88vmin}
  }
</style>
</head>
<body>
  <div class="stage" id="stage">
    <div class="background">
      <div class="nebula neb1"></div>
      <div class="nebula neb2"></div>
      <div class="nebula neb3"></div>
      <div class="stars"></div>
      <div class="bloom"></div>
    </div>

    <div class="shield-wrap" id="shieldWrap">
      <!-- SVG shield with metallic gradients + glint -->
      <svg class="shield" viewBox="0 0 200 200" id="shieldSVG" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <radialGradient id="metalRed" cx="50%" cy="35%" r="70%">
            <stop offset="0%" stop-color="#ff7a7a"/>
            <stop offset="55%" stop-color="#e04a4a"/>
            <stop offset="100%" stop-color="#6a0f0f"/>
          </radialGradient>
          <radialGradient id="metalWhite" cx="50%" cy="40%" r="70%">
            <stop offset="0%" stop-color="#ffffff"/>
            <stop offset="80%" stop-color="#bfbfbf"/>
          </radialGradient>
          <radialGradient id="metalBlue" cx="50%" cy="40%" r="70%">
            <stop offset="0%" stop-color="#8fb8ff"/>
            <stop offset="100%" stop-color="#002b5c"/>
          </radialGradient>

          <!-- glowing crack stroke -->
          <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
            <feGaussianBlur stdDeviation="2.2" result="blur"/>
            <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
          </filter>

          <!-- subtle motion blur for shards -->
          <filter id="shardBlur" x="-50%" y="-50%" width="200%" height="200%">
            <feGaussianBlur stdDeviation="0.9" result="sblur"/>
            <feMerge><feMergeNode in="sblur"/><feMergeNode in="SourceGraphic"/></feMerge>
          </filter>
        </defs>

        <!-- rings (kept minimal; shards will replace on break) -->
        <g id="rings" transform="translate(100,100)">
          <circle r="92" fill="url(#metalRed)"/>
          <circle r="76" fill="url(#metalWhite)"/>
          <circle r="56" fill="url(#metalRed)"/>
          <circle r="36" fill="url(#metalBlue)"/>
          <!-- glint overlay -->
          <circle r="92" fill="url(#metalRed)" style="opacity:0.06;mix-blend-mode:screen;filter:url(#glow)"/>
        </g>

        <!-- center star (clickable) -->
        <g id="starGroup" transform="translate(100,100)">
          <polygon id="shield-star" points="0,-24 5,-8 20,-6 8,6 12,22 0,12 -12,22 -8,6 -20,-6 -5,-8" fill="#fff" />
        </g>

        <!-- crack overlay group (empty until fracture) -->
        <g id="cracks" transform="translate(100,100)"></g>

      </svg>
    </div>
  </div>

<script>
/* ---------------------- Utilities ---------------------- */
const stage = document.getElementById('stage');
const shieldSVG = document.getElementById('shieldSVG');
const star = document.getElementById('shield-star');
const cracksGroup = document.getElementById('cracks');
const rings = document.getElementById('rings');

/* small helper to create an element in SVG namespace */
function svgCreate(tag, attrs = {}) {
  const el = document.createElementNS('http://www.w3.org/2000/svg', tag);
  for (const k in attrs) el.setAttribute(k, attrs[k]);
  return el;
}

/* ---------------------- Interaction flow ---------------------- */
let busy = false;

star.addEventListener('click', async () => {
  if (busy) return;
  busy = true;

  // 1) spin the star (fast)
  star.style.transition = 'transform 0.6s cubic-bezier(.1,.9,.2,1)';
  star.style.transform = 'rotate(1080deg) scale(1.02)';

  // quick bright glint on the shield
  const glint = rings.querySelector('circle:last-of-type');
  if (glint) {
    glint.style.transition = 'opacity .18s ease-in';
    glint.style.opacity = 0.65;
    setTimeout(()=> glint.style.opacity = 0.06, 260);
  }

  // wait for spin to finish
  await delay(620);

  // reset star rotation motion (soft settle)
  star.style.transition = 'transform 1.0s cubic-bezier(.22,1,.36,1)';
  star.style.transform = 'rotate(0deg) scale(1)';

  // 2) show cracks (glowing) expanding outward
  createCrackNetwork();

  // 3) after crack pulse, shatter into shards with sparks+embers
  await delay(350);
  fractureAndEmit();

  // allow future interactions only after a while (or remove to prevent replay)
  await delay(2200);
  busy = false;
});

/* ---------------------- Effects functions ---------------------- */
function delay(ms){ return new Promise(resolve=>setTimeout(resolve, ms)); }

/* Create glowing crack network from center — SVG paths drawn radial-ish */
function createCrackNetwork() {
  // clean existing
  while (cracksGroup.firstChild) cracksGroup.removeChild(cracksGroup.firstChild);

  const crackCount = 10; // number of primary crack arms
  for (let i = 0; i < crackCount; i++) {
    const angle = (i / crackCount) * Math.PI * 2 + (Math.random()-0.5)*0.12;
    // generate a slightly jagged path outward
    const segments = 5 + Math.floor(Math.random()*4);
    let d = `M 0 0`;
    let r = 18; // start from near center
    for (let s=0;s<segments;s++){
      const jitter = (Math.random()-0.5) * 12;
      const ax = Math.cos(angle + (Math.random()-0.5)*0.25) * r + jitter;
      const ay = Math.sin(angle + (Math.random()-0.5)*0.25) * r + jitter;
      d += ` L ${ax.toFixed(2)} ${ay.toFixed(2)}`;
      r += 22 + Math.random()*18;
    }
    const path = svgCreate('path', { d, fill: 'none', stroke: 'rgba(255,200,120,0.0)', 'stroke-width': 0.8 });
    // outer glow stroke behind
    const glow = svgCreate('path', { d, fill: 'none', stroke: 'rgba(255,200,120,0.0)', 'stroke-width': 6, 'stroke-linecap':'round', 'stroke-linejoin':'round' });
    glow.style.filter = 'url(#glow)';
    glow.style.opacity = 0;
    cracksGroup.appendChild(glow);
    cracksGroup.appendChild(path);

    // animate glow + thin stroke in
    setTimeout(()=>{
      glow.style.transition = 'opacity .25s ease-out, transform .75s ease-out';
      glow.style.opacity = 1.0;
      path.style.transition = 'stroke .25s ease-out, opacity .5s ease-out';
      path.setAttribute('stroke', 'rgba(255,220,150,0.95)');
    }, 40*i);
    // fade glow down slightly after pulse
    setTimeout(()=>{ glow.style.transition = 'opacity .9s ease-out'; glow.style.opacity = 0.28; }, 600 + i*30);
  }
}

/* Fracture rings into shards, animate shards with bounce, spawn sparks & embers, then fade shards */
function fractureAndEmit() {
  // remove the original rings visually (we'll create shards)
  if (rings) rings.style.opacity = 0;

  // layers: outer to inner, radius chosen to match original svg
  const layers = [
    { rOuter: 92, rInner: 76, fill: 'url(#metalRed)', edge: 'rgba(190,90,90,0.95)', slices: 10 },
    { rOuter: 76, rInner: 56, fill: 'url(#metalWhite)', edge: 'rgba(220,210,190,0.95)', slices: 8  },
    { rOuter: 56, rInner: 36, fill: 'url(#metalRed)', edge: 'rgba(180,80,80,0.95)', slices: 8  },
    { rOuter: 36, rInner: 12, fill: 'url(#metalBlue)', edge: 'rgba(140,170,255,0.95)', slices: 6 }
  ];

  // create shards group so we can manage
  const shardRoot = svgCreate('g', { id: 'shards' });
  shieldSVG.appendChild(shardRoot);

  layers.forEach((layer, li) => {
    const { rOuter, rInner, fill, edge, slices } = layer;
    for (let s=0;s<slices;s++){
      const a0 = (s / slices) * Math.PI * 2;
      const a1 = ((s+1) / slices) * Math.PI * 2;
      // compute points
      const x1 = rInner * Math.cos(a0), y1 = rInner * Math.sin(a0);
      const x2 = rOuter * Math.cos(a0), y2 = rOuter * Math.sin(a0);
      const x3 = rOuter * Math.cos(a1), y3 = rOuter * Math.sin(a1);
      const x4 = rInner * Math.cos(a1), y4 = rInner * Math.sin(a1);
      const d = `M ${x1} ${y1} L ${x2} ${y2} A ${rOuter} ${rOuter} 0 0 1 ${x3} ${y3} L ${x4} ${y4} A ${rInner} ${rInner} 0 0 0 ${x1} ${y1}`;

      const piece = svgCreate('path', { d, fill });
      piece.classList.add('shard');
      // add subtle bright edge path for molten look
      const edgePath = svgCreate('path', { d, fill:'none', stroke: edge, 'stroke-width': 0.9, 'class':'shard-edge' });

      // append shadow & group
      const g = svgCreate('g', {});
      g.appendChild(piece);
      g.appendChild(edgePath);
      shardRoot.appendChild(g);

      // random outward vector
      const outwardAngle = (a0 + a1)/2 + (Math.random()-0.5)*0.6;
      const dist = 110 + Math.random()*160;
      const dx = Math.cos(outwardAngle) * dist;
      const dy = Math.sin(outwardAngle) * dist;
      const rot = (Math.random()-0.5)*900; // degrees
      const bounceX = dx * (0.6 + Math.random()*0.6);
      const bounceY = dy * (0.6 + Math.random()*0.6);

      // apply CSS variables for shardBounce animation
      g.style.setProperty('--bx', `${dx}px`);
      g.style.setProperty('--by', `${dy}px`);
      g.style.setProperty('--br', `${rot}deg`);
      // initial transform (centered glyph)
      g.style.transformOrigin = '100px 100px';

      // slight delay per shard for staggered break
      const tdelay = 60 * li + Math.random()*120;

      setTimeout(()=> {
        // apply bounce animation sequence using keyframes via JS (simulate)
        g.style.transition = 'transform 1.2s cubic-bezier(.2,.9,.2,1), opacity 1.0s ease-out';
        // small bounce effect: use keyframe-like approach
        g.style.transform = `translate(${dx*0.95}px, ${dy*0.95}px) rotate(${rot}deg) scale(1.04)`;
        // spawn sparks near the shard
        spawnSparkBurst(100 + dx*0.35, 100 + dy*0.35, 8 + Math.floor(Math.random()*8));
        // spawn a few embers that float away
        spawnEmbers(100 + dx*0.3, 100 + dy*0.3, 3);

        // after motion settle, apply fade away
        setTimeout(()=>{
          g.style.transition = 'opacity 1.1s ease-out, transform 1.0s ease-out';
          g.style.opacity = '0';
          // tiny extra drift while fading
          const ddx = dx*1.08, ddy = dy*1.08, drot = rot + (Math.random()-0.5)*120;
          g.style.transform = `translate(${ddx}px, ${ddy}px) rotate(${drot}deg) scale(1.02)`;
          // remove element when done
          setTimeout(()=> { try{ shardRoot.removeChild(g); }catch(e){} }, 1200);
        }, 750 + Math.random()*220);

      }, tdelay);
    }
  });

  // minor overall shock ripple: expand a faint ring then fade
  // create ripple circle
  const ripple = svgCreate('circle', { cx:0, cy:0, r:28, fill:'none', stroke:'rgba(255,220,160,0.06)', 'stroke-width':6 });
  ripple.setAttribute('transform','translate(100,100)');
  ripple.style.transition = 'transform .9s ease-out, opacity 1.0s ease-out';
  shieldSVG.appendChild(ripple);
  setTimeout(()=>{ ripple.setAttribute('transform','translate(100,100) scale(6)'); ripple.style.opacity = 0; }, 80);
  setTimeout(()=> ripple.remove(), 1100);
}

/* spawn sparks quickly (small bright particles) */
function spawnSparkBurst(cx, cy, count){
  for (let i=0;i<count;i++){
    const s = document.createElement('div');
    s.className = 'spark';
    const ang = Math.random()*Math.PI*2;
    const dist = 20 + Math.random()*140;
    const sx = Math.cos(ang) * dist;
    const sy = Math.sin(ang) * dist;
    s.style.left = (cx) + 'px';
    s.style.top  = (cy) + 'px';
    s.style.width = (1 + Math.random()*2) + 'px';
    s.style.height = (1 + Math.random()*2) + 'px';
    s.style.transform = 'translate(-1px,-1px)';
    s.style.setProperty('--sx', sx + 'px');
    s.style.setProperty('--sy', sy + 'px');
    s.style.animation = `sparkFly ${0.5 + Math.random()*0.6}s linear forwards`;
    stage.appendChild(s);
    setTimeout(()=> s.remove(), 900);
  }
}

/* spawn a few glowing embers that float upward and fade */
function spawnEmbers(cx, cy, count){
  for (let i=0;i<count;i++){
    const e = document.createElement('div');
    e.className = 'ember';
    const left = cx + (Math.random()-0.5) * 40;
    const top  = cy + (Math.random()-0.5) * 40;
    e.style.left = left + 'px';
    e.style.top  = top + 'px';
    const dur = 2.6 + Math.random()*1.6;
    e.style.width = (2 + Math.random()*4) + 'px';
    e.style.height = e.style.width;
    e.style.opacity = 0.95;
    e.style.animation = `emberFloat ${dur}s linear forwards`;
    stage.appendChild(e);
    setTimeout(()=> e.remove(), (dur*1000)+120);
  }
}

/* ---------------------- Initial cosmetic tweaks ---------------------- */
/* small idle star pop on load */
setTimeout(()=> {
  star.style.transform = 'scale(1.02)';
  setTimeout(()=> star.style.transform = 'scale(1)', 420);
}, 800);

/* place a handful of tiny slow embers to add atmosphere */
for (let i=0;i<18;i++){
  const e = document.createElement('div');
  e.className = 'ember';
  e.style.left = (10 + Math.random()*80) + '%';
  e.style.top  = (30 + Math.random()*60) + '%';
  const dur = 12 + Math.random()*18;
  e.style.width = (2 + Math.random()*5) + 'px';
  e.style.height = e.style.width;
  e.style.opacity = 0.06 + Math.random()*0.14;
  e.style.animation = `emberFloat ${dur}s linear forwards`;
  stage.appendChild(e);
  setTimeout(()=> e.remove(), (dur*1000)+200);
}

/* ---------------------- End ---------------------- */
</script>
</body>
</html>
