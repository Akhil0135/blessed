<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cinematic Night Sky</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Great+Vibes&display=swap');

body, html {
  margin: 0;
  padding: 0;
  overflow: hidden;
  width: 100%;
  height: 100%;
  background: linear-gradient(to top, #0b0c2a, #1a1a3b);
  font-family: 'Great Vibes', cursive;
}

/* Stars */
.star {
  position: absolute;
  border-radius: 50%;
  background: white;
  opacity: 0.8;
  box-shadow: 0 0 6px rgba(255,255,255,0.7);
  animation: twinkle 2s infinite alternate;
}
@keyframes twinkle {
  0% { opacity: 0.3; transform: scale(1); }
  50% { opacity: 1; transform: scale(1.5); }
  100% { opacity: 0.3; transform: scale(1); }
}

/* Moon */
.moon {
  position: absolute;
  width: 120px;
  height: 120px;
  background: radial-gradient(circle, #fefbd8 0%, #f5e7a0 70%, #e0c97f 100%);
  border-radius: 50%;
  top: 50px;
  left: -150px;
  box-shadow: 0 0 30px 10px #fffacd;
  z-index: 4;
  animation: moveMoon 60s linear infinite;
}
@keyframes moveMoon {
  0% { left: -150px; top: 50px; }
  50% { left: 50%; top: 100px; }
  100% { left: 100%; top: 50px; }
}

/* Aurora with slight waving effect */
.aurora {
  position: absolute;
  width: 300%;
  height: 400px;
  background: linear-gradient(120deg, rgba(0,255,128,0.3), rgba(128,0,255,0.3), rgba(0,255,255,0.3));
  top: 50%;
  left: -100%;
  border-radius: 50%;
  filter: blur(80px);
  z-index: 2;
  animation: moveAurora 20s linear infinite alternate, waveAurora 6s ease-in-out infinite alternate;
}
@keyframes moveAurora {
  0% { left: -100%; transform: rotate(0deg); }
  100% { left: -50%; transform: rotate(5deg); }
}
@keyframes waveAurora {
  0% { transform: rotate(0deg) translateY(0px); }
  50% { transform: rotate(1deg) translateY(15px); }
  100% { transform: rotate(0deg) translateY(0px); }
}

/* Original cinematic clouds */
.cloud {
  position: absolute;
  width: 250px;
  height: 100px;
  background: rgba(255,255,255,0.05);
  border-radius: 50%;
  filter: blur(20px);
  box-shadow: 0 0 30px rgba(255,255,255,0.05);
  animation: morphCloud ease-in-out infinite alternate;
}
.cloud::before, .cloud::after {
  content:'';
  position: absolute;
  background: rgba(255,255,255,0.05);
  width: 150px;
  height: 80px;
  border-radius: 50%;
  filter: blur(20px);
}
.cloud::before { top: -30px; left: 50px; }
.cloud::after { top: 20px; left: 100px; }
@keyframes morphCloud { 0% { transform: scale(1,1); } 50% { transform: scale(1.1,0.9); } 100% { transform: scale(1,1); } }

/* Shooting stars */
.shooting-star {
  position: absolute;
  width: 8px;
  height: 3px;
  background: linear-gradient(0deg, rgba(255,255,255,0) 0%, white 100%);
  border-radius: 50%;
  opacity: 0;
  transform-origin: top left;
  animation: shoot 3s linear forwards;
  z-index: 5;
}
@keyframes shoot {
  0% { transform: translate(0,0) rotate(-45deg); opacity: 1; }
  100% { transform: translate(-70vw, 70vh) rotate(-45deg); opacity: 0; }
}

/* Message letters */
.message-letter {
  position: absolute;
  color: #ffffff;
  font-size: 3rem;
  text-shadow: 0 0 10px #fff, 0 0 20px #00ffcc;
  opacity: 0;
  pointer-events: none;
  z-index: 6;
  transition: opacity 1s ease, top 1s ease, left 1s ease, text-shadow 1s ease;
}
</style>
</head>
<body>

<div class="moon"></div>
<div class="aurora"></div>

<script>
// Stars
for(let i=0;i<150;i++){
  const star = document.createElement('div');
  star.classList.add('star');
  star.style.top = Math.random()*window.innerHeight+'px';
  star.style.left = Math.random()*window.innerWidth+'px';
  star.style.width = star.style.height = Math.random()*3+1+'px';
  document.body.appendChild(star);
}

// Clouds layers (original cinematic clouds restored)
const cloudLayers = [
  { count: 3, z:2, speed: 80, opacity:0.05 }, // behind aurora
  { count: 3, z:5, speed: 50, opacity:0.08 }  // in front
];

cloudLayers.forEach(layer=>{
  for(let i=0;i<layer.count;i++){
    const cloud = document.createElement('div');
    cloud.classList.add('cloud');
    cloud.style.top = Math.random()*300+'px';
    cloud.style.opacity = layer.opacity;
    cloud.style.zIndex = layer.z;
    const duration = layer.speed + Math.random()*40;
    cloud.style.animation = `moveCloud ${duration}s linear infinite, morphCloud ${6 + Math.random()*4}s ease-in-out infinite alternate`;
    document.body.appendChild(cloud);
  }
});

// Cloud move keyframes
const style = document.createElement('style');
style.innerHTML = `
@keyframes moveCloud {
  0% { left: -400px; }
  100% { left: 100%; }
}
`;
document.head.appendChild(style);

// Message letters
const messageText = "The night whispers secrets...";
const letters = [];
messageText.split("").forEach((char)=>{
  const letter = document.createElement('div');
  letter.className = 'message-letter';
  letter.innerText = char;
  document.body.appendChild(letter);
  letters.push(letter);
});

// Animate letters
function animateLetters(){
  const letterSpacing = 38;
  const totalWidth = (letters.length-1)*letterSpacing + 20;
  const startX = (window.innerWidth - totalWidth)/2;
  const centerY = window.innerHeight/2;
  letters.forEach((letter,i)=>{
    setTimeout(()=>{
      letter.style.left = startX + i*letterSpacing + "px";
      letter.style.top = centerY + "px";
      letter.style.opacity = 1;
      letter.style.textShadow = `
        0 0 20px #0ff,
        0 0 30px #0f0,
        0 0 40px #0ff,
        0 0 50px #0ff
      `;
    }, i*250);
  });
}
setTimeout(animateLetters, 2000);

// Shooting stars increased
function createShootingStar(){
  const star = document.createElement('div');
  star.classList.add('shooting-star');
  star.style.top = Math.random()*200+'px';
  star.style.left = window.innerWidth+'px';
  const duration = 2 + Math.random()*1.5;
  star.style.animationDuration = duration+'s';
  document.body.appendChild(star);
  setTimeout(()=>{ star.remove(); }, duration*1000);
}
// More frequent shooting stars
setInterval(createShootingStar, 1200);
setInterval(createShootingStar, 1800);
setInterval(createShootingStar, 2400);
setInterval(createShootingStar, 3000);
</script>

</body>
</html>
