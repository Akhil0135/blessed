<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Constellation Verse Reveal — Akhil Sir</title>
<style>
  body {
    margin: 0;
    height: 100vh;
    background: #000;
    overflow: hidden;
    display: flex;
    justify-content: center;
    align-items: center;
    font-family: 'Cinzel', serif;
  }

  /* Starfield BG */
  canvas#starfield {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    z-index: 0;
  }

  /* Constellation lines */
  svg {
    position: absolute;
    width: 100%;
    height: 100%;
    top: 0;
    left: 0;
    z-index: 2;
  }

  #verse {
    color: #e6e6ff;
    font-size: 2.2rem;
    letter-spacing: 2px;
    text-shadow: 0 0 12px #4e5bff;
    opacity: 0;
    z-index: 3;
    position: relative;
  }
</style>
</head>
<body>
<canvas id="starfield"></canvas>

<!-- Constellation Layer -->
<svg id="constellation"></svg>

<div id="verse"></div>

<script>
// --------------------- STARFIELD BACKGROUND ---------------------
const starCanvas = document.getElementById('starfield');
const ctx = starCanvas.getContext('2d');
starCanvas.width = innerWidth;
starCanvas.height = innerHeight;

let stars = [];
for (let i = 0; i < 300; i++) {
  stars.push({
    x: Math.random() * innerWidth,
    y: Math.random() * innerHeight,
    size: Math.random() * 1.2,
    speed: Math.random() * 0.2 + 0.05
  });
}

function starfieldAnim() {
  ctx.clearRect(0, 0, innerWidth, innerHeight);
  ctx.fillStyle = 'white';

  stars.forEach(s => {
    ctx.globalAlpha = Math.random();
    ctx.fillRect(s.x, s.y, s.size, s.size);
  });

  requestAnimationFrame(starfieldAnim);
}
starfieldAnim();

// --------------------- CONSTELLATION DRAW -----------------------
const svg = document.getElementById('constellation');
const verseText = "EVOLUTION OF THE SOUL";
const verseDiv = document.getElementById('verse');

// Constellation points
let points = [];
const totalPoints = 20;

for (let i = 0; i < totalPoints; i++) {
  points.push({
    x: Math.random() * innerWidth,
    y: Math.random() * innerHeight * 0.6 + innerHeight * 0.2
  });
}

// Create stars
points.forEach((p, i) => {
  const star = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
  star.setAttribute('cx', p.x);
  star.setAttribute('cy', p.y);
  star.setAttribute('r', 3);
  star.setAttribute('fill', '#9ab1ff');
  star.setAttribute('opacity', '0');
  svg.appendChild(star);

  setTimeout(() => {
    star.style.transition = 'opacity 0.7s ease';
    star.setAttribute('opacity', '1');
  }, i * 200);
});

// Draw lines
points.forEach((p, i) => {
  if (i === 0) return;
  const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
  line.setAttribute('x1', points[i - 1].x);
  line.setAttribute('y1', points[i - 1].y);
  line.setAttribute('x2', p.x);
  line.setAttribute('y2', p.y);
  line.setAttribute('stroke', '#6e7cff');
  line.setAttribute('stroke-width', '2');
  line.setAttribute('opacity', '0');
  svg.appendChild(line);

  setTimeout(() => {
    line.style.transition = 'opacity 0.7s ease';
    line.setAttribute('opacity', '0.9');
  }, i * 300 + 300);
});

// --------------------- VERSE REVEAL LETTER BY LETTER ---------------------
setTimeout(() => {
  verseDiv.style.opacity = 1;
  let i = 0;

  function typeWrite() {
    verseDiv.textContent = verseText.substring(0, i);
    i++;
    if (i <= verseText.length) setTimeout(typeWrite, 120);
  }

  typeWrite();
}, totalPoints * 250);
</script>
</body>
</html>
