<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cinematic Cartoon Saree Girl Walk</title>
<style>
  * {margin:0; padding:0; box-sizing:border-box;}

  body, html {
    width:100%;
    height:100%;
    overflow:hidden;
    background:#000;
    font-family: 'Georgia', serif;
  }

  /* --- Cinematic Gradient --- */
  .scene {
    width:100%;
    height:100vh;
    background: linear-gradient(#0b0f29, #1a274a, #294b4a);
    position: relative;
    overflow:hidden;
  }

  /* --- Parallax Garden --- */
  .grass {
    position:absolute;
    bottom:0;
    width:200%;
    height:22%;
    background:#0c2f1d;
    animation: grassMove 8s linear infinite;
  }
  @keyframes grassMove {
    0% {transform: translateX(0);}
    100% {transform: translateX(-30%);}
  }

  .bushes {
    position:absolute;
    bottom:18%;
    width:200%;
    height:15%;
    background:#0f492c;
    border-radius:50%;
    filter: blur(4px);
    animation: bushesMove 12s linear infinite;
  }
  @keyframes bushesMove {
    0% {transform: translateX(0);}
    100% {transform: translateX(-40%);}
  }

  /* --- Cartoon Girl (SVG) --- */
  .girl {
    position:absolute;
    bottom:18%;
    left:20%;
    width:180px;
    animation: float 3s ease-in-out infinite alternate;
  }

  @keyframes float {
    0% {transform: translateY(0);}
    100% {transform: translateY(-5px);}
  }

  /* Walking animation: saree sway + legs movement */
  .saree {
    animation: sareeMove 1.3s ease-in-out infinite;
    transform-origin: top right;
  }

  @keyframes sareeMove {
    0% {transform: rotate(2deg);}
    50% {transform: rotate(-3deg);}
    100% {transform: rotate(2deg);}
  }

  .leg-left, .leg-right {
    animation: walk 0.8s ease-in-out infinite;
    transform-origin: top center;
  }

  @keyframes walk {
    0% {transform: rotate(4deg);}
    50% {transform: rotate(-8deg);}
    100% {transform: rotate(4deg);}
  }

  /* Cinematic Black Bars */
  .bars {
    position:fixed;
    width:100%;
    height:12%;
    background:black;
    z-index:99;
  }
  .top {top:0;}
  .bottom {bottom:0;}
</style>
</head>
<body>

<div class="bars top"></div>
<div class="bars bottom"></div>

<div class="scene">

  <!-- Parallax Garden -->
  <div class="bushes"></div>
  <div class="grass"></div>

  <!-- Cartoon Girl in Saree (PURE SVG — ALWAYS WORKS) -->
  <svg class="girl" viewBox="0 0 200 400">
    
    <!-- Hair -->
    <ellipse cx="100" cy="80" rx="55" ry="70" fill="#2d1f14"/>
    
    <!-- Face -->
    <circle cx="100" cy="110" r="40" fill="#f7d7b1"/>

    <!-- Body -->
    <rect x="70" y="150" width="60" height="130" rx="20" fill="#f7d7b1"/>

    <!-- Saree -->
    <path class="saree" d="M70 150 Q40 260 90 330 L160 330 Q120 240 130 150 Z"
          fill="#d93b76"/>

    <!-- Left Leg -->
    <rect class="leg-left" x="80" y="280" width="20" height="100" rx="10" fill="#f7d7b1"/>

    <!-- Right Leg -->
    <rect class="leg-right" x="110" y="280" width="20" height="100" rx="10" fill="#f7d7b1"/>

  </svg>

</div>

</body>
</html>
