<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>IMAX — Nolan Cosmic • Shield Reveal — Birthday</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#01010b;font-family:Inter,system-ui,Segoe UI,Roboto,'Helvetica Neue',Arial;color:#fff;overflow:hidden}
:root{--imax-letterbox:12vh;--accent:#e5f1ff}
.stage{position:fixed;inset:0;display:grid;place-items:center;overflow:hidden}
.letterbox-top,.letterbox-bottom{position:absolute;left:0;right:0;height:var(--imax-letterbox);background:linear-gradient(180deg,rgba(0,0,0,0.95),rgba(0,0,0,0.7));z-index:60;pointer-events:none}.letterbox-top{top:0}.letterbox-bottom{bottom:0}
/* --- Enhanced Dynamic Background --- */
.background{position:absolute;inset:0;z-index:1;overflow:hidden}
.nebula-layer{position:absolute;inset:-30%;mix-blend-mode:screen;filter:blur(140px) saturate(2);animation:nebulaDrift linear infinite;opacity:0.9}
.nebula1{background:radial-gradient(circle at 25% 40%, rgba(255,120,160,0.6), transparent 25%);animation-duration:150s;}
.nebula2{background:radial-gradient(circle at 75% 65%, rgba(80,150,255,0.55), transparent 30%);animation-duration:180s;}
.nebula3{background:radial-gradient(circle at 50% 50%, rgba(120,200,255,0.5), transparent 35%);animation-duration:220s;}
@keyframes nebulaDrift{0%{transform:translate(0,0)}50%{transform:translate(200px,-120px)}100%{transform:translate(0,0)}}
.stars{position:absolute;inset:0;z-index:2;pointer-events:none;opacity:1;background-image:radial-gradient(#fff 1.2px, transparent 1px),radial-gradient(#fff 0.8px, transparent 1px);background-size:400px 400px, 120px 120px;filter:blur(.4px);animation:starDrift 200s linear infinite, starTwinkle 5s infinite alternate;}
@keyframes starTwinkle{0%{opacity:0.75}50%{opacity:0.95}100%{opacity:0.8}}
@keyframes starDrift{0%{transform:translate(0,0)}100%{transform:translate(-200px,150px)}}
.bloom{position:absolute;inset:0;z-index:3;pointer-events:none;border-radius:50%;mix-blend-mode:screen;opacity:0.3;background:radial-gradient(circle at 50% 40%, rgba(255,200,100,0.05), transparent 15%)}
.particles{position:absolute;inset:0;z-index:4;pointer-events:none;}
.particle{position:absolute;width:3px;height:3px;background:#fff;opacity:0.5;border-radius:50%;animation:particleDrift linear infinite;}
@keyframes particleDrift{0%{transform:translate(0,0)}100%{transform:translate(var(--x),var(--y))}}
/* Shield */
.shield-wrap{position:relative;z-index:10;display:grid;place-items:center;width:60vmin;height:60vmin;transform:translateZ(0)}
.shield-svg{width:100%;height:100%;transform-origin:center center;filter:drop-shadow(0 20px 60px rgba(0,0,0,0.7))}
.shield-enter{animation:shieldRise 2.6s cubic-bezier(.2,.9,.2,1) forwards, shieldBounce 0.9s 2.6s cubic-bezier(.2,.9,.2,1) both}@keyframes shieldRise{0%{transform:translateY(18vh) scale(.3) rotate(-10deg);opacity:0}60%{opacity:1;transform:translateY(-2vh) scale(1.05) rotate(6deg)}100%{transform:translateY(0) scale(1) rotate(0deg)}}@keyframes shieldBounce{0%{transform:translateY(0)}30%{transform:translateY(-1.2vh)}60%{transform:translateY(0)}100%{transform:translateY(0)}}
#shield-star{transform-box:fill-box;transform-origin:center center;opacity:0;transform:scale(0) rotate(0deg);transition:transform 1.2s cubic-bezier(0.22,1,0.36,1),opacity 0.8s ease-out;cursor:pointer}
.title{position:absolute;bottom:calc(var(--imax-letterbox) + 6vh);left:50%;transform:translateX(-50%);text-align:center;z-index:30;pointer-events:none}.title .greeting{font-size:clamp(12px,1.6vmin,18px);letter-spacing:6px;color:rgba(230,240,255,0.8);text-transform:uppercase;font-weight:600;opacity:0;transform:translateY(8px);animation:greetIn 0.9s 3.6s cubic-bezier(.2,.9,.2,1) forwards}.title .name{font-family:"Cinzel",serif;font-weight:700;font-size:clamp(28px,4.6vmin,72px);letter-spacing:.02em;color:var(--accent);opacity:0;transform:translateY(18px) scale(.92);animation:nameIn 1s 3.9s cubic-bezier(.2,.9,.2,1) forwards}@keyframes greetIn{to{opacity:1;transform:translateY(0)}}@keyframes nameIn{to{opacity:1;transform:translateY(0) scale(1)}}
</style>
</head>
<body>
<div class="stage">
  <div class="background">
    <div class="nebula-layer nebula1"></div>
    <div class="nebula-layer nebula2"></div>
    <div class="nebula-layer nebula3"></div>
    <div class="stars"></div>
    <div class="bloom"></div>
    <div class="particles"></div>
  </div>
  <div class="shield-wrap">
    <svg class="shield-svg" viewBox="0 0 200 200">
      <g id="rings" transform="translate(100,100)">
        <circle r="92" fill="#0b2340" />
        <circle r="76" fill="#d33a3a" />
        <circle r="56" fill="#ffffff" />
        <circle r="36" fill="#2b5ea6" />
      </g>
      <g id="starGroup" transform="translate(100,100)">
        <polygon id="shield-star" points="0,-28 6,-8 26,-6 10,6 14,26 0,14 -14,26 -10,6 -26,-6 -6,-8" fill="#fff" />
      </g>
    </svg>
    <div class="sheen"></div>
  </div>
  <div class="title"><div class="greeting">Happy Birthday</div><div class="name" id="nameText">Someone</div></div>
</div>
<script>
const star = document.getElementById('shield-star');
if(star){
  setTimeout(()=>{ star.style.opacity=1; star.style.transform='scale(1) rotate(360deg)'; }, 1200);
  star.addEventListener('click', ()=>{
    star.style.transition='transform 0.5s linear';
    star.style.transform='scale(1) rotate(1080deg)';
    setTimeout(()=>{ star.style.transition='transform 1s cubic-bezier(0.22,1,0.36,1)'; star.style.transform='scale(1) rotate(0deg)'; }, 500);
  });
}
// Generate drifting particles
const particleContainer=document.querySelector('.particles');
for(let i=0;i<120;i++){
  const p=document.createElement('div');
  p.className='particle';
  p.style.setProperty('--x', (Math.random()*400-200)+'px');
  p.style.setProperty('--y', (Math.random()*400-200)+'px');
  p.style.left=Math.random()*100+'%';
  p.style.top=Math.random()*100+'%';
  p.style.animationDuration=(60+Math.random()*60)+'s';
  particleContainer.appendChild(p);
}
</script>
</body>
</html>
