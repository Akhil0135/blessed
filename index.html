<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Captain America Shield — Divine Verse</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
    html,body{
        margin:0;
        padding:0;
        overflow:hidden;
        background:#000005;   /* FIXED — pure IMAX black */
        font-family: "Cinzel", serif;
    }

    canvas{
        position:absolute;
        top:0; left:0;
        width:100%; height:100%;
        display:block;
        z-index:2;
    }

    /* Stars in background */
    #bg-stars div{
        position:absolute;
        background:white;
        border-radius:50%;
        pointer-events:none;
        filter:blur(1px);
    }

    #bg-stars{
        position:absolute;
        top:0; left:0;
        width:100%; height:100%;
        z-index:1;
        background:#000005;   /* ensures NO white flash */
    }

    /* Divine beam */
    #beam{
        position:absolute;
        top:-200px;
        left:50%;
        transform:translateX(-50%);
        width:300px;
        height:600px;
        background:linear-gradient(to bottom,
            rgba(255,255,200,0) 0%,
            rgba(255,255,170,0.7) 25%,
            rgba(255,255,140,0.2) 100%);
        filter:blur(40px);
        opacity:0;
        transition:1.2s ease-out;
        z-index:5;
        pointer-events:none;
    }

    .verse-letter{
        position:absolute;
        top:70px;
        font-size:38px;
        color:#ffe7aa;
        opacity:0;
        transform:scale(0.1);
        text-shadow:0 0 10px #fff4c2;
        transition:0.6s ease-out;
        z-index:10;
        white-space:pre;
        pointer-events:none;
    }

    /* Invisible span used for perfect measurement */
    #measure{
        visibility:hidden;
        position:absolute;
        top:-9999px;
        left:-9999px;
        font-size:38px;
        font-family:"Cinzel", serif;
        white-space:pre;
    }
</style>

</head>
<body>

<div id="bg-stars"></div>
<div id="beam"></div>
<div id="measure"></div>
<canvas id="shieldCanvas"></canvas>

<script>
// ------------------------------------------
// ⭐ BACKGROUND STARS FIXED
// ------------------------------------------
const bg = document.getElementById("bg-stars");
for(let i=0;i<250;i++){
    const s = document.createElement("div");
    let size = Math.random()*2 + 1;
    s.style.width = size + "px";
    s.style.height = size + "px";
    s.style.left = (Math.random()*100) + "%";
    s.style.top = (Math.random()*100) + "%";
    s.style.opacity = Math.random()*0.8;
    bg.appendChild(s);
}

// ------------------------------------------
// ⭐ CANVAS SHIELD
// ------------------------------------------
const canvas = document.getElementById("shieldCanvas");
const ctx = canvas.getContext("2d");
function resize(){
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
}
resize();
window.onresize = resize;

let shieldX, shieldY, R;
let starSpin = false;
let starAngle = 0;

function drawShield(){
    shieldX = canvas.width/2;
    shieldY = canvas.height/2;
    R = Math.min(canvas.width, canvas.height)/3;

    ctx.save();
    ctx.translate(shieldX, shieldY);

    // OUTER RED
    let g1 = ctx.createRadialGradient(0,0,R*0.2,0,0,R);
    g1.addColorStop(0,"#300000");
    g1.addColorStop(1,"#700000");
    ctx.fillStyle = g1;
    ctx.beginPath(); ctx.arc(0,0,R,0,Math.PI*2); ctx.fill();

    // WHITE
    let g2 = ctx.createRadialGradient(0,0,R*0.1,0,0,R*0.75);
    g2.addColorStop(0,"#e3e3e3");
    g2.addColorStop(1,"#fafafa");
    ctx.fillStyle = g2;
    ctx.beginPath(); ctx.arc(0,0,R*0.75,0,Math.PI*2); ctx.fill();

    // INNER RED
    let g3 = ctx.createRadialGradient(0,0,R*0.1,0,0,R*0.5);
    g3.addColorStop(0,"#450000");
    g3.addColorStop(1,"#880000");
    ctx.fillStyle = g3;
    ctx.beginPath(); ctx.arc(0,0,R*0.5,0,Math.PI*2); ctx.fill();

    // BLUE METALLIC
    let g4 = ctx.createRadialGradient(0,0,R*0.05,0,0,R*0.35);
    g4.addColorStop(0,"#b0c4e8");
    g4.addColorStop(1,"#00152d");
    ctx.fillStyle = g4;
    ctx.beginPath(); ctx.arc(0,0,R*0.35,0,Math.PI*2); ctx.fill();

    // STAR
    ctx.save();
    if(starSpin) ctx.rotate(starAngle);
    let starR = R*0.28;

    ctx.beginPath();
    for(let i=0;i<5;i++){
        let o = i*(Math.PI*2/5) - Math.PI/2;
        let inner = o + Math.PI/5;
        ctx.lineTo(Math.cos(o)*starR, Math.sin(o)*starR);
        ctx.lineTo(Math.cos(inner)*(starR*0.45), Math.sin(inner)*(starR*0.45));
    }
    ctx.closePath();

    ctx.shadowColor="rgba(255,255,255,0.15)";
    ctx.shadowBlur=3;

    let sg = ctx.createRadialGradient(0,0,starR*0.1,0,0,starR);
    sg.addColorStop(0,"#ffffff");
    sg.addColorStop(1,"#757575");

    ctx.fillStyle = sg;
    ctx.fill();

    ctx.restore();
    ctx.restore();
}

function loop(){
    ctx.clearRect(0,0,canvas.width,canvas.height);
    drawShield();
    if(starSpin) starAngle += 0.045;
    requestAnimationFrame(loop);
}
loop();

// ------------------------------------------
// ⭐ MEASURE TEXT PROPERLY WITHOUT OVERLAP
// ------------------------------------------
const measureSpan = document.getElementById("measure");
measureSpan.style.fontSize = "38px";
measureSpan.style.fontFamily = "Cinzel, serif";

function getLetterWidth(char){
    measureSpan.textContent = char;
    return measureSpan.offsetWidth;
}

// ------------------------------------------
// ⭐ DIVINE VERSE REVEAL
// ------------------------------------------
const verse = "He counts the stars and calls them each by name — Psalm 147:4";
const beam = document.getElementById("beam");

canvas.addEventListener("click",(e)=>{
    let dx = e.clientX - shieldX;
    let dy = e.clientY - shieldY;
    if(Math.sqrt(dx*dx + dy*dy) < R*0.30){
        starSpin = true;
        showVerse();
    }
});

function showVerse(){
    beam.style.opacity = 1;

    let letters = [...verse];
    let totalWidth = letters.reduce((t,ch)=> t + getLetterWidth(ch), 0);
    let x = window.innerWidth/2 - totalWidth/2;

    letters.forEach((ch,i)=>{
        let w = getLetterWidth(ch);
        setTimeout(()=>{

            const el = document.createElement("div");
            el.className = "verse-letter";
            el.textContent = ch;
            el.style.left = x + "px";

            document.body.appendChild(el);

            setTimeout(()=>{
                el.style.opacity = 1;
                el.style.transform = "scale(1)";
            },20);

        }, i * 90);

        x += w;
    });
}

</script>

</body>
</html>
