<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GOD BLESS YOU — IMAX Nolan</title>

<style>
/* ------------------- IMAX / Nolan Grade ------------------- */
:root {
  --bg-top: #0a0a14;
  --bg-bottom: #020208;
  --gold: #f7dfb5;
  --glow-soft: rgba(255,220,150,0.35);
  --glow-strong: rgba(255,220,150,0.75);
}

/* ------------------- Reset ------------------- */
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  height: 100vh;
  background: linear-gradient(to bottom, var(--bg-top), var(--bg-bottom));
  color: var(--gold);
  font-family: "Cinzel", serif;
  overflow: hidden;
}

/* ------------------- IMAX Letterbox Bars ------------------- */
.top-bar, .bottom-bar {
  position: fixed;
  left: 0;
  width: 100%;
  height: 90px;
  background: rgba(0,0,0,0.88);
  backdrop-filter: blur(4px);
  z-index: 10;
}
.top-bar { top: 0; }
.bottom-bar { bottom: 0; }

/* ------------------- Text at Top Center ------------------- */
h1 {
  position: absolute;
  top: 110px; /* Slightly below top bar */
  left: 50%;
  transform: translateX(-50%);

  font-size: 3.8rem;
  font-weight: 600;
  letter-spacing: 7px;

  text-align: center;
  color: var(--gold);

  text-shadow:
    0 0 15px var(--glow-strong),
    0 0 30px var(--glow-soft);

  opacity: 0;
  animation: fadeIn 2.5s ease-out forwards;
}

/* ------------------- Text Reveal ------------------- */
@keyframes fadeIn {
  0% { opacity: 0; transform: translateX(-50%) translateY(-20px); }
  100% { opacity: 1; transform: translateX(-50%) translateY(0); }
}
</style>
</head>

<body>

<div class="top-bar"></div>

<h1>GOD BLESS YOU</h1>

<div class="bottom-bar"></div>

</body>
</html>
