<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ultra Cinematic Moon-to-Sun</title>

<style>
html,body{
  height:100%;
  margin:0;
  background:#000010;
  font-family:"Cinzel",serif;
  overflow:hidden;
}

/* SKY */
#sky{
  position:absolute;
  inset:0;
  background:linear-gradient(to bottom,#000010 0%,#150028 100%);
  transition:background 6s ease-in-out;
}

/* MOON */
#moon{
  position:absolute;
  top:80px;
  left:80px;
  width:160px;
  height:160px;
  background:radial-gradient(circle,#fff,#d9c180);
  border-radius:50%;
  box-shadow:0 0 120px #fff7;
  z-index:10;
  transition:transform 10s linear;
}

/* SUN */
#sun{
  position:absolute;
  bottom:-200px;
  right:50px;
  width:220px;
  height:220px;
  border-radius:50%;
  background:radial-gradient(circle,#ffcf6b,#ff9b00);
  box-shadow:0 0 160px #ffae;
  z-index:9;
  opacity:0;
  transition:all 6s ease-in-out;
}

/* CLOUDS */
.cloud{
  position:absolute;
  background:rgba(255,255,255,0.9);
  filter:blur(6px);
  border-radius:50%;
  opacity:0.8;
  animation: drift 22s linear infinite;
}
@keyframes drift{
  from{transform:translateX(-200px);}
  to{transform:translateX(100vw);}
}

/* MESSAGE (violet gradient + always visible) */
#message{
  position:absolute;
  width:100%;
  top:62%;
  text-align:center;
  z-index:20;

  background:linear-gradient(135deg,#9b30ff,#c678ff,#ffffff);
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
  background-clip:text;

  /* fallback to ensure ALWAYS visible */
  color:#ffffffcc;

  font-size:34px;
  letter-spacing:3px;
  font-weight:600;
  text-shadow:0 6px 20px rgba(0,0,0,0.45);
  padding:10px 0;
}

/* CLICK HERE BUTTON */
#clickBtn{
  position:absolute;
  top:calc(62% + 4rem);
  left:50%;
  transform:translateX(-50%);
  padding:12px 26px;
  background:#0048ff;
  color:white;
  font-size:18px;
  border:none;
  border-radius:10px;
  cursor:pointer;
  display:none;
  z-index:30;
  box-shadow:0 6px 20px rgba(0,0,0,0.5);
}
#clickBtn:hover{
  background:#0a64ff;
}

</style>
</head>

<body>

<div id="sky"></div>
<div id="moon"></div>
<div id="sun"></div>

<!-- Clouds -->
<div class="cloud" style="top:40%;left:-200px;width:180px;height:90px;"></div>
<div class="cloud" style="top:55%;left:-250px;width:220px;height:100px;"></div>
<div class="cloud" style="top:65%;left:-300px;width:260px;height:120px;"></div>

<!-- Visible Message -->
<div id="message">GOOD MORNING AKHIL 🌞</div>

<!-- Button -->
<button id="clickBtn">CLICK HERE</button>

<script>
/* TYPEWRITER REVEAL */
let msg = "GOOD MORNING AKHIL 🌞";
let messageEl = document.getElementById("message");
let btn = document.getElementById("clickBtn");

messageEl.textContent = ""; 
let i = 0;

function typeWriter(){
  if(i < msg.length){
    messageEl.textContent += msg.charAt(i);
    i++;
    setTimeout(typeWriter,70);
  } else {
    btn.style.display = "block";
  }
}
typeWriter();

/* CINEMATIC ANIMATION TRIGGER */
setTimeout(()=>{
  document.getElementById("sky").style.background =
    "linear-gradient(to bottom,#87ceeb,#b1e3ff,#e3f9ff)";

  document.getElementById("moon").style.opacity = 0;
  document.getElementById("sun").style.opacity = 1;
  document.getElementById("sun").style.bottom = "60px";
},3000);
</script>

</body>
</html>
