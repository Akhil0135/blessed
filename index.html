<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>God Bless Yoou — IMAX Nolan</title>

<style>
  /* ------------ IMAX / Nolan Palette ------------ */
  :root {
    --bg-1: #04040a;
    --bg-2: #0a0a18;
    --highlight: #f5d69c;
    --glow: rgba(255,220,150,0.45);
  }

  /* ------------ Reset ------------ */
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  body {
    height: 100vh;
    background: radial-gradient(circle at center, var(--bg-2), var(--bg-1));
    display: flex;
    justify-content: center;
    align-items: flex-start;
    overflow: hidden;
    color: var(--highlight);
    font-family: "Cinzel", serif;
  }

  /* ------------ Cinematic Letterbox Bars ------------ */
  .top-bar, .bottom-bar {
    position: fixed;
    left: 0;
    width: 100%;
    height: 70px;
    background: rgba(0,0,0,0.8);
    backdrop-filter: blur(2px);
    z-index: 99;
  }
  .top-bar { top: 0; }
  .bottom-bar { bottom: 0; }

  /* ------------ Title Text ------------ */
  h1 {
    position: absolute;
    top: 20px;
    font-size: 3rem;
    text-align: center;
    width: 100%;
    letter-spacing: 4px;
    text-shadow: 
      0 0 8px var(--glow),
      0 0 18px var(--glow);
    opacity: 0;
    transform: translateY(-20px);
    animation: fadeIn 3s ease-out forwards;
  }

  /* ------------ Film Grain ------------ */
  .grain {
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    pointer-events: none;
    background-image: url("https://i.imgur.com/4NJl9tP.png");
    opacity: 0.06;
    mix-blend-mode: overlay;
    animation: grainShift 0.8s steps(8) infinite;
  }

  @keyframes fadeIn {
    to {
      opacity: 1;
      transform: translateY(0);
    }
  }

  @keyframes grainShift {
    0% { transform: translate(0, 0); }
    100% { transform: translate(-10px, -10px); }
  }

</style>
</head>

<body>

<div class="top-bar"></div>
<h1>God Bless Yoou</h1>
<div class="bottom-bar"></div>
<div class="grain"></div>

</body>
</html>
