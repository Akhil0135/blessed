<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cinematic Night Sky with Spaceship Message</title>
<style>
  body, html {
    margin: 0;
    padding: 0;
    overflow: hidden;
    width: 100%;
    height: 100%;
    background: linear-gradient(to top, #0b0c2a, #1a1a3b);
    font-family: 'Segoe UI', sans-serif;
  }

  /* Stars */
  .star {
    position: absolute;
    border-radius: 50%;
    background: white;
    opacity: 0.8;
    box-shadow: 0 0 6px rgba(255,255,255,0.7);
    animation: twinkle 2s infinite alternate;
  }
  @keyframes twinkle {
    0% { opacity: 0.3; transform: scale(1); }
    50% { opacity: 1; transform: scale(1.5); }
    100% { opacity: 0.3; transform: scale(1); }
  }

  /* Moon */
  .moon {
    position: absolute;
    width: 120px;
    height: 120px;
    background: radial-gradient(circle, #fefbd8 0%, #f5e7a0 70%, #e0c97f 100%);
    border-radius: 50%;
    top: 50px;
    left: -150px;
    box-shadow: 0 0 30px 10px #fffacd;
    animation: moveMoon 60s linear infinite;
  }
  @keyframes moveMoon {
    0% { left: -150px; top: 80px; }
    50% { left: 50%; top: 120px; }
    100% { left: 100%; top: 80px; }
  }

  /* Clouds */
  .cloud {
    position: absolute;
    width: 250px;
    height: 100px;
    background: rgba(255,255,255,0.05);
    border-radius: 50%;
    filter: blur(20px);
    box-shadow: 0 0 30px rgba(255,255,255,0.05);
    animation: moveCloud linear infinite, morphCloud ease-in-out infinite alternate;
  }
  .cloud::before, .cloud::after {
    content: '';
    position: absolute;
    background: rgba(255,255,255,0.05);
    width: 150px;
    height: 80px;
    border-radius: 50%;
    filter: blur(20px);
  }
  .cloud::before { top: -30px; left: 50px; }
  .cloud::after { top: 20px; left: 100px; }
  @keyframes moveCloud { 0% { left: -300px; } 100% { left: 100%; } }
  @keyframes morphCloud { 0% { transform: scale(1,1); } 50% { transform: scale(1.1, 0.9); } 100% { transform: scale(1,1); } }

  /* Random shooting stars */
  .shooting-star {
    position: absolute;
    width: 12px;
    height: 4px;
    background: linear-gradient(180deg, rgba(255,255,255,0) 0%, white 100%);
    border-radius: 50%;
    opacity: 0;
    transform-origin: top left;
    animation: shoot 3s linear forwards;
  }
  @keyframes shoot {
    0% { transform: translate(0,0) rotate(-45deg); opacity: 1; }
    100% { transform: translate(-100vw, 100vh) rotate(-45deg); opacity: 0; }
  }

  /* Spaceship */
  .spaceship {
    position: absolute;
    width: 40px;
    height: 20px;
    background: #ccc;
    border-radius: 10px;
    box-shadow: 0 0 20px #fff, 0 0 30px #a0c4ff;
    transform-origin: center;
  }

  /* Spaceship flames */
  .flame {
    position: absolute;
    width: 8px;
    height: 12px;
    background: linear-gradient(to bottom, #fffa80, #ff4e00);
    border-radius: 50%;
    bottom: -6px;
    left: 50%;
    transform: translateX(-50%) scaleY(1);
    animation: flameAnim 0.2s infinite alternate;
  }
  @keyframes flameAnim {
    0% { transform: translateX(-50%) scaleY(1); opacity: 0.8; }
    100% { transform: translateX(-50%) scaleY(1.5); opacity: 1; }
  }

  /* Message */
  #centerMessage {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    font-size: 2rem;
    color: #ffffff;
    text-shadow: 0 0 10px #ffffff, 0 0 20px #a0c4ff, 0 0 30px #ffffff;
    opacity: 0;
    text-align: center;
    pointer-events: none;
    transition: opacity 2s ease-in-out;
  }

  /* Trail */
  .trail {
    position: absolute;
    width: 6px;
    height: 6px;
    background: rgba(255,255,255,0.8);
    border-radius: 50%;
    filter: blur(2px);
    pointer-events: none;
  }
</style>
</head>
<body>

<div class="moon"></div>
<div id="centerMessage">The night whispers secrets to those who listen...</div>

<script>
  // Stars
  for(let i=0;i<150;i++){
    const star=document.createElement('div');
    star.classList.add('star');
    star.style.top=Math.random()*window.innerHeight+'px';
    star.style.left=Math.random()*window.innerWidth+'px';
    star.style.width=star.style.height=Math.random()*3+1+'px';
    document.body.appendChild(star);
  }

  // Clouds
  for(let i=0;i<5;i++){
    const cloud=document.createElement('div');
    cloud.classList.add('cloud');
    cloud.style.top=Math.random()*300+'px';
    cloud.style.animationDuration=(40 + Math.random()*40)+'s, '+(6 + Math.random()*4)+'s';
    cloud.style.opacity = 0.05 + Math.random()*0.1;
    document.body.appendChild(cloud);
  }

  // Random shooting stars
  function createShootingStar(){
    const star=document.createElement('div');
    star.classList.add('shooting-star');
    star.style.top=Math.random()*200+'px';
    star.style.left=window.innerWidth+'px';
    const duration=2.5 + Math.random()*1;
    star.style.animationDuration=duration+'s';
    document.body.appendChild(star);
    setTimeout(()=>{ star.remove(); }, duration*1000);
  }
  setInterval(createShootingStar, 4000);

  // Spaceship
  const spaceship = document.createElement('div');
  spaceship.className = 'spaceship';
  const flame = document.createElement('div');
  flame.className = 'flame';
  spaceship.appendChild(flame);
  document.body.appendChild(spaceship);

  const message = document.getElementById('centerMessage');
  const trailParticles = [];

  function animateSpaceship() {
    const duration = 4000;
    const startX = -50;
    const startY = -50;
    const endX = window.innerWidth/2 - 20;
    const endY = window.innerHeight/2 - 10;

    let startTime = null;

    function step(timestamp){
      if(!startTime) startTime = timestamp;
      const progress = Math.min((timestamp - startTime)/duration,1);

      // Move spaceship
      const x = startX + (endX - startX)*progress;
      const y = startY + (endY - startY)*progress;
      spaceship.style.transform = `translate(${x}px, ${y}px) rotate(${progress*360}deg)`;

      // Add trail
      const trail = document.createElement('div');
      trail.className = 'trail';
      trail.style.left = x + 15 + 'px';
      trail.style.top = y + 10 + 'px';
      document.body.appendChild(trail);
      trailParticles.push(trail);

      // Remove old trails
      if(trailParticles.length>100){
        const old = trailParticles.shift();
        old.remove();
      }

      if(progress<1){
        requestAnimationFrame(step);
      } else {
        // Reveal message
        message.style.opacity = 1;
      }
    }
    requestAnimationFrame(step);
  }

  setTimeout(animateSpaceship, 3000);
</script>

</body>
</html>
