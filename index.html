<!-- Add this inside <body> -->
<div id="birthdayText">Happy Birthday</div>

<style>
@import url('https://fonts.googleapis.com/css2?family=Great+Vibes&display=swap');

#birthdayText {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%) scale(0);
  font-family: 'Great Vibes', cursive;
  font-size: 64px;
  color: #FFD700; /* bright golden */
  text-shadow: 0 0 15px #FFD700, 0 0 30px #FFEC8B;
  opacity: 0;
  z-index: 50; /* above everything else */
  transition: opacity 2s ease, transform 2s ease;
}

.show-text {
  opacity: 1;
  transform: translate(-50%, -50%) scale(1);
}
</style>

<script>
// Inside your existing click event for second click
const birthdayText = document.getElementById('birthdayText');

// Delay slightly after sun appears for smooth effect
setTimeout(() => {
  birthdayText.classList.add('show-text');
}, 1200); // 1.2 seconds after sun fade-in
</script>
