<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>IMAX — Nolan Cosmic • Shield Reveal — Birthday</title>
<style>
/* Reset */
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#030114;font-family:Inter,system-ui,Segoe UI,Roboto,'Helvetica Neue',Arial;color:#fff}
:root{--imax-letterbox:12vh;--accent:#e5f1ff}
.stage{position:fixed;inset:0;display:grid;place-items:center;overflow:hidden}
.letterbox-top,.letterbox-bottom{position:absolute;left:0;right:0;height:var(--imax-letterbox);background:linear-gradient(180deg,rgba(0,0,0,0.95),rgba(0,0,0,0.7));z-index:60;pointer-events:none}.letterbox-top{top:0}.letterbox-bottom{bottom:0}
.cosmic{position:absolute;inset:0;background:radial-gradient(very farthest-corner at 20% 20%,#0b1440 0%,transparent 10%),radial-gradient(very farthest-corner at 80% 80%,#2b0b2d 0%,transparent 12%),linear-gradient(180deg,#08061a 0%,#000 60%);transform-origin:center;z-index:1;filter:contrast(1.05) saturate(1.1)}
.nebula{position:absolute;inset:-10%;background:radial-gradient(circle at 30% 40%, rgba(255,120,160,0.08), transparent 12%),radial-gradient(circle at 75% 70%, rgba(80,150,255,0.06), transparent 12%);mix-blend-mode:screen;z-index:2;filter:blur(40px) saturate(1.4)}
.stars{position:absolute;inset:0;z-index:3;pointer-events:none;opacity:0.9}.stars:after{content:'';position:absolute;inset:0;background-image:radial-gradient(#fff 0.8px, transparent 1px),radial-gradient(#fff 0.6px, transparent 1px);background-size:400px 400px, 120px 120px;opacity:0.35;mix-blend-mode:screen;filter:blur(.2px)}
.grain{position:absolute;inset:0;z-index:70;pointer-events:none;mix-blend-mode:overlay;opacity:0.06;background-image:linear-gradient(0deg, rgba(255,255,255,0.02) 1px, transparent 1px);background-size:100% 3px}
.flare{position:absolute;left:-20%;top:10%;width:140%;height:40%;pointer-events:none;z-index:4;filter:blur(40px);opacity:0.7;background:linear-gradient(90deg,transparent 0%, rgba(255,255,255,0.035) 40%, rgba(255,255,255,0.12) 50%, rgba(255,255,255,0.035) 60%, transparent 100%);transform:rotate(-12deg)}
.shield-wrap{position:relative;z-index:10;display:grid;place-items:center;width:60vmin;height:60vmin;transform:translateZ(0)}
.shield-svg{width:100%;height:100%;transform-origin:center center;filter:drop-shadow(0 20px 60px rgba(0,0,0,0.7))}
.shield-enter{animation:shieldRise 2.6s cubic-bezier(.2,.9,.2,1) forwards, shieldBounce 0.9s 2.6s cubic-bezier(.2,.9,.2,1) both}@keyframes shieldRise{0%{transform:translateY(18vh) scale(.3) rotate(-10deg);opacity:0}60%{opacity:1;transform:translateY(-2vh) scale(1.05) rotate(6deg)}100%{transform:translateY(0) scale(1) rotate(0deg)}}@keyframes shieldBounce{0%{transform:translateY(0)}30%{transform:translateY(-1.2vh)}60%{transform:translateY(0)}100%{transform:translateY(0)}}
.sheen{position:absolute;inset:0;pointer-events:none;mix-blend-mode:screen}.sheen:before{content:'';position:absolute;inset:-40% -40% -40% -40%;background:linear-gradient(90deg, transparent 0%, rgba(255,255,255,0.04) 45%, rgba(255,255,255,0.12) 50%, rgba(255,255,255,0.04) 55%, transparent 100%);transform:translateX(-100%);animation:sheenMove 2.6s 2s cubic-bezier(.2,.9,.2,1) forwards}@keyframes sheenMove{to{transform:translateX(120%)}}
.title{position:absolute;bottom:calc(var(--imax-letterbox) + 6vh);left:50%;transform:translateX(-50%);text-align:center;z-index:30;pointer-events:none}.title .greeting{font-size:clamp(12px,1.6vmin,18px);letter-spacing:6px;color:rgba(230,240,255,0.8);text-transform:uppercase;font-weight:600;opacity:0;transform:translateY(8px);animation:greetIn 0.9s 3.6s cubic-bezier(.2,.9,.2,1) forwards}.title .name{font-family:"Cinzel",serif;font-weight:700;font-size:clamp(28px,4.6vmin,72px);letter-spacing:.02em;color:var(--accent);opacity:0;transform:translateY(18px) scale(.92);animation:nameIn 1s 3.9s cubic-bezier(.2,.9,.2,1) forwards}@keyframes greetIn{to{opacity:1;transform:translateY(0)}}@keyframes nameIn{to{opacity:1;transform:translateY(0) scale(1)}}
.hud{position:absolute;inset:0;z-index:20;pointer-events:none}.hud .scan{position:absolute;left:0;right:0;top:35%;height:0.6px;background:linear-gradient(90deg,transparent,rgba(255,255,255,0.06),transparent);opacity:0;animation:scanIn 1.2s 2.9s forwards}@keyframes scanIn{to{opacity:1}}
.caption{position:absolute;bottom:calc(var(--imax-letterbox) + 2vh);left:50%;transform:translateX(-50%);z-index:30;font-size:12px;color:rgba(200,220,255,0.6);letter-spacing:1px}
.bloom{position:absolute;inset:0;z-index:5;pointer-events:none;border-radius:50%;mix-blend-mode:screen;opacity:0.28;background:radial-gradient(circle at 50% 40%, rgba(255,200,100,0.03), transparent 10%)}
#shield-star{transform-box:fill-box;transform-origin:100px 100px;opacity:0;transform:scale(0) rotate(0deg);transition:transform 1.2s cubic-bezier(0.22,1,0.36,1),opacity 0.8s ease-out;cursor:pointer}
.star-particle{position:fixed;width:6px;height:6px;background:#3ec5ff;border-radius:50%;opacity:1;transition:transform 0.8s ease-out, opacity 0.8s ease-out}
</style>
</head>
<body>
<div class="stage">
  <div class="cosmic"></div>
  <div class="nebula"></div>
  <div class="stars"></div>
  <div class="flare"></div>
  <div class="bloom"></div>
  <div class="shield-wrap">
    <svg class="shield-svg" viewBox="0 0 200 200">
      <g id="rings" transform="translate(100,100)">
        <circle r="92" fill="#0b2340" />
        <circle r="76" fill="#d33a3a" />
        <circle r="56" fill="#ffffff" />
        <circle r="36" fill="#2b5ea6" />
      </g>
      <g id="starGroup" transform="translate(100,100)">
        <polygon id="shield-star" points="0,-28 6,-8 26,-6 10,6 14,26 0,14 -14,26 -10,6 -26,-6 -6,-8" fill="#fff" />
      </g>
    </svg>
    <div class="sheen"></div>
  </div>
  <div class="hud"><div class="scan"></div></div>
  <div class="title"><div class="greeting">Happy Birthday</div><div class="name" id="nameText">Someone</div></div>
  <div class="caption">An IMAX • Nolan-grade cosmic tribute</div>
  <div class="grain"></div>
  <div class="letterbox-top"></div>
  <div class="letterbox-bottom"></div>
</div>
<script>
const star = document.getElementById('shield-star');
if(star){
  // evolve from center of the circles
  setTimeout(()=>{ star.style.opacity=1; star.style.transform='scale(1) rotate(360deg)'; }, 1200);
  star.addEventListener('click', (event)=>{
    star.style.transition='transform 0.28s ease-out';
    star.style.transform='scale(1.05) rotate(720deg)';
    // particles
    for(let i=0;i<20;i++){
      const p=document.createElement('div'); p.className='star-particle'; p.style.left=event.clientX+'px'; p.style.top=event.clientY+'px'; document.body.appendChild(p);
      const angle=Math.random()*360; const dist=80+Math.random()*40;
      p.style.transform=`translate(${Math.cos(angle)*dist}px, ${Math.sin(angle)*dist}px)`; p.style.opacity='0';
      setTimeout(()=>p.remove(),800);
    }
    setTimeout(()=>{ star.style.transition='transform 1s cubic-bezier(0.22,1,0.36,1)'; star.style.transform='scale(1) rotate(0deg)'; }, 300);
  });
}
</script>
</body>
</html>
