<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aurora Borealis Message</title>
<style>
  body, html {
    margin: 0;
    padding: 0;
    overflow: hidden;
    width: 100%;
    height: 100%;
    background: linear-gradient(to top, #0b0c2a, #1a1a3b);
    font-family: 'Segoe UI', sans-serif;
  }

  /* Stars */
  .star {
    position: absolute;
    border-radius: 50%;
    background: white;
    opacity: 0.8;
    box-shadow: 0 0 6px rgba(255,255,255,0.7);
    animation: twinkle 2s infinite alternate;
  }
  @keyframes twinkle {
    0% { opacity: 0.3; transform: scale(1); }
    50% { opacity: 1; transform: scale(1.5); }
    100% { opacity: 0.3; transform: scale(1); }
  }

  /* Moving Moon */
  .moon {
    position: absolute;
    width: 120px;
    height: 120px;
    background: radial-gradient(circle, #fefbd8 0%, #f5e7a0 70%, #e0c97f 100%);
    border-radius: 50%;
    top: 50px;
    left: -150px;
    box-shadow: 0 0 30px 10px #fffacd;
    animation: moveMoon 60s linear infinite;
  }
  @keyframes moveMoon {
    0% { left: -150px; top: 50px; }
    50% { left: 50%; top: 100px; }
    100% { left: 100%; top: 50px; }
  }

  /* Clouds */
  .cloud {
    position: absolute;
    width: 250px;
    height: 100px;
    background: rgba(255, 255, 255, 0.05);
    border-radius: 50%;
    filter: blur(20px);
    box-shadow: 0 0 30px rgba(255,255,255,0.05);
    animation: moveCloud linear infinite, morphCloud ease-in-out infinite alternate;
  }
  .cloud::before, .cloud::after {
    content: '';
    position: absolute;
    background: rgba(255, 255, 255, 0.05);
    width: 150px;
    height: 80px;
    border-radius: 50%;
    filter: blur(20px);
  }
  .cloud::before { top: -30px; left: 50px; }
  .cloud::after { top: 20px; left: 100px; }
  @keyframes moveCloud { 0% { left: -300px; } 100% { left: 100%; } }
  @keyframes morphCloud { 0% { transform: scale(1,1); } 50% { transform: scale(1.1, 0.9); } 100% { transform: scale(1,1); } }

  /* Aurora */
  .aurora {
    position: absolute;
    width: 300%;
    height: 400px;
    background: linear-gradient(120deg, rgba(0,255,128,0.3), rgba(128,0,255,0.3), rgba(0,255,255,0.3));
    top: 50%;
    left: -100%;
    border-radius: 50%;
    filter: blur(80px);
    animation: moveAurora 20s linear infinite alternate;
  }
  @keyframes moveAurora {
    0% { left: -100%; transform: rotate(0deg); }
    100% { left: -50%; transform: rotate(5deg); }
  }

  /* Message */
  .message-letter {
    position: absolute;
    color: white;
    font-size: 2rem;
    text-shadow: 0 0 10px #fff, 0 0 20px #00ffcc;
    opacity: 0;
    pointer-events: none;
  }
</style>
</head>
<body>

<div class="moon"></div>
<div class="aurora"></div>

<script>
  // Stars
  for(let i=0;i<150;i++){
    const star=document.createElement('div');
    star.classList.add('star');
    star.style.top=Math.random()*window.innerHeight+'px';
    star.style.left=Math.random()*window.innerWidth+'px';
    star.style.width=star.style.height=Math.random()*3+1+'px';
    document.body.appendChild(star);
  }

  // Clouds
  for(let i=0;i<5;i++){
    const cloud=document.createElement('div');
    cloud.classList.add('cloud');
    cloud.style.top=Math.random()*300+'px';
    cloud.style.animationDuration=(40 + Math.random()*40)+'s, '+(6 + Math.random()*4)+'s';
    cloud.style.opacity = 0.05 + Math.random()*0.1;
    document.body.appendChild(cloud);
  }

  // Message
  const messageText = "The night whispers secrets...";
  const letters = [];
  messageText.split("").forEach((char,i)=>{
    const letter = document.createElement('div');
    letter.className = 'message-letter';
    letter.innerText = char;
    document.body.appendChild(letter);
    letters.push(letter);
  });

  // Animate letters with aurora sweep
  function animateLetters(){
    const centerX = window.innerWidth/2 - letters.length*7;
    const centerY = window.innerHeight/2;
    letters.forEach((letter,i)=>{
      setTimeout(()=>{
        letter.style.left = centerX + i*14 + "px";
        letter.style.top = centerY + "px";
        letter.style.opacity = 1;
      }, i*300); // gradual appearance
    });
  }

  setTimeout(animateLetters, 2000); // wait for aurora to sweep a bit
</script>

</body>
</html>
