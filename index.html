<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Constellation Message</title>
<style>
  body, html {
    margin: 0;
    padding: 0;
    overflow: hidden;
    width: 100%;
    height: 100%;
    background: linear-gradient(to top, #0b0c2a, #1a1a3b);
    font-family: 'Segoe UI', sans-serif;
  }

  .star {
    position: absolute;
    border-radius: 50%;
    background: white;
    opacity: 0.7;
    box-shadow: 0 0 6px rgba(255,255,255,0.7);
    width: 2px;
    height: 2px;
  }

  .letter-point {
    position: absolute;
    width: 4px;
    height: 4px;
    border-radius: 50%;
    background: #a0c4ff;
    opacity: 0;
    box-shadow: 0 0 10px #a0c4ff, 0 0 20px rgba(160,196,255,0.5);
  }

  canvas {
    position: absolute;
    top: 0;
    left: 0;
  }
</style>
</head>
<body>

<canvas id="lineCanvas"></canvas>

<script>
const canvas = document.getElementById('lineCanvas');
const ctx = canvas.getContext('2d');
canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

// Stars in background
for(let i=0;i<200;i++){
  const star = document.createElement('div');
  star.className = 'star';
  star.style.top = Math.random()*window.innerHeight+'px';
  star.style.left = Math.random()*window.innerWidth+'px';
  star.style.width = star.style.height = Math.random()*3+1+'px';
  document.body.appendChild(star);
}

// Message
const message = "Night whispers secrets";
const letters = message.split("");
const letterPoints = [];

// Create points for each letter
letters.forEach((char,i)=>{
  const point = document.createElement('div');
  point.className = 'letter-point';
  document.body.appendChild(point);
  // Arrange letters in center
  point.targetX = window.innerWidth/2 - letters.length*10 + i*20;
  point.targetY = window.innerHeight/2 + (Math.random()*20 - 10);
  point.style.left = Math.random()*window.innerWidth + 'px';
  point.style.top = Math.random()*window.innerHeight + 'px';
  letterPoints.push(point);
});

// Animate stars moving to form letters
function animatePoints(){
  ctx.clearRect(0,0,canvas.width,canvas.height);

  letterPoints.forEach(point=>{
    let x = parseFloat(point.style.left);
    let y = parseFloat(point.style.top);
    // Move slightly toward target
    let dx = (point.targetX - x) * 0.02;
    let dy = (point.targetY - y) * 0.02;
    x += dx;
    y += dy;
    point.style.left = x + 'px';
    point.style.top = y + 'px';
    point.style.opacity = 1;

    // Draw line to nearest neighbor for constellation effect
    letterPoints.forEach(other=>{
      if(other === point) return;
      let ox = parseFloat(other.style.left);
      let oy = parseFloat(other.style.top);
      let dist = Math.hypot(ox-x, oy-y);
      if(dist<50){
        ctx.beginPath();
        ctx.moveTo(x+2,y+2);
        ctx.lineTo(ox+2,oy+2);
        ctx.strokeStyle = 'rgba(160,196,255,0.4)';
        ctx.lineWidth = 1;
        ctx.stroke();
      }
    });
  });

  requestAnimationFrame(animatePoints);
}

animatePoints();
</script>

</body>
</html>
