<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IMAX Nolan Cinematic Scene</title>
<style>
html, body { margin:0; padding:0; width:100%; height:100%; background:#010108; overflow:hidden; font-family:'Cinzel', serif; }
#scene { position:relative; width:100%; height:100%; perspective:1000px; overflow:hidden; }
#gb { position:absolute; top:2%; width:100%; text-align:center; font-size:3rem; color:#fff; text-shadow:0 0 40px #fff, 0 0 80px #FFDFA0; z-index:15; }
#moon { position:absolute; top:10%; left:5%; width:150px; height:150px; border-radius:50%; background:radial-gradient(circle,#f7f7ff,#d5d2f4,#8c86c5); box-shadow:0 0 120px #C7C3FF, 0 0 250px rgba(200,200,255,0.3); cursor:grab; z-index:12; transition:opacity 0.5s linear, transform 0.5s linear; }
#sun { position:absolute; top:10%; right:5%; width:150px; height:150px; border-radius:50%; background:radial-gradient(circle,#FFE8A0,#FF8C00,#B45A00); box-shadow:0 0 350px rgba(255,165,90,0.85), 0 0 500px rgba(255,200,120,0.2); transform:scale(0); opacity:0; z-index:10; transition:opacity 1s linear, transform 1s linear; }
#message { position:absolute; bottom:20%; width:100%; text-align:center; font-size:1.6rem; color:#fff; letter-spacing:2px; opacity:0; z-index:15; text-shadow:0 0 10px rgba(255,255,255,0.4),0 0 25px rgba(255,240,200,0.25); transition:opacity 0.5s linear; }
.star { position:absolute; border-radius:50%; background:white; animation:twinkle 2s infinite alternate; z-index:1; opacity:0.3; }
@keyframes twinkle { 0%{opacity:0.2;} 50%{opacity:1;} 100%{opacity:0.2;} }
#bgGradient { position:absolute; top:0; left:0; width:100%; height:100%; background:linear-gradient(to bottom,#010108,#120430 75%); z-index:0; transition:background 1s linear; }
#fog { position:absolute; bottom:0; width:100%; height:50%; background:radial-gradient(circle at 50% 80%, rgba(255,255,255,0.08), transparent 70%); filter:blur(50px); opacity:0.25; z-index:5; transition:opacity 0.5s linear; }
</style>
</head>
<body>
<div id="scene">
  <div id="bgGradient"></div>
  <div id="gb">God Bless You</div>
  <div id="moon"></div>
  <div id="sun"></div>
  <div id="message">On this calm birthday eve so new, God softly whispers, my plans are made for you.</div>
  <div id="fog"></div>
</div>
<script>
const moon = document.getElementById('moon');
const sun = document.getElementById('sun');
const message = document.getElementById('message');
const bgGradient = document.getElementById('bgGradient');
const scene = document.getElementById('scene');

// Generate realistic twinkling stars
for(let i=0;i<400;i++){
  const star = document.createElement('div');
  star.className='star';
  let size = Math.random()*2+1;
  star.style.width = size+'px';
  star.style.height = size+'px';
  star.style.top = Math.random()*100+'%';
  star.style.left = Math.random()*100+'%';
  star.style.animationDuration = (0.5+Math.random()*3)+'s';
  star.style.opacity = Math.random()*0.6+0.2;
  star.style.transform = `scale(${Math.random()*1.2+0.8})`;
  scene.appendChild(star);
}

// Drag logic
let dragging = false;
let offsetX = 0;
let fullText = message.innerText;
message.innerText = '';
moon.addEventListener('mousedown',(e)=>{ dragging=true; offsetX=e.clientX - moon.offsetLeft; });
window.addEventListener('mouseup',()=>{ dragging=false; });
window.addEventListener('mousemove',(e)=>{
  if(!dragging) return;
  let dx = e.clientX - offsetX;
  if(dx<0) dx=0; if(dx>400) dx=400;
  moon.style.left = 5 + dx/scene.offsetWidth*90 + '%';

  let progress = dx/400;

  // Letter-by-letter reveal
  let charCount = Math.floor(fullText.length*progress);
  message.innerText = fullText.substring(0,charCount);
  message.style.opacity = progress;

  // Sun evolution (smoothed)
  sun.style.transform = `scale(${progress*6})`;
  sun.style.opacity = progress*0.98 + 0.02;

  // Moon fade
  moon.style.opacity = 1 - progress;

  // Background transition
  bgGradient.style.background = `linear-gradient(to bottom, #010108, rgba(18,4,48,${0.75*progress}) 75%)`;
});
</script>
</body>
</html>
