<style>
/* ---------- IMAX + NOLAN BACKGROUND ---------- */

body {
  margin: 0;
  overflow: hidden;
  background: black;
}

#imax-bg {
  position: fixed;
  inset: 0;
  overflow: hidden;
  z-index: -5;
}

/* --- IMAX Rolling Gradient --- */
#imax-gradient {
  position: absolute;
  inset: 0;
  background: linear-gradient(
    180deg,
    #120430 0%,   /* IMAX deep violet */
    #4A148C 45%,  /* cosmic purple */
    #FF6F00 100%  /* sunrise orange */
  );
  background-size: 100% 300%;
  animation: imaxRoll 18s linear infinite;
  opacity: 0.28; /* subtle, Nolan style */
}

/* --- Nolan Fog Layers --- */
.fog {
  position: absolute;
  inset: 0;
  background: radial-gradient(
    circle,
    rgba(255,255,255,0.06) 0%,
    rgba(255,255,255,0) 70%
  );
  animation: fogFloat 12s ease-in-out infinite;
  opacity: 0.18;
  filter: blur(80px);
}

.fog:nth-child(2) {
  animation-duration: 16s;
  opacity: 0.12;
}

/* --- IMAX Micro Particles --- */
#stars {
  position: absolute;
  inset: 0;
  background-image:
    radial-gradient(2px 2px at 20% 30%, rgba(255,255,255,0.7), transparent),
    radial-gradient(1px 1px at 80% 60%, rgba(255,255,255,0.7), transparent),
    radial-gradient(1.5px 1.5px at 40% 80%, rgba(255,255,255,0.7), transparent),
    radial-gradient(1px 1px at 60% 20%, rgba(255,255,255,0.7), transparent);
  background-size: 100% 100%;
  animation: starDrift 22s linear infinite;
  opacity: 0.38;
  filter: blur(0.4px);
}

/* --- Nolan Radial Core Light --- */
#core-light {
  position: absolute;
  inset: 0;
  background: radial-gradient(circle, 
    rgba(90, 0, 150, 0.45) 0%, 
    rgba(0,0,0,0) 70%
  );
  filter: blur(100px);
  opacity: 0.35;
  animation: corePulse 6s ease-in-out infinite;
}

/* --- Small IMAX Flash (for future trigger) --- */
#imax-flash {
  position: absolute;
  inset: 0;
  background: white;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.25s ease;
}

/* ---------- KEYFRAMES ---------- */

@keyframes imaxRoll {
  0% { background-position: 0% 0%; }
  100% { background-position: 0% 300%; }
}

@keyframes fogFloat {
  0% { transform: translateY(0px); }
  50% { transform: translateY(-40px); }
  100% { transform: translateY(0px); }
}

@keyframes starDrift {
  0% { transform: scale(1) translateY(0); }
  100% { transform: scale(1.2) translateY(-70px); }
}

@keyframes corePulse {
  0% { opacity: 0.30; }
  50% { opacity: 0.45; }
  100% { opacity: 0.30; }
}
</style>
