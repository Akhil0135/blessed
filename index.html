<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>IMAX Nolan Style Night→Day</title>
<style>
html, body {
  margin:0;
  height:100%;
  overflow:hidden;
  background:#000010;
  font-family: "Cinzel", serif;
  color:white;
}

/* ---------- SCENE ---------- */
#scene {
  position:relative;
  width:100%;
  height:100%;
  overflow:hidden;
}

/* ---------- SKY ---------- */
#sky {
  position:absolute;
  inset:0;
  background:linear-gradient(to bottom,#030014,#120034 40%,#1a0046 70%);
  transition: background 2s ease;
}

/* ---------- CLOUDS ---------- */
.cloud {
  position:absolute;
  background: rgba(255,255,255,0.05);
  border-radius:50%;
  width:200px;
  height:60px;
  top:10%;
  left:-200px;
  animation: cloudMove linear infinite;
}
@keyframes cloudMove {
  0% {left:-300px;}
  100% {left:110%;}
}

/* ---------- STARS ---------- */
.star {
  position:absolute;
  background:white;
  border-radius:50%;
  opacity:0.8;
}
.firefly {
  position:absolute;
  width:4px;
  height:4px;
  background:rgba(255,255,100,0.8);
  border-radius:50%;
  box-shadow:0 0 8px rgba(255,255,150,0.5);
  animation: fly 3s infinite alternate;
}
@keyframes fly {
  0% {transform: translate(0,0);}
  100% {transform: translate(20px,20px);}
}

/* ---------- SHOOTING STAR ---------- */
.shooting {
  position:absolute;
  width:2px;
  height:100px;
  background:linear-gradient(45deg,white,transparent);
  top:20%;
  left:30%;
  transform: rotate(45deg) translateX(-200px);
  animation: shoot 2s linear infinite;
}
@keyframes shoot {
  0% {transform: rotate(45deg) translateX(-200px); opacity:1;}
  100% {transform: rotate(45deg) translateX(800px); opacity:0;}
}

/* ---------- MOON ---------- */
#moon {
  position:absolute;
  width:180px;
  height:180px;
  border-radius:50%;
  background:#d9d8ff;
  box-shadow:0 0 50px #c5c4ff, 0 0 150px #a39fff;
  top:30%;
  left:20%;
  cursor:pointer;
  transform: translate(-50%,-50%) rotate(0deg);
  z-index:10;
}

/* ---------- SUN ---------- */
#sun {
  position:absolute;
  width:300px;
  height:300px;
  border-radius:50%;
  background: radial-gradient(circle,#ffd27f,#ff9a00);
  box-shadow:0 0 170px #ffb54c,0 0 300px #ff7b00;
  top:5%;
  right:5%;
  opacity:0;
  transform: scale(0.3);
  transition: transform 2s ease, opacity 2s ease;
}

/* ---------- MESSAGE ---------- */
#msg {
  position:absolute;
  width:80%;
  bottom:15%;
  left:10%;
  font-size:2rem;
  font-weight:700;
  text-align:center;
  color:#c38bff;
  text-shadow:0 0 15px #8e3fff;
  opacity:0;
}

/* ---------- CLICK BUTTON ---------- */
#btn {
  position:absolute;
  left:50%;
  bottom:5%;
  transform:translateX(-50%);
  padding:14px 34px;
  font-size:1.25rem;
  border:none;
  border-radius:16px;
  background:linear-gradient(to right,#6a00ff,#c200ff);
  color:white;
  cursor:pointer;
  box-shadow:0 0 20px #9400ff;
  opacity:0;
  transition:opacity 1s ease;
}

/* ---------- CHRISTIAN CROSS ---------- */
#cross {
  position:absolute;
  left:50%;
  top:15%;
  transform: translateX(-50%) scale(0);
  opacity:0;
  width:0;
  height:0;
  pointer-events:none;
  z-index:20;
}
.cross-vertical {
  position:absolute;
  left:50%;
  transform:translateX(-50%);
  width:25px;
  height:260px;
  background:#ffdd00;
  box-shadow:0 0 60px #ffe500, 0 0 150px #ffd700;
}
.cross-horizontal {
  position:absolute;
  left:50%;
  top:calc(260px*0.35);
  transform:translateX(-50%);
  width:180px;
  height:25px;
  background:#ffdd00;
  box-shadow:0 0 60px #ffe500,0 0 150px #ffd700;
}

/* ---------- DAY SKY ---------- */
.daySky {
  background: linear-gradient(to bottom,#52d3ff,#ffe6ab 60%,#ffd37c 90%);
  transition: background 2s ease;
}
</style>
</head>
<body>
<div id="scene">

  <div id="sky"></div>

  <!-- Clouds -->
  <div class="cloud" style="top:10%;width:250px;height:70px;animation-duration:70s;"></div>
  <div class="cloud" style="top:25%;width:180px;height:50px;animation-duration:90s;"></div>
  <div class="cloud" style="top:40%;width:220px;height:60px;animation-duration:80s;"></div>

  <!-- Stars -->
  <div id="stars"></div>
  <div class="shooting"></div>
  <div class="firefly" style="top:50%;left:30%;"></div>
  <div class="firefly" style="top:60%;left:50%;"></div>

  <div id="moon"></div>
  <div id="sun"></div>

  <div id="msg"></div>
  <button id="btn">Click Here</button>

  <div id="cross">
    <div class="cross-vertical"></div>
    <div class="cross-horizontal"></div>
  </div>

</div>

<script>
const moon = document.getElementById("moon");
const sun = document.getElementById("sun");
const msg = document.getElementById("msg");
const btn = document.getElementById("btn");
const cross = document.getElementById("cross");
const sky = document.getElementById("sky");

const messageText = "On this calm birthday eve so new, God softly whispers, my plans are made for you.";

let angle = 0;
let evolutionDone = false;
let rotating = false;
let msgRevealed = "";

// ---------- Pointer Only on Moon ----------
moon.addEventListener("pointerdown", (e)=>{
  rotating = true;
});
document.addEventListener("pointerup", (e)=>{
  rotating = false;
});
document.addEventListener("pointermove", (e)=>{
  if(!rotating) return;

  // calculate rotation based on horizontal movement
  const rect = moon.getBoundingClientRect();
  const cx = rect.left + rect.width/2;
  const cy = rect.top + rect.height/2;
  const dx = e.clientX - cx;
  const dy = e.clientY - cy;
  let theta = Math.atan2(dy,dx) * (180/Math.PI);
  if(theta < 0) theta += 360;

  angle = theta;
  moon.style.transform = `translate(-50%,-50%) rotate(${angle}deg)`;

  // Reveal message proportional to angle
  let lettersToShow = Math.floor(messageText.length*(angle/360));
  msgRevealed = messageText.slice(0, lettersToShow);
  msg.textContent = msgRevealed;
  msg.style.opacity = 1;

  // Sun rises proportional to angle
  sun.style.opacity = angle/360;
  sun.style.transform = `scale(${0.3 + 0.7*(angle/360)})`;

  // Sky transitions gradually
  if(angle > 30){
    sky.classList.add("daySky");
  }

  // Full evolution check
  if(angle >= 360 && !evolutionDone){
    evolutionDone = true;
    rotating = false;
    setTimeout(()=> btn.style.opacity = 1, 600);
  }
});

// ---------- Button Click → Cross Reveal ----------
btn.addEventListener("click", ()=>{
  btn.style.opacity = 0;
  setTimeout(()=>btn.style.display="none",700);

  cross.style.opacity = 1;
  cross.style.transform = "translateX(-50%) scale(1.3)";
  setTimeout(()=> cross.style.transform = "translateX(-50%) scale(1)",2000);
});

// ---------- Generate stars dynamically ----------
const starsContainer = document.getElementById("stars");
for(let i=0;i<120;i++){
  let star = document.createElement("div");
  star.classList.add("star");
  let size = Math.random()*2+1;
  star.style.width = size+"px";
  star.style.height = size+"px";
  star.style.top = Math.random()*100+"%";
  star.style.left = Math.random()*100+"%";
  starsContainer.appendChild(star);
}

</script>
</body>
</html>
