<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>PRINCE Cinematic</title>
<style>
    body,html{
        margin:0;
        padding:0;
        overflow:hidden;
        background:black;
        font-family:Arial, sans-serif;
    }
    #loading{
        position:absolute;
        top:50%;
        left:50%;
        transform:translate(-50%,-50%);
        color:white;
        font-size:22px;
        letter-spacing:3px;
    }
</style>
</head>
<body>

<div id="loading">Loading...</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r152/three.min.js"></script>
<script src="https://threejs.org/examples/js/loaders/FontLoader.js"></script>
<script src="https://threejs.org/examples/js/geometries/TextGeometry.js"></script>

<script>
let scene, camera, renderer;
let princeText = "PRINCE";
let princeLetters = [];
let loadedFont;
let nebulaMat;

init();

function init(){
    scene = new THREE.Scene();

    camera = new THREE.PerspectiveCamera(
        55,
        window.innerWidth/window.innerHeight,
        1,
        5000
    );
    camera.position.z = 600;

    renderer = new THREE.WebGLRenderer({antialias:true});
    renderer.setSize(window.innerWidth, window.innerHeight);
    document.body.appendChild(renderer.domElement);

    const light = new THREE.PointLight(0xffffff, 2);
    light.position.set(0,0,500);
    scene.add(light);

    const amb = new THREE.AmbientLight(0x888888, 2);
    scene.add(amb);

    nebulaMat = new THREE.MeshStandardMaterial({
        color:0x88aaff,
        metalness:0.6,
        roughness:0.35
    });

    const fontLoader = new THREE.FontLoader();
    fontLoader.load(
        "https://threejs.org/examples/fonts/helvetiker_bold.typeface.json",
        f=>{
            loadedFont = f;
            createPrinceLetters();
            startRevealAnimation();
            document.getElementById("loading").style.display="none";
        }
    );

    animate();
}

function createPrinceLetters(){
    const size = 150;  
    const height = 15;

    let letterWidths = [];
    let totalWidth = 0;

    for(let i=0;i<princeText.length;i++){
        let geo = new THREE.TextGeometry(princeText[i],{
            font: loadedFont,
            size: size,
            height: height,
            bevelEnabled:true,
            bevelThickness:5,
            bevelSize:3
        });
        geo.computeBoundingBox();
        const w = geo.boundingBox.max.x - geo.boundingBox.min.x;
        letterWidths.push(w);
        totalWidth += w;
    }

    const spacing = 20;  
    totalWidth += spacing * (princeText.length - 1);
    let xOffset = -totalWidth/2;

    for(let i=0;i<princeText.length;i++){
        let geo = new THREE.TextGeometry(princeText[i],{
            font: loadedFont,
            size: size,
            height: height,
            bevelEnabled:true,
            bevelThickness:5,
            bevelSize:3
        });

        geo.computeBoundingBox();
        geo.center();

        let mesh = new THREE.Mesh(geo, nebulaMat);
        mesh.position.x = xOffset + letterWidths[i]/2;
        mesh.position.y = 0;
        mesh.position.z = -800;
        mesh.scale.set(0.1,0.1,0.1);
        mesh.material.transparent = true;
        mesh.material.opacity = 0;

        princeLetters.push(mesh);
        scene.add(mesh);

        xOffset += letterWidths[i] + spacing;
    }
}

async function startRevealAnimation(){
    for(let i=0;i<princeLetters.length;i++){
        let mesh = princeLetters[i];
        mesh.visible = true;

        for(let s=0;s<=1;s+=0.04){
            mesh.material.opacity = s;
            mesh.scale.set(0.1 + s*0.9, 0.1 + s*0.9, 0.1 + s*0.9);
            await sleep(18);
        }
        await sleep(120);
    }
}

function sleep(ms){
    return new Promise(res=>setTimeout(res,ms));
}

function animate(){
    requestAnimationFrame(animate);
    renderer.render(scene,camera);
}
</script>
</body>
</html>
