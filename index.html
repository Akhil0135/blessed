<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>IMAX Nolan — Cross Dominating the Sun</title>
<style>
  html,body{
    margin:0;
    height:100%;
    background:#000;
    overflow:hidden;
    font-family:"Cinzel",serif;
  }

  /* Sun cinematic */
  #sun{
    position:absolute;
    top:50%;left:50%;
    width:260px;height:260px;
    border-radius:50%;
    background:radial-gradient(circle, #ffddaa 0%, #ffbb66 40%, #d47a20 75%, #000 100%);
    transform:translate(-50%,-50%) scale(1.2);
    filter:brightness(1.3) blur(1px) saturate(1.4);
    box-shadow:0 0 200px #ffb850,0 0 380px #ff9e3d inset;
    transition:opacity 1.6s ease;
  }

  /* IMAX Nolan cross */
  #cross{
    position:absolute;
    top:22%; left:50%;
    width:5px;
    height:200px;
    background:rgba(255,255,255,0.96);
    border-radius:3px;
    transform:translate(-50%,-50%) scale(0.75);
    opacity:0;
    transition:opacity 1.9s ease, transform 1.9s ease;
    filter:drop-shadow(0 0 18px rgba(255,255,255,0.9)) drop-shadow(0 0 40px rgba(255,255,255,0.8));
    z-index:20;
  }
  #cross::before{
    content:"";
    position:absolute;
    top:40%; left:50%;
    width:120px;height:5px;
    background:rgba(255,255,255,0.96);
    border-radius:3px;
    transform:translateX(-50%);
    filter:drop-shadow(0 0 14px rgba(255,255,255,0.85));
  }

  /* Click button */
  #clickBtn{
    position:absolute;
    bottom:8%; left:50%;
    transform:translateX(-50%);
    padding:14px 34px;
    font-size:22px;
    color:white;
    background:rgba(255,255,255,0.08);
    border:1px solid rgba(255,255,255,0.35);
    border-radius:12px;
    cursor:pointer;
    letter-spacing:1px;
    text-transform:uppercase;
    transition:opacity 1s ease;
    backdrop-filter:blur(6px);
  }

  #birthdayOverlay{
    position:absolute;
    top:0;left:0;
    width:100%;height:100%;
    background:rgba(0,0,0,0.55);
    opacity:0;
    transition:opacity 2s ease;
    pointer-events:none;
  }

  #happy{
    position:absolute;
    top:50%;left:50%;
    transform:translate(-50%,-50%) scale(0.7);
    font-size:58px;
    color:white;
    opacity:0;
    letter-spacing:3px;
    transition:opacity 1.6s ease, transform 1.6s ease;
    text-shadow:0 0 20px white,0 0 55px #ffbb55;
  }

  #birthdayFinalMessage{
    position:absolute;
    top:50%;left:50%;
    transform:translate(-50%,-50%) scale(0.75);
    font-size:46px;
    color:#ffdcae;
    opacity:0;
    letter-spacing:3px;
    transition:opacity 1.8s ease, transform 1.8s ease;
    text-shadow:0 0 20px #ffb970,0 0 55px #ff9c40;
  }
</style>
</head>
<body>

<div id="sun"></div>
<div id="cross"></div>
<div id="birthdayOverlay"></div>
<div id="happy">Happy Birthday</div>
<div id="birthdayFinalMessage">May God Bless You Endlessly</div>
<button id="clickBtn">Click here</button>

<script>
let clickStage = 0;
const clickBtn = document.getElementById("clickBtn");

function spawnFireworks(){
  const f=document.createElement("div");
  f.style.position="absolute";
  f.style.width="4px";
  f.style.height="4px";
  f.style.background="white";
  f.style.borderRadius="50%";
  f.style.left=Math.random()*100+"%";
  f.style.top=Math.random()*100+"%";
  f.style.opacity=1;
  f.style.transform="scale(1)";
  f.style.transition="transform 1.2s ease, opacity 1.2s ease";
  document.body.appendChild(f);
  setTimeout(()=>{
    f.style.transform="scale(18)";
    f.style.opacity=0;
  },50);
  setTimeout(()=>f.remove(),1500);
}

clickBtn.onclick = () => {
  if (clickStage === 0) {
    clickBtn.style.opacity = 0;
    clickBtn.style.pointerEvents = "none";

    const cross = document.getElementById("cross");
    setTimeout(() => {
      cross.style.opacity = 1;
      cross.style.transform = "translate(-50%, -50%) scale(1)";
    }, 600);

    const overlay = document.getElementById("birthdayOverlay");
    const happy = document.getElementById("happy");

    setTimeout(() => overlay.style.opacity = 1, 1800);
    setTimeout(() => {
      happy.style.opacity = 1;
      happy.style.transform = "translate(-50%, -50%) scale(1)";
    }, 2600);

    setInterval(spawnFireworks, 1200);

    setTimeout(() => {
      clickBtn.innerText = "Click here";
      clickBtn.style.opacity = 1;
      clickBtn.style.pointerEvents = "auto";
    }, 3600);

    clickStage = 1;
  }

  else if (clickStage === 1) {
    clickBtn.style.opacity = 0;
    clickBtn.style.pointerEvents = "none";

    const birthdayMessage = document.getElementById("birthdayFinalMessage");
    birthdayMessage.style.opacity = 1;
    birthdayMessage.style.transform = "translate(-50%, -50%) scale(1)";

    clickStage = 2;
  }
};
</script>
</body>
</html>
