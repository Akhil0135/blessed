<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>IMAX PRINCE Cinematic</title>
<style>
    html, body {
        margin: 0;
        padding: 0;
        overflow: hidden;
        background: #000;
    }
    canvas {
        display: block;
    }
</style>
</head>
<body>
<canvas id="c"></canvas>

<script>
const canvas = document.getElementById("c");
const ctx = canvas.getContext("2d");

function resize() {
    canvas.width = innerWidth;
    canvas.height = innerHeight;
}
resize();
onresize = resize;

// ------------------- BACKGROUND STAR FIELD -------------------
const stars = [];
const starCount = 180;

for (let i = 0; i < starCount; i++) {
    stars.push({
        x: Math.random() * canvas.width,
        y: Math.random() * canvas.height,
        size: Math.random() * 1.2 + 0.3,
        tw: Math.random() * 0.015 + 0.003
    });
}

function drawStars() {
    stars.forEach(s => {
        let glow = (Math.sin(Date.now() * s.tw) + 1) * 0.5 * 0.8;
        ctx.fillStyle = `rgba(255,255,255,${glow})`;
        ctx.beginPath();
        ctx.arc(s.x, s.y, s.size, 0, Math.PI * 2);
        ctx.fill();
    });
}

// ------------------- TEXT MAPPING (PRINCE) -------------------
const text = "PRINCE";

const tCanvas = document.createElement("canvas");
const tCtx = tCanvas.getContext("2d");

function mapText() {
    let fontSize = canvas.width / 7;
    tCanvas.width = canvas.width;
    tCanvas.height = canvas.height;

    tCtx.clearRect(0, 0, tCanvas.width, tCanvas.height);
    tCtx.fillStyle = "#fff";
    tCtx.font = "900 " + fontSize + "px Arial Black";
    tCtx.textAlign = "center";
    tCtx.textBaseline = "middle";
    tCtx.fillText(text, tCanvas.width / 2, tCanvas.height / 2);

    let data = tCtx.getImageData(0, 0, tCanvas.width, tCanvas.height).data;
    const pts = [];

    for (let y = 0; y < tCanvas.height; y += 6) {
        for (let x = 0; x < tCanvas.width; x += 6) {
            let i = (y * tCanvas.width + x) * 4;
            if (data[i + 3] > 200) pts.push({ x, y });
        }
    }
    return pts;
}

let points = mapText();

// ------------------- PARTICLES FOR PRINCE -------------------
const particles = points.map(p => ({
    x: Math.random() * canvas.width,
    y: Math.random() * canvas.height,
    tx: p.x,
    ty: p.y,
    size: Math.random() * 2 + 1.3,
    speed: Math.random() * 0.06 + 0.04,
    hue: Math.random() * 360 // color
}));

// ------------------- IMAX FOG LAYER -------------------
function drawFog() {
    let gradient = ctx.createRadialGradient(
        canvas.width / 2, canvas.height / 2, canvas.width * 0.1,
        canvas.width / 2, canvas.height / 2, canvas.width * 0.8
    );
    gradient.addColorStop(0, "rgba(255,255,255,0.04)");
    gradient.addColorStop(1, "rgba(0,0,0,0)");

    ctx.fillStyle = gradient;
    ctx.fillRect(0, 0, canvas.width, canvas.height);
}

// ------------------- CAMERA ZOOM-IN -------------------
let zoom = 1;
function applyZoom() {
    zoom += 0.00015;
    ctx.save();
    ctx.translate(canvas.width / 2, canvas.height / 2);
    ctx.scale(zoom, zoom);
    ctx.translate(-canvas.width / 2, -canvas.height / 2);
}

// ------------------- ANIMATION -------------------
function animate() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    // Camera Zoom layer
    applyZoom();

    // Background twinkling stars
    drawStars();

    // PRINCE glowing particles
    particles.forEach(p => {
        p.x += (p.tx - p.x) * p.speed;
        p.y += (p.ty - p.y) * p.speed;

        let pulse = (Math.sin(Date.now() * 0.004) + 1) * 0.5 + 0.4;

        ctx.beginPath();
        ctx.fillStyle = `hsla(${p.hue},100%,60%,${pulse})`;
        ctx.shadowColor = `hsla(${p.hue},100%,70%,1)`;
        ctx.shadowBlur = 10;
        ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
        ctx.fill();
    });

    ctx.restore();

    // Fog layer
    drawFog();

    requestAnimationFrame(animate);
}

animate();
</script>
</body>
</html>
