<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shooting Star Rain with Particle Explosion</title>
<style>
  body, html {
    margin: 0;
    padding: 0;
    overflow: hidden;
    width: 100%;
    height: 100%;
    background: linear-gradient(to top, #0b0c2a, #1a1a3b);
    font-family: 'Segoe UI', sans-serif;
  }

  /* Stars */
  .star {
    position: absolute;
    border-radius: 50%;
    background: white;
    opacity: 0.8;
    box-shadow: 0 0 6px rgba(255,255,255,0.7);
    animation: twinkle 2s infinite alternate;
  }
  @keyframes twinkle {
    0% { opacity: 0.3; transform: scale(1); }
    50% { opacity: 1; transform: scale(1.5); }
    100% { opacity: 0.3; transform: scale(1); }
  }

  /* Shooting Star */
  .shooting-star {
    position: absolute;
    width: 6px;
    height: 2px;
    background: linear-gradient(0deg, rgba(255,255,255,0) 0%, white 100%);
    border-radius: 50%;
    opacity: 0.9;
    transform-origin: top left;
  }

  /* Particle */
  .particle {
    position: absolute;
    width: 4px;
    height: 4px;
    background: yellow;
    border-radius: 50%;
    opacity: 0.9;
    pointer-events: none;
    box-shadow: 0 0 10px yellow, 0 0 20px rgba(255,255,0,0.5);
  }

  /* Message letters */
  .message-letter {
    position: absolute;
    color: white;
    font-size: 2rem;
    text-shadow: 0 0 10px #fff, 0 0 20px #a0c4ff;
    opacity: 0;
    pointer-events: none;
  }
</style>
</head>
<body>

<script>
  // Stars
  for(let i=0;i<150;i++){
    const star=document.createElement('div');
    star.classList.add('star');
    star.style.top=Math.random()*window.innerHeight+'px';
    star.style.left=Math.random()*window.innerWidth+'px';
    star.style.width=star.style.height=Math.random()*3+1+'px';
    document.body.appendChild(star);
  }

  // Message
  const messageText = "The night whispers secrets...";
  const letters = [];
  messageText.split("").forEach((char,i)=>{
    const letter = document.createElement('div');
    letter.className = 'message-letter';
    letter.innerText = char;
    document.body.appendChild(letter);
    letters.push(letter);
  });

  // Function to create a shooting star
  function createShootingStar(index){
    const star = document.createElement('div');
    star.className = 'shooting-star';
    document.body.appendChild(star);

    const startX = window.innerWidth + Math.random()*100;
    const startY = Math.random()*window.innerHeight/2;
    const endX = window.innerWidth/2 - letters.length*7 + index*14;
    const endY = window.innerHeight/2;

    const duration = 1000 + Math.random()*800;
    const startTime = performance.now();

    function step(now){
      const elapsed = now - startTime;
      const t = Math.min(elapsed/duration,1);

      // Diagonal fall with slight curve
      const x = startX + (endX - startX)*t;
      const y = startY + (endY - startY)*t + Math.sin(t*Math.PI)*50;
      star.style.left = x + "px";
      star.style.top = y + "px";

      if(t < 1){
        requestAnimationFrame(step);
      } else {
        star.remove();
        createParticles(endX, endY, letters[index]);
      }
    }

    requestAnimationFrame(step);
  }

  // Particle explosion to reveal letter
  function createParticles(x, y, letter){
    const particleCount = 20;
    for(let i=0;i<particleCount;i++){
      const p = document.createElement('div');
      p.className = 'particle';
      document.body.appendChild(p);
      let angle = Math.random()*2*Math.PI;
      let distance = 20 + Math.random()*20;
      let duration = 800 + Math.random()*500;
      const startTime = performance.now();
      function move(now){
        const elapsed = now - startTime;
        const t = Math.min(elapsed/duration,1);
        p.style.left = x + Math.cos(angle)*distance*t + "px";
        p.style.top = y + Math.sin(angle)*distance*t + "px";
        p.style.opacity = 1 - t;
        if(t < 1){
          requestAnimationFrame(move);
        } else {
          p.remove();
        }
      }
      requestAnimationFrame(move);
    }
    // Reveal the letter after particles
    setTimeout(()=>{
      letter.style.left = x + "px";
      letter.style.top = y + "px";
      letter.style.opacity = 1;
    }, 400);
  }

  // Start cinematic shooting star rain
  messageText.split("").forEach((_,i)=>{
    setTimeout(()=>{ createShootingStar(i); }, i*300);
  });

</script>

</body>
</html>
