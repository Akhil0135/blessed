<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>IMAX Nolan Phase 1 → 2 Day Evolution</title>
<style>
    body {
        margin: 0;
        padding: 0;
        overflow: hidden;
        user-select: none;
        background: #000;
        font-family: "Georgia", serif;
    }
    canvas {
        position: absolute;
        inset: 0;
        z-index: -1;
    }
    #moon {
        position: absolute;
        width: 150px;
        height: 150px;
        border-radius: 50%;
        background: radial-gradient(circle, #fff 0%, #e0e0e0 30%, #bfbfbf 80%);
        box-shadow: 0 0 60px 20px rgba(255,255,255,0.25),
                    0 0 120px 50px rgba(100,120,255,0.12);
        top: 60px;
        left: 60px;
        cursor: grab;
        z-index: 10;
        transition: opacity 2s ease;
    }
    #msgBox {
        position: fixed;
        bottom: 55px;
        left: 50%;
        transform: translateX(-50%);
        white-space: nowrap;
        font-size: 16px;
        font-weight: bold;
        color: #d8e2ff;
        letter-spacing: 1.5px;
        text-shadow: 0 0 12px rgba(150,190,255,0.7);
        z-index: 50;
    }
    #msgBox span {
        opacity: 0;
        transition: opacity 0.22s ease, color 2s ease;
    }
    #msgBox span.show {
        opacity: 1;
    }
</style>
</head>
<body>

<canvas id="starCanvas"></canvas>
<div id="moon"></div>
<div id="msgBox"></div>

<script>
// ------------------ Canvas & Stars ------------------
const canvas = document.getElementById("starCanvas");
const ctx = canvas.getContext("2d");
let width = canvas.width = window.innerWidth;
let height = canvas.height = window.innerHeight;

window.addEventListener("resize", ()=>{
    width = canvas.width = window.innerWidth;
    height = canvas.height = window.innerHeight;
});

const starCount = 300;
const stars = [];
for(let i=0;i<starCount;i++){
    stars.push({
        x: Math.random()*width,
        y: Math.random()*height,
        size: Math.random()*1.5+0.3,
        twinkle: Math.random()*0.02+0.002,
        baseAlpha: Math.random()*0.5+0.3,
        depth: Math.random()*0.7+0.3
    });
}

// ------------------ Message Setup ------------------
const moon = document.getElementById("moon");
const msgBox = document.getElementById("msgBox");
const text = "On this calm birthday eve so new, God softly whispers, my plans are made for you.";

msgBox.innerHTML = "";
for(let c of text){
    let s = document.createElement("span");
    s.textContent = c;
    msgBox.appendChild(s);
}
const spans = msgBox.querySelectorAll("span");

let dragging = false;
let offsetX = 0;
let lastShown = 0;
let locked = false;
let transitionPhase2 = false;
let moonOpacity = 1;
let starOpacity = 1;
let sunProgress = 0;

// ------------------ Moon Drag ------------------
moon.addEventListener("mousedown", e=>{
    dragging = true;
    offsetX = e.clientX - moon.offsetLeft;
    moon.style.transition = "none";
});
window.addEventListener("mouseup", ()=> dragging = false);
window.addEventListener("mousemove", e=>{
    if(!dragging) return;
    let x = e.clientX - offsetX;
    const maxX = window.innerWidth - moon.clientWidth - 20;
    if(x<20) x=20;
    if(x>maxX) x=maxX;
    moon.style.left = x + "px";

    // Reveal text progressively
    if(!locked){
        let progress = (x-20)/(maxX-20);
        if(progress<0) progress=0;
        if(progress>1) progress=1;
        let target = Math.floor(progress*spans.length);
        if(target>lastShown){
            for(let i=lastShown;i<target;i++){
                spans[i].classList.add("show");
            }
            lastShown = target;
            if(lastShown >= spans.length) locked = true;
        }
    }

    // Start transition when moon reaches the far right
    if(x >= maxX && !transitionPhase2){
        transitionPhase2 = true;
    }
});

// ------------------ Animate ------------------
function animate(){
    // ---------------- Background ----------------
    let bg;
    if(transitionPhase2){
        const t = sunProgress;
        // bluish-white sky gradient
        const topColor = `rgba(${200 + 55*(1-t)},${225 + 30*(1-t)},${255},1)`;
        const bottomColor = `rgba(${180 + 75*(1-t)},${220 + 30*(1-t)},${255},1)`;
        bg = ctx.createLinearGradient(0,0,0,height);
        bg.addColorStop(0, topColor);
        bg.addColorStop(1, bottomColor);
    } else {
        bg = ctx.createLinearGradient(0,0,0,height);
        bg.addColorStop(0,'#000010');
        bg.addColorStop(1,'#000022');
    }
    ctx.fillStyle = bg;
    ctx.fillRect(0,0,width,height);

    // ---------------- Stars ----------------
    stars.forEach(s=>{
        let alpha = s.baseAlpha + Math.sin(Date.now()*s.twinkle)*0.5;
        if(transitionPhase2){
            alpha *= starOpacity;
        }
        ctx.fillStyle = `rgba(255,255,255,${alpha*s.depth})`;
        ctx.beginPath();
        ctx.arc(s.x, s.y, s.size, 0, Math.PI*2);
        ctx.fill();
    });

    // ---------------- Sun ----------------
    if(transitionPhase2){
        sunProgress += 0.004;
        if(sunProgress>1) sunProgress=1;

        // Bigger, cinematic sun
        const sunRadius = sunProgress*Math.min(width,height)*0.25; // big sun
        const sunX = width*0.8;
        const sunY = height*0.25;

        const halo = ctx.createRadialGradient(sunX, sunY, sunRadius*0.2, sunX, sunY, sunRadius*2.5);
        halo.addColorStop(0,'rgba(255,220,130,0.9)');
        halo.addColorStop(1,'rgba(255,150,50,0)');
        ctx.fillStyle = halo;
        ctx.beginPath();
        ctx.arc(sunX, sunY, sunRadius*2.5,0,Math.PI*2);
        ctx.fill();

        ctx.fillStyle = "#ffc966";
        ctx.beginPath();
        ctx.arc(sunX, sunY, sunRadius,0,Math.PI*2);
        ctx.fill();

        // Text color transition to dark blue
        const colorVal = Math.floor(216*(1-sunProgress));
        msgBox.querySelectorAll("span").forEach(s=>{
            s.style.color = `rgb(0,0,${50+colorVal})`;
        });
    }

    // ---------------- Fade moon & stars ----------------
    if(transitionPhase2){
        moonOpacity -= 0.01;
        starOpacity -= 0.008;
        if(moonOpacity<0) moonOpacity=0;
        if(starOpacity<0) starOpacity=0;
        moon.style.opacity = moonOpacity;
    }

    requestAnimationFrame(animate);
}

animate();
</script>
</body>
</html>
