<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>IMAX Cinematic Full</title>

<style>
html,body{margin:0;padding:0;overflow:hidden;background:#000;}
canvas{display:block}

/* ---------- Stage 1 ---------- */
#stage1{position:relative;width:100%;height:100%}
#stage1 #instruction{position:absolute;top:20px;width:100%;text-align:center;font-size:22px;color:#fff;z-index:5}
#stage1 #message{position:absolute;bottom:80px;width:100%;text-align:center;font-size:26px;color:#ffd27f;opacity:0;transition:opacity 1.5s;z-index:5}
#stage1 #sun{position:absolute;width:260px;height:260px;border-radius:50%;background:radial-gradient(circle,#fff7c0,#ffcc33,#000);top:-300px;right:-300px;opacity:0;transition:all 2.5s;z-index:3}
#stage1 #moon{position:absolute;width:200px;height:200px;left:40px;top:40px;border-radius:50%;cursor:grab;background:radial-gradient(circle,#d9d9d9,#2a2a2a);z-index:5}
#stage1 #ambient{position:absolute;width:100%;height:100%;background:radial-gradient(circle at 50% 70%,rgba(30,60,150,.25),transparent);z-index:1}

/* ---------- Stage 2 ---------- */
#stage2{display:none;position:absolute;width:100%;height:100%}
#stage2 #instruction{position:absolute;top:20px;width:100%;text-align:center;font-size:22px;color:#fff;z-index:5}
#stage2 #verse{position:absolute;top:40px;left:50%;transform:translateX(-50%) scale(.2);font-size:32px;color:#ffe9a6;opacity:0;transition:1s;z-index:5}

/* ---------- Stage 3 ---------- */
#stage3{display:none;position:absolute;width:100%;height:100%}
#clickBtn{position:absolute;bottom:40px;left:50%;transform:translateX(-50%);padding:15px 30px;font-size:20px;font-weight:bold;background:linear-gradient(90deg,#ff0066,#ffcc00,#00ccff);border:none;border-radius:10px;color:#fff;cursor:pointer;opacity:0;transition:opacity 1s;z-index:1000}

/* ---------- Phase 4 ---------- */
#phase4{display:none}
</style>
</head>

<body>

<!-- STAGE 1 -->
<div id="stage1">
<div id="instruction">Drag the moon to the end</div>
<canvas id="stars"></canvas>
<div id="ambient"></div>
<div id="moon"></div>
<div id="sun"></div>
<div id="message">ON THIS CALM BIRTHDAY EVE SO NEW, GOD SOFTLY WHISPERS, MY PLANS ARE MADE FOR YOU.</div>
<audio id="whoosh" src="https://cdn.pixabay.com/download/audio/2021/09/16/audio_4f1c1c9f28.mp3"></audio>
</div>

<!-- STAGE 2 -->
<div id="stage2">
<div id="instruction">Click the star at the center of the shield</div>
<canvas id="shieldCanvas"></canvas>
<div id="verse">He counts the stars and calls them each by name — Psalm 147:4</div>
</div>

<!-- STAGE 3 -->
<div id="stage3">
<canvas id="c"></canvas>
<button id="clickBtn">Click Here</button>
</div>

<!-- PHASE 4 -->
<div id="phase4"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/examples/js/loaders/FontLoader.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/examples/js/geometries/TextGeometry.js"></script>

<script>
/* ===== YOUR ORIGINAL SCRIPT ===== */
/* (UNCHANGED — EXACT COPY) */
/* STAGE 1, 2, 3 CODE CONTINUES HERE */
/* ... YOUR CODE REMAINS EXACT ... */
</script>

<script>
/* ========================= */
/* PHASE 4 — YOUR CODE */
/* ========================= */

function startPhase4(){
  document.getElementById("stage3").style.display="none";
  document.getElementById("phase4").style.display="block";

  let scene=new THREE.Scene();
  scene.fog=new THREE.FogExp2(0x000000,0.0012);

  let camera=new THREE.PerspectiveCamera(60,innerWidth/innerHeight,0.1,3000);
  camera.position.set(0,50,400);

  let renderer=new THREE.WebGLRenderer({antialias:true});
  renderer.setSize(innerWidth,innerHeight);
  renderer.setPixelRatio(devicePixelRatio);
  document.getElementById("phase4").appendChild(renderer.domElement);

  let starsGeo=new THREE.BufferGeometry();
  let count=2500;
  let arr=new Float32Array(count*3);
  for(let i=0;i<arr.length;i++)arr[i]=(Math.random()-.5)*3000;
  starsGeo.setAttribute("position",new THREE.BufferAttribute(arr,3));
  let stars=new THREE.Points(starsGeo,new THREE.PointsMaterial({color:0xffffff,size:2.2}));
  scene.add(stars);

  let ambient=new THREE.AmbientLight(0x666666,.5);scene.add(ambient);
  let key=new THREE.PointLight(0x99ccff,2,2000);key.position.set(180,200,140);scene.add(key);
  let warm=new THREE.PointLight(0xffddaa,1.8,2000);warm.position.set(-120,160,-80);scene.add(warm);

  let loader=new THREE.FontLoader();
  loader.load("https://threejs.org/examples/fonts/helvetiker_bold.typeface.json",font=>{
    let geo=new THREE.TextGeometry("HAPPY BIRTHDAY PRINCE",{font,size:40,height:6});
    geo.center();
    let mat=new THREE.MeshStandardMaterial({color:0xffd98c,emissive:0xffaa33});
    let mesh=new THREE.Mesh(geo,mat);
    mesh.position.y=150;
    scene.add(mesh);
  });

  function animate(){
    requestAnimationFrame(animate);
    stars.rotation.y+=0.0005;
    camera.lookAt(0,50,0);
    renderer.render(scene,camera);
  }
  animate();
}

/* FINAL BUTTON → PHASE 4 */
document.addEventListener("click",e=>{
  if(e.target.innerText==="Click Here" && document.getElementById("stage3").style.display==="block"){
    startPhase4();
  }
});
</script>

</body>
</html>
