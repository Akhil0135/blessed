<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cinematic Saree Girl Walk</title>

<style>
  /* --- Reset --- */
  * {margin:0; padding:0; box-sizing:border-box;}

  body, html {
    width:100%;
    height:100%;
    overflow:hidden;
    background:#000;
    font-family: 'Georgia', serif;
  }

  /* --- Cinematic Background --- */
  .scene {
    width:100%;
    height:100vh;
    background: linear-gradient(#0a0f1d, #12203a, #1b324d);
    position: relative;
    overflow:hidden;
  }

  /* --- Cinematic Fog --- */
  .fog {
    position:absolute;
    width:200%;
    height:100%;
    background: radial-gradient(circle at 50% 50%, rgba(255,255,255,0.15), transparent 60%);
    animation: fogMove 20s linear infinite;
  }
  @keyframes fogMove {
    0% {transform: translateX(-20%);}
    100% {transform: translateX(20%);}
  }

  /* --- Ground --- */
  .ground {
    position: absolute;
    bottom:0;
    width:100%;
    height:30%;
    background: linear-gradient(#0d2617, #06140c);
  }

  /* --- Trees Parallax --- */
  .trees {
    position:absolute;
    bottom:10%;
    width:200%;
    height:40%;
    background:url('https://i.imgur.com/Qvx5Qp5.png') repeat-x;
    background-size:contain;
    animation: treeMove 18s linear infinite;
    opacity:0.7;
  }
  @keyframes treeMove {
    0% {transform: translateX(0);}
    100% {transform: translateX(-50%);}
  }

  /* --- Girl Walking (SVG shape) --- */
  .girl {
    position:absolute;
    bottom:18%;
    left:20%;
    transform: translateY(0);
    animation: girlWalk 1.8s steps(6) infinite,
               girlFloat 4s ease-in-out infinite alternate;
  }

  @keyframes girlFloat {
    0% {transform: translateY(0);}
    100% {transform: translateY(-5px);}
  }

  /* walk cycle */
  @keyframes girlWalk {
    0% {background-position: 0 0;}
    100% {background-position: -900px 0;}
  }

  .girl {
    width:150px;
    height:300px;
    background-image:url('https://i.imgur.com/mXzL6Qh.png'); /* Saree-walk sprite */
    background-size:900px 300px;
  }

  /* Cinematic letterboxing (black bars) */
  .bars {
    position: fixed;
    left:0; width:100%;
    height:12%;
    background:black;
    z-index: 99;
  }
  .bar-top {top:0;}
  .bar-bottom {bottom:0;}
</style>
</head>

<body>
<div class="bars bar-top"></div>
<div class="bars bar-bottom"></div>

<div class="scene">
  <div class="fog"></div>
  <div class="trees"></div>
  <div class="girl"></div>
  <div class="ground"></div>
</div>

</body>
</html>
