<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Captain America Shield — Verse Reveal</title>

<style>
    body{
        margin:0;
        height:100vh;
        background: radial-gradient(circle at center, #020203, #000000 70%);
        display:flex;
        justify-content:center;
        align-items:center;
        overflow:hidden;
        font-family: "Cinzel", serif;
    }

    /* Container */
    .scene {
        position: relative;
        width: 260px;
        height: 260px;
        cursor: pointer;
    }

    /* Shield */
    .shield {
        width: 100%;
        height: 100%;
        border-radius: 50%;
        background:
            radial-gradient(circle, #d40000 0%, #b00000 40%, #7a0000 70%),
            radial-gradient(circle, #ffffff 0%, #e6e6e6 60%, #bfbfbf 100%);
        box-shadow: 0 0 40px #ff000033;
        display:flex;
        justify-content:center;
        align-items:center;
        position: relative;
        transition: opacity 0.8s ease-out;
    }

    /* Star */
    .star {
        width: 95px;
        height: 95px;
        background: white;
        clip-path: polygon(
            50% 0%,
            61% 35%,
            98% 35%,
            68% 57%,
            79% 91%,
            50% 70%,
            21% 91%,
            32% 57%,
            2% 35%,
            39% 35%
        );
        filter: drop-shadow(0 0 4px #66aaff55); /* 🌟 Reduced glow here */
        transition: filter 0.5s ease-out;
    }

    /* Rotation only after click */
    .rotate {
        animation: spin 2.5s linear forwards;
    }
    @keyframes spin {
        from { transform: rotate(0deg) scale(1); }
        to { transform: rotate(720deg) scale(1.1); }
    }

    /* Verse */
    .verse {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%) scale(0.1);
        color: #ffffff;
        font-size: 26px;
        opacity: 0;
        text-align:center;
        transition: transform 1.8s ease-out, opacity 1.5s ease-out, top 1.8s ease-out;
        pointer-events:none;
        letter-spacing: 1px;
        text-shadow: 0 0 10px #ffffff33;
    }

    .verse.show {
        opacity: 1;
        transform: translate(-50%, -50%) scale(1.4);
        top: 10%;
    }
</style>
</head>
<body>

<div class="scene" onclick="reveal()">
    <div class="shield" id="shield">
        <div class="star" id="star"></div>
    </div>

    <div class="verse" id="verse">
        **"THE POWER TO RISE  
        COMES FROM WITHIN."**
    </div>
</div>

<script>
    let clicked = false;

    function reveal(){
        if(clicked) return;
        clicked = true;

        // Rotate the star
        document.getElementById("star").classList.add("rotate");

        // Fade shield after rotation starts
        setTimeout(()=>{
            document.getElementById("shield").style.opacity = 0;
        }, 900);

        // Show verse zooming out of star
        setTimeout(()=>{
            document.getElementById("verse").classList.add("show");
        }, 1100);
    }
</script>

</body>
</html>
