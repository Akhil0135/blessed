<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>IMAX — Nolan Cosmic • Shield Reveal — Birthday</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#01010b;font-family:Inter,system-ui,Segoe UI,Roboto,'Helvetica Neue',Arial;color:#fff;overflow:hidden}
:root{--imax-letterbox:12vh;--accent:#e5f1ff}
.stage{position:fixed;inset:0;display:grid;place-items:center;overflow:hidden}
/* Dynamic Background */
.background{position:absolute;inset:0;z-index:1;overflow:hidden}
.nebula-layer{position:absolute;inset:-40%;mix-blend-mode:screen;filter:blur(200px) saturate(3);animation:nebulaDrift linear infinite;opacity:1}
.nebula1{background:radial-gradient(circle at 20% 40%, rgba(255,90,140,0.9), transparent 40%);animation-duration:120s;}
.nebula2{background:radial-gradient(circle at 80% 60%, rgba(90,150,255,0.8), transparent 45%);animation-duration:150s;}
.nebula3{background:radial-gradient(circle at 50% 50%, rgba(120,220,255,0.7), transparent 50%);animation-duration:180s;}
@keyframes nebulaDrift{0%{transform:translate(0,0) scale(1)}50%{transform:translate(300px,-200px) scale(1.3)}100%{transform:translate(0,0) scale(1)}}
.stars{position:absolute;inset:0;z-index:2;pointer-events:none;opacity:1;background-image:radial-gradient(#fff 1.2px, transparent 1px),radial-gradient(#fff 0.8px, transparent 1px);background-size:400px 400px, 120px 120px;filter:blur(.4px);animation:starDrift 200s linear infinite, starTwinkle 5s infinite alternate;}
@keyframes starTwinkle{0%{opacity:0.75}50%{opacity:0.95}100%{opacity:0.8}}
@keyframes starDrift{0%{transform:translate(0,0)}100%{transform:translate(-200px,150px)}}
.bloom{position:absolute;inset:0;z-index:3;pointer-events:none;border-radius:50%;mix-blend-mode:screen;opacity:0.3;background:radial-gradient(circle at 50% 40%, rgba(255,200,100,0.05), transparent 15%)}
.particles{position:absolute;inset:0;z-index:4;pointer-events:none;}
.particle{position:absolute;width:3px;height:3px;background:#fff;opacity:0.5;border-radius:50%;animation:particleDrift linear infinite;}
@keyframes particleDrift{0%{transform:translate(0,0)}100%{transform:translate(var(--x),var(--y))}}
/* Shield */
.shield-wrap{position:relative;z-index:10;display:grid;place-items:center;width:60vmin;height:60vmin;transform:translateZ(0)}
.shield-svg{width:100%;height:100%;transform-origin:center center;filter:drop-shadow(0 20px 60px rgba(0,0,0,0.7))}
#shield-star{transform-box:fill-box;transform-origin:center center;opacity:0;transform:scale(0) rotate(0deg);transition:transform 1.2s cubic-bezier(0.22,1,0.36,1),opacity 0.8s ease-out;cursor:pointer}
/* Shield steel look */
#rings circle:nth-child(1){fill:#b00a0a; stroke:#880000; stroke-width:3;} /* outer red */
#rings circle:nth-child(2){fill:#fff; stroke:#ccc; stroke-width:2;}     /* white */
#rings circle:nth-child(3){fill:#d33a3a; stroke:#880000; stroke-width:1.5;}/* inner red */
#rings circle:nth-child(4){fill:#2b5ea6; stroke:#1a3b70; stroke-width:1;} /* smallest blue */
.particles, .bloom{mix-blend-mode:screen;}
/* Cosmic Rays */
.cosmic-rays{position:absolute;inset:0;z-index:2;mix-blend-mode:screen;pointer-events:none;overflow:hidden}
.ray{position:absolute;width:2px;height:180vmax;left:50%;top:50%;background:linear-gradient(to bottom, rgba(255,255,255,0.9), rgba(255,200,80,0.0));opacity:0.25;transform-origin:center center;animation:raySpin linear infinite;filter:blur(2px)}
@keyframes raySpin{0%{transform:translate(-50%,-50%) rotate(0deg)}100%{transform:translate(-50%,-50%) rotate(360deg)}}
</style>
</head>
<body>
<div class="stage">
  <div class="background">
    <div class="nebula-layer nebula1"></div>
    <div class="nebula-layer nebula2"></div>
    <div class="nebula-layer nebula3"></div>
    <div class="stars"></div>
    <div class="bloom"></div>
    <div class="particles"></div>
    <div class="cosmic-rays" id="rays"></div>
  </div>
  <div class="shield-wrap">
    <svg class="shield-svg" viewBox="0 0 200 200">
      <g id="rings" transform="translate(100,100)">
        <circle r="92" />
        <circle r="76" />
        <circle r="56" />
        <circle r="36" />
      </g>
      <g id="starGroup" transform="translate(100,100)">
        <polygon id="shield-star" points="0,-28 6,-8 26,-6 10,6 14,26 0,14 -14,26 -10,6 -26,-6 -6,-8" fill="#fff" />
      </g>
    </svg>
  </div>
</div>

<script>
// Stars twinkle dynamically (already in CSS animation)
const rays=document.getElementById('rays');
for(let i=0;i<18;i++){
  const r=document.createElement('div');
  r.className='ray';
  r.style.animationDuration=(20+i*2)+'s';
  r.style.transform=`translate(-50%,-50%) rotate(${i*20}deg)`;
  rays.appendChild(r);
}

// Particles
const particleContainer=document.querySelector('.particles');
for(let i=0;i<120;i++){
  const p=document.createElement('div');
  p.className='particle';
  p.style.setProperty('--x', (Math.random()*400-200)+'px');
  p.style.setProperty('--y', (Math.random()*400-200)+'px');
  p.style.left=Math.random()*100+'%';
  p.style.top=Math.random()*100+'%';
  p.style.animationDuration=(60+Math.random()*60)+'s';
  particleContainer.appendChild(p);
}

// Star spin and shield crack
const star = document.getElementById('shield-star');

function shatterShield(){
  const rings=document.querySelectorAll('#rings circle');
  rings.forEach((c,i)=>{
    c.style.transition='transform 1s ease-out, opacity 1s ease-out';
    c.style.transform=`translate(${(Math.random()-0.5)*60}px, ${(Math.random()-0.5)*60}px) rotate(${(Math.random()-0.5)*720}deg)`;
    c.style.opacity='0';
  });
}

if(star){
  setTimeout(()=>{ star.style.opacity=1; star.style.transform='scale(1) rotate(0deg)'; }, 1200);
  star.addEventListener('click', ()=>{
    star.style.transition='transform 0.5s linear';
    star.style.transform='scale(1) rotate(1080deg)';

    // Trigger shield crack after spin
    setTimeout(()=>{ 
      star.style.transition='transform 1s cubic-bezier(0.22,1,0.36,1)';
      star.style.transform='scale(1) rotate(0deg)';
      shatterShield();
    },500);
  });
}
</script>
</body>
</html>
