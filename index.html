<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Realistic Night Scene</title>

<style>
  body {
    margin: 0;
    height: 100vh;
    background: linear-gradient(to bottom, #0a0f24 0%, #000814 70%, #000000 100%);
    overflow: hidden;
    position: relative;
  }

  /* Moon (Crescent) */
  .moon {
    position: absolute;
    top: 80px;
    right: 120px;
    width: 160px;
    height: 160px;
    border-radius: 50%;
    background: white;
    box-shadow: 0 0 60px #ffffffaa, 0 0 140px #ffffff66;
    /* Crescent effect */
    clip-path: path('M 80 0 A 80 80 0 1 0 80 160 A 55 80 0 1 1 80 0 Z');
}

  .moon::after {
    content: "";
    position: absolute;
    top: 0;
    left: 35px; /* controls crescent thickness */
    width: 150px;
    height: 150px;
    border-radius: 50%;
    background: #000814;
  }

  /* Stars */ */
  .star {
    position: absolute;
    width: 2px;
    height: 2px;
    background: #ffffff;
    border-radius: 50%;
    opacity: 0.8;
    animation: twinkle 2.5s infinite ease-in-out;
  }

  @keyframes twinkle {
    0% { opacity: 0.2; }
    50% { opacity: 1; }
    100% { opacity: 0.2; }
  }

  /* Christian Cross */
  .cross {
    position: absolute;
    top: 40px;
    left: 60px;
    width: 160px;
    height: 260px;
}

  .vertical {
    position: absolute;
    top: 0;
    left: 50%;
    transform: translateX(-50%);
    width: 32px;
    height: 260px;
    background: linear-gradient(to bottom, #f2d27f, #d4a93f, #b88a2c);
}

  .horizontal {
    position: absolute;
    top: 91px; /* 35% of 260px */
    left: 50%;
    transform: translateX(-50%);
    width: 200px;
    height: 32px;
    background: linear-gradient(to right, #f2d27f, #d4a93f, #b88a2c);
}
</style>
</head>
<body>

<div class="moon"></div>
<div class="cross">
  <div class="vertical"></div>
  <div class="horizontal"></div>
</div>

<script>
// Generate stars
for (let i = 0; i < 250; i++) {
  const star = document.createElement('div');
  star.classList.add('star');
  star.style.top = Math.random() * window.innerHeight + 'px';
  star.style.left = Math.random() * window.innerWidth + 'px';
  star.style.animationDelay = Math.random() * 3 + 's';
  document.body.appendChild(star);
}
</script>

</body>
</html>
