<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Golden Cross to Moon</title>
<style>
  body {
    margin: 0;
    height: 100vh;
    background-color: #001f3f; /* navy blue */
    overflow: hidden;
    position: relative;
  }

  /* Cross */
  .cross {
    position: absolute;
    top: 50px;
    left: 50%;
    transform: translateX(-50%);
    width: 20px;
    height: 100px;
  }

  .cross::before {
    content: '';
    position: absolute;
    top: 0;
    left: 50%;
    transform: translateX(-50%);
    width: 20px;
    height: 100px;
    background-color: gold;
    box-shadow: 0 0 2px gold;
  }

  .cross::after {
    content: '';
    position: absolute;
    top: 40%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 60px;
    height: 20px;
    background-color: gold;
    box-shadow: 0 0 2px gold;
  }

  /* Button */
  #clickButton {
    position: absolute;
    top: 200px;
    left: 50%;
    transform: translateX(-50%);
    padding: 10px 25px;
    font-size: 18px;
    background-color: gold;
    color: #001f3f;
    border: none;
    border-radius: 5px;
    cursor: pointer;
    display: none;
    z-index: 10;
  }

  /* Moon */
  .moon {
    position: absolute;
    top: 50px;
    right: 50px;
    width: 120px;
    height: 120px;
    background-color: white;
    border-radius: 50%;
    box-shadow: 0 0 30px rgba(255,255,255,0.5);
    opacity: 0;
    transition: opacity 2s ease;
    z-index: 5;
  }

  /* Stars */
  .stars {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    z-index: 1;
    opacity: 0;
    transition: opacity 2s ease;
  }

  .star {
    position: absolute;
    background-color: white;
    border-radius: 50%;
    opacity: 0.8;
    animation: twinkle 2s infinite alternate;
  }

  @keyframes twinkle {
    0% { opacity: 0.2; transform: scale(0.5); }
    50% { opacity: 1; transform: scale(1); }
    100% { opacity: 0.2; transform: scale(0.5); }
  }
</style>
</head>
<body>
  <div class="cross"></div>
  <button id="clickButton">Click Here</button>

  <div class="moon" id="moon"></div>
  <div class="stars" id="stars"></div>

<script>
  const button = document.getElementById('clickButton');

  // Show initial button after 3 seconds
  setTimeout(() => {
    button.style.display = 'block';
  }, 3000);

  // Generate bigger stars
  const starsContainer = document.getElementById('stars');
  const numStars = 100;
  for (let i = 0; i < numStars; i++) {
    const star = document.createElement('div');
    star.className = 'star';
    star.style.top = Math.random() * 100 + '%';
    star.style.left = Math.random() * 100 + '%';
    const size = Math.random() * 4 + 2; // bigger stars
    star.style.width = size + 'px';
    star.style.height = size + 'px';
    star.style.animationDuration = (Math.random() * 3 + 2) + 's';
    starsContainer.appendChild(star);
  }

  // Button click event
  button.addEventListener('click', () => {
    // Hide button
    button.style.display = 'none';

    // Show moon and stars
    document.getElementById('moon').style.opacity = '1';
    document.getElementById('stars').style.opacity = '1';

    // Show button again after 7 seconds
    setTimeout(() => {
      button.style.display = 'block';
    }, 7000);
  });
</script>
</body>
</html>
