<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>IMAX — Nolan Cosmic • Shield Shatter</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#01010b;font-family:Inter,system-ui,Segoe UI,Roboto,'Helvetica Neue',Arial;color:#fff;overflow:hidden}
.stage{position:fixed;inset:0;display:grid;place-items:center;overflow:hidden}

/* Dynamic Background */
.background{position:absolute;inset:0;z-index:1;overflow:hidden}
.stars{position:absolute;inset:0;z-index:2;pointer-events:none;opacity:1;background-image:radial-gradient(#fff 1.2px, transparent 1px),radial-gradient(#fff 0.8px, transparent 1px);background-size:400px 400px, 120px 120px;filter:blur(.4px);animation:starTwinkle 5s infinite alternate;}
@keyframes starTwinkle{0%{opacity:0.75}50%{opacity:0.95}100%{opacity:0.8}}

/* Shield */
.shield-wrap{position:relative;z-index:10;display:grid;place-items:center;width:60vmin;height:60vmin;transform:translateZ(0)}
.shield-svg{width:100%;height:100%;transform-origin:center center;filter:drop-shadow(0 20px 60px rgba(0,0,0,0.7))}

/* Steel shield layers */
#rings circle:nth-child(1){fill:#b00a0a; stroke:#880000; stroke-width:3;}
#rings circle:nth-child(2){fill:#fff; stroke:#ccc; stroke-width:2;}
#rings circle:nth-child(3){fill:#d33a3a; stroke:#880000; stroke-width:1.5;}
#rings circle:nth-child(4){fill:#2b5ea6; stroke:#1a3b70; stroke-width:1;}

/* Star */
#shield-star{transform-box:fill-box;transform-origin:center center;opacity:0;transform:scale(0);cursor:pointer;fill:#fff;transition:transform 1.2s cubic-bezier(0.22,1,0.36,1),opacity 0.8s ease-out;}
</style>
</head>
<body>
<div class="stage">
  <div class="background">
    <div class="stars"></div>
  </div>
  <div class="shield-wrap">
    <svg class="shield-svg" viewBox="0 0 200 200">
      <g id="rings" transform="translate(100,100)">
        <circle r="92" />
        <circle r="76" />
        <circle r="56" />
        <circle r="36" />
      </g>
      <g id="starGroup" transform="translate(100,100)">
        <polygon id="shield-star" points="0,-28 6,-8 26,-6 10,6 14,26 0,14 -14,26 -10,6 -26,-6 -6,-8" />
      </g>
    </svg>
  </div>
</div>

<script>
// Star and shield
const star = document.getElementById('shield-star');
const rings = document.querySelectorAll('#rings circle');

if(star){
  setTimeout(()=>{ 
    star.style.opacity=1; 
    star.style.transform='scale(1)'; 
  }, 1200);

  star.addEventListener('click', ()=>{
    star.style.transition='transform 0.5s linear';
    star.style.transform='scale(1) rotate(1080deg)';

    setTimeout(()=>{
      star.style.transition='transform 1s cubic-bezier(0.22,1,0.36,1)';
      star.style.transform='scale(1) rotate(0deg)';
      crackShield();
    },500);
  });
}

// Shield cracking without fade
function crackShield(){
  rings.forEach((c,i)=>{
    // Each circle splits into multiple fragments
    for(let j=0;j<6;j++){
      const frag = c.cloneNode();
      frag.setAttribute('r', parseFloat(c.getAttribute('r')) / 2);
      frag.style.transition='transform 1.5s ease-out';
      document.querySelector('svg').appendChild(frag);
      const angle = Math.random()*Math.PI*2;
      const dist = 100 + Math.random()*50;
      frag.style.transform=`translate(${Math.cos(angle)*dist}px,${Math.sin(angle)*dist}px) rotate(${Math.random()*360}deg)`;
    }
    c.remove(); // remove original circle
  });
}
</script>
</body>
</html>
