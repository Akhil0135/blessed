<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Cinematic Night to Day – IMAX/Nolan Style</title>
<style>
html,body{
  height:100%;
  margin:0;
  background:#000;
  overflow:hidden;
  font-family:"Cinzel", serif;
}

/* ---------- Scene Container ----------- */
#scene{
  position:relative;
  width:100%;
  height:100%;
  overflow:hidden;
}

/* ---------- SKY / DAY TRANSITION ----------- */
#sky{
  position:absolute;
  inset:0;
  background:linear-gradient(to bottom,#030014,#120034 40%,#1a0046 70%);
  transition: background 2.5s ease;
  pointer-events:none;
}

/* ---------- SUN ----------- */
#sun{
  position:absolute;
  width:300px;
  height:300px;
  border-radius:50%;
  background: radial-gradient(circle,#ffd27f,#ff9a00);
  box-shadow:0 0 170px #ffb54c,0 0 300px #ff7b00;
  opacity:0;
  right:10%;
  top:10%;
  transform:translate(0,0) scale(0.35);
  transition:opacity 2.5s ease, transform 2.5s ease;
  pointer-events:none;
}

/* ---------- MOON ----------- */
#moon{
  position:absolute;
  width:180px;
  height:180px;
  border-radius:50%;
  background:#d9d8ff;
  box-shadow:0 0 50px #c5c4ff;
  top:28%;
  left:22%;
  transform:translate(-50%,-50%) rotate(0deg);
  pointer-events:auto;
  cursor:pointer;
  transition:opacity 2.5s ease, transform 2.5s ease;
  z-index:5;
}

/* ---------- MESSAGE TEXT ----------- */
#msg{
  position:absolute;
  width:100%;
  text-align:center;
  bottom:12%;
  color:#ffc97c;
  font-size:2.2rem;
  font-weight:700;
  opacity:0;
  text-shadow:0 0 15px #ffb84d,0 0 35px #ff9a00,0 0 70px rgba(255,180,100,0.5);
  pointer-events:none;
  transition:opacity 0.2s linear;
}

/* ---------- ROTATION INDICATOR ----------- */
#rotationIndicator{
  position:absolute;
  bottom:5%;
  left:50%;
  transform:translateX(-50%);
  color:#fff;
  font-size:1rem;
  text-shadow:0 0 10px rgba(0,0,0,0.7);
}

/* ---------- BUTTON ----------- */
#btn{
  position:absolute;
  left:50%;
  bottom:6%;
  transform:translateX(-50%);
  background:linear-gradient(to right,#6a00ff,#c200ff);
  color:#fff;
  font-size:1.25rem;
  padding:14px 34px;
  border:none;
  border-radius:16px;
  cursor:pointer;
  box-shadow:0 0 20px #9400ff;
  opacity:0;
  transition:opacity 1.4s ease;
}

/* ---------- IMAX CROSS ----------- */
#cross{
  position:absolute;
  left:50%;
  transform:translateX(-50%) scale(0.75);
  top:15%;
  width:0;
  height:0;
  opacity:0;
  pointer-events:none;
  transition:opacity 2.5s ease, transform 2.5s ease;
}

/* Vertical bar */
.cross-vertical{
  position:absolute;
  left:50%;
  transform:translateX(-50%);
  width:24px;
  height:260px;
  background:#ffd700;
  box-shadow:0 0 60px #ffe600,0 0 120px rgba(255, 215, 0,0.4);
}

/* Horizontal at 35% */
.cross-horizontal{
  position:absolute;
  left:50%;
  transform:translateX(-50%);
  width:180px;
  height:24px;
  top:calc(260px * 0.35);
  background:#ffd700;
  box-shadow:0 0 60px #ffe600,0 0 120px rgba(255, 215, 0,0.4);
}

/* ---------- STARS ---------- */
.star{
  position:absolute;
  width:2px;
  height:2px;
  background:white;
  border-radius:50%;
  opacity:1;
  box-shadow:0 0 3px #fff;
  animation:twinkle 1.5s infinite alternate;
}
@keyframes twinkle{
  0%{opacity:0.2;}
  50%{opacity:1;}
  100%{opacity:0.2;}
}

/* ---------- SHOOTING STARS ---------- */
.shootingStar{
  position:absolute;
  width:2px;
  height:100px;
  background:linear-gradient(to top, rgba(255,255,255,0.9), transparent);
  transform:rotate(45deg);
  animation:shoot 2s linear infinite;
}
@keyframes shoot{
  0%{transform:translate(0,0) rotate(45deg);}
  100%{transform:translate(100vw,100vh) rotate(45deg);}
}

/* ---------- DAY SKY ---------- */
.daySky{
  background:linear-gradient(to bottom,#52d3ff,#ffe6ab 60%,#ffd37c 90%);
  transition: background 2.5s ease;
}
</style>
</head>

<body>
<div id="scene">

  <div id="sky"></div>
  <div id="moon"></div>
  <div id="sun"></div>

  <div id="msg">On this calm birthday eve so new, God softly whispers, my plans are made for you.</div>
  <div id="rotationIndicator">Moon Rotation: 0°</div>

  <button id="btn">Click Here</button>

  <div id="cross">
    <div class="cross-vertical"></div>
    <div class="cross-horizontal"></div>
  </div>

  <!-- Stars -->
  <div id="starsContainer"></div>
  <!-- Shooting Stars -->
  <div id="shootingContainer"></div>

</div>

<script>
let moon = document.getElementById('moon');
let sun = document.getElementById('sun');
let sky = document.getElementById('sky');
let msg = document.getElementById('msg');
let btn = document.getElementById('btn');
let cross = document.getElementById('cross');
let rotationIndicator = document.getElementById('rotationIndicator');

let starsContainer = document.getElementById('starsContainer');
let shootingContainer = document.getElementById('shootingContainer');

let evolutionDone = false;
let sunLocked = false;
let rotation = 0;

// ---------- Generate Stars ----------
for(let i=0;i<120;i++){
  let s = document.createElement('div');
  s.classList.add('star');
  s.style.top = Math.random()*100+'%';
  s.style.left = Math.random()*100+'%';
  s.style.width = s.style.height = Math.random()*2+1+'px';
  starsContainer.appendChild(s);
}

// ---------- Shooting Stars ----------
for(let i=0;i<6;i++){
  let sh = document.createElement('div');
  sh.classList.add('shootingStar');
  sh.style.top = Math.random()*30+'%';
  sh.style.left = Math.random()*30+'%';
  sh.style.animationDuration = 1.5 + Math.random()*1.5 + 's';
  shootingContainer.appendChild(sh);
}

// ---------- MOON ROTATION & DAY EVOLUTION ----------
moon.addEventListener('pointerdown', function(e){
  if(sunLocked) return;
  e.preventDefault();
  let startY = e.clientY;

  function moveHandler(ev){
    let dy = startY - ev.clientY;
    let deg = dy;
    if(deg < 0) deg = 0; // Anti-clockwise only
    if(deg > 360) deg = 360;
    rotation = deg;
    moon.style.transform = `translate(-50%,-50%) rotate(${-rotation}deg)`;

    // Reveal message proportionally
    msg.style.opacity = rotation/360;

    // Update rotation indicator
    rotationIndicator.innerText = `Moon Rotation: ${Math.floor(rotation)}°`;

    // Sun rise and sky change
    sun.style.opacity = rotation/360;
    sun.style.transform = `translate(0,0) scale(${0.35 + (rotation/360)*0.65})`;
    if(rotation>10){
      sky.classList.add('daySky');
      starsContainer.style.opacity = 1-(rotation/360);
      shootingContainer.style.opacity = 1-(rotation/360);
    }
  }

  function upHandler(){
    document.removeEventListener('pointermove', moveHandler);
    document.removeEventListener('pointerup', upHandler);
  }

  document.addEventListener('pointermove', moveHandler);
  document.addEventListener('pointerup', upHandler);
});

// ---------- BUTTON CLICK → Cross Reveal ----------
btn.addEventListener('click', ()=>{
  btn.style.opacity = 0;
  setTimeout(()=>btn.style.display="none",700);

  setTimeout(()=>{
    cross.style.opacity = 1;
    cross.style.transform = "translateX(-50%) scale(1.2)";
  },700);

  setTimeout(()=>{
    cross.style.transform = "translateX(-50%) scale(1)";
  },2500);
});

// Show button when moon fully rotated
setInterval(()=>{
  if(rotation >= 360 && !evolutionDone){
    evolutionDone = true;
    sunLocked = true;
    setTimeout(()=>btn.style.opacity=1,600);
  }
},200);
</script>

</body>
</html>
