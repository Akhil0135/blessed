<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>IMAX Phase 1 — Night Sky & Moon</title>

<style>
    html, body {
        margin: 0;
        padding: 0;
        overflow: hidden;
        background: #000;
        user-select: none;
    }

    canvas {
        display: block;
    }

    #msg {
        position: absolute;
        top: 70%;
        left: 50%;
        transform: translateX(-50%);
        font-family: "Cinzel", serif; /* closest to Ben-Hur style */
        font-size: 22px;
        letter-spacing: 2px;
        background: linear-gradient(90deg, #ffffff, #ffd26a, #fff);
        -webkit-background-clip: text;
        color: transparent;
        opacity: 0;
        transition: opacity 0.4s ease;
        white-space: nowrap;
        text-shadow: 0 0 10px rgba(255,255,255,0.7);
        pointer-events: none;
    }

    @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@700&display=swap');
</style>
</head>

<body>
<canvas id="c"></canvas>
<div id="msg"></div>

<script>
const canvas = document.getElementById("c");
const ctx = canvas.getContext("2d");
const msgBox = document.getElementById("msg");

// FINAL MESSAGE
const fullMsg = "On this calm birthday eve so new, God softly whispers, my plans are made for you";

// STORAGE FOR LETTER REVEAL
let revealed = "";
let fullyRevealed = false;

function resize() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;

    moon.x = canvas.width * 0.15;
    moon.y = canvas.height * 0.18;
}
resize();
window.onresize = resize;

// ------------ IMAX STARFIELD ------------
const stars = [];
for (let i = 0; i < 260; i++) {
    stars.push({
        x: Math.random() * canvas.width,
        y: Math.random() * canvas.height,
        size: Math.random() * 1.3 + 0.3,
        tw: Math.random() * 0.02 + 0.003,
        base: Math.random() * 0.4 + 0.4
    });
}

function drawStars() {
    stars.forEach(s => {
        const glow = s.base + Math.sin(Date.now() * s.tw) * 0.4;
        ctx.fillStyle = `rgba(255,255,255,${glow})`;
        ctx.beginPath();
        ctx.arc(s.x, s.y, s.size, 0, Math.PI * 2);
        ctx.fill();
    });
}

// ------------ MOON ------------
const moon = {
    x: canvas.width * 0.15,
    y: canvas.height * 0.15,
    r: Math.min(canvas.width, canvas.height) * 0.085,
    dragging: false,
    offsetX: 0
};

function drawMoon() {
    ctx.fillStyle = "#ffffff";
    ctx.beginPath();
    ctx.arc(moon.x, moon.y, moon.r, 0, Math.PI * 2);
    ctx.fill();

    let halo = ctx.createRadialGradient(
        moon.x, moon.y, moon.r * 0.9,
        moon.x, moon.y, moon.r * 1.8
    );
    halo.addColorStop(0, "rgba(255,255,255,0.25)");
    halo.addColorStop(1, "rgba(255,255,255,0)");
    ctx.fillStyle = halo;
    ctx.beginPath();
    ctx.arc(moon.x, moon.y, moon.r * 1.8, 0, Math.PI * 2);
    ctx.fill();
}

// ------------ ANIMATION LOOP ------------
function animate() {
    const bg = ctx.createLinearGradient(0,0,0,canvas.height);
    bg.addColorStop(0, "#000010");
    bg.addColorStop(1, "#000020");
    ctx.fillStyle = bg;
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    drawStars();
    drawMoon();

    // LETTER REVEAL PROGRESS (0 to 1)
    let progress = (moon.x - canvas.width * 0.15) / (canvas.width * 0.7);
    progress = Math.min(Math.max(progress, 0), 1);

    // REVEAL LETTERS ONLY FORWARD
    if (!fullyRevealed) {
        let targetLetters = Math.floor(progress * fullMsg.length);
        revealed = fullMsg.substring(0, targetLetters);

        if (revealed.length >= fullMsg.length) {
            fullyRevealed = true;
        }
    }

    // UPDATE MESSAGE
    msgBox.textContent = revealed;
    msgBox.style.opacity = revealed.length > 0 ? 1 : 0;

    requestAnimationFrame(animate);
}
animate();

// ------------ MOON DRAGGING ------------
canvas.addEventListener("mousedown", e => {
    const dx = e.clientX - moon.x;
    const dy = e.clientY - moon.y;
    if (Math.sqrt(dx*dx + dy*dy) < moon.r) {
        moon.dragging = true;
        moon.offsetX = dx;
    }
});

canvas.addEventListener("mouseup", () => moon.dragging = false);
canvas.addEventListener("mouseleave", () => moon.dragging = false);

canvas.addEventListener("mousemove", e => {
    if (moon.dragging) {
        moon.x = Math.min(
            Math.max(e.clientX - moon.offsetX, moon.r),
            canvas.width - moon.r
        );
    }
});
</script>
</body>
</html>
