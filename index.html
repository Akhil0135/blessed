<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>IMAX Nolan Cinematic • Shield + Shooting Star</title>
<style>
html, body { margin:0; padding:0; height:100%; background:#000; overflow:hidden; }
canvas { width:100%; height:100%; display:block; background: radial-gradient(circle at center, #0a0a15, #000); }

/* Shield Metallic Rings & Star */
#shield svg { position:absolute; top:50%; left:50%; transform:translate(-50%, -50%) scale(1.1); filter:drop-shadow(0 0 35px #ff000066); }
#shield svg polygon { transform-origin:256px 256px; animation: starSpin 4s linear infinite; }
@keyframes starSpin { 0%{transform:rotate(0deg);} 100%{transform:rotate(360deg);} }

/* Shooting Star Proper */
.shooting-star {
  position:absolute;
  width:24px;
  height:24px;
  background: radial-gradient(circle, #ffffff 0%, #ffe7c7 40%, #ffcf80 70%, rgba(255,180,120,0) 100%);
  border-radius:50%;
  box-shadow:0 0 50px 20px #fff;
  top:-50px;
  left:10%;
  transform:translateX(0);
  animation:shootStarMove 2.8s ease-in forwards;
}
.shooting-star::after {
  content:'';
  position:absolute;
  top:8px;
  left:-400px;
  width:400px;
  height:24px;
  background: linear-gradient(90deg, rgba(255,255,255,0) 0%, rgba(255,240,200,0.4) 20%, rgba(255,230,160,0.9) 70%, rgba(255,230,160,1) 100%);
  border-radius:0 50px 50px 0;
  filter:blur(2px);
  transform:skewY(-8deg);
}
@keyframes shootStarMove {
  0%{ top:-50px; left:10%; opacity:1; }
  100%{ top:50%; left:50%; opacity:1; }
}

/* Explosion */
.explosion{
  position:absolute;
  top:50%; left:50%;
  width:20px; height:20px;
  background:radial-gradient(circle, #fff 0%, #ffddaa 40%, rgba(255,180,80,0.6) 70%, transparent 100%);
  border-radius:50%;
  transform:translate(-50%, -50%);
  pointer-events:none;
  animation:boom 0.6s ease-out forwards;
  filter:blur(2px);
}
@keyframes boom{
  0%{ transform:translate(-50%, -50%) scale(0.3); opacity:1; }
  40%{ transform:translate(-50%, -50%) scale(4); opacity:0.9; filter:blur(4px); }
  70%{ transform:translate(-50%, -50%) scale(7); opacity:0.6; filter:blur(8px); }
  100%{ transform:translate(-50%, -50%) scale(10); opacity:0; filter:blur(18px); }
}

/* Camera Shake */
@keyframes shake { 0%{transform:translate(0,0);} 25%{transform:translate(6px,-6px);} 50%{transform:translate(-6px,4px);} 75%{transform:translate(4px,6px);} 100%{transform:translate(0,0);} }
</style>
</head>
<body>
<canvas id="cinema"></canvas>
<div id="shield"></div>
<div class="shooting-star"></div>
<script>
/* 3D Stars Background */
const canvas = document.getElementById('cinema');
const ctx = canvas.getContext('2d');
canvas.width = innerWidth; canvas.height = innerHeight;
let stars = Array.from({length:1500}, ()=>({x:(Math.random()-0.5)*2000,y:(Math.random()-0.5)*2000,z:Math.random()*2000}));
function animate(){
  ctx.fillStyle='#000'; ctx.fillRect(0,0,canvas.width,canvas.height);
  for(let s of stars){
    s.z-=4; if(s.z<=1) s.z=2000;
    let sx=(s.x/s.z)*800+canvas.width/2;
    let sy=(s.y/s.z)*800+canvas.height/2;
    let size=Math.max(0,2-s.z/1000);
    ctx.fillStyle='white'; ctx.beginPath(); ctx.arc(sx,sy,size,0,Math.PI*2); ctx.fill();
  }
  requestAnimationFrame(animate);
}
animate();

/* Shield SVG */
document.getElementById('shield').innerHTML=`<svg width="280" height="280" viewBox="0 0 512 512">
<defs>
<radialGradient id="metalRed" cx="50%" cy="50%" r="70%"><stop offset="0%" stop-color="#ff5555"/><stop offset="50%" stop-color="#b20000"/><stop offset="100%" stop-color="#4a0000"/></radialGradient>
<linearGradient id="metalWhite" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#ffffff"/><stop offset="50%" stop-color="#d0d0d0"/><stop offset="100%" stop-color="#9e9e9e"/></linearGradient>
<radialGradient id="metalBlue" cx="50%" cy="40%" r="70%"><stop offset="0%" stop-color="#4db8ff"/><stop offset="50%" stop-color="#004c97"/><stop offset="100%" stop-color="#001a33"/></radialGradient>
<linearGradient id="starChrome" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#ffffff"/><stop offset="40%" stop-color="#e3e3e3"/><stop offset="80%" stop-color="#8f8f8f"/><stop offset="100%" stop-color="#ffffff"/></linearGradient>
</defs>
<circle cx="256" cy="256" r="250" fill="url(#metalRed)"/>
<circle cx="256" cy="256" r="200" fill="url(#metalWhite)"/>
<circle cx="256" cy="256" r="150" fill="url(#metalRed)"/>
<circle cx="256" cy="256" r="100" fill="url(#metalBlue)"/>
<polygon points="256,150 281,230 366,230 297,280 322,360 256,310 190,360 215,280 146,230 231,230" fill="url(#starChrome)"/>
</svg>`;

/* Shooting Star Impact and Shield Explosion */
const shootingStar = document.querySelector('.shooting-star');
shootingStar.addEventListener('animationend', ()=>{
  // Explosion
  const exp = document.createElement('div'); exp.className='explosion'; document.body.appendChild(exp);
  // Shield fade out
  const shieldSVG = document.querySelector('#shield svg');
  shieldSVG.style.transition='all 0.8s ease-out'; shieldSVG.style.opacity='0';
  // Shockwave
  const wave=document.createElement('div'); wave.style.position='absolute'; wave.style.top='50%'; wave.style.left='50%';
  wave.style.width='20px'; wave.style.height='20px'; wave.style.border='3px solid white'; wave.style.borderRadius='50%';
  wave.style.transform='translate(-50%,-50%) scale(0)'; wave.style.opacity='0.9'; wave.style.filter='blur(3px) drop-shadow(0 0 25px white)';
  wave.style.transition='all 1.6s ease-out'; document.body.appendChild(wave);
  setTimeout(()=>{wave.style.transform='translate(-50%,-50%) scale(20)'; wave.style.opacity='0';},10);
  // Camera shake
  document.body.style.animation='shake 0.4s ease-out'; setTimeout(()=>document.body.style.animation='',500);
});
</script>
</body>
</html>
