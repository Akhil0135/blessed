<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cinematic Night to Day</title>
<style>
  body {
    margin: 0;
    height: 100vh;
    overflow: hidden;
    background: linear-gradient(to bottom, #0a0f24 0%, #000814 70%, #000000 100%);
    position: relative;
    transition: background 3s ease-in-out;
    font-family: 'Arial', sans-serif;
  }

  /* Stars */
  .star {
    position: absolute;
    width: 2px;
    height: 2px;
    background: white;
    border-radius: 50%;
    opacity: 0.8;
    animation: twinkle 2.5s infinite ease-in-out;
  }
  @keyframes twinkle {
    0% {opacity:0.2;}
    50% {opacity:1;}
    100% {opacity:0.2;}
  }

  /* Crescent Moon */
  .moon {
    position: absolute;
    top: 80px;
    right: 120px;
    width: 200px;
    height: 200px;
    background: url('https://i.ibb.co/HCz7XGf/realistic-crescent-moon.png') no-repeat center/contain;
    transition: opacity 2s ease-in-out;
    z-index: 2;
  }

  /* Gold Cross */
  .cross {
    position: absolute;
    top: 30px;
    left: 50%;
    transform: translateX(-50%);
    width: 150px;
    height: 260px;
    background: url('https://i.ibb.co/2M0Ckwn/gold-cross.png') no-repeat center/contain;
    z-index: 3;
    transition: all 3s ease-in-out;
  }

  /* Click Button */
  .click-btn {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    padding: 20px 50px;
    font-size: 32px;
    font-weight: bold;
    border: none;
    border-radius: 15px;
    cursor: pointer;
    background: white;
    opacity: 0;
    z-index: 4;
    transition: opacity 1s ease-in-out;
  }

  /* Sun */
  .sun {
    position: absolute;
    top: 80px;
    right: 120px;
    width: 200px;
    height: 200px;
    background: url('https://i.ibb.co/9y1syR7/realistic-sun.png') no-repeat center/contain;
    opacity: 0;
    z-index: 2;
    transition: opacity 2s ease-in-out;
  }

  /* Tulip Garden */
  .tulips {
    position: absolute;
    bottom: 0;
    width: 100%;
    height: 300px;
    background: url('https://i.ibb.co/ZK7Qp0y/realistic-tulip-garden.png') no-repeat center bottom/cover;
    opacity: 0;
    transition: opacity 3s ease-in-out;
    z-index: 1;
  }
</style>
</head>
<body>

<div class="moon"></div>
<div class="cross"></div>
<div class="sun"></div>
<div class="tulips"></div>

<script>
// Generate stars avoiding cross and moon
for (let i = 0; i < 250; i++) {
  const star = document.createElement('div');
  star.classList.add('star');
  let x = Math.random() * window.innerWidth;
  let y = Math.random() * window.innerHeight;
  // Avoid moon/cross area
  if ((x > window.innerWidth/2 - 75 && x < window.innerWidth/2 + 75 && y < 260) || 
      (x > window.innerWidth - 320 && y < 280)) {
    i--; continue;
  }
  star.style.left = x + 'px';
  star.style.top = y + 'px';
  star.style.animationDelay = Math.random() * 2 + 's';
  document.body.appendChild(star);
}

// Show click button after 3s
setTimeout(() => {
  const btn = document.createElement('button');
  btn.className = 'click-btn';
  btn.innerText = 'Click Here';
  document.body.appendChild(btn);
  btn.style.opacity = 1;

  btn.addEventListener('click', () => {
    // Hide moon and stars
    document.querySelector('.moon').style.opacity = 0;
    document.querySelectorAll('.star').forEach(s => s.remove());
    btn.style.display = 'none';

    // Show day background
    document.body.style.background = 'linear-gradient(to bottom, #87CEFA 0%, #ADD8E6 70%, #E0FFFF 100%)';

    // Show sun
    document.querySelector('.sun').style.opacity = 1;

    // Show tulip garden
    document.querySelector('.tulips').style.opacity = 1;
  });
}, 3000);
</script>

</body>
</html>
