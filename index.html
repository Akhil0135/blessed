<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Galactic Prince</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
    body { margin:0; overflow:hidden; background:black; }
</style>
</head>
<body>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/examples/js/loaders/FontLoader.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/examples/js/geometries/TextGeometry.js"></script>

<script>
// ------------------------------------------------
// BASIC SETUP
// ------------------------------------------------
let scene = new THREE.Scene();
let camera = new THREE.PerspectiveCamera(60, window.innerWidth/window.innerHeight, 0.1, 2000);
camera.position.set(0, 10, 80);

let renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(window.devicePixelRatio);
document.body.appendChild(renderer.domElement);

// ------------------------------------------------
// STAR FIELD (Background)
// ------------------------------------------------
let starGeo = new THREE.BufferGeometry();
let starCount = 3000;
let starPositions = new Float32Array(starCount * 3);

for (let i = 0; i < starCount * 3; i++) {
    starPositions[i] = (Math.random() - 0.5) * 2000;
}

starGeo.setAttribute('position', new THREE.BufferAttribute(starPositions, 3));
let starMat = new THREE.PointsMaterial({ color: 0xffffff, size: 1.5 });
let stars = new THREE.Points(starGeo, starMat);
scene.add(stars);

// ------------------------------------------------
// GALACTIC TEXTURE (Nebula + Stars)
// ------------------------------------------------
function galacticTexture() {
    let canvas = document.createElement("canvas");
    canvas.width = 1024;
    canvas.height = 512;
    let ctx = canvas.getContext("2d");

    let g = ctx.createLinearGradient(0,0,1024,512);
    g.addColorStop(0, "#ff00ff");
    g.addColorStop(0.3, "#4b0082");
    g.addColorStop(0.6, "#0000ff");
    g.addColorStop(1, "#00e6ff");
    ctx.fillStyle = g;
    ctx.fillRect(0,0,1024,512);

    for (let i = 0; i < 200; i++) {
        ctx.fillStyle = "white";
        let x = Math.random() * 1024;
        let y = Math.random() * 512;
        let s = Math.random() * 3;
        ctx.fillRect(x, y, s, s);
    }

    let tex = new THREE.CanvasTexture(canvas);
    tex.needsUpdate = true;
    return tex;
}

let galaxyTex = galacticTexture();

// ------------------------------------------------
// TEXT
// ------------------------------------------------
let textMesh = null;

let loader = new THREE.FontLoader();
loader.load("https://threejs.org/examples/fonts/helvetiker_bold.typeface.json", function(font){

    let textGeo = new THREE.TextGeometry("HAPPY BIRTHDAY PRINCE", {
        font: font,
        size: 8,
        height: 3,
        bevelEnabled: true,
        bevelThickness: 0.4,
        bevelSize: 0.3,
        bevelSegments: 5
    });

    textGeo.center();

    let textMat = new THREE.MeshStandardMaterial({
        color: 0xffffff,
        map: galaxyTex,
        emissive: "#330066",
        emissiveIntensity: 0.5,
        metalness: 0.6,
        roughness: 0.3
    });

    textMesh = new THREE.Mesh(textGeo, textMat);
    textMesh.position.y = 0;
    scene.add(textMesh);

    let light = new THREE.PointLight(0xffffff, 2, 300);
    light.position.set(50,50,50);
    scene.add(light);
});

// ------------------------------------------------
// ANIMATION
// ------------------------------------------------
let angle = 0;

function animate() {
    requestAnimationFrame(animate);

    stars.rotation.y += 0.0004;

    angle += 0.002;
    camera.position.x = Math.sin(angle) * 90;
    camera.position.z = Math.cos(angle) * 90;
    camera.lookAt(0, 0, 0);

    renderer.render(scene, camera);
}
animate();

// ------------------------------------------------
// RESPONSIVE
// ------------------------------------------------
window.addEventListener("resize", () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
});
</script>

</body>
</html>
