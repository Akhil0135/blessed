<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Realistic Golden Cross</title>
<style>
  body {
    margin: 0;
    height: 100vh;
    background-color: #001f3f; /* navy blue */
    display: flex;
    justify-content: center;
    align-items: flex-start;
    padding-top: 50px;
  }

  .cross {
    position: relative;
    width: 30px;    /* vertical bar width */
    height: 120px;  /* vertical bar height */
  }

  /* Vertical bar */
  .cross::before {
    content: '';
    position: absolute;
    top: 0;
    left: 50%;
    transform: translateX(-50%);
    width: 30px;
    height: 120px;
    background: linear-gradient(135deg, #FFD700, #FFA500); /* gold gradient */
    border-radius: 3px;
    box-shadow: 0 0 10px gold, 0 0 20px rgba(255, 215, 0, 0.5); /* glow */
  }

  /* Horizontal bar */
  .cross::after {
    content: '';
    position: absolute;
    top: 45%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 70px;
    height: 25px;
    background: linear-gradient(135deg, #FFD700, #FFA500); /* gold gradient */
    border-radius: 3px;
    box-shadow: 0 0 10px gold, 0 0 20px rgba(255, 215, 0, 0.5); /* glow */
  }
</style>
</head>
<body>
  <div class="cross"></div>
</body>
</html>
