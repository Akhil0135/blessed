<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>IMAX Nolan — Phase 1</title>
<style>
  html,body{
    margin:0;
    padding:0;
    overflow:hidden;
    background:#000010;
    font-family:"Cinzel",serif;
    color:#ffdFA0;
  }
  #stage{
    position:relative;
    width:100%;
    height:100%;
    perspective:1400px;
  }
  #sky{
    position:absolute;
    inset:0;
    background:linear-gradient(180deg,#070617,#120430 55%);
    transition:background 1.4s ease;
  }
  .grade-overlay{
    position:absolute;inset:0;
    mix-blend-mode:screen;
    pointer-events:none;
    opacity:0.18;
    background:linear-gradient(180deg, rgba(12,8,30,0.0), rgba(10,6,20,0.28));
    z-index:70;
  }
  .grain{
    position:absolute;inset:0;
    pointer-events:none;
    z-index:700;
    opacity:0.06;
    background-image:radial-gradient(circle, rgba(255,255,255,0.02) 0.5px, transparent 0.5px);
    background-size:4px 4px;
    mix-blend-mode:overlay;
  }
  /* stars */
  #stars{position:absolute;inset:0;z-index:20;pointer-events:none}
  .star{position:absolute;width:3px;height:3px;border-radius:50%;background:rgba(255,255,255,0.95);box-shadow:0 0 8px rgba(255,255,255,0.8);opacity:0.9;filter:blur(.8px);animation:twinkle var(--tw) infinite alternate}
  @keyframes twinkle{0%{opacity:.2;transform:scale(.5)}50%{opacity:1;transform:scale(1.3)}100%{opacity:.25;transform:scale(.7)}}

  /* shooting stars */
  .shoot{position:absolute;width:3px;height:18px;background:linear-gradient(180deg, rgba(255,255,255,0.95), rgba(255,255,255,0.6));border-radius:2px;box-shadow:0 0 10px rgba(255,255,255,0.9);z-index:95;pointer-events:none;transform-origin:center;filter:blur(.6px);}

  /* moon */
  #moon{
    position:absolute;
    width:190px;
    height:190px;
    border-radius:50%;
    background:radial-gradient(circle at 35% 30%, #ffffff, #f1e3b5 45%, #d8c08a 100%);
    top:18%;
    left:14%;
    box-shadow:0 0 120px rgba(255,245,200,0.14),0 0 260px rgba(255,240,200,0.06);
    cursor:grab;
    z-index:60;
    pointer-events:auto;
    display:flex;
    align-items:center;
    justify-content:center;
    transform:translate(-50%,-50%);
    transition:transform .08s linear,opacity .9s ease,left .28s ease,top .28s ease;
  }
  #moon:active{cursor:grabbing}
  #moon .flare{
    position:absolute;
    inset:-40px;
    border-radius:50%;
    background:radial-gradient(circle, rgba(255,245,200,0.12), rgba(255,245,200,0));
    filter:blur(36px);
    pointer-events:none;
  }

  /* message */
  #message{
    position:absolute;
    left:6%;
    right:6%;
    top:65%;
    text-align:center;
    z-index:80;
    font-size:28px;
    letter-spacing:1.5px;
    color:#f2d8ff;
    text-shadow:0 6px 24px rgba(40,10,60,0.45);
    pointer-events:none;
    font-weight:500;
    line-height:1.25;
    white-space:nowrap;
    overflow:hidden;
  }
  .letter{display:inline-block;opacity:0;transform:translateY(12px);transition:opacity .12s ease, transform .12s ease;}
</style>
</head>
<body>
<div id="stage">
  <div id="sky"></div>
  <div class="grade-overlay"></div>
  <div class="grain"></div>
  <div id="stars"></div>
  <div id="moon"><div class="flare"></div></div>
  <div id="message"></div>
</div>

<script>
// ---------------- Scene Setup ----------------
const stage = document.getElementById('stage');
const moon = document.getElementById('moon');
const starsWrap = document.getElementById('stars');
const message = document.getElementById('message');
const fullText = "On this calm birthday eve so new, God softly whispers, my plans are made for you.";

let dragging=false, lastX=0, progress=0;

// ---------------- Stars ----------------
for(let i=0;i<200;i++){
  const s = document.createElement('div');
  s.className='star';
  s.style.setProperty('--tw', (1.2 + Math.random()*3.4)+'s');
  s.style.left=Math.random()*100+'%';
  s.style.top=Math.random()*80+'%';
  s.style.opacity=(0.6 + Math.random()*0.4).toFixed(2);
  starsWrap.appendChild(s);
}

// ---------------- Shooting stars ----------------
function spawnShootingStar(){
  const s = document.createElement('div');
  s.className='shoot';
  s.style.left=(Math.random()*100)+'%';
  s.style.top='-6%';
  s.style.transform='rotate('+(20+Math.random()*40)+'deg)';
  stage.appendChild(s);
  const tx = (Math.random()*1.6-0.8)*window.innerWidth;
  s.animate([
    { transform: s.style.transform + ' translate(0,0)', opacity:1 },
    { transform: s.style.transform + ` translate(${tx}px, ${window.innerHeight+200}px)`, opacity:0 }
  ], { duration:1400 + Math.random()*1700, easing:'cubic-bezier(.2,.7,.2,1)', fill:'forwards' });
  setTimeout(()=> s.remove(), 2000);
}
setInterval(spawnShootingStar,1200+Math.random()*800);

// ---------------- Message letters ----------------
const letters = [];
for(let i=0;i<fullText.length;i++){
  const span = document.createElement('span');
  span.className='letter';
  span.textContent = fullText[i]===' ' ? '\u00A0' : fullText[i];
  message.appendChild(span);
  letters.push(span);
}

// ---------------- Drag Logic ----------------
moon.addEventListener('pointerdown',e=>{
  dragging=true;
  lastX=e.clientX;
});
document.addEventListener('pointerup',()=>dragging=false);
document.addEventListener('pointermove',e=>{
  if(!dragging) return;
  const dx = e.clientX - lastX;
  lastX = e.clientX;
  const moonRect = moon.getBoundingClientRect();
  let newLeft = moonRect.left + dx;
  newLeft = Math.max(0, Math.min(window.innerWidth - moonRect.width, newLeft));
  const percent = newLeft / (window.innerWidth - moonRect.width);
  moon.style.left = (14 + 46*percent)+'%';
  moon.style.opacity = `${1 - percent}`;
  progress = percent;

  // reveal letters
  const lettersToShow = Math.floor(progress * letters.length);
  for(let i=0;i<letters.length;i++){
    if(i<lettersToShow){
      letters[i].style.opacity=1;
      letters[i].style.transform='translateY(0)';
      letters[i].style.transitionDelay = (i*6/1000)+'s';
    }
  }

  // fade stars gradually
  starsWrap.querySelectorAll('.star').forEach(s=>{
    s.style.opacity = 0.9 * (1 - progress*1.05);
  });

  // background shift (night to bluish)
  if(progress>0.05){
    const r = Math.min(255, 7 + Math.floor(progress*160));
    const g = Math.min(255, 6 + Math.floor(progress*160));
    const b = Math.min(255, 16 + Math.floor(progress*210));
    document.getElementById('sky').style.background = `linear-gradient(180deg, rgba(${r},${g},${b},1), rgba(${Math.min(255,r+30)},${Math.min(255,g+30)},${Math.min(255,b+40)},1) 60%)`;
  }
});

</script>
</body>
</html>
