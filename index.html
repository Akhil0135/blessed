<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>IMAX Phase 1 — Nolan Soft-Film Moon</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    background: #000;
    overflow: hidden;
    user-select: none;
  }
  canvas { display: block; }
  #msg {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    color: #ffffff;
    font-family: "Georgia", serif;
    font-size: clamp(18px, 2.4vw, 32px);
    text-align: center;
    opacity: 0;
    pointer-events: none;
    width: 78%;
    line-height: 1.5;
    text-shadow: 0 2px 12px rgba(0,0,0,0.6);
  }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="msg">On this calm birthday eve so new, <br>God softly whispers, my plans are made for you</div>

<script>
(() => {
  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d', { alpha: false });
  const msg = document.getElementById('msg');

  // Resize & layout
  let DPR = Math.max(1, window.devicePixelRatio || 1);
  function resize() {
    DPR = Math.max(1, window.devicePixelRatio || 1);
    canvas.width = Math.round(window.innerWidth * DPR);
    canvas.height = Math.round(window.innerHeight * DPR);
    canvas.style.width = window.innerWidth + 'px';
    canvas.style.height = window.innerHeight + 'px';
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0); // keep drawing coordinates in CSS pixels

    // recalc moon & stars
    moon.radius = Math.min(window.innerWidth, window.innerHeight) * 0.08;
    if (!moon.dragging && !moon.initialized) {
      moon.x = window.innerWidth * 0.15;
      moon.y = window.innerHeight * 0.15;
    } else if (!moon.initialized) {
      moon.x = clamp(moon.x, moon.radius, window.innerWidth - moon.radius);
      moon.y = window.innerHeight * 0.15;
    }
    // reposition some stars to fit new size
    rebuildStars();
    moon.initialized = true;
  }
  window.addEventListener('resize', resize);
  resize();

  // Utility
  function clamp(v, a, b) { return Math.max(a, Math.min(v, b)); }

  // ---------------- Stars ----------------
  const STAR_COUNT = 220;
  let stars = [];
  function rebuildStars() {
    // keep some previous stars for continuity
    const old = stars.slice(0, Math.min(stars.length, Math.floor(STAR_COUNT*0.6)));
    stars = old.map(s => ({
      x: Math.random()*window.innerWidth,
      y: Math.random()*window.innerHeight,
      size: s.size,
      tw: s.tw,
      baseAlpha: s.baseAlpha,
      phase: s.phase
    }));
    while (stars.length < STAR_COUNT) {
      stars.push({
        x: Math.random()*window.innerWidth,
        y: Math.random()*window.innerHeight,
        size: Math.random()*1.4 + 0.35,
        tw: Math.random()*0.018 + 0.003,
        baseAlpha: Math.random()*0.45 + 0.25,
        phase: Math.random()*Math.PI*2,
        isPulse: Math.random() < 0.03 // occasional bright pulse stars
      });
    }
  }
  rebuildStars();

  // ---------------- Moon (Nolan soft-film) ----------------
  const moon = {
    x: window.innerWidth * 0.15,
    y: window.innerHeight * 0.15,
    radius: Math.min(window.innerWidth, window.innerHeight) * 0.08,
    dragging: false,
    offsetX: 0,
    initialized: false
  };

  // Drag handling (mouse + touch)
  function onPointerDown(clientX, clientY) {
    const dx = clientX - moon.x;
    const dy = clientY - moon.y;
    if (Math.sqrt(dx*dx + dy*dy) <= moon.radius + 6) { // allow small halo region
      moon.dragging = true;
      moon.offsetX = dx;
      return true;
    }
    return false;
  }
  function onPointerMove(clientX, clientY) {
    if (moon.dragging) {
      moon.x = clamp(clientX - moon.offsetX, moon.radius, window.innerWidth - moon.radius);
    }
  }
  function onPointerUp() { moon.dragging = false; }

  // Mouse events
  canvas.addEventListener('mousedown', e => onPointerDown(e.clientX, e.clientY));
  window.addEventListener('mousemove', e => onPointerMove(e.clientX, e.clientY));
  window.addEventListener('mouseup', () => onPointerUp());

  // Touch events
  canvas.addEventListener('touchstart', e => {
    const t = e.touches[0];
    if (t) onPointerDown(t.clientX, t.clientY);
  }, { passive: true });
  window.addEventListener('touchmove', e => {
    const t = e.touches[0];
    if (t) onPointerMove(t.clientX, t.clientY);
  }, { passive: true });
  window.addEventListener('touchend', () => onPointerUp());

  // ---------------- Cinematic vignette / color grade ----------------
  function drawVignette() {
    const w = window.innerWidth, h = window.innerHeight;
    const vgrad = ctx.createRadialGradient(w/2, h/2, Math.min(w,h)*0.3, w/2, h/2, Math.max(w,h)*0.9);
    vgrad.addColorStop(0, 'rgba(0,0,0,0)');
    vgrad.addColorStop(0.6, 'rgba(0,0,0,0.12)');
    vgrad.addColorStop(1, 'rgba(0,0,0,0.55)');
    ctx.fillStyle = vgrad;
    ctx.fillRect(0,0,w,h);
  }

  // ---------------- Draw functions ----------------
  function drawBackground() {
    // Nolan-like graded night: very deep blue-black with slight teal tint close to horizon
    const g = ctx.createLinearGradient(0, 0, 0, window.innerHeight);
    g.addColorStop(0, '#030417');   // near black-blue
    g.addColorStop(0.5, '#02021a'); // deep indigo
    g.addColorStop(1, '#000014');   // almost black
    ctx.fillStyle = g;
    ctx.fillRect(0,0,window.innerWidth, window.innerHeight);
  }

  function drawStars(time) {
    // draw faint scattering first
    for (let i = 0; i < stars.length; i++) {
      const s = stars[i];
      // Parallax subtle offset while dragging (gives depth)
      const parallaxX = (moon.x - window.innerWidth*0.15) * (s.size*0.0008);
      const alpha = clamp(s.baseAlpha + Math.sin(s.phase + time * s.tw) * 0.45, 0, 1);
      ctx.beginPath();
      ctx.fillStyle = `rgba(255,255,255,${alpha})`;
      ctx.arc(s.x + parallaxX, s.y, s.isPulse ? s.size * 1.8 : s.size, 0, Math.PI*2);
      ctx.fill();

      // occasionally draw a subtle glow for pulse stars
      if (s.isPulse && Math.abs(Math.sin(time*s.tw + s.phase)) > 0.98) {
        const g = ctx.createRadialGradient(s.x, s.y, 0, s.x, s.y, s.size*8);
        g.addColorStop(0, 'rgba(255,255,255,0.08)');
        g.addColorStop(1, 'rgba(255,255,255,0)');
        ctx.fillStyle = g;
        ctx.beginPath();
        ctx.arc(s.x, s.y, s.size*8, 0, Math.PI*2);
        ctx.fill();
      }
    }
  }

  function drawNolanMoon(time) {
    // soft-film moon: base soft disc with multiple gradients for subtle film-like diffusion
    const x = moon.x, y = moon.y, r = moon.radius;

    // main soft surface using radial gradient (slightly warm)
    const surf = ctx.createRadialGradient(x - r*0.12, y - r*0.08, r*0.12, x, y, r);
    surf.addColorStop(0, 'rgba(255,255,238,1)');
    surf.addColorStop(0.35, 'rgba(255,255,230,0.92)');
    surf.addColorStop(0.6, 'rgba(245,245,230,0.7)');
    surf.addColorStop(1, 'rgba(240,240,230,0.0)');
    ctx.beginPath();
    ctx.fillStyle = surf;
    ctx.arc(x, y, r, 0, Math.PI*2);
    ctx.fill();

    // gentle soft haze layer to simulate soft-focus (flicker slightly to feel alive)
    const haze = ctx.createRadialGradient(x, y, r*0.7, x, y, r*2.2);
    const hazeAlpha = 0.10 + Math.sin(time*0.0006)*0.03; // tiny breathe
    haze.addColorStop(0, `rgba(255,245,220,${hazeAlpha})`);
    haze.addColorStop(0.4, `rgba(255,245,220,${hazeAlpha*0.55})`);
    haze.addColorStop(1, 'rgba(255,245,220,0)');
    ctx.fillStyle = haze;
    ctx.beginPath();
    ctx.arc(x, y, r*2.2, 0, Math.PI*2);
    ctx.fill();

    // Add subtle lunar terminator (slight shading to avoid perfectly flat sphere)
    ctx.beginPath();
    const grad = ctx.createLinearGradient(x - r, y, x + r, y);
    grad.addColorStop(0, 'rgba(0,0,0,0.05)');
    grad.addColorStop(0.5, 'rgba(0,0,0,0)');
    grad.addColorStop(1, 'rgba(0,0,0,0.02)');
    ctx.fillStyle = grad;
    ctx.arc(x, y, r, 0, Math.PI*2);
    ctx.fill();

    // Small specular highlight (soft)
    const specG = ctx.createRadialGradient(x - r*0.28, y - r*0.18, 0, x - r*0.28, y - r*0.18, r*0.6);
    specG.addColorStop(0, 'rgba(255,255,255,0.65)');
    specG.addColorStop(1, 'rgba(255,255,255,0)');
    ctx.fillStyle = specG;
    ctx.beginPath();
    ctx.arc(x - r*0.28, y - r*0.18, r*0.7, 0, Math.PI*2);
    ctx.fill();
  }

  // ---------------- Message reveal (independent of camera drift) ----------------
  // start and end for reveal (in screen space)
  function getRevealRange() {
    const startX = window.innerWidth * 0.15;
    const endX = window.innerWidth * 0.85; // moon dragged almost to right
    return { startX, endX };
  }

  // ---------------- Animation loop ----------------
  let last = performance.now();
  function loop(now) {
    const dt = now - last;
    last = now;

    // Draw background
    drawBackground();
    // Camera drift translation (no scaling; avoids visibility issues)
    const dx = Math.sin(Date.now()*0.0002) * 12;
    const dy = Math.cos(Date.now()*0.00015) * 10;
    ctx.save();
    ctx.translate(dx, dy);

    // Stars & Moon
    drawStars(now);
    drawNolanMoon(now);

    ctx.restore();

    // Vignette overlay
    drawVignette();

    // Message progress (use raw moon.x in screen coords)
    const { startX, endX } = getRevealRange();
    let progress = (moon.x - startX) / (endX - startX);
    progress = clamp(progress, 0, 1);
    // Smooth the opacity using ease in/out
    const eased = progress < 0.5 ? 2*progress*progress : 1 - Math.pow(-2*progress+2, 2)/2;
    msg.style.opacity = eased;

    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);

  // --------------- Initial draw helpers ---------------
  function drawBackground() {
    const g = ctx.createLinearGradient(0,0,0,window.innerHeight);
    g.addColorStop(0, '#020317'); // very dark indigo
    g.addColorStop(0.5, '#02021a');
    g.addColorStop(1, '#000010');
    ctx.fillStyle = g;
    ctx.fillRect(0,0,window.innerWidth, window.innerHeight);

    // subtle subtle noise vignette base (very faint)
    ctx.fillStyle = 'rgba(0,0,0,0.02)';
    ctx.fillRect(0,0,window.innerWidth, window.innerHeight);
  }

  function drawVignette() {
    const w = window.innerWidth, h = window.innerHeight;
    const v = ctx.createRadialGradient(w/2, h/2, Math.min(w,h)*0.3, w/2, h/2, Math.max(w,h)*0.9);
    v.addColorStop(0, 'rgba(0,0,0,0)');
    v.addColorStop(0.6, 'rgba(0,0,0,0.08)');
    v.addColorStop(1, 'rgba(0,0,0,0.5)');
    ctx.fillStyle = v;
    ctx.fillRect(0,0,w,h);
  }

  // ----------------- init -----------------
  // ensure moon & stars set correctly after first layout
  resize();

})();
</script>
</body>
</html>
