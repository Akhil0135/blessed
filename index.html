<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>PRINCE Cinematic — Fixed</title>

<style>
    body,html{
        margin:0;
        padding:0;
        overflow:hidden;
        background:#000;
    }
    #prince{
        position:absolute;
        top:50%;
        left:50%;
        transform:translate(-50%,-50%);
        font-size:90px;
        font-family:Arial Black, sans-serif;
        letter-spacing:18px;
        color:white;
        opacity:0;
        transition:1.5s ease;
        background:linear-gradient(90deg,#00c9ff,#9d4dff,#ff2dfb);
        -webkit-background-clip:text;
        color:transparent;
        filter:drop-shadow(0 0 20px #00aaff);
    }
</style>
</head>

<body>

<div id="prince">PRINCE</div>

<!-- Reliable CDN -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

<script>

// --------- SCENE SETUP --------- //
const scene = new THREE.Scene();

const camera = new THREE.PerspectiveCamera(
    60,
    window.innerWidth / window.innerHeight,
    0.1,
    1000
);
camera.position.set(0, 0, 15);

const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setSize(window.innerWidth, window.innerHeight);
document.body.appendChild(renderer.domElement);

// --------- SIMPLE STAR FIELD (works 100%) --------- //
const starGeo = new THREE.BufferGeometry();
const starCount = 800;
const positions = [];

for(let i=0;i<starCount;i++){
    positions.push(
        (Math.random()-0.5)*200,
        (Math.random()-0.5)*200,
        (Math.random()-0.5)*200
    );
}

starGeo.setAttribute('position', new THREE.Float32BufferAttribute(positions,3));
const starMat = new THREE.PointsMaterial({color:0xffffff, size:1});
const stars = new THREE.Points(starGeo, starMat);
scene.add(stars);

// --------- TEST SPHERE (so screen never stays black) --------- //
const testSphere = new THREE.Mesh(
    new THREE.SphereGeometry(3, 32, 32),
    new THREE.MeshBasicMaterial({color:0x5555ff})
);
scene.add(testSphere);

// --------- CAMERA ORBIT --------- //
let orbit = false;
let angle = 0;

// PRINCE reveal then orbit
setTimeout(()=>{
    document.getElementById("prince").style.opacity = 1;
    setTimeout(()=>{ orbit = true; }, 2000);
}, 2000);

// --------- ANIMATION LOOP --------- //
function animate(){
    requestAnimationFrame(animate);

    stars.rotation.y += 0.0008;
    testSphere.rotation.y += 0.002;

    if(orbit){
        angle += 0.004;
        camera.position.x = Math.sin(angle)*15;
        camera.position.z = Math.cos(angle)*15;
        camera.lookAt(0,0,0);
    }

    renderer.render(scene, camera);
}
animate();

// --------- RESIZE --------- //
window.addEventListener("resize", ()=>{
    camera.aspect = window.innerWidth/window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
});
</script>

</body>
</html>
