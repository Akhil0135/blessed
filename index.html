<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Phase 1 — IMAX Vision</title>

<style>
/* ---------- GLOBAL ---------- */
html, body {
  margin: 0;
  height: 100%;
  overflow: hidden;
  background: black;
  font-family: "Cinzel", serif;
  letter-spacing: 0.5px;
}

/* ---------- CAMERA SLOW ZOOM ---------- */
#camera {
  width: 100%;
  height: 100%;
  transform: scale(1);
  animation: zoom 20s ease-out forwards;
}
@keyframes zoom {
  from { transform: scale(1); }
  to   { transform: scale(1.08); }
}

/* ---------- STARS BACKGROUND ---------- */
#stars {
  position: absolute;
  width: 100%;
  height: 100%;
  background: radial-gradient(circle at center, #0a0a0a 0%, #000 70%);
  overflow: hidden;
  z-index: 1;
}

.star {
  position: absolute;
  width: 3px;
  height: 3px;
  background: white;
  border-radius: 50%;
  opacity: 0;
  animation: twinkle 3s infinite ease-in-out;
}

@keyframes twinkle {
  0% { opacity: 0; transform: scale(0.4); }
  50% { opacity: 1; transform: scale(1); }
  100% { opacity: 0; transform: scale(0.4); }
}

/* ---------- MOON ---------- */
#moon {
  position: absolute;
  top: 120px;
  left: 80px;
  width: 170px;
  height: 170px;
  background: radial-gradient(circle, #f4f4f4 0%, #d7d7d7 40%, #999 70%, #666 100%);
  border-radius: 50%;

  /* ★ Glow reduced drastically */
  box-shadow: 
    0 0 25px rgba(230, 230, 255, 0.45),
    0 0 50px rgba(200, 200, 255, 0.28);

  cursor: grab;
  z-index: 3;
  transition: opacity 1s ease-out;
}

/* ---------- SUN ---------- */
#sun {
  position: absolute;
  top: -300px;
  right: -200px;
  width: 360px;
  height: 360px;
  background: radial-gradient(circle,
    #fff8c2 0%,
    #ffdd55 40%,
    #ff9933 70%,
    #cc6600 100%
  );
  border-radius: 50%;
  filter: blur(1px);
  opacity: 0;
  z-index: 2;
  transition: opacity 2s ease-out, transform 2.5s ease-out;
}

/* ---------- MESSAGE ---------- */
#message {
  position: absolute;
  bottom: 100px;
  width: 100%;
  text-align: center;
  font-size: 26px;
  color: #FFECC7;
  text-shadow: 0 0 12px rgba(255,255,220,0.65);
  opacity: 0;
  letter-spacing: 2px;
  white-space: nowrap;
  z-index: 5;
  transition: opacity 0.4s ease-out;
}
</style>
</head>

<body>

<div id="camera">

  <!-- Stars -->
  <div id="stars"></div>

  <!-- Moon -->
  <div id="moon"></div>

  <!-- Sun -->
  <div id="sun"></div>

  <!-- Message -->
  <div id="message"></div>

</div>

<script>
/* ----------------------------------------------------------
   CREATE TWINKLING STARS
----------------------------------------------------------- */
const starsContainer = document.getElementById("stars");
for (let i = 0; i < 160; i++) {
  const s = document.createElement("div");
  s.className = "star";
  s.style.left = Math.random() * 100 + "vw";
  s.style.top = Math.random() * 100 + "vh";
  s.style.animationDelay = Math.random() * 3 + "s";
  starsContainer.appendChild(s);
}

/* ----------------------------------------------------------
   DRAG MOON + REVEAL MESSAGE LETTER BY LETTER
----------------------------------------------------------- */
const moon = document.getElementById("moon");
const sun = document.getElementById("sun");
const stars = document.getElementById("stars");
const msg = document.getElementById("message");

const fullText =
"ON THIS CALM BIRTHDAY EVE SO NEW, GOD SOFTLY WHISPERS, MY PLANS ARE MADE FOR YOU.";

let revealed = 0;
let dragging = false;
let offsetX, offsetY;

moon.addEventListener("mousedown", e => {
  dragging = true;
  offsetX = e.clientX - moon.offsetLeft;
  offsetY = e.clientY - moon.offsetTop;
  moon.style.cursor = "grabbing";
});

document.addEventListener("mouseup", () => {
  dragging = false;
  moon.style.cursor = "grab";
});

document.addEventListener("mousemove", e => {
  if (!dragging) return;

  moon.style.left = (e.clientX - offsetX) + "px";

  let progress = Math.min(
    Math.max((e.clientX - 50) / (window.innerWidth - 100), 0),
    1
  );

  let newLetters = Math.floor(progress * fullText.length);
  if (newLetters > revealed) {
    revealed = newLetters;
    msg.innerText = fullText.substring(0, revealed);
    msg.style.opacity = 1;
  }

  if (revealed === fullText.length) finishMoonDrag();
});

/* ----------------------------------------------------------
   WHEN MESSAGE FULLY REVEALED → MOON FADES → SUN ENTERS
----------------------------------------------------------- */
function finishMoonDrag() {
  moon.style.opacity = 0;
  msg.style.opacity = 1;

  // Stars fade out completely
  stars.style.transition = "opacity 2s ease-out";
  stars.style.opacity = 0;

  // Sun enters
  sun.style.opacity = 1;
  sun.style.transform = "translate(-150px, 260px)";
}
</script>

</body>
</html>
