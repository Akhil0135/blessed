<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cinematic Night to Day with Sparkles on Letters</title>
<style>
  body, html {
    margin:0;
    padding:0;
    width:100%;
    height:100%;
    overflow:hidden;
    font-family:'Cinzel', serif;
    background: #000; /* Night background */
    transition: background 4s ease;
  }

  /* Stars */
  .star {
    position:absolute;
    width:2px;
    height:2px;
    background:#fff;
    border-radius:50%;
    opacity:0.85;
    box-shadow:0 0 6px rgba(255,255,255,0.8);
    animation:twinkle 2.5s infinite alternate;
  }
  @keyframes twinkle{
    0%{opacity:0.3; transform:scale(1);}
    50%{opacity:1; transform:scale(1.5);}
    100%{opacity:0.3; transform:scale(1);}
  }

  /* Clouds */
  .cloud {
    position:absolute;
    width:250px;
    height:100px;
    background:rgba(255,255,255,0.07);
    border-radius:50%;
    filter:blur(20px);
    animation:moveCloud linear infinite;
  }
  @keyframes moveCloud{
    0%{left:-300px;}
    100%{left:110%;}
  }

  /* Moon */
  .moon {
    position:absolute;
    width:140px;
    height:140px;
    background: radial-gradient(circle,#fffde6 0%,#f3e4b0 60%,#d9c180 100%);
    border-radius:50%;
    top:80px;
    left:-150px;
    box-shadow:0 0 18px 4px rgba(255,255,200,0.5);
    transition:opacity 2s ease;
  }

  /* Shooting Stars */
  .shooting-star {
    position:absolute;
    width:8px;
    height:3px;
    background:linear-gradient(0deg, rgba(255,255,255,0), #fff);
    border-radius:50%;
    transform-origin:top left;
    opacity:0;
    animation:shoot 2.5s linear forwards;
  }
  @keyframes shoot{
    0%{transform:translate(0,0) rotate(-45deg); opacity:1;}
    100%{transform:translate(-70vw,70vh) rotate(-45deg); opacity:0;}
  }

  /* Message */
  #message {
    position:absolute;
    top:60%;
    width:100%;
    text-align:center;
    font-size:28px;
    color:#f9e9c9;
    opacity:1;
    letter-spacing:3px;
  }
  .letter {
    opacity:0;
    display:inline-block;
    position:relative;
    animation:revealLetter 0.5s forwards;
  }
  @keyframes revealLetter{
    0%{opacity:0; transform:translateY(10px);}
    100%{opacity:1; transform:translateY(0);}
  }

  /* Sparkle on letter */
  .letter::after {
    content:'';
    position:absolute;
    width:6px;
    height:6px;
    background: radial-gradient(circle,#fff,#fff0);
    border-radius:50%;
    top:0;
    left:50%;
    transform:translateX(-50%) scale(0);
    opacity:0;
    animation:letterSparkle 0.5s forwards;
  }
  @keyframes letterSparkle{
    0%{opacity:1; transform:translateX(-50%) scale(0);}
    50%{opacity:1; transform:translateX(-50%) scale(1.3);}
    100%{opacity:0; transform:translateX(-50%) scale(0);}
  }

  /* Click Button */
  #clickBtn {
    position:absolute;
    bottom:12vh;
    left:50%;
    transform:translateX(-50%);
    padding:14px 34px;
    font-size:20px;
    font-family:'Cinzel', serif;
    background:rgba(255,255,255,0.12);
    border:1px solid rgba(255,255,255,0.45);
    border-radius:40px;
    color:#fff;
    cursor:pointer;
    opacity:0;
    pointer-events:none;
    transition:opacity 1s ease, transform 0.5s ease;
  }
  #clickBtn.float{
    opacity:1;
    pointer-events:auto;
    animation:btnFloat 3s ease-in-out infinite;
  }
  @keyframes btnFloat{
    0%{transform:translateX(-50%) translateY(0px);}
    50%{transform:translateX(-50%) translateY(-8px);}
    100%{transform:translateX(-50%) translateY(0px);}
  }

  /* Sun */
  .sun {
    position:absolute;
    top:-100px;
    left:50%;
    transform:translateX(-50%);
    width:150px;
    height:150px;
    background: radial-gradient(circle,#ffb347 0%,#ffcc33 80%);
    border-radius:50%;
    opacity:0;
    transition:top 4s ease, opacity 4s ease;
  }

</style>
</head>
<body>

<div id="stars"></div>
<div id="clouds"></div>
<div class="moon"></div>
<div id="message"></div>
<button id="clickBtn">Click Here</button>
<div class="sun"></div>

<script>
  // Create stars
  const starCount = 200;
  const starsArr = [];
  for(let i=0;i<starCount;i++){
    const star=document.createElement('div');
    star.className='star';
    star.style.top=Math.random()*window.innerHeight+'px';
    star.style.left=Math.random()*window.innerWidth+'px';
    document.body.appendChild(star);
    starsArr.push(star);
  }

  // Create clouds
  const cloudCount = 6;
  const cloudsArr=[];
  for(let i=0;i<cloudCount;i++){
    const cloud=document.createElement('div');
    cloud.className='cloud';
    cloud.style.top=(50 + Math.random()*250)+'px';
    cloud.style.animationDuration=(35 + Math.random()*40)+'s';
    document.body.appendChild(cloud);
    cloudsArr.push(cloud);
  }

  // Shooting stars
  function createShootingStar(){
    const star=document.createElement('div');
    star.className='shooting-star';
    star.style.top=Math.random()*200+'px';
    star.style.left=window.innerWidth+'px';
    const duration=2 + Math.random()*1.5;
    star.style.animationDuration=duration+'s';
    document.body.appendChild(star);
    setTimeout(()=>{ star.remove(); }, duration*1000);
  }
  const shootingInterval = setInterval(createShootingStar,1200);

  // Message reveal
  const msg = "On this calm birthday eve so new, God softly whispers, my plans are made for you.";
  const messageDiv=document.getElementById('message');

  function revealMessage(){
    msg.split('').forEach((ch,i)=>{
      const span=document.createElement('span');
      span.className='letter';
      span.textContent = ch===' ' ? '\u00A0':ch;
      span.style.animationDelay=(0.05*i)+'s';
      messageDiv.appendChild(span);
    });
  }

  // Moon movement
  const moon=document.querySelector('.moon');
  let moonPos=-150;
  const moonSpeed=4; // faster
  const moonInterval=setInterval(()=>{
    if(moonPos < window.innerWidth - 180){
      moonPos += moonSpeed;
      moon.style.left = moonPos+'px';
    } else {
      clearInterval(moonInterval);
      clickBtn.classList.add('float');
    }
  },16);

  // Reveal message shortly after moon appears
  setTimeout(revealMessage,2000);

  // Click button logic
  const clickBtn=document.getElementById('clickBtn');
  const sun=document.querySelector('.sun');

  clickBtn.addEventListener('click',()=>{
    // Hide moon
    moon.style.opacity=0;

    // Remove stars
    starsArr.forEach(s=>s.remove());
    clearInterval(shootingInterval);
    document.querySelectorAll('.shooting-star').forEach(s=>s.remove());

    // Hide message and button
    messageDiv.style.opacity=0;
    clickBtn.style.opacity=0;
    clickBtn.style.pointerEvents='none';

    // Transition to day
    document.body.style.background='linear-gradient(to top, #87ceeb, #a0d8ff, #d0f0ff)';
    sun.style.top='50px';
    sun.style.opacity=1;

    // Increase cloud visibility
    cloudsArr.forEach(c=>{
      c.style.background='rgba(255,255,255,0.3)';
    });
  });
</script>

</body>
</html>
