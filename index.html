<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cinematic Moon-to-Sun Transition</title>

<style>
  body, html {
    margin:0; padding:0;
    width:100%; height:100%;
    overflow:hidden;
    background:#02010a;
    font-family: 'Cinzel', serif;
  }

  /* Sky */
  #sky {
    position:absolute;
    width:100%; height:100%;
    background:linear-gradient(to bottom, #02010a, #0a0f3a);
    transition:background 1s linear;
  }

  /* Sun */
  #sun {
    position:absolute;
    top:15%; left:45%;
    width:200px; height:200px;
    border-radius:50%;
    background: radial-gradient(circle, #fff9b1, #ffce3a, #e6a500);
    opacity:0;
    transform:scale(0.4);
    transition: opacity 1s ease, transform 1.5s ease;
    z-index:5;
    filter: blur(2px);
  }

  /* Moon on top-left */
  #moon {
    position:absolute;
    top:8%; left:6%;
    width:150px; height:150px;
    border-radius:50%;
    background: radial-gradient(circle, #ffffff, #d4d4d4, #9e9e9e);
    box-shadow:0 0 25px 8px rgba(255,255,255,0.25);
    z-index:10;
    cursor: grab;
    transition: transform 0.2s ease;
  }

  /* Stars */
  .star {
    position:absolute;
    width:3px; height:3px;
    background:white;
    border-radius:50%;
    opacity:0.9;
    animation: twinkle 2s infinite ease-in-out;
  }

  @keyframes twinkle {
    0% { opacity:0.3; }
    50% { opacity:1; }
    100% { opacity:0.3; }
  }

  /* Clouds */
  .cloud {
    position:absolute;
    background:white;
    opacity:0.9;
    border-radius:50%;
    filter: blur(12px);
  }

  /* Message */
  #message {
    position:absolute;
    width:100%;
    top:62%;
    text-align:center;
    z-index:12;
    color:#4B0082; /* dark violet */
    font-size:28px;
    letter-spacing:3px;
    text-shadow:0 6px 20px rgba(0,0,0,0.7);
    opacity:0;
  }

  /* Click button */
  #clickBtn {
    position: absolute;
    left: 50%;
    top: 72%; 
    transform: translateX(-50%);
    padding: 14px 36px;
    border-radius: 40px;
    background: rgba(0,0,0,0.85);
    color: #fff;
    font-family: 'Cinzel', serif;
    font-size: 20px;
    border: 1px solid rgba(255,255,255,0.18);
    opacity: 0;
    pointer-events: none;
    z-index: 13;
    cursor: pointer;
    transition: opacity 1s ease, transform 0.4s ease;
  }

  #clickBtn.float {
    opacity: 1;
    pointer-events: auto;
    animation: btnFloat 3s ease-in-out infinite;
  }

  @keyframes btnFloat {
    0% { transform: translateX(-50%) translateY(0); }
    50% { transform: translateX(-50%) translateY(-6px); }
    100% { transform: translateX(-50%) translateY(0); }
  }

</style>
</head>
<body>

<div id="sky"></div>
<div id="sun"></div>
<div id="moon"></div>
<div id="message">YOU ARE THE LIGHT OF YOUR OWN JOURNEY</div>
<button id="clickBtn">Click Here</button>

<script>
/* Stars generation */
for(let i=0;i<140;i++){
  let s=document.createElement("div");
  s.classList.add("star");
  s.style.top=Math.random()*100+"%";
  s.style.left=Math.random()*100+"%";
  document.body.appendChild(s);
}

/* Clouds */
function makeCloud(x,y,scale){
  let c=document.createElement("div");
  c.classList.add("cloud");
  c.style.width=180*scale+"px";
  c.style.height=100*scale+"px";
  c.style.top=y+"%";
  c.style.left=x+"%";
  c.style.opacity=0.7;
  document.body.appendChild(c);
}
makeCloud(10,40,1.4);
makeCloud(65,22,1.1);
makeCloud(40,65,1.2);

/* Elements */
const moon=document.getElementById("moon");
const sun=document.getElementById("sun");
const sky=document.getElementById("sky");
const stars=document.getElementsByClassName("star");
const message=document.getElementById("message");
const clickBtn=document.getElementById("clickBtn");

let isDragging=false;
let progress=0;

/* Drag moon to change progress */
moon.addEventListener("mousedown",()=>{isDragging=true;});
window.addEventListener("mouseup",()=>{isDragging=false;});
window.addEventListener("mousemove",(e)=>{
  if(!isDragging) return;

  progress += 0.003;  
  if(progress>1) progress=1;

  updateScene(progress);
});

/* Update entire scene */
function updateScene(p){
  /* Sky transition */
  sky.style.background = `linear-gradient(to bottom,
    rgb(${2 + p*200}, ${1 + p*150}, ${10 + p*60}),
    rgb(${10 + p*200}, ${15 + p*180}, ${58 + p*100})
  )`;

  /* Sun */
  sun.style.opacity=p;
  sun.style.transform=`scale(${0.4 + p*0.6})`;

  /* Stars disappear */
  for(let s of stars){
    s.style.opacity = 1 - p;
  }

  /* Message reveal */
  message.style.opacity = p;

  /* Moon stops controlling after day */
  if(p===1){
    moon.style.pointerEvents="none";
  }

  /* Button check */
  checkButton(p);
}

/* Show button after full reveal */
function checkButton(p){
  if(p>=1 && !clickBtn.classList.contains("float")){
    setTimeout(()=> clickBtn.classList.add("float"), 700);
  }
}
</script>

</body>
</html>
