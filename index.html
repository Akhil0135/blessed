<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Phase 4 — Nolan Birthday Scene</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  body { margin:0; overflow:hidden; background:#000; }
  canvas { display:block; }
</style>
</head>
<body>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/examples/js/loaders/FontLoader.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/examples/js/geometries/TextGeometry.js"></script>

<script>
let scene = new THREE.Scene();
let camera = new THREE.PerspectiveCamera(60, window.innerWidth/window.innerHeight, 0.1, 3000);
camera.position.set(0, 70, 260);

let renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(window.devicePixelRatio);
document.body.appendChild(renderer.domElement);

// ---------------- GALAXY BACKGROUND ----------------
let starGeo = new THREE.BufferGeometry();
let starCount = 1400;
let starPositions = new Float32Array(starCount * 3);
for (let i = 0; i < starCount * 3; i++) starPositions[i] = (Math.random() - 0.5) * 2600;

starGeo.setAttribute('position', new THREE.BufferAttribute(starPositions, 3));
let starMat = new THREE.PointsMaterial({ color: 0xffffff, size: 2 });
let stars = new THREE.Points(starGeo, starMat);
scene.add(stars);

// ---------------- LIGHTING (IMAX / NOLAN STYLE) ----------------
scene.add(new THREE.AmbientLight(0xffffff, 0.2));

let keyLight = new THREE.DirectionalLight(0xfff2cc, 1.0);
keyLight.position.set(150, 200, 100);
scene.add(keyLight);

let rimLight = new THREE.PointLight(0xffcc66, 1.5, 2000);
rimLight.position.set(-120, 160, -200);
scene.add(rimLight);

// ---------------- TEXT ----------------
const loader = new THREE.FontLoader();

let textMain, textPrince;

loader.load("https://threejs.org/examples/fonts/helvetiker_regular.typeface.json", (font) => {

    // HAPPY BIRTHDAY
    let hbGeo = new THREE.TextGeometry("HAPPY BIRTHDAY", {
        font: font,
        size: 18,
        height: 3,
        curveSegments: 12
    });
    hbGeo.center();
    let hbMat = new THREE.MeshStandardMaterial({
        color: 0xffffff,
        metalness: 0.3,
        roughness: 0.35
    });
    textMain = new THREE.Mesh(hbGeo, hbMat);
    textMain.position.y = 30;
    scene.add(textMain);

    // PRINCE (NOLAN STYLE UPGRADE)
    let princeGeo = new THREE.TextGeometry("PRINCE", {
        font: font,
        size: 34,
        height: 6,
        curveSegments: 18,
        bevelEnabled: true,
        bevelThickness: 2,
        bevelSize: 1.2,
        bevelSegments: 6
    });
    princeGeo.center();

    // Premium metallic chrome + gold
    let princeMat = new THREE.MeshStandardMaterial({
        color: 0xcccccc,
        metalness: 0.95,
        roughness: 0.1,
        emissive: 0x331a00,  
        emissiveIntensity: 0.25
    });

    textPrince = new THREE.Mesh(princeGeo, princeMat);
    textPrince.position.y = -10;
    scene.add(textPrince);
});

// ---------------- CAMERA ORBIT ----------------
let angle = 0;

function animate(){
    requestAnimationFrame(animate);

    stars.rotation.y += 0.0004;
    stars.rotation.x += 0.00015;

    angle += 0.0018;

    camera.position.x = Math.sin(angle) * 260;
    camera.position.z = Math.cos(angle) * 260;
    camera.lookAt(0, 10, 0);

    renderer.render(scene, camera);
}
animate();

// ---------------- RESIZE ----------------
window.addEventListener("resize", ()=>{
    camera.aspect = window.innerWidth/window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
});
</script>

</body>
</html>
