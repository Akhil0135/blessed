<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Cinematic Night → Day</title>
<style>
  html,body{
    height:100%; margin:0; overflow:hidden;
    font-family:"Cinzel",serif; background:#000010;
    -webkit-font-smoothing:antialiased; -moz-osx-font-smoothing:grayscale;
  }
  :root{
    --sky-night:#000010;
    --sky-day-top:#87ceeb;
    --sky-day-mid:#a0d8ff;
    --sky-day-bottom:#d0f0ff;
    --sun-color:#ffcf6b;
    --grain-opacity:0.03;
  }

  /* ---------- Stars ---------- */
  #stars { position:absolute; inset:0; pointer-events:none; z-index:2; }
  .star{
    position:absolute; width:2px; height:2px; border-radius:50%;
    background:#fff; box-shadow:0 0 6px rgba(255,255,255,0.9);
    opacity:0.5; animation:twinkle 2.6s infinite alternate;
  }
  @keyframes twinkle{
    0%{opacity:0.15; transform:scale(1);}
    50%{opacity:0.95; transform:scale(1.6);}
    100%{opacity:0.15; transform:scale(1);}
  }
  .shooting-star{
    position:absolute; width:10px; height:3px; border-radius:8px;
    background:linear-gradient(90deg, rgba(255,255,255,0) 0%, rgba(255,255,255,1) 40%, rgba(255,255,255,0) 100%);
    filter:blur(1px); transform-origin:left top; opacity:0;
  }

  /* ---------- Moon ---------- */
  .moon{
    position:absolute; width:150px; height:150px; border-radius:50%;
    top:60px; left:-180px;
    background: radial-gradient(circle, #fffde6 0%, #f3e4b0 60%, #d9c180 100%);
    box-shadow:0 0 80px rgba(255,245,200,0.45); z-index:6;
    transition:opacity .8s linear;
  }

  /* ---------- Clouds ---------- */
  .cloud-layer{ position:absolute; top:0; left:-20%; width:140%; height:60%; pointer-events:none; z-index:5; mix-blend-mode:screen; }
  .cloud-group{ position:absolute; width:100%; height:100%; transform-origin:center; filter: blur(10px) saturate(1.05); opacity:0.9; }
  .cloud-group.back{ filter:blur(22px) contrast(.9); opacity:.55; animation:driftBack 180s linear infinite; }
  .cloud-group.mid{ filter:blur(12px) contrast(1); opacity:.75; animation:driftMid 120s linear infinite; }
  .cloud-group.front{ filter:blur(6px) contrast(1.05); opacity:.95; animation:driftFront 80s linear infinite; }
  @keyframes driftBack { from{ transform:translateX(-8%);} to{ transform:translateX(8%);} }
  @keyframes driftMid  { from{ transform:translateX(-12%);} to{ transform:translateX(12%);} }
  @keyframes driftFront{ from{ transform:translateX(-18%);} to{ transform:translateX(18%);} }
  .cloud-blob{
    position:absolute; background:radial-gradient(circle at 35% 35%, rgba(255,255,255,0.98) 0%, rgba(255,255,255,0.86) 25%, rgba(255,255,255,0.6) 50%, rgba(200,200,200,0.15) 80%, rgba(255,255,255,0) 100%);
    border-radius:50%; filter: blur(10px); opacity:0.95; mix-blend-mode:screen;
  }

  /* ---------- Godrays ---------- */
  .godrays {
    position:absolute; inset:0; pointer-events:none; z-index:7;
    background: repeating-linear-gradient(75deg, rgba(255,244,210,0.08) 0px, rgba(255,244,210,0.02) 120px, rgba(255,244,210,0) 240px);
    mix-blend-mode:screen; opacity:0; transition:opacity 2.6s ease; filter: blur(6px) contrast(1.1);
  }

  /* ---------- Fog ---------- */
  .low-fog{
    position:absolute; bottom:0; left:0; width:100%; height:40%; pointer-events:none;
    background: radial-gradient(circle at 50% 95%, rgba(255,255,255,0.95) 0%, rgba(255,255,255,0.45) 30%, rgba(255,255,255,0) 100%);
    filter: blur(48px); opacity:0.7; z-index:4; animation:fogFloat 45s ease-in-out infinite; transition:opacity 2.5s ease;
  }
  @keyframes fogFloat { 0%,100%{ transform: translateX(0);} 50%{ transform: translateX(4%);} }

  /* ---------- Sun ---------- */
  .sun{
    position:absolute; left:50%; transform:translateX(-50%); top:-220px;
    width:220px; height:220px; border-radius:50%; pointer-events:none; z-index:8;
    transition: top 3.2s ease, opacity 3s ease, box-shadow 3s ease; opacity:0;
    background: radial-gradient(circle at 35% 35%, rgba(255,250,220,1) 0%, rgba(255,210,120,1) 45%, rgba(255,170,60,0.9) 100%);
    box-shadow:0 0 140px 48px rgba(255,220,120,0.12),0 0 320px 120px rgba(255,200,80,0.07);
  }
  .sun-rings{
    position:absolute; inset:-30% -30% auto -30%; height:300%; border-radius:50%;
    pointer-events:none; filter: blur(30px); opacity:0; transition: opacity 3s ease; mix-blend-mode: screen;
    background: radial-gradient(circle, rgba(255,245,200,0.12), rgba(255,230,140,0.08), rgba(255,200,80,0));
  }

  /* ---------- Grade, vignette, particles ---------- */
  .grade{position:absolute; inset:0; pointer-events:none; z-index:20; mix-blend-mode: soft-light; background: linear-gradient(180deg, rgba(255,240,220,0.06), rgba(30,40,70,0.15)); opacity:1; transition:opacity 2s ease;}
  .vignette{position:absolute; inset:0; pointer-events:none; z-index:25; background: radial-gradient(ellipse at 50% 30%, rgba(0,0,0,0) 40%, rgba(0,0,0,0.18) 100%); mix-blend-mode:multiply;}
  .particles{position:absolute; inset:0; pointer-events:none; z-index:15; overflow:hidden;}
  .particle{position:absolute; width:4px; height:4px; border-radius:50%; background: rgba(255,245,220,0.9); filter: blur(1px); opacity:.0; transform: translateY(0);}

  /* ---------- Message & button ---------- */
  #message{position:absolute; width:100%; top:62%; text-align:center; z-index:12; color:#fff3da; font-size:28px; letter-spacing:3px; text-shadow:0 6px 20px rgba(0,0,0,0.7); opacity:0; transition:opacity .6s ease;}
  .letter{ display:inline-block; opacity:0; transform: translateY(8px); animation:reveal .45s forwards;}
  @keyframes reveal{ to{opacity:1; transform:translateY(0);} }

  #clickBtn{position:absolute; left:50%; bottom:10vh; transform:translateX(-50%);
    z-index:13; padding:14px 34px; border-radius:40px;
    background: rgba(255,255,255,0.12); color:#fff;
    border:1px solid rgba(255,255,255,0.18); cursor:pointer;
    font-family:'Cinzel', serif; font-size:20px; opacity:0; pointer-events:none; transition:opacity 1s ease, transform .4s ease;
  }
  #clickBtn.float{ opacity:1; pointer-events:auto; animation:btnFloat 3s ease-in-out infinite;}
  @keyframes btnFloat{0%{transform:translateX(-50%) translateY(0);}50%{transform:translateX(-50%) translateY(-6px);}100%{transform:translateX(-50%) translateY(0);} }

  /* ---------- Utility day transition ---------- */
  .day{ background: linear-gradient(to top, var(--sky-day-mid), var(--sky-day-top)); transition: background 3.2s ease; }
</style>
</head>
<body>

<div id="stars"></div>
<div class="moon" id="moon"></div>
<div class="cloud-layer" id="cloudLayer">
  <div class="cloud-group back" id="cloudBack"></div>
  <div class="cloud-group mid" id="cloudMid"></div>
  <div class="cloud-group front" id="cloudFront"></div>
</div>
<div class="godrays" id="godrays"></div>
<div class="low-fog" id="lowFog"></div>
<div class="sun" id="sun"><div class="sun-rings" id="sunRings"></div></div>
<div class="particles" id="particles"></div>
<div class="grade"></div>
<div class="vignette"></div>
<div id="message"></div>
<button id="clickBtn">Click Here</button>

<script>
const rnd=(a,b)=>a+Math.random()*(b-a);

// Stars
const starsEl=document.getElementById('stars');
for(let i=0;i<220;i++){
  const s=document.createElement('div');
  s.className='star';
  s.style.left=rnd(0,100)+'%';
  s.style.top=rnd(0,100)+'%';
  s.style.opacity=rnd(0.15,0.95);
  s.style.transform=`scale(${rnd(0.6,1.6)})`;
  starsEl.appendChild(s);
}

// Shooting stars
function spawnShooting(){
  const s=document.createElement('div');
  s.className='shooting-star';
  s.style.top=rnd(5,35)+'vh';
  s.style.left='110%';
  const angle=-20-rnd(0,40);
  s.style.transform=`rotate(${angle}deg)`;
  s.style.opacity='1';
  document.body.appendChild(s);
  const duration=rnd(900,1600);
  s.animate([{ transform: `translateX(0) translateY(0) rotate(${angle}deg)`, opacity:1 },
             { transform: `translateX(-120vw) translateY(80vh) rotate(${angle}deg)`, opacity:0 }],
             {duration, easing:'cubic-bezier(.2,.6,.2,1)'});
  setTimeout(()=>s.remove(),duration+50);
}
function scheduleShooting(){
  spawnShooting();
  setTimeout(scheduleShooting,rnd(1200,2500));
}
scheduleShooting();

// Moon arc movement
const moon=document.getElementById('moon');
let moonX=-200;
const moonSpeed=Math.max(window.innerWidth/800,4);
let messageShown=false;
const messageEl=document.getElementById('message');

function revealMessage(){
  if(messageEl.dataset.revealed)return;
  messageEl.dataset.revealed='1';
  const text="On this calm birthday eve so new, God softly whispers, my plans are made for you.";
  messageEl.innerHTML='';
  text.split('').forEach((ch,i)=>{
    const span=document.createElement('span');
    span.className='letter';
    span.style.animationDelay=(i*0.045)+'s';
    span.textContent=ch===' '?'\u00A0':ch;
    messageEl.appendChild(span);
  });
  messageEl.style.opacity='1';
}

// Clouds
function makeCloudBlob(container,leftPct,topPct,w,h,opacity=1){
  const b=document.createElement('div');
  b.className='cloud-blob';
  b.style.left=leftPct+'%';
  b.style.top=topPct+'%';
  b.style.width=w+'px';
  b.style.height=h+'px';
  b.style.opacity=opacity;
  container.appendChild(b);
}
function populateClouds(){
  const back=document.getElementById('cloudBack');
  const mid=document.getElementById('cloudMid');
  const front=document.getElementById('cloudFront');
  [back,mid,front].forEach(el=>el.innerHTML='');
  for(let i=0;i<5;i++) makeCloudBlob(back,rnd(-40,120),rnd(-5,40),rnd(700,1200),rnd(260,420),rnd(0.35,0.7));
  for(let i=0;i<10;i++) makeCloudBlob(mid,rnd(-30,120),rnd(5,50),rnd(380,760),rnd(160,260),rnd(0.45,0.9));
  for(let i=0;i<12;i++) makeCloudBlob(front,rnd(-10,120),rnd(12,65),rnd(160,440),rnd(90,180),rnd(0.5,1));
}
populateClouds();

// Particles
const particlesContainer=document.getElementById('particles');
for(let i=0;i<60;i++){
  const p=document.createElement('div');
  p.className='particle';
  resetParticle(p,true);
  particlesContainer.appendChild(p);
}
function resetParticle(p,initial=false){
  const left=rnd(0,100);
  const bottom=rnd(-20,100);
  const scale=rnd(.4,1.3);
  p.style.left=left+'%';
  p.style.bottom=bottom+'px';
  p.style.width=(2+Math.random()*4)+'px';
  p.style.height=p.style.width;
  p.style.opacity=(0.2+Math.random()*0.9);
  p.style.transform=`translateY(${initial?rnd(0,-60):0}px) scale(${scale})`;
  const dur=rnd(8000,22000);
  p.animate([{ transform: `translateY(${rnd(0,20)}px) scale(${scale})`, opacity: p.style.opacity },
             { transform: `translateY(-140vh) scale(${scale*0.6})`, opacity:0 }], {duration:dur,iterations:1,easing:'linear'}).onfinish=()=>resetParticle(p);
}

// Button and day transition
const clickBtn=document.getElementById('clickBtn');
const sun=document.getElementById('sun');
const sunRings=document.getElementById('sunRings');
const godrays=document.getElementById('godrays');
const cloudShadow=document.getElementById('cloudShadow');
const lowFog=document.getElementById('lowFog');
let day=false;

clickBtn.addEventListener('click',()=>{
  if(day) return;
  day=true;

  // fade out stars
  document.querySelectorAll('.star').forEach(s=>{
    s.animate([{opacity:s.style.opacity||1},{opacity:0}],{duration:1200,fill:'forwards'});
    setTimeout(()=>s.remove(),1300);
  });

  // Moon fade
  moon.animate([{opacity:1},{opacity:0}],{duration:900,fill:'forwards'});

  // Sky gradient
  document.body.animate([{background:'var(--sky-night)'},
                         {background:'linear-gradient(to top, var(--sky-day-mid), var(--sky-day-top))'}],{duration:5000,fill:'forwards'});

  // Sun rise
  sun.style.top='60px';
  sun.style.opacity='1';
  sunRings.style.opacity='1';

  // Godrays
  godrays.style.opacity='1';
  godrays.animate([{opacity:0},{opacity:1}],{duration:2000,fill:'forwards'});

  // Fog and shadow
  lowFog.animate([{opacity:0.85},{opacity:0.25}],{duration:3000,fill:'forwards'});
  cloudShadow?.animate([{opacity:0.45},{opacity:0.14}],{duration:3400,fill:'forwards'});

  // Message fade out
  messageEl.animate([{opacity:1},{opacity:0}],{duration:900,fill:'forwards'});
  setTimeout(()=>messageEl.style.opacity='0',900);

  // particles color shift
  document.querySelectorAll('.particle').forEach(p=>{
    p.animate([{background:'rgba(255,245,220,0.75)'},{background:'rgba(255,210,140,0.9)'}],{duration:2800,fill:'forwards'});
  });

  document.querySelector('.grade').animate([{opacity:0.9},{opacity:1}],{duration:2000,fill:'forwards'});
});

// Moon animation loop
let moonAnim=setInterval(()=>{
  if(moonX<window.innerWidth+200){
    moonX+=moonSpeed;
    moon.style.left=moonX+'px';
    moon.style.top=(80+Math.sin((moonX/window.innerWidth)*Math.PI)*80)+'px';
    if(moonX>60 && !messageShown){ revealMessage(); messageShown=true; clickBtn.classList.add('float'); }
  }
},30);

</script>
</body>
</html>
