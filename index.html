<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>IMAX Nolan — Wooden Cross</title>
<style>
  body{
    margin:0;
    height:100vh;
    background:black;
    overflow:hidden;
    display:flex;
    justify-content:center;
    align-items:center;
    position:relative;
    font-family:system-ui;
  }

  /* --------------------------------------------------
        TWINKLING STARS • Nolan / IMAX Style
  -------------------------------------------------- */
  .stars{
    position:absolute;
    top:0; left:0;
    width:100%; height:100%;
    pointer-events:none;
    overflow:hidden;
  }

  .star{
    position:absolute;
    width:2px; height:2px;
    background:white;
    border-radius:50%;
    opacity:0;
    animation:twinkle 3s infinite ease-in-out;
  }

  @keyframes twinkle{
    0%{opacity:0;}
    50%{opacity:0.9; transform:scale(1.6);}
    100%{opacity:0;}
  }

  /* Generate stars with JS */
  
  /* --------------------------------------------------
        THE WOODEN CROSS — FINAL VERSION
  -------------------------------------------------- */
  .cross{
    position:absolute;
    top:-40%;   /* start well above screen */
    left:50%;
    transform:translateX(-50%) scale(0.8);
    opacity:0;

    width:120px;       /* horizontal beam width */
    height:360px;      /* vertical beam height */

    display:flex;
    justify-content:center;
    align-items:flex-start;

    animation:crossDescend 5.5s ease-out forwards 1.2s;
  }

  /* Vertical beam */
  .v-beam{
    position:absolute;
    width:40px;
    height:360px;
    background:
      linear-gradient(90deg, #2b1b0e, #3d2815, #2b1b0e),
      repeating-linear-gradient(
        90deg,
        rgba(255,255,255,0.08) 0px,
        rgba(255,255,255,0.08) 4px,
        transparent 4px,
        transparent 8px
      );
    border-radius:6px;
    box-shadow:
      inset 0 0 12px rgba(0,0,0,0.55),
      0 18px 28px rgba(0,0,0,0.6);
  }

  /* Horizontal beam */
  .h-beam{
    position:absolute;
    top:110px;
    width:120px;
    height:40px;
    background:
      linear-gradient(90deg, #2b1b0e, #3d2815, #2b1b0e),
      repeating-linear-gradient(
        90deg,
        rgba(255,255,255,0.07) 0px,
        rgba(255,255,255,0.07) 4px,
        transparent 4px,
        transparent 8px
      );
    border-radius:6px;
    box-shadow:
      inset 0 0 12px rgba(0,0,0,0.55),
      0 14px 24px rgba(0,0,0,0.55);
  }

  /* --------------------------------------------------
        CROSS ENTRY ANIMATION
  -------------------------------------------------- */
  @keyframes crossDescend{
    0%{
      top:-40%;
      opacity:0;
      transform:translateX(-50%) scale(0.75);
    }
    60%{
      opacity:1;
    }
    100%{
      top:35%;
      opacity:1;
      transform:translateX(-50%) scale(1);
    }
  }
</style>
</head>
<body>

<div class="stars"></div>

<!-- REAL WOODEN CROSS -->
<div class="cross">
  <div class="v-beam"></div>
  <div class="h-beam"></div>
</div>

<script>
/* -------------------------------
        STAR GENERATION LOGIC
-------------------------------- */
const starContainer = document.querySelector('.stars');

for(let i=0; i<150; i++){
  let s = document.createElement('div');
  s.className = 'star';
  s.style.left = Math.random()*100 + "%";
  s.style.top = Math.random()*100 + "%";
  s.style.animationDelay = (Math.random()*4) + "s";
  s.style.transform = `scale(${Math.random()*1.8 + 0.6})`;
  starContainer.appendChild(s);
}
</script>

</body>
</html>
