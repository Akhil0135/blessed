<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>IMAX Nolan Phase 1</title>
<style>
    body {
        margin: 0;
        padding: 0;
        overflow: hidden;
        background: #000;
        user-select: none;
        font-family: "Georgia", serif;
    }
    canvas {
        position: absolute;
        inset: 0;
        z-index: -1;
    }
    #moon {
        position: absolute;
        width: 150px;
        height: 150px;
        border-radius: 50%;
        background: radial-gradient(circle, #fff 0%, #e0e0e0 30%, #bfbfbf 80%);
        box-shadow: 0 0 60px 20px rgba(255,255,255,0.25),
                    0 0 120px 50px rgba(100,120,255,0.12);
        top: 60px;
        left: 60px;
        cursor: grab;
        z-index: 10;
    }
    #msgBox {
        position: fixed;
        bottom: 55px;
        left: 50%;
        transform: translateX(-50%);
        white-space: nowrap;
        font-size: 18px;
        font-weight: bold;
        color: #d8e2ff;
        letter-spacing: 1.5px;
        text-shadow: 0 0 12px rgba(150,190,255,0.7);
        z-index: 50;
    }
    #msgBox span {
        opacity: 0;
        transition: opacity 0.22s ease-in;
    }
    #msgBox span.show {
        opacity: 1;
    }
</style>
</head>
<body>

<canvas id="starCanvas"></canvas>
<div id="moon"></div>
<div id="msgBox"></div>

<script>
// ------------------ Canvas & Stars ------------------
const canvas = document.getElementById("starCanvas");
const ctx = canvas.getContext("2d");
let width = canvas.width = window.innerWidth;
let height = canvas.height = window.innerHeight;

window.addEventListener("resize", ()=>{
    width = canvas.width = window.innerWidth;
    height = canvas.height = window.innerHeight;
});

const starCount = 300;
const stars = [];
for(let i=0;i<starCount;i++){
    stars.push({
        x: Math.random()*width,
        y: Math.random()*height,
        size: Math.random()*1.5+0.3,
        twinkle: Math.random()*0.02+0.002,
        baseAlpha: Math.random()*0.5+0.3,
        depth: Math.random()*0.7+0.3
    });
}

// ------------------ Draw Stars ------------------
function drawStars(){
    stars.forEach(s=>{
        const alpha = s.baseAlpha + Math.sin(Date.now()*s.twinkle)*0.5;
        ctx.fillStyle = `rgba(255,255,255,${alpha*s.depth})`;
        ctx.beginPath();
        ctx.arc(s.x, s.y, s.size, 0, Math.PI*2);
        ctx.fill();
    });
}

// ------------------ Message Setup ------------------
const moon = document.getElementById("moon");
const msgBox = document.getElementById("msgBox");
const text = "On this calm birthday eve so new, God softly whispers, my plans are made for you.";

msgBox.innerHTML = "";
for(let c of text){
    let s = document.createElement("span");
    s.textContent = c;
    msgBox.appendChild(s);
}
const spans = msgBox.querySelectorAll("span");

let dragging = false;
let offsetX = 0;
let lastShown = 0;
let locked = false;

// ------------------ Moon Drag ------------------
moon.addEventListener("mousedown", e=>{
    dragging = true;
    offsetX = e.clientX - moon.offsetLeft;
    moon.style.transition = "none";
});
window.addEventListener("mouseup", ()=> dragging = false);
window.addEventListener("mousemove", e=>{
    if(!dragging) return;
    let x = e.clientX - offsetX;
    const maxX = window.innerWidth - moon.clientWidth - 20;
    if(x<20) x=20;
    if(x>maxX) x=maxX;
    moon.style.left = x + "px";

    if(!locked){
        let progress = (x-20)/(maxX-20);
        if(progress<0) progress=0;
        if(progress>1) progress=1;
        let target = Math.floor(progress*spans.length);
        if(target>lastShown){
            for(let i=lastShown;i<target;i++){
                spans[i].classList.add("show");
            }
            lastShown = target;
            if(lastShown >= spans.length) locked = true;
        }
    }
});

// ------------------ Animate ------------------
function animate(){
    // IMAX Cinematic Gradient
    const bg = ctx.createLinearGradient(0,0,0,height);
    bg.addColorStop(0,'#000010');
    bg.addColorStop(1,'#000022');
    ctx.fillStyle = bg;
    ctx.fillRect(0,0,width,height);

    // Volumetric nebula haze (soft clouds)
    const haze = ctx.createRadialGradient(width*0.8, height*0.2, 50, width*0.8, height*0.2, 400);
    haze.addColorStop(0,'rgba(100,120,255,0.08)');
    haze.addColorStop(1,'rgba(0,0,0,0)');
    ctx.fillStyle = haze;
    ctx.fillRect(0,0,width,height);

    // Subtle drift for cinematic feeling
    const driftX = Math.sin(Date.now()*0.0002)*25;
    const driftY = Math.cos(Date.now()*0.00015)*18;
    ctx.save();
    ctx.translate(driftX, driftY);

    drawStars();

    ctx.restore();

    requestAnimationFrame(animate);
}

animate();
</script>
</body>
</html>
