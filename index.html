<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IMAX Cinematic — Moon, Shield & Divine Reveal</title>
<style>
html,body{
    margin:0; padding:0; overflow:hidden;
    background:#0a0d19;
    font-family:"Cinzel", serif;
}
canvas{
    display:block;
}
#phaseMessage{
    position:absolute;
    top:50%; left:50%;
    transform:translate(-50%,-50%) scale(0.2);
    color:#ffdFA0;
    font-size:32px;
    text-align:center;
    opacity:0;
    transition: all 1s ease-out;
    pointer-events:none;
}
#verse{
    position:absolute;
    top:40px;
    left:50%;
    transform:translateX(-50%) scale(0.2);
    font-size:32px;
    color:#ffe9a6;
    text-shadow:0 0 8px #fff2b3,0 0 15px #e6d37a;
    opacity:0;
    transition: all 1s ease-out;
    white-space:nowrap;
    pointer-events:none;
}
#princeDaivik{
    position:absolute;
    top:50%; left:50%;
    transform:translate(-50%,-50%) scale(0.2);
    font-size:48px;
    color:#ffdFA0;
    text-align:center;
    opacity:0;
    transition: all 1s ease-out;
    pointer-events:none;
}
</style>
</head>
<body>
<canvas id="canvas"></canvas>
<div id="phaseMessage">Your single-line message here</div>
<div id="verse">He counts the stars and calls them each by name — Psalm 147:4</div>
<div id="princeDaivik">PRINCE → DAIVIK</div>

<script>
const canvas=document.getElementById("canvas");
const ctx=canvas.getContext("2d");
let width=window.innerWidth,height=window.innerHeight;
canvas.width=width; canvas.height=height;

let stars=[],bgStars=[],shieldX,shieldY,R,starSpin=false,starAngle=0;
let phase=1; // 1=moon, 2=shield, 3=princeDaivik

// ---------------- Background Stars ----------------
for(let i=0;i<200;i++){
    bgStars.push({x:Math.random()*width,y:Math.random()*height,r:Math.random()*1.5+0.5,tw:Math.random()*0.02+0.005});
}

// ---------------- Phase 1: Moon & Message ----------------
let moonX=width/2,moonY=height/2,rMoon=80;
let moonDragging=false;

canvas.addEventListener('mousedown',(e)=>{
    if(phase===1){
        let dx=e.clientX-moonX, dy=e.clientY-moonY;
        if(Math.sqrt(dx*dx+dy*dy)<=rMoon) moonDragging=true;
    }
});
canvas.addEventListener('mousemove',(e)=>{
    if(moonDragging){ moonX=e.clientX; moonY=e.clientY; }
});
canvas.addEventListener('mouseup',()=>{moonDragging=false;});
canvas.addEventListener('mouseleave',()=>{moonDragging=false;});

// ---------------- Phase 2: Shield ----------------
shieldX=width/2; shieldY=height/2; R=Math.min(width,height)/3;

// ---------------- Animate Loop ----------------
function animate(){
    ctx.fillStyle="#0a0d19"; ctx.fillRect(0,0,width,height);

    // Twinkling background stars
    bgStars.forEach(s=>{
        const glow=(Math.sin(Date.now()*s.tw)+1)*0.5;
        ctx.fillStyle=`rgba(255,255,255,${glow})`;
        ctx.beginPath();
        ctx.arc(s.x,s.y,s.r,0,Math.PI*2);
        ctx.fill();
    });

    if(phase===1){
        // Draw moon
        const moonGrad=ctx.createRadialGradient(moonX,moonY,rMoon*0.2,moonX,moonY,rMoon);
        moonGrad.addColorStop(0,'#ccc'); moonGrad.addColorStop(1,'#555');
        ctx.fillStyle=moonGrad;
        ctx.beginPath(); ctx.arc(moonX,moonY,rMoon,0,Math.PI*2); ctx.fill();
    } else if(phase===2){
        drawShield();
        if(starSpin) starAngle+=0.035;
    }

    requestAnimationFrame(animate);
}
animate();

// ---------------- Phase 1 → Phase 2 Transition ----------------
function phase1Complete(){
    const msgDiv=document.getElementById("phaseMessage");
    msgDiv.style.opacity=1; msgDiv.style.transform="translate(-50%,-50%) scale(1)";
    setTimeout(()=>{
        msgDiv.style.opacity=0; msgDiv.style.transform="translate(-50%,-50%) scale(0.2)";
        setTimeout(()=>{phase=2;},1000);
    },2500);
}

// ---------------- Draw Shield ----------------
function drawShield(){
    ctx.save();
    ctx.translate(shieldX,shieldY);

    // Outer Red
    let g1=ctx.createRadialGradient(0,0,R*0.2,0,0,R);
    g1.addColorStop(0,"#3c0000"); g1.addColorStop(1,"#7a0000");
    ctx.fillStyle=g1; ctx.beginPath(); ctx.arc(0,0,R,0,Math.PI*2); ctx.fill();

    // White
    let g2=ctx.createRadialGradient(0,0,R*0.1,0,0,R*0.75);
    g2.addColorStop(0,"#dadada"); g2.addColorStop(1,"#f5f5f5");
    ctx.fillStyle=g2; ctx.beginPath(); ctx.arc(0,0,R*0.75,0,Math.PI*2); ctx.fill();

    // Inner Red
    let g3=ctx.createRadialGradient(0,0,R*0.1,0,0,R*0.5);
    g3.addColorStop(0,"#4b0000"); g3.addColorStop(1,"#8c0000");
    ctx.fillStyle=g3; ctx.beginPath(); ctx.arc(0,0,R*0.5,0,Math.PI*2); ctx.fill();

    // Blue metallic
    let g4=ctx.createRadialGradient(0,0,R*0.05,0,0,R*0.35);
    g4.addColorStop(0,"#b4c7e0"); g4.addColorStop(1,"#001933");
    ctx.fillStyle=g4; ctx.beginPath(); ctx.arc(0,0,R*0.35,0,Math.PI*2); ctx.fill();

    // Star
    ctx.save();
    if(starSpin) ctx.rotate(starAngle);
    let starR=R*0.28;
    ctx.beginPath();
    for(let i=0;i<5;i++){
        let o=(Math.PI*2/5)*i-Math.PI/2;
        let n=o+Math.PI/5;
        ctx.lineTo(Math.cos(o)*starR,Math.sin(o)*starR);
        ctx.lineTo(Math.cos(n)*starR*0.45,Math.sin(n)*starR*0.45);
    }
    ctx.closePath();
    ctx.shadowColor="rgba(255,255,255,0.25)";
    ctx.shadowBlur=5;
    let sg=ctx.createRadialGradient(0,0,starR*0.1,0,0,starR);
    sg.addColorStop(0,"#ffffff"); sg.addColorStop(0.4,"#eeeeee"); sg.addColorStop(1,"#7a7a7a");
    ctx.fillStyle=sg; ctx.fill();
    ctx.restore();
    ctx.restore();
}

// ---------------- Shield Star Click → Verse ----------------
const verseDiv=document.getElementById("verse");
canvas.addEventListener("click",e=>{
    if(phase===2){
        const dx=e.clientX-shieldX;
        const dy=e.clientY-shieldY;
        if(Math.sqrt(dx*dx+dy*dy)<=R*0.28){
            starSpin=true;
            showVerse();
        }
    }
});

function showVerse(){
    verseDiv.style.opacity=1;
    verseDiv.style.transform="translateX(-50%) scale(1)";
    setTimeout(()=>{phase=3; showPrinceDaivik();},2500);
}

// ---------------- Phase 3 → PRINCE → DAIVIK ----------------
const pdDiv=document.getElementById("princeDaivik");
function showPrinceDaivik(){
    pdDiv.style.opacity=1; pdDiv.style.transform="translate(-50%,-50%) scale(1)";
}
  
// ---------------- Start Phase 1 automatically after 1s ----------------
setTimeout(()=>{phase1Complete();},1000);

</script>
</body>
</html>
