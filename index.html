<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>IMAX Cinematic Night to Day</title>
<style>
html,body{
  height:100%;
  margin:0;
  overflow:hidden;
  font-family:"Cinzel",serif;
  background:#000;
}

/* ---------- Scene Container ---------- */
#scene{
  position:relative;
  width:100%;
  height:100%;
  overflow:hidden;
}

/* ---------- SKY ---------- */
#sky{
  position:absolute;
  inset:0;
  background:linear-gradient(to bottom,#030014,#120034 40%,#1a0046 70%);
  transition:background 2.5s ease;
  pointer-events:none;
}

/* Day sky */
.daySky{
  background:linear-gradient(to bottom,#52d3ff,#ffe6ab 60%,#ffd37c 90%);
}

/* ---------- MOON ---------- */
#moon{
  position:absolute;
  width:180px;
  height:180px;
  border-radius:50%;
  background:#d9d8ff;
  box-shadow:0 0 50px #c5c4ff;
  top:28%;
  left:22%;
  transform:translate(-50%,-50%) rotate(0deg);
  transition:opacity 2.5s ease, transform 2.5s ease;
  pointer-events:none;
}

/* ---------- SUN ---------- */
#sun{
  position:absolute;
  width:300px;
  height:300px;
  border-radius:50%;
  background:radial-gradient(circle,#ffd27f,#ff9a00);
  box-shadow:0 0 170px #ffb54c,0 0 300px #ff7b00;
  opacity:0;
  right:-200px;
  top:21%;
  transform:translate(240px,260px) scale(0.35);
  transition:opacity 2.5s ease, transform 2.5s ease;
  pointer-events:none;
}

/* ---------- MESSAGE ---------- */
#msg{
  position:absolute;
  width:100%;
  text-align:center;
  bottom:20%;
  color:#c38bff;
  font-size:2rem;
  font-weight:700;
  opacity:0;
  text-shadow:0 0 25px #8e3fff;
  pointer-events:none;
}

/* ---------- BUTTON ---------- */
#btn{
  position:absolute;
  left:50%;
  bottom:14%;
  transform:translateX(-50%);
  background:linear-gradient(to right,#6a00ff,#c200ff);
  color:#fff;
  font-size:1.25rem;
  padding:14px 34px;
  border:none;
  border-radius:16px;
  cursor:pointer;
  box-shadow:0 0 20px #9400ff;
  opacity:0;
  transition:opacity 1.4s ease;
}

/* ---------- CROSS ---------- */
#cross{
  position:absolute;
  left:50%;
  transform:translateX(-50%) scale(0.75);
  top:15%;
  width:0;
  height:0;
  opacity:0;
  pointer-events:none;
  transition:opacity 2.5s ease, transform 2.5s ease;
}

/* Vertical bar */
.cross-vertical{
  position:absolute;
  left:50%;
  transform:translateX(-50%);
  width:24px;
  height:260px;
  background:#30006b;
  box-shadow:0 0 40px #7a00ff;
}

/* Horizontal bar at 35% */
.cross-horizontal{
  position:absolute;
  left:50%;
  transform:translateX(-50%);
  width:180px;
  height:24px;
  top:calc(260px * 0.35);
  background:#30006b;
  box-shadow:0 0 40px #7a00ff;
}
</style>
</head>
<body>

<div id="scene">
  <div id="sky"></div>
  <div id="moon"></div>
  <div id="sun"></div>
  <div id="msg"></div>
  <button id="btn">Click Here</button>
  <div id="cross">
    <div class="cross-vertical"></div>
    <div class="cross-horizontal"></div>
  </div>
</div>

<script>
const moon = document.getElementById("moon");
const sun = document.getElementById("sun");
const sky = document.getElementById("sky");
const msgDiv = document.getElementById("msg");
const btn = document.getElementById("btn");
const cross = document.getElementById("cross");

let fullMessage = "On this calm birthday eve so new, God softly whispers, my plans are made for you.";
let revealed = "";
let evolutionDone = false;
let sunLocked = false;

document.addEventListener('pointermove', (e)=>{
  if(sunLocked) return;

  let y = e.clientY;
  let h = window.innerHeight;

  let p = 1 - (y/h);
  p = Math.max(0, Math.min(1, p));

  // Moon rotates
  moon.style.opacity = 1 - p;
  moon.style.transform = `translate(-50%,-50%) rotate(${p*45}deg)`;

  // Sun rises
  sun.style.opacity = p;
  sun.style.transform = `translate(${240 - p*240}px, ${260 - p*260}px) scale(${0.35 + p*0.65})`;

  // Sky transition
  if(p > 0.1){
    sky.classList.add("daySky");
  }

  // Reveal message letter by letter
  let lettersToShow = Math.floor(fullMessage.length * p);
  revealed = fullMessage.slice(0, lettersToShow);
  msgDiv.textContent = revealed;
  msgDiv.style.opacity = p;

  // Button appears after full reveal
  if(p === 1 && !evolutionDone){
    evolutionDone = true;
    sunLocked = true;
    setTimeout(()=>{ btn.style.opacity = 1; },600);
  }
});

// Click → IMAX Cross
btn.addEventListener('click', ()=>{
  btn.style.opacity = 0;
  setTimeout(()=>btn.style.display="none",700);

  setTimeout(()=>{
    cross.style.opacity = 1;
    cross.style.transform = "translateX(-50%) scale(1.12)";
  },700);

  setTimeout(()=>{
    cross.style.transform = "translateX(-50%) scale(1)";
  },2500);
});
</script>

</body>
</html>
