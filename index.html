<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Cinematic Birthday Night</title>

<style>
    body {
        margin: 0;
        overflow: hidden;
        background: #000;
        font-family: "Cinzel", serif;
    }

    #sky {
        position: relative;
        width: 100vw;
        height: 100vh;
        background: radial-gradient(circle at bottom, #0a0a0a 0%, #000000 100%);
        overflow: hidden;
    }

    /* Twinkling stars */
    #stars {
        width: 100%;
        height: 100%;
        background: transparent url('https://i.imgur.com/2JjvZJM.png') repeat;
        opacity: 0.25;
        animation: twinkle 6s infinite alternate ease-in-out;
    }

    @keyframes twinkle {
        from { opacity: 0.15; }
        to   { opacity: 0.35; }
    }

    /* Shooting stars canvas */
    #shootingCanvas {
        position: absolute;
        top: 0;
        left: 0;
    }

    /* Moon */
    #moon {
        position: absolute;
        top: 22%;
        left: -200px;
        width: 180px;
        filter: brightness(1.1);
        animation: moveMoon 18s linear forwards;
    }

    @keyframes moveMoon {
        0% { left: -200px; }
        90% { left: 65vw; }
        100% { left: 65vw; }
    }

    /* Message */
    #message {
        position: absolute;
        bottom: 12%;
        width: 100%;
        text-align: center;
        font-size: 28px;
        letter-spacing: 2px;
        color: #fff;
        opacity: 0;
        transition: opacity 1s ease-out;
    }

    /* Click Here Button */
    #clickHere {
        position: absolute;
        bottom: 5%;
        left: 50%;
        transform: translateX(-50%);
        padding: 14px 30px;
        font-size: 20px;
        border: none;
        border-radius: 12px;
        background: rgba(255,255,255,0.12);
        color: #fff;
        backdrop-filter: blur(6px);
        cursor: pointer;
        opacity: 0;
        transition: 1.2s ease;
    }
</style>
</head>

<body>

<div id="sky">
    <div id="stars"></div>
    <canvas id="shootingCanvas"></canvas>

    <!-- Moon -->
    <img id="moon" src="https://i.imgur.com/8bZQ9qN.png" />

    <!-- Message -->
    <div id="message"></div>

    <!-- Click Here -->
    <button id="clickHere">CLICK HERE</button>
</div>

<script>
/* -----------------------------------------
   SHOOTING STARS
----------------------------------------- */
const canvas = document.getElementById("shootingCanvas");
const ctx = canvas.getContext("2d");

canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

let shootingStars = [];

function createShootingStar() {
    shootingStars.push({
        x: Math.random() * window.innerWidth,
        y: Math.random() * 200,
        length: Math.random() * 120 + 80,
        speed: Math.random() * 4 + 6,
        opacity: Math.random() * 0.4 + 0.6
    });
}

setInterval(createShootingStar, 500);  // Shooting star frequency

function animateShootingStars() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    shootingStars.forEach((star, index) => {
        ctx.beginPath();
        ctx.moveTo(star.x, star.y);
        ctx.lineTo(star.x - star.length, star.y + star.length);
        ctx.strokeStyle = `rgba(255,255,255,${star.opacity})`;
        ctx.lineWidth = 2;
        ctx.stroke();

        star.x += star.speed * 0.8;
        star.y += star.speed;

        if (star.y > window.innerHeight) {
            shootingStars.splice(index, 1);
        }
    });

    requestAnimationFrame(animateShootingStars);
}

animateShootingStars();

/* -----------------------------------------
   MESSAGE REVEAL LETTER BY LETTER
----------------------------------------- */
const text =
"On this calm birthday eve so new, God softly whispers, ‘My plans are made for you.’";

const messageBox = document.getElementById("message");
let index = 0;

function revealText() {
    if (index < text.length) {
        messageBox.innerHTML += text[index];
        index++;
        setTimeout(revealText, 85);
    }
}

/* -----------------------------------------
   MOON STOP → SHOW MESSAGE + BUTTON
----------------------------------------- */
setTimeout(() => {
    messageBox.style.opacity = 1;
    revealText();
}, 14000);

setTimeout(() => {
    document.getElementById("clickHere").style.opacity = 1;
}, 16000);

</script>

</body>
</html>
