<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GOD BLESS YOU — IMAX Vision</title>

<style>
/* --------- PURE IMAX × NOLAN COLOR SCIENCE --------- */
:root {
  --bg-deep: #050508;        /* deep cinematic black-blue */
  --bg-soft: #0b0b12;        /* soft gradation */
  --gold: #f7e7c4;           /* soft divine gold */
  --glow: rgba(255,228,170,0.42); /* gentle Nolan glow */
}

/* --------- RESET --------- */
* { margin:0; padding:0; box-sizing:border-box; }

body {
  height: 100vh;
  background: linear-gradient(to bottom, var(--bg-soft), var(--bg-deep));
  font-family: "Cinzel", serif;
  color: var(--gold);
  overflow: hidden;
}

/* --------- IMAX LETTERBOX BARS --------- */
.top-bar, .bottom-bar {
  position: fixed;
  left: 0;
  width: 100%;
  height: 90px;
  background: rgba(0,0,0,0.90);
  z-index: 10;
}
.top-bar { top: 0; }
.bottom-bar { bottom: 0; }

/* --------- THE ONLY TEXT — TOP CENTER --------- */
h1 {
  position: absolute;
  top: 105px; /* Perfect spacing under IMAX bar */
  left: 50%;
  transform: translateX(-50%);

  font-size: 4rem;
  font-weight: 600;
  letter-spacing: 8px;

  text-align: center;
  color: var(--gold);

  text-shadow:
    0 0 9px var(--glow),
    0 0 22px var(--glow);

  opacity: 0;
  animation: fadeIn 2.6s ease-out forwards;
}

/* --------- TEXT REVEAL (Prestige Style) --------- */
@keyframes fadeIn {
  0% { opacity:0; transform:translateX(-50%) translateY(-18px); }
  100% { opacity:1; transform:translateX(-50%) translateY(0); }
}
</style>
</head>

<body>

<div class="top-bar"></div>

<h1>GOD BLESS YOU</h1>

<div class="bottom-bar"></div>

</body>
</html>
