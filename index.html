<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>IMAX Cinematic — Shield & Verse</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
html,body{
    margin:0;
    padding:0;
    overflow:hidden;
    background:#0a0d19; /* deep space */
    font-family:"Cinzel", serif;
}
canvas{
    display:block;
}
.verse-star{
    position:absolute;
    color:#ffe9a6;
    text-shadow:0 0 6px #fff2b3,0 0 12px #e6d37a;
    font-size:26px;
    opacity:0;
    transform:scale(0.2);
    transition:all 0.8s ease-out;
    pointer-events:none;
}
</style>
</head>
<body>
<canvas id="shieldCanvas"></canvas>

<script>
const canvas = document.getElementById("shieldCanvas");
const ctx = canvas.getContext("2d");
let width=window.innerWidth, height=window.innerHeight;
canvas.width=width; canvas.height=height;

let shieldX=width/2, shieldY=height/2;
let R=Math.min(width,height)/3;
let starSpin=false, starAngle=0;

// ---------------- Background Stars ----------------
const bgStars=[];
for(let i=0;i<200;i++){
    bgStars.push({x:Math.random()*width,y:Math.random()*height,r:Math.random()*1.5+0.5,tw:Math.random()*0.02+0.005});
}

// ---------------- Shield Drawing ----------------
function drawShield(){
    ctx.save();
    ctx.translate(shieldX,shieldY);

    // Outer Red Ring
    let g1=ctx.createRadialGradient(0,0,R*0.2,0,0,R);
    g1.addColorStop(0,"#3c0000");
    g1.addColorStop(1,"#7a0000");
    ctx.fillStyle=g1;
    ctx.beginPath(); ctx.arc(0,0,R,0,Math.PI*2); ctx.fill();

    // White Ring
    let g2=ctx.createRadialGradient(0,0,R*0.1,0,0,R*0.75);
    g2.addColorStop(0,"#dadada"); g2.addColorStop(1,"#f5f5f5");
    ctx.fillStyle=g2;
    ctx.beginPath(); ctx.arc(0,0,R*0.75,0,Math.PI*2); ctx.fill();

    // Inner Red Ring
    let g3=ctx.createRadialGradient(0,0,R*0.1,0,0,R*0.5);
    g3.addColorStop(0,"#4b0000"); g3.addColorStop(1,"#8c0000");
    ctx.fillStyle=g3;
    ctx.beginPath(); ctx.arc(0,0,R*0.5,0,Math.PI*2); ctx.fill();

    // Blue Metallic Center
    let g4=ctx.createRadialGradient(0,0,R*0.05,0,0,R*0.35);
    g4.addColorStop(0,"#b4c7e0"); g4.addColorStop(1,"#001933");
    ctx.fillStyle=g4;
    ctx.beginPath(); ctx.arc(0,0,R*0.35,0,Math.PI*2); ctx.fill();

    // 3D Star
    ctx.save();
    if(starSpin) ctx.rotate(starAngle);
    let starR=R*0.28;
    ctx.beginPath();
    for(let i=0;i<5;i++){
        let o=(Math.PI*2/5)*i-Math.PI/2;
        let n=o+Math.PI/5;
        ctx.lineTo(Math.cos(o)*starR,Math.sin(o)*starR);
        ctx.lineTo(Math.cos(n)*starR*0.45,Math.sin(n)*starR*0.45);
    }
    ctx.closePath();
    ctx.shadowColor="rgba(255,255,255,0.25)";
    ctx.shadowBlur=5;
    let sg=ctx.createRadialGradient(0,0,starR*0.1,0,0,starR);
    sg.addColorStop(0,"#ffffff");
    sg.addColorStop(0.4,"#eeeeee");
    sg.addColorStop(1,"#7a7a7a");
    ctx.fillStyle=sg;
    ctx.fill();
    ctx.restore();
    ctx.restore();
}

// ---------------- Animate Loop ----------------
function animate(){
    ctx.fillStyle="#0a0d19"; ctx.fillRect(0,0,width,height);

    // Background twinkling stars
    bgStars.forEach(s=>{
        const glow=(Math.sin(Date.now()*s.tw)+1)*0.5;
        ctx.fillStyle=`rgba(255,255,255,${glow})`;
        ctx.beginPath();
        ctx.arc(s.x,s.y,s.r,0,Math.PI*2);
        ctx.fill();
    });

    drawShield();

    if(starSpin) starAngle+=0.035;

    requestAnimationFrame(animate);
}
animate();

// ---------------- Verse Stars ----------------
const verse="He counts the stars and calls them each by name — Psalm 147:4";
let verseStars=[];

// Click → shield star
canvas.addEventListener("click", e=>{
    const dx=e.clientX-shieldX;
    const dy=e.clientY-shieldY;
    if(Math.sqrt(dx*dx+dy*dy)<=R*0.28){
        starSpin=true;
        spawnVerseStars();
    }
});

// Spawn stars forming the verse
function spawnVerseStars(){
    if(verseStars.length>0) return;
    const startX=shieldX, startY=shieldY;
    const spacing=26;
    let offsetX=window.innerWidth/2-(verse.length*spacing)/2;

    for(let i=0;i<verse.length;i++){
        let char=verse[i];
        let starCount=Math.floor(Math.random()*4)+8;
        for(let j=0;j<starCount;j++){
            let star=document.createElement("div");
            star.className="verse-star";
            star.textContent="✦";
            star.style.fontSize="16px";
            document.body.appendChild(star);
            verseStars.push({el:star,targetX:offsetX+i*spacing + Math.random()*5-2,targetY:40+Math.random()*3-1});
            star.style.left=startX+"px";
            star.style.top=startY+"px";
            star.style.opacity=1;
            setTimeout(()=>{star.style.transform="scale(1.2)";},10);
        }
    }
    animateVerseStars();
}

// Animate stars flying to form verse
function animateVerseStars(){
    let done=false;
    function step(){
        done=true;
        verseStars.forEach(s=>{
            let el=s.el;
            let curX=parseFloat(el.style.left);
            let curY=parseFloat(el.style.top);
            let dx=(s.targetX-curX)*0.08;
            let dy=(s.targetY-curY)*0.08;
            el.style.left=curX+dx+"px";
            el.style.top=curY+dy+"px";
            if(Math.abs(dx)>0.5 || Math.abs(dy)>0.5) done=false;
        });
        if(!done) requestAnimationFrame(step);
    }
    requestAnimationFrame(step);
}

// ---------------- Twinkle refresh ----------------
setInterval(()=>{
    bgStars.forEach(s=>{ s.tw=Math.random()*0.02+0.005; });
},1000);

</script>
</body>
</html>
