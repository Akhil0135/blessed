<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Anime Sunset Scene</title>

<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  body {
    height: 100vh;
    overflow: hidden;
    background: linear-gradient(#ff8b64, #ff6c9c, #5b2f80);
    animation: camMove 10s ease-in-out infinite alternate;
  }

  /* Camera drift */
  @keyframes camMove {
    0% { transform: scale(1) translateY(0px); }
    100% { transform: scale(1.05) translateY(-15px); }
  }

  /* Sun */
  .sun {
    position: absolute;
    bottom: 20%;
    left: 50%;
    width: 220px;
    height: 220px;
    transform: translateX(-50%);
    background: radial-gradient(circle, #ffe6b3, #ffb86c, #ff7b54);
    border-radius: 50%;
    filter: blur(2px) brightness(1.2);
    box-shadow: 0 0 120px #ffefc8, 0 0 200px #ffbd6f;
  }

  /* Cloud layers */
  .clouds {
    position: absolute;
    top: 0;
    left: 0;
    width: 300%;
    height: 100%;
    pointer-events: none;
    background-repeat: repeat-x;
  }

  /* Cloud textures */
  .c1 { background-image: url('https://i.imgur.com/QZ1Z8zZ.png'); opacity: 0.7; animation: move1 45s linear infinite; }
  .c2 { background-image: url('https://i.imgur.com/QZ1Z8zZ.png'); opacity: 0.45; animation: move2 80s linear infinite; }
  .c3 { background-image: url('https://i.imgur.com/QZ1Z8zZ.png'); opacity: 0.25; animation: move3 120s linear infinite; }

  /* Cloud motions (parallax) */
  @keyframes move1 { from { transform: translateX(0); } to { transform: translateX(-33.33%); } }
  @keyframes move2 { from { transform: translateX(0); } to { transform: translateX(-20%); } }
  @keyframes move3 { from { transform: translateX(0); } to { transform: translateX(-10%); } }

  /* Foreground silhouette (anime style mountains) */
  .mountains {
    position: absolute;
    bottom: 0;
    width: 100%;
    height: 40%;
    background: url('https://i.imgur.com/0tYpXHW.png') repeat-x bottom;
    background-size: cover;
    animation: slowMove 30s linear infinite;
    filter: brightness(0.8) saturate(1.2);
  }

  @keyframes slowMove {
    from { background-position-x: 0; }
    to { background-position-x: -800px; }
  }
</style>
</head>

<body>

  <!-- Sun -->
  <div class="sun"></div>

  <!-- Parallax Clouds -->
  <div class="clouds c1"></div>
  <div class="clouds c2"></div>
  <div class="clouds c3"></div>

  <!-- Foreground Mountains -->
  <div class="mountains"></div>

</body>
</html>
