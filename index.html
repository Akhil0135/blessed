<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Golden Cross Animation</title>
<style>
  body {
    margin: 0;
    height: 100vh;
    overflow: hidden;
    position: relative;
    background-color: #001f3f; /* night */
    transition: background 2s ease;
  }

  /* Cross */
  .cross {
    position: absolute;
    top: 50px;
    left: 50%;
    transform: translateX(-50%);
    width: 20px;
    height: 100px;
    transition: background-color 1s ease;
  }

  .cross::before, .cross::after {
    content: '';
    position: absolute;
    background-color: gold;
    transition: background-color 1s ease;
  }

  .cross::before {
    top: 0;
    left: 50%;
    transform: translateX(-50%);
    width: 20px;
    height: 100px;
  }

  .cross::after {
    top: 40%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 60px;
    height: 20px;
  }

  /* Button */
  #clickButton {
    position: absolute;
    top: 200px;
    left: 50%;
    transform: translateX(-50%);
    padding: 10px 25px;
    font-size: 18px;
    background-color: gold;
    color: #001f3f;
    border: none;
    border-radius: 5px;
    cursor: pointer;
    display: none;
    z-index: 10;
  }

  /* Moon */
  .moon {
    position: absolute;
    top: 50px;
    right: 50px;
    width: 120px;
    height: 120px;
    background-color: white;
    border-radius: 50%;
    box-shadow: 0 0 30px rgba(255,255,255,0.5);
    opacity: 0;
    transition: opacity 2s ease;
    z-index: 5;
  }

  /* Stars */
  .stars {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    z-index: 1;
    opacity: 0;
    transition: opacity 2s ease;
  }

  .star {
    position: absolute;
    background-color: white;
    border-radius: 50%;
    opacity: 0.8;
    animation: twinkle 2s infinite alternate;
  }

  @keyframes twinkle {
    0% { opacity: 0.2; transform: scale(0.5); }
    50% { opacity: 1; transform: scale(1); }
    100% { opacity: 0.2; transform: scale(0.5); }
  }

  /* Sun */
  .sun {
    position: absolute;
    top: 50px;
    right: 50px;
    width: 120px;
    height: 120px;
    background-color: yellow;
    border-radius: 50%;
    box-shadow: 0 0 50px rgba(255,255,0,0.5);
    opacity: 0;
    transition: opacity 2s ease;
    z-index: 5;
  }

</style>
</head>
<body>
  <div class="cross"></div>
  <button id="clickButton">Click Here</button>

  <div class="moon" id="moon"></div>
  <div class="stars" id="stars"></div>
  <div class="sun" id="sun"></div>

<script>
  const button = document.getElementById('clickButton');
  const moon = document.getElementById('moon');
  const stars = document.getElementById('stars');
  const sun = document.getElementById('sun');
  const crossBefore = document.querySelector('.cross::before') || document.querySelector('.cross');
  const cross = document.querySelector('.cross');
  let clickCount = 0;

  // Show initial button after 3 seconds
  setTimeout(() => { button.style.display = 'block'; }, 3000);

  // Generate stars
  const numStars = 100;
  for (let i = 0; i < numStars; i++) {
    const star = document.createElement('div');
    star.className = 'star';
    star.style.top = Math.random() * 100 + '%';
    star.style.left = Math.random() * 100 + '%';
    const size = Math.random() * 4 + 2;
    star.style.width = size + 'px';
    star.style.height = size + 'px';
    star.style.animationDuration = (Math.random() * 3 + 2) + 's';
    stars.appendChild(star);
  }

  button.addEventListener('click', () => {
    clickCount++;

    if (clickCount === 1) {
      // First click: show moon + stars, cross stays gold
      button.style.display = 'none';
      moon.style.opacity = '1';
      stars.style.opacity = '1';

      // Show button again after 7 seconds
      setTimeout(() => { button.style.display = 'block'; }, 7000);

    } else if (clickCount === 2) {
      // Second click: hide moon + stars, show sun, change background to day
      button.style.display = 'none';
      moon.style.opacity = '0';
      stars.style.opacity = '0';

      sun.style.opacity = '1';

      // Change background to day
      document.body.style.background = 'linear-gradient(to bottom, #87CEEB, #B0E0E6)';

      // Change cross color to dark gray to suit daytime
      cross.style.setProperty('--cross-color', '#333333');
      cross.querySelectorAll('::before, ::after');
      cross.style.setProperty('color', '#333'); // fallback if needed
      cross.querySelectorAll('::before').forEach(e=>e.style.backgroundColor='#333');
      cross.querySelectorAll('::after').forEach(e=>e.style.backgroundColor='#333');
    }
  });
</script>
</body>
</html>
