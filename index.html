<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>IMAX Cinematic — Shield & Verse</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
html,body{
    margin:0;
    padding:0;
    overflow:hidden;
    background:#0a0d19; /* deep space */
    font-family:"Cinzel", serif;
}
canvas{
    display:block;
}
#verse{
    position:absolute;
    top:40px;
    left:50%;
    transform:translateX(-50%) scale(0.2);
    font-size:32px;
    color:#ffe9a6;
    text-shadow:0 0 8px #fff2b3,0 0 15px #e6d37a;
    opacity:0;
    transition: all 1s ease-out;
    white-space:nowrap;
    pointer-events:none;
}

/* Instruction for user */
#instruction {
    position: absolute;
    top: 20px;
    width: 100%;
    text-align: center;
    font-size: 22px;
    color: #fff;
    text-shadow: 0 0 8px #000;
    opacity: 0.9;
    pointer-events: none;
}
</style>
</head>
<body>

<div id="instruction">Click the star at the center of the shield</div>

<canvas id="shieldCanvas"></canvas>
<div id="verse">He counts the stars and calls them each by name — Psalm 147:4</div>

<script>
const canvas = document.getElementById("shieldCanvas");
const ctx = canvas.getContext("2d");
let width=window.innerWidth, height=window.innerHeight;
canvas.width=width; canvas.height=height;

let shieldX=width/2, shieldY=height/2;
let R=Math.min(width,height)/3;
let starSpin=false, starAngle=0;

// ---------------- Background Stars ----------------
const bgStars=[];
for(let i=0;i<200;i++){
    bgStars.push({x:Math.random()*width,y:Math.random()*height,r:Math.random()*1.5+0.5,tw:Math.random()*0.02+0.005});
}

// ---------------- Shield Drawing ----------------
function drawShield(){
    ctx.save();
    ctx.translate(shieldX,shieldY);

    // Outer Red Ring
    let g1=ctx.createRadialGradient(0,0,R*0.2,0,0,R);
    g1.addColorStop(0,"#3c0000");
    g1.addColorStop(1,"#7a0000");
    ctx.fillStyle=g1;
    ctx.beginPath(); ctx.arc(0,0,R,0,Math.PI*2); ctx.fill();

    // White Ring
    let g2=ctx.createRadialGradient(0,0,R*0.1,0,0,R*0.75);
    g2.addColorStop(0,"#dadada"); g2.addColorStop(1,"#f5f5f5");
    ctx.fillStyle=g2;
    ctx.beginPath(); ctx.arc(0,0,R*0.75,0,Math.PI*2); ctx.fill();

    // Inner Red Ring
    let g3=ctx.createRadialGradient(0,0,R*0.1,0,0,R*0.5);
    g3.addColorStop(0,"#4b0000"); g3.addColorStop(1,"#8c0000");
    ctx.fillStyle=g3;
    ctx.beginPath(); ctx.arc(0,0,R*0.5,0,Math.PI*2); ctx.fill();

    // Blue Metallic Center
    let g4=ctx.createRadialGradient(0,0,R*0.05,0,0,R*0.35);
    g4.addColorStop(0,"#b4c7e0"); g4.addColorStop(1,"#001933");
    ctx.fillStyle=g4;
    ctx.beginPath(); ctx.arc(0,0,R*0.35,0,Math.PI*2); ctx.fill();

    // 3D Star
    ctx.save();
    if(starSpin) ctx.rotate(starAngle);
    let starR=R*0.28;
    ctx.beginPath();
    for(let i=0;i<5;i++){
        let o=(Math.PI*2/5)*i-Math.PI/2;
        let n=o+Math.PI/5;
        ctx.lineTo(Math.cos(o)*starR,Math.sin(o)*starR);
        ctx.lineTo(Math.cos(n)*starR*0.45,Math.sin(n)*starR*0.45);
    }
    ctx.closePath();
    ctx.shadowColor="rgba(255,255,255,0.25)";
    ctx.shadowBlur=5;
    let sg=ctx.createRadialGradient(0,0,starR*0.1,0,0,starR);
    sg.addColorStop(0,"#ffffff");
    sg.addColorStop(0.4,"#eeeeee");
    sg.addColorStop(1,"#7a7a7a");
    ctx.fillStyle=sg;
    ctx.fill();
    ctx.restore();
    ctx.restore();
}

// ---------------- Animate Loop ----------------
function animate(){
    ctx.fillStyle="#0a0d19"; ctx.fillRect(0,0,width,height);

    // Background twinkling stars
    bgStars.forEach(s=>{
        const glow=(Math.sin(Date.now()*s.tw)+1)*0.5;
        ctx.fillStyle=`rgba(255,255,255,${glow})`;
        ctx.beginPath();
        ctx.arc(s.x,s.y,s.r,0,Math.PI*2);
        ctx.fill();
    });

    drawShield();

    if(starSpin) starAngle+=0.035;

    requestAnimationFrame(animate);
}
animate();

// ---------------- Click on Shield Star ----------------
const verseDiv=document.getElementById("verse");
canvas.addEventListener("click", e=>{
    const dx=e.clientX-shieldX;
    const dy=e.clientY-shieldY;
    if(Math.sqrt(dx*dx+dy*dy)<=R*0.28){
        starSpin=true;
        showVerse();
        document.getElementById("instruction").style.opacity = 0; // fade out instruction
    }
});

// ---------------- Show Verse ----------------
function showVerse(){
    verseDiv.style.opacity=1;
    verseDiv.style.transform="translateX(-50%) scale(1)";
}
</script>
</body>
</html>
