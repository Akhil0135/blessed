<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Golden Cross Animation</title>
<style>
  body {
    margin: 0;
    height: 100vh;
    overflow: hidden;
    position: relative;
    background-color: #001f3f; /* navy blue */
    transition: background-color 2s ease;
  }

  /* Cross */
  .cross {
    position: absolute;
    top: 50px;
    left: 50%;
    transform: translateX(-50%);
    width: 20px;
    height: 100px;
  }

  .cross::before {
    content: '';
    position: absolute;
    top: 0;
    left: 50%;
    transform: translateX(-50%);
    width: 20px;
    height: 100px;
    background-color: gold;
    box-shadow: 0 0 2px gold;
  }

  .cross::after {
    content: '';
    position: absolute;
    top: 40%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 60px;
    height: 20px;
    background-color: gold;
    box-shadow: 0 0 2px gold;
  }

  /* Button */
  #clickButton {
    position: absolute;
    top: 200px;
    left: 50%;
    transform: translateX(-50%);
    padding: 10px 25px;
    font-size: 18px;
    background-color: gold;
    color: #001f3f;
    border: none;
    border-radius: 5px;
    cursor: pointer;
    display: none;
    z-index: 10;
  }

  /* Moon */
  .moon {
    position: absolute;
    top: 50px;
    right: 50px;
    width: 120px;
    height: 120px;
    background-color: white;
    border-radius: 50%;
    box-shadow: 0 0 30px rgba(255,255,255,0.5);
    opacity: 0;
    transition: opacity 2s ease;
    z-index: 5;
  }

  /* Stars */
  .stars {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    z-index: 1;
    opacity: 0;
    transition: opacity 2s ease;
  }

  .star {
    position: absolute;
    background-color: white;
    border-radius: 50%;
    opacity: 0.8;
    animation: twinkle 2s infinite alternate;
  }

  @keyframes twinkle {
    0% { opacity: 0.2; transform: scale(0.5); }
    50% { opacity: 1; transform: scale(1); }
    100% { opacity: 0.2; transform: scale(0.5); }
  }

  /* Sun */
  .sun {
    position: absolute;
    top: 50px;
    right: 50px; /* same as moon */
    width: 120px;
    height: 120px;
    background-color: yellow;
    border-radius: 50%;
    box-shadow: 0 0 50px rgba(255,255,0,0.7);
    opacity: 0;
    transition: opacity 2s ease;
    z-index: 5;
  }

  /* Sun rays */
  .ray {
    position: absolute;
    width: 4px;
    height: 40px;
    background-color: yellow;
    top: 50%;
    left: 50%;
    transform-origin: bottom center;
    opacity: 0;
    border-radius: 2px;
    z-index: 4;
  }

  /* Mountains */
  .mountains {
    position: absolute;
    top: 0;
    left: -100%;
    width: 200%;
    height: 100px;
    background: repeating-linear-gradient(
      to right,
      #2e2e2e 0 50px,
      #3e3e3e 50px 100px
    );
    opacity: 0;
    transition: opacity 2s ease;
    z-index: 2;
  }

  /* Mountain animation */
  .mountains.show {
    animation: mountainsMove 5s linear forwards;
  }

  @keyframes mountainsMove {
    0% { left: -100%; }
    100% { left: 0%; }
  }
</style>
</head>
<body>
  <div class="cross"></div>
  <button id="clickButton">Click Here</button>

  <div class="moon" id="moon"></div>
  <div class="stars" id="stars"></div>
  <div class="sun" id="sun"></div>
  <div class="mountains" id="mountains"></div>

<script>
  const button = document.getElementById('clickButton');
  let clickCount = 0;

  // Show initial button after 3 seconds
  setTimeout(() => {
    button.style.display = 'block';
  }, 3000);

  // Generate bigger stars
  const starsContainer = document.getElementById('stars');
  const numStars = 100;
  for (let i = 0; i < numStars; i++) {
    const star = document.createElement('div');
    star.className = 'star';
    star.style.top = Math.random() * 100 + '%';
    star.style.left = Math.random() * 100 + '%';
    const size = Math.random() * 4 + 2; // bigger stars
    star.style.width = size + 'px';
    star.style.height = size + 'px';
    star.style.animationDuration = (Math.random() * 3 + 2) + 's';
    starsContainer.appendChild(star);
  }

  // Create sun rays perfectly aligned
  const sun = document.getElementById('sun');
  const numRays = 12;
  const rays = [];
  for (let i = 0; i < numRays; i++) {
    const ray = document.createElement('div');
    ray.className = 'ray';
    ray.style.transform = `rotate(${i * (360 / numRays)}deg) translateY(-60px)`;
    sun.appendChild(ray);
    rays.push(ray);
  }

  // Button click event
  button.addEventListener('click', () => {
    clickCount++;

    if (clickCount === 1) {
      // First click: show moon and stars
      button.style.display = 'none';
      document.getElementById('moon').style.opacity = '1';
      document.getElementById('stars').style.opacity = '1';

      // Show button again after 7 seconds
      setTimeout(() => {
        button.style.display = 'block';
      }, 7000);
    } else if (clickCount === 2) {
      // Second click: hide moon and stars, show sun and mountains
      button.style.display = 'none';
      document.getElementById('moon').style.opacity = '0';
      document.getElementById('stars').style.opacity = '0';

      sun.style.opacity = '1';
      document.getElementById('mountains').style.opacity = '1';
      document.getElementById('mountains').classList.add('show');

      // Animate rays one after another
      rays.forEach((ray, index) => {
        setTimeout(() => {
          ray.style.opacity = '1';
        }, index * 200); // 0.2s delay between each ray
      });
    }
  });
</script>
</body>
</html>
