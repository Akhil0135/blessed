<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>IMAX Cinematic — Stages 1→2→3</title>
<style>
html,body{margin:0;padding:0;overflow:hidden;background:#000;font-family:Arial, sans-serif;}
canvas{display:block;position:absolute;top:0;left:0;}
#instruction{position:absolute;top:20px;width:100%;text-align:center;font-size:22px;color:#fff;text-shadow:0 0 8px #000;opacity:0.9;pointer-events:none;}
#message{position:absolute;bottom:80px;width:100%;text-align:center;font-size:26px;font-weight:600;color:#ffd27f;letter-spacing:2px;text-shadow:0 0 5px #d9a441;opacity:0;transition:opacity 1.5s ease;}
#sun{position:absolute;width:260px;height:260px;border-radius:50%;background:radial-gradient(circle,#fff7c0 0%,#ffcc33 40%,#d68b00 70%,#000 100%);box-shadow:0 0 50px #ffb300;top:-300px;right:-300px;opacity:0;transition:all 2.5s ease-in-out;}
#moon{position:absolute;width:200px;height:200px;left:40px;top:40px;border-radius:50%;cursor:grab;background:radial-gradient(circle at 30% 30%,#d9d9d9 0%,#c0c0c0 20%,#9a9a9a 45%,#6d6d6d 70%,#2a2a2a 100%);box-shadow:0 0 15px rgba(180,180,255,0.8),inset -20px -20px 40px rgba(0,0,0,0.5);transition:box-shadow 0.3s ease;}
#ambient{position:absolute;width:100%;height:100%;background:radial-gradient(circle at 50% 70%, rgba(30,60,150,0.25), transparent 70%);pointer-events:none;}
#shieldCanvas{display:none;position:absolute;top:0;left:0;}
#verse{position:absolute;top:40px;left:50%;transform:translateX(-50%) scale(0.2);font-size:32px;color:#ffe9a6;text-shadow:0 0 8px #fff2b3,0 0 15px #e6d37a;opacity:0;transition:all 1s ease-out;white-space:nowrap;pointer-events:none;}
#clickBtn{position:absolute;bottom:40px;left:50%;transform:translateX(-50%);padding:15px 30px;font-size:20px;font-weight:bold;background:linear-gradient(90deg,#ff0066,#ffcc00,#00ccff);border:none;border-radius:10px;cursor:pointer;box-shadow:0 0 20px rgba(255,255,255,0.6);color:#fff;opacity:0;transition:opacity 1s ease;z-index:1000;display:none;}
</style>
</head>
<body>

<div id="instruction">Drag the moon to the end</div>
<div id="message">ON THIS CALM BIRTHDAY EVE SO NEW, GOD SOFTLY WHISPERS, MY PLANS ARE MADE FOR YOU.</div>
<div id="ambient"></div>
<div id="moon"></div>
<div id="sun"></div>

<canvas id="stars"></canvas>
<canvas id="shieldCanvas"></canvas>
<div id="verse">He counts the stars and calls them each by name — Psalm 147:4</div>
<button id="clickBtn">Click Here</button>

<audio id="whoosh" src="https://cdn.pixabay.com/download/audio/2021/09/16/audio_4f1c1c9f28.mp3?filename=woosh-14795.mp3"></audio>

<script>
// ---------------- Stage 1 ----------------
const canvasS1=document.getElementById("stars");
const ctxS1=canvasS1.getContext("2d");
function resizeS1(){canvasS1.width=window.innerWidth;canvasS1.height=window.innerHeight;}
resizeS1();window.onresize=resizeS1;

let stars=[];
for(let i=0;i<250;i++){stars.push({x:Math.random()*canvasS1.width,y:Math.random()*canvasS1.height,z:Math.random()*1.5+0.5,tw:Math.random()*0.02+0.005});}
function drawStars(){ctxS1.clearRect(0,0,canvasS1.width,canvasS1.height);stars.forEach(s=>{let glow=(Math.sin(Date.now()*s.tw)+1)*0.5;ctxS1.fillStyle=`rgba(255,255,255,${glow})`;ctxS1.beginPath();ctxS1.arc(s.x,s.y,s.z,0,Math.PI*2);ctxS1.fill();});}

const moon=document.getElementById("moon");
const message=document.getElementById("message");
const sun=document.getElementById("sun");
const whoosh=document.getElementById("whoosh");
const instruction=document.getElementById("instruction");

let dragging=false,offsetX,offsetY;
let revealIndex=0;
const fullMsg=message.innerText; message.innerText="";
let stage1Completed=false;

moon.addEventListener("mousedown",e=>{dragging=true;offsetX=e.clientX-moon.offsetLeft;offsetY=e.clientY-moon.offsetTop;moon.style.cursor="grabbing";whoosh.currentTime=0;whoosh.play();});
document.addEventListener("mouseup",()=>{dragging=false;moon.style.cursor="grab";});
document.addEventListener("mousemove",e=>{if(!dragging)return;moon.style.left=(e.clientX-offsetX)+"px";moon.style.top=(e.clientY-offsetY)+"px";if(revealIndex<fullMsg.length){message.style.opacity=1;message.innerText=fullMsg.substring(0,revealIndex++);}});

function animateS1(){drawStars();if(!stage1Completed)requestAnimationFrame(animateS1);}
animateS1();

// Stage 1 completion check
const checkStage1=setInterval(()=>{
    if(revealIndex>=fullMsg.length){
        clearInterval(checkStage1);
        stage1Completed=true;
        moon.style.opacity=0;
        sun.style.opacity=1;
        sun.style.top="40px"; sun.style.right="40px";

        // After 5 seconds, start Stage 2
        setTimeout(()=>{startStage2();},5000);
    }
},100);

// ---------------- Stage 2 ----------------
const shieldCanvas=document.getElementById("shieldCanvas");
const ctxShield=shieldCanvas.getContext("2d");
let width=window.innerWidth,height=window.innerHeight;
shieldCanvas.width=width;shieldCanvas.height=height;

let shieldX=width/2,shieldY=height/2,R=Math.min(width,height)/3,starSpin=false,starAngle=0;
const bgStars=[]; for(let i=0;i<200;i++){bgStars.push({x:Math.random()*width,y:Math.random()*height,r:Math.random()*1.5+0.5,tw:Math.random()*0.02+0.005});}

function drawShield(){
    ctxShield.save(); ctxShield.translate(shieldX,shieldY);
    let g1=ctxShield.createRadialGradient(0,0,R*0.2,0,0,R); g1.addColorStop(0,"#3c0000"); g1.addColorStop(1,"#7a0000"); ctxShield.fillStyle=g1; ctxShield.beginPath(); ctxShield.arc(0,0,R,0,Math.PI*2); ctxShield.fill();
    let g2=ctxShield.createRadialGradient(0,0,R*0.1,0,0,R*0.75); g2.addColorStop(0,"#dadada"); g2.addColorStop(1,"#f5f5f5"); ctxShield.fillStyle=g2; ctxShield.beginPath(); ctxShield.arc(0,0,R*0.75,0,Math.PI*2); ctxShield.fill();
    let g3=ctxShield.createRadialGradient(0,0,R*0.1,0,0,R*0.5); g3.addColorStop(0,"#4b0000"); g3.addColorStop(1,"#8c0000"); ctxShield.fillStyle=g3; ctxShield.beginPath(); ctxShield.arc(0,0,R*0.5,0,Math.PI*2); ctxShield.fill();
    let g4=ctxShield.createRadialGradient(0,0,R*0.05,0,0,R*0.35); g4.addColorStop(0,"#b4c7e0"); g4.addColorStop(1,"#001933"); ctxShield.fillStyle=g4; ctxShield.beginPath(); ctxShield.arc(0,0,R*0.35,0,Math.PI*2); ctxShield.fill();
    ctxShield.save(); if(starSpin)ctxShield.rotate(starAngle);
    let starR=R*0.28; ctxShield.beginPath();
    for(let i=0;i<5;i++){let o=(Math.PI*2/5)*i-Math.PI/2; let n=o+Math.PI/5; ctxShield.lineTo(Math.cos(o)*starR,Math.sin(o)*starR); ctxShield.lineTo(Math.cos(n)*starR*0.45,Math.sin(n)*starR*0.45);}
    ctxShield.closePath();
    ctxShield.shadowColor="rgba(255,255,255,0.25)"; ctxShield.shadowBlur=5;
    let sg=ctxShield.createRadialGradient(0,0,starR*0.1,0,0,starR); sg.addColorStop(0,"#ffffff"); sg.addColorStop(0.4,"#eeeeee"); sg.addColorStop(1,"#7a7a7a");
    ctxShield.fillStyle=sg; ctxShield.fill(); ctxShield.restore(); ctxShield.restore();
}

function animateStage2(){
    ctxShield.fillStyle="#0a0d19"; ctxShield.fillRect(0,0,width,height);
    bgStars.forEach(s=>{let glow=(Math.sin(Date.now()*s.tw)+1)*0.5; ctxShield.fillStyle=`rgba(255,255,255,${glow})`; ctxShield.beginPath(); ctxShield.arc(s.x,s.y,s.r,0,Math.PI*2); ctxShield.fill();});
    drawShield();
    if(starSpin) starAngle+=0.035;
    requestAnimationFrame(animateStage2);
}

const verseDiv=document.getElementById("verse");
function startStage2(){
    document.getElementById("stars").remove();
    document.getElementById("moon").remove();
    document.getElementById("sun").remove();
    document.getElementById("message").style.display="none";
    instruction.innerText="Click the star at the center of the shield";

    shieldCanvas.style.display="block";
    animateStage2();
}

shieldCanvas.addEventListener("click",e=>{
    const dx=e.clientX-shieldX,dy=e.clientY-shieldY;
    if(Math.sqrt(dx*dx+dy*dy)<=R*0.28){
        starSpin=true;
        verseDiv.style.opacity=1; verseDiv.style.transform="translateX(-50%) scale(1)";
        instruction.style.opacity=0;
        // After 7 seconds, start stage 3
        setTimeout(startStage3,7000);
    }
});

// ---------------- Stage 3 ----------------
const canvasS3=document.getElementById("c");
const ctxS3=canvasS3?.getContext?canvasS3.getContext("2d"):null;
const btn=document.getElementById("clickBtn");

function startStage3(){
    shieldCanvas.remove();
    verseDiv.style.display="none";

    // Show stage 3 canvas and button
    if(canvasS3){canvasS3.style.display="block"; resizeS3();}
    btn.style.display="block";
    setTimeout(()=>{btn.style.opacity=1;},100);
}

// Stage 3 resize
function resizeS3(){canvasS3.width=window.innerWidth;canvasS3.height=window.innerHeight;}
window.onresize=()=>{resizeS1();resizeS3();shieldCanvas.width=window.innerWidth;shieldCanvas.height=window.innerHeight;};
</script>
</body>
</html>
