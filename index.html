<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PRINCE — Cinematic Reveal</title>

<style>
    html,body{
        margin:0;
        padding:0;
        height:100%;
        overflow:hidden;
        background:black;
        font-family:Arial, sans-serif;
    }

    #overlayText{
        position:fixed;
        width:100%;
        top:50%;
        transform:translateY(-50%);
        text-align:center;
        pointer-events:none;
        color:white;
    }

    #happy{
        font-size:70px;
        letter-spacing:8px;
        font-weight:900;
        text-shadow:0 0 20px #0066ff;
        opacity:0;
        transition:opacity 2s ease-out;
    }

    #oneBehind{
        font-size:230px;
        font-weight:900;
        opacity:0.07;
        color:#0099ff;
        position:absolute;
        width:100%;
        left:0;
        top:-180px;
        text-shadow:0 0 40px #0055aa;
    }
</style>
</head>

<body>

<div id="overlayText">
    <div id="oneBehind">1</div>
    <div id="happy">HAPPY BIRTHDAY</div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://threejs.org/examples/js/loaders/FontLoader.js"></script>
<script src="https://threejs.org/examples/js/geometries/TextGeometry.js"></script>

<script>
let scene, camera, renderer;
let princeText = "PRINCE";
let princeLetters = [];
let loadedFont;

init();
loadFont();
animate();

// ----------------------------------------------------
function init(){
    scene = new THREE.Scene();

    camera = new THREE.PerspectiveCamera(45, window.innerWidth/window.innerHeight, 10, 5000);
    camera.position.z = 900;

    renderer = new THREE.WebGLRenderer({antialias:true});
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setClearColor(0x000000, 1);
    document.body.appendChild(renderer.domElement);

    window.addEventListener("resize",()=>{
        camera.aspect = window.innerWidth/window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
    });
}

// ----------------------------------------------------
function loadFont(){
    const loader = new THREE.FontLoader();
    loader.load("https://threejs.org/examples/fonts/helvetiker_bold.typeface.json", font=>{
        loadedFont = font;
        createPrinceLetters();
        animatePrinceLetters();
        revealBirthdayText();
    });
}

// ----------------------------------------------------
let nebulaMat;
function createPrinceLetters(){

    nebulaMat = new THREE.MeshPhongMaterial({
        color:0x55aaff,
        emissive:0x003366,
        shininess:80,
        transparent:true,
        opacity:0
    });

    const total = princeText.length;

    const size = 180;       // ★ REDUCED SIZE
    const height = 12;

    const spacing = size * 0.95;   // ★ PERFECT SPACING (NO MERGE)
    const totalWidth = (total - 1) * spacing;
    const xOffset = -totalWidth / 2;

    for(let i=0; i<total; i++){
        const geo = new THREE.TextGeometry(princeText[i],{
            font:loadedFont,
            size:size,
            height:height,
            bevelEnabled:true,
            bevelThickness:4,
            bevelSize:2
        });

        geo.center();

        const mesh = new THREE.Mesh(geo, nebulaMat.clone());
        mesh.position.set(xOffset + i*spacing, 0, -800);
        mesh.scale.set(0.1,0.1,0.1);
        mesh.material.opacity = 0;
        mesh.visible = false;

        princeLetters.push(mesh);
        scene.add(mesh);
    }

    const light = new THREE.PointLight(0x88aaff, 2, 2000);
    light.position.set(0, 300, 500);
    scene.add(light);
}

// ----------------------------------------------------
function animatePrinceLetters(){
    princeLetters.forEach((m, i)=>{
        setTimeout(()=>{
            m.visible = true;

            new TWEEN.Tween(m.position)
                .to({z:-50}, 1800)
                .easing(TWEEN.Easing.Exponential.Out)
                .start();

            new TWEEN.Tween(m.scale)
                .to({x:1,y:1,z:1}, 1600)
                .easing(TWEEN.Easing.Back.Out)
                .start();

            new TWEEN.Tween(m.material)
                .to({opacity:1}, 1700)
                .start();

        }, i * 550);
    });
}

// ----------------------------------------------------
function revealBirthdayText(){
    setTimeout(()=>{
        document.getElementById("happy").style.opacity = 1;
    }, 4200);
}

// ----------------------------------------------------
function animate(){
    requestAnimationFrame(animate);
    if(typeof TWEEN !== "undefined"){
        TWEEN.update();
    }
    renderer.render(scene, camera);
}
</script>

<script src="https://cdnjs.cloudflare.com/ajax/libs/tween.js/18.6.4/tween.umd.js"></script>

</body>
</html>
