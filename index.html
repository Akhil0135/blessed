<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Cinematic Anime Scene</title>

<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { 
        background: #000;
        overflow: hidden;
        font-family: "Inter", sans-serif;
    }

    /* Background gradient (Shinkai style) */
    #bg {
        position: fixed;
        width: 100vw;
        height: 100vh;
        background: radial-gradient(circle at center,
            #1a1a2e 0%, #0f0f1d 40%, #05050a 100%);
        filter: blur(2px);
    }

    /* Anime Character */
    #character {
        position: fixed;
        width: 520px;
        left: 50%;
        bottom: 0;
        transform: translateX(-50%) scale(1);
        animation: breathe 4s ease-in-out infinite;
        filter: drop-shadow(0 0 25px rgba(255,255,255,0.25));
        pointer-events: none;
    }

    /* Gentle breathing */
    @keyframes breathe {
        0%   { transform: translateX(-50%) translateY(0) scale(1); }
        50%  { transform: translateX(-50%) translateY(-8px) scale(1.02); }
        100% { transform: translateX(-50%) translateY(0) scale(1); }
    }

    /* Cinematic particles */
    .particle {
        position: fixed;
        width: 4px;
        height: 4px;
        background: rgba(255,255,255,0.8);
        border-radius: 50%;
        filter: blur(2px);
        animation: floatUp linear infinite;
    }

    @keyframes floatUp {
        0% { opacity: 0; transform: translateY(20vh) scale(0.3); }
        10% { opacity: 1; }
        100% { opacity: 0; transform: translateY(-120vh) scale(1); }
    }

    /* Slow IMAX zoom-in camera */
    #camera {
        position: fixed;
        width: 100vw;
        height: 100vh;
        animation: camZoom 18s ease-in-out infinite alternate;
    }

    @keyframes camZoom {
        0% { transform: scale(1); }
        100% { transform: scale(1.12); }
    }

</style>
</head>
<body>

<div id="bg"></div>

<div id="camera">
    <img id="character" src="https://i.ibb.co/z77cM2D/anime-girl-realistic.png">
</div>

<script>
/* ---------- CREATE PARTICLES ---------- */
function spawnParticle() {
    const p = document.createElement("div");
    p.classList.add("particle");

    const size = Math.random() * 3 + 1;
    p.style.width = size + "px";
    p.style.height = size + "px";

    p.style.left = Math.random() * 100 + "vw";
    p.style.animationDuration = (4 + Math.random() * 4) + "s";

    document.body.appendChild(p);

    setTimeout(() => p.remove(), 8000);
}

setInterval(spawnParticle, 120);
</script>

</body>
</html>
