<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>PHASE 4 — HAPPY BIRTHDAY PRINCE (Galaxy Cinematic)</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  body { margin:0; overflow:hidden; background:#000; }
  canvas { display:block; }
</style>
</head>
<body>

<script src="https://cdn.jsdelivr.net/npm/three@0.152.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.152.0/examples/jsm/loaders/FontLoader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.152.0/examples/jsm/geometries/TextGeometry.js"></script>

<script>
// ------------------------------------------------
// SCENE
// ------------------------------------------------
let scene = new THREE.Scene();
let camera = new THREE.PerspectiveCamera(60, window.innerWidth/window.innerHeight, 0.1, 2000);
camera.position.set(0, 80, 250);

let renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setSize(window.innerWidth, window.innerHeight);
document.body.appendChild(renderer.domElement);

// ------------------------------------------------
// GALAXY STARS
// ------------------------------------------------
let starGeometry = new THREE.BufferGeometry();
let starCount = 2000;
let starArray = new Float32Array(starCount * 3);

for(let i=0; i<starCount*3; i++){
    starArray[i] = (Math.random() - 0.5) * 3000;
}

starGeometry.setAttribute("position", new THREE.BufferAttribute(starArray, 3));

let starMaterial = new THREE.PointsMaterial({
    color: 0xffffff,
    size: 1.4
});

let starField = new THREE.Points(starGeometry, starMaterial);
scene.add(starField);

// ------------------------------------------------
// LIGHTING
// ------------------------------------------------
scene.add(new THREE.AmbientLight(0xffffff, 0.45));

let pointLight = new THREE.PointLight(0xffd080, 3);
pointLight.position.set(100, 150, 120);
scene.add(pointLight);

// ------------------------------------------------
// TEXT
// ------------------------------------------------
let textMesh = null;

new THREE.FontLoader().load(
    "https://threejs.org/examples/fonts/helvetiker_regular.typeface.json",
    function(font){

        let textGeo = new THREE.TextGeometry("HAPPY BIRTHDAY PRINCE", {
            font: font,
            size: 18,
            height: 4,
            curveSegments: 12,
            bevelEnabled: true,
            bevelThickness: 1.4,
            bevelSize: 0.9,
            bevelSegments: 5
        });

        textGeo.computeBoundingBox();
        textGeo.center();

        let textMaterial = new THREE.MeshStandardMaterial({
            color: 0xffcc33,
            emissive: 0xff8800,
            roughness: 0.2,
            metalness: 0.8
        });

        textMesh = new THREE.Mesh(textGeo, textMaterial);
        scene.add(textMesh);
    }
);

// ------------------------------------------------
// ANIMATION LOOP
// ------------------------------------------------
let angle = 0;

function animate(){
    requestAnimationFrame(animate);

    // galaxy movement
    starField.rotation.y += 0.0003;

    if(textMesh){
        angle += 0.003;

        // camera rotating AROUND screen (not text)
        camera.position.x = Math.sin(angle) * 300;
        camera.position.z = Math.cos(angle) * 300;

        camera.lookAt(0, 10, 0); // look toward center
    }

    renderer.render(scene, camera);
}

animate();

// ------------------------------------------------
// WINDOW RESIZE
// ------------------------------------------------
window.addEventListener("resize", () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
});
</script>

</body>
</html>
