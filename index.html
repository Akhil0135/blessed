<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>IMAX Cinematic Full</title>
<style>
html, body {
    margin: 0;
    padding: 0;
    overflow: hidden;
    background: #000;
}
canvas { display: block; }

/* Stage 1 & Stage 3 overlay text */
#birthdayText {
    position: absolute;
    top: 40px;
    width: 100%;
    text-align: center;
    font-size: 48px;
    font-weight: 700;
    color: #ffdFA0;
    text-shadow: 0 0 15px #fff8aa;
    opacity: 0;
    z-index: 10;
    pointer-events: none;
    transition: opacity 0.5s ease;
}
</style>
</head>
<body>

<!-- Stage 3 canvas -->
<canvas id="c"></canvas>
<div id="birthdayText">HAPPY BIRTHDAY</div>
<button id="clickBtn" style="position:absolute; bottom:40px; left:50%; transform:translateX(-50%); padding:15px 30px; font-size:20px; font-weight:bold; background:linear-gradient(90deg, #ff0066, #ffcc00, #00ccff); border:none; border-radius:10px; cursor:pointer; box-shadow:0 0 20px rgba(255,255,255,0.6); color:#fff; opacity:0; z-index:1000;">Click Here</button>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/examples/js/loaders/FontLoader.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/examples/js/geometries/TextGeometry.js"></script>

<script>
// ---------------- Scene + Camera ----------------
let scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x000000, 0.0012);

let camera = new THREE.PerspectiveCamera(60, window.innerWidth/window.innerHeight, 0.1, 3000);
camera.position.set(0, 50, 400);

let renderer = new THREE.WebGLRenderer({canvas: document.getElementById('c'), antialias:true});
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(window.devicePixelRatio);

// ---------------- Stars ----------------
let starGeo = new THREE.BufferGeometry();
let starCount = 2500;
let starArr = new Float32Array(starCount * 3);
for(let i=0;i<starCount*3;i++){
    starArr[i] = (Math.random() - 0.5) * 3000;
}
starGeo.setAttribute("position", new THREE.BufferAttribute(starArr, 3));
let starMat = new THREE.PointsMaterial({ color:0xffffff, size:2.2 });
let stars = new THREE.Points(starGeo, starMat);
scene.add(stars);

let starVel = new Float32Array(starCount);
for(let i=0;i<starCount;i++){ starVel[i] = Math.random()*0.02 + 0.01; }

// ---------------- Lights ----------------
let ambient = new THREE.AmbientLight(0x666666, 0.5);
scene.add(ambient);
let keyLight = new THREE.PointLight(0x99ccff, 2, 2000);
keyLight.position.set(180, 200, 140);
scene.add(keyLight);
let warmLight = new THREE.PointLight(0xffddaa, 1.8, 2000);
warmLight.position.set(-120, 160, -80);
scene.add(warmLight);

// ---------------- Nebula Material ----------------
const nebulaMat = new THREE.ShaderMaterial({
    uniforms: { time:{ value:0 } },
    vertexShader: `
      varying vec2 vUv;
      void main(){ vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0); }
    `,
    fragmentShader: `
      varying vec2 vUv;
      uniform float time;
      float hash(vec2 p){ return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5453123);}
      float noise(vec2 p){
          vec2 i=floor(p);
          vec2 f=fract(p);
          float a=hash(i);
          float b=hash(i+vec2(1.0,0.0));
          float c=hash(i+vec2(0.0,1.0));
          float d=hash(i+vec2(1.0,1.0));
          vec2 u=f*f*(3.0-2.0*f);
          return mix(a,b,u.x)+(c-a)*u.y*(1.0-u.x)+(d-b)*u.x*u.y;
      }
      void main(){
          float t = time*0.3;
          float n = noise(vUv*10.0 + vec2(t*0.5,-t*0.3));
          float glow = smoothstep(0.2,0.7,n);
          vec3 col = vec3(0.3 + glow*0.7, 0.2 + glow*0.5, 0.6 + glow*0.9);
          gl_FragColor = vec4(col,1.0);
      }
    `,
    metalness: 1,
    roughness: 0.25,
    transparent: true
});

// ---------------- PRINCE Letters ----------------
let princeLetters = [];
let loadedFont = null;
new THREE.FontLoader().load(
    "https://threejs.org/examples/fonts/helvetiker_bold.typeface.json",
    font => {
        loadedFont = font;
        createPrinceLetters();
        setTimeout(revealNextLetter, 800);
    }
);

function createPrinceLetters(){
    const princeText = "PRINCE";
    const total = princeText.length;
    const size = 140;
    const height = 15;
    const spacing = size * 0.95;
    const totalWidth = spacing * (total - 1);
    const xOffset = -totalWidth / 2;

    for(let i = 0; i < total; i++){
        let geo = new THREE.TextGeometry(princeText[i],{font: loadedFont, size:size, height:height, bevelEnabled:true, bevelThickness:5, bevelSize:3});
        geo.center();
        let mesh = new THREE.Mesh(geo, nebulaMat);
        mesh.position.set(xOffset + i*spacing, 0, -800);
        mesh.scale.set(0.1,0.1,0.1);
        mesh.rotation.set((Math.random()-0.5)*0.5,(Math.random()-0.5)*0.5,0);
        mesh.material.opacity=0;
        mesh.visible=false;
        princeLetters.push(mesh);
        scene.add(mesh);
    }
}

let currentLetter=0, orbitStart=false;
function revealNextLetter(){
    if(currentLetter < princeLetters.length){
        let mesh = princeLetters[currentLetter];
        mesh.visible = true;
        let duration = 120, frame = 0, finalZ=0;
        function animateLetter(){
            if(frame <= duration){
                let t=frame/duration;
                let overshoot = 1+0.2*Math.sin(t*Math.PI);
                mesh.position.z = -800*(1-t)+finalZ*t;
                mesh.scale.set((0.1+0.9*t)*overshoot,(0.1+0.9*t)*overshoot,(0.1+0.9*t)*overshoot);
                mesh.material.opacity = t;
                mesh.rotation.x *= (1-t);
                mesh.rotation.y *= (1-t);
                frame++; requestAnimationFrame(animateLetter);
            }
        }
        animateLetter();
        currentLetter++;
        if(currentLetter===princeLetters.length){
            setTimeout(()=> orbitStart=true,600);
        }
        setTimeout(revealNextLetter,350);
    }
}

// ---------------- HAPPY BIRTHDAY Text Effect ----------------
const birthdayDiv = document.getElementById("birthdayText");
let hbVisible=true;
function toggleBirthdayText(){
    birthdayDiv.style.opacity = hbVisible?1:0;
    hbVisible = !hbVisible;
    setTimeout(toggleBirthdayText, 600);
}
toggleBirthdayText();

// ---------------- Animate ----------------
let angle=0;
function animate(){
    requestAnimationFrame(animate);
    // Rotate stars
    stars.rotation.y += 0.0005;
    let positions = stars.geometry.attributes.position.array;
    for(let i=0;i<starCount;i++){
        positions[i*3+2] += Math.sin(Date.now()*0.001 + i)*0.01*starVel[i];
    }
    stars.geometry.attributes.position.needsUpdate = true;

    if(orbitStart){ angle+=0.0012; camera.position.x=Math.sin(angle)*400; camera.position.z=Math.cos(angle)*400; }
    camera.lookAt(0,50,0);
    nebulaMat.uniforms.time.value += 0.03;

    renderer.render(scene,camera);
}
animate();

// ---------------- Stage 3 Click Button ----------------
const btn = document.getElementById("clickBtn");
setTimeout(()=>{ btn.style.opacity=1; },3000);

btn.addEventListener("click", ()=>{
    btn.style.display="none";
    const newText="DAIVIK";
    const newPoints=mapTextToPoints(newText);
    particles.forEach((p,i)=>{ const np=newPoints[i%newPoints.length]; p.tx=np.x; p.ty=np.y; p.color="#fff"; });
    // 3 seconds after DAIVIK fully forms
    setTimeout(()=>{ console.log("DAIVIK complete - 3s interval done"); },3000);
});

// Resize
window.addEventListener("resize", ()=>{
    camera.aspect = window.innerWidth/window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
});

// ---------------- Map Text To Points for particles ----------------
const c = document.getElementById("c");
const ctx = c.getContext("2d");
function mapTextToPoints(textStr){
    const temp=document.createElement("canvas"); const tctx=temp.getContext("2d");
    temp.width=c.width; temp.height=c.height;
    const fontSize=c.width/7;
    tctx.clearRect(0,0,temp.width,temp.height); tctx.fillStyle="#fff";
    tctx.font="bold "+fontSize+"px Arial"; tctx.textAlign="center"; tctx.textBaseline="middle";
    tctx.fillText(textStr,temp.width/2,temp.height/2);
    const imageData=tctx.getImageData(0,0,temp.width,temp.height).data;
    const points=[];
    for(let y=0;y<temp.height;y+=6){ for(let x=0;x<temp.width;x+=6){
        let index=(y*temp.width+x)*4; if(imageData[index+3]>200){ points.push({x,y}); }
    }}
    return points;
}

// Particle setup
let currentText="PRINCE"; let letterPoints=mapTextToPoints(currentText);
const particles=letterPoints.map(p=>({x:Math.random()*c.width,y:Math.random()*c.height,tx:p.x,ty:p.y,speed:Math.random()*0.08+0.04,size:Math.random()*1.8+1.2,color:null}));

// Animate particles
let camera2={dx:0,dy:0,zoom:1};
function applyCamera2(){ camera2.dx=Math.sin(Date.now()*0.0003)*15; camera2.dy=Math.cos(Date.now()*0.00025)*15; camera2.zoom=1+0.02*Math.sin(Date.now()*0.0002);
ctx.save(); ctx.translate(c.width/2+camera2.dx,c.height/2+camera2.dy); ctx.scale(camera2.zoom,camera2.zoom); ctx.translate(-c.width/2,-c.height/2); }
function animateParticles(){
    ctx.clearRect(0,0,c.width,c.height);
    applyCamera2();
    const time=Date.now();
    particles.forEach(p=>{
        p.x+=(p.tx-p.x)*p.speed; p.y+=(p.ty-p.y)*p.speed;
        let fillColor=p.color||`hsl(${(p.x+p.y)%360},90%,70%)`;
        let shadowIntensity=p.color?(Math.sin(time*0.005)*0.5+0.5)*20:18;
        ctx.fillStyle=fillColor; ctx.shadowBlur=shadowIntensity; ctx.shadowColor=fillColor;
        ctx.beginPath(); ctx.arc(p.x,p.y,p.size,0,Math.PI*2); ctx.fill();
    });
    ctx.restore(); requestAnimationFrame(animateParticles);
}
animateParticles();
</script>
</body>
</html>
