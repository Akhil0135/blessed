<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>IMAX Nolan — Moon Drag → Sun Evolution (Next Level)</title>
<style>
    html,body{
        margin:0;padding:0;
        background:#030208;
        height:100%;
        overflow:hidden;
        font-family:"Cinzel",serif;
        color:white;
    }

    #scene{
        width:100%;height:100%;position:relative;
        background:radial-gradient(circle at 50% 80%, #140C33, #030208 75%);
        overflow:hidden;
    }

    /* Clouds */
    .cloud{
        position:absolute;
        top:20%;
        width:400px;height:150px;
        background:rgba(255,255,255,0.06);
        filter:blur(40px);
        border-radius:50%;
        animation: drift 40s linear infinite;
    }
    @keyframes drift{
        from{transform:translateX(-500px);} to{transform:translateX(1600px);}    }

    /* Fog */
    #fog{
        position:absolute;
        bottom:0;
        width:100%;height:45%;
        background:linear-gradient(to top, rgba(255,255,255,0.12), transparent);
        filter:blur(35px);
        opacity:0.4;
    }

    /* Moon */
    #moon{
        width:180px;height:180px;
        border-radius:50%;
        background:radial-gradient(circle,#F8F7FF,#CFCBEF 60%,#918CC5 100%);
        box-shadow:0 0 70px #C7C3FF;
        position:absolute;
        top:45%;left:30%;
        transform:translate(-50%,-50%);
        cursor:grab;
        transition:opacity 0.2s linear;
    }

    #moon:active{cursor:grabbing;}

    /* Sun */
    #sun{
        width:100px;height:100px;
        border-radius:50%;
        background:radial-gradient(circle,#FFEAA8,#FF9E00 60%,#B46200 100%);
        box-shadow:0 0 120px #FFB834;
        position:absolute;
        top:50%;left:50%;
        transform:translate(-50%,-50%) scale(0);
        opacity:0;
    }

    /* Lens flare */
    #flare{
        position:absolute;
        top:50%;left:50%;
        width:600px;height:600px;
        background:radial-gradient(circle, rgba(255,182,90,0.28), transparent 70%);
        transform:translate(-50%,-50%) scale(0);
        pointer-events:none;
        opacity:0;
        filter:blur(40px);
    }

    #message{
        position:absolute;
        width:100%;bottom:12%;
        text-align:center;
        font-size:2.1rem;
        opacity:0;
        letter-spacing:1.3px;
        text-shadow:0 0 30px rgba(255,235,190,0.55);
        transform:translateY(40px);
    }
</style>
</head>
<body>
<div id="scene">

    <div class="cloud" style="top:28%; animation-duration:50s;"></div>
    <div class="cloud" style="top:40%; animation-duration:60s;"></div>
    <div class="cloud" style="top:55%; animation-duration:80s;"></div>

    <div id="fog"></div>

    <div id="moon"></div>
    <div id="sun"></div>
    <div id="flare"></div>

    <div id="message">"On this calm birthday eve so new, God softly whispers, my plans are made for you."</div>
</div>

<script>
const moon=document.getElementById("moon");
const sun=document.getElementById("sun");
const flare=document.getElementById("flare");
const message=document.getElementById("message");

let dragging=false;
let offsetX=0,offsetY=0;
let evolution=0;

moon.addEventListener("mousedown",startDrag);
document.addEventListener("mousemove",drag);
document.addEventListener("mouseup",()=>dragging=false);

function startDrag(e){
    dragging=true;
    offsetX=e.clientX-moon.offsetLeft;
    offsetY=e.clientY-moon.offsetTop;
}

function drag(e){
    if(!dragging)return;

    moon.style.left=(e.clientX-offsetX)+"px";
    moon.style.top=(e.clientY-offsetY)+"px";

    evolution+=0.008;
    if(evolution>1)evolution=1;

    updateScene();
}

function updateScene(){
    const sunScale=0+evolution*5.5;
    const flareScale=0+evolution*7;

    sun.style.transform=`translate(-50%,-50%) scale(${sunScale})`;
    sun.style.opacity=evolution;

    flare.style.transform=`translate(-50%,-50%) scale(${flareScale})`;
    flare.style.opacity=evolution*0.85;

    moon.style.opacity=1-evolution;
    moon.style.transform=`translate(-50%,-50%) scale(${1-evolution*0.8})`;

    message.style.opacity=evolution;
    message.style.transform=`translateY(${40-40*evolution}px)`;
}
</script>
</body>
</html>
