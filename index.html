<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ultra Cinematic Moon-to-Sun</title>

<style>
html,body{
  height:100%;
  margin:0;
  background:#000;
  overflow:hidden;
  font-family: 'Poppins', sans-serif;
}

/* ---------- CINEMATIC SKY ---------- */

.sky{
  position:absolute;
  inset:0;
  background:radial-gradient(circle at 50% 80%, #0a0a1a, #000 70%);
  overflow:hidden;
}

/* ---------- MOON ---------- */

.moon{
  position:absolute;
  left:50%;
  top:60%;
  width:220px;
  height:220px;
  margin-left:-110px;
  background:radial-gradient(circle, #fff, #d7d7d7 40%, #aaa 70%, #777 100%);
  border-radius:50%;
  box-shadow:0 0 80px 40px rgba(180,180,255,0.25);
  animation: floatUp 18s linear forwards;
}

@keyframes floatUp{
  0%{ transform: translate(-50%,60%); opacity:1; }
  80%{ transform: translate(-50%,-20%); opacity:1; }
  100%{ transform: translate(-50%,-20%); opacity:0; }
}

/* ---------- SUN ---------- */

.sun{
  position:absolute;
  left:50%;
  top:120%;
  width:260px;
  height:260px;
  margin-left:-130px;
  background:radial-gradient(circle, #fff7ae, #ffd65c 40%, #ffb300 70%, #ff9100 100%);
  border-radius:50%;
  box-shadow:0 0 120px 60px rgba(255,200,0,0.4);
  animation: sunrise 20s ease-out forwards;
  animation-delay: 12s;
  opacity:0;
}

@keyframes sunrise{
  0%{ transform: translate(-50%,80%); opacity:0; }
  40%{ opacity:1; }
  100%{ transform: translate(-50%,-15%); opacity:1; }
}

/* ---------- MESSAGE BOX ---------- */

#msgBox{
  position:absolute;
  top:62%;
  left:50%;
  transform:translateX(-50%);
  padding:18px 26px;
  width:65%;
  max-width:480px;
  text-align:center;
  font-size:20px;
  font-weight:600;

  /* Purple gradient as requested */
  background: linear-gradient(135deg, #9b30ff, #c678ff, #ffffff);
  
  color:#000;
  border-radius:18px;
  opacity:0;
  backdrop-filter: blur(4px);
  box-shadow:0 0 20px rgba(255,255,255,0.25);
  animation: msgFade 1s ease forwards;
  animation-delay:3s;
}

@keyframes msgFade{
  from{opacity:0; transform:translate(-50%,20px);}
  to{opacity:1; transform:translate(-50%,0);}
}

/* ---------- CLICK HERE BUTTON ---------- */

#clickBtn{
  position:absolute;
  top: calc(62% + 4.25rem);
  left:50%;
  transform: translateX(-50%);
  padding:12px 28px;
  font-size:18px;
  font-weight:600;

  /* Floating Premium Blue */
  background:#0033aa;
  color:white;

  border:none;
  border-radius:14px;
  cursor:pointer;
  display:none;
  box-shadow:0 8px 25px rgba(0,60,255,0.45);
  transition:0.25s ease;
}

#clickBtn:hover{
  transform: translateX(-50%) scale(1.08);
}

/* ---------- STAR PARTICLES ---------- */

.star{
  position:absolute;
  background:#fff;
  width:2px;
  height:2px;
  border-radius:50%;
  opacity:0.75;
  animation: twinkle 2s infinite alternate;
}

@keyframes twinkle{
  from{opacity:0.2; transform:scale(0.7);}
  to{opacity:1; transform:scale(1.4);}
}
</style>
</head>

<body>

<div class="sky" id="sky"></div>

<div class="moon"></div>
<div class="sun"></div>

<div id="msgBox"></div>
<button id="clickBtn">Click Here</button>

<script>
/* ---------- Typewriter Message ---------- */
const msg = "Hey Akhil... Your cinematic sky is ready. Enjoy the show... ✨";
const box = document.getElementById("msgBox");
const btn = document.getElementById("clickBtn");

let i=0;

function typeMsg(){
    if(i < msg.length){
        box.innerHTML += msg.charAt(i);
        i++;
        setTimeout(typeMsg, 55);
    } else {
        btn.style.display = "block";  // show button after fully revealed
    }
}

setTimeout(typeMsg, 3500);

/* ---------- Stars ---------- */
const sky = document.getElementById("sky");

for(let s=0; s<120; s++){
  let star = document.createElement("div");
  star.className="star";

  star.style.left = Math.random()*100 + "%";
  star.style.top = Math.random()*100 + "%";
  star.style.animationDelay = (Math.random()*3) + "s";

  sky.appendChild(star);
}
</script>

</body>
</html>
