<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>IMAX Nolan-Style Cinematic Evolution</title>
<style>
html,body{
  margin:0; padding:0; overflow:hidden; height:100%;
  font-family:"Cinzel",serif; background:#000010;
}

/* ---------- Scene Container ----------- */
#scene{position:relative;width:100%;height:100%;overflow:hidden;}

/* ---------- Sky ----------- */
#sky{
  position:absolute; inset:0;
  background:linear-gradient(to bottom,#030014,#120034 40%,#1a0046 70%);
  transition:background 2.5s ease;
}

/* ---------- Day Sky ----------- */
.daySky{
  background:linear-gradient(to bottom,#52d3ff,#ffe6ab 60%,#ffd37c 90%);
  transition:background 2.5s ease;
}

/* ---------- Moon ----------- */
#moon{
  position:absolute; width:180px; height:180px; border-radius:50%;
  background:#d9d8ff; box-shadow:0 0 50px #c5c4ff;
  top:22%; left:18%;
  transform:translate(-50%,-50%) rotate(0deg);
  cursor:pointer; z-index:5;
}

/* ---------- Sun ----------- */
#sun{
  position:absolute; width:300px; height:300px; border-radius:50%;
  background: radial-gradient(circle, #ffd27f, #ff9a00);
  box-shadow:0 0 170px #ffb54c,0 0 300px #ff7b00;
  opacity:0; top:12%; right:8%;
  transform:scale(0.3);
  transition:opacity 1.5s ease, transform 1.5s ease;
}

/* ---------- Stars ----------- */
.star{
  position:absolute; width:2px; height:2px; background:white; border-radius:50%;
  animation:twinkle 2s infinite alternate;
}
@keyframes twinkle{
  0%{opacity:0.1;}
  50%{opacity:0.8;}
  100%{opacity:0.2;}
}

/* ---------- Shooting Stars ----------- */
.shoot{
  position:absolute; width:2px; height:80px; background:linear-gradient(to top, white, transparent);
  transform-origin:bottom center; transform:rotate(-75deg);
  animation:shooting linear infinite;
}

/* We'll dynamically set shooting star animations */

/* ---------- Clouds ----------- */
.cloud{
  position:absolute; width:120px; height:60px; background:rgba(255,255,255,0.12);
  border-radius:50%; filter:blur(6px);
  animation:cloudMove linear infinite;
}
@keyframes cloudMove{
  0%{left:-150px;}
  100%{left:110%;}
}

/* ---------- Message Text ----------- */
#msg{
  position:absolute; width:90%; bottom:12%; left:50%; transform:translateX(-50%);
  text-align:center; color:#ffecaa; font-size:2rem; font-weight:700; opacity:0;
  text-shadow:0 0 30px #ffdf80;
}

/* ---------- Click Button ----------- */
#btn{
  position:absolute; left:50%; bottom:5%; transform:translateX(-50%);
  background:linear-gradient(to right,#6a00ff,#c200ff);
  color:#fff; font-size:1.25rem; padding:14px 34px; border:none;
  border-radius:16px; cursor:pointer; box-shadow:0 0 20px #9400ff;
  opacity:0; transition:opacity 1.2s ease;
}

/* ---------- Cross ----------- */
#cross{
  position:absolute; top:15%; left:50%; transform:translateX(-50%) scale(0.7);
  opacity:0; pointer-events:none; transition:opacity 2.5s ease, transform 2.5s ease;
}
.cross-vertical{
  position:absolute; left:50%; transform:translateX(-50%);
  width:28px; height:260px; background:#f5e1d1;
  box-shadow:0 0 60px #fff6d1;
}
.cross-horizontal{
  position:absolute; left:50%; transform:translateX(-50%);
  width:180px; height:28px; top:calc(260px*0.35);
  background:#f5e1d1; box-shadow:0 0 60px #fff6d1;
}

/* ---------- Rotation Indicator ----------- */
#rotationIndicator{
  position:absolute; bottom:2%; left:50%; transform:translateX(-50%);
  color:#ffecaa; font-size:1rem; text-shadow:0 0 10px #fff6d1;
}
</style>
</head>

<body>
<div id="scene">
  <div id="sky"></div>
  <div id="moon"></div>
  <div id="sun"></div>
  <div id="msg"></div>
  <button id="btn">Click Here</button>
  <div id="cross">
    <div class="cross-vertical"></div>
    <div class="cross-horizontal"></div>
  </div>
  <div id="rotationIndicator"></div>
</div>

<script>
// ---------- Stars ----------
for(let i=0;i<100;i++){
  let s=document.createElement('div');
  s.classList.add('star');
  s.style.top=Math.random()*100+'%';
  s.style.left=Math.random()*100+'%';
  s.style.animationDuration=(1+Math.random()*2)+'s';
  document.getElementById('scene').appendChild(s);
}

// ---------- Shooting Stars ----------
function addShootingStar(){
  let sh=document.createElement('div');
  sh.classList.add('shoot');
  sh.style.top=(Math.random()*20)+'%';
  sh.style.left=(Math.random()<0.5?0:window.innerWidth-2)+'px';
  let duration = 0.8 + Math.random()*1.2;
  sh.style.animationDuration = duration + 's';
  sh.style.animationName = 'shooting' + Math.random();
  document.getElementById('scene').appendChild(sh);
  setTimeout(()=>{sh.remove(); addShootingStar();}, duration*1000);
}
for(let i=0;i<5;i++) addShootingStar();

// ---------- Clouds ----------
for(let i=0;i<7;i++){
  let c=document.createElement('div');
  c.classList.add('cloud');
  c.style.top=(10+Math.random()*50)+'%';
  c.style.left=(-150+Math.random()*200)+'px';
  c.style.animationDuration=(30+Math.random()*20)+'s';
  document.getElementById('scene').appendChild(c);
}

// ---------- Moon Rotation & Message ----------
const moon=document.getElementById('moon');
const sun=document.getElementById('sun');
const sky=document.getElementById('sky');
const msg=document.getElementById('msg');
const btn=document.getElementById('btn');
const cross=document.getElementById('cross');
const rotationIndicator=document.getElementById('rotationIndicator');

let rotating=false, lastTheta=null, cumulativeAngle=0;
let evolutionDone=false;
let messageText="On this calm birthday eve so new, God softly whispers, my plans are made for you.";

moon.addEventListener('pointerdown',()=>{rotating=true; lastTheta=null;});
document.addEventListener('pointerup',()=>{rotating=false;});

document.addEventListener('pointermove',(e)=>{
  if(!rotating) return;

  const rect = moon.getBoundingClientRect();
  const cx = rect.left + rect.width/2;
  const cy = rect.top + rect.height/2;
  const dx = e.clientX - cx;
  const dy = e.clientY - cy;
  let theta = Math.atan2(dy,dx)*(180/Math.PI);
  if(theta<0) theta+=360;

  if(lastTheta!==null){
    let diff=theta-lastTheta;
    if(diff<-180) diff+=360;
    if(diff>180) diff-=360;

    // Anti-clockwise only
    if(diff<0){
      cumulativeAngle += -diff;
      cumulativeAngle=Math.min(360,cumulativeAngle);
    }
  }
  lastTheta=theta;

  // Rotate moon
  moon.style.transform=`translate(-50%,-50%) rotate(${cumulativeAngle}deg)`;

  // Reveal message
  let lettersToShow=Math.floor(messageText.length*(cumulativeAngle/360));
  msg.textContent=messageText.slice(0,lettersToShow);
  msg.style.opacity=lettersToShow>0?1:0;

  // Rotation indicator
  rotationIndicator.textContent="Rotation: "+Math.floor(cumulativeAngle)+"°";

  // Sun rise and scale
  sun.style.opacity=cumulativeAngle/360;
  sun.style.transform=`scale(${0.3 + 0.7*(cumulativeAngle/360)})`;

  // Sky transition
  if(cumulativeAngle>30) sky.classList.add("daySky");

  // Moon fade out
  if(cumulativeAngle>=360){
    moon.style.opacity=0;
    rotating=false;
    if(!evolutionDone){
      evolutionDone=true;
      setTimeout(()=>btn.style.opacity=1,600);
    }
  }
});

// ---------- Button Click -> Cross Reveal ----------
btn.addEventListener('click',()=>{
  btn.style.opacity=0;
  setTimeout(()=>btn.style.display="none",700);

  setTimeout(()=>{
    cross.style.opacity=1;
    cross.style.transform="translateX(-50%) scale(1.12)";
  },700);

  setTimeout(()=>cross.style.transform="translateX(-50%) scale(1)",2500);
});
</script>
</body>
</html>
