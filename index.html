<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Phase 1 — IMAX Cinematic Night</title>

<style>
    body {
        margin: 0;
        overflow: hidden;
        background: radial-gradient(circle at center, #02010a, #000000 70%);
        font-family: "Cinzel", serif;
    }

    /* -------- TWINKLING STARS -------- */
    .star {
        position: absolute;
        width: 2px;
        height: 2px;
        background: white;
        border-radius: 50%;
        opacity: 0;
        animation: twinkle 2s infinite ease-in-out;
        filter: drop-shadow(0 0 6px white);
    }

    @keyframes twinkle {
        0%,100% { opacity: 0.1; transform: scale(1); }
        50% { opacity: 1; transform: scale(1.8); }
    }

    /* -------- MOON -------- */
    #moon {
        position: absolute;
        top: 40px;
        left: 40px;
        width: 140px;
        height: 140px;
        background: radial-gradient(circle, #ffffff, #d9d9d9 60%, #8d8d8d 100%);
        border-radius: 50%;
        box-shadow: 0 0 40px #ffffffaa;
        cursor: grab;
        transition: opacity 1.5s ease-out;
    }

    /* -------- SUN -------- */
    #sun {
        position: absolute;
        top: -200px;
        right: -200px;
        width: 220px;
        height: 220px;
        background: radial-gradient(circle, #fff1a3, #ffcc33, #ff9a00);
        border-radius: 50%;
        box-shadow: 0 0 50px #ffb300aa;
        opacity: 0;
        transition: all 2s ease-out;
    }

    /* -------- MESSAGE -------- */
    #message {
        position: absolute;
        bottom: 50px;
        width: 100%;
        text-align: center;
        font-size: 20px;   /* REDUCED FONT SIZE */
        letter-spacing: 2px;
        color: #ffdca8;
        text-shadow: 0 0 22px #ffebc2;
        opacity: 0;
    }
</style>
</head>

<body>

<div id="moon"></div>
<div id="sun"></div>
<div id="message"></div>

<script>
/* -------- CREATE 3D TWINKLING STARS -------- */
for (let i = 0; i < 150; i++) {
    let s = document.createElement("div");
    s.className = "star";
    s.style.top = Math.random() * window.innerHeight + "px";
    s.style.left = Math.random() * window.innerWidth + "px";
    s.style.animationDelay = (Math.random() * 3) + "s";
    document.body.appendChild(s);
}

/* -------- DRAG MOON -------- */
let moon = document.getElementById("moon");
let message = document.getElementById("message");
let sun = document.getElementById("sun");

let msgText = "ON THIS CALM BIRTHDAY EVE SO NEW, GOD SOFTLY WHISPERS, MY PLANS ARE MADE FOR YOU.";
let revealIndex = 0;
let dragging = false;

moon.addEventListener("mousedown", () => dragging = true);
document.addEventListener("mouseup", () => dragging = false);

document.addEventListener("mousemove", (e) => {
    if (dragging) {
        moon.style.left = e.pageX - 60 + "px";
        moon.style.top = e.pageY - 60 + "px";

        // fade stars based on drag X position
        let fadeAmount = Math.min(1, e.pageX / window.innerWidth);

        document.querySelectorAll(".star").forEach(star => {
            star.style.opacity = (1 - fadeAmount);
        });

        // reveal message letter by letter
        if (revealIndex < msgText.length) {
            message.style.opacity = 1;
            message.textContent = msgText.substring(0, revealIndex++);
        }

        // after message finishes
        if (revealIndex >= msgText.length) {
            moon.style.opacity = 0;  // moon fades
            setTimeout(() => {
                sun.style.opacity = 1;
                sun.style.top = "40px";
                sun.style.right = "40px";
            }, 1200);
        }
    }
});
</script>

</body>
</html>
