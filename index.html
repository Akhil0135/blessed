<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Moonbeam Reveals Message</title>
<style>
  body, html {
    margin: 0;
    padding: 0;
    overflow: hidden;
    width: 100%;
    height: 100%;
    background: linear-gradient(to top, #0b0c2a, #1a1a3b);
    font-family: 'Segoe UI', sans-serif;
  }

  /* Stars */
  .star {
    position: absolute;
    border-radius: 50%;
    background: white;
    opacity: 0.8;
    box-shadow: 0 0 6px rgba(255,255,255,0.7);
    animation: twinkle 2s infinite alternate;
  }
  @keyframes twinkle {
    0% { opacity: 0.3; transform: scale(1); }
    50% { opacity: 1; transform: scale(1.5); }
    100% { opacity: 0.3; transform: scale(1); }
  }

  /* Moon */
  .moon {
    position: absolute;
    width: 120px;
    height: 120px;
    background: radial-gradient(circle, #fefbd8 0%, #f5e7a0 70%, #e0c97f 100%);
    border-radius: 50%;
    top: 50px;
    left: 50px;
    box-shadow: 0 0 30px 10px #fffacd;
  }

  /* Clouds */
  .cloud {
    position: absolute;
    width: 250px;
    height: 100px;
    background: rgba(255,255,255,0.05);
    border-radius: 50%;
    filter: blur(20px);
    box-shadow: 0 0 30px rgba(255,255,255,0.05);
    animation: moveCloud linear infinite, morphCloud ease-in-out infinite alternate;
  }
  .cloud::before, .cloud::after {
    content: '';
    position: absolute;
    background: rgba(255,255,255,0.05);
    width: 150px;
    height: 80px;
    border-radius: 50%;
    filter: blur(20px);
  }
  .cloud::before { top: -30px; left: 50px; }
  .cloud::after { top: 20px; left: 100px; }
  @keyframes moveCloud { 0% { left: -300px; } 100% { left: 100%; } }
  @keyframes morphCloud { 0% { transform: scale(1,1); } 50% { transform: scale(1.1, 0.9); } 100% { transform: scale(1,1); } }

  /* Moonbeam */
  .moonbeam {
    position: absolute;
    width: 10px;
    height: 10px;
    background: radial-gradient(circle, rgba(255,255,255,0.8) 0%, rgba(255,255,255,0) 70%);
    border-radius: 50%;
    box-shadow: 0 0 30px 10px rgba(255,255,255,0.6);
    pointer-events: none;
  }

  /* Message letters */
  .message-letter {
    position: absolute;
    color: white;
    font-size: 2rem;
    text-shadow: 0 0 10px #fff, 0 0 20px #a0c4ff;
    opacity: 0;
    pointer-events: none;
  }
</style>
</head>
<body>

<div class="moon"></div>

<script>
  // Stars
  for(let i=0;i<150;i++){
    const star=document.createElement('div');
    star.classList.add('star');
    star.style.top=Math.random()*window.innerHeight+'px';
    star.style.left=Math.random()*window.innerWidth+'px';
    star.style.width=star.style.height=Math.random()*3+1+'px';
    document.body.appendChild(star);
  }

  // Clouds
  for(let i=0;i<5;i++){
    const cloud=document.createElement('div');
    cloud.classList.add('cloud');
    cloud.style.top=Math.random()*300+'px';
    cloud.style.animationDuration=(40 + Math.random()*40)+'s, '+(6 + Math.random()*4)+'s';
    cloud.style.opacity = 0.05 + Math.random()*0.1;
    document.body.appendChild(cloud);
  }

  // Message
  const messageText = "The night whispers secrets to those who listen...";
  const letters = [];
  messageText.split("").forEach((char,i)=>{
    const letter = document.createElement('div');
    letter.className = 'message-letter';
    letter.innerText = char;
    document.body.appendChild(letter);
    letters.push(letter);
  });

  // Moonbeam animation
  function animateMoonbeam() {
    const beam = document.createElement('div');
    beam.className = 'moonbeam';
    document.body.appendChild(beam);

    const startX = 100; // moon x
    const startY = 100; // moon y
    const centerX = window.innerWidth/2 - letters.length*7;
    const centerY = window.innerHeight/2;
    const duration = 4000;
    const startTime = performance.now();

    function step(now){
      const elapsed = now - startTime;
      const t = Math.min(elapsed/duration,1);

      // Beam moves toward center
      const x = startX + (centerX - startX)*t;
      const y = startY + (centerY - startY)*t;
      beam.style.left = x + "px";
      beam.style.top = y + "px";

      // Reveal letters gradually as beam passes
      const lettersToShow = Math.floor(t * letters.length);
      for(let i=0;i<lettersToShow;i++){
        letters[i].style.left = centerX + i*14 + "px";
        letters[i].style.top = centerY + "px";
        letters[i].style.opacity = 1;
      }

      if(t < 1){
        requestAnimationFrame(step);
      } else {
        beam.remove();
      }
    }

    requestAnimationFrame(step);
  }

  setTimeout(animateMoonbeam, 1500);
</script>

</body>
</html>
