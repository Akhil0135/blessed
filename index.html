<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cinematic Night to Day</title>
<style>
  body, html {
    margin:0;
    padding:0;
    width:100%;
    height:100%;
    overflow:hidden;
    font-family: 'Cinzel', serif;
    background: linear-gradient(to top, #000000, #0d0d0d 50%, #1a1a1a);
    transition: background 3s ease;
  }

  /* Stars */
  .star {
    position: absolute;
    border-radius: 50%;
    background: white;
    opacity: 0.8;
    box-shadow: 0 0 8px rgba(255,255,255,0.9);
    animation: twinkle 2s infinite alternate;
  }
  @keyframes twinkle {
    0% { opacity:0.3; transform:scale(1);}
    50% { opacity:1; transform:scale(1.5);}
    100% { opacity:0.3; transform:scale(1);}
  }

  /* Clouds */
  .cloud {
    position: absolute;
    width: 250px;
    height: 100px;
    background: rgba(255,255,255,0.07);
    border-radius:50%;
    filter: blur(25px);
    animation: moveCloud linear infinite;
  }
  @keyframes moveCloud {
    0% { left:-300px;}
    100% { left:110%;}
  }

  /* Moon */
  .moon {
    position:absolute;
    width:140px;
    height:140px;
    background: radial-gradient(circle,#fffde6 0%,#f3e4b0 60%,#d9c180 100%);
    border-radius:50%;
    top:80px;
    left:-150px;
    box-shadow:0 0 18px 4px rgba(255,255,200,0.4);
    animation: moonMove 40s linear forwards;
  }
  @keyframes moonMove {
    0% { left:-150px; }
    100% { left:80%; }
  }

  /* Shooting stars */
  .shooting-star {
    position:absolute;
    width:8px;
    height:3px;
    background: linear-gradient(0deg, rgba(255,255,255,0), white);
    border-radius:50%;
    transform-origin: top left;
  }

  /* Spaceship */
  .spaceship {
    position:absolute;
    width:120px;
    top:50%;
    left:50%;
    transform: translate(-50%,-50%);
    z-index:50;
    opacity:1;
    transition: opacity 2s ease;
  }

  /* Message */
  #message {
    position:absolute;
    width:100%;
    text-align:center;
    font-size:28px;
    color:#f9e9c9;
    top:65%;
    opacity:0;
  }
  .letter {
    opacity:0;
    display:inline-block;
    transform: translateY(15px);
    animation: revealLetter 0.5s forwards;
  }
  @keyframes revealLetter {
    0% { opacity:0; transform: translateY(15px); }
    100% { opacity:1; transform: translateY(0); }
  }

  /* Click button */
  #clickBtn {
    position:absolute;
    bottom:15vh;
    left:50%;
    transform: translateX(-50%);
    padding:12px 30px;
    font-size:20px;
    font-family: 'Cinzel', serif;
    background: rgba(255,255,255,0.15);
    border:1px solid rgba(255,255,255,0.4);
    border-radius:40px;
    color:#fff;
    cursor:pointer;
    z-index:200;
    opacity:0;
    pointer-events:none;
    transition: opacity 1.8s ease;
  }
  #clickBtn.float {
    animation: btnFloat 3s ease-in-out infinite;
  }
  @keyframes btnFloat {
    0% { transform: translateX(-50%) translateY(0) scale(1.05);}
    50% { transform: translateX(-50%) translateY(-6px) scale(1.1);}
    100% { transform: translateX(-50%) translateY(0) scale(1.05);}
  }
</style>
</head>
<body>

<div id="stars"></div>
<div id="clouds"></div>
<div class="moon"></div>

<div id="message"></div>
<button id="clickBtn">Click Here</button>

<script>
  // Stars for night
  const starCount=180;
  const stars=[];
  for(let i=0;i<starCount;i++){
    const s=document.createElement('div');
    s.className='star';
    const size=Math.random()*2+1;
    s.style.width=s.style.height=size+'px';
    s.style.top=Math.random()*window.innerHeight+'px';
    s.style.left=Math.random()*window.innerWidth+'px';
    document.body.appendChild(s);
    stars.push(s);
  }

  // Clouds
  const cloudCount=8;
  for(let i=0;i<cloudCount;i++){
    const c=document.createElement('div');
    c.className='cloud';
    c.style.top=(50+Math.random()*250)+'px';
    c.style.animationDuration=(35+Math.random()*40)+'s';
    document.body.appendChild(c);
  }

  // Shooting stars
  function createShootingStar(){
    const star=document.createElement('div');
    star.className='shooting-star';
    star.style.top=Math.random()*200+'px';
    star.style.left=window.innerWidth+'px';
    const dur=1.2+Math.random()*0.8;
    star.style.animationDuration=dur+'s';
    document.body.appendChild(star);
    setTimeout(()=>{ star.remove(); }, dur*1000);
  }
  setInterval(createShootingStar, 1200);

  // Message reveal
  const msg="On this calm birthday eve so new, God softly whispers, my plans are made for you.";
  const messageDiv=document.getElementById("message");
  function revealMessage(){
    let delay=0;
    msg.split("").forEach((char,i)=>{
      const span=document.createElement('span');
      span.className='letter';
      span.textContent=char===' '?' ':char;
      span.style.animationDelay=(0.05*i)+'s';
      messageDiv.appendChild(span);
    });
    messageDiv.style.opacity=1;
  }

  // Click button reveal
  const clickBtn=document.getElementById('clickBtn');
  const moon=document.querySelector('.moon');
  const spaceship=document.querySelector('.spaceship');

  function checkMoon(){
    const rect=moon.getBoundingClientRect();
    if(rect.left > window.innerWidth*0.75){
      clickBtn.style.opacity=1;
      clickBtn.classList.add('float');
      revealMessage();
      clearInterval(interval);
    }
  }
  const interval=setInterval(checkMoon, 200);

  // Click button action
  clickBtn.addEventListener('click',()=>{
    // Day transition
    document.body.style.background="linear-gradient(to top,#87ceeb,#a0d8ff 50%,#c0e4ff)";
    // Remove stars
    stars.forEach(s=>s.remove());
    // Remove moon and spaceship
    moon.style.opacity=0;
    spaceship.style.opacity=0;
    clickBtn.style.opacity=0;
  });
</script>
</body>
</html>
