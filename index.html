<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Phase 2 — Captain America Shield</title>
<style>
html, body {
    margin: 0;
    padding: 0;
    overflow: hidden;
    background: #0a0a1a; /* Cinematic deep blue-black background */
}
canvas {
    display: block;
}

/* IMAX cinematic styling */
#shieldCanvas {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
}

</style>
</head>
<body>

<canvas id="shieldCanvas"></canvas>

<script>
// -------------------- CANVAS SETUP --------------------
const canvas = document.getElementById('shieldCanvas');
const ctx = canvas.getContext('2d');

function resize() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
}
resize();
window.onresize = resize;

// -------------------- STARRY BACKGROUND --------------------
const stars = [];
for (let i = 0; i < 200; i++) {
    stars.push({
        x: Math.random() * canvas.width,
        y: Math.random() * canvas.height,
        z: Math.random() * 1.5 + 0.5,
        tw: Math.random() * 0.02 + 0.005
    });
}

function drawStars() {
    ctx.fillStyle = "#0a0a1a";
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    stars.forEach(s => {
        const glow = (Math.sin(Date.now() * s.tw) + 1) * 0.5;
        ctx.fillStyle = `rgba(255,255,255,${glow})`;
        ctx.beginPath();
        ctx.arc(s.x, s.y, s.z, 0, Math.PI*2);
        ctx.fill();
    });
}

// -------------------- SHIELD PARAMETERS --------------------
const shieldRadius = 150; // Main radius
const shieldX = canvas.width / 2;
const shieldY = canvas.height / 2;
let angle = 0;

// Draw MCU-style shield
function drawShield(x, y, r, rotation) {
    ctx.save();
    ctx.translate(x, y);
    ctx.rotate(rotation);

    // Outer ring
    ctx.beginPath();
    ctx.arc(0, 0, r, 0, Math.PI*2);
    ctx.fillStyle = '#aa0000';
    ctx.fill();
    ctx.strokeStyle = '#ffffff20';
    ctx.lineWidth = 4;
    ctx.stroke();

    // White ring
    ctx.beginPath();
    ctx.arc(0, 0, r*0.8, 0, Math.PI*2);
    ctx.fillStyle = '#ffffff';
    ctx.fill();
    ctx.strokeStyle = '#ffffff20';
    ctx.lineWidth = 3;
    ctx.stroke();

    // Blue center ring
    ctx.beginPath();
    ctx.arc(0, 0, r*0.55, 0, Math.PI*2);
    ctx.fillStyle = '#002366';
    ctx.fill();
    ctx.strokeStyle = '#ffffff20';
    ctx.lineWidth = 2;
    ctx.stroke();

    // Star in center
    ctx.fillStyle = '#ffffff';
    ctx.beginPath();
    const starR = r*0.2;
    for (let i = 0; i < 5; i++) {
        ctx.lineTo(Math.cos((18 + i*72)*Math.PI/180)*starR, -Math.sin((18 + i*72)*Math.PI/180)*starR);
        ctx.lineTo(Math.cos((54 + i*72)*Math.PI/180)*(starR*0.5), -Math.sin((54 + i*72)*Math.PI/180)*(starR*0.5));
    }
    ctx.closePath();
    ctx.fill();

    ctx.restore();
}

// -------------------- ANIMATION LOOP --------------------
function animate() {
    drawStars();
    angle += 0.01; // Smooth rotation speed
    drawShield(shieldX, shieldY, shieldRadius, angle);

    requestAnimationFrame(animate);
}

animate();
</script>

</body>
</html>
