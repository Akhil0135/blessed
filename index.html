<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>IMAX Nolan Cosmic Vision</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#000000;font-family:Inter,system-ui,Segoe UI,Roboto,'Helvetica Neue',Arial;color:#fff;overflow:hidden;}
.stage{position:fixed;inset:0;display:grid;place-items:center;overflow:hidden;perspective:1800px;}
.background{position:absolute;inset:0;z-index:1;overflow:hidden;transform-style:preserve-3d;}
.nebula-layer{position:absolute;inset:-40%;mix-blend-mode:screen;filter:blur(160px) saturate(2.5);opacity:1;transform-style:preserve-3d;}
.nebula1{background:radial-gradient(circle at 20% 40%, rgba(255,70,120,0.95), transparent 40%);animation:nebulaDrift 140s linear infinite;}
.nebula2{background:radial-gradient(circle at 80% 60%, rgba(70,130,255,0.85), transparent 45%);animation:nebulaDrift 180s linear infinite;}
.nebula3{background:radial-gradient(circle at 50% 50%, rgba(90,200,255,0.65), transparent 50%);animation:nebulaDrift 220s linear infinite;}
@keyframes nebulaDrift{0%{transform:translate3d(0,0,0)}50%{transform:translate3d(200px,-140px,0) scale(1.12)}100%{transform:translate3d(0,0,0)}}
.particles{position:absolute;inset:0;z-index:4;pointer-events:none;transform-style:preserve-3d;}
.particle{position:absolute;width:3px;height:3px;background:#fff;border-radius:50%;opacity:0.4;animation:particleDrift linear infinite;}
@keyframes particleDrift{0%{transform:translate3d(0,0,0)}100%{transform:translate3d(var(--x),var(--y),var(--z))}}
.shield-wrap{position:relative;z-index:10;display:grid;place-items:center;width:60vmin;height:60vmin;pointer-events:none;transform-style:preserve-3d;}
.shield-svg{width:100%;height:100%;transform-origin:center center;pointer-events:none;}
#starGroup{pointer-events:auto}
#shield-star{transform-box:fill-box;transform-origin:center center;fill:#bdbdbd;filter:drop-shadow(0 0 15px rgba(255,255,255,0.4))}
.letters-layer{position:fixed;left:0;right:0;bottom:6vh;height:18vh;pointer-events:none;z-index:11;display:flex;justify-content:center;align-items:flex-end;gap:2.4vw;}
.letter{font-size:6.5vmin;font-weight:900;line-height:1;display:inline-block;position:fixed;transform:translate(-50%,-50%) scale(0.8);opacity:0;-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;text-shadow:0 0 12px rgba(0,0,0,0.8);transition:opacity .8s ease, transform 1.2s cubic-bezier(.2,.9,.2,1);}
.letter.metal{background-image:linear-gradient(120deg,#ff4d4d 0%, #ff7777 30%, #002b76 70%, #003366 100%);-webkit-text-stroke:0.6px rgba(0,0,0,0.35);filter:drop-shadow(0 6px 24px rgba(0,0,0,0.8))}
.letter::before{content:'';position:absolute;left:0;right:0;top:0;bottom:0;background:radial-gradient(ellipse at 30% 30%, rgba(255,255,255,0.15) 0%, rgba(255,255,255,0.02) 6%, transparent 10%),radial-gradient(ellipse at 70% 65%, rgba(255,255,255,0.10) 0%, rgba(255,255,255,0.02) 4%, transparent 10%),radial-gradient(1200px 600px at 40% 50%, rgba(80,110,255,0.15), transparent 20%),radial-gradient(900px 500px at 60% 30%, rgba(255,110,150,0.10), transparent 20%),linear-gradient(90deg, rgba(0,0,0,0.0), rgba(0,0,0,0.0));mix-blend-mode:screen;pointer-events:none;opacity:0.9;transform:translateY(0);animation:galaxyDrift 6s linear infinite;-webkit-background-clip:text;background-clip:text;}
@keyframes galaxyDrift{0%{transform:translateY(0) translateX(0)}50%{transform:translateY(-8px) translateX(16px)}100%{transform:translateY(0) translateX(0)}}
.letter.show{opacity:1;transform:translate(-50%,-50%) scale(1)}
@media (max-width:600px){.letter{font-size:10vmin}.letters-layer{bottom:3vh;height:26vh;gap:1.2vw}}
</style>
</head>
<body>
<div class="stage">
  <div class="background">
    <div class="nebula-layer nebula1"></div>
    <div class="nebula-layer nebula2"></div>
    <div class="nebula-layer nebula3"></div>
    <div class="particles"></div>
  </div>

  <div class="shield-wrap" aria-hidden="true">
    <svg class="shield-svg" viewBox="0 0 200 200" role="img" aria-label="shield">
      <defs>
        <radialGradient id="metalRed" cx="50%" cy="50%" r="50%"><stop offset="0%" stop-color="#ff4d4d"/><stop offset="100%" stop-color="#990000"/></radialGradient>
        <radialGradient id="metalWhite" cx="50%" cy="50%" r="50%"><stop offset="0%" stop-color="#ffffff"/><stop offset="100%" stop-color="#cccccc"/></radialGradient>
        <radialGradient id="metalBlue" cx="50%" cy="50%" r="50%"><stop offset="0%" stop-color="#4d90ff"/><stop offset="100%" stop-color="#003366"/></radialGradient>
      </defs>
      <g id="rings" transform="translate(100,100)">
        <circle r="92" fill="url(#metalRed)"/>
        <circle r="76" fill="url(#metalWhite)"/>
        <circle r="56" fill="url(#metalRed)"/>
        <circle r="36" fill="url(#metalBlue)"/>
      </g>
      <g id="starGroup" transform="translate(100,100)">
        <polygon id="shield-star" points="0,-28 6,-8 26,-6 10,6 14,26 0,14 -14,26 -10,6 -26,-6 -6,-8" fill="#bdbdbd"/>
      </g>
    </svg>
  </div>
</div>
<div class="letters-layer" id="lettersLayer" aria-hidden="true"></div>
<script>
(function createParticles(){
  const ct=document.querySelector('.particles');
  for(let i=0;i<200;i++){
    const p=document.createElement('div');
    p.className='particle';
    p.style.left=(Math.random()*100)+'%';
    p.style.top=(Math.random()*100)+'%';
    p.style.setProperty('--x', (Math.random()*1200 - 600) + 'px');
    p.style.setProperty('--y', (Math.random()*900 - 450) + 'px');
    p.style.setProperty('--z', (Math.random()*800 - 400) + 'px');
    p.style.animationDuration = (25 + Math.random()*35) + 's';
    ct.appendChild(p);
  }
})();
</script>
</body>
</html>
