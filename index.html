<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Ultimate Cinematic Night</title>
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  body {
    height: 100vh;
    background: radial-gradient(circle at top, #0a0a15, #000);
    overflow: hidden;
    position: relative;
    font-family: sans-serif;
  }

  /* === Cinematic Stars === */
  .star {
    position: absolute;
    width: 2px;
    height: 2px;
    background: white;
    border-radius: 50%;
    opacity: 0.8;
    animation: twinkle 3s infinite ease-in-out;
  }

  @keyframes twinkle {
    0%, 100% { opacity: 0.2; }
    50% { opacity: 1; }
  }

  /* === Moon === */
  .moon {
    position: absolute;
    top: 20%;
    left: -200px;
    width: 180px;
    height: 180px;
    background: radial-gradient(circle, #fff 40%, #d6d6d6 70%, #bbbbbb 100%);
    border-radius: 50%;
    box-shadow: 0 0 40px #ffffffaa;
    animation: moonMove 18s cubic-bezier(0.25, 0.1, 0.25, 1) forwards;
  }

  @keyframes moonMove {
    0% { transform: translateX(0); }
    100% { transform: translateX(calc(100vw - 350px)); }
  }

  /* === Clouds === */
  .cloud {
    position: absolute;
    width: 350px;
    height: 120px;
    background: rgba(255, 255, 255, 0.1);
    filter: blur(18px);
    border-radius: 200px;
    animation: floatClouds 40s linear infinite;
  }

  .cloud.c2 {
    width: 450px;
    top: 35%;
    animation-duration: 55s;
    opacity: 0.5;
  }

  .cloud.c3 {
    width: 600px;
    top: 55%;
    animation-duration: 70s;
    opacity: 0.35;
  }

  @keyframes floatClouds {
    0% { left: -600px; }
    100% { left: 110%; }
  }

  /* === Message Reveal === */
  .msg {
    position: absolute;
    bottom: 10%;
    width: 100%;
    text-align: center;
    font-size: 32px;
    color: #ffffffdd;
    letter-spacing: 2px;
    opacity: 0;
    animation: fadeMsg 6s ease-in-out forwards 6s;
  }

  @keyframes fadeMsg {
    0% { opacity: 0; transform: translateY(20px); }
    100% { opacity: 1; transform: translateY(0); }
  }
</style>
</head>
<body>

<!-- Stars (JS will generate) -->
<div id="stars"></div>

<!-- Moon -->
<div class="moon"></div>

<!-- Clouds -->
<div class="cloud" style="top: 25%"></div>
<div class="cloud c2"></div>
<div class="cloud c3"></div>

<!-- Message -->
<div class="msg">Wishing You a Magical Cinematic Night ✨</div>

<script>
  // === Generate Stars Dynamically ===
  const starContainer = document.getElementById("stars");

  for (let i = 0; i < 200; i++) {
    let star = document.createElement("div");
    star.classList.add("star");
    star.style.top = Math.random() * 100 + "vh";
    star.style.left = Math.random() * 100 + "vw";
    star.style.animationDelay = Math.random() * 3 + "s";
    starContainer.appendChild(star);
  }
// === Add Click Button ===
const clickBtn = document.createElement('button');
clickBtn.textContent = 'Click Here';
clickBtn.style.position = 'absolute';
clickBtn.style.bottom = '15%';
clickBtn.style.left = '50%';
clickBtn.style.transform = 'translateX(-50%)';
clickBtn.style.padding = '14px 32px';
clickBtn.style.fontSize = '20px';
clickBtn.style.borderRadius = '12px';
clickBtn.style.border = 'none';
clickBtn.style.background = 'rgba(255,255,255,0.2)';
clickBtn.style.backdropFilter = 'blur(6px)';
clickBtn.style.color = 'white';
clickBtn.style.cursor = 'pointer';
clickBtn.style.transition = '0.4s ease';
clickBtn.style.pointerEvents = 'auto';
clickBtn.style.opacity = '0';
clickBtn.style.animation = 'fadeInBtn 4s ease forwards 8s';
document.body.appendChild(clickBtn);

// Button click → disappear
clickBtn.onclick = () => {
  clickBtn.style.opacity = '0';
  clickBtn.style.pointerEvents = 'none';
};

// === Moon Movement Stop Before Screen ===
const moon = document.querySelector('.moon');
let moonPos = -200;
let moonSpeed = 2.2;
let stopPoint = window.innerWidth * 0.74;

function moveMoon(){
  if(moonPos < stopPoint){
    moonPos += moonSpeed;
    moon.style.left = moonPos + 'px';
    requestAnimationFrame(moveMoon);
  }
}
requestAnimationFrame(moveMoon);

</script>

</body>
</html>
