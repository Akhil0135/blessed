<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>IMAX Phase 1 — Night Sky & Moon</title>
<style>
    html, body {
        margin: 0;
        padding: 0;
        overflow: hidden;
        background: #000;
        user-select: none;
    }
    canvas {
        display: block;
    }
    #msg {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        color: #fff;
        font-family: 'Arial', sans-serif;
        font-size: 28px;
        text-align: center;
        opacity: 0;
        transition: opacity 0.2s ease;
        width: 80%;
        line-height: 1.5;
    }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="msg">On this calm birthday eve so new, God softly whispers, my plans are made for you</div>

<script>
const canvas = document.getElementById("c");
const ctx = canvas.getContext("2d");
const msg = document.getElementById("msg");

function resize() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
    moon.x = canvas.width * 0.15;
    moon.y = canvas.height * 0.15;
}
resize();
window.onresize = resize;

// ------------ CAMERA DRIFT -------------
let driftX = 0, driftY = 0, zoom = 1;

// ------------ STARS -------------
const starCount = 200;
const stars = [];

for(let i=0;i<starCount;i++){
    stars.push({
        x: Math.random()*canvas.width,
        y: Math.random()*canvas.height,
        size: Math.random()*1.2+0.3,
        twinkle: Math.random()*0.02+0.002,
        baseAlpha: Math.random()*0.5+0.3
    });
}

// ------------ MOON -------------
const moon = {
    x: canvas.width*0.15,
    y: canvas.height*0.15,
    radius: Math.min(canvas.width, canvas.height)*0.08,
    dragging: false,
    offsetX: 0
};

// ------------ DRAW FUNCTIONS -------------
function drawStars() {
    stars.forEach(s => {
        const alpha = s.baseAlpha + Math.sin(Date.now()*s.twinkle)*0.5;
        ctx.fillStyle = `rgba(255,255,255,${alpha})`;
        ctx.beginPath();
        ctx.arc(s.x, s.y, s.size, 0, Math.PI*2);
        ctx.fill();
    });
}

function drawMoon() {
    // Clear, sharp moon
    ctx.fillStyle = '#ffffff';
    ctx.beginPath();
    ctx.arc(moon.x, moon.y, moon.radius, 0, Math.PI*2);
    ctx.fill();

    // Cinematic halo
    const halo = ctx.createRadialGradient(moon.x, moon.y, moon.radius*0.9, moon.x, moon.y, moon.radius*1.6);
    halo.addColorStop(0, 'rgba(255,255,255,0.2)');
    halo.addColorStop(1, 'rgba(255,255,255,0)');
    ctx.fillStyle = halo;
    ctx.beginPath();
    ctx.arc(moon.x, moon.y, moon.radius*1.6, 0, Math.PI*2);
    ctx.fill();
}

// ------------ ANIMATION -------------
function animate() {
    const bg = ctx.createLinearGradient(0,0,0,canvas.height);
    bg.addColorStop(0,'#000010');
    bg.addColorStop(1,'#000022');
    ctx.fillStyle = bg;
    ctx.fillRect(0,0,canvas.width,canvas.height);

    driftX = Math.sin(Date.now()*0.0002)*20;
    driftY = Math.cos(Date.now()*0.00015)*15;
    zoom = 1 + Math.sin(Date.now()*0.0001)*0.02;
    ctx.save();
    ctx.translate(driftX, driftY);
    ctx.scale(zoom, zoom);

    drawStars();
    drawMoon();

    ctx.restore();

    // Show message based on moon's horizontal position
    const progress = Math.min(Math.max((moon.x - canvas.width*0.15) / (canvas.width*0.7), 0), 1);
    msg.style.opacity = progress;

    requestAnimationFrame(animate);
}
animate();

// ------------ DRAG MOON -------------
canvas.addEventListener('mousedown', e => {
    const dx = e.clientX - moon.x;
    const dy = e.clientY - moon.y;
    if(Math.sqrt(dx*dx + dy*dy) < moon.radius){
        moon.dragging = true;
        moon.offsetX = dx;
    }
});
canvas.addEventListener('mouseup', () => moon.dragging = false);
canvas.addEventListener('mousemove', e => {
    if(moon.dragging){
        moon.x = Math.min(Math.max(e.clientX - moon.offsetX, moon.radius), canvas.width - moon.radius);
    }
});
canvas.addEventListener('mouseleave', () => moon.dragging = false);
</script>
</body>
</html>
