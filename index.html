<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Phase 1 — IMAX Vision</title>

<style>
    html, body {
        margin: 0;
        padding: 0;
        overflow: hidden;
        background: #000;
        height: 100%;
        width: 100%;
        font-family: "Cinzel", serif;
    }

    #canvas {
        position: absolute;
        top: 0;
        left: 0;
        z-index: 1;
    }

    .planet {
        position: absolute;
        width: 160px;
        height: 160px;
        border-radius: 50%;
        box-shadow: 0 0 60px rgba(255,255,255,0.8);
        filter: brightness(1.3);
        user-select: none;
    }

    #moon {
        top: 40px;
        left: 40px;
        background: radial-gradient(circle at 30% 30%, #ffffff, #dcdcdc, #9c9c9c);
        cursor: grab;
        z-index: 10;
    }

    #sun {
        top: -200px;
        right: -200px;
        background: radial-gradient(circle at 40% 40%, #fff6b0, #ffcc33, #ff8800);
        opacity: 0;
        filter: brightness(1.4);
        z-index: 5;
    }

    #message {
        position: absolute;
        bottom: 120px;
        width: 100%;
        text-align: center;
        font-size: 32px;
        color: #ffd87a;
        letter-spacing: 4px;
        z-index: 20;
        white-space: nowrap; /* IMPORTANT: Single-line message */
        text-shadow: 0 0 18px #ffddaa;
    }
</style>
</head>
<body>

<canvas id="canvas"></canvas>

<div id="moon" class="planet"></div>
<div id="sun" class="planet"></div>

<div id="message"></div>

<script>
/* THE MESSAGE — stays on ONE LINE */
const fullMessage =
"ON THIS CALM BIRTHDAY EVE SO NEW, GOD SOFTLY WHISPERS, MY PLANS ARE MADE FOR YOU.";

const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

function resize() {
    canvas.width = innerWidth;
    canvas.height = innerHeight;
}
resize();
addEventListener("resize", resize);

/* ---------------- STARS (IMAX twinkle) ---------------- */
let stars = [];
const STAR_COUNT = 220;

for (let i = 0; i < STAR_COUNT; i++) {
    stars.push({
        x: Math.random() * innerWidth,
        y: Math.random() * innerHeight,
        size: Math.random() * 1.2 + 0.3,
        tw: Math.random() * 0.015 + 0.002,
        fade: 1
    });
}

function drawStars() {
    stars.forEach(s => {
        let glow = (Math.sin(Date.now() * s.tw) + 1) / 2;
        ctx.fillStyle = `rgba(255,255,255,${glow * s.fade})`;
        ctx.beginPath();
        ctx.arc(s.x, s.y, s.size, 0, Math.PI * 2);
        ctx.fill();
    });
}

/* ---------------- MOON DRAGGING ---------------- */
const moon = document.getElementById("moon");
const sun = document.getElementById("sun");
const message = document.getElementById("message");

let dragging = false;
let offsetX = 0, offsetY = 0;
let progress = 0;

moon.addEventListener("mousedown", e => {
    dragging = true;
    offsetX = e.clientX - moon.offsetLeft;
    offsetY = e.clientY - moon.offsetTop;
});

addEventListener("mouseup", () => dragging = false);

addEventListener("mousemove", e => {
    if (!dragging) return;

    moon.style.left = (e.clientX - offsetX) + "px";
    moon.style.top = (e.clientY - offsetY) + "px";

    /* DRAG PROGRESS (0 to 1) */
    progress = Math.min(1, Math.max(0, e.clientX / innerWidth));

    /* Stars fade as moon moves */
    stars.forEach(s => s.fade = 1 - progress);

    /* REVEAL MESSAGE LETTER-BY-LETTER */
    let lettersToShow = Math.floor(fullMessage.length * progress);
    message.innerText = fullMessage.slice(0, lettersToShow);

    /* When full message revealed → fade moon & rise sun */
    if (progress >= 1) {
        moon.style.transition = "2s ease";
        moon.style.opacity = 0;

        sunRise();
    }
});

/* ---------------- SUN RISE (IMAX style) ---------------- */
function sunRise() {
    sun.style.transition = "2.3s ease-out";
    sun.style.opacity = 1;
    sun.style.top = "40px";
    sun.style.right = "40px";
}

/* ---------------- ANIMATION LOOP ---------------- */
function animate() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    drawStars();
    requestAnimationFrame(animate);
}
animate();
</script>
</body>
</html>
