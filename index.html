<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Cross With Blue Background</title>

<style>

    /* 🌙 Page Background */
    body {
        margin: 0;
        padding: 0;
        background: #00163a; /* Navy Blue */
        height: 100vh;
        overflow: hidden;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: flex-start;
    }

    /* ⭐ STAR FIELD */
    .stars {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        z-index: 0;
        pointer-events: none;
    }

    .stars span {
        position: absolute;
        width: 3px;
        height: 3px;
        background: white;
        border-radius: 50%;
        box-shadow: 0 0 7px white;
        animation: glow 2s infinite ease-in-out alternate;
    }

    @keyframes glow {
        from { opacity: 0.3; transform: scale(1); }
        to { opacity: 1; transform: scale(1.5); }
    }

    /* ✝ CROSS – FIXED AT TOP ALWAYS */
    .cross-img {
        width: 180px;
        margin-top: 20px;
        position: fixed;
        top: 20px;
        z-index: 10;
        filter: drop-shadow(0 0 25px white);
    }

    /* 🔘 BUTTON */
    .btn {
        margin-top: 250px;
        padding: 12px 28px;
        background: white;
        color: #00163a;
        border: none;
        border-radius: 10px;
        font-size: 20px;
        font-weight: bold;
        cursor: pointer;
        z-index: 20;
        box-shadow: 0 0 12px white;
        transition: 0.25s ease-in-out;
    }

    .btn:hover {
        transform: scale(1.1);
        box-shadow: 0 0 18px white;
    }

</style>
</head>

<body>

<!-- ⭐ STAR FIELD GENERATOR -->
<div class="stars">
    <script>
        for (let i = 0; i < 45; i++) {
            let star = document.createElement("span");
            star.style.top = Math.random() * 100 + "%";
            star.style.left = Math.random() * 100 + "%";
            star.style.animationDelay = Math.random() * 2 + "s";
            document.querySelector(".stars").appendChild(star);
        }
    </script>
</div>

<!-- ✝ YOUR CROSS (ALWAYS VISIBLE) -->
<img class="cross-img" src="YOUR_CROSS_IMAGE_URL_HERE" />

<!-- 🔘 BUTTON -->
<button class="btn">CLICK HERE</button>

</body>
</html>
