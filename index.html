<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>PHASE 4 — HAPPY BIRTHDAY PRINCE</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  body { margin:0; overflow:hidden; background:#000; }
  canvas { display:block; }
</style>
</head>
<body>

<script src="https://cdn.jsdelivr.net/npm/three@0.159.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.159.0/examples/js/geometries/TextGeometry.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.159.0/examples/js/loaders/FontLoader.js"></script>

<script>
let scene = new THREE.Scene();
let camera = new THREE.PerspectiveCamera(60, window.innerWidth/window.innerHeight, 0.1, 3000);
camera.position.set(0, 150, 400);

let renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setSize(window.innerWidth, window.innerHeight);
document.body.appendChild(renderer.domElement);

// ---------------- GALAXY ----------------
let starGeometry = new THREE.BufferGeometry();
let starCount = 3000;
let starPositions = new Float32Array(starCount * 3);

for (let i = 0; i < starCount * 3; i++) {
    starPositions[i] = (Math.random() - 0.5) * 3000;
}

starGeometry.setAttribute("position", new THREE.BufferAttribute(starPositions, 3));
let starMaterial = new THREE.PointsMaterial({ color: 0xffffff, size: 2 });
let stars = new THREE.Points(starGeometry, starMaterial);
scene.add(stars);

// ---------------- LIGHTING ----------------
let ambient = new THREE.AmbientLight(0xffffff, 0.8);
scene.add(ambient);

let directional = new THREE.DirectionalLight(0xffddbb, 1.2);
directional.position.set(100, 200, 100);
scene.add(directional);

// ---------------- 3D TEXT ----------------
let textMesh;
let loader = new THREE.FontLoader();

// Using a CORS-safe mirror link:
loader.load(
  "https://raw.githubusercontent.com/frederickk/threejs_fonts/main/helvetiker_regular.typeface.json",

  function (font) {
    let textGeo = new THREE.TextGeometry("HAPPY BIRTHDAY PRINCE", {
      font: font,
      size: 30,
      height: 8,
      curveSegments: 12,
      bevelEnabled: true,
      bevelThickness: 2,
      bevelSize: 1.2,
      bevelSegments: 5
    });

    textGeo.center();

    let textMaterial = new THREE.MeshStandardMaterial({
      color: 0xffbb44,
      emissive: 0x553300,
      metalness: 0.8,
      roughness: 0.2
    });

    textMesh = new THREE.Mesh(textGeo, textMaterial);
    textMesh.position.y = 0;
    scene.add(textMesh);
  }
);

// ---------------- CAMERA ROTATION ----------------
let angle = 0;

function animate() {
    requestAnimationFrame(animate);

    stars.rotation.y += 0.0003;

    angle += 0.0015;
    camera.position.x = Math.sin(angle) * 450;
    camera.position.z = Math.cos(angle) * 450;
    camera.lookAt(0, 0, 0);

    renderer.render(scene, camera);
}
animate();

// ---------------- RESIZE ----------------
window.addEventListener("resize", () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
});
</script>

</body>
</html>
