<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Phase 4 — HAPPY BIRTHDAY PRINCE</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
    body { margin:0; overflow:hidden; background:#000; }
</style>
</head>
<body>

<!-- Three.js (module build) -->
<script type="module">

import * as THREE from "https://cdn.jsdelivr.net/npm/three@0.159.0/build/three.module.js";
import { FontLoader } from "https://cdn.jsdelivr.net/npm/three@0.159.0/examples/jsm/loaders/FontLoader.js";
import { TextGeometry } from "https://cdn.jsdelivr.net/npm/three@0.159.0/examples/jsm/geometries/TextGeometry.js";

let scene = new THREE.Scene();

let camera = new THREE.PerspectiveCamera(
    60,
    window.innerWidth / window.innerHeight,
    0.1,
    2000
);
camera.position.set(0, 30, 150);

let renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
document.body.appendChild(renderer.domElement);

// ---------- Galaxy Stars ----------
let starGeo = new THREE.BufferGeometry();
let count = 1500;
let pos = new Float32Array(count * 3);

for (let i = 0; i < count * 3; i++) {
    pos[i] = (Math.random() - 0.5) * 3000;
}

starGeo.setAttribute("position", new THREE.BufferAttribute(pos, 3));
let starMat = new THREE.PointsMaterial({ color: 0xffffff, size: 1.5 });
let stars = new THREE.Points(starGeo, starMat);
scene.add(stars);

// ---------- Lights ----------
scene.add(new THREE.AmbientLight(0xffffff, 0.6));

let point = new THREE.PointLight(0xffcc88, 2, 2000);
point.position.set(100, 200, 150);
scene.add(point);

// ---------- Text ----------
let textMesh;

const loader = new FontLoader();
loader.load(
    "https://threejs.org/examples/fonts/helvetiker_regular.typeface.json",

    function (font) {
        let geo = new TextGeometry("HAPPY BIRTHDAY PRINCE", {
            font: font,
            size: 12,
            height: 4,
            bevelEnabled: true,
            bevelThickness: 1,
            bevelSize: 0.6,
            bevelSegments: 6,
        });

        geo.center();

        let mat = new THREE.MeshStandardMaterial({
            color: 0xffd966,
            emissive: 0xffaa00,
            metalness: 0.7,
            roughness: 0.25,
        });

        textMesh = new THREE.Mesh(geo, mat);
        scene.add(textMesh);
    }
);

// ---------- Camera Orbit ----------
let angle = 0;

function animate() {
    requestAnimationFrame(animate);

    stars.rotation.y += 0.0004;

    if (textMesh) {
        angle += 0.002;
        camera.position.x = Math.sin(angle) * 160;
        camera.position.z = Math.cos(angle) * 160;
        camera.lookAt(textMesh.position);
    }

    renderer.render(scene, camera);
}

animate();

// ---------- Responsive ----------
window.addEventListener("resize", () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
});

</script>

</body>
</html>
