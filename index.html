<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>IMAX — Nolan Cosmic • Shield Reveal — Birthday</title>
<style>
  /* Reset */
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;background:#030114;font-family:Inter,system-ui,Segoe UI,Roboto,'Helvetica Neue',Arial;color:#fff}
  :root{
    --imax-letterbox: 12vh;
    --accent:#e5f1ff;
  }

  /* Stage */
  .stage{position:fixed;inset:0;display:grid;place-items:center;overflow:hidden}

  /* Cinematic letterbox */
  .letterbox-top,.letterbox-bottom{position:absolute;left:0;right:0;height:var(--imax-letterbox);background:linear-gradient(180deg,rgba(0,0,0,0.95),rgba(0,0,0,0.7));z-index:60;pointer-events:none}
  .letterbox-top{top:0}
  .letterbox-bottom{bottom:0}

  /* Cosmic backdrop */
  .cosmic{position:absolute;inset:0;background:
    radial-gradient(very farthest-corner at 20% 20%,#0b1440 0%,transparent 10%),
    radial-gradient(very farthest-corner at 80% 80%,#2b0b2d 0%,transparent 12%),
    linear-gradient(180deg,#08061a 0%,#000 60%);
    transform-origin:center;z-index:1;filter:contrast(1.05) saturate(1.1)}

  /* Nebula soft light */
  .nebula{position:absolute;inset:-10%;background:radial-gradient(circle at 30% 40%, rgba(255,120,160,0.08), transparent 12%),radial-gradient(circle at 75% 70%, rgba(80,150,255,0.06), transparent 12%);mix-blend-mode:screen;z-index:2;filter:blur(40px) saturate(1.4)}

  /* Stars */
  .stars{position:absolute;inset:0;z-index:3;pointer-events:none;opacity:0.9}
  .stars:after{content:'';position:absolute;inset:0;background-image:radial-gradient(#fff 0.8px, transparent 1px),radial-gradient(#fff 0.6px, transparent 1px);background-size:400px 400px, 120px 120px;opacity:0.35;mix-blend-mode:screen;filter:blur(.2px)}

  /* Film grain */
  .grain{position:absolute;inset:0;z-index:70;pointer-events:none;mix-blend-mode:overlay;opacity:0.06;background-image:linear-gradient(0deg, rgba(255,255,255,0.02) 1px, transparent 1px);background-size:100% 3px}

  /* Light sweep / Lens flare */
  .flare{position:absolute;left:-20%;top:10%;width:140%;height:40%;pointer-events:none;z-index:4;filter:blur(40px);opacity:0.7;background:linear-gradient(90deg,transparent 0%, rgba(255,255,255,0.035) 40%, rgba(255,255,255,0.12) 50%, rgba(255,255,255,0.035) 60%, transparent 100%);transform:rotate(-12deg)}

  /* Shield container */
  .shield-wrap{position:relative;z-index:10;display:grid;place-items:center;width:60vmin;height:60vmin;transform:translateZ(0);}

  /* Shield reveal — use SVG scaling and mask */
  .shield-svg{width:100%;height:100%;transform-origin:center center;filter:drop-shadow(0 20px 60px rgba(0,0,0,0.7))}

  /* Shield entrance cinematic motion */
  .shield-enter{animation:shieldRise 2.6s cubic-bezier(.2,.9,.2,1) forwards, shieldBounce 0.9s 2.6s cubic-bezier(.2,.9,.2,1) both}
  @keyframes shieldRise{
    0%{transform:translateY(18vh) scale(.3) rotate(-10deg);opacity:0}
    60%{opacity:1;transform:translateY(-2vh) scale(1.05) rotate(6deg)}
    100%{transform:translateY(0) scale(1) rotate(0deg)}
  }
  @keyframes shieldBounce{
    0%{transform:translateY(0)}
    30%{transform:translateY(-1.2vh)}
    60%{transform:translateY(0)}
    100%{transform:translateY(0)}
  }

  /* Star pulse */
  .star-core{transform-origin:center center;animation:starPulse 1.2s 2.6s ease-out both}
  @keyframes starPulse{0%{transform:scale(0.2);opacity:0}50%{transform:scale(1.25);opacity:1}100%{transform:scale(1);opacity:1}}

  /* Shield metallic sheen sweep */
  .sheen{position:absolute;inset:0;pointer-events:none;mix-blend-mode:screen}
  .sheen:before{content:'';position:absolute;inset:-40% -40% -40% -40%;background:linear-gradient(90deg, transparent 0%, rgba(255,255,255,0.04) 45%, rgba(255,255,255,0.12) 50%, rgba(255,255,255,0.04) 55%, transparent 100%);transform:translateX(-100%);animation:sheenMove 2.6s 2s cubic-bezier(.2,.9,.2,1) forwards}
  @keyframes sheenMove{to{transform:translateX(120%)}}

  /* Title / Name reveal */
  .title{position:absolute;bottom:calc(var(--imax-letterbox) + 6vh);left:50%;transform:translateX(-50%);text-align:center;z-index:30;pointer-events:none}
  .title .greeting{font-size:clamp(12px,1.6vmin,18px);letter-spacing:6px;color:rgba(230,240,255,0.8);text-transform:uppercase;font-weight:600;opacity:0;transform:translateY(8px);animation:greetIn 0.9s 3.6s cubic-bezier(.2,.9,.2,1) forwards}
  .title .name{font-family:"Cinzel",serif;font-weight:700;font-size:clamp(28px,4.6vmin,72px);letter-spacing:.02em;color:var(--accent);opacity:0;transform:translateY(18px) scale(.92);animation:nameIn 1s 3.9s cubic-bezier(.2,.9,.2,1) forwards}
  @keyframes greetIn{to{opacity:1;transform:translateY(0)}}
  @keyframes nameIn{to{opacity:1;transform:translateY(0) scale(1)}}

  /* Subtle HUD lines and scan */
  .hud{position:absolute;inset:0;z-index:20;pointer-events:none}
  .hud .scan{position:absolute;left:0;right:0;top:35%;height:0.6px;background:linear-gradient(90deg,transparent,rgba(255,255,255,0.06),transparent);opacity:0;animation:scanIn 1.2s 2.9s forwards}
  @keyframes scanIn{to{opacity:1}}

  /* Small caption */
  .caption{position:absolute;bottom:calc(var(--imax-letterbox) + 2vh);left:50%;transform:translateX(-50%);z-index:30;font-size:12px;color:rgba(200,220,255,0.6);letter-spacing:1px}

  /* Tiny cinematic bloom */
  .bloom{position:absolute;inset:0;z-index:5;pointer-events:none;border-radius:50%;mix-blend-mode:screen;opacity:0.28;background:radial-gradient(circle at 50% 40%, rgba(255,200,100,0.03), transparent 10%)}

  /* Responsive tweaks */
  @media (max-aspect-ratio: 3/4){:root{--imax-letterbox:9vh}}

  /* Small UI helper (click to replay) */
  .ui{position:fixed;right:18px;bottom:18px;z-index:120}
  .btn{background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.06);padding:8px 12px;border-radius:8px;color:#cfe8ff;font-size:13px;backdrop-filter: blur(6px);cursor:pointer}
</style>
</head>
<body>
  <div class="stage" id="stage">
    <div class="cosmic" id="cosmic"></div>
    <div class="nebula"></div>
    <div class="stars"></div>
    <div class="flare"></div>
    <div class="bloom"></div>

    <div class="shield-wrap" id="shieldWrap" aria-hidden="true">
      <!-- Captain-style shield built with SVG (original design, not traced from any official asset) -->
      <svg class="shield-svg" viewBox="0 0 200 200" id="shieldSVG" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <radialGradient id="metalGrad" cx="50%" cy="30%" r="70%">
            <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9"/>
            <stop offset="35%" stop-color="#e6eefc" stop-opacity="0.85"/>
            <stop offset="100%" stop-color="#b8c5d9" stop-opacity="1"/>
          </radialGradient>
          <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
            <feGaussianBlur stdDeviation="2.2" result="blur"/>
            <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
          </filter>
        </defs>

        <!-- Outer rings -->
        <g id="rings" transform="translate(100,100)">
          <circle r="92" fill="#0b2340" />
          <circle r="76" fill="#d33a3a" />
          <circle r="56" fill="#ffffff" />
          <circle r="36" fill="#2b5ea6" />
        </g>

        <!-- central star -->
        <g id="starGroup" transform="translate(100,100) scale(0.9)" opacity="0">
          <polygon class="star-core" points="0,-28 6,-8 26,-6 10,6 14,26 0,14 -14,26 -10,6 -26,-6 -6,-8" fill="#fff" filter="url(#glow)"/>
        </g>

        <!-- metallic sheen mask -->
        <g id="sheenGroup" transform="translate(100,100)">
          <circle r="92" fill="none"/>
        </g>
      </svg>
      <div class="sheen" aria-hidden="true"></div>
    </div>

    <!-- HUD / scan lines -->
    <div class="hud">
      <div class="scan"></div>
    </div>

    <!-- Title area -->
    <div class="title">
      <div class="greeting">Happy Birthday</div>
      <div class="name" id="nameText">NAME</div>
    </div>

    <div class="caption">An IMAX • Nolan-grade cosmic tribute</div>

    <div class="grain"></div>
    <div class="letterbox-top"></div>
    <div class="letterbox-bottom"></div>

    <div class="ui">
      <button class="btn" id="replayBtn">Replay</button>
    </div>
  </div>

<script>
  (function(){
    // Elements
    const shieldSVG = document.getElementById('shieldSVG');
    const starGroup = document.getElementById('starGroup');
    const shieldWrap = document.getElementById('shieldWrap');
    const stage = document.getElementById('stage');
    const nameText = document.getElementById('nameText');
    const replayBtn = document.getElementById('replayBtn');

    // USER-FRIENDLY: If your real name is known, replace here. Otherwise leave as NAME.
    // We'll not ask — attempt to detect if the surrounding page has a title that looks like a name (best-effort)
    try {
      const guess = document.title.match(/[A-Z][a-z]{2,}/g);
      if(guess && guess.length) nameText.textContent = guess[0];
    } catch(e){}

    // Animation sequence controller
    function runSequence(){
      // reset
      starGroup.style.opacity = 0;
      shieldSVG.style.transform = 'scale(.3) translateY(18vh) rotate(-10deg)';
      shieldSVG.classList.remove('shield-enter');
      void shieldSVG.offsetWidth;

      // cinematic slow zoom of background
      stage.animate([{transform:'scale(1)'},{transform:'scale(1.04)'}],{duration:7500,fill:'forwards',easing:'linear'});

      // reveal shield
      setTimeout(()=>{
        shieldSVG.classList.add('shield-enter');
      },200);

      // star appear and pulse timed with shield
      setTimeout(()=>{ starGroup.style.transition='opacity .35s ease-out'; starGroup.style.opacity=1; starGroup.querySelector('.star-core').style.opacity=1; }, 1700);

      // sheen sweep intensity
      const sheen = document.querySelector('.sheen:before');

      // name/title reveal handled by CSS delays — but we can nudge subtle letter spacing
      const nameEl = nameText;
      nameEl.style.letterSpacing = '0.18em';
      nameEl.animate([{letterSpacing:'0.6em'},{letterSpacing:'0.02em'}],{duration:1200,delay:3800,easing:'cubic-bezier(.2,.9,.2,1)',fill:'forwards'});

      // small camera rumble
      setTimeout(()=>{
        stage.animate([{transform:'translateY(0)'},{transform:'translateY(-6px)'},{transform:'translateY(0)'}],{duration:900,iterations:1,easing:'cubic-bezier(.2,.9,.2,1)'});
      },2600);
    }

    // Make the SVG star scale pulse using CSS class already present
    // Add event for replay
    replayBtn.addEventListener('click', ()=>{ runSequence(); });

    // initial run
    window.addEventListener('load', ()=>{ runSequence(); });

    // Accessibility: allow changing name by double-clicking the title
    nameText.addEventListener('dblclick', ()=>{
      const newName = prompt('Enter name to appear in the video (will not be saved):', nameText.textContent || 'NAME');
      if(newName) nameText.textContent = newName.trim().slice(0,30);
    });

    // subtle parallax on mouse move for cinematic depth
    stage.addEventListener('mousemove',(e)=>{
      const rect = stage.getBoundingClientRect();
      const dx = (e.clientX - rect.left) / rect.width - 0.5;
      const dy = (e.clientY - rect.top) / rect.height - 0.5;
      const t = `translate3d(${dx*6}px,${dy*6}px,0) scale(1.002)`;
      shieldWrap.style.transform = t;
    });
    stage.addEventListener('mouseleave',()=>{ shieldWrap.style.transform = 'translateZ(0)'; });

    // Offer keyboard replay (space)
    window.addEventListener('keydown',(e)=>{ if(e.code==='Space'){ e.preventDefault(); runSequence(); } });
  })();
</script>
</body>
</html>
