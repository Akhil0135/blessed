<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Realistic Animated Night Sky</title>
<style>
  body, html {
    margin: 0;
    padding: 0;
    overflow: hidden;
    width: 100%;
    height: 100%;
    background: linear-gradient(to top, #0b0c2a, #1a1a3b); /* dark night sky */
  }

  .star {
    position: absolute;
    width: 2px;
    height: 2px;
    background: white;
    border-radius: 50%;
    opacity: 0.8;
    animation: twinkle 2s infinite alternate;
  }

  @keyframes twinkle {
    0% { opacity: 0.3; transform: scale(1); }
    50% { opacity: 1; transform: scale(1.5); }
    100% { opacity: 0.3; transform: scale(1); }
  }

  .moon {
    position: absolute;
    width: 100px;
    height: 100px;
    background: radial-gradient(circle, #fefbd8 0%, #f5e7a0 70%, #e0c97f 100%);
    border-radius: 50%;
    top: 50px;
    left: -150px;
    box-shadow: 0 0 20px 5px #fffacd;
    animation: moveMoon 60s linear infinite;
  }

  @keyframes moveMoon {
    0% { left: -150px; top: 50px; }
    50% { left: 50%; top: 100px; }
    100% { left: 100%; top: 50px; }
  }

  /* Realistic morphing clouds */
  .cloud {
    position: absolute;
    width: 250px;
    height: 100px;
    background: rgba(255, 255, 255, 0.05);
    border-radius: 50%;
    filter: blur(20px);
    animation: moveCloud linear infinite, morphCloud ease-in-out infinite alternate;
  }

  .cloud::before,
  .cloud::after {
    content: '';
    position: absolute;
    background: rgba(255, 255, 255, 0.05);
    width: 150px;
    height: 80px;
    border-radius: 50%;
    filter: blur(20px);
  }

  .cloud::before {
    top: -30px;
    left: 50px;
  }

  .cloud::after {
    top: 20px;
    left: 100px;
  }

  @keyframes moveCloud {
    0% { left: -300px; }
    100% { left: 100%; }
  }

  @keyframes morphCloud {
    0% { transform: scale(1,1); }
    50% { transform: scale(1.1, 0.9); }
    100% { transform: scale(1,1); }
  }

  /* Shooting stars with tip pointing along motion */
  .shooting-star {
    position: absolute;
    width: 2px;
    height: 80px;
    background: linear-gradient(to top left, white, rgba(255,255,255,0)); /* tip points along motion */
    transform-origin: top left;
    opacity: 0;
    animation: shoot 2s linear forwards;
  }

  @keyframes shoot {
    0% { transform: translate(0,0) rotate(-45deg); opacity: 1; }
    100% { transform: translate(-100vw, 100vh) rotate(-45deg); opacity: 0; }
  }
</style>
</head>
<body>

<div class="moon"></div>

<script>
  // Generate stars
  const starCount = 150;
  for(let i = 0; i < starCount; i++){
    const star = document.createElement('div');
    star.classList.add('star');
    star.style.top = Math.random() * window.innerHeight + 'px';
    star.style.left = Math.random() * window.innerWidth + 'px';
    star.style.width = star.style.height = Math.random() * 3 + 1 + 'px';
    document.body.appendChild(star);
  }

  // Generate morphing clouds
  const cloudCount = 5;
  for(let i = 0; i < cloudCount; i++){
    const cloud = document.createElement('div');
    cloud.classList.add('cloud');
    cloud.style.top = Math.random() * 300 + 'px';
    cloud.style.animationDuration = (30 + Math.random() * 40) + 's, ' + (6 + Math.random() * 4) + 's';
    document.body.appendChild(cloud);
  }

  // Shooting stars top-right to bottom-left with tip pointing correctly
  function createShootingStar() {
    const star = document.createElement('div');
    star.classList.add('shooting-star');
    star.style.top = Math.random() * 200 + 'px';
    star.style.left = window.innerWidth + 'px';
    const duration = 1 + Math.random() * 1.5;
    star.style.animationDuration = duration + 's';
    document.body.appendChild(star);
    setTimeout(() => { star.remove(); }, duration * 1000);
  }

  setInterval(createShootingStar, 4000);
</script>

</body>
</html>
