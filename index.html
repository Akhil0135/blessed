<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Phase 4 — Happy Birthday PRINCE</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    overflow: hidden;
    background: #000;
    font-family: sans-serif;
  }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script src="https://cdn.jsdelivr.net/npm/three@0.158.0/build/three.min.js"></script>
<script>
const canvas = document.getElementById("c");

// Scene
const scene = new THREE.Scene();

// Camera
const camera = new THREE.PerspectiveCamera(45, window.innerWidth/window.innerHeight, 0.1, 1000);
camera.position.set(0, 5, 20);

// Renderer
const renderer = new THREE.WebGLRenderer({canvas, antialias:true});
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(window.devicePixelRatio);

// Ambient Light
const ambient = new THREE.AmbientLight(0xffffff, 0.5);
scene.add(ambient);

// Spot Light
const spot = new THREE.SpotLight(0xffddaa, 1.2);
spot.position.set(15, 20, 15);
spot.castShadow = true;
scene.add(spot);

// Text
const loader = new THREE.FontLoader();
loader.load('https://threejs.org/examples/fonts/helvetiker_bold.typeface.json', function(font){
  const textGeo = new THREE.TextGeometry("HAPPY BIRTHDAY PRINCE", {
    font: font,
    size: 2,
    height: 0.8,
    curveSegments: 12,
    bevelEnabled: true,
    bevelThickness: 0.2,
    bevelSize: 0.1,
    bevelOffset: 0,
    bevelSegments: 5
  });

  const textMat = new THREE.MeshStandardMaterial({color: 0xffcc00, metalness: 0.8, roughness: 0.2});
  const textMesh = new THREE.Mesh(textGeo, textMat);
  textGeo.center(); // center the text
  scene.add(textMesh);

  // Animate camera around text
  const clock = new THREE.Clock();
  function animate() {
    const t = clock.getElapsedTime();
    camera.position.x = Math.sin(t*0.3) * 20;
    camera.position.z = Math.cos(t*0.3) * 20;
    camera.lookAt(0,0,0);

    // Slight floating rotation
    textMesh.rotation.y = t * 0.2;

    renderer.render(scene, camera);
    requestAnimationFrame(animate);
  }
  animate();
});

// Star Particles
const particleCount = 500;
const particles = new THREE.BufferGeometry();
const positions = new Float32Array(particleCount * 3);
for(let i=0;i<particleCount;i++){
  positions[i*3] = (Math.random()-0.5)*100;
  positions[i*3+1] = (Math.random()-0.5)*50;
  positions[i*3+2] = (Math.random()-0.5)*100;
}
particles.setAttribute('position', new THREE.BufferAttribute(positions,3));
const pMaterial = new THREE.PointsMaterial({color:0xffffff, size:0.5});
const pointCloud = new THREE.Points(particles, pMaterial);
scene.add(pointCloud);

window.addEventListener('resize', ()=>{
  camera.aspect = window.innerWidth/window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});
</script>
</body>
</html>
