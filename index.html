<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Cinematic Birthday Experience</title>
<style>
  body {
    margin: 0;
    height: 100vh;
    overflow: hidden;
    display: flex;
    justify-content: center;
    align-items: center;
    background: radial-gradient(circle at top, #001f3f, #000814 70%);
    position: relative;
  }

  /* Camera drift */
  body {
    animation: camMove 18s ease-in-out infinite alternate;
  }
  @keyframes camMove {
    from { transform: scale(1) translateY(0); }
    to { transform: scale(1.05) translateY(-12px); }
  }

  /* Light Rays */
  .rays {
    position: absolute;
    top: -20%;
    width: 200%;
    height: 200%;
    background: conic-gradient(
      rgba(255,255,255,0.12),
      rgba(255,255,255,0.02),
      rgba(255,255,255,0.15),
      transparent 70%
    );
    filter: blur(80px);
    animation: rayRotate 35s linear infinite;
  }
  @keyframes rayRotate {
    from { transform: rotate(0deg); }
    to { transform: rotate(360deg); }
  }

  /* Cross */
  .cross {
    position: absolute;
    top: 40px;
    width: 60px;
    height: 160px;
    background: gold;
    filter: drop-shadow(0 0 12px rgba(255,215,0,0.8));
    animation: crossGlow 4s ease-in-out infinite alternate;
  }
  .cross::before {
    content: '';
    position: absolute;
    top: 45px;
    left: -50px;
    width: 160px;
    height: 40px;
    background: gold;
  }
  @keyframes crossGlow {
    from { filter: drop-shadow(0 0 6px rgba(255,215,0,0.5)); }
    to { filter: drop-shadow(0 0 18px rgba(255,215,0,1)); }
  }

  /* Cinematic Particles */
  .particle {
    position: absolute;
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: rgba(255,255,255,0.6);
    animation: floatUp 10s linear infinite;
    filter: blur(2px);
  }
  @keyframes floatUp {
    from { transform: translateY(0); opacity: 0.9; }
    to { transform: translateY(-120vh); opacity: 0; }
  }

  /* Balloons */
  .balloon {
    position: absolute;
    bottom: -200px;
    width: 55px;
    height: 75px;
    border-radius: 50% 50% 45% 45%;
    animation: rise 7s linear infinite;
    filter: drop-shadow(0 5px 5px rgba(0,0,0,0.5));
  }
  @keyframes rise {
    0% { transform: translateY(0) rotate(0deg); }
    50% { transform: translateY(-60vh) rotate(4deg); }
    100% { transform: translateY(-120vh) rotate(-4deg); }
  }

  /* Confetti */
  .confetti {
    position: absolute;
    width: 10px;
    height: 14px;
    animation: fall 3.5s linear forwards;
    opacity: 0.9;
  }
  @keyframes fall {
    from { transform: translateY(-50px) rotate(0deg); }
    to { transform: translateY(120vh) rotate(360deg); }
  }

  /* SUN */
  .sun {
    position: absolute;
    top: 100px;
    right: 100px;
    width: 130px;
    height: 130px;
    border-radius: 50%;
    background: radial-gradient(circle, #ffe066, #ffcd00, #ffb700);
    box-shadow: 0 0 40px 15px rgba(255,200,0,0.8);
    opacity: 0;
    transition: opacity 2s ease-in-out;
  }

  /* Cinematic Text */
  #birthdayText {
    position: absolute;
    top: 50%;
    transform: translateY(-50%);
    font-size: 70px;
    font-family: "Brush Script MT", cursive;
    display: flex;
    gap: 5px;
    color: red;
    text-shadow: 0 0 12px rgba(255,0,0,0.6);
  }
  .letter {
    opacity: 0;
    transform: scale(0.2) rotate(-15deg);
    transition: 0.4s ease;
  }
  .letter.show {
    opacity: 1;
    transform: scale(1) rotate(0deg);
  }
</style>
</head>
<body>

<div class="rays"></div>
<div class="cross"></div>
<div class="sun" id="sun"></div>
<div id="birthdayText"></div>

<script>
// Cinematic text
function startText() {
  const container = document.getElementById("birthdayText");
  container.innerHTML = "";

  const text = "HAPPY BIRTHDAY";

  for (let i = 0; i < text.length; i++) {
    const span = document.createElement("span");
    span.textContent = text[i];
    span.classList.add("letter");

    if (i === 5) span.style.marginRight = "30px";

    container.appendChild(span);
  }

  const letters = document.querySelectorAll(".letter");
  letters.forEach((l, index) => {
    setTimeout(() => {
      l.classList.add("show");
    }, index * 100);
  });
}

// Particles
function createParticles() {
  setInterval(() => {
    const p = document.createElement("div");
    p.classList.add("particle");
    p.style.left = Math.random() * window.innerWidth + "px";
    p.style.animationDuration = (8 + Math.random() * 4) + "s";
    document.body.appendChild(p);
    setTimeout(() => p.remove(), 12000);
  }, 250);
}

// Balloons
function createBalloons() {
  setInterval(() => {
    const balloon = document.createElement("div");
    balloon.classList.add("balloon");
    const colors = ["#ff4d4d", "#ffcc00", "#66ccff", "#ff99ff", "#33ff77"];
    balloon.style.background = colors[Math.floor(Math.random() * colors.length)];
    balloon.style.left = Math.random() * window.innerWidth + "px";
    document.body.appendChild(balloon);
    setTimeout(() => balloon.remove(), 9000);
  }, 500);
}

// Confetti Burst
function confettiExplosion() {
  for (let i = 0; i < 150; i++) {
    const conf = document.createElement("div");
    conf.classList.add("confetti");
    const colors = ["red", "yellow", "blue", "green", "purple", "orange"]; 
    conf.style.background = colors[Math.floor(Math.random() * colors.length)];
    conf.style.left = Math.random() * window.innerWidth + "px";
    document.body.appendChild(conf);
    setTimeout(() => conf.remove(), 4000);
  }
}

// Sun appears
function showSun() {
  document.getElementById("sun").style.opacity = 1;
}

// Start cinematic sequence
setTimeout(startText, 800);
setTimeout(createParticles, 1000);
setTimeout(createBalloons, 1500);
setTimeout(confettiExplosion, 2000);
setTimeout(showSun, 3000);

</script>
</body>
</html>
