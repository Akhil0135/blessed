<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>IMAX – HAPPY BIRTHDAY PRINCE</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  body { margin:0; overflow:hidden; background:#000; }
  canvas { display:block; }
</style>
</head>
<body>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/examples/js/loaders/FontLoader.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/examples/js/geometries/TextGeometry.js"></script>

<script>
// ---------------- Scene + Camera ----------------
let scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x000000, 0.0012);

let camera = new THREE.PerspectiveCamera(60, window.innerWidth/window.innerHeight, 0.1, 3000);
camera.position.set(0, 50, 400);

let renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(window.devicePixelRatio);
document.body.appendChild(renderer.domElement);

// ---------------- Stars ----------------
let starGeo = new THREE.BufferGeometry();
let starCount = 2500;
let starArr = new Float32Array(starCount * 3);
for(let i=0;i<starCount*3;i++){
    starArr[i] = (Math.random() - 0.5) * 3000;
}
starGeo.setAttribute("position", new THREE.BufferAttribute(starArr, 3));

let starMat = new THREE.PointsMaterial({ color:0xffffff, size:2.2 });
let stars = new THREE.Points(starGeo, starMat);
scene.add(stars);

let starVel = new Float32Array(starCount);
for(let i=0;i<starCount;i++){ starVel[i] = Math.random()*0.02 + 0.01; }

// ---------------- Lights ----------------
let ambient = new THREE.AmbientLight(0x666666, 0.5);
scene.add(ambient);

let keyLight = new THREE.PointLight(0x99ccff, 2, 2000);
keyLight.position.set(180, 200, 140);
scene.add(keyLight);

let warmLight = new THREE.PointLight(0xffddaa, 1.8, 2000);
warmLight.position.set(-120, 160, -80);
scene.add(warmLight);

// ---------------- Glowing Nebula Shader ----------------
const nebulaMat = new THREE.ShaderMaterial({
    uniforms: { time:{ value:0 } },
    vertexShader: `
      varying vec2 vUv;
      void main(){
          vUv = uv;
          gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0);
      }
    `,
    fragmentShader: `
      varying vec2 vUv;
      uniform float time;
      float hash(vec2 p){ return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5453123);}
      float noise(vec2 p){
          vec2 i=floor(p);
          vec2 f=fract(p);
          float a=hash(i);
          float b=hash(i+vec2(1.0,0.0));
          float c=hash(i+vec2(0.0,1.0));
          float d=hash(i+vec2(1.0,1.0));
          vec2 u=f*f*(3.0-2.0*f);
          return mix(a,b,u.x)+(c-a)*u.y*(1.0-u.x)+(d-b)*u.x*u.y;
      }
      void main(){
          float t = time*0.3;
          float n = noise(vUv*10.0 + vec2(t*0.5,-t*0.3));
          float glow = smoothstep(0.2,0.7,n);
          vec3 col = vec3(0.3 + glow*0.7, 0.2 + glow*0.5, 0.6 + glow*0.9);
          gl_FragColor = vec4(col,1.0);
      }
    `,
    metalness: 1,
    roughness: 0.25,
    transparent: true
});

// ---------------- Text ----------------
let princeLetters = [];
let birthdayMesh=null, oneMesh=null;
const princeText = "PRINCE";
let loadedFont=null;

// ---------------- Load Font ----------------
new THREE.FontLoader().load(
    "https://threejs.org/examples/fonts/helvetiker_bold.typeface.json",
    font => {
        loadedFont = font;

        // Background "1" behind HAPPY BIRTHDAY
        let oneGeo = new THREE.TextGeometry("1",{
            font: font,
            size: 120,
            height: 10,
            bevelEnabled:true,
            bevelThickness:5,
            bevelSize:3
        });
        oneGeo.center();
        let oneMat = new THREE.MeshStandardMaterial({
            color:0x3399ff,
            emissive:0x112244,
            metalness:0.5,
            roughness:0.6
        });
        oneMesh = new THREE.Mesh(oneGeo, oneMat);
        oneMesh.position.y = 180;
        oneMesh.position.z = -50;
        scene.add(oneMesh);

        // HAPPY BIRTHDAY
        let birthdayGeo = new THREE.TextGeometry("HAPPY BIRTHDAY",{
            font: font,
            size: 36,
            height: 6,
            bevelEnabled:true,
            bevelThickness:3,
            bevelSize:1.5
        });
        birthdayGeo.center();
        let birthdayMat = new THREE.MeshStandardMaterial({
            color:0xffd98c,
            emissive:0xffaa33,
            metalness:0.8,
            roughness:0.35
        });
        birthdayMesh = new THREE.Mesh(birthdayGeo, birthdayMat);
        birthdayMesh.position.y = 180; 
        scene.add(birthdayMesh);

        // Initialize PRINCE letters (start far back)
        createPrinceLetters();
        setTimeout(revealNextLetter, 1000); // start reveal after 1s
    }
);

// ---------------- Create individual letters with proper spacing ----------------
function createPrinceLetters(){
    const total = princeText.length;
    const size = 180;
    const height = 12;
    const spacing = size * 0.9; // Increased spacing
    const totalWidth = (total-1)*spacing;
    const xOffset = -totalWidth/2;
    for(let i=0;i<total;i++){
        let geo = new THREE.TextGeometry(princeText[i],{
            font: loadedFont,
            size: size,
            height: height,
            bevelEnabled:true,
            bevelThickness:5,
            bevelSize:3
        });
        geo.center();
        let mesh = new THREE.Mesh(geo, nebulaMat);
        mesh.position.y = 0;
        mesh.position.x = xOffset + i*spacing;
        mesh.position.z = -600; // start far back
        mesh.scale.set(0.1,0.1,0.1); // start small
        mesh.rotation.x = (Math.random()-0.5)*0.3; // small random tilt
        mesh.rotation.y = (Math.random()-0.5)*0.3;
        mesh.material.opacity = 0; // start invisible
        mesh.visible = false;
        scene.add(mesh);
        princeLetters.push(mesh);
    }
}

// ---------------- Animate letters coming forward with fade and tilt ----------------
let currentLetter = 0;
function revealNextLetter(){
    if(currentLetter < princeLetters.length){
        let mesh = princeLetters[currentLetter];
        mesh.visible = true;
        let finalZ = 0;
        let finalScale = 1;
        let duration = 120; // frames
        let frame = 0;

        function animateLetter(){
            if(frame <= duration){
                let t = frame/duration;
                mesh.position.z = -600*(1-t) + finalZ*t;
                mesh.scale.set(0.1 + 0.9*t, 0.1 + 0.9*t, 0.1 + 0.9*t);
                mesh.material.opacity = t;
                // Reduce tilt as it moves forward
                mesh.rotation.x *= (1-t);
                mesh.rotation.y *= (1-t);
                frame++;
                requestAnimationFrame(animateLetter);
            }
        }
        animateLetter();

        currentLetter++;
        setTimeout(revealNextLetter, 500);
    }
}

// ---------------- Camera Orbit + Animate ----------------
let angle=0;
function animate(){
    requestAnimationFrame(animate);

    stars.rotation.y += 0.0005;

    let positions = stars.geometry.attributes.position.array;
    for(let i=0;i<starCount;i++){
        positions[i*3+2] += Math.sin(Date.now()*0.001 + i)*0.01*starVel[i];
    }
    stars.geometry.attributes.position.needsUpdate = true;

    angle += 0.0012;
    camera.position.x = Math.sin(angle)*400;
    camera.position.z = Math.cos(angle)*400;
    camera.lookAt(0,50,0);

    nebulaMat.uniforms.time.value += 0.03;

    if(birthdayMesh){
        let glow = 0.5 + 0.5*Math.sin(Date.now()*0.002);
        birthdayMesh.material.emissiveIntensity = glow;
        birthdayMesh.material.emissive.setHex(0xffaa33);
    }

    renderer.render(scene,camera);
}
animate();

window.addEventListener("resize",()=>{
    camera.aspect = window.innerWidth/window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
});
</script>

</body>
</html>
