<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>IMAX Cinematic Full</title>

<style>
html, body {
    margin: 0;
    padding: 0;
    overflow: hidden;
    background: #000;
}
canvas { display: block; }

/* ---------------- STAGE 1 ---------------- */
#stage1, #stage2, #stage3, #stage4 {
    position:absolute;
    width:100%;
    height:100%;
    top:0;
    left:0;
}

#stage1 #instruction,
#stage2 #instruction {
    position:absolute;
    top:20px;
    width:100%;
    text-align:center;
    font-size:22px;
    color:#fff;
    z-index:5;
}

#stage1 #message {
    position:absolute;
    bottom:80px;
    width:100%;
    text-align:center;
    font-size:26px;
    color:#ffd27f;
    opacity:0;
    transition:opacity 1.5s;
}

#moon {
    position:absolute;
    width:200px;
    height:200px;
    border-radius:50%;
    background:radial-gradient(circle,#ddd,#555);
    left:40px;
    top:40px;
    cursor:grab;
}

#sun {
    position:absolute;
    width:260px;
    height:260px;
    border-radius:50%;
    background:radial-gradient(circle,#fff,#ffb300,#000);
    box-shadow:0 0 60px #ffb300;
    top:-300px;
    right:-300px;
    opacity:0;
    transition:all 2.5s ease;
}

#stage3 #clickBtn {
    position:absolute;
    bottom:40px;
    left:50%;
    transform:translateX(-50%);
    padding:15px 30px;
    font-size:20px;
    font-weight:bold;
    background:linear-gradient(90deg,#ff0066,#ffcc00,#00ccff);
    border:none;
    border-radius:10px;
    color:#fff;
    cursor:pointer;
    opacity:0;
    transition:opacity 1s;
}
</style>

<!-- THREE.JS -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/examples/js/loaders/FontLoader.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/examples/js/geometries/TextGeometry.js"></script>
</head>

<body>

<!-- ================= STAGE 1 ================= -->
<div id="stage1">
    <div id="instruction">Drag the moon</div>
    <canvas id="stars"></canvas>
    <div id="moon"></div>
    <div id="sun"></div>
    <div id="message">ON THIS CALM BIRTHDAY EVE GOD SOFTLY WHISPERS</div>
</div>

<!-- ================= STAGE 2 ================= -->
<div id="stage2" style="display:none">
    <div id="instruction">Click the center star</div>
    <canvas id="shieldCanvas"></canvas>
    <div id="verse"
         style="position:absolute;top:40px;left:50%;transform:translateX(-50%) scale(0.2);
                font-size:32px;color:#ffe9a6;opacity:0;transition:1s">
        He counts the stars — Psalm 147:4
    </div>
</div>

<!-- ================= STAGE 3 ================= -->
<div id="stage3" style="display:none">
    <canvas id="c"></canvas>
    <button id="clickBtn">Click Here</button>
</div>

<!-- ================= STAGE 4 ================= -->
<div id="stage4" style="display:none"></div>

<script>
/* ================= STAGE 1 ================= */
const stage1 = document.getElementById("stage1");
const moon = document.getElementById("moon");
const sun = document.getElementById("sun");
const message = document.getElementById("message");
const starsCanvas = document.getElementById("stars");
const sctx = starsCanvas.getContext("2d");

function resizeStars(){
    starsCanvas.width = innerWidth;
    starsCanvas.height = innerHeight;
}
resizeStars(); window.onresize = resizeStars;

let stars=[];
for(let i=0;i<200;i++){
    stars.push({x:Math.random()*innerWidth,y:Math.random()*innerHeight,r:Math.random()*1.5});
}
function drawStars(){
    sctx.clearRect(0,0,innerWidth,innerHeight);
    stars.forEach(s=>{
        sctx.fillStyle="#fff";
        sctx.beginPath();
        sctx.arc(s.x,s.y,s.r,0,Math.PI*2);
        sctx.fill();
    });
    requestAnimationFrame(drawStars);
}
drawStars();

let dragging=false, reveal=0;
moon.onmousedown=e=>dragging=true;
document.onmouseup=()=>dragging=false;
document.onmousemove=e=>{
    if(!dragging) return;
    moon.style.left=e.clientX+"px";
    moon.style.top=e.clientY+"px";
    message.style.opacity=1;
    message.innerText=message.innerText.substring(0,++reveal);
    if(reveal>=message.innerText.length){
        moon.style.display="none";
        sun.style.opacity=1;
        sun.style.top="40px";
        sun.style.right="40px";
        setTimeout(startStage2,5000);
    }
};

/* ================= STAGE 2 ================= */
const stage2=document.getElementById("stage2");
const shieldCanvas=document.getElementById("shieldCanvas");
const sh=shieldCanvas.getContext("2d");
shieldCanvas.width=innerWidth;
shieldCanvas.height=innerHeight;

function startStage2(){
    stage1.style.display="none";
    stage2.style.display="block";
    animateShield();
}

function animateShield(){
    sh.clearRect(0,0,innerWidth,innerHeight);
    sh.fillStyle="#111";
    sh.fillRect(0,0,innerWidth,innerHeight);
    sh.fillStyle="#fff";
    sh.beginPath();
    sh.arc(innerWidth/2,innerHeight/2,120,0,Math.PI*2);
    sh.fill();
    requestAnimationFrame(animateShield);
}

shieldCanvas.onclick=()=>{
    document.getElementById("verse").style.opacity=1;
    document.getElementById("verse").style.transform="translateX(-50%) scale(1)";
    setTimeout(startStage3,7000);
};

/* ================= STAGE 3 ================= */
const stage3=document.getElementById("stage3");
const c=document.getElementById("c");
const ctx=c.getContext("2d");
const btn=document.getElementById("clickBtn");

function startStage3(){
    stage2.style.display="none";
    stage3.style.display="block";
    c.width=innerWidth; c.height=innerHeight;
    animateText();
    setTimeout(()=>btn.style.opacity=1,3000);
}

let text="PRINCE";
function animateText(){
    ctx.clearRect(0,0,c.width,c.height);
    ctx.fillStyle="#fff";
    ctx.font="bold 120px Arial";
    ctx.textAlign="center";
    ctx.fillText(text,c.width/2,c.height/2);
    requestAnimationFrame(animateText);
}

btn.onclick=()=>{
    btn.style.display="none";
    text="DAIVIK";

    const finalBtn=document.createElement("button");
    finalBtn.innerText="Click Here";
    Object.assign(finalBtn.style,{
        position:"absolute",bottom:"40px",left:"50%",
        transform:"translateX(-50%)",
        padding:"15px 30px",fontSize:"20px",
        background:"linear-gradient(90deg,#ff0066,#ffcc00,#00ccff)",
        color:"#fff",border:"none",borderRadius:"10px",
        cursor:"pointer"
    });
    stage3.appendChild(finalBtn);

    finalBtn.onclick=()=>{
        stage3.style.display="none";
        stage4.style.display="block";
        startStage4();
    };
};

/* ================= STAGE 4 ================= */
function startStage4(){
    const container=document.getElementById("stage4");

    let scene=new THREE.Scene();
    let camera=new THREE.PerspectiveCamera(60,innerWidth/innerHeight,0.1,3000);
    camera.position.set(0,50,400);

    let renderer=new THREE.WebGLRenderer({antialias:true});
    renderer.setSize(innerWidth,innerHeight);
    container.appendChild(renderer.domElement);

    scene.add(new THREE.AmbientLight(0x666666,1));

    new THREE.FontLoader().load(
        "https://threejs.org/examples/fonts/helvetiker_bold.typeface.json",
        font=>{
            let geo=new THREE.TextGeometry("HAPPY BIRTHDAY PRINCE",{
                font,size:40,height:8,bevelEnabled:true
            });
            geo.center();
            let mat=new THREE.MeshStandardMaterial({color:0xffd98c});
            let mesh=new THREE.Mesh(geo,mat);
            scene.add(mesh);
        }
    );

    function anim(){
        requestAnimationFrame(anim);
        renderer.render(scene,camera);
    }
    anim();
}
</script>

</body>
</html>
