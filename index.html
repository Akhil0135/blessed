<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Captain America Shield — Letter Reveal</title>

<style>
    body{
        margin:0;
        height:100vh;
        background: radial-gradient(circle at center, #020203, #000000 70%);
        display:flex;
        justify-content:center;
        align-items:center;
        overflow:hidden;
        font-family: "Cinzel", serif;
    }

    .scene {
        position: relative;
        width: 260px;
        height: 260px;
        cursor: pointer;
    }

    .shield {
        width: 100%;
        height: 100%;
        border-radius: 50%;

        background:
            radial-gradient(circle, #d40000 0%, #b00000 40%, #7a0000 70%),
            radial-gradient(circle, #ffffff 0%, #e6e6e6 60%, #bfbfbf 100%);

        box-shadow: 0 0 40px #ff000033;
        display:flex;
        justify-content:center;
        align-items:center;
        position: relative;
        transition: opacity 0.8s ease-out;
    }

    .star {
        width: 95px;
        height: 95px;
        background: white;
        clip-path: polygon(
            50% 0%,
            61% 35%,
            98% 35%,
            68% 57%,
            79% 91%,
            50% 70%,
            21% 91%,
            32% 57%,
            2% 35%,
            39% 35%
        );
        filter: drop-shadow(0 0 3px #66aaff33); /* reduced glow */
    }

    /* Rotate after click */
    .rotate {
        animation: spin 2.5s linear forwards;
    }
    @keyframes spin {
        from { transform: rotate(0deg) scale(1); }
        to { transform: rotate(720deg) scale(1.1); }
    }

    /* Verse container */
    .verse {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        display: flex;
        gap: 4px;
        opacity: 0;
        pointer-events: none;
    }

    .letter {
        color: #ffffff;
        font-size: 28px;
        opacity: 0;
        transform: scale(0.1);
        text-shadow: 0 0 10px #ffffff33;
        animation: pop 0.6s forwards;
    }

    @keyframes pop {
        0%   { opacity:0; transform: scale(0.1) translateY(20px); }
        70%  { opacity:1; transform: scale(1.3) translateY(0); }
        100% { opacity:1; transform: scale(1); }
    }

    /* Move upward after revealing */
    .float-up {
        animation: floatUp 1.8s ease-out forwards;
    }

    @keyframes floatUp {
        from { top: 50%; }
        to   { top: 12%; }
    }

</style>
</head>
<body>

<div class="scene" onclick="startReveal()">

    <div class="shield" id="shield">
        <div class="star" id="star"></div>
    </div>

    <!-- verse letters inserted by JS -->
    <div class="verse" id="verse"></div>

</div>

<script>
let clicked = false;

function startReveal(){
    if(clicked) return;
    clicked = true;

    const star = document.getElementById("star");
    const shield = document.getElementById("shield");
    const verse = document.getElementById("verse");

    star.classList.add("rotate");

    // Fade shield
    setTimeout(() => {
        shield.style.opacity = 0;
    }, 900);

    // Letter-by-letter reveal
    const text = "THE POWER TO RISE COMES FROM WITHIN.";
    let delay = 0;

    text.split("").forEach(char => {
        const span = document.createElement("span");
        span.className = "letter";
        span.textContent = char === " " ? "\u00A0" : char;
        span.style.animationDelay = delay + "ms";
        verse.appendChild(span);
        delay += 70; // typing speed
    });

    // Show verse container
    setTimeout(() => {
        verse.style.opacity = 1;
    }, 1100);

    // Float to top after letters finish
    setTimeout(() => {
        verse.classList.add("float-up");
    }, 2500);
}
</script>

</body>
</html>
