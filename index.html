<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>IMAX Nolan — Moon → Day → Divine Cross → Birthday</title>

<style>
/* ----------------------------------------------------------
   GLOBAL IMAX / NOLAN AESTHETICS
---------------------------------------------------------- */
html,body{
  margin:0;
  padding:0;
  height:100%;
  overflow:hidden;
  background:#02030c;
  font-family: "Cinzel", serif;
  letter-spacing:0.4px;
  -webkit-font-smoothing:antialiased;
}

/* Soft film grain overlay */
#grain {
  pointer-events:none;
  position:fixed;
  top:0;left:0;right:0;bottom:0;
  background-image:url('data:image/png;base64,iVBORw0…'); /* tiny grain */
  opacity:0.12;
  mix-blend-mode:soft-light;
}

/* ----------------------------------------------------------
   SKY LAYERS – NIGHT → DAWN → DAY
---------------------------------------------------------- */
#sky-gradient {
  position:absolute;
  top:0;left:0;
  width:100%;height:100%;
  background:linear-gradient(to bottom,
    #030617,
    #090b24 40%,
    #0d1133 75%,
    #1e274b 100%
  );
  transition:background 6s ease;
}

/* Volumetric fog */
#fog {
  position:absolute;
  width:100%;height:100%;
  top:0;left:0;
  background:radial-gradient(ellipse at bottom,
    rgba(255,255,255,0.08),
    transparent 70%
  );
  opacity:0.18;
  mix-blend-mode:screen;
  filter:blur(20px);
}

/* ----------------------------------------------------------
   STARS
---------------------------------------------------------- */
#stars {
  position:absolute;
  top:0;left:0;
  width:100%;height:100%;
  pointer-events:none;
}

.star {
  position:absolute;
  width:2px;height:2px;
  background:white;
  border-radius:50%;
  opacity:0.8;
  filter:drop-shadow(0 0 4px #ffffff);
}

/* ----------------------------------------------------------
   MOON
---------------------------------------------------------- */
#moon {
  position:absolute;
  top:18%;
  left:50%;
  width:150px;height:150px;
  border-radius:50%;
  background:radial-gradient(circle,
     #e6e6e6,
     #cfcfcf 45%,
     #9a9a9a 100%
  );
  transform:translateX(-50%) scale(1.06);
  filter:
    drop-shadow(0 0 40px #e6e6e6aa)
    drop-shadow(0 0 80px #cdd6ff66);
  transition:opacity 5s ease, transform 5s ease;
}

/* ----------------------------------------------------------
   SUN (DAWN)
---------------------------------------------------------- */
#sun {
  position:absolute;
  left:50%;
  top:100%;
  width:180px;height:180px;
  border-radius:50%;
  background:radial-gradient(circle,
    #ffefcc,
    #ffd27a 60%,
    #ff9b32 100%
  );
  transform:translateX(-50%) scale(0.1);
  opacity:0;
  filter:
    drop-shadow(0 0 60px #ffb85a)
    drop-shadow(0 0 120px #ff8f3b66)
    drop-shadow(0 0 180px #ff711a44);
  transition:opacity 5s cubic-bezier(.33,.07,.17,1),
             top 8s cubic-bezier(.33,.07,.17,1),
             transform 6s ease;
}

/* ----------------------------------------------------------
   FLOATING PARTICLES – IMAX DUST
---------------------------------------------------------- */
#particles {
  position:absolute;top:0;left:0;
  width:100%;height:100%;
  pointer-events:none;
}
.p {
  position:absolute;
  width:3px;height:3px;
  background:white;
  opacity:0.18;
  border-radius:50%;
  filter:blur(1px);
  animation: drift 12s linear infinite;
}
@keyframes drift {
  from { transform:translateY(0px); }
  to   { transform:translateY(-280px); }
}

/* ----------------------------------------------------------
   REVEAL MESSAGE (CINEMATIC TEXT)
---------------------------------------------------------- */
#msg {
  position:absolute;
  top:58%;
  left:50%;
  transform:translate(-50%,-50%);
  font-size:32px;
  text-align:center;
  color:#ffffffdd;
  width:90%;
  opacity:0;
  transition:opacity 1.6s ease;
}
.letter {
  display:inline-block;
  opacity:0;
  transform:translateY(18px);
  transition:opacity 0.4s ease, transform 0.4s ease;
}

/* ----------------------------------------------------------
   BUTTON
---------------------------------------------------------- */
#clickBtn {
  position:absolute;
  top:72%;
  left:50%;
  transform:translateX(-50%);
  padding:14px 26px;
  font-size:18px;
  border-radius:12px;
  background:#ffffff22;
  color:white;
  border:1px solid #ffffff44;
  backdrop-filter:blur(8px);
  cursor:pointer;
  opacity:0;
  transition:opacity 1.2s ease, transform 1.2s ease;
}
#clickBtn:hover {
  background:#ffffff35;
}

/* ----------------------------------------------------------
   NOLAN CHRISTIAN CROSS — PERFECT PROPORTIONS
---------------------------------------------------------- */
#cross {
  position:absolute;
  top:50%;left:50%;
  width:5px;
  height:200px;
  background:rgba(255,255,255,0.9);
  border-radius:3px;
  transform:translate(-50%, -50%) scale(0.85);
  opacity:0;
  transition:opacity 1.8s ease, transform 1.8s ease;
  filter:
    drop-shadow(0 0 14px rgba(255,255,255,0.65))
    drop-shadow(0 0 34px rgba(255,255,255,0.55))
    brightness(1.3);
}

#cross::before {
  content:"";
  position:absolute;
  left:50%;
  top:38%;               /* correct Christian placement */
  width:100px;
  height:5px;
  background:rgba(255,255,255,0.9);
  border-radius:3px;
  transform:translateX(-50%);
  filter:drop-shadow(0 0 10px rgba(255,255,255,0.6));
}

/* ----------------------------------------------------------
   BIRTHDAY OVERLAY
---------------------------------------------------------- */
#birthdayOverlay {
  position:absolute;
  top:0;left:0;
  width:100%;height:100%;
  background:rgba(0,0,0,0.55);
  opacity:0;
  pointer-events:none;
  transition:opacity 1.6s ease;
}

#happy {
  position:absolute;
  top:50%;left:50%;
  transform:translate(-50%, -50%) scale(0.8);
  opacity:0;
  font-size:52px;
  color:white;
  text-shadow:0 0 18px white;
  letter-spacing:2px;
  transition:opacity 2s ease, transform 2s ease;
}

/* fireworks */
.fw {
  position:absolute;
  width:6px;height:6px;
  background:white;
  border-radius:50%;
  filter:drop-shadow(0 0 8px white);
}
</style>
</head>

<body>

<div id="grain"></div>
<div id="sky-gradient"></div>
<div id="fog"></div>

<div id="stars"></div>
<div id="particles"></div>

<div id="moon"></div>
<div id="sun"></div>

<div id="msg"></div>
<button id="clickBtn">Click Here</button>

<div id="cross"></div>

<div id="birthdayOverlay"></div>
<div id="happy">Happy Birthday</div>

<script>
/* ----------------------------------------------------------
   STAR GENERATION
---------------------------------------------------------- */
const stars = document.getElementById("stars");
for (let i=0;i<180;i++){
  const s=document.createElement("div");
  s.className="star";
  s.style.left=Math.random()*100+"%";
  s.style.top=Math.random()*100+"%";
  s.style.opacity=0.3+Math.random()*0.7;
  stars.appendChild(s);
}

/* ----------------------------------------------------------
   PARTICLES (IMAX dust floating)
---------------------------------------------------------- */
const particles = document.getElementById("particles");
for (let i=0;i<55;i++){
  const p=document.createElement("div");
  p.className="p";
  p.style.left=Math.random()*100+"%";
  p.style.top=Math.random()*100+"%";
  p.style.animationDuration=10+Math.random()*8+"s";
  particles.appendChild(p);
}

/* ----------------------------------------------------------
   TEXT REVEAL MESSAGE
---------------------------------------------------------- */
const msg = document.getElementById("msg");
const message = "Wishing You Light, Peace, and a Beautiful New Beginning.";
message.split("").forEach(ch=>{
  const span=document.createElement("span");
  span.className="letter";
  span.textContent=ch;
  msg.appendChild(span);
});

/* ----------------------------------------------------------
   MAIN TRANSITION (night → sunrise → cross)
---------------------------------------------------------- */
let progress=0;
let started=false;

window.onclick=()=>{
  if(started) return;
  started=true;

  const moon=document.getElementById("moon");
  const sun=document.getElementById("sun");
  const cross=document.getElementById("cross");
  const clickBtn=document.getElementById("clickBtn");

  const letters=document.querySelectorAll(".letter");

  const animate = () => {
    progress+=0.003;
    if(progress>1) progress=1;

    /* moon fade */
    moon.style.opacity = 1-progress;

    /* sun rise */
    sun.style.opacity = progress;
    sun.style.top = (100 - progress*70) +"%";
    sun.style.transform="translateX(-50%) scale("+(0.1 + progress*0.9)+")";

    /* text reveal */
    if(progress>0.35){
      msg.style.opacity=1;
      const show = Math.floor((progress-0.35)*40);
      for(let i=0;i<show && i<letters.length;i++){
        letters[i].style.opacity=1;
        letters[i].style.transform="translateY(0px)";
      }
    }

    /* button appears */
    if(progress>0.78){
      clickBtn.style.opacity=1;
      clickBtn.style.transform="translateX(-50%) scale(1)";
    }

    /* Nolan divine cross emerges */
    if(progress>0.88){
      const t=(progress-0.88)/0.12;
      cross.style.opacity=t;
      cross.style.transform=`translate(-50%,-50%) scale(${0.85 + t*0.2})`;
    }

    if(progress<1) requestAnimationFrame(animate);
  };

  animate();
};

/* ----------------------------------------------------------
   BIRTHDAY MODE
---------------------------------------------------------- */
const clickBtn=document.getElementById("clickBtn");
clickBtn.onclick=()=>{
  clickBtn.style.opacity=0;
  clickBtn.style.pointerEvents="none";

  const overlay=document.getElementById("birthdayOverlay");
  const happy=document.getElementById("happy");
  overlay.style.opacity=1;

  setTimeout(()=>{
    happy.style.opacity=1;
    happy.style.transform="translate(-50%,-50%) scale(1)";
  },600);

  /* fireworks */
  setInterval(spawnFireworks,1100);
}

function spawnFireworks(){
  for(let i=0;i<18;i++){
    const p=document.createElement("div");
    p.className="fw";
    const x=window.innerWidth*(0.2+Math.random()*0.6);
    const y=window.innerHeight*(0.2+Math.random()*0.5);
    p.style.left=x+"px";
    p.style.top=y+"px";
    document.body.appendChild(p);

    const ang=Math.random()*Math.PI*2;
    const dist=80+Math.random()*120;
    const tx=Math.cos(ang)*dist;
    const ty=Math.sin(ang)*dist;

    p.animate([
      {transform:"translate(0,0) scale(1)",opacity:1},
      {transform:`translate(${tx}px,${ty}px) scale(0.4)`,opacity:0}
    ],{duration:1000,easing:"cubic-bezier(.2,.7,.2,1)",fill:"forwards"});

    setTimeout(()=>p.remove(),1500);
  }
}
</script>

</body>
</html>
