<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Captain America Shield — Phase 2</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
    html,body{
        margin:0;
        padding:0;
        overflow:hidden;
        background:#04050a; /* Cinematic dark */
        font-family: "Cinzel", serif;
    }
    canvas{
        display:block;
    }

    /* VERSE LETTER STYLING */
    .verse{
        position:absolute;
        font-size:32px;
        color:#ffd700;
        text-shadow:0 0 18px rgba(255,255,255,0.7);
        opacity:0;
        transform:scale(0.2);
        transition:1s ease-out;
        white-space:nowrap;
    }
</style>

</head>
<body>

<canvas id="c"></canvas>

<script>
const canvas = document.getElementById("c");
const ctx = canvas.getContext("2d");

function resize(){
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
}
resize();
window.onresize = resize;

let angle = 0;             // shield rotation
let starSpin = false;      // when true → star rotates
let starAngle = 0;         // star rotation angle
let shieldX, shieldY, R;

function drawShield(){
    shieldX = canvas.width/2;
    shieldY = canvas.height/2;
    R = Math.min(canvas.width, canvas.height)/3;

    ctx.save();
    ctx.translate(shieldX, shieldY);
    ctx.rotate(angle);

    /* ------- OUTER RED RING ------- */
    const grad1 = ctx.createRadialGradient(0,0,R*0.3,0,0,R);
    grad1.addColorStop(0,"#550000");
    grad1.addColorStop(1,"#8b0000");
    ctx.fillStyle = grad1;
    ctx.beginPath();
    ctx.arc(0,0,R,0,Math.PI*2);
    ctx.fill();

    /* ------- WHITE RING ------- */
    const grad2 = ctx.createRadialGradient(0,0,R*0.3,0,0,R*0.75);
    grad2.addColorStop(0,"#cccccc");
    grad2.addColorStop(1,"#eeeeee");
    ctx.fillStyle = grad2;
    ctx.beginPath();
    ctx.arc(0,0,R*0.75,0,Math.PI*2);
    ctx.fill();

    /* ------- INNER RED RING ------- */
    const grad3 = ctx.createRadialGradient(0,0,R*0.1,0,0,R*0.5);
    grad3.addColorStop(0,"#660000");
    grad3.addColorStop(1,"#990000");
    ctx.fillStyle = grad3;
    ctx.beginPath();
    ctx.arc(0,0,R*0.5,0,Math.PI*2);
    ctx.fill();

    /* ------- BLUE METALLIC CENTER ------- */
    const grad4 = ctx.createRadialGradient(0,0,R*0.1,0,0,R*0.35);
    grad4.addColorStop(0,"#a8bcd4");
    grad4.addColorStop(1,"#00224f");
    ctx.fillStyle = grad4;
    ctx.beginPath();
    ctx.arc(0,0,R*0.35,0,Math.PI*2);
    ctx.fill();

    /* ------- 3D METALLIC STAR ------- */
    ctx.save();
    if(starSpin) ctx.rotate(starAngle);

    const starR = R*0.28;
    ctx.beginPath();
    for(let i=0;i<5;i++){
        let outer = (Math.PI*2/5)*i - Math.PI/2;
        let inner = outer + Math.PI/5;

        ctx.lineTo(Math.cos(outer)*starR, Math.sin(outer)*starR);
        ctx.lineTo(Math.cos(inner)*(starR*0.45), Math.sin(inner)*(starR*0.45));
    }
    ctx.closePath();

    const starGrad = ctx.createRadialGradient(0,0,starR*0.1,0,0,starR);
    starGrad.addColorStop(0,"#ffffff");
    starGrad.addColorStop(0.4,"#dddddd");
    starGrad.addColorStop(1,"#777777");
    ctx.fillStyle = starGrad;
    ctx.shadowColor = "rgba(255,255,255,0.6)";
    ctx.shadowBlur = 15;
    ctx.fill();

    ctx.restore();
    ctx.restore();
}

function animate(){
    ctx.clearRect(0,0,canvas.width,canvas.height);

    drawShield();

    if(starSpin) starAngle += 0.05;

    requestAnimationFrame(animate);
}
animate();

// -------- CLICK HANDLER --------
canvas.addEventListener("click", (e)=>{
    let mx = e.clientX, my = e.clientY;
    let dx = mx - shieldX;
    let dy = my - shieldY;
    let dist = Math.sqrt(dx*dx + dy*dy);

    let starRadius = R*0.28;

    if(dist <= starRadius){
        starSpin = true;
        deliverVerse();
    }
});

// -------- VERSE ZOOM ANIMATION --------
function deliverVerse(){
    const verse = "He counts the stars and calls them each by name — Psalm 147:4";

    const span = document.createElement("div");
    span.className = "verse";
    span.textContent = verse;

    // start at star
    span.style.left = shieldX + "px";
    span.style.top = shieldY + "px";

    document.body.appendChild(span);

    setTimeout(()=>{
        span.style.opacity = 1;
        span.style.transform = "scale(1)";
        span.style.left = (window.innerWidth/2 - span.clientWidth/2) + "px";
        span.style.top = "40px";
    }, 50);
}

</script>
</body>
</html>
