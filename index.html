<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Phase 4 — Galactic PRINCE</title>
<style>
    body,html{
        margin:0;
        padding:0;
        overflow:hidden;
        background:black;
    }
    #scene{
        width:100vw;
        height:100vh;
        display:block;
    }
</style>
</head>
<body>
<canvas id="scene"></canvas>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r152/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.152/examples/js/loaders/FontLoader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.152/examples/js/geometries/TextGeometry.js"></script>

<script>
// ====================================================
// BASIC SETUP
// ====================================================
const canvas = document.getElementById("scene");
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(window.devicePixelRatio);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x000000);

const camera = new THREE.PerspectiveCamera(
    60,
    window.innerWidth / window.innerHeight,
    0.1,
    2000
);
camera.position.set(0, 10, 55);

// ====================================================
// GALAXY STAR FIELD BACKGROUND
// ====================================================
function createStarField() {
    const starGeometry = new THREE.BufferGeometry();
    const starCount = 4000;
    const positions = [];

    for (let i = 0; i < starCount; i++) {
        const x = (Math.random() - 0.5) * 2000;
        const y = (Math.random() - 0.5) * 2000;
        const z = (Math.random() - 0.5) * 2000;
        positions.push(x, y, z);
    }

    starGeometry.setAttribute(
        "position",
        new THREE.Float32BufferAttribute(positions, 3)
    );

    const starMaterial = new THREE.PointsMaterial({
        color: 0xffffff,
        size: 1.2,
    });

    const stars = new THREE.Points(starGeometry, starMaterial);
    scene.add(stars);
}
createStarField();

// ====================================================
// GALACTIC PAINT TEXTURE (NEBULA + STARS)
// ====================================================
function createGalaxyTexture() {
    const canvasTex = document.createElement("canvas");
    canvasTex.width = 1024;
    canvasTex.height = 512;
    const ctx = canvasTex.getContext("2d");

    const grad = ctx.createLinearGradient(0,0,1024,512);
    grad.addColorStop(0, "#ff00ff");
    grad.addColorStop(0.3, "#4b0082");
    grad.addColorStop(0.6, "#0000ff");
    grad.addColorStop(1, "#00ffff");
    ctx.fillStyle = grad;
    ctx.fillRect(0,0,1024,512);

    // Stars inside letters
    for (let i = 0; i < 180; i++) {
        ctx.fillStyle = "white";
        const x = Math.random()*1024;
        const y = Math.random()*512;
        const s = Math.random()*3;
        ctx.fillRect(x, y, s, s);
    }

    const texture = new THREE.CanvasTexture(canvasTex);
    texture.needsUpdate = true;
    return texture;
}

const galaxyTexture = createGalaxyTexture();

// ====================================================
// LOAD TEXT + APPLY GALACTIC MATERIAL
// ====================================================
const loader = new THREE.FontLoader();

loader.load("https://threejs.org/examples/fonts/helvetiker_bold.typeface.json", function(font){

    const textGeo = new THREE.TextGeometry("HAPPY BIRTHDAY PRINCE", {
        font: font,
        size: 6,
        height: 2,
        curveSegments: 8,
        bevelEnabled: true,
        bevelThickness: 0.5,
        bevelSize: 0.3,
        bevelSegments: 3
    });
    textGeo.center();

    const textMaterial = new THREE.MeshStandardMaterial({
        color: 0xffffff,
        map: galaxyTexture,
        emissive: new THREE.Color("#4b0082"),
        emissiveIntensity: 0.5,
        emissiveMap: galaxyTexture,
        metalness: 0.65,
        roughness: 0.25
    });

    const textMesh = new THREE.Mesh(textGeo, textMaterial);
    textMesh.position.y = 0;
    scene.add(textMesh);

    // Soft light
    const light = new THREE.PointLight(0xffffff, 2, 200);
    light.position.set(50,50,50);
    scene.add(light);

});

// ====================================================
// CAMERA ROTATION ANIMATION
// ====================================================
function animate() {
    requestAnimationFrame(animate);

    // Camera rotates around the text
    const t = Date.now() * 0.0003;
    camera.position.x = Math.sin(t) * 55;
    camera.position.z = Math.cos(t) * 55;
    camera.lookAt(0, 0, 0);

    renderer.render(scene, camera);
}
animate();

// ====================================================
// RESIZE HANDLER
// ====================================================
window.addEventListener("resize", ()=>{
    camera.aspect = window.innerWidth/window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
});

</script>
</body>
</html>
