<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Phase 2 — MCU Shield Interactive Cinematic</title>

<style>
html, body {
    margin: 0;
    padding: 0;
    overflow: hidden;
    background: #05050d; /* deeper, cinematic */
}
canvas {
    display: block;
    cursor: pointer;
}
.verse-letter {
    position: absolute;
    font-family: "Cinzel", serif;
    font-size: 30px;
    color: #ffd55a;
    text-shadow: 0 0 12px rgba(255,255,200,0.7);
    opacity: 0;
    transition: all 1s cubic-bezier(0.2, 0.6, 0.2, 1);
}
</style>
</head>
<body>

<canvas id="shieldCanvas"></canvas>

<script>
// ------------------------------------------
const canvas = document.getElementById('shieldCanvas');
const ctx = canvas.getContext('2d');

// Resize
function resize() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
}
resize();
window.onresize = resize;

// ------------------------------------------
// STARS (IMAX deep night texture)
// ------------------------------------------
const stars = [];
for (let i = 0; i < 200; i++) {
    stars.push({
        x: Math.random() * canvas.width,
        y: Math.random() * canvas.height,
        r: Math.random() * 1.8 + 0.3,
        speed: Math.random() * 0.02 + 0.005
    });
}

function drawStars() {
    ctx.fillStyle = "#05050d";
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    stars.forEach(s => {
        const alpha = (Math.sin(Date.now() * s.speed) + 1) * 0.5;
        ctx.fillStyle = `rgba(255,255,255,${alpha})`;
        ctx.beginPath();
        ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
        ctx.fill();
    });
}

// ------------------------------------------
// VARIABLES
// ------------------------------------------
let shieldRadius = 260;
const shieldX = canvas.width / 2;
const shieldY = canvas.height / 2;

let angle = 0;
let breaking = false;
let pieces = [];
let starSpin = false;
let starAngle = 0;

// ------------------------------------------
// DRAW SHIELD — DARKER, CINEMATIC
// ------------------------------------------
function drawShield(x, y, r, rotation) {

    ctx.save();
    ctx.translate(x, y);

    if (!breaking) {
        ctx.rotate(rotation);

        // OUTER RED — deep cinema red
        let g1 = ctx.createRadialGradient(0,0,r*0.6,0,0,r);
        g1.addColorStop(0,"#900000");
        g1.addColorStop(0.5,"#520000");
        g1.addColorStop(1,"#2a0000");
        ctx.fillStyle = g1;
        ctx.beginPath();
        ctx.arc(0,0,r,0,Math.PI*2);
        ctx.fill();

        // INNER WHITE — metal tone
        let g2 = ctx.createRadialGradient(0,0,r*0.5,0,0,r*0.78);
        g2.addColorStop(0,"#cccccc");
        g2.addColorStop(0.4,"#8f8f8f");
        g2.addColorStop(1,"#555555");
        ctx.fillStyle = g2;
        ctx.beginPath();
        ctx.arc(0,0,r*0.8,0,Math.PI*2);
        ctx.fill();

        // INNER RED — darker metal
        let g3 = ctx.createRadialGradient(0,0,r*0.4,0,0,r*0.58);
        g3.addColorStop(0,"#a00000");
        g3.addColorStop(0.4,"#600000");
        g3.addColorStop(1,"#280000");
        ctx.fillStyle = g3;
        ctx.beginPath();
        ctx.arc(0,0,r*0.6,0,Math.PI*2);
        ctx.fill();
    }
    ctx.restore();

    // NAVY BLUE CENTER
    ctx.save();
    ctx.translate(x, y);

    const centerR = r * 0.38;
    let blueG = ctx.createRadialGradient(0,0,centerR*0.05,0,0,centerR);
    blueG.addColorStop(0,"#6b7a9b");
    blueG.addColorStop(0.4,"#00142c");
    blueG.addColorStop(1,"#000514");
    ctx.fillStyle = blueG;
    ctx.beginPath();
    ctx.arc(0,0,centerR,0,Math.PI*2);
    ctx.fill();

    // STAR (3D METALLIC)
    const starR = centerR * 0.92;
    const pts = [];
    for (let i = 0; i < 5; i++) {
        pts.push({
            x: Math.cos((18 + i * 72) * Math.PI/180) * starR,
            y: -Math.sin((18 + i * 72) * Math.PI/180) * starR
        });
        pts.push({
            x: Math.cos((54 + i * 72) * Math.PI/180) * (starR * 0.45),
            y: -Math.sin((54 + i * 72) * Math.PI/180) * (starR * 0.45)
        });
    }

    ctx.save();
    if (starSpin) ctx.rotate(starAngle);

    let metal = ctx.createRadialGradient(0,0,starR*0.1,0,0,starR);
    metal.addColorStop(0,"#ffffff");
    metal.addColorStop(0.25,"#dcdcdc");
    metal.addColorStop(0.5,"#8f8f8f");
    metal.addColorStop(1,"#3c3c3c");

    ctx.fillStyle = metal;
    ctx.shadowColor = "rgba(255,255,255,0.5)";
    ctx.shadowBlur = 18;

    ctx.beginPath();
    ctx.moveTo(pts[0].x, pts[0].y);
    for (let i = 1; i < pts.length; i++) ctx.lineTo(pts[i].x, pts[i].y);
    ctx.closePath();
    ctx.fill();
    ctx.restore();

    ctx.restore();
}

// ------------------------------------------
// SHIELD BREAK
// ------------------------------------------
function createPieces() {
    pieces = [];
    for (let i = 0; i < 55; i++) {
        const ang = Math.random() * Math.PI * 2;
        const dist = Math.random() * shieldRadius;
        pieces.push({
            x: shieldX + Math.cos(ang)*dist,
            y: shieldY + Math.sin(ang)*dist,
            dx: Math.cos(ang) * (Math.random()*4),
            dy: Math.sin(ang) * (Math.random()*4) - 1,
            size: Math.random()*14 + 7,
            opacity: 1
        });
    }
}

// ------------------------------------------
// ANIMATE
// ------------------------------------------
function animate() {
    drawStars();

    if (!breaking) angle += 0.004;

    drawShield(shieldX, shieldY, shieldRadius, angle);

    if (breaking) {
        pieces.forEach(p=>{
            p.x += p.dx;
            p.y += p.dy;
            p.dy += 0.09;
            p.opacity -= 0.012;

            ctx.fillStyle = `rgba(160,0,0,${p.opacity})`;
            ctx.beginPath();
            ctx.arc(p.x,p.y,p.size,0,Math.PI*2);
            ctx.fill();
        });
    }

    if (starSpin) starAngle += 0.05;

    requestAnimationFrame(animate);
}
animate();

// ------------------------------------------
// CLICK TO BREAK + VERSE
// ------------------------------------------
canvas.addEventListener("click", e => {
    const dx = e.clientX - shieldX;
    const dy = e.clientY - shieldY;
    const radius = shieldRadius * 0.38 * 0.92;

    if (Math.sqrt(dx*dx + dy*dy) <= radius) {

        if (!breaking) {
            breaking = true;
            starSpin = true;
            createPieces();

            const verse = "He counts the number of the stars; He gives names to all of them. — Psalm 147:4";

            let font = 30;
            let temp = document.createElement("canvas");
            let tctx = temp.getContext("2d");
            tctx.font = font + "px Cinzel";

            let widths = [];
            let tot = 0;
            for (let i = 0; i < verse.length; i++) {
                const w = tctx.measureText(verse[i]).width;
                widths.push(w);
                tot += w;
            }

            let xPos = canvas.width/2 - tot/2;
            let startX = shieldX;
            let startY = shieldY;
            let topY = 60;

            let delay = 0;
            for (let i = 0; i < verse.length; i++) {
                const span = document.createElement("span");
                span.textContent = verse[i];
                span.className = "verse-letter";
                span.style.left = startX + "px";
                span.style.top = startY + "px";
                span.style.transform = "scale(0.2)";
                document.body.appendChild(span);

                setTimeout(() => {
                    span.style.opacity = 1;
                    span.style.transform = "scale(1)";
                    span.style.left = xPos + "px";
                    span.style.top = topY + "px";
                }, delay);

                delay += 70;
                xPos += widths[i];
            }
        }
    }
});
</script>

</body>
</html>
