<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ultimate Cinematic Night</title>

<style>
  body, html {
    margin:0;
    padding:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:#000008;
    font-family:'Cinzel', serif;
  }

  /* -------- STARS -------- */
  .star {
    position:absolute;
    width:2px;
    height:2px;
    background:#fff;
    border-radius:50%;
    opacity:0.7;
    box-shadow:0 0 8px rgba(255,255,255,1);
    animation:twinkle 3s infinite ease-in-out;
  }
  @keyframes twinkle {
    0% { opacity:0.2; transform:scale(1);}
    50% { opacity:1; transform:scale(1.6);}
    100% { opacity:0.2; transform:scale(1);}
  }

  /* -------- SHOOTING STARS -------- */
  .shooting-star {
    position:absolute;
    width:6px;
    height:2px;
    background:linear-gradient(90deg, rgba(255,255,255,0), #fff);
    border-radius:3px;
    opacity:0;
    transform:rotate(-45deg);
    animation:shoot 1.8s linear forwards;
  }
  @keyframes shoot {
    0% { opacity:1; transform:translate(0,0) rotate(-45deg); }
    100% { opacity:0; transform:translate(-70vw,70vh) rotate(-45deg); }
  }

  /* -------- CINEMATIC CLOUDS -------- */
  .cloud-layer {
    position:absolute;
    top:0; left:0;
    width:100%; height:100%;
    pointer-events:none;
    overflow:hidden;
  }

  .cloud {
    position:absolute;
    width:650px;
    height:300px;
    background:radial-gradient(circle at 40% 40%, rgba(255,255,255,0.28), rgba(255,255,255,0.05) 60%, transparent 100%);
    filter:blur(40px) brightness(1.25);
    opacity:0.45;
    border-radius:50%;
    animation:cloudDrift linear infinite;
  }

  .cloud.xl { width:950px; height:420px; filter:blur(55px); opacity:0.33; }
  .cloud.sm { width:420px; height:200px; filter:blur(30px); opacity:0.55; }

  @keyframes cloudDrift {
    0% { transform:translateX(-900px); }
    100% { transform:translateX(110%); }
  }

  /* -------- MOON -------- */
  .moon {
    position:absolute;
    width:160px;
    height:160px;
    top:90px;
    left:-200px;
    border-radius:50%;
    background:radial-gradient(circle, #fffdf5 0%, #f4e8b6 50%, #d9c387 100%);
    box-shadow:0 0 90px 40px rgba(255,240,210,0.45);
    transition:opacity 2s ease;
  }

  /* -------- MESSAGE -------- */
  #message {
    position:absolute;
    width:100%;
    top:65%;
    text-align:center;
    font-size:30px;
    color:#f5e7d0;
    text-shadow:2px 2px 15px black;
    opacity:0;
  }

  .letter {
    opacity:0;
    display:inline-block;
    animation:letterReveal 0.45s forwards cubic-bezier(.17,.67,.2,1.7);
  }

  @keyframes letterReveal {
    0% { opacity:0; transform:translateY(20px) scale(0.8); }
    100% { opacity:1; transform:translateY(0) scale(1); }
  }

  /* -------- BUTTON -------- */
  #clickBtn {
    position:absolute;
    bottom:12vh;
    left:50%;
    transform:translateX(-50%);
    padding:15px 40px;
    font-size:20px;
    background:rgba(255,255,255,0.1);
    border:1px solid rgba(255,255,255,0.35);
    border-radius:40px;
    color:white;
    opacity:0;
    pointer-events:none;
  }

  #clickBtn.float {
    animation:btnFloat 3s infinite ease-in-out;
    opacity:1;
    pointer-events:auto;
  }

  @keyframes btnFloat {
    0%   { transform:translateX(-50%) translateY(0); }
    50%  { transform:translateX(-50%) translateY(-7px); }
    100% { transform:translateX(-50%) translateY(0); }
  }

</style>
</head>
<body>

<div id="stars"></div>
<div class="cloud-layer" id="cloudLayer"></div>
<div class="moon"></div>
<div id="message"></div>
<button id="clickBtn">Click Here</button>

<script>
/* -------------------- STARS ----------------------- */
for(let i=0;i<180;i++){
  const s=document.createElement('div');
  s.className='star';
  s.style.top=Math.random()*window.innerHeight+'px';
  s.style.left=Math.random()*window.innerWidth+'px';
  document.getElementById('stars').appendChild(s);
}

/* -------------------- SHOOTING STARS ----------------------- */
setInterval(()=>{
  const s=document.createElement('div');
  s.className='shooting-star';
  s.style.top = (50 + Math.random()*200) + 'px';
  s.style.left = window.innerWidth + 'px';
  document.body.appendChild(s);
  setTimeout(()=>s.remove(),1800);
},1200);

/* -------------------- CLOUDS ----------------------- */
function makeCloud(type){
  const c=document.createElement('div');
  c.className='cloud '+type;
  c.style.top = (40 + Math.random()*260) + 'px';
  c.style.animationDuration = (70 + Math.random()*55) + 's';
  document.getElementById('cloudLayer').appendChild(c);
}
for(let i=0;i<6;i++) makeCloud('xl');
for(let i=0;i<4;i++) makeCloud('sm');

/* -------------------- MESSAGE ----------------------- */
function revealMessage(){
  const msg = "On this calm birthday eve so new, God softly whispers, my plans are made for you.";
  const m=document.getElementById("message");
  m.innerHTML="";
  msg.split("").forEach((ch,i)=>{
    const span=document.createElement("span");
    span.className="letter";
    span.textContent = ch===" " ? "\u00A0" : ch;
    span.style.animationDelay = `${i*0.05}s`;
    m.appendChild(span);
  });
  m.style.opacity=1;
}

/* -------------------- MOON MOVEMENT ----------------------- */
const moon=document.querySelector('.moon');
let moonPos=-200;
let messageStarted=false;
const stopPoint = window.innerWidth * 0.78;

const moonInterval = setInterval(()=>{
  if(moonPos < stopPoint){
    moonPos += 4.8;  // CINEMATIC SPEED
    moon.style.left = moonPos + "px";

    if(moonPos > 60 && !messageStarted){
      messageStarted=true;
      revealMessage();
    }
  } 
  else {
    clearInterval(moonInterval);
    clickBtn.classList.add("float");
  }
},16);
</script>

</body>
</html>
