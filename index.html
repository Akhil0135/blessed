<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Phase 2 — Captain America Shield IMAX</title>

<style>
    html, body {
        height: 100%;
        margin: 0;
        overflow: hidden;
        background: radial-gradient(circle at center,#0b0e16,#03040a 70%);
        font-family: "Cinzel", serif;
    }

    /* ---- Cinematic Vignette ---- */
    .vignette {
        position: fixed;
        inset: 0;
        pointer-events: none;
        box-shadow: inset 0 0 250px rgba(0,0,0,0.7);
        z-index: 10;
    }

    /* ---- Shield Container ---- */
    .shield-wrapper {
        position: absolute;
        top: 50%;
        left: 50%;
        width: 420px;
        height: 420px;
        transform: translate(-50%, -50%);
        transition: 0.5s ease-out;
        pointer-events: none;
    }

    /* ---- Shield Base ---- */
    .shield {
        position: absolute;
        width: 100%;
        height: 100%;
        border-radius: 50%;
        background:
            radial-gradient(circle at 30% 30%, rgba(255,255,255,0.5), transparent 60%),
            radial-gradient(circle at center,
                #8b0000 0%, #5e0000 35%,   /* Deep dark glossy red */
                #ffffff 35%, #d0d0d0 50%, /* White metallic ring */
                #8b0000 50%, #4a0000 70%, /* Red ring */
                #0d1b46 70%, #07122e 100% /* Dark glossy navy blue center */
            );
        box-shadow:
            0 0 25px rgba(255,255,255,0.25),
            inset 0 0 40px rgba(0,0,0,0.8);
        transition: opacity 1s ease-in-out;
        pointer-events: none;
    }

    /* ---- Star (3D Metallic Chrome) ---- */
    .star {
        position: absolute;
        top: 50%;
        left: 50%;
        width: 180px;
        height: 180px;
        transform: translate(-50%, -50%);
        pointer-events: auto; /* CLICKABLE */
        fill: url(#chromeGradient);
        filter:
            drop-shadow(0 0 20px rgba(255,255,255,0.55))
            drop-shadow(0 0 10px rgba(255,255,255,0.3));
        transition: 0.4s ease-out;
        cursor: pointer;
    }

    /* Spin animation */
    @keyframes spinStar {
        from { transform: translate(-50%, -50%) rotate(0deg); }
        to   { transform: translate(-50%, -50%) rotate(360deg); }
    }

    /* ---- Explosion Pieces ---- */
    .piece {
        position: absolute;
        width: 50px;
        height: 50px;
        background: rgba(160,160,160,0.3);
        border-radius: 10px;
        opacity: 0;
        pointer-events: none;
    }

    /* ---- Verse ---- */
    #verse {
        position: absolute;
        top: 48%;
        width: 100%;
        text-align: center;
        font-size: 26px;
        letter-spacing: 2px;
        color: #e8e8f8;
        text-shadow: 0 0 12px rgba(255,255,255,0.35);
        opacity: 0;
    }

</style>
</head>

<body>

<div class="vignette"></div>

<div class="shield-wrapper" id="shieldWrapper">
    <div class="shield" id="shield"></div>

    <!-- STAR -->
    <svg class="star" id="star" viewBox="0 0 100 100">
        <defs>
            <linearGradient id="chromeGradient" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" stop-color="#ffffff"/>
                <stop offset="40%" stop-color="#cfd2d4"/>
                <stop offset="70%" stop-color="#9ba0a3"/>
                <stop offset="100%" stop-color="#ffffff"/>
            </linearGradient>
        </defs>
        <polygon points="50,5 61,38 95,38 67,58 78,92 50,72 22,92 33,58 5,38 39,38"/>
    </svg>
</div>

<div id="verse"></div>

<script>
const star = document.getElementById("star");
const shield = document.getElementById("shield");
const verse = document.getElementById("verse");

/* BIBLE VERSE */
const fullText = "God counts the stars and calls them each by name. — Psalm 147:4";

/* Explosion effect */
function explodeShield() {
    for (let i = 0; i < 22; i++) {
        const p = document.createElement("div");
        p.className = "piece";
        document.body.appendChild(p);

        p.style.left = "50%";
        p.style.top = "50%";

        const dx = (Math.random() - 0.5) * 900;
        const dy = (Math.random() - 0.5) * 900;
        const rot = (Math.random() - 0.5) * 720;

        setTimeout(() => {
            p.style.transition = "1.4s ease-out";
            p.style.transform = `translate(${dx}px, ${dy}px) rotate(${rot}deg)`;
            p.style.opacity = 1;
        }, 20);

        setTimeout(() => p.remove(), 2200);
    }

    shield.style.opacity = 0;
}

/* Animate verse from center → top */
function revealVerse() {
    verse.style.opacity = 1;
    let idx = 0;

    const interval = setInterval(() => {
        verse.textContent = fullText.substring(0, idx);
        idx++;

        verse.style.top = (48 - idx * 0.06) + "%";

        if (idx > fullText.length) clearInterval(interval);
    }, 40);
}

/* On STAR CLICK */
star.addEventListener("click", () => {

    star.style.animation = "spinStar 3s linear infinite";

    explodeShield();

    setTimeout(() => revealVerse(), 700);
});
</script>

</body>
</html>
