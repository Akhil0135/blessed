<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Golden Cross Birthday</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Great+Vibes&display=swap');

body {
  margin: 0;
  height: 100vh;
  overflow: hidden;
  position: relative;
  background-color: #001f3f; /* night */
  transition: background 2s ease;
}

/* Proper Christian cross */
.cross {
  position: absolute;
  top: 50px;
  left: 50%;
  transform: translateX(-50%);
  width: 60px; /* horizontal bar width */
  height: 120px; /* vertical bar height */
}

.cross-vert {
  position: absolute;
  top: 0;
  left: 50%;
  transform: translateX(-50%);
  width: 20px;
  height: 120px;
  background-color: gold;
  transition: background-color 1s ease;
  z-index: 2;
}

.cross-hor {
  position: absolute;
  top: 35%; /* slightly above center for Christian cross */
  left: 50%;
  transform: translate(-50%, -50%);
  width: 60px;
  height: 20px;
  background-color: gold;
  transition: background-color 1s ease;
  z-index: 3;
}

/* VIBGYOR animation */
@keyframes vibgyor {
  0% { background-color: violet; }
  14% { background-color: indigo; }
  28% { background-color: blue; }
  42% { background-color: green; }
  57% { background-color: yellow; }
  71% { background-color: orange; }
  85% { background-color: red; }
  100% { background-color: violet; }
}

/* Button */
#clickButton {
  position: absolute;
  top: 200px;
  left: 50%;
  transform: translateX(-50%);
  padding: 10px 25px;
  font-size: 18px;
  background-color: gold;
  color: #001f3f;
  border: none;
  border-radius: 5px;
  cursor: pointer;
  display: none;
  z-index: 10;
}

/* Moon */
.moon {
  position: absolute;
  top: 50px;
  right: 50px;
  width: 120px;
  height: 120px;
  background-color: white;
  border-radius: 50%;
  box-shadow: 0 0 30px rgba(255,255,255,0.5);
  opacity: 0;
  transition: opacity 2s ease;
  z-index: 5;
}

/* Stars */
.stars {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  z-index: 1;
  opacity: 0;
  transition: opacity 2s ease;
}

.star {
  position: absolute;
  background-color: white;
  border-radius: 50%;
  opacity: 0.8;
  animation: twinkle 2s infinite alternate;
}

@keyframes twinkle {
  0% { opacity: 0.2; transform: scale(0.5); }
  50% { opacity: 1; transform: scale(1); }
  100% { opacity: 0.2; transform: scale(0.5); }
}

/* Sun */
.sun {
  position: absolute;
  top: 50px;
  right: 50px;
  width: 120px;
  height: 120px;
  background-color: yellow;
  border-radius: 50%;
  box-shadow: 0 0 50px rgba(255,255,0,0.5);
  opacity: 0;
  transition: opacity 2s ease;
  z-index: 5;
}

/* Happy Birthday text */
#birthdayText {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%) scale(0);
  font-family: 'Great Vibes', cursive;
  font-size: 64px;
  color: #FFD700; /* bright golden */
  text-shadow: 0 0 15px #FFD700, 0 0 30px #FFEC8B;
  opacity: 0;
  z-index: 50; /* above everything */
  transition: opacity 2s ease, transform 2s ease;
}

.show-text {
  opacity: 1;
  transform: translate(-50%, -50%) scale(1);
}
</style>
</head>
<body>

<!-- Cross -->
<div class="cross">
  <div class="cross-vert"></div>
  <div class="cross-hor"></div>
</div>

<button id="clickButton">Click Here</button>

<div class="moon" id="moon"></div>
<div class="stars" id="stars"></div>
<div class="sun" id="sun"></div>
<div id="birthdayText">Happy Birthday</div>

<script>
const button = document.getElementById('clickButton');
const moon = document.getElementById('moon');
const stars = document.getElementById('stars');
const sun = document.getElementById('sun');
const birthdayText = document.getElementById('birthdayText');
const crossVert = document.querySelector('.cross-vert');
const crossHor = document.querySelector('.cross-hor');
let clickCount = 0;

// Show initial button after 3 seconds
setTimeout(() => { button.style.display = 'block'; }, 3000);

// Generate stars
const numStars = 100;
for (let i = 0; i < numStars; i++) {
  const star = document.createElement('div');
  star.className = 'star';
  star.style.top = Math.random() * 100 + '%';
  star.style.left = Math.random() * 100 + '%';
  const size = Math.random() * 4 + 2;
  star.style.width = size + 'px';
  star.style.height = size + 'px';
  star.style.animationDuration = (Math.random() * 3 + 2) + 's';
  stars.appendChild(star);
}

button.addEventListener('click', () => {
  clickCount++;

  if (clickCount === 1) {
    // Night scene
    button.style.display = 'none';
    moon.style.opacity = '1';
    stars.style.opacity = '1';

    setTimeout(() => { button.style.display = 'block'; }, 7000);

  } else if (clickCount === 2) {
    // Day scene
    button.style.display = 'none';
    moon.style.opacity = '0';
    stars.style.opacity = '0';

    sun.style.opacity = '1';
    document.body.style.background = 'linear-gradient(to bottom, #87CEEB, #B0E0E6)';

    // Apply VIBGYOR animation to cross
    crossVert.style.animation = 'vibgyor 14s infinite linear';
    crossHor.style.animation = 'vibgyor 14s infinite linear';

    // Show "Happy Birthday" text after 1s
    setTimeout(() => {
      birthdayText.classList.add('show-text');
    }, 1000);
  }
});
</script>
</body>
</html>
