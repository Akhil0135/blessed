<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>IMAX – FULL CINEMATIC</title>
<style>
  body { margin:0; overflow:hidden; background:#000; }
  canvas { display:block; }
</style>
</head>
<body>

<!-- Stage 1 -->
<div id="stage1">
    <div id="instruction">Drag the moon to the end</div>
    <canvas id="stars"></canvas>
    <div id="ambient"></div>
    <div id="moon"></div>
    <div id="sun"></div>
    <div id="message">ON THIS CALM BIRTHDAY EVE SO NEW, GOD SOFTLY WHISPERS, MY PLANS ARE MADE FOR YOU.</div>
    <audio id="whoosh" src="https://cdn.pixabay.com/download/audio/2021/09/16/audio_4f1c1c9f28.mp3?filename=woosh-14795.mp3"></audio>
</div>

<!-- Stage 2 -->
<div id="stage2">
    <div id="instruction">Click the star at the center of the shield</div>
    <canvas id="shieldCanvas"></canvas>
    <div id="verse">He counts the stars and calls them each by name — Psalm 147:4</div>
</div>

<!-- Stage 3 -->
<div id="stage3">
    <canvas id="c"></canvas>
    <button id="clickBtn">Click Here</button>
</div>

<!-- Stage 4 -->
<div id="stage4" style="display:none;"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/examples/js/loaders/FontLoader.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/examples/js/geometries/TextGeometry.js"></script>

<script>
// ==================== STAGE 1 SCRIPT ====================
const stage1 = document.getElementById("stage1");
const moon = document.getElementById("moon");
const message = document.getElementById("message");
const sun = document.getElementById("sun");
const whoosh = document.getElementById("whoosh");
const starsCanvas = document.getElementById("stars");
const starsCtx = starsCanvas.getContext("2d");

function resize1() { starsCanvas.width=window.innerWidth; starsCanvas.height=window.innerHeight; }
resize1();
window.onresize = resize1;

let stars=[];
for(let i=0;i<250;i++){
    stars.push({x:Math.random()*starsCanvas.width, y:Math.random()*starsCanvas.height, z:Math.random()*1.5+0.5, tw:Math.random()*0.02+0.005});
}

function drawStars() {
    starsCtx.clearRect(0,0,starsCanvas.width,starsCanvas.height);
    stars.forEach(s=>{
        let glow=(Math.sin(Date.now()*s.tw)+1)*0.5;
        starsCtx.fillStyle=`rgba(255,255,255,${glow})`;
        starsCtx.beginPath();
        starsCtx.arc(s.x,s.y,s.z,0,Math.PI*2);
        starsCtx.fill();
    });
}

let dragging=false, offsetX, offsetY, revealIndex=0;
const fullMsg = message.innerText;
message.innerText="";

moon.addEventListener("mousedown", e=>{
    dragging=true;
    offsetX=e.clientX-moon.offsetLeft;
    offsetY=e.clientY-moon.offsetTop;
    moon.style.cursor="grabbing";
    whoosh.currentTime=0; whoosh.play();
});
document.addEventListener("mouseup", ()=>{ dragging=false; moon.style.cursor="grab"; });
document.addEventListener("mousemove", e=>{
    if(!dragging) return;
    moon.style.left=(e.clientX-offsetX)+"px";
    moon.style.top=(e.clientY-offsetY)+"px";
    if(revealIndex<fullMsg.length){ message.style.opacity=1; message.innerText=fullMsg.substring(0,revealIndex++);}
    stars.forEach(s=>s.tw=0);
    starsCtx.globalAlpha-=0.01; if(starsCtx.globalAlpha<0) starsCtx.globalAlpha=0;
    if(revealIndex>=fullMsg.length){
        moon.style.opacity=0;
        setTimeout(()=>{
            sun.style.opacity=1; sun.style.top="40px"; sun.style.right="40px";
            stars=[];
            setTimeout(()=>{ startStage2(); }, 5000);
        },800);
    }
});

function animate1(){ drawStars(); requestAnimationFrame(animate1); }
animate1();

// ==================== STAGE 2 SCRIPT ====================
const stage2 = document.getElementById("stage2");
const shieldCanvas=document.getElementById("shieldCanvas");
const shieldCtx=shieldCanvas.getContext("2d");
let width=window.innerWidth,height=window.innerHeight;
shieldCanvas.width=width; shieldCanvas.height=height;

let shieldX=width/2, shieldY=height/2;
let R=Math.min(width,height)/3;
let starSpin=false, starAngle=0;

const bgStars2=[];
for(let i=0;i<200;i++){ bgStars2.push({x:Math.random()*width,y:Math.random()*height,r:Math.random()*1.5+0.5,tw:Math.random()*0.02+0.005}); }

function drawShield(){
    shieldCtx.save();
    shieldCtx.translate(shieldX,shieldY);
    let g1=shieldCtx.createRadialGradient(0,0,R*0.2,0,0,R);
    g1.addColorStop(0,"#3c0000"); g1.addColorStop(1,"#7a0000");
    shieldCtx.fillStyle=g1; shieldCtx.beginPath(); shieldCtx.arc(0,0,R,0,Math.PI*2); shieldCtx.fill();
    let g2=shieldCtx.createRadialGradient(0,0,R*0.1,0,0,R*0.75);
    g2.addColorStop(0,"#dadada"); g2.addColorStop(1,"#f5f5f5");
    shieldCtx.fillStyle=g2; shieldCtx.beginPath(); shieldCtx.arc(0,0,R*0.75,0,Math.PI*2); shieldCtx.fill();
    let g3=shieldCtx.createRadialGradient(0,0,R*0.1,0,0,R*0.5);
    g3.addColorStop(0,"#4b0000"); g3.addColorStop(1,"#8c0000");
    shieldCtx.fillStyle=g3; shieldCtx.beginPath(); shieldCtx.arc(0,0,R*0.5,0,Math.PI*2); shieldCtx.fill();
    let g4=shieldCtx.createRadialGradient(0,0,R*0.05,0,0,R*0.35);
    g4.addColorStop(0,"#b4c7e0"); g4.addColorStop(1,"#001933");
    shieldCtx.fillStyle=g4; shieldCtx.beginPath(); shieldCtx.arc(0,0,R*0.35,0,Math.PI*2); shieldCtx.fill();
    shieldCtx.save();
    if(starSpin) shieldCtx.rotate(starAngle);
    let starR=R*0.28;
    shieldCtx.beginPath();
    for(let i=0;i<5;i++){
        let o=(Math.PI*2/5)*i-Math.PI/2;
        let n=o+Math.PI/5;
        shieldCtx.lineTo(Math.cos(o)*starR,Math.sin(o)*starR);
        shieldCtx.lineTo(Math.cos(n)*starR*0.45,Math.sin(n)*starR*0.45);
    }
    shieldCtx.closePath();
    shieldCtx.shadowColor="rgba(255,255,255,0.25)"; shieldCtx.shadowBlur=5;
    let sg=shieldCtx.createRadialGradient(0,0,starR*0.1,0,0,starR);
    sg.addColorStop(0,"#ffffff"); sg.addColorStop(0.4,"#eeeeee"); sg.addColorStop(1,"#7a7a7a");
    shieldCtx.fillStyle=sg; shieldCtx.fill();
    shieldCtx.restore(); shieldCtx.restore();
}

function animate2(){
    shieldCtx.fillStyle="#0a0d19"; shieldCtx.fillRect(0,0,width,height);
    bgStars2.forEach(s=>{
        const glow=(Math.sin(Date.now()*s.tw)+1)*0.5;
        shieldCtx.fillStyle=`rgba(255,255,255,${glow})`;
        shieldCtx.beginPath(); shieldCtx.arc(s.x,s.y,s.r,0,Math.PI*2); shieldCtx.fill();
    });
    drawShield();
    if(starSpin) starAngle+=0.035;
    requestAnimationFrame(animate2);
}

function startStage2(){
    stage1.style.display="none";
    stage2.style.display="block";
    animate2();
}

const verseDiv=document.getElementById("verse");
shieldCanvas.addEventListener("click", e=>{
    const dx=e.clientX-shieldX;
    const dy=e.clientY-shieldY;
    if(Math.sqrt(dx*dx+dy*dy)<=R*0.28){
        starSpin=true;
        verseDiv.style.opacity=1;
        verseDiv.style.transform="translateX(-50%) scale(1)";
        setTimeout(()=>{ startStage3(); },7000);
        document.getElementById("stage2").querySelector("#instruction").style.opacity=0;
    }
});

// ==================== STAGE 3 SCRIPT ====================
const stage3 = document.getElementById("stage3");
const c = document.getElementById("c");
const ctx3 = c.getContext("2d");
const btn = document.getElementById("clickBtn");
function resize3(){ c.width=window.innerWidth; c.height=window.innerHeight; }
resize3(); window.onresize=resize3;

const bgStars3=[]; const bgStarCount=180;
for(let i=0;i<bgStarCount;i++){ bgStars3.push({x:Math.random()*c.width,y:Math.random()*c.height,size:Math.random()*1.1+0.2,tw:Math.random()*0.02+0.003}); }

function drawStarShape(){
    bgStars3.forEach(s=>{
        const glow=(Math.sin(Date.now()*s.tw)+1)*0.5;
        ctx3.fillStyle=`rgba(255,255,255,${glow})`;
        ctx3.beginPath(); ctx3.arc(s.x,s.y,s.size,0,Math.PI*2); ctx3.fill();
    });
}

function mapTextToPoints(textStr){
    const temp=document.createElement("canvas"); const tctx=temp.getContext("2d");
    temp.width=c.width; temp.height=c.height;
    const fontSize=c.width/7;
    tctx.clearRect(0,0,temp.width,temp.height); tctx.fillStyle="#fff";
    tctx.font="bold "+fontSize+"px Arial"; tctx.textAlign="center"; tctx.textBaseline="middle";
    tctx.fillText(textStr,temp.width/2,temp.height/2);
    const imageData=tctx.getImageData(0,0,temp.width,temp.height).data;
    const points=[];
    for(let y=0;y<temp.height;y+=6){ for(let x=0;x<temp.width;x+=6){
        let index=(y*temp.width+x)*4; if(imageData[index+3]>200){ points.push({x,y}); }
    }}
    return points;
}

let currentText="PRINCE"; let letterPoints=mapTextToPoints(currentText);
const particles=letterPoints.map(p=>({x:Math.random()*c.width,y:Math.random()*c.height,tx:p.x,ty:p.y,speed:Math.random()*0.08+0.04,size:Math.random()*1.8+1.2,color:null}));

let camera={dx:0,dy:0,zoom:1};
function applyCamera(){ camera.dx=Math.sin(Date.now()*0.0003)*15; camera.dy=Math.cos(Date.now()*0.00025)*15; camera.zoom=1+0.02*Math.sin(Date.now()*0.0002);
ctx3.save(); ctx3.translate(c.width/2+camera.dx,c.height/2+camera.dy); ctx3.scale(camera.zoom,camera.zoom); ctx3.translate(-c.width/2,-c.height/2); }

function animate3(){
    ctx3.clearRect(0,0,c.width,c.height);
    applyCamera(); drawStarShape();
    const time=Date.now();
    particles.forEach(p=>{
        p.x+=(p.tx-p.x)*p.speed; p.y+=(p.ty-p.y)*p.speed;
        let fillColor=p.color||`hsl(${(p.x+p.y)%360},90%,70%)`;
        let shadowIntensity=p.color?(Math.sin(time*0.005)*0.5+0.5)*20:18;
        ctx3.fillStyle=fillColor; ctx3.shadowBlur=shadowIntensity; ctx3.shadowColor=fillColor;
        ctx3.beginPath(); ctx3.arc(p.x,p.y,p.size,0,Math.PI*2); ctx3.fill();
    });
    ctx3.restore(); requestAnimationFrame(animate3);
}

function startStage3(){
    stage2.style.display="none"; stage3.style.display="block"; animate3();
    setTimeout(()=>{ btn.style.opacity=1; },3000);
}

btn.addEventListener("click", ()=>{
    btn.style.display="none"; 
    const newText="DAIVIK";
    const newPoints=mapTextToPoints(newText);
    particles.forEach((p,i)=>{
        const np=newPoints[i%newPoints.length];
        p.tx=np.x;
        p.ty=np.y;
        p.color="#fff";
    });

    // ==================== 3-second delay before Stage 4 ====================
    setTimeout(()=>{ startStage4(); }, 3000);
});

// ==================== STAGE 4 SCRIPT ====================
function startStage4(){
    stage3.style.display="none";
    const stage4 = document.getElementById("stage4");
    stage4.style.display="block";

    // Paste your Phase 4 code here exactly (Scene, camera, renderer, stars, nebula, PRINCE letters, animation)
    // For brevity, you can include your full Phase 4 JS here
}
</script>
</body>
</html>
