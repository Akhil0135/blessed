<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>IMAX Nolan Moon-to-Day Cinematic</title>
<style>
html,body{margin:0;height:100%;overflow:hidden;font-family:"Cinzel",serif;background:#000010;}
#scene{position:relative;width:100%;height:100%;overflow:hidden;transform-origin:center center;transition:transform 0.1s;filter:contrast(1.1) brightness(1.05) saturate(1.15);}
#sky{position:absolute;inset:0;background:linear-gradient(to bottom,#030014,#120034 40%,#1a0046 70%);transition:background 1.5s ease;}
#moon{position:absolute;width:180px;height:180px;border-radius:50%;background:#d9d8ff;box-shadow:0 0 50px #c5c4ff,0 0 120px rgba(255,255,255,0.2);top:22%;left:18%;transform:translate(-50%,-50%) rotate(0deg);cursor:pointer;z-index:5;transition:transform 0.1s linear,opacity 1s;filter:drop-shadow(0 0 30px #d9d8ff);}
#sun{position:absolute;width:300px;height:300px;border-radius:50%;background:radial-gradient(circle,#ffd27f,#ff9a00);box-shadow:0 0 170px #ffb54c,0 0 300px #ff7b00;opacity:0;top:5%;right:5%;transform:scale(0.35);transition:opacity 1.5s ease, transform 1.5s ease;z-index:3;filter:drop-shadow(0 0 100px #ffd27f);}
.sun-rays{position:absolute;top:50%;left:50%;width:1000px;height:1000px;background:radial-gradient(circle,#fff5 0%,transparent 70%);border-radius:50%;transform:translate(-50%,-50%) scale(0);opacity:0;pointer-events:none;filter:blur(40px);transition:transform 1.5s, opacity 1.5s;}
#msg{position:absolute;width:90%;text-align:center;bottom:18%;color:#ffe6aa;font-size:2rem;font-weight:700;opacity:0;text-shadow:0 0 45px #ffb84c,0 0 80px rgba(255,200,100,0.5);transition:opacity 0.1s;}
#btn{position:absolute;left:50%;bottom:8%;transform:translateX(-50%);background:linear-gradient(to right,#6a00ff,#c200ff);color:#fff;font-size:1.25rem;padding:14px 34px;border:none;border-radius:16px;cursor:pointer;box-shadow:0 0 25px #9400ff;opacity:0;transition:opacity 1s;}
#cross{position:absolute;left:50%;top:10%;transform:translateX(-50%) scale(0.75);width:0;height:0;opacity:0;transition:opacity 1.5s, transform 1.5s;}
.cross-vertical{position:absolute;left:50%;transform:translateX(-50%);width:24px;height:260px;background:#ffd700;box-shadow:0 0 60px #ffe600;}
.cross-horizontal{position:absolute;left:50%;transform:translateX(-50%);width:180px;height:24px;top:calc(260px*0.35);background:#ffd700;box-shadow:0 0 60px #ffe600;}
#rotationIndicator{position:absolute;bottom:5%;width:90%;left:50%;transform:translateX(-50%);height:6px;background:rgba(255,255,255,0.2);border-radius:3px;}
#rotationProgress{height:100%;width:0%;background:#ffe6aa;border-radius:3px;transition:width 0.1s linear;}
.star{position:absolute;width:2px;height:2px;background:white;border-radius:50%;opacity:0.8;animation:twinkle 2s infinite alternate;filter:blur(1px);}
@keyframes twinkle{0%{opacity:0.3;}50%{opacity:1;}100%{opacity:0.3;}}
</style>
</head>
<body>
<div id="scene">
  <div id="sky"></div>
  <div id="moon"></div>
  <div id="sun"></div>
  <div class="sun-rays"></div>
  <div id="msg">On this calm birthday eve so new, God softly whispers, my plans are made for you.</div>
  <button id="btn">Click Here</button>
  <div id="cross">
    <div class="cross-vertical"></div>
    <div class="cross-horizontal"></div>
  </div>
  <div id="rotationIndicator"><div id="rotationProgress"></div></div>
</div>

<script>
// Stars
let stars=[];
for(let i=0;i<150;i++){
  let star=document.createElement('div');
  star.className='star';
  star.style.top=Math.random()*100+'%';
  star.style.left=Math.random()*100+'%';
  star.style.animationDuration=(1+Math.random()*3)+'s';
  document.getElementById('scene').appendChild(star);
  stars.push(star);
}

// Moon Rotation & Cinematic
let moon=document.getElementById('moon');
let sun=document.getElementById('sun');
let msg=document.getElementById('msg');
let btn=document.getElementById('btn');
let cross=document.getElementById('cross');
let sky=document.getElementById('sky');
let rotationIndicator=document.getElementById('rotationProgress');
let scene=document.getElementById('scene');
let sunRays=document.querySelector('.sun-rays');

let isDragging=false;
let rotationDeg=0;
let lastX=0;
let evolutionDone=false;

moon.addEventListener('pointerdown',e=>{
  isDragging=true; lastX=e.clientX;
});
document.addEventListener('pointerup',()=>{isDragging=false;});
document.addEventListener('pointermove',e=>{
  if(!isDragging) return;
  let deltaX=e.clientX-lastX;
  lastX=e.clientX;
  if(deltaX<0) return; // anti-clockwise only

  rotationDeg+=deltaX;
  if(rotationDeg>360) rotationDeg=360;

  // Moon rotation and opacity
  moon.style.transform=`translate(-50%,-50%) rotate(${-rotationDeg}deg)`;
  moon.style.opacity=1-rotationDeg/360;

  // Stars fade with moon
  stars.forEach(star=>star.style.opacity=1-rotationDeg/360);

  // Message reveal
  let totalLetters=msg.getAttribute('data-full') || msg.innerText;
  msg.setAttribute('data-full',totalLetters);
  let lettersToShow=Math.floor((rotationDeg/360)*totalLetters.length);
  msg.innerHTML=totalLetters.substr(0,lettersToShow);
  msg.style.opacity=lettersToShow>0?1:0;

  // Sun
  sun.style.opacity=rotationDeg/360;
  sun.style.transform=`scale(${0.35+0.65*(rotationDeg/360)})`;
  sunRays.style.opacity=rotationDeg/360;
  sunRays.style.transform=`translate(-50%,-50%) scale(${0.3+0.7*(rotationDeg/360)})`;

  // Rotation Indicator
  rotationIndicator.style.width=(rotationDeg/360*100)+'%';

  // Cinematic parallax
  scene.style.transform=`scale(${1+rotationDeg/360*0.03}) translate(${rotationDeg/360*-15}px,${rotationDeg/360*-20}px)`;

  if(rotationDeg===360 && !evolutionDone){
    evolutionDone=true;
    setTimeout(()=>{btn.style.opacity=1;},600);
  }
});

// Button → Cross
btn.addEventListener('click',()=>{
  btn.style.opacity=0;
  setTimeout(()=>btn.style.display='none',700);
  setTimeout(()=>{
    cross.style.opacity=1;
    cross.style.transform='translateX(-50%) scale(1.3)';
  },700);
  setTimeout(()=>{cross.style.transform='translateX(-50%) scale(1)';},2500);
});
</script>
</body>
</html>
