<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cinematic Night Scene</title>
<style>
  body {
    margin: 0;
    height: 100vh;
    background: linear-gradient(to bottom, #0a0f24 0%, #000814 70%, #000000 100%);
    overflow: hidden;
    position: relative;
  }

  /* True Thin Crescent Moon */
  .moon {
    position: absolute;
    top: 80px;
    right: 120px;
    width: 150px;
    height: 150px;
    border-radius: 50%;
    background: radial-gradient(circle at 45% 50%, white 55%, transparent 56%);
    box-shadow: 0 0 60px #ffffffaa;
    z-index: 2;
  }

  /* Cross */
  .cross {
    position: absolute;
    top: 10px;
    left: 50%;
    transform: translateX(-50%);
    width: 160px;
    height: 260px;
    z-index: 3;
  }

  .vertical {
    position: absolute;
    left: 50%;
    transform: translateX(-50%);
    width: 32px;
    height: 260px;
    background: linear-gradient(to bottom, #f6e7a4, #d4a93f, #b88a2c);
  }

  .horizontal {
    position: absolute;
    top: 65px; /* slightly raised */
    left: 50%;
    transform: translateX(-50%);
    width: 190px;
    height: 32px;
    background: linear-gradient(to right, #f6e7a4, #d4a93f, #b88a2c);
  }

  /* Stars */
  .star {
    position: absolute;
    width: 3px;
    height: 3px;
    background: white;
    border-radius: 50%;
    opacity: 0.9;
    animation: twinkle 2.5s infinite ease-in-out;
    pointer-events: none;
    z-index: 1;
  }

  @keyframes twinkle {
    0% { opacity: 0.2; transform: scale(1); }
    50% { opacity: 1; transform: scale(1.5); }
    100% { opacity: 0.2; transform: scale(1); }
  }

  /* Click Button */
  .click-btn {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    padding: 16px 34px;
    font-size: 22px;
    font-weight: bold;
    background: white;
    border: none;
    border-radius: 10px;
    cursor: pointer;
    opacity: 0;
    animation: reveal 1.2s forwards;
    z-index: 4;
  }

  @keyframes reveal {
    0% { opacity: 0; filter: blur(8px); transform: translate(-50%, -50%) scale(0.85); }
    100% { opacity: 1; filter: blur(0px); transform: translate(-50%, -50%) scale(1); }
  }
</style>
</head>
<body>

<div class="moon"></div>

<div class="cross">
  <div class="vertical"></div>
  <div class="horizontal"></div>
</div>

<script>
// Generate non-overlapping stars
for (let i = 0; i < 200; i++) {
  const star = document.createElement('div');
  star.classList.add('star');

  let x = Math.random() * window.innerWidth;
  let y = Math.random() * window.innerHeight;

  // Avoid moon + cross zones
  if ((x > window.innerWidth - 350 && y < 350) ||
      (x > window.innerWidth/2 - 140 && x < window.innerWidth/2 + 140 && y < 330)) {
    i--;
    continue;
  }

  star.style.left = x + 'px';
  star.style.top = y + 'px';
  star.style.animationDelay = Math.random() * 2 + 's';
  document.body.appendChild(star);
}

// Show click button after 3 seconds
setTimeout(() => {
  const btn = document.createElement('button');
  btn.className = 'click-btn';
  btn.innerText = 'Click Here';
  document.body.appendChild(btn);
}, 3000);
</script>

</body>
</html>
