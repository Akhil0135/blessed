<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Captain America Shield — Phase 2 (Constellation Reveal)</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
    html,body{
        margin:0;
        padding:0;
        overflow:hidden;

        /* IMAX Cinematic Deep-Space Background */
        background: radial-gradient(circle at center,
                    #0a0d19 0%,
                    #05060f 60%,
                    #010208 100%);
        font-family: "Cinzel", serif;
    }
    canvas{
        display:block;
    }

    /* INDIVIDUAL CONSTELLATION LETTERS */
    .star-letter{
        position:absolute;
        font-size:30px;
        color:#ffe9a6;
        text-shadow:0 0 8px #fff2b3, 0 0 15px #e6d37a;
        opacity:0;
        transform:scale(0.2);
        transition:0.8s ease-out;
        pointer-events:none;
    }

    /* FINAL VERSE (when settled at top) */
    #final-verse{
        position:absolute;
        top:40px;
        left:50%;
        transform:translateX(-50%);
        font-size:36px;
        color:#ffd977;
        text-shadow:0 0 15px #ffe9b0;
        opacity:0;
        transition:1.5s ease-out;
        white-space:nowrap;
        pointer-events:none;
    }
</style>

</head>
<body>

<canvas id="shieldCanvas"></canvas>
<div id="final-verse"></div>

<script>
const canvas = document.getElementById("shieldCanvas");
const ctx = canvas.getContext("2d");

function resize(){
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
}
resize();
window.onresize = resize;

// ---------------------------------------------
// SHIELD + STAR
// ---------------------------------------------
let starSpin = false;
let starAngle = 0;
let shieldX, shieldY, R;

function drawShield(){
    shieldX = canvas.width/2;
    shieldY = canvas.height/2;
    R = Math.min(canvas.width, canvas.height)/3;

    ctx.save();
    ctx.translate(shieldX, shieldY);

    // OUTER RED
    const g1 = ctx.createRadialGradient(0,0,R*0.2,0,0,R);
    g1.addColorStop(0,"#3c0000");
    g1.addColorStop(1,"#7a0000");
    ctx.fillStyle = g1;
    ctx.beginPath();
    ctx.arc(0,0,R,0,Math.PI*2); ctx.fill();

    // WHITE
    const g2 = ctx.createRadialGradient(0,0,R*0.1,0,0,R*0.75);
    g2.addColorStop(0,"#dadada");
    g2.addColorStop(1,"#f5f5f5");
    ctx.fillStyle = g2;
    ctx.beginPath();
    ctx.arc(0,0,R*0.75,0,Math.PI*2); ctx.fill();

    // INNER RED
    const g3 = ctx.createRadialGradient(0,0,R*0.1,0,0,R*0.5);
    g3.addColorStop(0,"#4b0000");
    g3.addColorStop(1,"#8c0000");
    ctx.fillStyle = g3;
    ctx.beginPath();
    ctx.arc(0,0,R*0.5,0,Math.PI*2); ctx.fill();

    // BLUE METALLIC CENTER
    const g4 = ctx.createRadialGradient(0,0,R*0.05,0,0,R*0.35);
    g4.addColorStop(0,"#b4c7e0");
    g4.addColorStop(1,"#001933");
    ctx.fillStyle = g4;
    ctx.beginPath();
    ctx.arc(0,0,R*0.35,0,Math.PI*2); ctx.fill();

    // STAR
    ctx.save();
    if(starSpin) ctx.rotate(starAngle);

    const starR = R*0.28;
    ctx.beginPath();
    for(let i=0;i<5;i++){
        let o = (Math.PI*2/5)*i - Math.PI/2;
        let n = o + Math.PI/5;
        ctx.lineTo(Math.cos(o)*starR, Math.sin(o)*starR);
        ctx.lineTo(Math.cos(n)*(starR*0.45), Math.sin(n)*(starR*0.45));
    }
    ctx.closePath();

    // Reduced glow
    ctx.shadowColor="rgba(255,255,255,0.25)";
    ctx.shadowBlur=5;

    const sg = ctx.createRadialGradient(0,0,starR*0.1,0,0,starR);
    sg.addColorStop(0,"#ffffff");
    sg.addColorStop(0.4,"#eeeeee");
    sg.addColorStop(1,"#7a7a7a");
    ctx.fillStyle = sg;
    ctx.fill();

    ctx.restore();
    ctx.restore();
}

function loop(){
    ctx.clearRect(0,0,canvas.width,canvas.height);
    drawShield();
    if(starSpin) starAngle += 0.035;
    requestAnimationFrame(loop);
}
loop();

// ---------------------------------------------
// CONSTELLATION LETTER REVEAL
// ---------------------------------------------
const verseText = "He counts the stars and calls them each by name — Psalm 147:4";
const finalVerse = document.getElementById("final-verse");
finalVerse.textContent = verseText;

let letters = [];
let lineSegments = [];

canvas.addEventListener("click", (e)=>{
    let mx=e.clientX, my=e.clientY;
    let dx = mx-shieldX;
    let dy = my-shieldY;
    if(Math.sqrt(dx*dx + dy*dy) <= R*0.28){
        starSpin=true;
        revealConstellation();
    }
});

function revealConstellation(){
    const starX = shieldX;
    const starY = shieldY;

    let prevX = starX;
    let prevY = starY;

    [...verseText].forEach((char, i)=>{

        setTimeout(()=>{

            // Create individual letter
            const el = document.createElement("div");
            el.className="star-letter";
            el.textContent = char;

            // Start at star center
            el.style.left = starX+"px";
            el.style.top  = starY+"px";
            document.body.appendChild(el);
            letters.push(el);

            // TARGET POSITION for each letter (top center)
            const finalY = 40 + 0; 
            const offsetX = - (finalVerse.clientWidth/2) + (i*20);

            const finalX = window.innerWidth/2 + offsetX;

            // Animate letter
            setTimeout(()=>{
                el.style.opacity=1;
                el.style.transform="scale(1)";
                el.style.left = finalX+"px";
                el.style.top  = finalY+"px";
            },20);

            // DRAW CONSTELLATION LINE
            const newX = finalX;
            const newY = finalY;

            drawConstellationLine(prevX, prevY, newX, newY);
            prevX = newX;
            prevY = newY;

            // After all letters → fade in final verse
            if(i===verseText.length-1){
                setTimeout(()=>{
                    finalVerse.style.opacity=1;
                }, 1500);
            }

        }, i*120);  // reveal speed
    });
}

// Draw connecting star lines
function drawConstellationLine(x1,y1,x2,y2){
    const line = document.createElement("canvas");
    line.width = canvas.width;
    line.height = canvas.height;
    line.style.position="absolute";
    line.style.left="0";
    line.style.top="0";
    line.style.pointerEvents="none";

    const lctx = line.getContext("2d");
    lctx.strokeStyle="rgba(255,220,150,0.9)";
    lctx.lineWidth=2;
    lctx.shadowBlur=8;
    lctx.shadowColor="rgba(255,220,150,0.7)";

    lctx.beginPath();
    lctx.moveTo(x1,y1);
    lctx.lineTo(x2,y2);
    lctx.stroke();

    document.body.appendChild(line);

    // fade line slowly
    setTimeout(()=>{
        line.style.transition="3s ease-out";
        line.style.opacity=0;
        setTimeout(()=> line.remove(), 3500);
    }, 1200);
}
</script>

</body>
</html>
