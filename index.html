<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IMAX COSMIC — MOON → SUN → CROSS</title>

<style>
    body {
        margin: 0;
        overflow: hidden;
        background: black;
        height: 100vh;
        font-family: 'Cinzel', serif;
    }

    /* STARRY BACKGROUND */
    #stars {
        position: absolute;
        width: 100%;
        height: 100%;
        background: radial-gradient(circle at center, #0a0a24, #000);
        overflow: hidden;
        z-index: 1;
        transition: opacity 2s ease-in-out, background 2s ease-in-out;
    }

    .star {
        position: absolute;
        width: 2px;
        height: 2px;
        background: white;
        border-radius: 50%;
        opacity: 0;
        animation: twinkle 2s infinite ease-in-out;
    }

    @keyframes twinkle {
        0%,100% { opacity: 0.1; transform: scale(1); }
        50% { opacity: 1; transform: scale(1.8); }
    }

    /* MOON */
    #moon {
        position: absolute;
        top: 50%;
        left: 50%;
        width: 180px;
        height: 180px;
        transform: translate(-50%, -50%);
        background: radial-gradient(circle, #ffffff, #b8b8b8, #6f6f6f);
        border-radius: 50%;
        box-shadow: 0 0 35px #fff8;
        z-index: 3;
        cursor: grab;
        transition: opacity 2s ease-in-out;
    }

    /* SUN */
    #sun {
        position: absolute;
        top: 30px;
        right: 40px;
        width: 120px;
        height: 120px;
        background: radial-gradient(circle, #ffdf70, #ffb300, #d98a00);
        border-radius: 50%;
        opacity: 0;
        z-index: 2;
        transition: opacity 2s ease-in-out;
        box-shadow: 0 0 60px #ffdd66aa;
    }

    /* MESSAGE */
    #message {
        position: absolute;
        bottom: 60px;
        width: 100%;
        text-align: center;
        font-size: 26px;
        letter-spacing: 3px;
        font-weight: bold;
        opacity: 0;
        color: gold;
        z-index: 5;
        transition: opacity 2.5s ease-in-out;
    }

    /* CROSS — ONLY UPDATED THIS */
    #cross {
        position: absolute;
        top: -300px;
        left: 50%;
        transform: translateX(-50%);
        width: 40px;
        height: 200px;
        background: linear-gradient(#2d0051, #1a0033);
        z-index: 6;
        opacity: 0;
        transition: 2.5s ease-in-out;
    }

    /* MOVED HORIZONTAL BAR UP (from 70px → 50px) */
    #cross::after {
        content: "";
        position: absolute;
        top: 50px; /* 🔥 ONLY CHANGE YOU ASKED FOR */
        left: -60px;
        width: 160px;
        height: 40px;
        background: inherit;
    }
</style>
</head>

<body>

<div id="stars"></div>
<div id="moon"></div>
<div id="sun"></div>
<div id="message">HAPPY FIRST BIRTHDAY MY LITTLE PRINCE</div>
<div id="cross"></div>

<script>
/* STARS */
const starsContainer = document.getElementById("stars");
for (let i = 0; i < 150; i++) {
    let s = document.createElement("div");
    s.className = "star";
    s.style.top = Math.random() * 100 + "%";
    s.style.left = Math.random() * 100 + "%";
    s.style.animationDelay = Math.random() * 2 + "s";
    starsContainer.appendChild(s);
}

/* MOON DRAG LOGIC */
let moon = document.getElementById("moon");
let sun = document.getElementById("sun");
let stars = document.getElementById("stars");
let msg = document.getElementById("message");
let cross = document.getElementById("cross");

let isDragging = false;

moon.addEventListener("mousedown", () => {
    isDragging = true;
});

window.addEventListener("mouseup", () => {
    if (isDragging) {
        moon.style.opacity = 0;

        /* STARS FADE */
        setTimeout(() => {
            stars.style.opacity = 0;
            stars.style.background = "linear-gradient(#000428, #004e92)";
        }, 700);

        /* SUN APPEARS */
        setTimeout(() => {
            sun.style.opacity = 1;
        }, 1500);

        /* MESSAGE */
        setTimeout(() => {
            msg.style.opacity = 1;
        }, 2500);

        /* CROSS DESCENDS */
        setTimeout(() => {
            cross.style.opacity = 1;
            cross.style.top = "120px";
        }, 3500);
    }
    isDragging = false;
});
</script>

</body>
</html>
