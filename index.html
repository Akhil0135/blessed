<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Golden Cross</title>
<style>
  body {
    margin: 0;
    height: 100vh;
    background-color: #001f3f; /* navy blue */
    display: flex;
    flex-direction: column;
    justify-content: flex-start;
    align-items: center;
    padding-top: 50px;
  }

  /* Cross container */
  .cross {
    position: relative;
    width: 20px;   /* vertical bar width */
    height: 100px; /* vertical bar height */
  }

  /* Vertical bar */
  .cross::before {
    content: '';
    position: absolute;
    top: 0;
    left: 50%;
    transform: translateX(-50%);
    width: 20px;
    height: 100px;
    background-color: gold;
    box-shadow: 0 0 2px gold; /* subtle glow */
  }

  /* Horizontal bar */
  .cross::after {
    content: '';
    position: absolute;
    top: 40%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 60px;
    height: 20px;
    background-color: gold;
    box-shadow: 0 0 2px gold; /* subtle glow */
  }

  /* Button styling */
  #clickButton {
    margin-top: 50px;
    padding: 10px 25px;
    font-size: 18px;
    background-color: gold;
    color: #001f3f;
    border: none;
    border-radius: 5px;
    cursor: pointer;
    display: none; /* hidden initially */
    box-shadow: 0 0 5px gold;
    transition: opacity 0.5s ease;
  }
</style>
</head>
<body>
  <div class="cross"></div>
  <button id="clickButton">Click Here</button>

  <script>
    // Show the button after 3 seconds
    setTimeout(function() {
      const btn = document.getElementById('clickButton');
      btn.style.display = 'block';
    }, 3000);
  </script>
</body>
</html>
