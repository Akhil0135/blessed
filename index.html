<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cinematic Night Sky</title>
<style>
  body, html {
    margin: 0;
    padding: 0;
    overflow: hidden;
    width: 100%;
    height: 100%;
    /* Removed blue, pure dark cinematic gradient */
    background: linear-gradient(to top, #03040a 0%, #060710 50%, #0a0b18 100%);
    font-family: 'Cinzel', serif;
  }

  /* Stars */
  .star {
    position: absolute;
    width: 2px;
    height: 2px;
    background: white;
    border-radius: 50%;
    opacity: 0.6; /* slightly less twinkle */
    box-shadow: 0 0 6px rgba(255,255,255,0.5);
    animation: twinkle 2s infinite alternate;
  }
  @keyframes twinkle {
    0% { opacity: 0.2; transform: scale(1); }
    50% { opacity: 0.7; transform: scale(1.4); }
    100% { opacity: 0.2; transform: scale(1); }
  }

  /* Aurora */
  .aurora {
    position: absolute;
    top: 0;
    width: 100%;
    height: 40vh;
    background: radial-gradient(circle at 50% 20%, rgba(0,255,200,0.3), transparent),
                radial-gradient(circle at 30% 10%, rgba(0,150,255,0.25), transparent),
                radial-gradient(circle at 70% 5%, rgba(150,80,255,0.25), transparent);
    filter: blur(30px);
    animation: auroraMove 20s ease-in-out infinite alternate;
  }
  @keyframes auroraMove {
    0% { transform: translateY(0px) scale(1); }
    100% { transform: translateY(-20px) scale(1.1); }
  }

  /* Clouds */
  .cloud {
    position: absolute;
    width: 250px;
    height: 100px;
    background: rgba(255,255,255,0.07);
    border-radius: 50%;
    filter: blur(25px);
    animation: moveCloud linear infinite;
  }
  @keyframes moveCloud {
    0% { left: -300px; }
    100% { left: 110%; }
  }

  /* Moon */
  .moon {
    position: absolute;
    width: 140px;
    height: 140px;
    background: radial-gradient(circle, #fffde6 0%, #f3e4b0 60%, #d9c180 100%);
    border-radius: 50%;
    top: 80px;
    left: -120px;
    box-shadow: 0 0 18px 4px rgba(255,255,200,0.4);
    animation: moonMove 55s linear forwards;
  }
  @keyframes moonMove {
    0% { left: -150px; }
    100% { left: 70%; } /* stop before touching end */
  }

  /* Shooting stars */
  .shooting-star {
    position: absolute;
    width: 6px;
    height: 2px;
    background: linear-gradient(0deg, rgba(255,255,255,0), white);
    border-radius: 50%;
    opacity: 0;
    transform-origin: top left;
    animation: shoot 2.5s linear forwards;
  }
  @keyframes shoot {
    0% { transform: translate(0,0) rotate(-45deg); opacity: 1; }
    100% { transform: translate(-70vw,70vh) rotate(-45deg); opacity: 0; }
  }

  /* Message reveal */
  #message {
    position: absolute;
    top: 60%;
    width: 100%;
    text-align: center;
    font-size: 28px;
    color: #f9e9c9;
    opacity: 0;
    letter-spacing: 3px;
  }
  .letter {
    opacity: 0;
    display: inline-block;
    animation: revealLetter 0.6s forwards;
  }
  @keyframes revealLetter {
    0% { opacity: 0; filter: blur(6px); transform: translateY(5px); }
    100% { opacity: 1; filter: blur(0); transform: translateY(0); }
  }

  /* Click Here Button */
  #clickBtn {
    position: absolute;
    bottom: 14vh;
    left: 50%;
    transform: translateX(-50%) scale(1.1);
    padding: 14px 34px;
    font-size: 20px;
    font-family: 'Cinzel', serif;
    background: rgba(255,255,255,0.12);
    border: 1px solid rgba(255,255,255,0.45);
    border-radius: 40px;
    color: #fff;
    backdrop-filter: blur(6px);
    cursor: pointer;
    opacity: 0;
    pointer-events: none;
    transition: opacity 1.8s ease, transform 1.8s ease;
    z-index: 200;
  }
  @keyframes btnFloat {
    0%   { transform: translateX(-50%) translateY(0px) scale(1.08); }
    50%  { transform: translateX(-50%) translateY(-6px) scale(1.12); }
    100% { transform: translateX(-50%) translateY(0px) scale(1.08); }
  }
  #clickBtn.reveal {
    opacity: 1;
    pointer-events: auto;
    animation: btnFloat 3.4s ease-in-out infinite;
  }
</style>
</head>
<body>

<div class="aurora"></div>
<div class="moon"></div>
<div id="message"></div>
<button id="clickBtn">Click Here</button>

<script>
  /* Stars */
  const starCount = 100;
  for(let i=0;i<starCount;i++){
    const star=document.createElement('div');
    star.classList.add('star');
    star.style.top=Math.random()*window.innerHeight+'px';
    star.style.left=Math.random()*window.innerWidth+'px';
    document.body.appendChild(star);
  }

  /* Clouds */
  const cloudCount = 6;
  for(let i=0;i<cloudCount;i++){
    const cloud=document.createElement('div');
    cloud.classList.add('cloud');
    cloud.style.top=(50 + Math.random()*250)+'px';
    cloud.style.animationDuration=(35 + Math.random()*40)+'s';
    document.body.appendChild(cloud);
  }

  /* Shooting stars - increased count from start */
  function createShootingStar(){
    const star=document.createElement('div');
    star.classList.add('shooting-star');
    star.style.top=Math.random()*200+'px';
    star.style.left=window.innerWidth+'px';
    const duration=2 + Math.random()*1.3;
    star.style.animationDuration=duration+'s';
    document.body.appendChild(star);
    setTimeout(()=>{ star.remove(); }, duration*1000);
  }
  for(let i=0;i<6;i++){ createShootingStar(); }
  setInterval(createShootingStar, 1200);

  /* Message reveal letter by letter */
  const msg = "On this calm birthday eve so new, God softly whispers, my plans are made for you.";
  const messageDiv = document.getElementById("message");
  function revealMessage(){
    msg.split("").forEach((char,i)=>{
      const span=document.createElement('span');
      span.classList.add('letter');
      span.textContent = char===' ' ? '\u00A0' : char;
      span.style.animationDelay = (0.1 * i)+'s';
      messageDiv.appendChild(span);
    });
    messageDiv.style.opacity = 1;
  }

  /* Trigger message reveal & click button when moon reaches 70% of screen */
  const moon=document.querySelector('.moon');
  const clickBtn=document.getElementById('clickBtn');
  function checkMoon(){
    const rect=moon.getBoundingClientRect();
    if(rect.left > window.innerWidth*0.55){
      revealMessage();
      clickBtn.classList.add('reveal');
      clearInterval(interval);
    }
  }
  const interval=setInterval(checkMoon,200);

</script>
</body>
</html>
