<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>IMAX Nolan — Moon Reveal</title>

<style>
    body{
        margin:0;
        height:100vh;
        background:#000;
        overflow:hidden;
        user-select:none;
        font-family: "Georgia", serif;
        position:relative;

        /* Nolan-style vignette */
        box-shadow: inset 0 0 250px 100px #000;
    }

    /* IMAX Space Gradient */
    #bg{
        position:absolute;
        inset:0;
        background: radial-gradient(circle at 30% 20%, #1a1a2f 0%, #050510 60%, #000 100%);
        z-index:-3;
    }

    /* Haze / Nebula */
    #haze{
        position:absolute;
        inset:0;
        background: radial-gradient(circle at 40% 40%, rgba(120,120,255,0.08), transparent 60%);
        mix-blend-mode: screen;
        z-index:-2;
    }

    /* Subtle film grain */
    #grain{
        position:absolute;
        inset:0;
        background-image:url("data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVQIW2NkgIL/////BwAFeQKXc2PpWwAAAABJRU5ErkJggg==");
        opacity:0.10;
        pointer-events:none;
        z-index:-1;
    }

    /* moon */
    #moon{
        position:absolute;
        top:60px;
        left:60px;
        width:150px;
        height:150px;
        border-radius:50%;
        
        /* Detailed IMAX moon texture */
        background: radial-gradient(circle,
            #ffffff 0%,
            #f2f2f2 25%,
            #dcdcdc 60%,
            #bfbfbf 100%);
        
        box-shadow: 
            0 0 35px 25px rgba(255,255,255,0.25), /* halo */
            0 0 80px 40px rgba(100,120,255,0.12); /* cinematic blue glow */

        cursor:grab;
        z-index:10;
    }

    /* message box */
    #msgBox{
        position:fixed;
        bottom:55px;
        left:50%;
        transform:translateX(-50%);
        white-space:nowrap;
        font-size:22px;
        font-weight:bold;
        color:#d8e2ff;  /* IMAX ice-blue */
        letter-spacing:1.5px;
        opacity:1; /* Always visible container */
        text-shadow: 0 0 8px rgba(150,190,255,0.7);
        z-index:50;
    }

    #msgBox span{
        opacity:0;
        transition:opacity .22s ease-in;
    }

    #msgBox span.show{
        opacity:1;
    }
</style>

</head>
<body>

<div id="bg"></div>
<div id="haze"></div>
<div id="grain"></div>

<div id="moon"></div>

<div id="msgBox"></div>

<script>
const moon = document.getElementById("moon");
const msgBox = document.getElementById("msgBox");

const text = "On this calm birthday eve so new, God softly whispers, my plans are made for you.";

// Build letters
msgBox.innerHTML = "";
for(let c of text){
    let s = document.createElement("span");
    s.textContent = c;
    msgBox.appendChild(s);
}

const spans = msgBox.querySelectorAll("span");

let dragging = false;
let offsetX = 0;
let lastShown = 0;
let locked = false;

moon.addEventListener("mousedown", e=>{
    dragging = true;
    offsetX = e.clientX - moon.offsetLeft;
    moon.style.transition = "none";
});

window.addEventListener("mouseup", ()=> dragging = false);

window.addEventListener("mousemove", e=>{
    if(!dragging) return;

    let x = e.clientX - offsetX;

    const maxX = window.innerWidth - moon.clientWidth - 20;
    if(x < 20) x = 20;
    if(x > maxX) x = maxX;

    moon.style.left = x + "px";

    if(!locked){
        let progress = (x - 20) / (maxX - 20);
        if(progress < 0) progress = 0;
        if(progress > 1) progress = 1;

        let target = Math.floor(progress * spans.length);

        if(target > lastShown){
            for(let i = lastShown; i < target; i++){
                spans[i].classList.add("show");
            }
            lastShown = target;

            if(lastShown >= spans.length){
                locked = true; // No going back
            }
        }
    }
});
</script>

</body>
</html>
