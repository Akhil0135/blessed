<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Cinematic Night</title>

<style>
    body {
        margin: 0;
        overflow: hidden;
        background: black;
        font-family: 'Poppins', sans-serif;
    }

    /* ==== STARRY BACKGROUND (CINEMATIC) ==== */
    .stars {
        position: absolute;
        width: 100%;
        height: 100%;
        background: transparent;
        overflow: hidden;
    }

    .star {
        position: absolute;
        width: 2px;
        height: 2px;
        background: white;
        opacity: 0.6;
        border-radius: 50%;
        animation: twinkle 2.5s infinite ease-in-out;
    }

    @keyframes twinkle {
        0% { opacity: 0.2; }
        50% { opacity: 0.9; }
        100% { opacity: 0.2; }
    }

    /* ==== SHOOTING STARS ==== */
    .shooting-star {
        position: absolute;
        width: 3px;
        height: 120px;
        background: linear-gradient(to bottom, white, transparent);
        opacity: 0.8;
        transform: rotate(-45deg);
        border-radius: 50%;
        animation: shoot 1.8s linear infinite;
    }

    @keyframes shoot {
        0% { transform: translate(-200px, -200px) rotate(-45deg); opacity: 0; }
        10% { opacity: 1; }
        100% { transform: translate(800px, 800px) rotate(-45deg); opacity: 0; }
    }

    /* ==== MOON ==== */
    .moon {
        position: absolute;
        top: 20%;
        left: -150px;
        width: 140px;
        height: 140px;
        background: radial-gradient(circle, #ffffff, #cfd0ff 60%, #7a7a7a 100%);
        border-radius: 50%;
        filter: brightness(1.2);
        animation: moveMoon 25s linear forwards;
        box-shadow: 0 0 50px #ffffffaa;
    }

    @keyframes moveMoon {
        0% { left: -150px; }
        100% { left: calc(100% - 250px); }
    }

    /* ==== CLOUDS (PARALLAX) ==== */
    .cloud {
        position: absolute;
        top: 30%;
        width: 450px;
        height: 180px;
        background: rgba(255,255,255,0.13);
        filter: blur(35px);
        border-radius: 50%;
        animation: cloudsMove 60s linear infinite;
    }

    @keyframes cloudsMove {
        from { left: -500px; }
        to { left: 110%; }
    }

    /* ==== MESSAGE ==== */
    .message {
        position: absolute;
        bottom: 12%;
        width: 100%;
        text-align: center;
        font-size: 28px;
        color: #ffffffdd;
        letter-spacing: 2px;
        opacity: 0;
    }

    .show-letter {
        opacity: 1;
        transition: opacity 0.4s ease;
    }
</style>
</head>

<body>

<div class="stars"></div>
<div class="moon"></div>

<div class="cloud" style="top: 55%; animation-delay: 0s;"></div>
<div class="cloud" style="top: 40%; animation-delay: 8s;"></div>
<div class="cloud" style="top: 65%; animation-delay: 20s;"></div>

<div id="message" class="message"></div>

<script>
/* ==== GENERATE CINEMATIC STARS ==== */
const starsContainer = document.querySelector('.stars');
for (let i = 0; i < 150; i++) {
    let star = document.createElement('div');
    star.classList.add('star');
    star.style.top = Math.random() * 100 + '%';
    star.style.left = Math.random() * 100 + '%';
    star.style.animationDelay = Math.random() * 3 + 's';
    starsContainer.appendChild(star);
}

/* ==== SHOOTING STARS (INCREASED COUNT) ==== */
for (let i = 0; i < 12; i++) {
    let s = document.createElement('div');
    s.classList.add('shooting-star');
    s.style.top = Math.random() * 40 + '%';
    s.style.left = Math.random() * 40 + '%';
    s.style.animationDelay = Math.random() * 5 + 's';
    document.body.appendChild(s);
}

/* ==== MESSAGE REVEAL ==== */
const msgText = "On this calm birthday eve so new, God softly whispers, ‘My plans are made for you.’";
const msgContainer = document.getElementById("message");

let index = 0;

function revealText() {
    if (index < msgText.length) {
        const span = document.createElement("span");
        span.textContent = msgText[index];
        span.classList.add("show-letter");
        msgContainer.appendChild(span);
        index++;
        setTimeout(revealText, 90);
    }
}

setTimeout(() => {
    revealText();
}, 3000);
</script>

</body>
</html>
