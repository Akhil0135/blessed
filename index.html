<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>IMAX — Moon → Sun → Star → Message</title>

<style>
/* ---------------- Base ---------------- */
html,body{
  margin:0;
  height:100%;
  background:#000010;
  overflow:hidden;
  font-family:Inter,system-ui,sans-serif;
}

/* ---------------- Scene Container ---------------- */
.scene{
  width:100%;
  height:100%;
  position:relative;
  overflow:hidden;
  background:linear-gradient(to bottom, #060616, #140430);
}

/* ---------------- Moon ---------------- */
.moon{
  position:absolute;
  top:35%;
  left:50%;
  width:180px;
  height:180px;
  transform:translate(-50%, -50%);
  border-radius:50%;
  background:#cfd8ff;
  box-shadow:0 0 120px #aabbff70;
  opacity:1;
  transition:2s ease;
}

/* ---------------- Sun ---------------- */
.sun{
  position:absolute;
  top:50%;
  left:50%;
  width:220px;
  height:220px;
  transform:translate(-50%, -50%) scale(0.1);
  border-radius:50%;
  background:radial-gradient(circle,#ffef9e,#ffb300);
  box-shadow:0 0 140px #ffcc4d80;
  opacity:0;
  transition:3s ease;
}

/* ---------------- STAR (Fixed Version) ---------------- */
.star{
  position:absolute;
  top:50%;
  left:50%;
  width:160px;
  height:160px;
  transform:translate(-50%, -50%);
  display:flex;
  justify-content:center;
  align-items:center;
  pointer-events:none;
}

.star-inner{
  width:160px;
  height:160px;
  transform-origin:50% 50%;
  animation:
    star-intro-spin 2.5s cubic-bezier(0.20,0.00,0.00,1.00) forwards,
    star-loop-spin 10s linear infinite 2.5s;
}

/* Cinematic intro */
@keyframes star-intro-spin{
  0%   {transform:rotate(0deg) scale(1);}
  100% {transform:rotate(45deg) scale(1);}
}

/* Infinite stable loop */
@keyframes star-loop-spin{
  0%   {transform:rotate(45deg);}
  100% {transform:rotate(405deg);}
}

/* ---------------- Message ---------------- */
.message{
  position:absolute;
  bottom:8%;
  width:100%;
  text-align:center;
  font-size:32px;
  color:#ffeec0;
  opacity:0;
  letter-spacing:2px;
  transition:2s ease;
}

/* ---------------- Click Here Button ---------------- */
.btn{
  position:absolute;
  bottom:3%;
  left:50%;
  transform:translateX(-50%);
  padding:14px 32px;
  font-size:20px;
  color:#fff;
  border:2px solid #ffffff70;
  background:transparent;
  border-radius:14px;
  cursor:pointer;
  opacity:0;
  transition:1.4s ease;
}
.btn:hover{
  background:#ffffff15;
}

</style>
</head>

<body>

<div class="scene">

  <div class="moon"></div>
  <div class="sun"></div>

  <div class="star">
    <img src="star.png" class="star-inner">
  </div>

  <div class="message">Happiest Birthday</div>

  <button class="btn" id="nextBtn">Click Here</button>

</div>

<script>
/* ---------------- MAIN SEQUENCE ---------------- */
window.onload = () => {
  const moon = document.querySelector(".moon");
  const sun  = document.querySelector(".sun");
  const msg  = document.querySelector(".message");
  const btn  = document.getElementById("nextBtn");

  /* Moon fades → Sun reveals */
  setTimeout(()=>{
    moon.style.opacity = 0;
  },1200);

  setTimeout(()=>{
    sun.style.opacity = 1;
    sun.style.transform = "translate(-50%, -50%) scale(1)";
  },2600);

  /* Message fade-in */
  setTimeout(()=>{
    msg.style.opacity = 1;
  },4800);

  /* Button appear */
  setTimeout(()=>{
    btn.style.opacity = 1;
  },6200);
};

/* ---------------- Button → Phase 2 Transition ---------------- */
document.getElementById("nextBtn").onclick = () => {
  document.body.style.background = "#000";
  alert("Phase 2 loaded (you can replace this with your birthday screen).");
};
</script>

</body>
</html>
