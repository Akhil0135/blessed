<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>IMAX • Nolan Cinematic Vision</title>
<style>
  html,body{margin:0;padding:0;height:100%;background:#000;overflow:hidden;font-family:Inter,system-ui}

  canvas{width:100%;height:100%;display:block;background:radial-gradient(circle at center,#0a0a15,#000);
  }

  /* Cinematic Title */
  .title{
    position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);
    color:#fff;font-size:3vw;letter-spacing:0.4vw;font-weight:300;
    opacity:0;animation:titleFade 6s ease forwards 4s;
    text-shadow:0 0 20px #00aaff;
  }

  @keyframes titleFade{
    0%{opacity:0;letter-spacing:2vw;filter:blur(20px)}
    40%{opacity:1;letter-spacing:0.4vw;filter:blur(0px)}
    100%{opacity:0;filter:blur(15px)}
  }
@keyframes shieldRotate {
  0% { transform: translate(-50%, -50%) scale(1.1) rotate(0deg); }
  100% { transform: translate(-50%, -50%) scale(1.1) rotate(360deg); }
}

@keyframes starSpin {
  0% { transform: rotate(0deg); }
  100% { transform: rotate(360deg); }
}

.shield-spin {
  animation: shieldRotate 14s linear infinite;
}

#shield svg polygon {
  transform-origin: 256px 256px;
  transform: scale(1.25);
  animation: starSpin 4s linear infinite;
}

</style>
</head>
<body>
<canvas id="cinema"></canvas>
<div class="title">IMAX • NOLAN VISION</div>

<script>
/* ---------------- 3D Cinematic Space Simulation ---------------- */
const canvas = document.getElementById('cinema');
const ctx = canvas.getContext('2d');
canvas.width = innerWidth;
canvas.height = innerHeight;

let stars = Array.from({length:1500}, () => {
  return {
    x: (Math.random()-0.5)*2000,
    y: (Math.random()-0.5)*2000,
    z: Math.random()*2000,
  };
});

function animate(){
  ctx.fillStyle = '#000';
  ctx.fillRect(0,0,canvas.width,canvas.height);

  for(let s of stars){
    s.z -= 4;
    if(s.z <= 1) s.z = 2000;

    let sx = (s.x / s.z) * 800 + canvas.width/2;
    let sy = (s.y / s.z) * 800 + canvas.height/2;
    let size = Math.max(0, 2 - s.z/1000);

    ctx.fillStyle = 'white';
    ctx.beginPath();
    ctx.arc(sx, sy, size, 0, Math.PI*2);
    ctx.fill();
  }
  requestAnimationFrame(animate);
}

animate();
</script>
<div id="shield"></div>
<script>
// Add Captain America Shield SVG in center
const shield = document.getElementById('shield');
shield.innerHTML = `
<svg class="shield-spin" width="280" height="280" viewBox="0 0 512 512" style="position:absolute;top:50%;left:50%;transform:translate(-50%,-50%) scale(1.1);filter:drop-shadow(0 0 25px #ff0000aa)">
  <circle cx="256" cy="256" r="250" fill="#c31f26"/>
  <circle cx="256" cy="256" r="200" fill="#ffffff"/>
  <circle cx="256" cy="256" r="150" fill="#c31f26"/>
  <circle cx="256" cy="256" r="100" fill="#0a3d91"/>
  <polygon points="256,150 281,230 366,230 297,280 322,360 256,310 190,360 215,280 146,230 231,230" fill="white"/>
</svg>`;
</script>
</body>
</html>
