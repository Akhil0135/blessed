<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Phase 2 — MCU Shield Interactive with Cinematic Verse</title>
<style>
html, body {
    margin: 0;
    padding: 0;
    overflow: hidden;
    background: #0a0a1a; /* Cinematic deep blue-black background */
}
canvas {
    display: block;
    cursor: pointer;
}
.verse-letter {
    position: absolute;
    font-family: "Cinzel", serif;
    font-size: 28px;
    color: #ffd700;
    text-shadow: 0 0 10px rgba(255,255,255,0.6);
    opacity: 0;
    transition: all 1s ease-out;
}
</style>
</head>
<body>
<canvas id="shieldCanvas"></canvas>
<script>
const canvas = document.getElementById('shieldCanvas');
const ctx = canvas.getContext('2d');

function resize() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
}
resize();
window.onresize = resize;

// -------------------- STARS --------------------
const stars = [];
for (let i = 0; i < 200; i++) {
    stars.push({
        x: Math.random() * canvas.width,
        y: Math.random() * canvas.height,
        z: Math.random() * 1.5 + 0.5,
        tw: Math.random() * 0.02 + 0.005
    });
}

function drawStars() {
    ctx.fillStyle = "#0a0a1a";
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    stars.forEach(s => {
        const glow = (Math.sin(Date.now() * s.tw) + 1) * 0.5;
        ctx.fillStyle = `rgba(255,255,255,${glow})`;
        ctx.beginPath();
        ctx.arc(s.x, s.y, s.z, 0, Math.PI*2);
        ctx.fill();
    });
}

// -------------------- SHIELD --------------------
let shieldRadius = 250;
const shieldX = canvas.width / 2;
const shieldY = canvas.height / 2;
let angle = 0;
let breaking = false;
let pieces = [];
let starSpin = false;
let starAngle = 0;

function drawShield(x, y, r, rotation) {
    ctx.save();
    ctx.translate(x, y);

    if(!breaking){
        ctx.rotate(rotation);
        // Outer Red
        const outerRed = ctx.createRadialGradient(0,0,r*0.7,0,0,r);
        outerRed.addColorStop(0,'#ff5555');
        outerRed.addColorStop(0.5,'#aa0000');
        outerRed.addColorStop(1,'#880000');
        ctx.fillStyle = outerRed;
        ctx.beginPath();
        ctx.arc(0,0,r,0,Math.PI*2);
        ctx.fill();

        // Inner White
        const innerWhite = ctx.createRadialGradient(0,0,r*0.6,0,0,r*0.8);
        innerWhite.addColorStop(0,'#ffffff');
        innerWhite.addColorStop(0.5,'#cccccc');
        innerWhite.addColorStop(1,'#aaaaaa');
        ctx.fillStyle = innerWhite;
        ctx.beginPath();
        ctx.arc(0,0,r*0.8,0,Math.PI*2);
        ctx.fill();

        // Inner Red
        const innerRed = ctx.createRadialGradient(0,0,r*0.5,0,0,r*0.6);
        innerRed.addColorStop(0,'#ff6666');
        innerRed.addColorStop(0.5,'#aa1111');
        innerRed.addColorStop(1,'#880000');
        ctx.fillStyle = innerRed;
        ctx.beginPath();
        ctx.arc(0,0,r*0.6,0,Math.PI*2);
        ctx.fill();
    }
    ctx.restore();

    // Center Navy Blue Metallic
    ctx.save();
    ctx.translate(x, y);

    const centerR = r*0.4;
    const metallicGradient = ctx.createRadialGradient(0,0,centerR*0.05,0,0,centerR);
    metallicGradient.addColorStop(0,'#7a8aa0');
    metallicGradient.addColorStop(0.5,'#001f3f');
    metallicGradient.addColorStop(1,'#001830');
    ctx.fillStyle = metallicGradient;
    ctx.beginPath();
    ctx.arc(0,0,centerR,0,Math.PI*2);
    ctx.fill();

    // 3D Metallic Star
    const starR = centerR*0.95;
    const starPoints = [];
    for (let i = 0; i < 5; i++) {
        starPoints.push({
            x: Math.cos((18 + i*72)*Math.PI/180)*starR,
            y: -Math.sin((18 + i*72)*Math.PI/180)*starR
        });
        starPoints.push({
            x: Math.cos((54 + i*72)*Math.PI/180)*(starR*0.5),
            y: -Math.sin((54 + i*72)*Math.PI/180)*(starR*0.5)
        });
    }

    ctx.save();
    if(starSpin) ctx.rotate(starAngle);
    const starGradient = ctx.createRadialGradient(0,0,starR*0.1,0,0,starR);
    starGradient.addColorStop(0,'#ffffff');
    starGradient.addColorStop(0.3,'#dddddd');
    starGradient.addColorStop(0.6,'#aaaaaa');
    starGradient.addColorStop(1,'#555555');
    ctx.fillStyle = starGradient;
    ctx.beginPath();
    ctx.moveTo(starPoints[0].x, starPoints[0].y);
    for(let i=1;i<starPoints.length;i++){
        ctx.lineTo(starPoints[i].x, starPoints[i].y);
    }
    ctx.closePath();
    ctx.shadowColor = 'rgba(255,255,255,0.4)';
    ctx.shadowBlur = 15;
    ctx.fill();
    ctx.restore();

    ctx.restore();
}

// -------------------- SHIELD BREAK --------------------
function createPieces(){
    pieces = [];
    const numPieces = 50;
    for(let i=0;i<numPieces;i++){
        let angle = Math.random()*Math.PI*2;
        let dist = Math.random()*shieldRadius;
        let size = Math.random()*15 + 8;
        pieces.push({
            x: shieldX + Math.cos(angle)*dist,
            y: shieldY + Math.sin(angle)*dist,
            dx: Math.cos(angle)*Math.random()*4,
            dy: Math.sin(angle)*Math.random()*4 - 1,
            size: size,
            opacity:1,
            color: 'rgba(255,100,100,1)'
        });
    }
}

// -------------------- ANIMATION LOOP --------------------
function animate(){
    drawStars();
    if(!breaking) angle += 0.004; // slow rotation
    drawShield(shieldX, shieldY, shieldRadius, angle);

    if(breaking){
        pieces.forEach(p=>{
            p.x += p.dx;
            p.y += p.dy;
            p.dy += 0.1; 
            p.opacity -= 0.015;
            ctx.fillStyle = p.color.replace('1)',''+p.opacity+')');
            ctx.beginPath();
            ctx.arc(p.x,p.y,p.size,0,Math.PI*2);
            ctx.fill();
        });
    }

    if(starSpin) starAngle += 0.05; 

    requestAnimationFrame(animate);
}

animate();

// -------------------- STAR CLICK --------------------
canvas.addEventListener('click', function(e){
    const mx = e.clientX;
    const my = e.clientY;
    const dx = mx - shieldX;
    const dy = my - shieldY;
    const centerR = shieldRadius*0.4*0.95;
    if(Math.sqrt(dx*dx + dy*dy) <= centerR){
        if(!breaking){
            breaking = true;
            starSpin = true;
            createPieces();

            // Cinematic Verse — letter-by-letter, proper spacing
            const verseText = "He counts the number of the stars; He gives names to all of them. — Psalm 147:4";
            const startX = shieldX;
            const startY = shieldY;
            const topY = 50;
            const fontSize = 28;

            // Temporary canvas for measuring
            const tempCanvas = document.createElement('canvas');
            const tempCtx = tempCanvas.getContext('2d');
            tempCtx.font = `${fontSize}px Cinzel`;

            let totalWidth = 0;
            const widths = [];
            for (let i = 0; i < verseText.length; i++) {
                const w = tempCtx.measureText(verseText[i]).width;
                widths.push(w);
                totalWidth += w;
            }

            let currentX = canvas.width / 2 - totalWidth / 2;
            let delay = 0;
            for (let i = 0; i < verseText.length; i++) {
                const span = document.createElement('span');
                span.textContent = verseText[i];
                span.className = 'verse-letter';
                span.style.fontSize = fontSize + 'px';
                span.style.left = startX + 'px';
                span.style.top = startY + 'px';
                span.style.transform = 'scale(0.2)';
                document.body.appendChild(span);

                setTimeout(() => {
                    span.style.opacity = 1;
                    span.style.transform = 'scale(1)';
                    span.style.left = currentX + 'px';
                    span.style.top = topY + 'px';
                }, delay);

                delay += 70;
                currentX += widths[i]; // precise spacing
            }
        }
    }
});
</script>
</body>
</html>
