<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>IMAX Cinematic – Full Integrated</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
html,body{
  margin:0;
  padding:0;
  overflow:hidden;
  background:black;
}
canvas{
  display:block;
}
#phase4Container{
  position:fixed;
  inset:0;
  z-index:9999;
  display:none;
}
</style>
</head>
<body>

<!-- ======================================================
     🔒 STAGE 1 → STAGE 3 (PASTED EXACTLY AS SAVED)
     DO NOT TOUCH — DO NOT EDIT — DO NOT MOVE
====================================================== -->

<!--
PASTE YOUR SAVED CODE:
IMAX_Cinematic_Stage1_to_Stage3_Base
EXACTLY HERE
WITHOUT ANY CHANGE
-->

<!-- ======================================================
     🔒 END OF STAGE 1 → STAGE 3
====================================================== -->

<div id="phase4Container"></div>

<script>
/* ======================================================
   PHASE 4 LOADER — NO INTERFERENCE
====================================================== */

(function(){

  function loadPhase4(){
    const container = document.getElementById("phase4Container");
    container.style.display = "block";

    const script = document.createElement("script");
    script.type = "module";
    script.textContent = `
      import * as THREE from "https://cdn.jsdelivr.net/npm/three@0.152/build/three.module.js";
      import { FontLoader } from "https://cdn.jsdelivr.net/npm/three@0.152/examples/jsm/loaders/FontLoader.js";
      import { TextGeometry } from "https://cdn.jsdelivr.net/npm/three@0.152/examples/jsm/geometries/TextGeometry.js";

      const scene = new THREE.Scene();
      scene.fog = new THREE.FogExp2(0x000000,0.0012);

      const camera = new THREE.PerspectiveCamera(60,innerWidth/innerHeight,0.1,3000);
      camera.position.set(0,50,420);

      const renderer = new THREE.WebGLRenderer({antialias:true});
      renderer.setSize(innerWidth,innerHeight);
      renderer.setPixelRatio(devicePixelRatio);
      document.getElementById("phase4Container").appendChild(renderer.domElement);

      const starsGeo = new THREE.BufferGeometry();
      const count = 2600;
      const arr = new Float32Array(count*3);
      for(let i=0;i<count*3;i++) arr[i]=(Math.random()-0.5)*3000;
      starsGeo.setAttribute("position",new THREE.BufferAttribute(arr,3));
      const stars = new THREE.Points(
        starsGeo,
        new THREE.PointsMaterial({color:0xffffff,size:2})
      );
      scene.add(stars);

      scene.add(new THREE.AmbientLight(0x666666,0.5));

      const key = new THREE.PointLight(0x99ccff,2,2000);
      key.position.set(200,200,150);
      scene.add(key);

      const warm = new THREE.PointLight(0xffcc99,1.6,2000);
      warm.position.set(-150,150,-100);
      scene.add(warm);

      let letters=[];
      const fontLoader=new FontLoader();
      fontLoader.load(
        "https://threejs.org/examples/fonts/helvetiker_bold.typeface.json",
        font=>{
          const text="PRINCE";
          const size=140;
          const spacing=size*0.95;
          const startX=-(spacing*(text.length-1))/2;

          for(let i=0;i<text.length;i++){
            const geo=new TextGeometry(text[i],{
              font,size,height:15,bevelEnabled:true
            });
            geo.center();
            const mat=new THREE.MeshStandardMaterial({
              color:0xffffff,
              emissive:0x3355ff,
              metalness:0.6,
              roughness:0.25
            });
            const mesh=new THREE.Mesh(geo,mat);
            mesh.position.set(startX+i*spacing,0,-800);
            mesh.scale.setScalar(0.1);
            mesh.visible=false;
            scene.add(mesh);
            letters.push(mesh);
          }

          let i=0;
          function reveal(){
            if(i>=letters.length) return;
            const m=letters[i++];
            m.visible=true;
            let f=0;
            (function anim(){
              if(f<=120){
                const t=f/120;
                m.position.z=-800*(1-t);
                m.scale.setScalar(0.1+0.9*t);
                f++; requestAnimationFrame(anim);
              }
            })();
            setTimeout(reveal,350);
          }
          reveal();
        }
      );

      let a=0;
      function animate(){
        requestAnimationFrame(animate);
        stars.rotation.y+=0.0004;
        a+=0.0012;
        camera.position.x=Math.sin(a)*420;
        camera.position.z=Math.cos(a)*420;
        camera.lookAt(0,40,0);
        renderer.render(scene,camera);
      }
      animate();

      addEventListener("resize",()=>{
        camera.aspect=innerWidth/innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(innerWidth,innerHeight);
      });
    `;
    document.body.appendChild(script);
  }

  /* 🔑 HOOK INTO YOUR EXISTING CLICK HERE BUTTON */
  document.addEventListener("click",e=>{
    if(e.target && e.target.innerText==="Click Here"){
      loadPhase4();
    }
  });

})();
</script>

</body>
</html>
