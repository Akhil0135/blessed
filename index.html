<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Captain America Shield — Divine Verse Reveal</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
    html,body{
        margin:0;
        padding:0;
        overflow:hidden;
        background: radial-gradient(circle at center,
            #0a0d19 0%,
            #05060f 60%,
            #010208 100%);
        font-family: "Cinzel", serif;
    }

    canvas{
        position:absolute;
        top:0;
        left:0;
        width:100%;
        height:100%;
        display:block;
    }

    /* Stars created on background */
    #bg-stars{
        position:absolute;
        top:0;
        left:0;
        width:100%;
        height:100%;
        pointer-events:none;
        z-index:0;
    }

    /* Divine light */
    #beam{
        position:absolute;
        top:-200px;
        left:50%;
        width:300px;
        height:600px;
        transform:translateX(-50%);
        background:linear-gradient(to bottom,
            rgba(255,255,200,0) 0%,
            rgba(255,255,180,0.6) 30%,
            rgba(255,255,150,0.15) 100%);
        filter:blur(35px);
        opacity:0;
        transition:1.2s ease-out;
        pointer-events:none;
        z-index:5;
    }

    /* Letters of verse */
    .verse-letter{
        position:absolute;
        top:50px;
        font-size:36px;
        color:#ffe9a6;
        opacity:0;
        transform:scale(0.1);
        text-shadow:0 0 10px #fff1b3;
        pointer-events:none;
        transition:0.6s ease-out;
        z-index:10;
    }
</style>

</head>
<body>

<div id="bg-stars"></div>
<div id="beam"></div>
<canvas id="shieldCanvas"></canvas>

<script>
// -------------------------------------------------------
// Create background stars
// -------------------------------------------------------
const bg = document.getElementById("bg-stars");

for(let i=0;i<250;i++){
    const s = document.createElement("div");
    s.style.position="absolute";
    s.style.width="2px";
    s.style.height="2px";
    s.style.background="white";
    s.style.borderRadius="50%";
    s.style.opacity=Math.random()*0.7;
    s.style.left=(Math.random()*100)+"%";
    s.style.top=(Math.random()*100)+"%";
    s.style.filter="blur(1px)";
    bg.appendChild(s);
}

// -------------------------------------------------------
// Shield + Star Canvas Setup
// -------------------------------------------------------
const canvas = document.getElementById("shieldCanvas");
const ctx = canvas.getContext("2d");

function resize(){
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
}
resize();
window.onresize = resize;

let starSpin = false;
let starAngle = 0;
let shieldX, shieldY, R;

// Measure text widths accurately
function measureTextWidth(text, font="36px Cinzel") {
    ctx.save();
    ctx.font = font;
    const width = ctx.measureText(text).width;
    ctx.restore();
    return width;
}

// -------------------------------------------------------
// Draw Shield
// -------------------------------------------------------
function drawShield(){
    shieldX = canvas.width/2;
    shieldY = canvas.height/2;
    R = Math.min(canvas.width, canvas.height)/3;

    ctx.save();
    ctx.translate(shieldX, shieldY);

    // Outer red
    let g1 = ctx.createRadialGradient(0,0,R*0.2,0,0,R);
    g1.addColorStop(0,"#300000");
    g1.addColorStop(1,"#700000");
    ctx.fillStyle = g1;
    ctx.beginPath(); ctx.arc(0,0,R,0,Math.PI*2); ctx.fill();

    // White
    let g2 = ctx.createRadialGradient(0,0,R*0.1,0,0,R*0.75);
    g2.addColorStop(0,"#dcdcdc");
    g2.addColorStop(1,"#f0f0f0");
    ctx.fillStyle = g2;
    ctx.beginPath(); ctx.arc(0,0,R*0.75,0,Math.PI*2); ctx.fill();

    // Inner red
    let g3 = ctx.createRadialGradient(0,0,R*0.1,0,0,R*0.5);
    g3.addColorStop(0,"#400000");
    g3.addColorStop(1,"#850000");
    ctx.fillStyle = g3;
    ctx.beginPath(); ctx.arc(0,0,R*0.5,0,Math.PI*2); ctx.fill();

    // Blue metallic
    let g4 = ctx.createRadialGradient(0,0,R*0.05,0,0,R*0.35);
    g4.addColorStop(0,"#b0c4e8");
    g4.addColorStop(1,"#00152d");
    ctx.fillStyle = g4;
    ctx.beginPath(); ctx.arc(0,0,R*0.35,0,Math.PI*2); ctx.fill();

    // STAR
    ctx.save();
    if(starSpin) ctx.rotate(starAngle);

    let starR = R*0.28;
    ctx.beginPath();
    for(let i=0;i<5;i++){
        let o = (Math.PI*2/5)*i - Math.PI/2;
        let i2 = o + Math.PI/5;
        ctx.lineTo(Math.cos(o)*starR, Math.sin(o)*starR);
        ctx.lineTo(Math.cos(i2)*(starR*0.45), Math.sin(i2)*(starR*0.45));
    }
    ctx.closePath();

    ctx.shadowColor="rgba(255,255,255,0.15)";
    ctx.shadowBlur=3;

    let sg = ctx.createRadialGradient(0,0,starR*0.1,0,0,starR);
    sg.addColorStop(0,"#ffffff");
    sg.addColorStop(1,"#6a6a6a");
    ctx.fillStyle = sg;

    ctx.fill();
    ctx.restore();

    ctx.restore();
}

function loop(){
    ctx.clearRect(0,0,canvas.width,canvas.height);
    drawShield();
    if(starSpin) starAngle += 0.045;
    requestAnimationFrame(loop);
}
loop();

// -------------------------------------------------------
// Verse Reveal
// -------------------------------------------------------
const verse = "He counts the stars and calls them each by name — Psalm 147:4";
const beam = document.getElementById("beam");

canvas.addEventListener("click", (e)=>{
    let dx = e.clientX - shieldX;
    let dy = e.clientY - shieldY;

    if(Math.sqrt(dx*dx + dy*dy) <= R*0.30){
        starSpin = true;
        revealVerse();
    }
});

function revealVerse(){
    beam.style.opacity = 1;

    const font = "36px Cinzel";

    const letters = [...verse];
    let totalWidth = measureTextWidth(verse, font);
    let startX = canvas.width/2 - totalWidth/2;
    let cursor = startX;

    letters.forEach((char,i)=>{
        let w = measureTextWidth(char, font);

        setTimeout(()=>{

            const span = document.createElement("div");
            span.className="verse-letter";
            span.textContent = char;
            span.style.left = cursor + "px";

            document.body.appendChild(span);

            setTimeout(()=>{
                span.style.opacity = 1;
                span.style.transform = "scale(1)";
            },20);

        }, i*90);

        cursor += w;
    });
}

</script>

</body>
</html>
