<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IMAX • Nolan Vision</title>

<style>
    html, body {
        margin: 0;
        padding: 0;
        height: 100%;
        overflow: hidden;
        background: black;
        font-family: "Trajan Pro", serif;
    }

    /* Scene Container */
    #scene {
        width: 100%;
        height: 100%;
        position: relative;
        background: radial-gradient(circle at center, #000010, #000000);
        transition: background 2s linear;
    }

    /* Stars */
    .star {
        position: absolute;
        width: 2px;
        height: 2px;
        background: white;
        border-radius: 50%;
        opacity: 0;
        animation: twinkle 3s infinite ease-in-out;
    }

    @keyframes twinkle {
        0% { opacity: 0.1; transform: scale(1); }
        50%{ opacity: 0.8; transform: scale(1.7); }
        100%{ opacity: 0.1; transform: scale(1); }
    }

    /* Moon */
    #moon {
        position: absolute;
        top: 45%;
        left: 10%;
        width: 160px;
        height: 160px;
        background: radial-gradient(circle, #ffffff, #bbbbbb, #777777);
        border-radius: 50%;
        cursor: grab;
        transition: opacity 1.5s ease-out;
    }

    /* Sun */
    #sun {
        position: absolute;
        top: 8%;
        right: 8%;
        width: 260px;
        height: 260px;
        background: radial-gradient(circle, #ffdd77, #ff9900, #cc5500);
        border-radius: 50%;
        opacity: 0;
        transform: scale(0.2);
        transition: opacity 2s ease-out, transform 3s ease-out;
        filter: blur(2px);
    }

    /* Message */
    #message {
        position: absolute;
        bottom: 40px;
        width: 100%;
        text-align: center;
        font-size: 32px;
        letter-spacing: 4px;
        color: gold;
        opacity: 0;
        text-shadow: 0 0 8px rgba(255, 215, 0, 0.5);
        transition: color 2s linear;
        font-weight: bold;
    }
</style>

</head>
<body>

<div id="scene"></div>
<div id="moon"></div>
<div id="sun"></div>
<div id="message"></div>

<script>
/* Create Twinkling Stars */
const scene = document.getElementById("scene");

for (let i = 0; i < 120; i++) {
    const star = document.createElement("div");
    star.classList.add("star");
    star.style.top = Math.random() * 100 + "%";
    star.style.left = Math.random() * 100 + "%";
    star.style.animationDelay = (Math.random() * 3) + "s";
    scene.appendChild(star);
}

/* Text Reveal Setup */
const fullMsg = "HAPPY BIRTHDAY MY LITTLE PRINCE";
let revealed = 0;

/* Elements */
const moon = document.getElementById("moon");
const sun = document.getElementById("sun");
const stars = document.getElementsByClassName("star");
const message = document.getElementById("message");

let dragging = false;

moon.addEventListener("mousedown", () => dragging = true);
document.addEventListener("mouseup", () => dragging = false);

/* Moon Drag */
document.addEventListener("mousemove", (e) => {
    if (!dragging) return;

    let x = e.clientX - 80;
    let y = e.clientY - 80;

    moon.style.left = x + "px";
    moon.style.top = y + "px";

    /* Reveal Text Letter-by-Letter */
    if (revealed < fullMsg.length) {
        message.style.opacity = 1;
        message.innerHTML = fullMsg.substring(0, revealed + 1);
        revealed++;
    }

    /* Gradually fade moon */
    moon.style.opacity -= 0.008;

    /* Switch Background from Night → Dawn → Day */
    let fade = 1 - moon.style.opacity;

    if (fade < 0.5) {
        scene.style.background = `radial-gradient(circle, #000020, #000000)`;
    } else {
        scene.style.background = `radial-gradient(circle, #002060, #001030, #000010)`;
    }

    /* Fade stars */
    for (let s of stars) {
        s.style.opacity = Math.max(0, 1 - fade * 1.4);
    }

    /* Sun Starts Appearing */
    if (fade > 0.4) {
        sun.style.opacity = fade;
        sun.style.transform = `scale(${0.2 + fade})`;
    }
});
</script>

</body>
</html>
