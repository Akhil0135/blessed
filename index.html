<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GOD BLESS YOU — IMAX Divine</title>

<style>
/* ------------------- IMAX / NOLAN Palette ------------------- */
:root {
  --bg-deep: #010109;
  --bg-soft: #0a0a15;
  --gold: #ffe9c7;
  --glow-1: rgba(255,230,180,0.9);
  --glow-2: rgba(255,220,150,0.45);
  --beam: rgba(255,235,170,0.15);
}

/* ------------------- Reset ------------------- */
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  height: 100vh;
  background: radial-gradient(circle at center, var(--bg-soft), var(--bg-deep));
  overflow: hidden;
  font-family: "Cinzel", serif;
  color: var(--gold);
  animation: cameraPush 18s ease-out forwards;
}

/* ------------------- Cinematic IMAX Bars ------------------- */
.top-bar, .bottom-bar {
  position: fixed;
  left: 0;
  width: 100%;
  height: 90px;
  background: rgba(0,0,0,0.88);
  backdrop-filter: blur(4px);
  z-index: 99;
}
.top-bar { top: 0; }
.bottom-bar { bottom: 0; }

/* ------------------- Divine Light Beam ------------------- */
.beam {
  position: fixed;
  top: 0;
  left: 50%;
  width: 220px;
  height: 100vh;
  transform: translateX(-50%);
  background: linear-gradient(to bottom, var(--beam), transparent 80%);
  filter: blur(35px);
  opacity: 0;
  animation: beamFade 3s ease-out 1.5s forwards;
  pointer-events: none;
}

/* ------------------- Divine Aura Halo ------------------- */
.halo {
  position: fixed;
  top: 150px;
  left: 50%;
  width: 500px;
  height: 500px;
  transform: translateX(-50%);
  background: radial-gradient(circle, var(--glow-1), transparent 70%);
  filter: blur(45px);
  opacity: 0;
  animation: haloGlow 4s ease-out 2s forwards;
  pointer-events: none;
}

/* ------------------- Main Text ------------------- */
h1 {
  position: absolute;
  top: 120px;
  width: 100%;
  text-align: center;

  font-size: 4.2rem;
  font-weight: 600;
  letter-spacing: 7px;

  color: var(--gold);
  text-shadow:
    0 0 12px var(--glow-1),
    0 0 28px var(--glow-2),
    0 0 55px var(--glow-2);

  opacity: 0;
  transform: translateY(-40px);
  animation: textReveal 3s ease-out forwards;
}

/* ------------------- Fog ------------------- */
.fog {
  position: fixed;
  bottom: 0;
  width: 140%;
  height: 60%;
  left: -20%;
  background: url("https://i.imgur.com/8UG7ZQf.png");
  opacity: 0.18;
  filter: blur(3px);
  animation: fogMove 20s linear infinite;
  pointer-events: none;
}

/* ------------------- Particles ------------------- */
.particles {
  position: fixed;
  inset: 0;
  background: url("https://i.imgur.com/h8R3y7R.png");
  mix-blend-mode: screen;
  opacity: 0.1;
  animation: particlesMove 12s linear infinite;
  pointer-events: none;
}

/* ------------------- Film Grain ------------------- */
.grain {
  position: fixed;
  inset: 0;
  pointer-events: none;
  background-image: url("https://i.imgur.com/4NJl9tP.png");
  opacity: 0.07;
  mix-blend-mode: overlay;
  animation: grainShift 1s steps(8) infinite;
}

/* ------------------- Animations ------------------- */
@keyframes textReveal {
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

@keyframes haloGlow {
  to { opacity: 1; }
}

@keyframes beamFade {
  to { opacity: 1; }
}

@keyframes fogMove {
  0% { transform: translateX(0); }
  100% { transform: translateX(-20%); }
}

@keyframes particlesMove {
  0% { transform: translateY(0); }
  100% { transform: translateY(-6%); }
}

@keyframes grainShift {
  0% { transform: translate(0,0); }
  100% { transform: translate(-12px,-12px); }
}

@keyframes cameraPush {
  0% { transform: scale(1); }
  100% { transform: scale(1.06); }
}
</style>
</head>

<body>

<div class="top-bar"></div>

<div class="beam"></div>
<div class="halo"></div>

<h1>GOD BLESS YOU</h1>

<div class="fog"></div>
<div class="particles"></div>
<div class="grain"></div>

<div class="bottom-bar"></div>

</body>
</html>
