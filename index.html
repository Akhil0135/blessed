<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>IMAX Nolan — Moon → Day → Divine Cross → Birthday (Polished)</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg-night-1:#070617;
    --bg-night-2:#120430;
    --text-contrast:#ffdFA0;
  }
  html,body{height:100%;margin:0;background:var(--bg-night-1);font-family:"Cinzel",serif;overflow:hidden;color:var(--text-contrast);-webkit-font-smoothing:antialiased;}
  /* Stage */
  #stage{position:relative;width:100%;height:100vh;overflow:hidden;perspective:1600px;transform-origin:50% 50%;transition:transform 2.2s cubic-bezier(.2,.9,.2,1);}

  /* SKY + GRADE */
  #sky{position:absolute;inset:0;background:linear-gradient(180deg,var(--bg-night-1),var(--bg-night-2) 55%);z-index:0;transition:background 1.2s ease}
  .grade-overlay{position:absolute;inset:0;mix-blend-mode:screen;pointer-events:none;opacity:0.18;background:linear-gradient(180deg, rgba(12,8,30,0.0), rgba(10,6,20,0.28));z-index:30}
  .film-grain{position:absolute;inset:0;pointer-events:none;z-index:1000;opacity:0.08;background-image:radial-gradient(circle, rgba(255,255,255,0.02) 0.5px, transparent 0.5px);background-size:4px 4px;mix-blend-mode:overlay}

  /* STARS */
  .star{position:absolute;width:3px;height:3px;border-radius:50%;background:rgba(255,255,255,0.95);box-shadow:0 0 6px rgba(255,255,255,0.8);opacity:0.9;filter:blur(.6px);animation:twinkle var(--tw) infinite alternate}
  @keyframes twinkle{0%{opacity:.15;transform:scale(.6)}50%{opacity:1;transform:scale(1.1)}100%{opacity:.2;transform:scale(.75)}}

  /* MOON (drag target) */
  #moon{position:absolute;width:170px;height:170px;border-radius:50%;background:radial-gradient(circle at 35% 30%, #ffffff, #efe0b0 45%, #cfae78 100%);top:16%;left:12%;box-shadow:0 0 120px rgba(255,245,200,0.12),0 0 260px rgba(255,240,200,0.05);cursor:grab;z-index:60;pointer-events:auto;display:flex;align-items:center;justify-content:center;transition:transform .08s linear,opacity .9s ease,left .28s ease,top .28s ease}
  #moon:active{cursor:grabbing}
  #moon .flare{position:absolute;inset:-36px;border-radius:50%;background:radial-gradient(circle, rgba(255,245,200,0.10), rgba(255,245,200,0));filter:blur(28px);pointer-events:none}

  /* CLOUDS */
  .cloud{position:absolute;width:420px;height:220px;border-radius:45%;background: radial-gradient(circle at 30% 30%, rgba(255,255,255,0.95), rgba(255,255,255,0.6) 30%, rgba(255,255,255,0.12) 60%, rgba(255,255,255,0) 100%);filter: blur(22px);opacity:0.6;mix-blend-mode:screen;z-index:30;pointer-events:none}

  /* FOG */
  .fog{position:absolute;left:-10%;right:-10%;bottom:-10%;height:48%;background:linear-gradient(180deg, rgba(255,245,220,0.02) 0%, rgba(0,0,0,0.08) 100%);filter:blur(36px);z-index:40;mix-blend-mode:screen;opacity:0.36;pointer-events:none}

  /* SUN (behind cross) */
  #sun{position:absolute;width:760px;height:760px;border-radius:50%;right:6vw; top:-260px;background: radial-gradient(circle at 38% 34%, #fff8e8 0%, #ffd98f 12%, #ffb258 32%, #ff8a30 60%, rgba(200,80,30,0.6) 85%, rgba(200,80,30,0) 100%);box-shadow:0 0 280px 90px rgba(255,220,140,0.12),0 0 420px 260px rgba(255,180,90,0.04);opacity:0;pointer-events:none;z-index:40;transition:top 2.0s cubic-bezier(.2,.9,.2,1),opacity 1.6s ease,filter 1.2s ease, transform 1.6s ease}

  .sun .corona{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:220%;height:220%;border-radius:50%;background:radial-gradient(circle, rgba(255,255,255,0.12), rgba(255,210,120,0.04), rgba(255,160,60,0)); filter:blur(20px);opacity:0;transition:opacity 0.9s ease}

  /* ANAMORPHIC / SUN BAND */
  .sun-band{position:absolute;left:50%;top:8%;transform:translateX(-50%);width:34vw;height:120vh;background:linear-gradient(180deg, rgba(255,245,200,0.06), rgba(255,230,160,0.02) 30%, rgba(255,230,160,0) 60%);mix-blend-mode:screen;filter:blur(16px);opacity:0;z-index:42;pointer-events:none;transition:opacity .9s ease}
  .anam{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:2200px;height:48px;border-radius:8px;background:linear-gradient(90deg, rgba(255,255,255,0) 0%, rgba(255,255,200,0.95) 30%, rgba(255,160,60,0.95) 70%, rgba(255,255,255,0) 100%);filter:blur(30px);opacity:0;mix-blend-mode:screen;pointer-events:none;z-index:43;transition:opacity .9s ease, transform 1.2s ease;}

  /* MESSAGE */
  #message{position:absolute;left:6%;right:6%;top:60%;text-align:center;z-index:80;font-size:34px;letter-spacing:2px;color:#f2d8ff;text-shadow:0 6px 24px rgba(40,10,60,0.45);pointer-events:none;font-weight:500;line-height:1.25;opacity:0;transition:opacity 1.6s ease}
  .letter{display:inline-block;opacity:0;transform:translateY(12px);transition:opacity .12s ease, transform .12s ease}

  /* CLICK BUTTON */
  #clickBtn{position:absolute;left:50%;transform:translateX(-50%);bottom:6%;padding:14px 30px;border-radius:14px;border:none;font-weight:800;font-size:18px;background:linear-gradient(90deg,#2822ff,#9b00ff);color:white;box-shadow:0 14px 40px rgba(20,6,80,0.5);cursor:pointer;z-index:110;opacity:0;transition:opacity .8s ease, transform .32s cubic-bezier(.2,.9,.2,1);pointer-events:auto}
  #clickBtn:active{transform:translateX(-50%) scale(.98)}

  /* ROTATION TRACK */
  #rotTrack{position:absolute;left:50%;transform:translateX(-50%);bottom:2%;width:80%;height:8px;background:rgba(255,255,255,0.04);border-radius:6px;z-index:105;pointer-events:none}
  #rotFill{height:100%;width:0%;background:linear-gradient(90deg,#ffdFA0,#ffd27f);border-radius:6px;box-shadow:0 4px 18px rgba(255,200,120,0.12);transition:width .06s linear}

  /* VIGNETTE */
  .vign{position:absolute;inset:0;pointer-events:none;z-index:900;background:radial-gradient(ellipse at 45% 30%, rgba(0,0,0,0) 40%, rgba(0,0,0,0.5) 100%);opacity:0.6}

  /* ---------- DOMINANT CROSS (IMAX / NOLAN) ---------- */
  #cross {
    position: absolute;
    top: 12%;               /* slightly higher to dominate sun */
    left: 50%;
    width: 6px;             /* a touch bolder */
    height: 220px;          /* taller to dominate */
    background: rgba(255,255,255,0.96);
    border-radius: 3px;
    transform: translateX(-50%) scale(0.72);
    opacity: 0;
    transition: opacity 2.0s cubic-bezier(.2,.9,.2,1), transform 2.0s cubic-bezier(.2,.9,.2,1);
    filter:
      drop-shadow(0 0 24px rgba(255,255,255,0.92))
      drop-shadow(0 0 64px rgba(255,235,180,0.45));
    z-index:9999;           /* ALWAYS above sun */
    pointer-events:none;
    will-change:transform,opacity;
  }
  #cross::before {
    content: "";
    position: absolute;
    left: 50%;
    top: 36%;              /* beam slightly lower for correct proportion */
    width: 160px;          /* wider — dominates sun area */
    height: 6px;
    background: rgba(255,255,255,0.96);
    border-radius: 3px;
    transform: translateX(-50%);
    filter: drop-shadow(0 0 16px rgba(255,255,255,0.88));
  }

  /* GOD-RAY BEHIND CROSS (subtle) */
  .godray {
    position:absolute;
    left:50%;
    top:16%;
    transform:translateX(-50%);
    width:40%;
    height:120%;
    pointer-events:none;
    z-index:9998;
    background:linear-gradient(180deg, rgba(255,245,200,0.12), rgba(255,200,120,0.02) 40%, rgba(255,200,120,0) 70%);
    mix-blend-mode:screen;
    filter:blur(20px) saturate(1.1);
    opacity:0;
    transition:opacity 1.6s ease;
  }

  /* BIRTHDAY OVERLAY / HAPPY */
  #birthdayOverlay{position:absolute;inset:0;z-index:10000;opacity:0;pointer-events:none;transition:opacity 1.6s ease;background:linear-gradient(180deg,#fffaf0,#fff1cc 40%, #ffe2b6 100%)}
  #happy{position:absolute;top:38%;left:50%;transform:translate(-50%,-50%) scale(.85);font-size:84px;font-weight:900;letter-spacing:6px;z-index:10010;opacity:0;transition:opacity 1s ease, transform 1s ease;text-shadow:0 14px 50px rgba(255,180,80,0.28); background:linear-gradient(90deg,#ff2b6d,#ffd800,#29f1ff);-webkit-background-clip:text;-webkit-text-fill-color:transparent;}

  /* FIREWORKS PARTICLE */
  .fw{position:absolute;width:6px;height:6px;border-radius:50%;pointer-events:none;z-index:10020;filter:blur(0.6px);box-shadow:0 0 12px rgba(255,255,255,0.85)}

  /* RESPONSIVE TWEAKS */
  @media (max-width:720px){
    #sun{width:520px;height:520px;right:6vw;top:-200px}
    #moon{width:130px;height:130px}
    #message{font-size:18px;top:65%}
    #happy{font-size:44px;top:34%}
    #cross{height:160px}
    #cross::before{width:96px;height:5px}
    .godray{width:60%}
  }
</style>
</head>
<body>
  <div id="stage" role="application" aria-label="Cinematic moon to day birthday reveal">
    <div id="sky"></div>
    <div class="grade-overlay"></div>
    <div class="film-grain" aria-hidden="true"></div>

    <div id="stars" style="position:absolute;inset:0;z-index:20;pointer-events:none"></div>
    <div id="clouds" style="position:absolute;inset:0;z-index:30;pointer-events:none"></div>
    <div class="fog"></div>

    <div id="moon" title="Drag me to reveal the day"><div class="flare"></div></div>
    <div id="sun"><div class="corona"></div></div>
    <div class="sun-band"></div>
    <div class="anam"></div>

    <div id="message" aria-hidden="true"></div>

    <div id="rotTrack"><div id="rotFill"></div></div>

    <button id="clickBtn" aria-hidden="true">CLICK HERE</button>

    <div class="godray" id="godray"></div>
    <div id="cross" aria-hidden="true"></div>

    <div id="birthdayOverlay" aria-hidden="true"></div>
    <div id="happy" aria-hidden="true">🎉 Happy Birthday! 🎉</div>

    <div class="vign"></div>
  </div>

<script>
/* ---------------- CONFIG & REFS ---------------- */
const fullText = "On this calm birthday eve so new, God softly whispers, my plans are made for you.";
const ROTATION_NEEDED = 360;

const stage = document.getElementById('stage');
const moon = document.getElementById('moon');
const sun = document.getElementById('sun');
const sunCorona = sun.querySelector('.corona');
const sunBand = document.querySelector('.sun-band');
const anam = document.querySelector('.anam');
const message = document.getElementById('message');
const starsWrap = document.getElementById('stars');
const cloudsWrap = document.getElementById('clouds');
const clickBtn = document.getElementById('clickBtn');
const cross = document.getElementById('cross');
const godray = document.getElementById('godray');
const rotFill = document.getElementById('rotFill');
const birthdayOverlay = document.getElementById('birthdayOverlay');
const happy = document.getElementById('happy');

let locked = false;
let dragging = false;
let lastX = 0;
let rotationDeg = 0;
let phaseReady = false;
let clickStage = 0; // 0 = before cross, 1 = cross shown (button re-enabled), 2 = birthday final

/* ---------------- Build stars & clouds ---------------- */
function makeStars(n=140){
  for(let i=0;i<n;i++){
    const s = document.createElement('div');
    s.className = 'star';
    s.style.setProperty('--tw', (1.2 + Math.random()*3.4) + 's');
    s.style.left = (Math.random()*100) + '%';
    s.style.top = (Math.random()*75) + '%';
    s.style.opacity = (0.45 + Math.random()*0.6).toFixed(2);
    starsWrap.appendChild(s);
  }
}
function makeClouds(){
  const counts = [4,5];
  counts.forEach((cnt, layerIdx) => {
    for(let i=0;i<cnt;i++){
      const c = document.createElement('div');
      c.className = 'cloud';
      const top = 6 + i*14 + (layerIdx*6) + (Math.random()*8 - 4);
      c.style.top = top + '%';
      c.style.left = (i*22 + (layerIdx*6) + Math.random()*12 - 6) + '%';
      c.style.opacity = 0.26 + layerIdx*0.26 + Math.random()*0.12;
      c.style.transform = 'scale(' + (0.78 + Math.random()*0.8) + ')';
      cloudsWrap.appendChild(c);
    }
  });
}
makeStars();
makeClouds();

/* ---------------- Message letters (hidden) ---------------- */
const letters = [];
for (let i=0;i<fullText.length;i++){
  const span = document.createElement('span');
  span.className = 'letter';
  span.textContent = fullText[i] === ' ' ? '\u00A0' : fullText[i];
  message.appendChild(span);
  letters.push(span);
}

/* ---------------- Shooting stars (soft) ---------------- */
function spawnShooting(){
  const s = document.createElement('div');
  s.className = 'shoot';
  s.style.left = (Math.random()*100) + '%';
  s.style.top = '-6%';
  s.style.opacity = 0.9;
  s.style.transform = 'rotate(' + (10 + Math.random()*30) + 'deg)';
  stage.appendChild(s);
  const duration = 1100 + Math.random()*1600;
  const tx = (Math.random()*1.6 - 0.8)*window.innerWidth;
  s.animate([{transform: s.style.transform + ' translate(0,0)', opacity:1}, {transform: s.style.transform + ` translate(${tx}px, ${window.innerHeight + 200}px)`, opacity:0}], {duration, easing:'cubic-bezier(.2,.7,.2,1)', fill:'forwards'});
  setTimeout(()=>s.remove(), duration+80);
}
setInterval(spawnShooting, 1600);

/* ---------------- Drag handling: left→right only ---------------- */
moon.addEventListener('pointerdown', (e) => {
  if (locked) return;
  dragging = true;
  lastX = e.clientX || (e.touches && e.touches[0].clientX) || 0;
  if (moon.setPointerCapture) try{ moon.setPointerCapture(e.pointerId); } catch(e){}
});
document.addEventListener('pointerup', () => dragging = false);
document.addEventListener('pointermove', (e) => {
  if (!dragging || locked) return;
  const dx = e.clientX - lastX;
  lastX = e.clientX;
  if (dx <= 0) return; // no backward movement
  rotationDeg += dx * 0.85;
  if (rotationDeg >= ROTATION_NEEDED) {
    rotationDeg = ROTATION_NEEDED;
    finishReveal();
  }
  updateByProgress(rotationDeg / ROTATION_NEEDED);
});

/* ---------------- Final reveal of day (show button after hold) ---------------- */
function finishReveal(){
  if (locked) return;
  locked = true;
  updateByProgress(1);
  setTimeout(()=> {
    clickBtn.style.opacity = 1;
    clickBtn.disabled = false;
    clickBtn.focus();
    phaseReady = true;
  }, 1500);
}

/* ---------------- Update visuals by progress (t=0..1) ---------------- */
function updateByProgress(t){
  t = Math.max(0, Math.min(1, t));
  // moon movement & fade
  const deg = t * 360;
  const moonLeft = 12 + t*52;
  moon.style.left = moonLeft + '%';
  moon.style.transform = `translate(-50%,-50%) rotate(${-deg}deg)`;
  moon.style.opacity = `${Math.max(0, 1 - t*1.05)}`;

  // reveal message letters
  const show = Math.floor(t * letters.length);
  for (let i=0;i<letters.length;i++){
    if (i < show){
      letters[i].style.opacity = 1;
      letters[i].style.transform = 'translateY(0)';
      letters[i].style.transitionDelay = (i*6/1000) + 's';
    } else {
      letters[i].style.opacity = 0;
      letters[i].style.transform = 'translateY(12px)';
      letters[i].style.transitionDelay = '0s';
    }
  }
  // message overall fade
  if (t > 0.32) message.style.opacity = Math.min(1, (t - 0.32) * 1.6);

  // sun reveal & movement
  sun.style.opacity = `${Math.min(1, t*1.05)}`;
  const startTop = -260;
  const endTop = -80;
  sun.style.top = `${startTop + (endTop - startTop)*t}px`;
  const scale = 0.6 + 0.8*t;
  sun.style.transform = `scale(${scale})`;
  sunCorona.style.opacity = Math.min(1, t*1.1);
  sunBand.style.opacity = Math.min(1, t*0.95);
  anam.style.opacity = Math.min(1, Math.pow(t,0.9) * 0.95);

  // stars fade
  document.querySelectorAll('.star').forEach(s => {
    s.style.opacity = Math.max(0, parseFloat(s.style.opacity||'1') * (1 - t*1.05));
  });

  // sky warming
  if (t > 0.06){
    const r = Math.min(255, 8 + Math.floor(t*120));
    const g = Math.min(255, 6 + Math.floor(t*115));
    const b = Math.max(0, 60 - Math.floor(t*20));
    document.getElementById('sky').style.background = `linear-gradient(180deg, rgba(8,6,24,1), rgba(${r},${g},${b},1) 60%)`;
  }

  rotFill.style.width = `${Math.min(100, t*100)}%`;

  // subtle stage breathing as daylight completes
  if (t >= 0.95) {
    stage.style.transform = 'scale(1.01)';
    document.querySelector('.vign').style.opacity = 0.65;
  } else {
    stage.style.transform = 'scale(1)';
    document.querySelector('.vign').style.opacity = 0.6;
  }

  if (t === 1) phaseReady = true;
}

/* ---------------- Single click handler — robust 2-stage flow ---------------- */
let firingFireworks = null;
clickBtn.addEventListener('click', async () => {
  if (!phaseReady) return; // only after drag reveal

  if (clickStage === 0) {
    // FIRST CLICK: reveal dominant cross, dim sun, show godray, cinematic camera push
    clickBtn.style.pointerEvents = 'none';
    clickBtn.style.opacity = 0;

    // Delay for breathing
    await delay(540);

    // Reveal cross (dominant)
    cross.style.opacity = 1;
    cross.style.transform = 'translateX(-50%) scale(1.05)';
    godray.style.opacity = 1;

    // Camera push (slow, Nolan)
    stage.style.transition = 'transform 2.6s cubic-bezier(.2,.9,.2,1)';
    stage.style.transform = 'scale(1.06)';

    // Dim sun behind cross (dramatic)
    sun.style.filter = 'brightness(0.32) blur(2px) saturate(0.9)';

    // Keep cross in frame for a cinematic hold
    await delay(2200);

    // Re-enable button so user can trigger birthday phase
    clickBtn.innerText = 'Click Here for Birthday!';
    clickBtn.style.opacity = 1;
    clickBtn.style.pointerEvents = 'auto';
    clickStage = 1;

  } else if (clickStage === 1) {
    // SECOND CLICK: birthday overlay, text, fireworks loop
    clickBtn.style.pointerEvents = 'none';
    clickBtn.style.opacity = 0;

    // Keep cross visible; fade scene subtly behind
    fadeMainSceneForBirthday();

    // Reveal overlay + text
    await delay(600);
    birthdayOverlay.style.opacity = 1;
    await delay(300);
    happy.style.opacity = 1;
    happy.style.transform = 'translate(-50%,-50%) scale(1)';

    // Start fireworks loop
    firingFireworks = setInterval(spawnFireworksBurst, 420);

    // Show final birthday message later
    await delay(1600);
    // (optional) show a smaller final message by adding elements or reusing happy

    clickStage = 2;
  }
});

/* ---------------- Helpers ---------------- */
function delay(ms){ return new Promise(res => setTimeout(res, ms)); }

function fadeMainSceneForBirthday(){
  // gentle fade of main elements but keep cross
  sun.style.transition = 'opacity 1.2s ease, filter 1.2s ease';
  sun.style.opacity = 0.0;
  document.querySelectorAll('.letter').forEach(l => { l.style.opacity = 0; l.style.transform = 'translateY(18px)'; });
  document.querySelectorAll('.star').forEach(s => s.style.opacity = 0);
  moon.style.opacity = 0;
  // tighten grade
  document.querySelector('.grade-overlay').style.opacity = 0.12;
}

/* ---------------- Fireworks burst ---------------- */
function spawnFireworksBurst(){
  const cx = window.innerWidth * (0.22 + Math.random()*0.56);
  const cy = window.innerHeight * (0.18 + Math.random()*0.35);
  const colors = ['#ff0055','#ffd200','#00f7ff','#ff7b00','#c200ff','#7cff6b'];
  const particles = 12 + Math.floor(Math.random()*14);
  for(let i=0;i<particles;i++){
    const p = document.createElement('div');
    p.className = 'fw';
    const c = colors[Math.floor(Math.random()*colors.length)];
    p.style.background = c;
    p.style.left = (cx) + 'px';
    p.style.top = (cy) + 'px';
    document.body.appendChild(p);
    const angle = Math.random()*Math.PI*2;
    const dist = 80 + Math.random()*220;
    const dx = Math.cos(angle)*dist;
    const dy = Math.sin(angle)*dist;
    const dur = 700 + Math.random()*900;
    p.animate([
      { transform: 'translate(0,0) scale(0.3)', opacity:1 },
      { transform: `translate(${dx}px, ${dy}px) scale(1.1)`, opacity:0.25, offset:0.7 },
      { transform: `translate(${dx*1.15}px, ${dy*1.15}px) scale(0.2)`, opacity:0 }
    ], { duration: dur, easing: 'cubic-bezier(.2,.8,.2,1)', fill: 'forwards' });
    setTimeout(()=> p.remove(), dur + 60);
  }
}

/* ---------------- Minor loops: clouds & stars breathing ---------------- */
setInterval(()=> {
  document.querySelectorAll('.cloud').forEach((c, idx) => {
    let left = parseFloat(c.style.left) || 0;
    left += (0.02 + (idx%3)*0.015);
    if (left > 120) left = -40;
    c.style.left = left + '%';
  });
}, 80);

setInterval(()=> {
  document.querySelectorAll('.star').forEach((s,i) => {
    if (parseFloat(s.style.opacity || 1) > 0.02) {
      s.style.transform = `scale(${0.85 + 0.42*Math.abs(Math.sin((Date.now()/1400) + i))})`;
    }
  });
}, 220);

/* ---------------- Sun subtle breathing when visible ---------------- */
setInterval(()=> {
  // little breathe only if sun visible
  const vis = parseFloat(sun.style.opacity || '0');
  if (vis > 0.01) {
    const breathe = 1 + Math.sin(Date.now()/1000) * 0.004 * vis;
    sun.style.transform = `scale(${breathe})`;
    anam.style.transform = `translate(-50%,-50%) rotate(${Math.sin(Date.now()/1200)*0.25}deg) scale(${1 + 0.03*vis})`;
  }
}, 100);

/* ---------------- Initial hint + progressive reveal auto demo (safe) ---------------- */
/* Show sun & message over time to guide user */
setTimeout(()=> { sun.style.opacity = 1; sun.style.top = '-160px'; sun.style.transform = 'scale(0.9)'; }, 600);
setTimeout(()=> { message.style.opacity = 1; }, 1600);
setTimeout(()=> { clickBtn.style.opacity = 1; clickBtn.style.pointerEvents = 'auto'; }, 2600);

/* ---------------- Accessibility: space/enter triggers ---------------- */
window.addEventListener('keydown', (e) => {
  if (e.code === 'Space' || e.key === 'Enter') {
    // trigger primary action according to stage
    clickBtn.click();
  }
});

/* ---------------- Utility small spawn (avoid leak) ---------------- */
function safeSpawnDemoFireworks(){
  // optional, not used continuously here
}

/* ---------------- Done ---------------- */
</script>
</body>
</html>
