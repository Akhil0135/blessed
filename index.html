<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Blue Background with Cross</title>

<style>
    body {
        margin: 0;
        padding: 0;
        background: #00163a; /* Navy Blue */
        height: 100vh;
        overflow: hidden;
        display: flex;
        flex-direction: column;
        align-items: center;
    }

    /* ⭐ Glowing Stars */
    .stars {
        position: absolute;
        width: 100%;
        height: 100%;
        top: 0;
        left: 0;
        background: transparent;
        z-index: 0;
        pointer-events: none;
    }

    .stars span {
        position: absolute;
        width: 3px;
        height: 3px;
        background: white;
        border-radius: 50%;
        box-shadow: 0 0 8px white;
        animation: glow 2s infinite ease-in-out alternate;
    }

    @keyframes glow {
        from { opacity: 0.3; transform: scale(1); }
        to { opacity: 1; transform: scale(1.5); }
    }

    /* ⭐ Your Glowing Cross */
    .cross-img {
        width: 180px;
        margin-top: 20px;
        z-index: 10;
        filter: drop-shadow(0 0 20px white);
    }

    /* ⭐ Button */
    .btn {
        margin-top: 40px;
        padding: 12px 28px;
        background: white;
        color: #00163a;
        border: none;
        border-radius: 8px;
        font-size: 20px;
        font-weight: bold;
        cursor: pointer;
        z-index: 20;
        box-shadow: 0 0 12px white;
        transition: 0.3s ease;
    }

    .btn:hover {
        transform: scale(1.08);
        box-shadow: 0 0 18px white;
    }
</style>
</head>

<body>

<!-- ⭐ STAR FIELD -->
<div class="stars">
    <!-- 40 stars -->
    <script>
        for (let i = 0; i < 40; i++) {
            let s = document.createElement("span");
            s.style.top = Math.random() * 100 + "%";
            s.style.left = Math.random() * 100 + "%";
            s.style.animationDelay = Math.random() * 2 + "s";
            document.querySelector(".stars").appendChild(s);
        }
    </script>
</div>

<!-- ⭐ CROSS YOU PROVIDED -->
<img class="cross-img" src="YOUR_CROSS_IMAGE_URL_HERE" />

<!-- ⭐ CLICK BUTTON -->
<button class="btn">CLICK HERE</button>

</body>
</html>
