<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Cinematic Shield</title>
<style>
    body {
        margin: 0;
        height: 100vh;
        background: radial-gradient(circle at center, #06080f, #000010 80%);
        overflow: hidden;
        position: relative;
        font-family: Arial, sans-serif;
    }

    /* -------- STAR FIELD -------- */
    .star {
        position: absolute;
        width: 2px;
        height: 2px;
        background: white;
        border-radius: 50%;
        opacity: 0.7;
        animation: twinkle 2s infinite ease-in-out alternate;
    }
    @keyframes twinkle {
        0% { opacity: 0.2; transform: scale(0.7); }
        100% { opacity: 1; transform: scale(1.4); }
    }

    /* -------- SHIELD LAYERS (METALLIC) -------- */
    .shield-container {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        width: 280px;
        height: 280px;
    }

    .circle {
        position: absolute;
        border-radius: 50%;
        box-shadow:
            inset 0 0 30px rgba(255,255,255,0.25),
            inset 0 0 60px rgba(255,255,255,0.15),
            0 0 25px rgba(255,255,255,0.2);
    }

    /* Outer Red Ring (Metal Red) */
    .c1 {
        width: 280px;
        height: 280px;
        background: radial-gradient(circle, #b30000, #600000);
        top: 0;
        left: 0;
    }

    /* White Ring */
    .c2 {
        width: 220px;
        height: 220px;
        top: 30px;
        left: 30px;
        background: radial-gradient(circle, #ffffff, #d6d6d6);
    }

    /* Inner Red Ring */
    .c3 {
        width: 160px;
        height: 160px;
        top: 60px;
        left: 60px;
        background: radial-gradient(circle, #b30000, #600000);
    }

    /* Blue Center Plate */
    .c4 {
        width: 100px;
        height: 100px;
        top: 90px;
        left: 90px;
        background: radial-gradient(circle, #1a5fd8, #0b1e4a);
        box-shadow:
            inset 0 0 20px rgba(255,255,255,0.3),
            0 0 20px rgba(0,102,255,0.4);
    }

    /* -------- STAR (METALLIC) -------- */
    .star-icon {
        position: absolute;
        top: 113px;
        left: 113px;
        width: 55px;
        height: 55px;
        background: linear-gradient(135deg, #e3e3e3, #ffffff, #8f8f8f);
        clip-path: polygon(
            50% 0%,
            61% 35%,
            98% 35%,
            68% 57%,
            79% 91%,
            50% 70%,
            21% 91%,
            32% 57%,
            2% 35%,
            39% 35%
        );
        cursor: pointer;
        transition: 0.3s ease-out;
        z-index: 10;
    }

    /* Star Spin */
    .spin {
        animation: spinStar 0.5s linear 6;
    }

    @keyframes spinStar {
        0% { transform: rotate(0deg) scale(1); }
        100% { transform: rotate(360deg) scale(1.1); }
    }

    /* -------- CRACK EFFECT -------- */
    .crack-layer {
        position: absolute;
        width: 280px;
        height: 280px;
        background: url('https://i.imgur.com/0Z8YwFp.png'); /* semi-realistic crack PNG */
        background-size: cover;
        opacity: 0;
        pointer-events: none;
        top: 0;
        left: 0;
        filter: drop-shadow(0 0 8px rgba(255,255,255,0.2));
        transition: opacity 1.2s ease-out;
    }

    .cracked {
        opacity: 1;
    }

    /* Fade Pieces Away */
    .fade-away {
        animation: fadeOut 2s forwards ease-in;
    }
    @keyframes fadeOut {
        to { opacity: 0; transform: scale(1.15); }
    }
</style>
</head>
<body>

<script>
/* -------- STAR FIELD CREATION -------- */
for (let i = 0; i < 120; i++) {
    let s = document.createElement("div");
    s.className = "star";
    s.style.left = Math.random() * window.innerWidth + "px";
    s.style.top = Math.random() * window.innerHeight + "px";
    s.style.animationDelay = (Math.random() * 3) + "s";
    document.body.appendChild(s);
}
</script>

<!-- SHIELD -->
<div class="shield-container" id="shield">
    <div class="circle c1"></div>
    <div class="circle c2"></div>
    <div class="circle c3"></div>
    <div class="circle c4"></div>

    <div class="star-icon" id="star"></div>

    <div class="crack-layer" id="cracks"></div>
</div>

<script>
let star = document.getElementById("star");
let shield = document.getElementById("shield");
let cracks = document.getElementById("cracks");
let cracked = false;

star.addEventListener("click", () => {
    if (cracked) return; // Prevent repeating

    star.classList.add("spin");

    setTimeout(() => {
        star.classList.remove("spin");

        cracks.classList.add("cracked");

        setTimeout(() => {
            shield.classList.add("fade-away");
            cracked = true;
        }, 1000);

    }, 3200);
});
</script>

</body>
</html>
