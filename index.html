<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>IMAX Cinematic Moon-to-Sun</title>

<style>
html, body {
  height: 100%;
  margin: 0;
  background: #000010;
  overflow: hidden;
  font-family: "Cinzel", serif;
}

/* Scene */
#scene { position: relative; width: 100%; height: 100%; }

/* NIGHT SKY */
#sky {
  position: absolute;
  inset: 0;
  background: linear-gradient(to bottom,#030014,#120034 40%,#1a0046 70%);
  transition: background 2.5s ease;
  pointer-events: none;
  z-index: 0;
}

/* MOON */
#moon {
  position: absolute;
  width: 180px;
  height: 180px;
  border-radius: 50%;
  background: #d9d8ff;
  box-shadow: 0 0 100px #c5c4ff, 0 0 200px #b3aaff inset;
  top: 25%;   /* slightly up */
  left: 18%;  /* slightly left */
  transform: translate(-50%, -50%) rotate(0deg);
  cursor: grab;
  transition: transform 0.05s linear;
  z-index: 5;
}

/* SUN */
#sun {
  position: absolute;
  width: 300px;
  height: 300px;
  border-radius: 50%;
  background: radial-gradient(circle, #ffd27f, #ff9a00);
  box-shadow: 0 0 220px #ffb54c, 0 0 400px #ff7b00;
  top: 15%;   /* cinematic top */
  left: 25%;  /* slightly left */
  transform: translate(0px, 0px) scale(1);
  opacity: 0;
  transition: opacity 2s ease, transform 2s ease;
  pointer-events: none;
  z-index: 1;
}

/* MESSAGE */
#msg {
  position: absolute;
  width: 90%;
  text-align: center;
  bottom: 20%;
  font-size: 2rem;
  font-weight: 700;
  color: #ffebff;
  text-shadow: 0 0 30px #d900ff, 0 0 60px #ff00ff;
  letter-spacing: 0.05em;
  white-space: pre-wrap;
  opacity: 1;
  pointer-events: none;
  z-index: 6;
}

/* BUTTON */
#btn {
  position: absolute;
  left: 50%;
  bottom: 10%;
  transform: translateX(-50%);
  background: linear-gradient(to right,#6a00ff,#c200ff);
  color: #fff;
  font-size: 1.3rem;
  padding: 16px 36px;
  border: none;
  border-radius: 20px;
  cursor: pointer;
  box-shadow: 0 0 30px #9400ff, 0 0 50px #c200ff;
  opacity: 0;
  transition: opacity 1.5s ease;
  z-index: 6;
}

/* CHRISTIAN CROSS */
#cross {
  position: absolute;
  left: 50%;
  top: 15%;
  transform: translateX(-50%) scale(0.8) rotate(0deg);
  opacity: 0;
  z-index: 10;
}

.cross-vertical, .cross-horizontal {
  position: absolute;
  left: 50%;
  transform: translateX(-50%);
  background: linear-gradient(to bottom,#ffebaa,#ff8b00);
  box-shadow: 0 0 50px #ff9a00, 0 0 100px #ffcc66;
}

.cross-vertical { width: 30px; height: 260px; }
.cross-horizontal { width: 180px; height: 30px; top: calc(260px * 0.35); }

/* DAY SKY */
.daySky {
  background: linear-gradient(to bottom,#52d3ff,#ffe6ab 60%,#ffd37c 90%);
  transition: background 2.5s ease;
}
</style>
</head>

<body>
<div id="scene">
  <div id="sky"></div>
  <div id="moon"></div>
  <div id="sun"></div>
  <div id="msg"></div>
  <button id="btn">Click Here</button>
  <div id="cross">
    <div class="cross-vertical"></div>
    <div class="cross-horizontal"></div>
  </div>
</div>

<script>
const moon = document.getElementById('moon');
const sun = document.getElementById('sun');
const sky = document.getElementById('sky');
const msgEl = document.getElementById('msg');
const btn = document.getElementById('btn');
const cross = document.getElementById('cross');

const fullMsg = "On this calm birthday eve so new, God softly whispers, my plans are made for you.";
let isDragging = false;
let rotation = 0;
let evolutionDone = false;

// Only allow pointer on moon
moon.addEventListener('pointerdown', (e)=>{ isDragging=true; });
document.addEventListener('pointerup', ()=>{ isDragging=false; });

document.addEventListener('pointermove', (e)=>{
  if(!isDragging) return;

  // Calculate rotation based on pointer movement around moon center
  const rect = moon.getBoundingClientRect();
  const cx = rect.left + rect.width/2;
  const cy = rect.top + rect.height/2;
  const dx = e.clientX - cx;
  const dy = e.clientY - cy;

  let angle = Math.atan2(dy, dx)*180/Math.PI + 90;
  if(angle < 0) angle += 360;
  rotation = Math.min(angle, 360);

  // Moon rotation
  moon.style.transform = `translate(-50%,-50%) rotate(${rotation}deg)`;

  // Reveal message parallel to rotation
  const lettersToShow = Math.floor((rotation/360) * fullMsg.length);
  msgEl.textContent = fullMsg.substring(0, lettersToShow);

  // Sun rises along rotation
  const p = rotation/360;
  sun.style.opacity = p;
  sun.style.transform = `translate(0px, ${-60*p}px) scale(${0.35 + p*0.65})`;

  // Sky transition
  if(p>0.05) sky.classList.add('daySky');

  // Button appears after full rotation
  if(p>=1 && !evolutionDone){
    evolutionDone = true;
    setTimeout(()=>{ btn.style.opacity=1; },500);
  }
});

// Button click → cinematic cross reveal
btn.addEventListener('click', ()=>{
  btn.style.opacity=0;
  setTimeout(()=>btn.style.display="none",700);

  cross.style.opacity=1;
  cross.style.transform = "translateX(-50%) scale(1.3) rotate(360deg)";
  cross.style.transition = "transform 2.2s ease, opacity 2.2s ease";

  setTimeout(()=>{
    cross.style.transform = "translateX(-50%) scale(1) rotate(0deg)";
  },2200);
});
</script>
</body>
</html>
