<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Phase 1 — IMAX Cinematic</title>

<style>
html, body {
    margin: 0;
    padding: 0;
    overflow: hidden;
    background: #000;
}

/* 3D Stars canvas fills screen */
canvas {
    display: block;
}

/* Cinematic message style */
#message {
    position: absolute;
    bottom: 80px;
    width: 100%;
    text-align: center;
    font-size: 26px;
    font-weight: 600;
    color: #ffd27f; /* Soft golden */
    letter-spacing: 2px;
    text-shadow: 0 0 5px #d9a441;
    opacity: 0;
    transition: opacity 1.5s ease;
}

/* Sun */
#sun {
    position: absolute;
    width: 260px;
    height: 260px;
    border-radius: 50%;
    background: radial-gradient(circle, #fff7c0 0%, #ffcc33 40%, #d68b00 70%, #000 100%);
    box-shadow: 0 0 50px #ffb300;
    top: -300px;
    right: -300px;
    opacity: 0;
    transition: all 2.5s ease-in-out;
}

/* Moon container */
#moon {
    position: absolute;
    width: 200px;
    height: 200px;
    left: 40px;
    top: 40px;
    border-radius: 50%;
    cursor: grab;

    /* Cinematic Silver Moon Texture (no image needed) */
    background: radial-gradient(circle at 30% 30%, 
        #d9d9d9 0%, 
        #c0c0c0 20%, 
        #9a9a9a 45%, 
        #6d6d6d 70%, 
        #2a2a2a 100%);

    box-shadow: 
        0 0 15px rgba(180,180,255,0.8), 
        inset -20px -20px 40px rgba(0,0,0,0.5);

    transition: box-shadow 0.3s ease;
}

/* Ambient IMAX Blue Lighting */
#ambient {
    position: absolute;
    width: 100%;
    height: 100%;
    background: radial-gradient(circle at 50% 70%, rgba(30,60,150,0.25), transparent 70%);
    pointer-events: none;
}

/* Instruction for user */
#instruction {
    position: absolute;
    top: 20px;
    width: 100%;
    text-align: center;
    font-size: 22px;
    color: #fff;
    text-shadow: 0 0 8px #000;
    opacity: 0.9;
    pointer-events: none;
}
</style>
</head>

<body>

<div id="instruction">Drag the moon to reveal the message</div>

<canvas id="stars"></canvas>

<div id="ambient"></div>

<div id="moon"></div>

<div id="sun"></div>

<div id="message">ON THIS CALM BIRTHDAY EVE SO NEW, GOD SOFTLY WHISPERS, MY PLANS ARE MADE FOR YOU.</div>

<audio id="whoosh" src="https://cdn.pixabay.com/download/audio/2021/09/16/audio_4f1c1c9f28.mp3?filename=woosh-14795.mp3"></audio>

<script>
/* ------------------------------
   STARFIELD (3D TWINKLING)
--------------------------------*/
const canvas = document.getElementById("stars");
const ctx = canvas.getContext("2d");

function resize() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
}
resize();
window.onresize = resize;

let stars = [];
for (let i = 0; i < 250; i++) {
    stars.push({
        x: Math.random() * canvas.width,
        y: Math.random() * canvas.height,
        z: Math.random() * 1.5 + 0.5,
        tw: Math.random() * 0.02 + 0.005
    });
}

function drawStars() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    stars.forEach(s => {
        let glow = (Math.sin(Date.now() * s.tw) + 1) * 0.5;
        ctx.fillStyle = `rgba(255,255,255,${glow})`;
        ctx.beginPath();
        ctx.arc(s.x, s.y, s.z, 0, Math.PI * 2);
        ctx.fill();
    });
}

/* ------------------------------
   DRAGGING MOON
--------------------------------*/
const moon = document.getElementById("moon");
const message = document.getElementById("message");
const sun = document.getElementById("sun");
const whoosh = document.getElementById("whoosh");

let dragging = false;
let offsetX, offsetY;

let revealIndex = 0;
const fullMsg = message.innerText;
message.innerText = ""; // start hidden

moon.addEventListener("mousedown", e => {
    dragging = true;
    offsetX = e.clientX - moon.offsetLeft;
    offsetY = e.clientY - moon.offsetTop;
    moon.style.cursor = "grabbing";

    whoosh.currentTime = 0;
    whoosh.play(); // soft whoosh
});

document.addEventListener("mouseup", () => {
    dragging = false;
    moon.style.cursor = "grab";
});

document.addEventListener("mousemove", e => {
    if (!dragging) return;

    moon.style.left = (e.clientX - offsetX) + "px";
    moon.style.top = (e.clientY - offsetY) + "px";

    // Reveal message letter-by-letter
    if (revealIndex < fullMsg.length) {
        message.style.opacity = 1;
        message.innerText = fullMsg.substring(0, revealIndex++);
    }

    // Fade stars gradually
    stars.forEach(s => s.tw = 0); // stops twinkling
    ctx.globalAlpha -= 0.01;
    if (ctx.globalAlpha < 0) ctx.globalAlpha = 0;

    // When message fully revealed → Sun enters
    if (revealIndex >= fullMsg.length) {
        moon.style.opacity = 0;
        setTimeout(() => {
            sun.style.opacity = 1;
            sun.style.top = "40px";
            sun.style.right = "40px";

            stars = []; // stars fade away completely
        }, 800);
    }
});

/* ------------------------------
   ANIMATION LOOP
--------------------------------*/
function animate() {
    drawStars();
    requestAnimationFrame(animate);
}
animate();
</script>

</body>
</html>
