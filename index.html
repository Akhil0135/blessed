<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>IMAX Captain Shield</title>

<style>
    html,body{
        margin:0;
        height:100%;
        background:#02040F;
        overflow:hidden;
        font-family:"Cinzel",serif;
    }

    /* ---------- Background ---------- */
    .bg-stars{
        position:absolute;
        inset:0;
        background:
            radial-gradient(circle at center, #0A0F2F 0%, #02040F 70%),
            url('https://i.imgur.com/2JY9Z4b.png');
        background-size:cover;
        animation: spaceFloat 20s linear infinite;
        opacity:0.70;
    }
    @keyframes spaceFloat{
        0%{transform:scale(1);}
        50%{transform:scale(1.05);}
        100%{transform:scale(1);}
    }

    /* ---------- Metallic Shield ---------- */
    .shield{
        position:absolute;
        top:50%;
        left:50%;
        width:280px;
        height:280px;
        transform:translate(-50%,-50%);
        border-radius:50%;
        background:
           radial-gradient(circle, #7A0B17 0%, #CC1B2C 60%, #5A0008 100%); /* Outer Red */
        box-shadow:0 0 40px #FF0011AA inset,0 0 40px #FF0020AA;
        display:flex;
        justify-content:center;
        align-items:center;
        transition:opacity 1s;
    }

    .ring2{
        width:70%;
        height:70%;
        border-radius:50%;
        background:radial-gradient(circle,#fff,#ccc);
        box-shadow:0 0 20px #ffffffaa inset;
        display:flex;
        justify-content:center;
        align-items:center;
    }

    .ring3{
        width:65%;
        height:65%;
        border-radius:50%;
        background:radial-gradient(circle,#9A0E19,#D81828,#6A0009);
        box-shadow:0 0 18px #ff1133aa inset;
        display:flex;
        justify-content:center;
        align-items:center;
    }

    .core{
        width:45%;
        height:45%;
        border-radius:50%;
        background:radial-gradient(circle,#0A2A7F,#1B4CFF,#00153F);
        box-shadow:0 0 18px #4477FFaa inset;
        display:flex;
        justify-content:center;
        align-items:center;
        position:relative;
        overflow:visible;
    }

    /* ---------- Star (metallic, center) ---------- */
    .star{
        width:80px;
        height:80px;
        background:url('https://i.imgur.com/1gZCqLe.png');
        background-size:contain;
        position:absolute;
        transform-origin:center;
        cursor:pointer;
        filter:drop-shadow(0 0 8px #88aaff);
    }

    /* star spin */
    @keyframes spinQuick{
        0%{transform:rotate(0deg) scale(1);}
        100%{transform:rotate(1440deg) scale(1.08);}
    }

    /* ---------- Crack visual ---------- */
    .crack{
        position:absolute;
        inset:0;
        background:url('https://i.imgur.com/S5PFx9B.png');
        background-size:cover;
        filter:brightness(2);
        opacity:0;
        transition:opacity 1s;
    }

    /* ---------- PRINCE Letters ---------- */
    .letter{
        position:absolute;
        font-size:48px;
        font-weight:700;
        color:#ffffff;
        text-shadow:0 0 12px #88aaff,0 0 24px #3355ff;
        opacity:0;
        transform:translate(-50%,-50%) scale(0.2);
        left:50%;
        top:50%;
        pointer-events:none;
    }

    @keyframes burst{
        0%{opacity:0;transform:translate(-50%,-50%) scale(0.2);}
        50%{opacity:1;transform:translate(-50%,-80%) scale(1.3);}
        100%{opacity:1;transform:translate(-50%,400%) scale(1);}
    }

    /* bottom settle area */
    .bottom-row{
        position:absolute;
        bottom:40px;
        left:50%;
        transform:translateX(-50%);
        display:flex;
        gap:20px;
    }

    .bottom-letter{
        font-size:48px;
        font-weight:700;
        color:#fff;
        opacity:0;
        text-shadow:0 0 12px #88aaff,0 0 24px #4477ff;
        transition:opacity 1.2s;
    }

</style>
</head>

<body>

<div class="bg-stars"></div>

<!-- Shield -->
<div class="shield" id="shield">
    <div class="ring2">
        <div class="ring3">
            <div class="core">
                <div class="star" id="star"></div>
                <div class="crack" id="crack"></div>
            </div>
        </div>
    </div>
</div>

<!-- PRINCE letters will settle here -->
<div class="bottom-row" id="bottomRow"></div>

<script>
let cracked = false;
let spinning = false;
let clickIndex = 0;
const letters = ["P","R","I","N","C","E"];

const star = document.getElementById("star");
const shield = document.getElementById("shield");
const crack = document.getElementById("crack");
const bottomRow = document.getElementById("bottomRow");

/* ---------- Star Click Logic ---------- */
star.onclick = () => {
    if(spinning) return;
    spinning = true;

    /* Spin first */
    star.style.animation = "spinQuick 1s ease-out";

    setTimeout(()=>{

        star.style.animation = "none";

        // FIRST CLICK EVER → CRACK SHIELD
        if(!cracked){
            cracked = true;

            crack.style.opacity = 1;   // show crack

            setTimeout(()=>{
                shield.style.opacity = 0;  // fade shield away
            },1200);

        } else {
            // After cracking → spawn letters
            spawnLetter();
        }

        spinning = false;

    },1000);
};


/* ---------- Letter Spawn + Settle ---------- */
function spawnLetter(){
    if(clickIndex >= letters.length) return;

    const lt = document.createElement("div");
    lt.className = "letter";
    lt.innerText = letters[clickIndex];
    document.body.appendChild(lt);

    // animate
    lt.style.animation = "burst 1.6s ease-out forwards";

    // settle
    setTimeout(()=>{
        lt.remove();

        const b = document.createElement("div");
        b.className = "bottom-letter";
        b.innerText = letters[clickIndex];
        bottomRow.appendChild(b);

        setTimeout(()=>{ b.style.opacity = 1; },50);

    },1500);

    clickIndex++;
}
</script>

</body>
</html>
