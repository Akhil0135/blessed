<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>IMAX Phase 1 — Night Sky & Moon</title>
<style>
    html, body {
        margin: 0;
        padding: 0;
        overflow: hidden;
        background: #000;
    }
    canvas {
        display: block;
    }
</style>
</head>
<body>
<canvas id="c"></canvas>

<script>
const canvas = document.getElementById("c");
const ctx = canvas.getContext("2d");

function resize() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
}
resize();
window.onresize = resize;

// ------------ CAMERA DRIFT -------------
let driftX = 0, driftY = 0, zoom = 1;

// ------------ STARS -------------
const starCount = 200;
const stars = [];

for(let i=0;i<starCount;i++){
    stars.push({
        x: Math.random()*canvas.width,
        y: Math.random()*canvas.height,
        size: Math.random()*1.2+0.3,
        twinkle: Math.random()*0.02+0.002,
        baseAlpha: Math.random()*0.5+0.3
    });
}

// ------------ MOON -------------
const moon = {
    x: canvas.width*0.15,
    y: canvas.height*0.15,
    radius: Math.min(canvas.width, canvas.height)*0.08,
};

// ------------ DRAW FUNCTIONS -------------
function drawStars() {
    stars.forEach(s => {
        const alpha = s.baseAlpha + Math.sin(Date.now()*s.twinkle)*0.5;
        ctx.fillStyle = `rgba(255,255,255,${alpha})`;
        ctx.beginPath();
        ctx.arc(s.x, s.y, s.size, 0, Math.PI*2);
        ctx.fill();
    });
}

function drawMoon() {
    const gradient = ctx.createRadialGradient(moon.x, moon.y, moon.radius*0.3, moon.x, moon.y, moon.radius);
    gradient.addColorStop(0, 'rgba(255,255,230,1)');
    gradient.addColorStop(0.5, 'rgba(255,255,210,0.6)');
    gradient.addColorStop(1, 'rgba(255,255,210,0)');
    ctx.fillStyle = gradient;
    ctx.beginPath();
    ctx.arc(moon.x, moon.y, moon.radius, 0, Math.PI*2);
    ctx.fill();
}

// ------------ ANIMATION -------------
function animate() {
    // Cinematic dark gradient background
    const bg = ctx.createLinearGradient(0,0,0,canvas.height);
    bg.addColorStop(0,'#000010');
    bg.addColorStop(1,'#000022');
    ctx.fillStyle = bg;
    ctx.fillRect(0,0,canvas.width,canvas.height);

    // Camera drift
    driftX = Math.sin(Date.now()*0.0002)*20;
    driftY = Math.cos(Date.now()*0.00015)*15;
    zoom = 1 + Math.sin(Date.now()*0.0001)*0.02;
    ctx.save();
    ctx.translate(driftX, driftY);
    ctx.scale(zoom, zoom);

    // Draw stars and moon
    drawStars();
    drawMoon();

    ctx.restore();

    requestAnimationFrame(animate);
}

animate();
</script>
</body>
</html>
