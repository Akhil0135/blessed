<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Phase 4 — HAPPY BIRTHDAY PRINCE with Cartoons</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  body { margin:0; overflow:hidden; background:#000; }
  canvas { display:block; }
</style>
</head>
<body>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/examples/js/loaders/FontLoader.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/examples/js/geometries/TextGeometry.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/examples/js/loaders/TextureLoader.js"></script>

<script>
let scene = new THREE.Scene();
let camera = new THREE.PerspectiveCamera(60, window.innerWidth/window.innerHeight, 0.1, 3000);
camera.position.set(0, 60, 300);

let renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(window.devicePixelRatio);
document.body.appendChild(renderer.domElement);

// ------- Galaxy Stars -------
let starGeo = new THREE.BufferGeometry();
let starCount = 1200;
let starPositions = new Float32Array(starCount * 3);
for (let i = 0; i < starCount * 3; i++) starPositions[i] = (Math.random() - 0.5) * 2500;
starGeo.setAttribute('position', new THREE.BufferAttribute(starPositions, 3));
let starMat = new THREE.PointsMaterial({ color: 0xffffff, size: 2 });
let stars = new THREE.Points(starGeo, starMat);
scene.add(stars);

// ------- Lights -------
scene.add(new THREE.AmbientLight(0xffffff, 0.4));
let pointLight = new THREE.PointLight(0xffddaa, 2, 2000);
pointLight.position.set(80, 120, 80);
scene.add(pointLight);

// ------- Main Text -------
let textMesh = null;
const loader = new THREE.FontLoader();
loader.load("https://threejs.org/examples/fonts/helvetiker_regular.typeface.json", (font) => {
    const textGeo = new THREE.TextGeometry("HAPPY BIRTHDAY PRINCE", {
        font: font,
        size: 20,
        height: 4,
        curveSegments: 12,
        bevelEnabled: true,
        bevelThickness: 2,
        bevelSize: 1,
        bevelSegments: 5
    });
    textGeo.center();
    const textMat = new THREE.MeshStandardMaterial({ color: 0xffe066, emissive: 0xffbb33, metalness: 0.7, roughness: 0.25 });
    textMesh = new THREE.Mesh(textGeo, textMat);
    textMesh.position.y = 0;
    scene.add(textMesh);
});

// ------- Load Cartoon Textures -------
let cartoonFiles = [
    "/mnt/data/a0a2d1e6-3158-499d-99fd-c3b481fac7a6.png", // Mickey
    "/mnt/data/833fb31c-098c-4ad2-a223-b85154bd69a1.png", // Tom & Jerry
    "/mnt/data/235de06b-1304-4318-8f28-4cd8b9d9e416.png"  // Space Shuttle
];
let cartoons = [];

cartoonFiles.forEach(file => {
    new THREE.TextureLoader().load(file, tex => {
        const geo = new THREE.PlaneGeometry(30, 30);
        const mat = new THREE.MeshBasicMaterial({ map: tex, transparent: true });
        const mesh = new THREE.Mesh(geo, mat);
        mesh.position.set(
            (Math.random()-0.5)*500,
            (Math.random()-0.5)*300,
            (Math.random()-0.5)*500
        );
        mesh.rotation.y = Math.random() * Math.PI * 2;
        scene.add(mesh);
        cartoons.push(mesh);
    });
});

// -------- Camera ORBITING the scene --------
let angle = 0;
function animate() {
    requestAnimationFrame(animate);

    stars.rotation.y += 0.0004;
    stars.rotation.x += 0.0001;

    if(textMesh){
        angle += 0.0018;
        camera.position.x = Math.sin(angle)*300;
        camera.position.z = Math.cos(angle)*300;
        camera.lookAt(0, 20, 0);
    }

    renderer.render(scene, camera);
}

animate();

// -------- Responsive --------
window.addEventListener("resize", () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
});
</script>

</body>
</html>
