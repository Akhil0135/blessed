<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>IMAX — Nolan Cosmic • Shield → Star → PRINCE</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#000006;font-family:Inter,system-ui,Segoe UI,Roboto,'Helvetica Neue',Arial;color:#fff;overflow:hidden}
.stage{position:fixed;inset:0;display:grid;place-items:center;overflow:hidden}
.background{position:absolute;inset:0;z-index:1;overflow:hidden}
.nebula-layer{position:absolute;inset:-40%;mix-blend-mode:screen;filter:blur(160px) saturate(2.2);opacity:1}
.nebula1{background:radial-gradient(circle at 20% 40%, rgba(255,70,120,0.9), transparent 40%);animation:nebulaDrift 140s linear infinite;}
.nebula2{background:radial-gradient(circle at 80% 60%, rgba(70,130,255,0.8), transparent 45%);animation:nebulaDrift 180s linear infinite;}
.nebula3{background:radial-gradient(circle at 50% 50%, rgba(90,200,255,0.6), transparent 50%);animation:nebulaDrift 220s linear infinite;}
@keyframes nebulaDrift{0%{transform:translate(0,0)}50%{transform:translate(200px,-140px) scale(1.12)}100%{transform:translate(0,0)}}
#dynamic-stars-container{position:absolute;inset:0;z-index:3;pointer-events:none}
.tw-star{position:absolute;width:2px;height:2px;background:#fff;border-radius:50%;opacity:0.15;filter:blur(.2px);animation:twinkleStar 2.6s infinite ease-in-out}
@keyframes twinkleStar{0%{opacity:0.08;transform:scale(1)}50%{opacity:1;transform:scale(1.8)}100%{opacity:0.12;transform:scale(1)}}
.stars{position:absolute;inset:0;z-index:2;pointer-events:none;background-image:
radial-gradient(#fff 1.1px, transparent 1px),
radial-gradient(#fff 0.8px, transparent 1px);
background-size:420px 420px,130px 130px;filter:blur(.45px);opacity:0.9;}
.particles{position:absolute;inset:0;z-index:4;pointer-events:none}
.particle{position:absolute;width:3px;height:3px;background:#fff;border-radius:50%;opacity:0.35;animation:particleDrift linear infinite}
@keyframes particleDrift{0%{transform:translate(0,0)}100%{transform:translate(var(--x),var(--y))}}
.shield-wrap{position:relative;z-index:10;display:grid;place-items:center;width:58vmin;height:58vmin;pointer-events:none}
.shield-svg{width:100%;height:100%;transform-origin:center center;pointer-events:none}
#starGroup{pointer-events:auto}
#shield-star{transform-box:fill-box;transform-origin:center center;cursor:pointer;fill:#bdbdbd;pointer-events:auto;transition:transform .6s, filter .3s}
.sonic-wave{position:absolute;left:50%;top:50%;width:4vmin;height:4vmin;border-radius:50%;border:2px solid rgba(255,255,255,0.12);pointer-events:none;transform:translate(-50%,-50%) scale(0);animation:sonicPulse 2.4s cubic-bezier(.2,.9,.2,1) forwards;z-index:12}
@keyframes sonicPulse{0%{transform:translate(-50%,-50%) scale(0);opacity:0.9}30%{transform:translate(-50%,-50%) scale(1.3);opacity:0.55}60%{transform:translate(-50%,-50%) scale(2.2);opacity:0.35}100%{transform:translate(-50%,-50%) scale(3.3);opacity:0}}
.shard{filter:drop-shadow(0 0 10px rgba(255,255,255,0.06));mix-blend-mode:screen}
.spark{position:absolute;width:3px;height:3px;border-radius:50%;background:rgba(255,200,100,1);pointer-events:none;opacity:1;transform:translate(-50%,-50%);z-index:12;transition:opacity .9s linear}
.letters-layer{position:fixed;left:0;right:0;bottom:6vh;height:18vh;pointer-events:none;z-index:11;display:flex;justify-content:center;align-items:flex-end;gap:2.4vw}
.letter{font-size:6.5vmin;font-weight:900;line-height:1;display:inline-block;position:fixed;transform:translate(-50%,-50%) scale(0.8);opacity:0;-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;text-shadow:0 0 8px rgba(0,0,0,0.6);transition:opacity .8s ease, transform 1.2s cubic-bezier(.2,.9,.2,1)}
.letter.metal{background-image:linear-gradient(120deg,#ff4d4d 0%, #ff7777 30%, #002b76 70%, #003366 100%);-webkit-text-stroke:0.6px rgba(0,0,0,0.35);filter:drop-shadow(0 6px 18px rgba(0,0,0,0.6))}
.letter.show{opacity:1;transform:translate(-50%,-50%) scale(1)}
@media (max-width:600px){.letter{font-size:10vmin}.letters-layer{bottom:3vh;height:26vh;gap:1.2vw}}
</style>
</head>
<body>
<div class="stage">
  <div class="background">
    <div class="nebula-layer nebula1"></div>
    <div class="nebula-layer nebula2"></div>
    <div class="nebula-layer nebula3"></div>
    <div id="dynamic-stars-container"></div>
    <div class="stars"></div>
    <div class="particles"></div>
  </div>
  <div class="shield-wrap" aria-hidden="true">
    <svg class="shield-svg" viewBox="0 0 200 200" role="img" aria-label="shield">
      <defs>
        <radialGradient id="metalRed" cx="50%" cy="50%" r="50%"><stop offset="0%" stop-color="#ff4d4d"/><stop offset="100%" stop-color="#990000"/></radialGradient>
        <radialGradient id="metalWhite" cx="50%" cy="50%" r="50%"><stop offset="0%" stop-color="#ffffff"/><stop offset="100%" stop-color="#cccccc"/></radialGradient>
        <radialGradient id="metalBlue" cx="50%" cy="50%" r="50%"><stop offset="0%" stop-color="#4d90ff"/><stop offset="100%" stop-color="#003366"/></radialGradient>
      </defs>
      <g id="rings" transform="translate(100,100)">
        <circle r="92" fill="url(#metalRed)"/>
        <circle r="76" fill="url(#metalWhite)"/>
        <circle r="56" fill="url(#metalRed)"/>
        <circle r="36" fill="url(#metalBlue)"/>
      </g>
      <g id="starGroup" transform="translate(100,100)">
        <polygon id="shield-star" points="0,-28 6,-8 26,-6 10,6 14,26 0,14 -14,26 -10,6 -26,-6 -6,-8" fill="#bdbdbd"/>
      </g>
    </svg>
  </div>
</div>
<div class="letters-layer" id="lettersLayer" aria-hidden="true"></div>

<script>
// Stars
(function createStars(){
  const container=document.getElementById('dynamic-stars-container');
  for(let i=0;i<140;i++){
    const s=document.createElement('div');
    s.className='tw-star';
    s.style.left=(Math.random()*100)+'%';
    s.style.top=(Math.random()*100)+'%';
    s.style.animationDelay=(Math.random()*3)+'s';
    s.style.opacity=(0.05 + Math.random()*0.6).toFixed(2);
    const sz = (0.8 + Math.random()*2.2)+'px';
    s.style.width = sz; s.style.height = sz;
    s.style.filter = 'blur(' + (Math.random()*0.6) + 'px)';
    container.appendChild(s);
  }
})();

// Particles
(function createParticles(){
  const ct=document.querySelector('.particles');
  for(let i=0;i<80;i++){
    const p=document.createElement('div');
    p.className='particle';
    p.style.left=(Math.random()*100)+'%';
    p.style.top=(Math.random()*100)+'%';
    p.style.setProperty('--x', (Math.random()*700 - 350) + 'px');
    p.style.setProperty('--y', (Math.random()*500 - 250) + 'px');
    p.style.animationDuration = (80 + Math.random()*160) + 's';
    ct.appendChild(p);
  }
})();

// Main logic
const star = document.getElementById('shield-star');
const rings = document.getElementById('rings');
const shieldSVG = document.querySelector('.shield-svg');
const lettersLayer = document.getElementById('lettersLayer');
let lettersRevealed = false;

// Shooting Star
function shootStar(){
  const s = document.createElement('div');
  s.style.position='fixed';
  s.style.width='12px'; s.style.height='12px';
  s.style.background='radial-gradient(circle, #fff 0%, #fff0 70%)';
  s.style.borderRadius='50%';
  s.style.top='0px';
  s.style.left='50%';
  s.style.transform='translateX(-50%)';
  s.style.zIndex=15;
  s.style.boxShadow='0 0 12px 4px #fff';
  document.body.appendChild(s);
  const endY = window.innerHeight/2;
  const endX = window.innerWidth/2;
  const duration = 1200;
  s.animate([{top:'0px', left:'50%'}, {top:endY+'px', left:endX+'px'}], {duration, easing:'cubic-bezier(.2,.9,.2,1)'}).onfinish = ()=>{
    s.remove();
    shieldHit();
  };
}
function shieldHit(){
  shatterShield();
  spawnSonicWaves(5);
  spawnSparks(30);
  revealLettersFromStar();
}

// Shatter shield
function shatterShield(){
  if(!rings) return;
  rings.style.opacity = 0;
  const layers = [{r:92,fill:'url(#metalRed)',slices:10},{r:76,fill:'url(#metalWhite)',slices:8},{r:56,fill:'url(#metalRed)',slices:8},{r:36,fill:'url(#metalBlue)',slices:6}];
  const fragRoot = document.createElementNS('http://www.w3.org/2000/svg','g');
  fragRoot.setAttribute('id','fragRoot');
  shieldSVG.appendChild(fragRoot);
  layers.forEach(layer=>{
    for(let i=0;i<layer.slices;i++){
      const piece = document.createElementNS('http://www.w3.org/2000/svg','path');
      const a1 = i*(360/layer.slices), a2 = a1+(360/layer.slices);
      const R=layer.r, r=layer.r*0.62;
      const x1=r*Math.cos(a1*Math.PI/180), y1=r*Math.sin(a1*Math.PI/180);
      const x2=R*Math.cos(a1*Math.PI/180), y2=R*Math.sin(a1*Math.PI/180);
      const x3=R*Math.cos(a2*Math.PI/180), y3=R*Math.sin(a2*Math.PI/180);
      const x4=r*Math.cos(a2*Math.PI/180), y4=r*Math.sin(a2*Math.PI/180);
      const d=`M ${x1} ${y1} L ${x2} ${y2} A ${R} ${R} 0 0 1 ${x3} ${y3} L ${x4} ${y4} A ${r} ${r} 0 0 0 ${x1} ${y1}`;
      piece.setAttribute('d',d);
      piece.setAttribute('fill',layer.fill);
      piece.setAttribute('class','shard');
      piece.style.transformOrigin = '100px 100px';
      piece.style.transition = 'transform 1.6s cubic-bezier(.2,.9,.2,1), opacity 1.2s ease-out, filter 1.2s';
      fragRoot.appendChild(piece);
      setTimeout(()=>{
        const dx=(Math.random()-0.5)*(120+Math.random()*500);
        const dy=(Math.random()-0.5)*(80+Math.random()*420);
        const rot=(Math.random()-0.5)*1080;
        piece.style.transform=`translate(${dx}px,${dy}px) rotate(${rot}deg) scale(0.88)`;
        piece.style.filter='drop-shadow(0 0 12px rgba(255,255,255,0.05))';
        setTimeout(()=>piece.style.opacity=0,850+Math.random()*300);
      },50+Math.random()*260);
    }
  });
  setTimeout(()=>{try{rings.remove();}catch(e){}},1800);
  setTimeout(()=>{try{fragRoot.remove();}catch(e){}},3200);
}

// Waves & Sparks
function spawnSonicWaves(count=5){for(let i=0;i<count;i++){const w=document.createElement('div');w.className='sonic-wave';w.style.animationDelay=(i*0.14)+'s';document.body.appendChild(w);setTimeout(()=>w.remove(),2700);}}
function spawnSparks(count=10){for(let i=0;i<count;i++){const s=document.createElement('div');s.className='spark';s.style.left=(window.innerWidth/2+(Math.random()-0.5)*260)+'px';s.style.top=(window.innerHeight/2+(Math.random()-0.5)*220)+'px';const dx=(Math.random()-0.5)*220,dy=(Math.random()-0.5)*200;s.style.transform=`translate(0,0)`;s.style.opacity=1;document.body.appendChild(s);setTimeout(()=>{s.style.transition='transform 0.9s cubic-bezier(.2,.9,.2,1), opacity 0.9s linear';s.style.transform=`translate(${dx}px,${dy}px) scale(.2)`;s.style.opacity=0;},40+Math.random()*60);setTimeout(()=>{try{s.remove()}catch(e){}},1100);}}

// Letters
function revealLettersFromStar(){
  if(lettersRevealed) return; lettersRevealed=true;
  const letters = ['P','R','I','N','C','E'];
  lettersLayer.innerHTML='';
  const centerX = window.innerWidth/2, centerY = window.innerHeight/2;
  const finalY = window.innerHeight - Math.max(80, window.innerHeight*0.16);
  letters.forEach((ch,i)=>{
    const d=document.createElement('div');
    d.className='letter metal';
    d.textContent = ch;
    d.style.left = centerX + 'px';
    d.style.top = centerY + 'px';
    lettersLayer.appendChild(d);
    setTimeout(()=>{
      const offsetX = (i - (letters.length-1)/2) * 90;
      d.style.transform = `translate(${offsetX}px, ${finalY - centerY}px) scale(1)`;
      d.classList.add('show');
    }, i*150);
  });
}

// Launch the shooting star after 1s
setTimeout(shootStar, 1000);
</script>
</body>
</html>
