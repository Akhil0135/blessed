<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Cinematic Night Sky</title>

<style>
    body {
        margin: 0;
        overflow: hidden;
        background: radial-gradient(#00111f, #000814, #000);
        font-family: 'Poppins', sans-serif;
    }

    /* Twinkling stars background */
    .stars {
        position: absolute;
        width: 100%;
        height: 100%;
        background: transparent url('https://i.imgur.com/0XbK4Q5.png') repeat;
        animation: twinkle 7s infinite;
        opacity: 0.5;
        z-index: 1;
    }

    @keyframes twinkle {
        0%, 100% { opacity: .4; }
        50% { opacity: .8; }
    }

    /* Aurora layer */
    .aurora {
        position: absolute;
        width: 100%;
        height: 100%;
        background: url('https://i.imgur.com/6uGq9iG.png');
        background-size: cover;
        opacity: 0.25;
        animation: aurora-move 14s ease-in-out infinite alternate;
        z-index: 2;
    }

    @keyframes aurora-move {
        from { transform: translateY(0px); }
        to { transform: translateY(-40px); }
    }

    /* Clouds */
    .cloud {
        position: absolute;
        top: 45%;
        width: 650px;
        opacity: 0.18;
        z-index: 5;
        animation: cloudMove 60s linear infinite;
    }

    .cloud2 {
        top: 55%;
        animation-duration: 90s;
        opacity: 0.13;
    }

    @keyframes cloudMove {
        from { transform: translateX(-800px); }
        to { transform: translateX(100%); }
    }

    /* Moon */
    #moon {
        position: absolute;
        top: 20%;
        left: -200px;
        width: 160px;
        z-index: 10;
        filter: drop-shadow(0 0 35px #e8e8ff);
        animation: moonMove 22s linear forwards;
    }

    @keyframes moonMove {
        from { left: -200px; }
        to { left: 65%; }
    }

    /* Shooting stars */
    .shooting-star {
        position: absolute;
        width: 3px;
        height: 80px;
        background: linear-gradient(to bottom, white, transparent);
        opacity: 0;
        transform: rotate(45deg);
        animation: shoot 3s infinite;
        z-index: 4;
    }

    @keyframes shoot {
        0% { opacity: 0; transform: translate(-200px, -200px) rotate(45deg); }
        20% { opacity: 1; }
        40% { opacity: 0; transform: translate(300px, 300px) rotate(45deg); }
        100% { opacity: 0; }
    }

    /* Message */
    #birthdayMessage {
        position: absolute;
        bottom: 80px;
        width: 100%;
        text-align: center;
        font-size: 28px;
        color: #ffffff;
        opacity: 0;
        letter-spacing: 2px;
        z-index: 12;
        animation: textReveal 20s linear forwards;
    }

    @keyframes textReveal {
        0% { opacity: 0; }
        60% { opacity: 0.2; }
        80% { opacity: 0.6; }
        100% { opacity: 1; }
    }

    /* Click Here Button */
    #clickBtn {
        position: absolute;
        bottom: 20px;
        left: 50%;
        transform: translateX(-50%);
        padding: 14px 26px;
        font-size: 20px;
        border: none;
        background: linear-gradient(45deg, #ffffffaa, #d3d3ffd0);
        backdrop-filter: blur(6px);
        border-radius: 12px;
        color: #000;
        cursor: pointer;
        opacity: 0;
        transition: 1.4s ease;
        z-index: 15;
        font-weight: bold;
    }

    #clickBtn.show {
        opacity: 1;
        transform: translateX(-50%) scale(1.08);
    }

</style>
</head>

<body>

<div class="stars"></div>
<div class="aurora"></div>

<img class="cloud cloud1" src="https://i.imgur.com/3Q8ZQyZ.png">
<img class="cloud cloud2" src="https://i.imgur.com/3Q8ZQyZ.png">

<img id="moon" src="https://i.imgur.com/zYcCwNH.png">

<!-- Shooting stars -->
<script>
    for (let i = 0; i < 9; i++) {
        let s = document.createElement("div");
        s.classList.add("shooting-star");
        s.style.left = Math.random() * window.innerWidth + "px";
        s.style.top = Math.random() * window.innerHeight/1.5 + "px";
        s.style.animationDelay = (Math.random() * 4) + "s";
        s.style.animationDuration = (2 + Math.random()*3) + "s";
        document.body.appendChild(s);
    }
</script>

<div id="birthdayMessage">
    “On this calm birthday eve so new,<br>
    God softly whispers, ‘My plans are made for you.’”
</div>

<button id="clickBtn">CLICK HERE</button>

<script>
    // Button appears when moon reaches end
    setTimeout(() => {
        document.getElementById("clickBtn").classList.add("show");
    }, 23000); // slightly after moon stops
</script>

</body>
</html>
