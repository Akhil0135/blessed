<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Ultimate Cinematic Moon → Day</title>
<style>
  html,body{
    margin:0; padding:0; height:100%; overflow:hidden;
    background:#000010; font-family:'Cinzel', serif;
  }
  #scene{
    position:relative; width:100%; height:100%; overflow:hidden;
    background: radial-gradient(circle at 50% 60%, #0a0a24, #000010 70%);
  }
  .moon{
    position:absolute; width:160px; height:160px; border-radius:50%;
    background: radial-gradient(circle at 30% 30%, #ffffff, #cfcfcf 60%, #888 100%);
    top:40%; left:20%; transform:translate(-50%, -50%);
    box-shadow:0 0 40px #b5b5ffcc;
    cursor:pointer;
  }
  .sun{
    position:absolute; width:0; height:0; border-radius:50%;
    background:radial-gradient(circle, #ffefb0, #ffbb55 60%, #ff9922 100%);
    top:50%; left:50%; transform:translate(-50%,-50%);
    opacity:0;
    transition:all 2s ease-out;
    box-shadow:0 0 50px #ffdd88aa;
  }
  #msg{
    position:absolute; bottom:20%; width:100%; text-align:center;
    font-size:28px; color:#ffe9c1; opacity:0;
    transition:opacity 2s ease;
    letter-spacing:1px;
  }
</style>
</head>
<body>
<div id="scene">
  <div class="moon" id="moon"></div>
  <div class="sun" id="sun"></div>
  <div id="msg">On this calm birthday eve so new,<br>God softly whispers, my plans are made for you.</div>
</div>
<script>
const moon = document.getElementById('moon');
const sun = document.getElementById('sun');
const msg = document.getElementById('msg');
let dragging = false;
let offsetX = 0, offsetY = 0;

moon.addEventListener('mousedown', e => {
  dragging = true;
  offsetX = e.clientX - moon.offsetLeft;
  offsetY = e.clientY - moon.offsetTop;
});

document.addEventListener('mousemove', e => {
  if(!dragging) return;
  let x = e.clientX - offsetX;
  let y = e.clientY - offsetY;
  const maxRight = window.innerWidth - moon.offsetWidth;
  if(x < 0) x = 0;
  if(x > maxRight) x = maxRight;
  moon.style.left = x + 'px';
  moon.style.top = y + 'px';
  let progress = x / maxRight;
  sun.style.width = (progress*300) + 'px';
  sun.style.height = (progress*300) + 'px';
  sun.style.opacity = progress;
  msg.style.opacity = progress;
});

document.addEventListener('mouseup', () => dragging = false);
</script>
</body>
</html>
