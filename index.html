<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>IMAX PRINCE — Cinematic</title>
<style>
    html, body { margin: 0; padding: 0; overflow: hidden; background: #000; }
    canvas { display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
const canvas = document.getElementById("c");
const ctx = canvas.getContext("2d");

function resize() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
    mapText();
}
resize();
window.onresize = resize;

// Background stars
const bgStars = [];
for (let i=0;i<200;i++){
    bgStars.push({x:Math.random()*canvas.width,y:Math.random()*canvas.height,size:Math.random()*1.2+0.2,tw:Math.random()*0.02+0.003});
}
function drawStars(){
    bgStars.forEach(s=>{
        const glow=(Math.sin(Date.now()*s.tw)+1)*0.5;
        ctx.fillStyle=`rgba(255,255,255,${glow})`;
        ctx.beginPath();
        ctx.arc(s.x,s.y,s.size,0,Math.PI*2);
        ctx.fill();
    });
}

// PRINCE letters
const text="PRINCE";
const temp = document.createElement("canvas");
const tctx = temp.getContext("2d");
let letterPoints=[];
function mapText(){
    temp.width = canvas.width;
    temp.height = canvas.height;
    tctx.clearRect(0,0,temp.width,temp.height);
    tctx.font=`bold ${canvas.width/7}px Arial Black`;
    tctx.textAlign="center";
    tctx.textBaseline="middle";
    tctx.fillStyle="#fff";
    tctx.fillText(text,temp.width/2,temp.height/2);
    const data=tctx.getImageData(0,0,temp.width,temp.height).data;
    letterPoints=[];
    for(let y=0;y<temp.height;y+=5){
        for(let x=0;x<temp.width;x+=5){
            const i=(y*temp.width+x)*4;
            if(data[i+3]>200) letterPoints.push({x,y});
        }
    }
    initParticles();
}

// Particles
let particles=[];
function initParticles(){
    particles = letterPoints.map(p=>({
        x: p.x + (Math.random()-0.5)*60,
        y: p.y + (Math.random()-0.5)*60,
        tx: p.x,
        ty: p.y,
        vx: (Math.random()-0.5)*3,
        vy: (Math.random()-0.5)*3,
        size: Math.random()*2+1.5,
        speed: Math.random()*0.06+0.04,
        hue: Math.random()*360,
        spark: Math.random()
    }));
}

// Hue shift
function electricHue(base){
    return (base + Math.sin(Date.now()*0.002)*120)%360;
}

// Animation
let forming=false;
setTimeout(()=>forming=true,1000);

function animate(){
    ctx.clearRect(0,0,canvas.width,canvas.height);

    drawStars();

    particles.forEach(p=>{
        if(forming){
            p.vx += (p.tx - p.x)*p.speed;
            p.vy += (p.ty - p.y)*p.speed;
        }
        p.x += p.vx;
        p.y += p.vy;

        let hue = electricHue(p.hue);
        let pulse = (Math.sin(Date.now()*0.02+p.spark*5)+1)*0.5+0.6;

        ctx.beginPath();
        ctx.fillStyle = `hsla(${hue},100%,65%,${pulse})`;
        ctx.shadowColor = `hsla(${hue},100%,75%,1)`;
        ctx.shadowBlur = 20 + Math.sin(Date.now()*0.02+p.spark)*10;
        ctx.arc(p.x,p.y,p.size + Math.sin(Date.now()*0.02+p.spark)*0.8,0,Math.PI*2);
        ctx.fill();
    });

    requestAnimationFrame(animate);
}

animate();
</script>
</body>
</html>
