<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Moon Reveal — Working Base</title>

<style>
    body{
        margin:0;
        height:100vh;
        background:#000;
        overflow:hidden;
        font-family: serif;
        color:white;
        user-select:none;
    }

    /* moon */
    #moon{
        position:absolute;
        top:40px;
        left:40px;
        width:120px;
        height:120px;
        border-radius:50%;
        background:white;
        cursor:grab;
        z-index:10;
    }

    /* message */
    #msgBox{
        position:fixed;
        bottom:40px;
        left:50%;
        transform:translateX(-50%);
        white-space:nowrap;
        font-size:20px;
        font-weight:bold;
        color:white;
        opacity:1; /* ALWAYS VISIBLE NOW */
        letter-spacing:1px;
    }

    #msgBox span{
        opacity:0;
        transition:opacity .2s linear;
    }

    #msgBox span.show{
        opacity:1;
    }
</style>

</head>
<body>

<div id="moon"></div>

<div id="msgBox"></div>

<script>
    const moon = document.getElementById("moon");
    const msgBox = document.getElementById("msgBox");

    const text = "On this calm birthday eve so new, God softly whispers, my plans are made for you.";

    // build spans
    msgBox.innerHTML = "";
    for(let c of text){
        let sp = document.createElement("span");
        sp.textContent = c;
        msgBox.appendChild(sp);
    }

    const spans = msgBox.querySelectorAll("span");

    let dragging = false;
    let offsetX = 0;
    let lastShown = 0;
    let locked = false;

    moon.addEventListener("mousedown", e=>{
        dragging = true;
        offsetX = e.clientX - moon.offsetLeft;
        moon.style.transition = "none";
    });

    window.addEventListener("mouseup", ()=>{
        dragging = false;
    });

    window.addEventListener("mousemove", e=>{
        if(!dragging) return;

        let x = e.clientX - offsetX;
        if(x < 10) x = 10;
        if(x > window.innerWidth - 130) x = window.innerWidth - 130;

        moon.style.left = x+"px";

        // reveal progress
        if(!locked){
            let progress = x / (window.innerWidth - 140);
            let target = Math.floor(progress * spans.length);

            if(target > lastShown){
                for(let i = lastShown; i < target; i++){
                    spans[i].classList.add("show");
                }
                lastShown = target;

                if(lastShown >= spans.length){
                    locked = true;
                }
            }
        }
    });
</script>

</body>
</html>
