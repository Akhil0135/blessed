<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>IMAX Phase 1 — Moon Drag Reveal</title>

<!-- MUST BE HERE — FIXES BLACK SCREEN -->
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700&display=swap" rel="stylesheet">

<style>
    html, body {
        margin: 0;
        padding: 0;
        overflow: hidden;
        background: #000;
        user-select: none;
    }
    canvas {
        display: block;
    }

    /* IMAX Golden Ben-Hur Style Text */
    #msg {
        position: absolute;
        top: 70%;
        left: 50%;
        transform: translateX(-50%);
        font-family: "Cinzel", serif;
        font-size: 22px;
        letter-spacing: 2px;
        white-space: nowrap;
        background: linear-gradient(90deg, #ffffff, #ffecb3, #fff2cc, #ffffff);
        -webkit-background-clip: text;
        color: transparent;
        text-shadow: 
            0 0 10px rgba(255,255,255,0.5),
            0 0 25px rgba(255,220,120,0.4);
        opacity: 0;
        transition: opacity 0.3s ease-out;
        pointer-events: none;
    }
</style>
</head>
<body>

<canvas id="c"></canvas>
<div id="msg"></div>

<script>
const canvas = document.getElementById("c");
const ctx = canvas.getContext("2d");
const msg = document.getElementById("msg");

const fullText =
"On this calm birthday eve so new, God softly whispers, my plans are made for you";
msg.textContent = "";  // Start empty

// ---------- RESIZE ----------
function resize() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;

    moon.x = canvas.width * 0.15;
    moon.y = canvas.height * 0.18;
}
resize();
window.onresize = resize;

// ---------- STAR FIELD ----------
const stars = [];
for (let i = 0; i < 180; i++) {
    stars.push({
        x: Math.random() * window.innerWidth,
        y: Math.random() * window.innerHeight,
        size: Math.random() * 1.3 + 0.3,
        tw: Math.random() * 0.02 + 0.003
    });
}

// ---------- MOON ----------
const moon = {
    x: canvas.width * 0.15,
    y: canvas.height * 0.18,
    radius: Math.min(canvas.width, canvas.height) * 0.08,
    dragging: false,
    offsetX: 0
};

// ---------- DRAW FUNCTIONS ----------
function drawStars() {
    for (let s of stars) {
        let glow = (Math.sin(Date.now() * s.tw) + 1) * 0.5;
        ctx.fillStyle = `rgba(255,255,255,${glow})`;
        ctx.beginPath();
        ctx.arc(s.x, s.y, s.size, 0, Math.PI * 2);
        ctx.fill();
    }
}

function drawMoon() {
    ctx.fillStyle = "#fff";
    ctx.beginPath();
    ctx.arc(moon.x, moon.y, moon.radius, 0, Math.PI * 2);
    ctx.fill();

    let halo = ctx.createRadialGradient(
        moon.x, moon.y, moon.radius * 0.9,
        moon.x, moon.y, moon.radius * 1.7
    );
    halo.addColorStop(0, "rgba(255,255,255,0.25)");
    halo.addColorStop(1, "rgba(255,255,255,0)");
    ctx.fillStyle = halo;
    ctx.beginPath();
    ctx.arc(moon.x, moon.y, moon.radius * 1.7, 0, Math.PI * 2);
    ctx.fill();
}

// ---------- TEXT REVEAL ----------
let revealProgress = 0;
let lastProgress = 0;

function updateTextReveal(progress) {
    if (progress > lastProgress) {  // only move forward
        lastProgress = progress;
        let charsToShow = Math.floor(fullText.length * progress);
        msg.textContent = fullText.substring(0, charsToShow);
        msg.style.opacity = progress;
    }
}

// ---------- ANIMATION LOOP ----------
function animate() {
    ctx.fillStyle = "#000015";
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    drawStars();
    drawMoon();

    requestAnimationFrame(animate);
}
animate();

// ---------- DRAG EVENTS ----------
canvas.addEventListener("mousedown", e => {
    let dx = e.clientX - moon.x;
    let dy = e.clientY - moon.y;
    if (Math.sqrt(dx * dx + dy * dy) < moon.radius) {
        moon.dragging = true;
        moon.offsetX = dx;
    }
});

canvas.addEventListener("mouseup", () => moon.dragging = false);
canvas.addEventListener("mouseleave", () => moon.dragging = false);

canvas.addEventListener("mousemove", e => {
    if (moon.dragging) {
        moon.x = e.clientX - moon.offsetX;

        // Boundaries
        moon.x = Math.max(moon.radius, Math.min(canvas.width - moon.radius, moon.x));

        // Reveal progress (0 → 1)
        let p = (moon.x - canvas.width * 0.15) / (canvas.width * 0.7);
        p = Math.max(0, Math.min(1, p));

        updateTextReveal(p);
    }
});
</script>
</body>
</html>
