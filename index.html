<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Cinematic Night Scene</title>

<style>
  body {
    margin: 0;
    height: 100vh;
    background: linear-gradient(to bottom, #0a0f24 0%, #000814 70%, #000000 100%);
    overflow: hidden;
    position: relative;
  }

  /* Perfect Crescent Moon */
  .moon {
    position: absolute;
    top: 80px;
    right: 120px;
    width: 150px;
    height: 150px;
    background: white;
    border-radius: 50%;
    box-shadow: 0 0 60px #ffffffaa;
    z-index: 2;
  }

  .moon::after {
    content: '';
    position: absolute;
    top: 0;
    left: 40px; /* controls crescent thickness */
    width: 150px;
    height: 150px;
    border-radius: 50%;
    background: #00163a; /* same as background */
  }

  /* Cross */
  .cross {
    position: absolute;
    top: 10px;
    left: 50%;
    transform: translateX(-50%);
    width: 160px;
    height: 260px;
    z-index: 2;
  }

  .vertical {
    position: absolute;
    left: 50%;
    transform: translateX(-50%);
    width: 32px;
    height: 260px;
    background: linear-gradient(to bottom, #f6e7a4, #d4a93f, #b88a2c);
  }

  .horizontal {
    position: absolute;
    top: 65px; /* Raised */
    left: 50%;
    transform: translateX(-50%);
    width: 190px;
    height: 32px;
    background: linear-gradient(to right, #f6e7a4, #d4a93f, #b88a2c);
  }

  /* Stars */
  .star {
    position: absolute;
    width: 3px;
    height: 3px;
    background: white;
    border-radius: 50%;
    opacity: 0.9;
    animation: twinkle 2.5s infinite ease-in-out;
    pointer-events: none;
    z-index: 1;
  }

  @keyframes twinkle {
    0% { opacity: 0.2; transform: scale(1); }
