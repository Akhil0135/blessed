<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aurora Night Message</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Great+Vibes&display=swap');

  body, html {
    margin: 0;
    padding: 0;
    overflow: hidden;
    width: 100%;
    height: 100%;
    background: linear-gradient(to top, #0b0c2a, #1a1a3b);
    font-family: 'Great Vibes', cursive;
  }

  /* Stars */
  .star {
    position: absolute;
    border-radius: 50%;
    background: white;
    opacity: 0.8;
    box-shadow: 0 0 6px rgba(255,255,255,0.7);
    animation: twinkle 2s infinite alternate;
  }
  @keyframes twinkle {
    0% { opacity: 0.3; transform: scale(1); }
    50% { opacity: 1; transform: scale(1.5); }
    100% { opacity: 0.3; transform: scale(1); }
  }

  /* Moving Moon */
  .moon {
    position: absolute;
    width: 120px;
    height: 120px;
    background: radial-gradient(circle, #fefbd8 0%, #f5e7a0 70%, #e0c97f 100%);
    border-radius: 50%;
    top: 50px;
    left: -150px;
    box-shadow: 0 0 30px 10px #fffacd;
    animation: moveMoon 60s linear infinite;
  }
  @keyframes moveMoon {
    0% { left: -150px; top: 50px; }
    50% { left: 50%; top: 100px; }
    100% { left: 100%; top: 50px; }
  }

  /* Clouds */
  .cloud {
    position: absolute;
    width: 300px;
    height: 120px;
    background: rgba(255, 255, 255, 0.08);
    border-radius: 50%;
    filter: blur(25px);
    box-shadow: 0 0 40px rgba(255,255,255,0.08);
    animation: moveCloud linear infinite, morphCloud ease-in-out infinite alternate;
  }
  .cloud::before, .cloud::after {
    content: '';
    position: absolute;
    background: rgba(255, 255, 255, 0.08);
    width: 180px;
    height: 90px;
    border-radius: 50%;
    filter: blur(25px);
  }
  .cloud::before { top: -40px; left: 60px; }
  .cloud::after { top: 30px; left: 120px; }
  @keyframes moveCloud { 0% { left: -400px; } 100% { left: 100%; } }
  @keyframes morphCloud { 0% { transform: scale(1,1); } 50% { transform: scale(1.1, 0.9); } 100% { transform: scale(1,1); } }

  /* Aurora */
  .aurora {
    position: absolute;
    width: 300%;
    height: 400px;
    background: linear-gradient(120deg, rgba(0,255,128,0.3), rgba(128,0,255,0.3), rgba(0,255,255,0.3));
    top: 50%;
    left: -100%;
    border-radius: 50%;
    filter: blur(80px);
    animation: moveAurora 20s linear infinite alternate;
  }
  @keyframes moveAurora {
    0% { left: -100%; transform: rotate(0deg); }
    100% { left: -50%; transform: rotate(5deg); }
  }

  /* Message */
  .message-letter {
    position: absolute;
    color: #ffffff;
    font-size: 3rem;
    text-shadow: 0 0 10px #fff, 0 0 20px #00ffcc;
    opacity: 0;
    pointer-events: none;
    transition: opacity 1s ease, top 1s ease, left 1s ease;
  }
</style>
</head>
<body>

<div class="moon"></div>
<div class="aurora"></div>

<script>
  // Stars
  for(let i=0;i<150;i++){
    const star=document.createElement('div');
    star.classList.add('star');
    star.style.top=Math.random()*window.innerHeight+'px';
    star.style.left=Math.random()*window.innerWidth+'px';
    star.style.width=star.style.height=Math.random()*3+1+'px';
    document.body.appendChild(star);
  }

  // Clouds
  const cloudCount = 6;
  for(let i=0;i<cloudCount;i++){
    const cloud=document.createElement('div');
    cloud.classList.add('cloud');
    cloud.style.top = Math.random() * 250 + "px";
    cloud.style.animationDuration = (60 + Math.random()*40) + "s, " + (8 + Math.random()*4) + "s";
    cloud.style.opacity = 0.05 + Math.random()*0.08;
    document.body.appendChild(cloud);
  }

  // Message
  const messageText = "The night whispers secrets...";
  const letters = [];
  messageText.split("").forEach((char)=>{
    const letter = document.createElement('div');
    letter.className = 'message-letter';
    letter.innerText = char;
    document.body.appendChild(letter);
    letters.push(letter);
  });

  // Animate letters properly centered with spacing
  function animateLetters(){
    const totalWidth = letters.length * 40; // approx width per letter
    const startX = (window.innerWidth - totalWidth)/2;
    const centerY = window.innerHeight/2;
    letters.forEach((letter,i)=>{
      setTimeout(()=>{
        letter.style.left = startX + i*40 + "px";
        letter.style.top = centerY + "px";
        letter.style.opacity = 1;
      }, i*250);
    });
  }

  setTimeout(animateLetters, 2000);
</script>

</body>
</html>
