<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ultra Cinematic Moon-to-Sun</title>

<style>
html,body{
  height:100%;
  margin:0;
  background:#000010;
  overflow:hidden;
  font-family:"Cinzel",serif;
}

/* --- Sky --- */
#sky{
  position:absolute;
  width:100%;
  height:100%;
  background:linear-gradient(#000010,#000013,#000018);
  transition:background 6s ease-in-out;
  z-index:1;
}

/* --- Stars --- */
#stars{
  position:absolute;
  width:100%;
  height:100%;
  background:url('https://i.ibb.co/4JRpP3k/stars.png') repeat;
  opacity:0.9;
  animation:twinkle 4s infinite alternate;
  z-index:2;
}
@keyframes twinkle{
  from{opacity:0.7;}
  to{opacity:1;}
}

/* --- Moon --- */
#moon{
  position:absolute;
  width:180px;
  height:180px;
  background:radial-gradient(circle,#ffffff,#dcdcdc,#888);
  border-radius:50%;
  top:35%;
  left:10%;
  box-shadow:0 0 40px #ffffffaa,0 0 120px #b0b0ff55;
  animation:moonMove 14s linear forwards;
  z-index:3;
}
@keyframes moonMove{
  0%{transform:translateX(0);}
  90%{transform:translateX(550px);} /* stops before edge */
  100%{transform:translateX(550px);}
}

/* --- Clouds --- */
.cloud{
  position:absolute;
  width:420px;
  height:180px;
  background:url('https://i.ibb.co/6b0Hfkt/cloud-real.png');
  background-size:cover;
  opacity:0.25;
  filter:blur(2px);
  animation:cloudMove 20s linear infinite;
  z-index:4;
}
#cloud1{top:20%;left:-200px;animation-duration:30s;}
#cloud2{top:40%;left:-300px;animation-duration:38s;}
@keyframes cloudMove{
  0%{transform:translateX(0);}
  100%{transform:translateX(1400px);}
}

/* --- Fog --- */
#fog{
  position:absolute;
  width:140%;
  height:140%;
  top:-20%;
  left:-20%;
  background:url('https://i.ibb.co/pxv2Kbd/fog.png');
  background-size:cover;
  opacity:0.18;
  animation:fogMove 22s linear infinite;
  z-index:5;
}
@keyframes fogMove{
  0%{transform:translateX(0);}
  100%{transform:translateX(300px);}
}

/* --- Sun --- */
#sun{
  position:absolute;
  width:260px;
  height:260px;
  background:radial-gradient(circle,#ffcc33,#ff8800,#ff5500);
  border-radius:50%;
  bottom:-300px;
  left:50%;
  transform:translateX(-50%);
  animation:sunRise 14s ease-in-out forwards;
  filter:blur(1px);
  box-shadow:0 0 90px #ffdd55cc,0 0 150px #ff8800aa;
  z-index:6;
}
@keyframes sunRise{
  0%{bottom:-300px;}
  100%{bottom:35%;}
}

/* --- Day sky transition --- */
body.day #sky{
  background:linear-gradient(#87cefa,#ffffff,#ffe9b5);
}

/* --- Particles --- */
.particle{
  position:absolute;
  width:4px;
  height:4px;
  background:#ffffff;
  border-radius:50%;
  opacity:0.9;
  animation:floating 6s infinite ease-in-out;
  z-index:7;
}
@keyframes floating{
  0%{transform:translateY(0) translateX(0);}
  50%{transform:translateY(-20px) translateX(10px);}
  100%{transform:translateY(0) translateX(0);}
}

/* -----------------------------------------------------
   MESSAGE (DARK-VIOLET GRADIENT + ALWAYS VISIBLE)
------------------------------------------------------*/
#message{
  position:absolute;
  width:100%;
  top:62%;
  text-align:center;

  /* ABOVE ALL LAYERS */
  z-index:999999999;

  /* Dark violet gradient */
  background: linear-gradient(135deg, #3a0066, #6a00b9, #9b30ff);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;

  font-size:28px;
  font-weight:700;
  letter-spacing:3px;

  /* Glow for visibility across all backgrounds */
  text-shadow:
    0 0 20px rgba(155,48,255,0.45),
    0 0 36px rgba(106,0,185,0.5),
    0 0 60px rgba(58,0,102,0.55);

  padding:6px 10px;
}

/* --- Cinematic fade-in --- */
#message{
  opacity:0;
  animation:msgReveal 6s ease-in-out forwards 4s;
}
@keyframes msgReveal{
  from{opacity:0;}
  to{opacity:1;}
}

</style>
</head>

<body>

<div id="sky"></div>
<div id="stars"></div>

<div id="moon"></div>

<div id="cloud1" class="cloud"></div>
<div id="cloud2" class="cloud"></div>

<div id="fog"></div>

<div id="sun"></div>

<!-- Particles -->
<script>
for(let i=0;i<45;i++){
  let p=document.createElement("div");
  p.className="particle";
  p.style.left=Math.random()*100+"%";
  p.style.top=(Math.random()*70+10)+"%";
  p.style.animationDuration=(4+Math.random()*4)+"s";
  document.body.appendChild(p);
}

/* Switch sky to day after moon travel */
setTimeout(()=>{
  document.body.classList.add("day");
},8000);
</script>

<!-- Your message -->
<div id="message">YOUR MESSAGE HERE</div>

</body>
</html>
