<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Phase 4 — HAPPY BIRTHDAY PRINCE</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  body { margin:0; overflow:hidden; background:#000; }
  canvas { display:block; }
</style>
</head>
<body>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/examples/js/loaders/FontLoader.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/examples/js/geometries/TextGeometry.js"></script>

<script>
let scene = new THREE.Scene();
let camera = new THREE.PerspectiveCamera(60, window.innerWidth/window.innerHeight, 0.1, 2000);
camera.position.set(0, 60, 260);

let renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(window.devicePixelRatio);
document.body.appendChild(renderer.domElement);

// -----------------------------------------------------
// GALAXY BACKGROUND
// -----------------------------------------------------
let starGeo = new THREE.BufferGeometry();
let starCount = 1500;
let starPositions = new Float32Array(starCount * 3);
for (let i = 0; i < starCount * 3; i++) {
    starPositions[i] = (Math.random() - 0.5) * 3000;
}
starGeo.setAttribute('position', new THREE.BufferAttribute(starPositions, 3));
let starMat = new THREE.PointsMaterial({ color: 0xffffff, size: 2 });
let stars = new THREE.Points(starGeo, starMat);
scene.add(stars);

// -----------------------------------------------------
// LIGHTS
// -----------------------------------------------------
scene.add(new THREE.AmbientLight(0xffffff, 0.4));
let pointLight = new THREE.PointLight(0xffddaa, 2, 2000);
pointLight.position.set(100, 150, 100);
scene.add(pointLight);

// -----------------------------------------------------
// BIG "1" IN BACKGROUND
// -----------------------------------------------------
let bigOneMesh = null;

// -----------------------------------------------------
// MAIN TEXT — HAPPY BIRTHDAY PRINCE
// -----------------------------------------------------
let textMesh = null;

const loader = new THREE.FontLoader();
loader.load("https://threejs.org/examples/fonts/helvetiker_regular.typeface.json", (font) => {

    // TEXT
    const textGeo = new THREE.TextGeometry("HAPPY BIRTHDAY PRINCE", {
        font: font,
        size: 20,
        height: 4,
        curveSegments: 12,
        bevelEnabled: true,
        bevelThickness: 2,
        bevelSize: 1,
        bevelSegments: 5
    });

    textGeo.center();

    const textMat = new THREE.MeshStandardMaterial({
        color: 0xffe066,
        emissive: 0xffbb33,
        metalness: 0.7,
        roughness: 0.25
    });

    textMesh = new THREE.Mesh(textGeo, textMat);
    textMesh.position.y = 0;
    scene.add(textMesh);

    // BIG "1"
    const oneGeo = new THREE.TextGeometry("1", {
        font: font,
        size: 120,
        height: 10,
        curveSegments: 12,
        bevelEnabled: true,
        bevelThickness: 3,
        bevelSize: 2,
        bevelSegments: 5
    });

    oneGeo.center();

    const oneMat = new THREE.MeshStandardMaterial({
        color: 0x3366ff,
        emissive: 0x113366,
        metalness: 0.6,
        roughness: 0.35
    });

    bigOneMesh = new THREE.Mesh(oneGeo, oneMat);
    bigOneMesh.position.set(0, -40, -200);  // stays behind
    scene.add(bigOneMesh);
});

// -----------------------------------------------------
// RANDOM CARTOON IMAGES
// -----------------------------------------------------
let cartoonList = [
    "https://i.imgur.com/vgXx8Tk.png", // Mickey
    "https://i.imgur.com/0hQG0YH.png", // Doraemon
    "https://i.imgur.com/9GV1O3P.png", // Pikachu
    "https://i.imgur.com/0pF2Clh.png", // Tom
    "https://i.imgur.com/iF3Gh7P.png"  // Jerry
];

let cartoonPlanes = [];

function addRandomCartoon(url) {
    const texLoader = new THREE.TextureLoader();
    texLoader.load(url, (texture) => {
        let mat = new THREE.MeshBasicMaterial({ map: texture, transparent: true });
        let geo = new THREE.PlaneGeometry(80, 80);
        let mesh = new THREE.Mesh(geo, mat);

        // RANDOM POSITIONING AROUND SCENE
        mesh.position.set(
            (Math.random() - 0.5) * 2000,
            (Math.random() - 0.5) * 1200,
            (Math.random() - 0.5) * 2000
        );

        scene.add(mesh);
        cartoonPlanes.push(mesh);
    });
}

cartoonList.forEach(img => addRandomCartoon(img));

// -----------------------------------------------------
// CAMERA ORBIT AROUND SCENE
// -----------------------------------------------------
let angle = 0;

function animate() {
    requestAnimationFrame(animate);

    stars.rotation.y += 0.0004;
    stars.rotation.x += 0.0001;

    angle += 0.0015;
    camera.position.x = Math.sin(angle) * 260;
    camera.position.z = Math.cos(angle) * 260;
    camera.lookAt(0, 10, 0);

    renderer.render(scene, camera);
}

animate();

// -----------------------------------------------------
// RESPOND TO SCREEN RESIZE
// -----------------------------------------------------
window.addEventListener("resize", () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
});
</script>

</body>
</html>
