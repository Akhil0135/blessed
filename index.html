<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IMAX Nolan Cinematic Scene</title>
<style>
html, body { margin:0; padding:0; width:100%; height:100%; background:#010108; overflow:hidden; font-family:'Cinzel', serif; }
#scene { position:relative; width:100%; height:100%; perspective:1000px; overflow:hidden; }
#gb { position:absolute; top:2%; width:100%; text-align:center; font-size:3rem; color:#fff; text-shadow:0 0 40px #fff, 0 0 80px #FFDFA0; z-index:25; transition:opacity 1s ease-in-out; }
#moon, #sun, #message, #fog, .star, .particle, .lensflare, #clickBtn { transition:opacity 1s ease-in-out, transform 1s ease-in-out; }
#moon { position:absolute; top:10%; left:5%; width:150px; height:150px; border-radius:50%; background:radial-gradient(circle,#f7f7ff,#d5d2f4,#8c86c5); box-shadow:0 0 150px #C7C3FF,0 0 300px rgba(200,200,255,0.3); cursor:grab; z-index:20; }
#sun { position:absolute; top:10%; right:5%; width:150px; height:150px; border-radius:50%; background:radial-gradient(circle,#FFE8A0,#FF8C00,#B45A00); box-shadow:0 0 400px rgba(255,165,90,0.85),0 0 500px rgba(255,200,120,0.2); transform:scale(0); opacity:0; z-index:18; }
#message { position:absolute; bottom:20%; width:100%; text-align:center; font-size:1.6rem; color:#fff; letter-spacing:2px; opacity:0; z-index:25; text-shadow:0 0 10px rgba(255,255,255,0.4),0 0 25px rgba(255,240,200,0.25); }
.star { position:absolute; border-radius:50%; background:white; animation:twinkle 2s infinite alternate; z-index:5; opacity:0.3; }
@keyframes twinkle { 0%{opacity:0.2;} 50%{opacity:1;} 100%{opacity:0.2;} }
#bgGradient { position:absolute; top:0; left:0; width:100%; height:100%; background:linear-gradient(to bottom,#010108,#120430 75%); z-index:0; }
#fog { position:absolute; bottom:0; width:100%; height:50%; background:radial-gradient(circle at 50% 80%, rgba(255,255,255,0.08), transparent 70%); filter:blur(50px); opacity:0.25; z-index:10; animation:fogDrift 60s linear infinite; }
@keyframes fogDrift { 0%{transform:translateX(0);} 50%{transform:translateX(20px);} 100%{transform:translateX(0);} }
.lensflare { position:absolute; width:400px; height:400px; border-radius:50%; pointer-events:none; background:radial-gradient(circle, rgba(255,255,255,0.2) 0%, transparent 70%); z-index:19; filter:blur(100px); opacity:0; }
.particle { position:absolute; width:2px; height:2px; background:white; border-radius:50%; opacity:0.1; animation:drift 10s linear infinite; z-index:6; }
@keyframes drift { from{transform:translate(0,0);} to{transform:translate(50px,50px);} }
#clickBtn { position:absolute; bottom:5%; left:50%; transform:translateX(-50%) scale(0); padding:20px 50px; font-size:1.5rem; background:rgba(255,255,255,0.1); border:2px solid #FFDFA0; color:#FFDFA0; border-radius:15px; cursor:pointer; opacity:0; z-index:30; box-shadow:0 0 40px #FFDFA0,0 0 80px rgba(255,223,160,0.4); transition:opacity 1s ease-in-out, transform 1s ease-in-out; }
#clickBtn:hover { background:rgba(255,255,255,0.3); box-shadow:0 0 60px #FFDFA0,0 0 120px rgba(255,223,160,0.6); }
#birthdayBackdrop { position:absolute; top:0; left:0; width:100%; height:100%; background:#FFE8A0 url('https://i.imgur.com/3VwqR6H.png') center/cover no-repeat; opacity:0; z-index:35; transition:opacity 2s ease-in-out; }
</style>
</head>
<body>
<div id="scene">
  <div id="bgGradient"></div>
  <div id="gb">God Bless You</div>
  <div id="moon"></div>
  <div id="sun"></div>
  <div class="lensflare" id="moonFlare"></div>
  <div class="lensflare" id="sunFlare"></div>
  <div id="message">On this calm birthday eve so new, God softly whispers, my plans are made for you.</div>
  <div id="fog"></div>
  <button id="clickBtn">Click Here</button>
  <div id="birthdayBackdrop"></div>
</div>
<script>
const moon = document.getElementById('moon');
const sun = document.getElementById('sun');
const message = document.getElementById('message');
const clickBtn = document.getElementById('clickBtn');
const birthdayBackdrop = document.getElementById('birthdayBackdrop');
const gb = document.getElementById('gb');
const fog = document.getElementById('fog');
const stars = document.querySelectorAll('.star');
const particles = document.querySelectorAll('.particle');
const moonFlare = document.getElementById('moonFlare');
const sunFlare = document.getElementById('sunFlare');

let dragging=false, offsetX=0;
let fullText = message.innerText;
message.innerText='';

moon.addEventListener('mousedown', e=>{ dragging=true; offsetX=e.clientX - moon.offsetLeft; });
window.addEventListener('mouseup', ()=>{ dragging=false; });
window.addEventListener('mousemove', e=>{
  if(!dragging) return;
  let dx = e.clientX - offsetX;
  if(dx<0) dx=0; if(dx>400) dx=400;
  moon.style.left = 5 + dx/window.innerWidth*90 + '%';
  let progress = dx/400;
  message.innerText = fullText.substring(0, Math.floor(fullText.length*progress));
  message.style.opacity = progress;
  sun.style.transform = `scale(${progress*6})`;
  sun.style.opacity = progress;
  moon.style.opacity = 1 - progress;
  moonFlare.style.opacity = 1 - progress;
  sunFlare.style.opacity = progress;
  if(progress>=0.99){
    clickBtn.style.opacity=1;
    clickBtn.style.transform='translateX(-50%) scale(1)';
  }
});

clickBtn.addEventListener('click', ()=>{
  // Fade out first phase
  moon.style.opacity=0; sun.style.opacity=0; message.style.opacity=0; clickBtn.style.opacity=0; gb.style.opacity=0;
  fog.style.opacity=0; moonFlare.style.opacity=0; sunFlare.style.opacity=0;
  stars.forEach(s=>s.style.opacity=0); particles.forEach(p=>p.style.opacity=0);
  // Show birthday backdrop
  birthdayBackdrop.style.opacity=1;
});
</script>
</body>
</html>
