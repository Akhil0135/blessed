<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Phase 2 — Shield With Nolan Cracks & Cinematic Verse</title>
<style>
html, body {
    margin: 0;
    padding: 0;
    overflow: hidden;
    background: #050510; /* deep cinematic MCU tone */
}
canvas {
    display: block;
    cursor: pointer;
}
.verse-letter {
    position: absolute;
    font-family: "Cinzel", serif;
    font-size: 30px;
    color: #ffd700;
    text-shadow: 0 0 12px rgba(255,255,255,0.7);
    opacity: 0;
    transition: all 1s ease-out;
}
</style>
</head>
<body>
<canvas id="shieldCanvas"></canvas>
<script>
const canvas = document.getElementById('shieldCanvas');
const ctx = canvas.getContext('2d');

function resize(){
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
}
resize();
window.onresize = resize;

// ---------------- STARS ----------------
const stars = [];
for(let i=0;i<180;i++){
    stars.push({
        x: Math.random()*canvas.width,
        y: Math.random()*canvas.height,
        r: Math.random()*1.5 + 0.5,
        t: Math.random()*0.02 + 0.01
    });
}
function drawStars(){
    ctx.fillStyle = "#050510";
    ctx.fillRect(0,0,canvas.width,canvas.height);
    stars.forEach(s=>{
        const glow = (Math.sin(Date.now()*s.t)+1)*0.5;
        ctx.fillStyle = `rgba(255,255,255,${glow})`;
        ctx.beginPath();
        ctx.arc(s.x,s.y,s.r,0,Math.PI*2);
        ctx.fill();
    });
}

// --------------- SHIELD PROPERTIES ----------------
let shieldRadius = 260;
let shieldX, shieldY;
shieldX = canvas.width/2;
shieldY = canvas.height/2;

let shieldRotation = 0;
let starSpin = false;
let starAngle = 0;

let cracksVisible = false;
let crackProgress = 0; // 0 → 1 over 3.5 seconds
let breaking = false;
let breakPieces = [];

// ---------- DRAW SHIELD (MCU colors) -----------
function drawShield(){

    if(!breaking){
        shieldRotation += 0.002;
    }

    // Outer RED metallic ring
    ctx.save();
    ctx.translate(shieldX, shieldY);
    ctx.rotate(shieldRotation);

    let r = shieldRadius;
    const grad1 = ctx.createRadialGradient(0,0,r*0.2,0,0,r);
    grad1.addColorStop(0,"#b30000");
    grad1.addColorStop(0.5,"#8b0000");
    grad1.addColorStop(1,"#4a0000");
    ctx.fillStyle = grad1;
    ctx.beginPath();
    ctx.arc(0,0,r,0,Math.PI*2);
    ctx.fill();

    // White metallic
    const grad2 = ctx.createRadialGradient(0,0,r*0.2,0,0,r*0.8);
    grad2.addColorStop(0,"#ffffff");
    grad2.addColorStop(0.6,"#dcdcdc");
    grad2.addColorStop(1,"#a8a8a8");
    ctx.fillStyle = grad2;
    ctx.beginPath();
    ctx.arc(0,0,r*0.8,0,Math.PI*2);
    ctx.fill();

    // Inner red metallic
    const grad3 = ctx.createRadialGradient(0,0,r*0.1,0,0,r*0.6);
    grad3.addColorStop(0,"#c00000");
    grad3.addColorStop(0.5,"#8b0000");
    grad3.addColorStop(1,"#4a0000");
    ctx.fillStyle = grad3;
    ctx.beginPath();
    ctx.arc(0,0,r*0.6,0,Math.PI*2);
    ctx.fill();
    ctx.restore();

    // Center BLUE metallic
    ctx.save();
    ctx.translate(shieldX, shieldY);
    const centerR = r*0.38;
    const blueGrad = ctx.createRadialGradient(0,0,centerR*0.1,0,0,centerR);
    blueGrad.addColorStop(0,"#4f6ea1");
    blueGrad.addColorStop(0.5,"#0a1e46");
    blueGrad.addColorStop(1,"#06122b");
    ctx.fillStyle = blueGrad;
    ctx.beginPath();
    ctx.arc(0,0,centerR,0,Math.PI*2);
    ctx.fill();

    // 3D STAR (static until click)
    const starR = centerR*0.93;
    ctx.save();
    if(starSpin) ctx.rotate(starAngle);
    let pts=[];
    for(let i=0;i<5;i++){
        pts.push({
            x: Math.cos((18+i*72)*Math.PI/180)*starR,
            y: -Math.sin((18+i*72)*Math.PI/180)*starR
        });
        pts.push({
            x: Math.cos((54+i*72)*Math.PI/180)*(starR*0.45),
            y: -Math.sin((54+i*72)*Math.PI/180)*(starR*0.45)
        });
    }
    const metal = ctx.createLinearGradient(-starR, -starR, starR, starR);
    metal.addColorStop(0,"#ffffff");
    metal.addColorStop(0.3,"#d0d0d0");
    metal.addColorStop(0.6,"#9a9a9a");
    metal.addColorStop(1,"#5a5a5a");
    ctx.fillStyle = metal;
    ctx.beginPath();
    ctx.moveTo(pts[0].x,pts[0].y);
    for(let i=1;i<pts.length;i++){
        ctx.lineTo(pts[i].x,pts[i].y);
    }
    ctx.closePath();
    ctx.shadowColor="rgba(255,255,255,0.5)";
    ctx.shadowBlur=20;
    ctx.fill();
    ctx.restore();

    ctx.restore();

    // ----------- CRACKS (Nolan slow 3.5s) -----------
    if(cracksVisible){
        drawCracks(crackProgress);
    }
}

// ------ CRACK DRAWING FUNCTION ------
function drawCracks(p){
    ctx.save();
    ctx.translate(shieldX,shieldY);
    ctx.strokeStyle = `rgba(80,170,255,${0.8*p})`; /* vibranium blue glow */
    ctx.lineWidth = 3 + 6*p;

    for(let i=0;i<12;i++){
        let angle = (Math.PI*2/12)*i;
        ctx.beginPath();
        ctx.moveTo(0,0);
        let len = shieldRadius*p;
        ctx.lineTo(Math.cos(angle)*len, Math.sin(angle)*len);
        ctx.stroke();
    }
    ctx.restore();
}

// -------- BREAKING EFFECT ----------
function createBreakPieces(){
    breakPieces = [];
    for(let i=0;i<60;i++){
        let angle = Math.random()*Math.PI*2;
        let dist = Math.random()*shieldRadius;
        let size = Math.random()*18 + 10;
        breakPieces.push({
            x: shieldX + Math.cos(angle)*dist,
            y: shieldY + Math.sin(angle)*dist,
            dx: Math.cos(angle)*(Math.random()*6),
            dy: Math.sin(angle)*(Math.random()*6) - 2,
            size: size,
            opacity: 1
        });
    }
}

function drawBreakPieces(){
    breakPieces.forEach(p=>{
        p.x += p.dx;
        p.y += p.dy;
        p.dy += 0.15;
        p.opacity -= 0.015;

        ctx.fillStyle = `rgba(160,160,160,${p.opacity})`;
        ctx.beginPath();
        ctx.arc(p.x,p.y,p.size,0,Math.PI*2);
        ctx.fill();
    });
}

// -------- ANIMATION LOOP ----------
function animate(){
    drawStars();

    if(breaking){
        drawBreakPieces();
    } else {
        drawShield();
    }

    if(starSpin){
        starAngle += 0.05;
    }

    requestAnimationFrame(animate);
}
animate();

// --------- CLICK LOGIC ----------
canvas.addEventListener("click", e => {

    // check if clicked on star area
    const dx = e.clientX - shieldX;
    const dy = e.clientY - shieldY;
    const dist = Math.sqrt(dx*dx + dy*dy);

    if(dist <= shieldRadius*0.38){
        if(!cracksVisible){
            starSpin = true;
            cracksVisible = true;

            // animate crackProgress from 0 → 1 over 3.5s
            let t = 0;
            const interval = setInterval(()=>{
                t += 0.01/3.5;
                crackProgress = Math.min(1, crackProgress + 0.01/3.5);

                if(crackProgress >= 1){
                    clearInterval(interval);

                    // break
                    breaking = true;
                    createBreakPieces();

                    setTimeout(()=>{
                        spawnVerse();
                    }, 900);
                }
            },10);
        }
    }
});

// ---------------- VERSE ----------------
function spawnVerse(){
    const text = "He counts the stars and calls them all by name. — Psalm 147:4";
    const fontSize = 32;
    const topY = 60;

    let tempCanvas = document.createElement("canvas");
    let tempCtx = tempCanvas.getContext("2d");
    tempCtx.font = `${fontSize}px Cinzel`;

    let widths = [];
    let total = 0;

    for(let i=0;i<text.length;i++){
        let w = tempCtx.measureText(text[i]).width;
        widths.push(w);
        total += w;
    }

    let currentX = canvas.width/2 - total/2;
    let delay = 0;

    for(let i=0;i<text.length;i++){
        const span = document.createElement("span");
        span.textContent = text[i];
        span.className = "verse-letter";

        span.style.left = shieldX + "px";
        span.style.top = shieldY + "px";
        span.style.transform = "scale(0.3)";

        document.body.appendChild(span);

        setTimeout(()=>{
            span.style.opacity = 1;
            span.style.transform = "scale(1)";
            span.style.left = currentX + "px";
            span.style.top = topY + "px";
        }, delay);

        delay += 70;
        currentX += widths[i];
    }
}
</script>
</body>
</html>
