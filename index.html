<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Birthday Animation</title>
<style>
  body {
    margin: 0;
    height: 100vh;
    background-color: #001f3f;
    overflow: hidden;
    display: flex;
    justify-content: center;
    align-items: center;
    position: relative;
  }

  /* Cross */
  .cross {
    position: absolute;
    top: 40px;
    width: 60px;
    height: 160px;
    background: gold;
  }
  .cross::before {
    content: '';
    position: absolute;
    top: 45px;
    left: -50px;
    width: 160px;
    height: 40px;
    background: gold;
  }

  /* Text */
  #birthdayText {
    position: absolute;
    top: 50%;
    transform: translateY(-50%);
    font-size: 55px;
    font-family: "Brush Script MT", cursive;
    display: flex;
    gap: 5px;
    color: red;
  }
  .letter {
    opacity: 0;
    transition: opacity 0.3s ease;
  }
  .letter.show {
    opacity: 1;
  }

  /* Balloon */
  .balloon {
    position: absolute;
    bottom: -150px;
    width: 40px;
    height: 55px;
    border-radius: 50% 50% 45% 45%;
    animation: rise 6s linear infinite;
  }
  @keyframes rise {
    from { transform: translateY(0); opacity: 1; }
    to { transform: translateY(-120vh); opacity: 0; }
  }

  /* Confetti */
  .confetti {
    position: absolute;
    width: 8px;
    height: 12px;
    animation: fall 3s linear forwards;
  }
  @keyframes fall {
    from { transform: translateY(-50px) rotate(0deg); opacity: 1; }
    to { transform: translateY(120vh) rotate(360deg); opacity: 0; }
  }
</style>
</head>
<body>
  <div class="cross"></div>
  <div id="birthdayText"></div>

<script>
// Animate Text
function startText() {
  const container = document.getElementById("birthdayText");
  container.innerHTML = "";

  const text = "HAPPY BIRTHDAY";

  for (let i = 0; i < text.length; i++) {
    const span = document.createElement("span");
    span.textContent = text[i];
    span.classList.add("letter");

    // Space between HAPPY and BIRTHDAY
    if (i === 5) span.style.marginRight = "25px";

    container.appendChild(span);
  }

  const letters = document.querySelectorAll(".letter");
  letters.forEach((l, index) => {
    setTimeout(() => {
      l.classList.add("show");
    }, index * 100); // 0.1 sec per letter
  });
}

// Balloons
function createBalloons() {
  setInterval(() => {
    const balloon = document.createElement("div");
    balloon.classList.add("balloon");

    const colors = ["#ff4d4d", "#ffcc00", "#66ccff", "#ff99ff", "#33ff77"]; 
    balloon.style.background = colors[Math.floor(Math.random() * colors.length)];

    balloon.style.left = Math.random() * window.innerWidth + "px";
    balloon.style.animationDuration = (5 + Math.random() * 3) + "s";

    document.body.appendChild(balloon);

    setTimeout(() => balloon.remove(), 9000);
  }, 400);
}

// Confetti
function confettiExplosion() {
  for (let i = 0; i < 120; i++) {
    const conf = document.createElement("div");
    conf.classList.add("confetti");

    const colors = ["red", "yellow", "blue", "green", "purple", "orange"]; 
    conf.style.background = colors[Math.floor(Math.random() * colors.length)];

    conf.style.left = Math.random() * window.innerWidth + "px";

    document.body.appendChild(conf);
    setTimeout(() => conf.remove(), 3500);
  }
}

// Start Everything
setTimeout(() => {
  startText();
  createBalloons();
  confettiExplosion();
}, 500);
</script>
</body>
</html>
