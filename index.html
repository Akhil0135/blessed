<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>IMAX – HAPPY BIRTHDAY PRINCE</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  body { margin:0; overflow:hidden; background:#000; }
  canvas { display:block; }
</style>
</head>
<body>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/examples/js/loaders/FontLoader.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/examples/js/geometries/TextGeometry.js"></script>

<script>
// ---------------- Scene + Camera ----------------
let scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x000000, 0.0012);

let camera = new THREE.PerspectiveCamera(60, window.innerWidth/window.innerHeight, 0.1, 3000);
camera.position.set(0, 50, 400);

let renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(window.devicePixelRatio);
document.body.appendChild(renderer.domElement);

// ---------------- Stars ----------------
let starGeo = new THREE.BufferGeometry();
let starCount = 2500;
let starArr = new Float32Array(starCount * 3);
for(let i=0;i<starCount*3;i++){
    starArr[i] = (Math.random() - 0.5) * 3000;
}
starGeo.setAttribute("position", new THREE.BufferAttribute(starArr, 3));

let starMat = new THREE.PointsMaterial({ color:0xffffff, size:2.2 });
let stars = new THREE.Points(starGeo, starMat);
scene.add(stars);

// Twinkling effect
let starVel = new Float32Array(starCount);
for(let i=0;i<starCount;i++){ starVel[i] = Math.random()*0.02 + 0.01; }

// ---------------- Lights ----------------
let ambient = new THREE.AmbientLight(0x666666, 0.5);
scene.add(ambient);

let keyLight = new THREE.PointLight(0x99ccff, 2, 2000);
keyLight.position.set(180, 200, 140);
scene.add(keyLight);

let warmLight = new THREE.PointLight(0xffddaa, 1.8, 2000);
warmLight.position.set(-120, 160, -80);
scene.add(warmLight);

// ---------------- Glowing Nebula Shader ----------------
const nebulaMat = new THREE.ShaderMaterial({
    uniforms: { time:{ value:0 } },
    vertexShader: `
      varying vec2 vUv;
      void main(){
          vUv = uv;
          gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0);
      }
    `,
    fragmentShader: `
      varying vec2 vUv;
      uniform float time;

      // 2D noise function
      float hash(vec2 p){
          return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5453123);
      }

      float noise(vec2 p){
          vec2 i = floor(p);
          vec2 f = fract(p);
          float a = hash(i);
          float b = hash(i + vec2(1.0,0.0));
          float c = hash(i + vec2(0.0,1.0));
          float d = hash(i + vec2(1.0,1.0));
          vec2 u = f*f*(3.0-2.0*f);
          return mix(a,b,u.x) + (c-a)*u.y*(1.0-u.x) + (d-b)*u.x*u.y;
      }

      void main(){
          float t = time*0.3;
          float n = noise(vUv*10.0 + vec2(t*0.5, -t*0.3));
          float glow = smoothstep(0.2, 0.7, n);

          vec3 col = vec3(
              0.3 + glow*0.7,
              0.2 + glow*0.5,
              0.6 + glow*0.9
          );

          gl_FragColor = vec4(col, 1.0);
      }
    `,
    metalness: 1,
    roughness: 0.25
});

// ---------------- Text ----------------
let princeMesh=null, birthdayMesh=null, oneMesh=null;

new THREE.FontLoader().load(
    "https://threejs.org/examples/fonts/helvetiker_bold.typeface.json",
    font => {

        // ------- Background "1" -------
        let oneGeo = new THREE.TextGeometry("1",{
            font: font,
            size: 180,
            height: 12,
            bevelEnabled:true,
            bevelThickness:6,
            bevelSize:4
        });
        oneGeo.center();
        let oneMat = new THREE.MeshStandardMaterial({
            color:0x222244,
            emissive:0x111122,
            metalness:0.6,
            roughness:0.7
        });
        oneMesh = new THREE.Mesh(oneGeo, oneMat);
        oneMesh.position.y = -10;
        oneMesh.position.z = -80;
        scene.add(oneMesh);

        // ------- PRINCE (fullscreen with glowing nebula) -------
        let princeGeo = new THREE.TextGeometry("PRINCE",{
            font: font,
            size: 180,
            height: 12,
            bevelEnabled:true,
            bevelThickness:5,
            bevelSize:3
        });
        princeGeo.center();
        princeMesh = new THREE.Mesh(princeGeo, nebulaMat);
        princeMesh.position.y = 0;
        scene.add(princeMesh);

        // ------- HAPPY BIRTHDAY -------
        let birthdayGeo = new THREE.TextGeometry("HAPPY BIRTHDAY",{
            font: font,
            size: 36,
            height: 6,
            bevelEnabled:true,
            bevelThickness:3,
            bevelSize:1.5
        });
        birthdayGeo.center();
        let birthdayMat = new THREE.MeshStandardMaterial({
            color:0xffd98c,
            emissive:0xcc8844,
            metalness:0.8,
            roughness:0.35
        });
        birthdayMesh = new THREE.Mesh(birthdayGeo, birthdayMat);
        birthdayMesh.position.y = 180; 
        scene.add(birthdayMesh);
    }
);

// ---------------- Camera Orbit + Animate ----------------
let angle=0;
function animate(){
    requestAnimationFrame(animate);

    // Rotate stars
    stars.rotation.y += 0.0005;

    // Twinkle stars
    let positions = stars.geometry.attributes.position.array;
    for(let i=0;i<starCount;i++){
        positions[i*3+2] += Math.sin(Date.now()*0.001 + i)*0.01*starVel[i];
    }
    stars.geometry.attributes.position.needsUpdate = true;

    // Camera orbit
    angle += 0.0012;
    camera.position.x = Math.sin(angle)*400;
    camera.position.z = Math.cos(angle)*400;
    camera.lookAt(0,50,0);

    if(princeMesh) nebulaMat.uniforms.time.value += 0.03;

    renderer.render(scene,camera);
}
animate();

// ---------------- Responsive ----------------
window.addEventListener("resize",()=>{
    camera.aspect = window.innerWidth/window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
});
</script>

</body>
</html>
