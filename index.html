<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cinematic Night-to-Day with Realistic Trees</title>
<style>
body, html {
  margin:0; padding:0; width:100%; height:100%; overflow:hidden;
  font-family:'Cinzel', serif;
  background:#000010;
  transition: background 4s ease;
}

/* Stars */
.star {
  position:absolute; width:2px; height:2px; border-radius:50%;
  background:#fff; opacity:0.5;
  box-shadow:0 0 6px rgba(255,255,255,0.9);
  animation:twinkle 2.5s infinite alternate;
}
@keyframes twinkle{
  0%{opacity:0.2; transform:scale(1);}
  50%{opacity:0.95; transform:scale(1.5);}
  100%{opacity:0.2; transform:scale(1);}
}

/* Clouds */
.cloud { position:absolute; width:250px; height:100px; background:rgba(255,255,255,0.05); border-radius:50%; filter:blur(30px); box-shadow:0 0 60px rgba(255,255,255,0.1); animation:moveCloud linear infinite; }
@keyframes moveCloud{0%{left:-300px;}100%{left:110%;}}

/* Moon */
.moon { position:absolute; width:140px; height:140px; background: radial-gradient(circle,#fffde6 0%,#f3e4b0 60%,#d9c180 100%); border-radius:50%; top:80px; left:-150px; box-shadow:0 0 50px 20px rgba(255,255,220,0.4); transition:opacity 2s ease; }

/* Shooting Stars */
.shooting-star { position:absolute; width:8px; height:3px; background:linear-gradient(0deg, rgba(255,255,255,0), #fff); border-radius:50%; transform-origin:top left; opacity:0; animation:shoot linear forwards; }
@keyframes shoot{0%{transform:translate(0,0) rotate(var(--angle,-45deg)); opacity:1;}100%{transform:translate(var(--dx,-80vw), var(--dy,80vh)) rotate(var(--angle,-45deg)); opacity:0;}}

/* Birthday Message */
#message { position:absolute; top:60%; width:100%; text-align:center; font-size:28px; color:#f9e9c9; opacity:0; letter-spacing:3px; text-shadow:2px 2px 12px rgba(0,0,0,0.7);}
.letter { opacity:0; display:inline-block; animation:revealLetter 0.4s forwards; }
@keyframes revealLetter{0%{opacity:0; transform:translateY(10px);}100%{opacity:1; transform:translateY(0);}}

/* Click Button */
#clickBtn { position:absolute; bottom:12vh; left:50%; transform:translateX(-50%); padding:14px 34px; font-size:20px; font-family:'Cinzel', serif; background:rgba(255,255,255,0.12); border:1px solid rgba(255,255,255,0.3); border-radius:40px; color:#fff; cursor:pointer; opacity:0; pointer-events:none; transition:opacity 1s ease, transform 0.5s ease; }
#clickBtn.float{opacity:1; pointer-events:auto; animation:btnFloat 3s ease-in-out infinite;}
@keyframes btnFloat{0%{transform:translateX(-50%) translateY(0px);}50%{transform:translateX(-50%) translateY(-6px);}100%{transform:translateX(-50%) translateY(0px);}}

/* Sun */
.sun { position:absolute; top:120%; left:50%; transform:translateX(-50%); width:150px; height:150px; background: radial-gradient(circle, #fff7c0 0%, #ffcc33 80%); border-radius:50%; opacity:0; box-shadow:0 0 100px 40px rgba(255,240,180,0.5),0 0 150px 80px rgba(255,220,120,0.2),0 0 250px 150px rgba(255,200,100,0.1); transition:top 4s ease, opacity 4s ease; z-index:2; }

/* Day Sky */
.day-sky { position:absolute; top:0; left:0; width:100%; height:100%; background: linear-gradient(to top, #87ceeb 0%, #a0d8ff 50%, #d0f0ff 100%); opacity:0; transition:opacity 4s ease; z-index:0; }

/* Haze */
.haze { position:absolute; top:0; left:0; width:100%; height:100%; background: radial-gradient(circle at 50% 50%, rgba(255,255,255,0.02), transparent 80%); pointer-events:none; z-index:1; transition:opacity 4s ease; }

/* Realistic Trees */
.tree { position:absolute; bottom:0; width:20px; background:#4b2e12; border-radius:4px; }
.tree .branch { position:absolute; bottom:100%; width:6px; height:50px; background:#4b2e12; transform-origin:bottom; }
.tree .branch:nth-child(1){ transform:rotate(-25deg); left:-4px; bottom:40px; }
.tree .branch:nth-child(2){ transform:rotate(25deg); left:18px; bottom:60px; }
.tree .leaves { position:absolute; width:0; height:0; }
.tree .leaves div { position:absolute; width:30px; height:30px; background:radial-gradient(circle at 50% 50%, #228B22 0%, #006400 80%); border-radius:50%; }
.tree .leaves div:nth-child(1){ left:-15px; top:-60px; }
.tree .leaves div:nth-child(2){ left:5px; top:-80px; }
.tree .leaves div:nth-child(3){ left:-10px; top:-100px; }
</style>
</head>
<body>

<div id="stars"></div>
<div id="clouds"></div>
<div class="moon"></div>
<div class="haze"></div>
<div class="day-sky"></div>
<div id="message"></div>
<button id="clickBtn">Click Here</button>
<div class="sun"></div>
<div id="trees-container"></div>

<script>
// Stars
const starCount = 180;
const starsArr = [];
for(let i=0;i<starCount;i++){
  const star=document.createElement('div');
  star.className='star';
  star.style.top=Math.random()*window.innerHeight+'px';
  star.style.left=Math.random()*window.innerWidth+'px';
  document.body.appendChild(star);
  starsArr.push(star);
}

// Clouds
const cloudCount = 6;
const cloudsArr=[];
for(let i=0;i<cloudCount;i++){
  const cloud=document.createElement('div');
  cloud.className='cloud';
  cloud.style.top=(50 + Math.random()*250)+'px';
  cloud.style.animationDuration=(35 + Math.random()*40)+'s';
  document.body.appendChild(cloud);
  cloudsArr.push(cloud);
}

// Shooting stars
function createShootingStar(){
  const star=document.createElement('div');
  star.className='shooting-star';
  star.style.top=Math.random()*200+'px';
  star.style.left=window.innerWidth+'px';
  const duration=2 + Math.random()*1.5;
  star.style.setProperty('--dx', '-80vw');
  star.style.setProperty('--dy', '80vh');
  star.style.animationDuration=duration+'s';
  document.body.appendChild(star);
  setTimeout(()=>{ star.remove(); }, duration*1000);
}
const shootingInterval = setInterval(createShootingStar,1200);

// Moon movement
const moon=document.querySelector('.moon');
let moonPos=-150; const moonSpeed=window.innerWidth/600; let messageStarted=false;
const moonInterval=setInterval(()=>{
  if(moonPos < window.innerWidth - 180){
    moonPos += moonSpeed;
    moon.style.left = moonPos+'px';
    if(moonPos > 50 && !messageStarted){
      messageStarted=true;
      revealMessage();
    }
  } else { clearInterval(moonInterval); clickBtn.classList.add('float'); }
},16);

// Birthday message
function revealMessage(){
  const messageDiv = document.getElementById('message');
  const msg = "On this calm birthday eve so new, God softly whispers, my plans are made for you.";
  msg.split('').forEach((ch,i)=>{
    const span=document.createElement('span');
    span.className='letter';
    span.textContent = ch===' ' ? '\u00A0':ch;
    span.style.animationDelay = `${i*0.05}s`;
    messageDiv.appendChild(span);
  });
  messageDiv.style.opacity=1;
}

// Click button & day transition
const clickBtn=document.getElementById('clickBtn');
const sun=document.querySelector('.sun');
const daySky=document.querySelector('.day-sky');
const haze=document.querySelector('.haze');
const treesContainer=document.getElementById('trees-container');

clickBtn.addEventListener('click',()=>{
  // Remove night elements
  moon.style.opacity=0;
  starsArr.forEach(s=>s.remove());
  clearInterval(shootingInterval);
  document.querySelectorAll('.shooting-star').forEach(s=>s.remove());
  document.getElementById('message').style.opacity=0;
  clickBtn.style.opacity=0;
  clickBtn.style.pointerEvents='none';

  // Show day sky
  daySky.style.opacity=1;
  sun.style.top='80px'; sun.style.opacity=1;

  cloudsArr.forEach(c=>{
    c.style.background='rgba(255,255,255,0.4)';
    c.style.boxShadow='0 0 80px rgba(255,255,255,0.2)';
  });
  haze.style.opacity=0.02;

  // Add realistic trees
  for(let i=0;i<10;i++){
    const tree = document.createElement('div');
    tree.className='tree';
    tree.style.left=(i*(window.innerWidth/10)+20)+'px';
    tree.style.height=(120 + Math.random()*50)+'px';
    
    const branch1 = document.createElement('div'); branch1.className='branch';
    const branch2 = document.createElement('div'); branch2.className='branch';
    tree.appendChild(branch1); tree.appendChild(branch2);

    const leaves = document.createElement('div'); leaves.className='leaves';
    for(let j=0;j<3;j++){
      const leaf = document.createElement('div'); leaves.appendChild(leaf);
    }
    tree.appendChild(leaves);

    treesContainer.appendChild(tree);
  }
});
</script>
</body>
</html>
