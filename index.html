<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Cinematic Birthday Animation</title>

<style>
    html, body {
        margin: 0;
        padding: 0;
        height: 100%;
        overflow: hidden;
        background: #02010f;
        font-family: "Cinzel", serif;
        color: white;
    }

    /* Phase switch */
    .phase2 {
        background: linear-gradient(to bottom, #300030, #120010);
        transition: background 2s ease-in-out;
    }

    /* Message styling */
    #message {
        position: absolute;
        top: 40%;
        width: 100%;
        text-align: center;
        font-size: 38px;
        opacity: 0;
        animation: reveal 4s forwards;
    }

    @keyframes reveal {
        0% { opacity: 0; transform: translateY(30px); }
        100% { opacity: 1; transform: translateY(0); }
    }

    #clickBtn {
        position: absolute;
        top: 60%;
        left: 50%;
        transform: translateX(-50%);
        padding: 14px 28px;
        background: #ffffff22;
        border: 1px solid #ffffff55;
        color: white;
        font-size: 20px;
        border-radius: 12px;
        cursor: pointer;
        backdrop-filter: blur(4px);
        display: none;
        transition: opacity 0.7s;
    }

    #clickBtn:hover {
        background: #ffffff33;
    }

    /* Happy Birthday Text Style (Gradient) */
    #birthday {
        position: absolute;
        top: 45%;
        width: 100%;
        text-align: center;
        font-size: 60px;
        font-weight: bold;
        background: linear-gradient(90deg, #ff2f92, #ffb347, #ffd700);
        -webkit-background-clip: text;
        color: transparent;
        opacity: 0;
        transition: opacity 2s ease-in-out, transform 2s ease-in-out;
        transform: translateY(40px);
    }

    /* Moon cursor */
    #moonCursor {
        width: 60px;
        height: 60px;
        background: radial-gradient(circle, #ffffff, #bbbbbb);
        border-radius: 50%;
        position: absolute;
        pointer-events: none;
        mix-blend-mode: screen;
        opacity: 0.8;
        box-shadow: 0 0 25px #ffffffaa;
        transition: transform 0.1s;
    }
</style>
</head>

<body>
<div id="message">Wishing you something magical...</div>
<button id="clickBtn">Click Here</button>
<div id="birthday">Happy Birthday ❤️</div>
<div id="moonCursor"></div>

<script>
let phase = 1;

// Show button after message reveal
setTimeout(() => {
    document.getElementById("clickBtn").style.display = "block";
    document.getElementById("clickBtn").style.opacity = "1";
}, 4000);

// Moon cursor movement
document.addEventListener("mousemove", (e) => {
    const moon = document.getElementById("moonCursor");
    moon.style.left = (e.pageX - 30) + "px";
    moon.style.top = (e.pageY - 30) + "px";
});

// Button click behaviour
document.getElementById("clickBtn").onclick = () => {
    if (phase === 1) {
        // First click → remove button and prepare second click
        document.getElementById("clickBtn").innerText = "Click Again";
        phase = 2;
    } 
    else if (phase === 2) {
        // Second click → Phase 2 begins
        document.body.classList.add("phase2");

        document.getElementById("birthday").style.opacity = "1";
        document.getElementById("birthday").style.transform = "translateY(0)";

        // Remove button after use
        document.getElementById("clickBtn").style.opacity = "0";

        setTimeout(() => {
            document.getElementById("clickBtn").style.display = "none";
        }, 1200);
    }
};
</script>
</body>
</html>
