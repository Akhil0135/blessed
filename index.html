<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Anime Sunset Scene (No External Images)</title>

<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    height: 100vh;
    overflow: hidden;
    background: linear-gradient(#ff8b64, #ff6c9c, #5b2f80);
    animation: camMove 10s ease-in-out infinite alternate;
  }

  /* Camera subtle motion */
  @keyframes camMove {
    0% { transform: scale(1) translateY(0); }
    100% { transform: scale(1.05) translateY(-15px); }
  }

  /* Sun */
  .sun {
    position: absolute;
    bottom: 22%;
    left: 50%;
    width: 220px;
    height: 220px;
    transform: translateX(-50%);
    background: radial-gradient(circle, #fff2cc, #ffb96c, #ff7d54);
    border-radius: 50%;
    filter: blur(2px) brightness(1.3);
    box-shadow: 0 0 120px #ffeabc, 0 0 200px #ffbe6f;
  }

  /* Parallax cloud layers */
  .cloud-layer {
    position: absolute;
    top: 0;
    left: 0;
    width: 300%;
    height: 100%;
    pointer-events: none;
  }

  /* Cloud opacity layers */
  .c1 { opacity: 0.7; animation: scroll1 45s linear infinite; }
  .c2 { opacity: 0.45; animation: scroll2 80s linear infinite; }
  .c3 { opacity: 0.25; animation: scroll3 120s linear infinite; }

  @keyframes scroll1 {
    from { transform: translateX(0); }
    to   { transform: translateX(-33.33%); }
  }
  @keyframes scroll2 {
    from { transform: translateX(0); }
    to   { transform: translateX(-20%); }
  }
  @keyframes scroll3 {
    from { transform: translateX(0); }
    to   { transform: translateX(-10%); }
  }

  /* Mountains */
  .mountains {
    position: absolute;
    bottom: 0;
    width: 300%;
    height: 45%;
    animation: mountainMove 40s linear infinite;
  }

  @keyframes mountainMove {
    from { transform: translateX(0); }
    to   { transform: translateX(-33.33%); }
  }
</style>
</head>

<body>

<!-- Glowing Sun -->
<div class="sun"></div>

<!-- Cloud Layer 1 -->
<div class="cloud-layer c1">
  <svg width="100%" height="100%" preserveAspectRatio="none">
    <defs>
      <linearGradient id="cloudGrad" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="white" stop-opacity="0.8"/>
        <stop offset="100%" stop-color="white" stop-opacity="0.3"/>
      </linearGradient>
    </defs>

    <!-- Big wide clouds -->
    <g fill="url(#cloudGrad)">
      <ellipse cx="15%" cy="20%" rx="180" ry="60"/>
      <ellipse cx="40%" cy="28%" rx="250" ry="80"/>
      <ellipse cx="70%" cy="18%" rx="220" ry="70"/>
      <ellipse cx="110%" cy="25%" rx="260" ry="90"/>
    </g>
  </svg>
</div>

<!-- Cloud Layer 2 -->
<div class="cloud-layer c2">
  <svg width="100%" height="100%" preserveAspectRatio="none">
    <g fill="white">
      <ellipse cx="25%" cy="35%" rx="200" ry="60"/>
      <ellipse cx="55%" cy="30%" rx="240" ry="75"/>
      <ellipse cx="95%" cy="33%" rx="200" ry="65"/>
    </g>
  </svg>
</div>

<!-- Cloud Layer 3 -->
<div class="cloud-layer c3">
  <svg width="100%" height="100%" preserveAspectRatio="none">
    <g fill="white">
      <ellipse cx="10%" cy="45%" rx="180" ry="50"/>
      <ellipse cx="50%" cy="48%" rx="220" ry="60"/>
      <ellipse cx="90%" cy="40%" rx="190" ry="55"/>
    </g>
  </svg>
</div>

<!-- Mountain Layer -->
<div class="mountains">
  <svg width="100%" height="100%" preserveAspectRatio="none">
    <path d="M0 300 L150 180 L260 260 L400 140 L550 260 L700 190 L900 300 L1200 160 L1500 300 L1800 200 L2100 300 L2400 180 L2700 300 L3000 260 L3300 300 L3600 220 L3900 300 V600 H0 Z"
          fill="#2a103b" />
  </svg>
</div>

</body>
</html>
