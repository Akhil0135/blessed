<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IMAX Nolan Cosmic Scene — PRINCE</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { width:100%; height:100%; overflow:hidden; background:#000; }
  canvas { display:block; }
</style>
</head>
<body>
<canvas id="canvas"></canvas>

<script>
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
let width = canvas.width = window.innerWidth;
let height = canvas.height = window.innerHeight;

// Particle class without trail circles
class Particle {
  constructor(x, y){
    this.x = Math.random()*width;
    this.y = Math.random()*height;
    this.vx = (Math.random()-0.5)*2; // faster floating
    this.vy = (Math.random()-0.5)*2;
    this.size = Math.random()*2+0.5;
    this.color = `rgba(255,${Math.floor(Math.random()*200+55)},${Math.floor(Math.random()*200+55)},${Math.random()*0.8+0.3})`;
    this.tx = x;
    this.ty = y;
  }
  update(){
    if(this.tx !== undefined && this.ty !== undefined){
      // faster convergence
      this.x += (this.tx - this.x) * 0.08;
      this.y += (this.ty - this.y) * 0.08;
    } else {
      this.x += this.vx;
      this.y += this.vy;
      if(this.x<0 || this.x>width) this.vx*=-1;
      if(this.y<0 || this.y>height) this.vy*=-1;
    }
  }
  draw(){
    const grad = ctx.createRadialGradient(this.x,this.y,0,this.x,this.y,this.size*2);
    grad.addColorStop(0,this.color);
    grad.addColorStop(0.7,'rgba(0,0,0,0.1)');
    grad.addColorStop(1,'rgba(0,0,0,0)');
    ctx.fillStyle = grad;
    ctx.beginPath();
    ctx.arc(this.x,this.y,this.size,0,Math.PI*2);
    ctx.fill();
  }
}

// Generate text points for "PRINCE"
function getTextPoints(text){
  const tempCanvas = document.createElement('canvas');
  tempCanvas.width = width;
  tempCanvas.height = height;
  const tempCtx = tempCanvas.getContext('2d');
  tempCtx.fillStyle = 'white';
  tempCtx.font = `bold ${Math.floor(width/8)}px Arial`;
  tempCtx.textAlign = 'center';
  tempCtx.textBaseline = 'middle';
  tempCtx.fillText(text, width/2, height/2);

  const imgData = tempCtx.getImageData(0,0,width,height).data;
  const points = [];
  for(let y=0;y<height;y+=6){
    for(let x=0;x<width;x+=6){
      const idx = (y*width+x)*4;
      if(imgData[idx+3] > 128) points.push({x:x,y:y});
    }
  }
  return points;
}

const textPoints = getTextPoints('PRINCE');
const particles = [];
for(let i=0;i<textPoints.length;i++){
  particles.push(new Particle(textPoints[i].x, textPoints[i].y));
}

// Animate
function animate(){
  ctx.fillStyle = 'rgba(0,0,0,0.15)'; // cinematic trailing background
  ctx.fillRect(0,0,width,height);

  // subtle cosmic glow
  for(let i=0;i<2;i++){
    const x = Math.random()*width;
    const y = Math.random()*height;
    const radius = Math.random()*200+100;
    const grad = ctx.createRadialGradient(x,y,0,x,y,radius);
    grad.addColorStop(0,'rgba(255,255,255,0.01)');
    grad.addColorStop(1,'rgba(0,0,0,0)');
    ctx.fillStyle = grad;
    ctx.fillRect(0,0,width,height);
  }

  particles.forEach(p=>{p.update();p.draw();});
  requestAnimationFrame(animate);
}
animate();

// Handle resize
window.addEventListener('resize', ()=>{
  width = canvas.width = window.innerWidth;
  height = canvas.height = window.innerHeight;
});
</script>
</body>
</html>
