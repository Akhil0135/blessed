<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cinematic Shield Verse</title>
<style>
    body {
        margin: 0;
        background: #000;
        overflow: hidden;
        font-family: Cinzel, serif;
    }

    /* -------------------- Twinkling Stars -------------------- */
    #bg {
        position: absolute;
        inset: 0;
        z-index: 1;
    }

    /* -------------------- Shield -------------------- */
    #shield {
        width: 260px;
        height: 260px;
        border-radius: 50%;
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        background:
            radial-gradient(circle, #ffffff 0%, #c7d7ff 20%, #9bbaff 25%, #0b3d91 45%, #7c0000 65%, #440000 85%);
        box-shadow: 0 0 15px #1acbff40;
        display: flex;
        justify-content: center;
        align-items: center;
        cursor: pointer;
        z-index: 10;
    }

    /* Center Star */
    #star {
        width: 90px;
        height: 90px;
        background: white;
        clip-path: polygon(
            50% 0%, 61% 35%, 98% 35%,
            68% 57%, 79% 91%,
            50% 70%, 21% 91%,
            32% 57%, 2% 35%, 39% 35%
        );
        filter: drop-shadow(0 0 8px #33d8ff);
        transition: transform 1.2s ease-out;
    }

    /* Rotation */
    .rotate {
        animation: spin 3s linear infinite;
    }
    @keyframes spin {
        from { transform: rotate(0deg); }
        to   { transform: rotate(360deg); }
    }

    /* -------------------- Verse -------------------- */
    #verse {
        position: absolute;
        top: 12%;
        width: 100%;
        text-align: center;
        font-size: 30px;
        color: #fff3cf;
        letter-spacing: 7px;
        opacity: 0;
        z-index: 20;
    }

    .letter {
        display: inline-block;
        opacity: 0;
        transform: translateY(20px);
        animation: rise 0.55s forwards ease-out;
    }

    @keyframes rise {
        to {
            opacity: 1;
            transform: translateY(0);
        }
    }

</style>
</head>
<body>

<canvas id="bg"></canvas>

<div id="shield">
    <div id="star"></div>
</div>

<div id="verse"></div>

<script>
/* -------------------------------------------------------
   BACKGROUND TWINKLING STARS
------------------------------------------------------- */
const c = document.getElementById("bg");
const ctx = c.getContext("2d");
c.width = innerWidth;
c.height = innerHeight;

let stars = [];
for (let i = 0; i < 180; i++) {
    stars.push({
        x: Math.random() * c.width,
        y: Math.random() * c.height,
        r: Math.random() * 1.3,
        o: Math.random()
    });
}

function drawStars() {
    ctx.clearRect(0, 0, c.width, c.height);
    for (let s of stars) {
        ctx.beginPath();
        ctx.fillStyle = `rgba(255,255,255,${s.o})`;
        ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
        ctx.fill();

        s.o += (Math.random() - 0.5) * 0.04;
        if (s.o < 0.1) s.o = 0.1;
        if (s.o > 1) s.o = 1;
    }
    requestAnimationFrame(drawStars);
}
drawStars();

/* -------------------------------------------------------
   STAR CLICK → ROTATE + LETTER-BY-LETTER VERSE
------------------------------------------------------- */
const star = document.getElementById("star");
const verseDiv = document.getElementById("verse");
const verseText = "THE LORD IS MY SHEPHERD";

let clicked = false;

document.getElementById("shield").onclick = () => {
    if (clicked) return;
    clicked = true;

    // Rotate star
    star.classList.add("rotate");

    // Reveal verse
    setTimeout(() => revealVerse(), 700);
};

/* -------------------------------------------------------
   CLEAR LETTER-BY-LETTER VERSE
------------------------------------------------------- */
function revealVerse() {
    verseDiv.innerHTML = "";
    verseDiv.style.opacity = 1;

    [...verseText].forEach((char, i) => {
        let span = document.createElement("span");
        span.className = "letter";
        span.style.animationDelay = `${i * 0.08}s`;
        span.textContent = char === " " ? "\u00A0" : char;
        verseDiv.appendChild(span);
    });
}

</script>

</body>
</html>
