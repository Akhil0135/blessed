<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>IMAX PRINCE Ultimate Cinematic</title>
<style>
    html, body { margin: 0; padding: 0; overflow: hidden; background: #000; }
    canvas { display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
const canvas = document.getElementById("c");
const ctx = canvas.getContext("2d");
function resize(){ canvas.width = innerWidth; canvas.height = innerHeight; mapText(); }
resize(); onresize = resize;

// ------------ BACKGROUND TWINKLING STARS ------------
const stars = [];
const starCount = 230;
for(let i=0;i<starCount;i++){
    stars.push({ x: Math.random()*canvas.width, y: Math.random()*canvas.height, size: Math.random()*1.2+0.3, tw: Math.random()*0.015+0.003 });
}
function drawStars(){
    stars.forEach(s=>{
        let glow = (Math.sin(Date.now()*s.tw)+1)*0.5*0.9;
        ctx.fillStyle = `rgba(255,255,255,${glow})`;
        ctx.beginPath(); ctx.arc(s.x,s.y,s.size,0,Math.PI*2); ctx.fill();
    });
}

// ------------ MAP PRINCE TEXT ------------
const text = "PRINCE";
const tCanvas = document.createElement("canvas");
const tCtx = tCanvas.getContext("2d");
let points = [];
function mapText(){
    tCanvas.width = canvas.width;
    tCanvas.height = canvas.height;

    let fontSize = canvas.width/5.3; // larger for clean detection
    tCtx.clearRect(0,0,tCanvas.width,tCanvas.height);
    tCtx.fillStyle = "white";
    tCtx.font = `900 ${fontSize}px Arial Black`;
    tCtx.textAlign = "center";
    tCtx.textBaseline = "middle";
    tCtx.fillText(text, tCanvas.width/2, tCanvas.height/2);

    let data = tCtx.getImageData(0,0,tCanvas.width,tCanvas.height).data;
    points = [];

    for(let y=0;y<tCanvas.height;y+=5){
        for(let x=0;x<tCanvas.width;x+=5){
            let i = (y*tCanvas.width+x)*4;
            if(data[i+3] > 200) points.push({x,y});
        }
    }
    resetParticles();
}

// ------------ PARTICLES FOR PRINCE ------------
let particles = [];
function resetParticles(){
    particles = points.map(p=>({
        x: Math.random()*canvas.width,
        y: Math.random()*canvas.height,
        tx: p.x,
        ty: p.y,
        vx: 0,
        vy: 0,
        size: Math.random()*2.2+1.5,
        speed: Math.random()*0.06+0.04,
        hue: Math.random()*360
    }));
}

mapText();

// ------------ ELECTRIC SPARKS ------------
const sparks = [];
function spawnSpark(){
    sparks.push({
        x: canvas.width/2,
        y: canvas.height/2,
        life: 1,
        angle: Math.random()*Math.PI*2,
        speed: Math.random()*4+2
    });
}
setInterval(spawnSpark, 400);

function drawSparks(){
    for(let s of sparks){
        ctx.strokeStyle = `rgba(0,150,255,${s.life})`;
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(s.x, s.y);
        s.x += Math.cos(s.angle)*s.speed;
        s.y += Math.sin(s.angle)*s.speed;
        ctx.lineTo(s.x, s.y);
        ctx.stroke();
        s.life -= 0.02;
    }
    for(let i=sparks.length-1;i>=0;i--){ if(sparks[i].life<=0) sparks.splice(i,1); }
}

// ------------ FOG ------------
function drawFog(){
    let g = ctx.createRadialGradient(
        canvas.width/2,canvas.height/2,canvas.width*0.1,
        canvas.width/2,canvas.height/2,canvas.width*0.9
    );
    g.addColorStop(0,"rgba(255,255,255,0.05)");
    g.addColorStop(1,"rgba(0,0,0,0)");
    ctx.fillStyle=g;
    ctx.fillRect(0,0,canvas.width,canvas.height);
}

// ------------ CAMERA MOVEMENT ------------
let zoom = 1;
let rotation = 0;
let driftX = 0;
let driftY = 0;
function applyCamera(){
    zoom += 0.00012;
    rotation += 0.00018;
    driftX = Math.sin(Date.now()*0.0003)*10;
    driftY = Math.cos(Date.now()*0.0002)*10;

    ctx.save();
    ctx.translate(canvas.width/2 + driftX, canvas.height/2 + driftY);
    ctx.scale(zoom,zoom);
    ctx.rotate(rotation);
    ctx.translate(-canvas.width/2, -canvas.height/2);
}

// ------------ EXPLOSION ------------
let explode = false;
setTimeout(()=> explode=true, 2000);

// ------------ ANIMATION LOOP ------------
function animate(){
    ctx.clearRect(0,0,canvas.width,canvas.height);

    applyCamera();
    drawStars();
    drawSparks();

    particles.forEach(p=>{
        if(explode){
            p.vx += (Math.random()-0.5)*0.5;
            p.vy += (Math.random()-0.5)*0.5;
        }
        p.vx += (p.tx - p.x)*p.speed*0.06;
        p.vy += (p.ty - p.y)*p.speed*0.06;
        p.x += p.vx;
        p.y += p.vy;

        let pulse = (Math.sin(Date.now()*0.004)+1)*0.5+0.4;
        ctx.beginPath();
        ctx.fillStyle = `hsla(${p.hue},100%,60%,${pulse})`;
        ctx.shadowColor = `hsla(${p.hue},100%,70%,1)`;
        ctx.shadowBlur = 14;
        ctx.arc(p.x,p.y,p.size,0,Math.PI*2);
        ctx.fill();
    });

    ctx.restore();
    drawFog();

    requestAnimationFrame(animate);
}
animate();
</script>
</body>
</html>
