<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>IMAX — Nolan Cosmic • Shield to Letters</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#01010b;font-family:Inter,system-ui,Segoe UI,Roboto,'Helvetica Neue',Arial;color:#fff;overflow:hidden}

/* --- STAGE --- */
.stage{position:fixed;inset:0;display:grid;place-items:center;overflow:hidden}

/* --- BACKGROUND --- */
.background{position:absolute;inset:0;z-index:1;overflow:hidden}
.nebula-layer{position:absolute;inset:-40%;mix-blend-mode:screen;filter:blur(200px) saturate(3);animation:nebulaDrift linear infinite;opacity:1}
.nebula1{background:radial-gradient(circle at 20% 40%, rgba(255,90,140,0.9), transparent 40%);animation-duration:120s;}
.nebula2{background:radial-gradient(circle at 80% 60%, rgba(90,150,255,0.8), transparent 45%);animation-duration:150s;}
.nebula3{background:radial-gradient(circle at 50% 50%, rgba(120,220,255,0.7), transparent 50%);animation-duration:180s;}
@keyframes nebulaDrift{0%{transform:translate(0,0) scale(1)}50%{transform:translate(300px,-200px) scale(1.3)}100%{transform:translate(0,0) scale(1)}}

/* --- TWINKLING STARS --- */
#dynamic-stars-container{position:absolute;inset:0;z-index:3;pointer-events:none}
.tw-star{position:absolute;width:2px;height:2px;background:white;border-radius:50%;opacity:0.2;animation:twinkleStar 2s infinite ease-in-out}
@keyframes twinkleStar{0%{opacity:0.1; transform:scale(1);}50%{opacity:1; transform:scale(1.8);}100%{opacity:0.15; transform:scale(1);}}

/* --- BACKGROUND STARS --- */
.stars{position:absolute;inset:0;z-index:2;pointer-events:none;background-image:
radial-gradient(#fff 1.2px, transparent 1px),
radial-gradient(#fff 0.8px, transparent 1px);
background-size:400px 400px,120px 120px;filter:blur(.4px);
animation:starDrift 200s linear infinite, starTwinkle 5s infinite alternate;}
@keyframes starTwinkle{0%{opacity:0.5}50%{opacity:1}100%{opacity:0.6}}
@keyframes starDrift{0%{transform:translate(0,0)}100%{transform:translate(-200px,150px)}}

/* --- PARTICLES --- */
.particles{position:absolute;inset:0;z-index:4;pointer-events:none;}
.particle{position:absolute;width:3px;height:3px;background:#fff;opacity:0.5;border-radius:50%;animation:particleDrift linear infinite;}
@keyframes particleDrift{0%{transform:translate(0,0)}100%{transform:translate(var(--x),var(--y))}}

/* --- SHIELD --- */
.shield-wrap{position:relative;z-index:10;display:grid;place-items:center;width:60vmin;height:60vmin;transform:translateZ(0)}
.shield-svg{width:100%;height:100%;transform-origin:center center;filter:drop-shadow(0 20px 60px rgba(0,0,0,0.7))}
#shield-star{transform-box:fill-box;transform-origin:center center;opacity:1;cursor:pointer;z-index:20;transition:filter 0.2s, transform 0.3s;fill:#b0b0b0}

/* --- LIGHT RING --- */
.light-ring{position:absolute;left:50%;top:50%;width:160vmin;height:160vmin;border-radius:50%;
transform:translate(-50%,-50%);border:4px solid rgba(255,255,255,0.05);
animation:ringPulse 6s ease-in-out infinite;z-index:3;pointer-events:none;}
@keyframes ringPulse{0%{transform:translate(-50%,-50%) scale(0.9);opacity:0.15}50%{transform:translate(-50%,-50%) scale(1.1);opacity:0.4}100%{transform:translate(-50%,-50%) scale(0.9);opacity:0.15}}

/* --- SONIC WAVES --- */
.sonic-wave{position:absolute;left:50%;top:50%;width:4vmin;height:4vmin;border-radius:50%;border:2px solid rgba(255,255,255,0.6);pointer-events:none;transform:translate(-50%,-50%) scale(0);animation:sonicPulse 2.5s ease-out forwards;}
@keyframes sonicPulse{
  0%{transform:translate(-50%,-50%) scale(0);opacity:0.8}
  30%{transform:translate(-50%,-50%) scale(1.5);opacity:0.5}
  60%{transform:translate(-50%,-50%) scale(2.5);opacity:0.3}
  100%{transform:translate(-50%,-50%) scale(3.5);opacity:0}
}

/* --- STAR PULSE STEEL --- */
@keyframes steelStarGlow{0%{fill:#b0b0b0;filter:drop-shadow(0 0 12px #fff);}30%{fill:#d0d0d0;filter:drop-shadow(0 0 35px #ccc);}60%{fill:#909090;filter:drop-shadow(0 0 40px #fff);}100%{fill:#b0b0b0;filter:drop-shadow(0 0 12px #fff);}}

/* --- LETTERS --- */
.letter{
  position:absolute;
  font-size:5vmin;
  font-weight:800;
  background:linear-gradient(120deg,#ff4d4d,#003366);
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
  animation:metalPulse 2s infinite alternate;
  opacity:0;
  transform:translate(-50%,-50%) scale(0.2);
  pointer-events:none;
}
@keyframes metalPulse{
  0%{transform:translate(-50%,-50%) scale(0.9);filter:drop-shadow(0 0 6px #ff4d4d);}
  50%{transform:translate(-50%,-50%) scale(1.05);filter:drop-shadow(0 0 12px #003366);}
  100%{transform:translate(-50%,-50%) scale(1);filter:drop-shadow(0 0 10px #ff4d4d);}
}

/* --- SPARKS --- */
.spark{position:absolute;width:2px;height:2px;background:rgba(255,255,255,0.9);border-radius:50%;pointer-events:none;opacity:0;animation:sparkFly 1s forwards}
@keyframes sparkFly{0%{opacity:1;transform:translate(0,0) scale(1)}100%{opacity:0;transform:translate(var(--dx),var(--dy)) scale(0)}}
</style>
</head>
<body>
<div class="stage">
  <div class="background">
    <div class="galaxy"></div>
    <div class="light-ring"></div>
    <div class="nebula-layer nebula1"></div>
    <div class="nebula-layer nebula2"></div>
    <div class="nebula-layer nebula3"></div>
    <div id="dynamic-stars-container"></div>
    <div class="stars"></div>
    <div class="particles"></div>
  </div>

  <!-- SHIELD -->
  <div class="shield-wrap">
    <svg class="shield-svg" viewBox="0 0 200 200">
      <defs>
        <radialGradient id="metalRed" cx="50%" cy="50%" r="50%"><stop offset="0%" stop-color="#ff4d4d"/><stop offset="100%" stop-color="#990000"/></radialGradient>
        <radialGradient id="metalWhite" cx="50%" cy="50%" r="50%"><stop offset="0%" stop-color="#ffffff"/><stop offset="100%" stop-color="#cccccc"/></radialGradient>
        <radialGradient id="metalBlue" cx="50%" cy="50%" r="50%"><stop offset="0%" stop-color="#4d90ff"/><stop offset="100%" stop-color="#003366"/></radialGradient>
      </defs>
      <g id="rings" transform="translate(100,100)">
        <circle r="92" fill="url(#metalRed)" />
        <circle r="76" fill="url(#metalWhite)" />
        <circle r="56" fill="url(#metalRed)" />
        <circle r="36" fill="url(#metalBlue)" />
      </g>
      <g id="starGroup" transform="translate(100,100)">
        <polygon id="shield-star" points="0,-28 6,-8 26,-6 10,6 14,26 0,14 -14,26 -10,6 -26,-6 -6,-8"/>
      </g>
    </svg>
  </div>
</div>

<script>
// Twinkling Stars
function dynamicStars(){
  const container=document.getElementById("dynamic-stars-container");
  for(let i=0;i<120;i++){
    const s=document.createElement("div");
    s.className="tw-star";
    s.style.left=Math.random()*100+"%";
    s.style.top=Math.random()*100+"%";
    s.style.animationDelay=(Math.random()*3)+"s";
    container.appendChild(s);
  }
}
dynamicStars();

// Star and Shield
const star=document.getElementById('shield-star');
const shield=document.querySelector('.shield-svg');
const stage=document.querySelector('.stage');
let lettersRevealed=false;

star.addEventListener('click',()=>{
  star.style.transition='transform 0.5s linear';
  star.style.transform='scale(1.3) rotate(1080deg)';
  setTimeout(()=>{
    star.style.transition='transform 1s cubic-bezier(0.22,1,0.36,1)';
    star.style.transform='scale(1) rotate(0deg)';
    if(!lettersRevealed){
      shatterShield();
      spawnSonicWaves();
      spawnSparks();
      steelStarPulse();
      setTimeout(()=>revealLetters(),900);
      lettersRevealed=true;
    } else {
      steelStarPulse();
    }
  },500);
});

// Shield shatter
function shatterShield(){
  const rings=document.getElementById('rings');
  if(!rings) return;
  rings.style.opacity=0;
  const layers=[
    {r:92, fill:'url(#metalRed)', slices:8},
    {r:76, fill:'url(#metalWhite)', slices:6},
    {r:56, fill:'url(#metalRed)', slices:6},
    {r:36, fill:'url(#metalBlue)', slices:4}
  ];
  const fragRoot=document.createElementNS('http://www.w3.org/2000/svg','g');
  shield.appendChild(fragRoot);
  layers.forEach(layer=>{
    for(let i=0;i<layer.slices;i++){
      const piece=document.createElementNS('http://www.w3.org/2000/svg','path');
      const a1=i*(360/layer.slices);
      const a2=a1+(360/layer.slices);
      const R=layer.r, r=layer.r*0.6;
      const x1=r*Math.cos(a1*Math.PI/180); const y1=r*Math.sin(a1*Math.PI/180);
      const x2=R*Math.cos(a1*Math.PI/180); const y2=R*Math.sin(a1*Math.PI/180);
      const x3=R*Math.cos(a2*Math.PI/180); const y3=R*Math.sin(a2*Math.PI/180);
      const x4=r*Math.cos(a2*Math.PI/180); const y4=r*Math.sin(a2*Math.PI/180);
      piece.setAttribute('fill',layer.fill);
      piece.setAttribute('d',`M ${x1} ${y1} L ${x2} ${y2} A ${R} ${R} 0 0 1 ${x3} ${y3} L ${x4} ${y4} A ${r} ${r} 0 0 0 ${x1} ${y1}`);
      piece.style.transformOrigin='100px 100px';
      piece.style.transition='transform 1.5s ease-out, opacity 1.5s ease-out, filter 1.5s ease-out';
      fragRoot.appendChild(piece);
      setTimeout(()=>{
        const dx=(Math.random()-0.5)*400;
        const dy=(Math.random()-0.5)*400;
        const rot=(Math.random()-0.5)*1080;
        piece.style.transform=`translate(${dx}px,${dy}px) rotate(${rot}deg) scale(0.85)`;
        piece.style.filter='drop-shadow(0 0 12px #fff)';
        setTimeout(()=>piece.style.opacity=0,900);
      },50);
    }
  });
  setTimeout(()=>{ try{ rings.parentNode.removeChild(rings);}catch(e){} },2400);
  setTimeout(()=>{ try{ fragRoot.parentNode.removeChild(fragRoot);}catch(e){} },3800);
}

// Sonic Waves
function spawnSonicWaves(){
  for(let i=0;i<5;i++){
    const wave=document.createElement('div');
    wave.className='sonic-wave';
    wave.style.animationDelay=(i*0.15)+'s';
    stage.appendChild(wave);
    setTimeout(()=>wave.remove(),2800);
  }
}

// Sparks
function spawnSparks(){
  for(let i=0;i<20;i++){
    const s=document.createElement('div');
    s.className='spark';
    const dx=(Math.random()-0.5)*300 + 'px';
    const dy=(Math.random()-0.5)*300 + 'px';
    s.style.setProperty('--dx',dx);
    s.style.setProperty('--dy',dy);
    s.style.left='50%';
    s.style.top='50%';
    stage.appendChild(s);
    setTimeout(()=>s.remove(),1000);
  }
}

// Star Steel Pulse
function steelStarPulse(){ star.style.animation='steelStarGlow 1.2s ease-in-out 4'; }

// Letter Reveal
function revealLetters(){
  const letters="PRINCE".split("");
  const centerX=window.innerWidth/2;
  const startY=window.innerHeight/2 - 40;
  const finalY=window.innerHeight/2 + 160;
  const spacing=80;
  letters.forEach((char,i)=>{
    const div=document.createElement("div");
    div.className="letter";
    div.textContent=char;
    document.body.appendChild(div);
    const fx=centerX + (i-2.5)*spacing;
    setTimeout(()=>{
      div.style.transition="opacity 0.6s ease-out, transform 1.4s cubic-bezier(0.22,1,0.36,1)";
      div.style.opacity=1;
      div.style.left=centerX+"px";
      div.style.top=startY+"px";
      setTimeout(()=>{div.style.transform=`translate(0,0) scale(1)`;div.style.left=fx+"px";div.style.top=finalY+"px";},80);
    },i*140);
  });
}
</script>
</body>
</html>
