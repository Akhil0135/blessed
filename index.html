<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cartoon Night Animation</title>
<style>
  body, html {
    margin:0;
    padding:0;
    width:100%;
    height:100%;
    overflow:hidden;
    font-family:'Comic Sans MS', cursive, sans-serif;
    background:#0b0c2d; /* Cartoon night */
    transition: background 4s ease;
  }

  /* Stars - cartoonish */
  .star {
    position:absolute;
    width:4px;
    height:4px;
    background:#fff;
    border-radius:50%;
    opacity:0.7;
    box-shadow:0 0 12px rgba(255,255,255,0.6);
    animation:twinkle 1.5s infinite alternate;
  }
  @keyframes twinkle{
    0%{opacity:0.2; transform:scale(1);}
    50%{opacity:1; transform:scale(2);}
    100%{opacity:0.2; transform:scale(1);}
  }

  /* Cartoon Clouds */
  .cloud {
    position:absolute;
    width:180px;
    height:80px;
    background:rgba(255,255,255,0.3);
    border-radius:80% 80% 70% 70%;
    filter:blur(8px);
    animation:moveCloud linear infinite;
  }
  @keyframes moveCloud{
    0%{left:-200px;}
    100%{left:110%;}
  }

  /* Moon - cartoon style */
  .moon {
    position:absolute;
    width:120px;
    height:120px;
    background: radial-gradient(circle,#fff6a8 0%,#ffd966 60%,#f2c94c 100%);
    border-radius:50%;
    top:60px;
    left:-150px;
    box-shadow:0 0 18px 6px rgba(255,255,150,0.5);
    animation:moonBounce 2s infinite alternate;
  }
  @keyframes moonBounce{
    0%{transform:translateY(0);}
    50%{transform:translateY(-12px);}
    100%{transform:translateY(0);}
  }

  /* Shooting Stars - cartoon style */
  .shooting-star {
    position:absolute;
    width:12px;
    height:4px;
    background:linear-gradient(0deg, rgba(255,255,255,0), #fffdff);
    border-radius:50%;
    transform-origin:top left;
    opacity:0;
    animation:shoot 2s linear forwards;
  }
  @keyframes shoot{
    0%{transform:translate(0,0) rotate(-45deg); opacity:1;}
    100%{transform:translate(-60vw,60vh) rotate(-45deg); opacity:0;}
  }

  /* Message */
  #message {
    position:absolute;
    top:65%;
    width:100%;
    text-align:center;
    font-size:30px;
    font-weight:bold;
    color:#ffeb3b;
    opacity:0;
    letter-spacing:3px;
    text-shadow: 2px 2px 4px #000;
  }
  .letter {
    opacity:0;
    display:inline-block;
    animation:revealLetter 0.3s forwards;
  }
  @keyframes revealLetter{
    0%{opacity:0; transform:translateY(15px) rotate(-10deg);}
    100%{opacity:1; transform:translateY(0) rotate(0deg);}
  }

  /* Click Button */
  #clickBtn {
    position:absolute;
    bottom:12vh;
    left:50%;
    transform:translateX(-50%);
    padding:14px 34px;
    font-size:22px;
    font-family:'Comic Sans MS', cursive;
    background:rgba(255,255,255,0.2);
    border:2px solid rgba(255,255,255,0.5);
    border-radius:50px;
    color:#fff;
    cursor:pointer;
    opacity:0;
    pointer-events:none;
    transition:opacity 1s ease, transform 0.5s ease;
  }
  #clickBtn.float{
    opacity:1;
    pointer-events:auto;
    animation:btnFloat 3s ease-in-out infinite;
  }
  @keyframes btnFloat{
    0%{transform:translateX(-50%) translateY(0px);}
    50%{transform:translateX(-50%) translateY(-10px);}
    100%{transform:translateX(-50%) translateY(0px);}
  }

  /* Cartoon Sun */
  .sun {
    position:absolute;
    top:-100px;
    left:50%;
    transform:translateX(-50%);
    width:150px;
    height:150px;
    background: radial-gradient(circle,#fffa65 0%,#ffcf33 80%);
    border-radius:50%;
    opacity:0;
    box-shadow:0 0 25px #fff46e;
    animation:sunPulse 3s infinite alternate;
    transition:top 4s ease, opacity 4s ease;
  }
  @keyframes sunPulse{
    0%{transform:translateX(-50%) scale(1);}
    50%{transform:translateX(-50%) scale(1.05);}
    100%{transform:translateX(-50%) scale(1);}
  }
</style>
</head>
<body>

<div id="stars"></div>
<div id="clouds"></div>
<div class="moon"></div>

<div id="message"></div>
<button id="clickBtn">Click Here</button>
<div class="sun"></div>

<script>
  // Stars
  const starCount = 120;
  const starsArr = [];
  for(let i=0;i<starCount;i++){
    const star=document.createElement('div');
    star.className='star';
    star.style.top=Math.random()*window.innerHeight+'px';
    star.style.left=Math.random()*window.innerWidth+'px';
    document.body.appendChild(star);
    starsArr.push(star);
  }

  // Clouds
  const cloudCount = 6;
  const cloudsArr=[];
  for(let i=0;i<cloudCount;i++){
    const cloud=document.createElement('div');
    cloud.className='cloud';
    cloud.style.top=(50 + Math.random()*200)+'px';
    cloud.style.animationDuration=(25 + Math.random()*25)+'s';
    document.body.appendChild(cloud);
    cloudsArr.push(cloud);
  }

  // Shooting stars
  function createShootingStar(){
    const star=document.createElement('div');
    star.className='shooting-star';
    star.style.top=Math.random()*150+'px';
    star.style.left=window.innerWidth+'px';
    const duration=1.5 + Math.random()*1;
    star.style.animationDuration=duration+'s';
    document.body.appendChild(star);
    setTimeout(()=>{ star.remove(); }, duration*1000);
  }
  const shootingInterval = setInterval(createShootingStar,1000);

  // Message reveal
  function revealMessage(){
    const messageDiv = document.getElementById('message');
    const msg = "On this calm birthday eve so new, God softly whispers, my plans are made for you.";
    msg.split('').forEach((ch,i)=>{
      const span=document.createElement('span');
      span.className='letter';
      span.textContent = ch===' ' ? '\u00A0':ch;
      span.style.animationDelay = `${i*0.04}s`;
      messageDiv.appendChild(span);
    });
    messageDiv.style.opacity=1;
  }

  // Moon movement
  const moon=document.querySelector('.moon');
  let moonPos=-150;
  const moonSpeed=6; 
  let messageStarted=false;
  const moonInterval=setInterval(()=>{
    if(moonPos < window.innerWidth - 150){
      moonPos += moonSpeed;
      moon.style.left = moonPos+'px';
      if(moonPos > 50 && !messageStarted){
        messageStarted=true;
        revealMessage();
      }
    } else {
      clearInterval(moonInterval);
      clickBtn.classList.add('float');
    }
  },16);

  // Click button
  const clickBtn=document.getElementById('clickBtn');
  const sun=document.querySelector('.sun');

  clickBtn.addEventListener('click',()=>{
    // Hide moon and stars
    moon.style.opacity=0;
    starsArr.forEach(s=>s.remove());
    clearInterval(shootingInterval);
    document.querySelectorAll('.shooting-star').forEach(s=>s.remove());

    // Hide message and button
    document.getElementById('message').style.opacity=0;
    clickBtn.style.opacity=0;
    clickBtn.style.pointerEvents='none';

    // Day transition
    document.body.style.background='linear-gradient(to top, #87ceeb, #a0d8ff, #d0f0ff)';
    sun.style.top='50px';
    sun.style.opacity=1;

    // Clouds visibility
    cloudsArr.forEach(c=>{
      c.style.background='rgba(255,255,255,0.4)';
    });
  });
</script>
</body>
</html>
