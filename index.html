<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Phase 4 — Happy Birthday PRINCE</title>
<style>
  html, body { margin:0; padding:0; overflow:hidden; background:#000; }
  canvas { display:block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script src="https://cdn.jsdelivr.net/npm/three@0.158.0/build/three.min.js"></script>
<script>
// Scene and camera
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(50, window.innerWidth/window.innerHeight, 0.1, 1000);
camera.position.set(0, 5, 20);

// Renderer
const renderer = new THREE.WebGLRenderer({canvas:document.getElementById('c'), antialias:true});
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(window.devicePixelRatio);

// Lights
scene.add(new THREE.AmbientLight(0xffffff, 0.5));
const spot = new THREE.SpotLight(0xffddaa, 1.2);
spot.position.set(15,20,15);
scene.add(spot);

// Create letters using simple boxes
const letters = [];
const text = "HAPPY BIRTHDAY PRINCE";
let offsetX = -text.length;
for(let i=0;i<text.length;i++){
    const char = text[i];
    if(char !== " "){
        const geo = new THREE.BoxGeometry(1,2,0.5);
        const mat = new THREE.MeshStandardMaterial({color: 0xffcc00, metalness:0.8, roughness:0.2});
        const mesh = new THREE.Mesh(geo, mat);
        mesh.position.x = offsetX + i*1.2;
        mesh.position.y = 0;
        mesh.position.z = 0;
        scene.add(mesh);
        letters.push(mesh);
    }
}

// Star particles
const particleCount = 400;
const particles = new THREE.BufferGeometry();
const positions = new Float32Array(particleCount*3);
for(let i=0;i<particleCount;i++){
    positions[i*3] = (Math.random()-0.5)*100;
    positions[i*3+1] = (Math.random()-0.5)*50;
    positions[i*3+2] = (Math.random()-0.5)*100;
}
particles.setAttribute('position', new THREE.BufferAttribute(positions,3));
const pMaterial = new THREE.PointsMaterial({color:0xffffff, size:0.5});
const pointCloud = new THREE.Points(particles, pMaterial);
scene.add(pointCloud);

// Animation
const clock = new THREE.Clock();
function animate(){
    const t = clock.getElapsedTime();
    camera.position.x = Math.sin(t*0.3)*25;
    camera.position.z = Math.cos(t*0.3)*25;
    camera.lookAt(0,0,0);

    letters.forEach((l,i)=>{ l.rotation.y = t*0.2 + i*0.05; });

    renderer.render(scene, camera);
    requestAnimationFrame(animate);
}
animate();

// Resize
window.addEventListener('resize', ()=>{
    camera.aspect = window.innerWidth/window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
});
</script>
</body>
</html>
