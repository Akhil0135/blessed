<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>IMAX Cinematic Full + Phase 4</title>
<style>
/* ---------------- Common Reset ---------------- */
html, body {
    margin: 0;
    padding: 0;
    overflow: hidden;
    background: #000;
}
canvas { display: block; }

/* ---------------- Stage 1 ---------------- */
#stage1 { position: relative; width: 100%; height: 100%; }
#stage1 #instruction {
    position: absolute;
    top: 20px;
    width: 100%;
    text-align: center;
    font-size: 22px;
    color: #fff;
    text-shadow: 0 0 8px #000;
    opacity: 0.9;
    pointer-events: none;
    z-index: 5;
}
#stage1 #message {
    position: absolute;
    bottom: 80px;
    width: 100%;
    text-align: center;
    font-size: 26px;
    font-weight: 600;
    color: #ffd27f; 
    letter-spacing: 2px;
    text-shadow: 0 0 5px #d9a441;
    opacity: 0;
    transition: opacity 1.5s ease;
    z-index: 5;
}
#stage1 #sun {
    position: absolute;
    width: 260px;
    height: 260px;
    border-radius: 50%;
    background: radial-gradient(circle, #fff7c0 0%, #ffcc33 40%, #d68b00 70%, #000 100%);
    box-shadow: 0 0 50px #ffb300;
    top: -300px;
    right: -300px;
    opacity: 0;
    transition: all 2.5s ease-in-out;
    z-index: 3;
}
#stage1 #moon {
    position: absolute;
    width: 200px;
    height: 200px;
    left: 40px;
    top: 40px;
    border-radius: 50%;
    cursor: grab;
    background: radial-gradient(circle at 30% 30%, 
        #d9d9d9 0%, 
        #c0c0c0 20%, 
        #9a9a9a 45%, 
        #6d6d6d 70%, 
        #2a2a2a 100%);
    box-shadow: 0 0 15px rgba(180,180,255,0.8), inset -20px -20px 40px rgba(0,0,0,0.5);
    transition: box-shadow 0.3s ease;
    z-index: 5;
}
#stage1 #ambient {
    position: absolute;
    width: 100%;
    height: 100%;
    background: radial-gradient(circle at 50% 70%, rgba(30,60,150,0.25), transparent 70%);
    pointer-events: none;
    z-index: 1;
}

/* ---------------- Stage 2 ---------------- */
#stage2 { display:none; position:absolute; width:100%; height:100%; top:0; left:0; }
#stage2 #instruction {
    position: absolute;
    top: 20px;
    width: 100%;
    text-align: center;
    font-size: 22px;
    color: #fff;
    text-shadow: 0 0 8px #000;
    opacity: 0.9;
    pointer-events: none;
    z-index: 5;
}
#stage2 #verse {
    position:absolute;
    top:40px;
    left:50%;
    transform:translateX(-50%) scale(0.2);
    font-size:32px;
    color:#ffe9a6;
    text-shadow:0 0 8px #fff2b3,0 0 15px #e6d37a;
    opacity:0;
    transition: all 1s ease-out;
    white-space:nowrap;
    pointer-events:none;
    z-index:5;
}

/* ---------------- Stage 3 ---------------- */
#stage3 { display:none; position:absolute; width:100%; height:100%; top:0; left:0; }
#stage3 #clickBtn {
    position: absolute;
    bottom: 40px;
    left: 50%;
    transform: translateX(-50%);
    padding: 15px 30px;
    font-size: 20px;
    font-weight: bold;
    background: linear-gradient(90deg, #ff0066, #ffcc00, #00ccff);
    border: none;
    border-radius: 10px;
    cursor: pointer;
    box-shadow: 0 0 20px rgba(255,255,255,0.6);
    color: #fff;
    opacity: 0;
    transition: opacity 1s ease;
    z-index: 1000;
}
</style>
</head>
<body>

<!-- Stage 1 -->
<div id="stage1">
    <div id="instruction">Drag the moon to the end</div>
    <canvas id="stars"></canvas>
    <div id="ambient"></div>
    <div id="moon"></div>
    <div id="sun"></div>
    <div id="message">ON THIS CALM BIRTHDAY EVE SO NEW, GOD SOFTLY WHISPERS, MY PLANS ARE MADE FOR YOU.</div>
    <audio id="whoosh" src="https://cdn.pixabay.com/download/audio/2021/09/16/audio_4f1c1c9f28.mp3?filename=woosh-14795.mp3"></audio>
</div>

<!-- Stage 2 -->
<div id="stage2">
    <div id="instruction">Click the star at the center of the shield</div>
    <canvas id="shieldCanvas"></canvas>
    <div id="verse">He counts the stars and calls them each by name — Psalm 147:4</div>
</div>

<!-- Stage 3 -->
<div id="stage3">
    <canvas id="c"></canvas>
    <button id="clickBtn">Click Here</button>
</div>

<script>
// ---------------- Stage 1, 2, 3 scripts (unchanged) ----------------
// (Paste your entire original Stage 1-3 JavaScript here without changes)
// Stage 3: After all letters of DAIVIK appear, trigger Phase 4 after 7s
btn.addEventListener("click", ()=>{
    btn.style.display="none"; 
    const newText="DAIVIK";
    const newPoints=mapTextToPoints(newText);
    particles.forEach((p,i)=>{ const np=newPoints[i%newPoints.length]; p.tx=np.x; p.ty=np.y; p.color="#fff"; });
    
    // --------- 7-second delay to start Phase 4 ----------
    setTimeout(() => {
        startPhase4();  // Calls Phase 4 after 7 seconds
    }, 7000);
});

// Optional: If letters appear automatically, start Phase 4 after 7 seconds
// (This ensures Phase 4 still triggers even if user does not click)
function triggerPhase4AfterLetters(){
    setTimeout(() => {
        startPhase4();
    }, 7000);
}
</script>

<!-- ---------------- Phase 4 Code ---------------- -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

function startPhase4(){
    // ---------------- Scene + Camera ----------------
    let scene = new THREE.Scene();
    scene.fog = new THREE.FogExp2(0x000000, 0.0012);

    let camera = new THREE.PerspectiveCamera(60, window.innerWidth/window.innerHeight, 0.1, 3000);
    camera.position.set(0, 50, 400);

    let renderer = new THREE.WebGLRenderer({antialias:true});
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(window.devicePixelRatio);
    document.body.appendChild(renderer.domElement);

    // ---------------- Stars ----------------
    let starGeo = new THREE.BufferGeometry();
    let starCount = 2500;
    let starArr = new Float32Array(starCount * 3);
    for(let i=0;i<starCount*3;i++){
        starArr[i] = (Math.random() - 0.5) * 3000;
    }
    starGeo.setAttribute("position", new THREE.BufferAttribute(starArr, 3));

    let starMat = new THREE.PointsMaterial({ color:0xffffff, size:2.2 });
    let stars = new THREE.Points(starGeo, starMat);
    scene.add(stars);

    let starVel = new Float32Array(starCount);
    for(let i=0;i<starCount;i++){ starVel[i] = Math.random()*0.02 + 0.01; }

    // ---------------- Lights ----------------
    let ambient = new THREE.AmbientLight(0x666666, 0.5);
    scene.add(ambient);

    let keyLight = new THREE.PointLight(0x99ccff, 2, 2000);
    keyLight.position.set(180, 200, 140);
    scene.add(keyLight);

    let warmLight = new THREE.PointLight(0xffddaa, 1.8, 2000);
    warmLight.position.set(-120, 160, -80);
    scene.add(warmLight);

    // ---------------- Glowing Nebula Shader ----------------
    const nebulaMat = new THREE.ShaderMaterial({
        uniforms: { time:{ value:0 } },
        vertexShader: `...`,  // Your existing Phase 4 shaders
        fragmentShader: `...`
    });

}
</script>

</body>
</html>
