<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Cinematic Birthday Night</title>
<style>

body {
  margin: 0;
  overflow: hidden;
  background: radial-gradient(#000010, #000014, #000018);
  font-family: 'Playfair Display', serif;
}

/* Stars */
.star {
  position: absolute;
  width: 2px;
  height: 2px;
  background: white;
  opacity: 0.6;
  animation: twinkle 2s infinite ease-in-out;
}

@keyframes twinkle {
  0% { opacity: 0.2; }
  50% { opacity: 1; }
  100% { opacity: 0.2; }
}

/* Moon */
.moon {
  position: absolute;
  top: 80px;
  left: -120px;
  width: 140px;
  height: 140px;
  background: radial-gradient(circle, #ffffff, #d9d9d9, #bfbfbf);
  border-radius: 50%;
  box-shadow: 0 0 60px rgba(255,255,255,0.5);
  animation: moveMoon 36s linear forwards;
}

@keyframes moveMoon {
  0%   { left: -120px; top: 80px; }
  50%  { left: 38%; top: 120px; }
  100% { left: 73%; top: 90px; }
}

/* Clouds */
.cloud {
  position: absolute;
  background: rgba(255,255,255,0.18);
  filter: blur(18px);
  border-radius: 50%;
  animation: cloudMove 60s linear infinite;
}

.cloud1 { top: 25%; left: -20%; width: 350px; height: 120px; animation-duration: 70s; }
.cloud2 { top: 40%; left: -30%; width: 450px; height: 160px; animation-duration: 90s; }
.cloud3 { top: 60%; left: -25%; width: 380px; height: 140px; animation-duration: 85s; }

@keyframes cloudMove {
  0% { left: -40%; }
  100% { left: 120%; }
}

/* Shooting stars */
.shooting-star {
  position: absolute;
  width: 2px;
  height: 90px;
  background: linear-gradient(to top, white, transparent);
  opacity: 0.8;
  transform: rotate(-45deg);
  animation: shoot 3s linear infinite;
}

@keyframes shoot {
  0% { transform: translate(-200px, -200px) rotate(-45deg); opacity: 1; }
  100% { transform: translate(600px, 600px) rotate(-45deg); opacity: 0; }
}

/* AURORA */
.aurora {
  position: absolute;
  top: 0;
  width: 100%;
  height: 60vh;
  background: linear-gradient(180deg, rgba(0,255,255,0.20), transparent);
  filter: blur(40px);
  opacity: 0.4;
  animation: auroraMove 18s ease-in-out infinite;
}

@keyframes auroraMove {
  0% { transform: translateX(0); }
  50% { transform: translateX(-120px); }
  100% { transform: translateX(0); }
}

/* Main message */
#message {
  position: absolute;
  bottom: 10vh;
  width: 100%;
  text-align: center;
  font-size: 30px;
  color: white;
  opacity: 0;
  letter-spacing: 2px;
  line-height: 1.4;
  transition: opacity 4s linear;
}

/* Click Here button */
#clickBtn {
  position: absolute;
  bottom: 15vh;
  left: 50%;
  transform: translateX(-50%) scale(1.05);
  padding: 14px 36px;
  font-size: 20px;
  color: white;
  background: rgba(255,255,255,0.12);
  border: 1px solid rgba(255,255,255,0.35);
  backdrop-filter: blur(5px);
  border-radius: 40px;
  opacity: 0;
  pointer-events: none;
  transition: opacity 2s ease;
}

#clickBtn.reveal {
  opacity: 1;
  pointer-events: auto;
  animation: btnFloat 3.5s ease-in-out infinite;
}

@keyframes btnFloat {
  0% { transform: translateX(-50%) translateY(0px) scale(1.05); }
  50% { transform: translateX(-50%) translateY(-6px) scale(1.1); }
  100% { transform: translateX(-50%) translateY(0px) scale(1.05); }
}

</style>
</head>

<body>

<div class="aurora"></div>

<div class="moon"></div>

<!-- Clouds -->
<div class="cloud cloud1"></div>
<div class="cloud cloud2"></div>
<div class="cloud cloud3"></div>

<!-- Shooting stars (10 of them) -->
<script>
for(let i=0;i<10;i++){
  let s=document.createElement("div");
  s.className="shooting-star";
  s.style.top=Math.random()*300+"px";
  s.style.left=Math.random()*800+"px";
  s.style.animationDelay=Math.random()*5+"s";
  document.body.appendChild(s);
}
</script>

<!-- Random stars -->
<script>
for(let i=0;i<150;i++){
  let st = document.createElement("div");
  st.className="star";
  st.style.top = Math.random()*100 + "vh";
  st.style.left = Math.random()*100 + "vw";
  st.style.animationDelay = Math.random()*3 + "s";
  document.body.appendChild(st);
}
</script>

<!-- Message -->
<div id="message">
On this calm birthday eve so new,<br>
God softly whispers, “My plans are made for you.”
</div>

<!-- Click Here Button -->
<button id="clickBtn">Click Here</button>

<script>
const moon = document.querySelector('.moon');
const message = document.getElementById('message');
const clickBtn = document.getElementById('clickBtn');

/* Reveal message in sync with moon movement */
setTimeout(()=>{ message.style.opacity = 1; }, 4000);

/* When moon finishes → show button */
moon.addEventListener("animationend", () => {
  clickBtn.classList.add("reveal");
});
</script>

</body>
</html>
