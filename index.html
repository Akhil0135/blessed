<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cinematic Night Scene</title>
<style>
body, html {
  margin: 0;
  padding: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: #000010;
  font-family:'Cinzel', serif;
}
#stars {
  position: absolute;
  inset: 0;
  z-index: 2;
}
.star {
  position: absolute;
  width: 2px;
  height: 2px;
  border-radius: 50%;
  background: #fff;
  box-shadow: 0 0 6px rgba(255,255,255,0.9);
  opacity: 0.5;
  animation: twinkle 2.6s infinite alternate;
}
@keyframes twinkle {
  0% {opacity:0.15;}
  50% {opacity:0.95;}
  100% {opacity:0.15;}
}
.shooting-star {
  position: absolute;
  width: 10px;
  height: 3px;
  border-radius: 8px;
  background: linear-gradient(90deg, rgba(255,255,255,0) 0%, rgba(255,255,255,1) 40%, rgba(255,255,255,0) 100%);
  filter: blur(1px);
  opacity: 0;
  transform-origin: left top;
}
.moon {
  position: absolute;
  width: 150px;
  height: 150px;
  border-radius: 50%;
  top: 60px;
  left: -180px;
  background: radial-gradient(circle, #fffde6 0%, #f3e4b0 60%, #d9c180 100%);
  box-shadow: 0 0 80px rgba(255,245,200,0.45);
  z-index: 6;
}
.cloud-layer {
  position: absolute;
  top: 0;
  left: -20%;
  width: 140%;
  height: 60%;
  pointer-events: none;
  z-index: 5;
}
.cloud-group {
  position: absolute;
  width: 100%;
  height: 100%;
  opacity: 0.9;
}
.cloud-group.back { filter: blur(22px) contrast(.9); opacity:0.55; animation: driftBack 180s linear infinite; }
.cloud-group.mid { filter: blur(12px) contrast(1); opacity:0.75; animation: driftMid 120s linear infinite; }
.cloud-group.front { filter: blur(6px) contrast(1.05); opacity:0.95; animation: driftFront 80s linear infinite; }
@keyframes driftBack { from{transform:translateX(-8%);} to{transform:translateX(8%);} }
@keyframes driftMid { from{transform:translateX(-12%);} to{transform:translateX(12%);} }
@keyframes driftFront { from{transform:translateX(-18%);} to{transform:translateX(18%);} }
.cloud-blob {
  position: absolute;
  background: radial-gradient(circle at 35% 35%, rgba(255,255,255,0.98) 0%, rgba(255,255,255,0.86) 25%, rgba(255,255,255,0.6) 50%, rgba(200,200,200,0.15) 80%, rgba(255,255,255,0) 100%);
  border-radius: 50%;
  filter: blur(10px);
  opacity: 0.95;
  mix-blend-mode: screen;
}
.low-fog {
  position: absolute;
  bottom: 0;
  width: 100%;
  height: 40%;
  pointer-events: none;
  background: radial-gradient(circle at 50% 95%, rgba(255,255,255,0.95) 0%, rgba(255,255,255,0.45) 30%, rgba(255,255,255,0) 100%);
  filter: blur(48px);
  opacity: 0.7;
  z-index: 4;
  animation: fogFloat 45s ease-in-out infinite;
}
@keyframes fogFloat {0%,100%{transform:translateX(0);}50%{transform:translateX(4%);}}
#message {
  position: absolute;
  width: 100%;
  top: 62%;
  text-align: center;
  z-index: 12;
  color: #fff3da;
  font-size: 28px;
  letter-spacing: 3px;
  text-shadow: 0 6px 20px rgba(0,0,0,0.7);
  opacity: 0;
}
.letter { display:inline-block; opacity:0; transform:translateY(8px); animation: reveal .45s forwards; }
@keyframes reveal { to{opacity:1; transform:translateY(0);} }
#clickBtn {
  position: absolute;
  left: 50%;
  bottom: 10vh;
  transform: translateX(-50%);
  z-index: 13;
  padding: 14px 34px;
  border-radius: 40px;
  background: rgba(255,255,255,0.12);
  color: #fff;
  border: 1px solid rgba(255,255,255,0.18);
  cursor: pointer;
  font-size: 20px;
  opacity: 0;
  pointer-events: none;
  transition: opacity 1s ease;
}
#clickBtn.float { opacity: 1; pointer-events: auto; animation: btnFloat 3s ease-in-out infinite; }
@keyframes btnFloat {0%{transform:translateX(-50%) translateY(0);}50%{transform:translateX(-50%) translateY(-6px);}100%{transform:translateX(-50%) translateY(0);}}
</style>
</head>
<body>
<div id="stars"></div>
<div class="moon" id="moon"></div>
<div class="cloud-layer" id="cloudLayer">
  <div class="cloud-group back" id="cloudBack"></div>
  <div class="cloud-group mid" id="cloudMid"></div>
  <div class="cloud-group front" id="cloudFront"></div>
</div>
<div class="low-fog" id="lowFog"></div>
<div id="message"></div>
<button id="clickBtn">Click Here</button>

<script>
// Stars
const starsEl = document.getElementById('stars');
for(let i=0;i<150;i++){
  const s = document.createElement('div');
  s.className='star';
  s.style.left=(Math.random()*100)+'%';
  s.style.top=(Math.random()*100)+'%';
  starsEl.appendChild(s);
}

// Shooting stars
function spawnShooting(){
  const s = document.createElement('div');
  s.className='shooting-star';
  const top = Math.random()*35+5;
  s.style.top=top+'vh';
  s.style.left='110%';
  const angle = -20 - Math.random()*40;
  s.style.transform = `rotate(${angle}deg)`;
  document.body.appendChild(s);
  s.animate([{transform: `translateX(0) translateY(0)`},{transform: `translateX(-120vw) translateY(80vh)`}],{duration:900+Math.random()*700,easing:'cubic-bezier(.2,.6,.2,1)'}).onfinish=()=>s.remove();
}
let shootingInterval=setInterval(spawnShooting,1500);

// Moon animation
const moon = document.getElementById('moon');
let moonX=-180;
const moonSpeed=4;
const messageEl = document.getElementById('message');
const clickBtn = document.getElementById('clickBtn');
let messageShown=false;
let moonAnim=setInterval(()=>{
  if(moonX<window.innerWidth-120){
    moonX+=moonSpeed;
    moon.style.left=moonX+'px';
    if(moonX>60 && !messageShown){
      messageShown=true;
      const text="Happy Birthday! Wishing you joy and light.";
      messageEl.innerHTML='';
      text.split('').forEach((ch,i)=>{
        const span=document.createElement('span');
        span.className='letter';
        span.style.animationDelay=(i*0.045)+'s';
        span.textContent=ch;
        messageEl.appendChild(span);
      });
      messageEl.style.opacity='1';
      setTimeout(()=>{clickBtn.classList.add('float');},3000);
    }
  } else clearInterval(moonAnim);
},16);

// Click button hides
clickBtn.addEventListener('click',()=>{
  clickBtn.style.opacity='0';
  clickBtn.style.pointerEvents='none';
});
</script>
</body>
</html>
