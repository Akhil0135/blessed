<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cinematic Night to Day</title>
<style>
  body, html {
    margin: 0;
    padding: 0;
    overflow: hidden;
    width: 100%;
    height: 100%;
    background: linear-gradient(to top, #000000, #0a0a0a, #1a1a1a);
    font-family: 'Cinzel', serif;
    transition: background 3s ease-in-out;
  }

  /* Stars */
  .star {
    position: absolute;
    width: 2px;
    height: 2px;
    background: white;
    border-radius: 50%;
    opacity: 0.9;
    box-shadow: 0 0 8px rgba(255,255,255,0.8);
    animation: twinkle 2s infinite alternate;
  }

  @keyframes twinkle {
    0% { opacity: 0.3; transform: scale(1); }
    50% { opacity: 1; transform: scale(1.5); }
    100% { opacity: 0.3; transform: scale(1); }
  }

  /* Clouds */
  .cloud {
    position: absolute;
    width: 250px;
    height: 100px;
    background: rgba(255,255,255,0.07);
    border-radius: 50%;
    filter: blur(25px);
    animation: moveCloud linear infinite;
  }

  @keyframes moveCloud {
    0% { left: -300px; }
    100% { left: 110%; }
  }

  /* Moon */
  .moon {
    position: absolute;
    width: 140px;
    height: 140px;
    background: radial-gradient(circle, #fffde6 0%, #f3e4b0 60%, #d9c180 100%);
    border-radius: 50%;
    top: 80px;
    left: -120px;
    box-shadow: 0 0 18px 4px rgba(255,255,200,0.4);
    animation: moonMove 45s linear forwards;
    z-index: 30;
  }

  @keyframes moonMove {
    0% { left: -150px; }
    100% { left: calc(100% - 120px); }
  }

  /* Sun */
  .sun {
    position: absolute;
    width: 140px;
    height: 140px;
    background: radial-gradient(circle, #ffcc33 0%, #ff9933 60%, #ff6600 100%);
    border-radius: 50%;
    top: -200px;
    left: 50%;
    transform: translateX(-50%);
    box-shadow: 0 0 18px 4px rgba(255,180,50,0.6);
    opacity: 0;
    transition: all 3s ease-in-out;
    z-index: 30;
  }

  /* Shooting stars */
  .shooting-star {
    position: absolute;
    width: 8px;
    height: 2px;
    background: linear-gradient(0deg, rgba(255,255,255,0), white);
    border-radius: 50%;
    opacity: 0;
    transform-origin: top left;
  }

  /* Message */
  #message {
    position: absolute;
    top: 60%;
    width: 100%;
    text-align: center;
    font-size: 28px;
    color: #f9e9c9;
    opacity: 0;
    letter-spacing: 3px;
    z-index: 40;
  }

  /* Click button */
  #clickBtn {
    position: absolute;
    bottom: 12vh;
    left: 50%;
    transform: translateX(-50%) scale(1);
    padding: 14px 34px;
    font-size: 20px;
    font-family: 'Cinzel', serif;
    background: rgba(255,255,255,0.12);
    border: 1px solid rgba(255,255,255,0.45);
    border-radius: 40px;
    color: #fff;
    backdrop-filter: blur(6px);
    cursor: pointer;
    opacity: 0;
    pointer-events: none;
    transition: opacity 1.8s ease, transform 1.8s ease;
    z-index: 50;
  }

  @keyframes btnFloat {
    0%   { transform: translateX(-50%) translateY(0px) scale(1.08); }
    50%  { transform: translateX(-50%) translateY(-6px) scale(1.12); }
    100% { transform: translateX(-50%) translateY(0px) scale(1.08); }
  }

  #clickBtn.reveal {
    opacity: 1;
    pointer-events: auto;
    animation: btnFloat 3.4s ease-in-out infinite;
  }
</style>
</head>
<body>

<div class="moon"></div>
<div class="sun"></div>
<div id="message"></div>
<button id="clickBtn">Click Here</button>

<script>
  /* Stars */
  const stars = [];
  for(let i=0;i<160;i++){
    const s=document.createElement('div');
    s.classList.add('star');
    s.style.top=Math.random()*window.innerHeight+'px';
    s.style.left=Math.random()*window.innerWidth+'px';
    document.body.appendChild(s);
    stars.push(s);
  }

  /* Clouds */
  const cloudCount = 6;
  const clouds = [];
  for(let i=0;i<cloudCount;i++){
    const cloud=document.createElement('div');
    cloud.classList.add('cloud');
    cloud.style.top=(50 + Math.random()*250)+'px';
    cloud.style.animationDuration=(35 + Math.random()*40)+'s';
    document.body.appendChild(cloud);
    clouds.push(cloud);
  }

  /* Shooting stars */
  function createShootingStar(){
    const star=document.createElement('div');
    star.classList.add('shooting-star');
    star.style.top=Math.random()*200+'px';
    star.style.left=window.innerWidth+'px';
    const duration=1.5 + Math.random();
    star.style.transition=`transform ${duration}s linear, opacity ${duration}s linear`;
    document.body.appendChild(star);
    requestAnimationFrame(()=> {
      star.style.opacity=1;
      star.style.transform=`translate(-70vw,70vh) rotate(-45deg)`;
    });
    setTimeout(()=>{ star.remove(); }, duration*1000);
  }
  const shootingInterval = setInterval(createShootingStar, 800);

  /* Dramatic message reveal */
  const msg="On this calm birthday eve so new, God softly whispers, my plans are made for you.";
  const messageDiv = document.getElementById("message");

  function revealMessage(){
    msg.split("").forEach((char,i)=>{
      const span=document.createElement('span');
      span.textContent=char===' ' ? '\u00A0':char;
      span.style.display='inline-block';
      span.style.opacity=0;
      span.style.transform='translateY(20px) rotateX(25deg) scale(0.8)';
      span.style.animation=`dramaticReveal 0.6s forwards`;
      span.style.animationDelay=(0.05*i)+'s';
      messageDiv.appendChild(span);
    });
    messageDiv.style.opacity=1;
  }

  const style = document.createElement('style');
  style.innerHTML=`
  @keyframes dramaticReveal {
    0% { opacity:0; transform: translateY(20px) rotateX(25deg) scale(0.8); filter: blur(6px); }
    60% { opacity:1; transform: translateY(-5px) rotateX(-10deg) scale(1.1); filter: blur(0); }
    100% { opacity:1; transform: translateY(0px) rotateX(0deg) scale(1); filter: blur(0); }
  }`;
  document.head.appendChild(style);

  /* Moon reaches near end to trigger click button */
  const moon = document.querySelector('.moon');
  const clickBtn = document.getElementById('clickBtn');
  const sun = document.querySelector('.sun');
  let revealTriggered = false;

  const moonCheck = setInterval(()=>{
    const rect=moon.getBoundingClientRect();
    if(rect.left > window.innerWidth*0.7 && !revealTriggered){
      clickBtn.classList.add('reveal');
      revealMessage();
      revealTriggered=true;
      clearInterval(moonCheck);
    }
  },100);

  /* Click button functionality */
  clickBtn.addEventListener('click',()=>{
    // Hide moon, stars, shooting stars, message, button
    moon.style.opacity=0;
    stars.forEach(s=>s.style.opacity=0);
    document.querySelectorAll('.shooting-star').forEach(s=>s.remove());
    messageDiv.style.opacity=0;
    clickBtn.style.opacity=0;
    clickBtn.style.pointerEvents='none';

    // Transition to day
    document.body.style.background = 'linear-gradient(to top, #87ceeb, #a0d8ff, #d0f0ff)';
    sun.style.top='50px';
    sun.style.opacity=1;

    // Increase cloud visibility
    clouds.forEach(c=>{
      c.style.background='rgba(255,255,255,0.3)';
    });
  });
</script>

</body>
</html>
