<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ultra-Cinematic Cosmic Sky</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    background: black;
    overflow: hidden;
  }

  /* Nebula Glow Layers */
  .nebula {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 0;
    filter: blur(180px) saturate(1.8);
  }
  .nebula1 { background: radial-gradient(circle at 20% 40%, rgba(255,70,120,0.5), transparent 40%); animation: drift1 140s linear infinite; }
  .nebula2 { background: radial-gradient(circle at 80% 60%, rgba(70,130,255,0.4), transparent 45%); animation: drift2 180s linear infinite; }
  .nebula3 { background: radial-gradient(circle at 50% 50%, rgba(90,200,255,0.3), transparent 50%); animation: drift3 220s linear infinite; }

  @keyframes drift1 {0%{transform:translate(0,0)}50%{transform:translate(200px,-140px) scale(1.12)}100%{transform:translate(0,0)}}
  @keyframes drift2 {0%{transform:translate(0,0)}50%{transform:translate(-180px,120px) scale(1.1)}100%{transform:translate(0,0)}}
  @keyframes drift3 {0%{transform:translate(0,0)}50%{transform:translate(120px,180px) scale(1.15)}100%{transform:translate(0,0)}}

  /* Twinkling Stars */
  #stars-container {
    position: fixed;
    inset: 0;
    z-index: 1;
    pointer-events: none;
  }

  .star {
    position: absolute;
    width: 2px;
    height: 2px;
    background: white;
    border-radius: 50%;
    opacity: 0.2;
    filter: blur(0.5px);
    animation: twinkle 2.5s infinite ease-in-out;
  }

  @keyframes twinkle {
    0% { opacity: 0.05; transform: scale(1);}
    50% { opacity: 1; transform: scale(1.5);}
    100% { opacity: 0.1; transform: scale(1);}
  }

  /* Shooting Star */
  .shooting-star {
    position: absolute;
    width: 3px;
    height: 3px;
    background: white;
    border-radius: 50%;
    box-shadow: 0 0 12px 2px white;
    pointer-events: none;
    transform: translateX(0) translateY(0) rotate(45deg);
    z-index: 2;
  }

  .shooting-star::after {
    content: '';
    position: absolute;
    left: -20px;
    top: 0;
    width: 40px;
    height: 2px;
    background: linear-gradient(90deg, white, rgba(255,255,255,0));
    border-radius: 2px;
  }
</style>
</head>
<body>

<!-- Nebula Glow Layers -->
<div class="nebula nebula1"></div>
<div class="nebula nebula2"></div>
<div class="nebula nebula3"></div>

<!-- Twinkling Stars -->
<div id="stars-container"></div>

<script>
  const starsContainer = document.getElementById('stars-container');

  // Create Twinkling Stars
  for(let i=0;i<300;i++){
    const s = document.createElement('div');
    s.className='star';
    s.style.left = Math.random()*100 + '%';
    s.style.top = Math.random()*100 + '%';
    const size = (1 + Math.random()*2) + 'px';
    s.style.width = size;
    s.style.height = size;
    s.style.animationDuration = (1.5 + Math.random()*2.5) + 's';
    starsContainer.appendChild(s);
  }

  // Shooting Stars
  function shootStar(){
    const star = document.createElement('div');
    star.className = 'shooting-star';
    const startX = Math.random()*window.innerWidth*0.8;
    const startY = Math.random()*window.innerHeight*0.5;
    star.style.left = startX + 'px';
    star.style.top = startY + 'px';
    document.body.appendChild(star);

    const endX = startX + 500 + Math.random()*300;
    const endY = startY + 250 + Math.random()*150;
    const duration = 1000 + Math.random()*1000;

    star.animate([
      {transform: `translate(0,0)`, opacity: 1},
      {transform: `translate(${endX-startX}px, ${endY-startY}px)`, opacity: 0}
    ], {
      duration: duration,
      easing: 'cubic-bezier(0.2,0.9,0.2,1)'
    }).onfinish = () => star.remove();
  }

  // Multiple Shooting Stars at Random Intervals
  setInterval(() => {
    const count = 1 + Math.floor(Math.random()*3); // 1-3 stars at a time
    for(let i=0;i<count;i++){
      setTimeout(()=>shootStar(), i*300);
    }
  }, 2000 + Math.random()*2000);
</script>

</body>
</html>
