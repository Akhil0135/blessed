<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>IMAX Cinematic Full</title>
<style>
html, body { margin:0; padding:0; overflow:hidden; background:#000; }
canvas { display:block; }
#stage1,#stage2,#stage3{position:absolute;width:100%;height:100%;top:0;left:0;}
#stage1 #moon{position:absolute;width:200px;height:200px;border-radius:50%;left:40px;top:40px;cursor:grab;background:radial-gradient(circle at 30% 30%,#d9d9d9 0%,#c0c0c0 20%,#9a9a9a 45%,#6d6d6d 70%,#2a2a2a 100%);box-shadow:0 0 15px rgba(180,180,255,0.8), inset -20px -20px 40px rgba(0,0,0,0.5);transition:box-shadow 0.3s ease;z-index:5;}
#stage1 #message{position:absolute;bottom:80px;width:100%;text-align:center;font-size:26px;font-weight:600;color:#ffd27f;letter-spacing:2px;text-shadow:0 0 5px #d9a441;opacity:0;transition:opacity 1.5s ease;z-index:5;}
#stage1 #sun{position:absolute;width:260px;height:260px;border-radius:50%;background:radial-gradient(circle,#fff7c0 0%,#ffcc33 40%,#d68b00 70%,#000 100%);box-shadow:0 0 50px #ffb300;top:-300px;right:-300px;opacity:0;transition:all 2.5s ease-in-out;z-index:3;}
#stage1 #ambient{position:absolute;width:100%;height:100%;background:radial-gradient(circle at 50% 70%, rgba(30,60,150,0.25), transparent 70%);pointer-events:none;z-index:1;}
#stage2 #verse{position:absolute;top:40px;left:50%;transform:translateX(-50%) scale(0.2);font-size:32px;color:#ffe9a6;text-shadow:0 0 8px #fff2b3,0 0 15px #e6d37a;opacity:0;transition: all 1s ease-out;white-space:nowrap;pointer-events:none;z-index:5;}
#stage3 #clickBtn{position:absolute;bottom:40px;left:50%;transform:translateX(-50%);padding:15px 30px;font-size:20px;font-weight:bold;background:linear-gradient(90deg,#ff0066,#ffcc00,#00ccff);border:none;border-radius:10px;cursor:pointer;box-shadow:0 0 20px rgba(255,255,255,0.6);color:#fff;opacity:0;transition:opacity 1s ease;z-index:1000;}
</style>
</head>
<body>

<!-- Stage 1 -->
<div id="stage1">
    <div id="instruction">Drag the moon to the end</div>
    <canvas id="stars"></canvas>
    <div id="ambient"></div>
    <div id="moon"></div>
    <div id="sun"></div>
    <div id="message">ON THIS CALM BIRTHDAY EVE SO NEW, GOD SOFTLY WHISPERS, MY PLANS ARE MADE FOR YOU.</div>
    <audio id="whoosh" src="https://cdn.pixabay.com/download/audio/2021/09/16/audio_4f1c1c9f28.mp3?filename=woosh-14795.mp3"></audio>
</div>

<!-- Stage 2 -->
<div id="stage2">
    <div id="instruction">Click the star at the center of the shield</div>
    <canvas id="shieldCanvas"></canvas>
    <div id="verse">He counts the stars and calls them each by name — Psalm 147:4</div>
</div>

<!-- Stage 3 -->
<div id="stage3">
    <canvas id="c"></canvas>
    <button id="clickBtn">Click Here</button>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/examples/js/loaders/FontLoader.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/examples/js/geometries/TextGeometry.js"></script>

<script>
// ---------------- Stage 1 ----------------
const stage1=document.getElementById("stage1"), moon=document.getElementById("moon"), message=document.getElementById("message"), sun=document.getElementById("sun"), whoosh=document.getElementById("whoosh");
const starsCanvas=document.getElementById("stars"), starsCtx=starsCanvas.getContext("2d");
function resize1(){starsCanvas.width=window.innerWidth; starsCanvas.height=window.innerHeight;} resize1(); window.onresize=resize1;

let stars=[], dragging=false, offsetX, offsetY, revealIndex=0, fullMsg=message.innerText;
message.innerText=""; for(let i=0;i<250;i++){ stars.push({x:Math.random()*starsCanvas.width,y:Math.random()*starsCanvas.height,z:Math.random()*1.5+0.5,tw:Math.random()*0.02+0.005}); }

function drawStars(){starsCtx.clearRect(0,0,starsCanvas.width,starsCanvas.height); stars.forEach(s=>{let glow=(Math.sin(Date.now()*s.tw)+1)*0.5; starsCtx.fillStyle=`rgba(255,255,255,${glow})`; starsCtx.beginPath(); starsCtx.arc(s.x,s.y,s.z,0,Math.PI*2); starsCtx.fill();});}

moon.addEventListener("mousedown",e=>{dragging=true;offsetX=e.clientX-moon.offsetLeft;offsetY=e.clientY-moon.offsetTop; moon.style.cursor="grabbing"; whoosh.currentTime=0; whoosh.play();});
document.addEventListener("mouseup",()=>{dragging=false; moon.style.cursor="grab";});
document.addEventListener("mousemove",e=>{if(!dragging) return; moon.style.left=(e.clientX-offsetX)+"px"; moon.style.top=(e.clientY-offsetY)+"px"; if(revealIndex<fullMsg.length){ message.style.opacity=1; message.innerText=fullMsg.substring(0,revealIndex++); } stars.forEach(s=>s.tw=0); if(revealIndex>=fullMsg.length){moon.style.opacity=0; setTimeout(()=>{sun.style.opacity=1; sun.style.top="40px"; sun.style.right="40px"; stars=[]; setTimeout(startStage2,5000);},800); }});

function animate1(){drawStars(); requestAnimationFrame(animate1);} animate1();

// ---------------- Stage 2 ----------------
const stage2=document.getElementById("stage2"), shieldCanvas=document.getElementById("shieldCanvas"), shieldCtx=shieldCanvas.getContext("2d");
let width=window.innerWidth,height=window.innerHeight;
shieldCanvas.width=width; shieldCanvas.height=height;
let shieldX=width/2, shieldY=height/2, R=Math.min(width,height)/3, starSpin=false, starAngle=0;
const bgStars2=[]; for(let i=0;i<200;i++){bgStars2.push({x:Math.random()*width,y:Math.random()*height,r:Math.random()*1.5+0.5,tw:Math.random()*0.02+0.005});}

function drawShield(){shieldCtx.save(); shieldCtx.translate(shieldX,shieldY);
let g1=shieldCtx.createRadialGradient(0,0,R*0.2,0,0,R); g1.addColorStop(0,"#3c0000"); g1.addColorStop(1,"#7a0000"); shieldCtx.fillStyle=g1; shieldCtx.beginPath(); shieldCtx.arc(0,0,R,0,Math.PI*2); shieldCtx.fill();
let g2=shieldCtx.createRadialGradient(0,0,R*0.1,0,0,R*0.75); g2.addColorStop(0,"#dadada"); g2.addColorStop(1,"#f5f5f5"); shieldCtx.fillStyle=g2; shieldCtx.beginPath(); shieldCtx.arc(0,0,R*0.75,0,Math.PI*2); shieldCtx.fill();
let g3=shieldCtx.createRadialGradient(0,0,R*0.1,0,0,R*0.5); g3.addColorStop(0,"#4b0000"); g3.addColorStop(1,"#8c0000"); shieldCtx.fillStyle=g3; shieldCtx.beginPath(); shieldCtx.arc(0,0,R*0.5,0,Math.PI*2); shieldCtx.fill();
let g4=shieldCtx.createRadialGradient(0,0,R*0.05,0,0,R*0.35); g4.addColorStop(0,"#b4c7e0"); g4.addColorStop(1,"#001933"); shieldCtx.fillStyle=g4; shieldCtx.beginPath(); shieldCtx.arc(0,0,R*0.35,0,Math.PI*2); shieldCtx.fill();
shieldCtx.save(); if(starSpin) shieldCtx.rotate(starAngle); let starR=R*0.28; shieldCtx.beginPath(); for(let i=0;i<5;i++){let o=(Math.PI*2/5)*i-Math.PI/2; let n=o+Math.PI/5; shieldCtx.lineTo(Math.cos(o)*starR,Math.sin(o)*starR); shieldCtx.lineTo(Math.cos(n)*starR*0.45,Math.sin(n)*starR*0.45);} shieldCtx.closePath();
shieldCtx.shadowColor="rgba(255,255,255,0.25)"; shieldCtx.shadowBlur=5; let sg=shieldCtx.createRadialGradient(0,0,starR*0.1,0,0,starR); sg.addColorStop(0,"#ffffff"); sg.addColorStop(0.4,"#eeeeee"); sg.addColorStop(1,"#7a7a7a"); shieldCtx.fillStyle=sg; shieldCtx.fill();
shieldCtx.restore(); shieldCtx.restore(); }

function animate2(){shieldCtx.fillStyle="#0a0d19"; shieldCtx.fillRect(0,0,width,height); bgStars2.forEach(s=>{const glow=(Math.sin(Date.now()*s.tw)+1)*0.5; shieldCtx.fillStyle=`rgba(255,255,255,${glow})`; shieldCtx.beginPath(); shieldCtx.arc(s.x,s.y,s.r,0,Math.PI*2); shieldCtx.fill();}); drawShield(); if(starSpin) starAngle+=0.035; requestAnimationFrame(animate2); }

function startStage2(){stage1.style.display="none"; stage2.style.display="block"; animate2(); }

const verseDiv=document.getElementById("verse");
shieldCanvas.addEventListener("click",e=>{const dx=e.clientX-shieldX, dy=e.clientY-shieldY; if(Math.sqrt(dx*dx+dy*dy)<=R*0.28){ starSpin=true; verseDiv.style.opacity=1; verseDiv.style.transform="translateX(-50%) scale(1)"; setTimeout(startStage3,7000); document.getElementById("stage2").querySelector("#instruction").style.opacity=0;}});

// ---------------- Stage 3 ----------------
const stage3=document.getElementById("stage3"), c=document.getElementById("c"), ctx3=c.getContext("2d"), btn=document.getElementById("clickBtn");
function resize3(){ c.width=window.innerWidth; c.height=window.innerHeight; } resize3(); window.onresize=resize3;

const bgStars3=[], bgStarCount=180; for(let i=0;i<bgStarCount;i++){bgStars3.push({x:Math.random()*c.width,y:Math.random()*c.height,size:Math.random()*1.1+0.2,tw:Math.random()*0.02+0.003});}

function drawStarShape(){bgStars3.forEach(s=>{const glow=(Math.sin(Date.now()*s.tw)+1)*0.5; ctx3.fillStyle=`rgba(255,255,255,${glow})`; ctx3.beginPath(); ctx3.arc(s.x,s.y,s.size,0,Math.PI*2); ctx3.fill();});}

function mapTextToPoints(textStr){const temp=document.createElement("canvas"); const tctx=temp.getContext("2d"); temp.width=c.width; temp.height=c.height; const fontSize=c.width/7; tctx.clearRect(0,0,temp.width,temp.height); tctx.fillStyle="#fff"; tctx.font="bold "+fontSize+"px Arial"; tctx.textAlign="center"; tctx.textBaseline="middle"; tctx.fillText(textStr,temp.width/2,temp.height/2); const imageData=tctx.getImageData(0,0,temp.width,temp.height).data; const points=[]; for(let y=0;y<temp.height;y+=6){for(let x=0;x<temp.width;x+=6){let index=(y*temp.width+x)*4; if(imageData[index+3]>200){ points.push({x,y});}}} return points;}

let currentText="PRINCE"; let letterPoints=mapTextToPoints(currentText);
const particles=letterPoints.map(p=>({x:Math.random()*c.width,y:Math.random()*c.height,tx:p.x,ty:p.y,speed:Math.random()*0.08+0.04,size:Math.random()*1.8+1.2,color:null}));
let camera={dx:0,dy:0,zoom:1};
function applyCamera(){ camera.dx=Math.sin(Date.now()*0.0003)*15; camera.dy=Math.cos(Date.now()*0.00025)*15; camera.zoom=1+0.02*Math.sin(Date.now()*0.0002); ctx3.save(); ctx3.translate(c.width/2+camera.dx,c.height/2+camera.dy); ctx3.scale(camera.zoom,camera.zoom); ctx3.translate(-c.width/2,-c.height/2); }

function animate3(){ctx3.clearRect(0,0,c.width,c.height); applyCamera(); drawStarShape(); const time=Date.now(); particles.forEach(p=>{ p.x+=(p.tx-p.x)*p.speed; p.y+=(p.ty-p.y)*p.speed; let fillColor=p.color||`hsl(${(p.x+p.y)%360},90%,70%)`; let shadowIntensity=p.color?(Math.sin(time*0.005)*0.5+0.5)*20:18; ctx3.fillStyle=fillColor; ctx3.shadowBlur=shadowIntensity; ctx3.shadowColor=fillColor; ctx3.beginPath(); ctx3.arc(p.x,p.y,p.size,0,Math.PI*2); ctx3.fill(); }); ctx3.restore(); requestAnimationFrame(animate3);}

function startStage3(){stage2.style.display="none"; stage3.style.display="block"; animate3(); setTimeout(()=>{btn.style.opacity=1;},3000);}

btn.addEventListener("click",()=>{
    btn.style.display="none";
    const newText="DAIVIK";
    const newPoints=mapTextToPoints(newText);
    particles.forEach((p,i)=>{ const np=newPoints[i%newPoints.length]; p.tx=np.x; p.ty=np.y; p.color="#fff"; });
    // Phase 4 after 7s
    setTimeout(()=>{
        stage3.style.display="none";
        startPhase4();
    },7000);
});

// ---------------- Phase 4 ----------------
function startPhase4(){
    let scene=new THREE.Scene(); scene.fog=new THREE.FogExp2(0x000000,0.0012);
    let camera=new THREE.PerspectiveCamera(60,window.innerWidth/window.innerHeight,0.1,3000);
    camera.position.set(0,50,400); let angle=0;
    let renderer=new THREE.WebGLRenderer({antialias:true});
    renderer.setSize(window.innerWidth,window.innerHeight); renderer.setPixelRatio(window.devicePixelRatio);
    document.body.appendChild(renderer.domElement);

    // Stars
    let starGeo=new THREE.BufferGeometry(); let starCount=2500;
    let starArr=new Float32Array(starCount*3);
    for(let i=0;i<starCount*3;i++){ starArr[i]=(Math.random()-0.5)*3000; }
    starGeo.setAttribute("position",new THREE.BufferAttribute(starArr,3));
    let starMat=new THREE.PointsMaterial({color:0xffffff,size:2.2});
    let stars=new THREE.Points(starGeo,starMat); scene.add(stars);
    let starVel=new Float32Array(starCount); for(let i=0;i<starCount;i++){ starVel[i]=Math.random()*0.02+0.01; }

    // Lights
    scene.add(new THREE.AmbientLight(0x666666,0.5));
    let keyLight=new THREE.PointLight(0x99ccff,2,2000); keyLight.position.set(180,200,140); scene.add(keyLight);
    let warmLight=new THREE.PointLight(0xffddaa,1.8,2000); warmLight.position.set(-120,160,-80); scene.add(warmLight);

    // Nebula shader
    const nebulaMat=new THREE.ShaderMaterial({uniforms:{time:{value:0}},vertexShader:`varying vec2 vUv; void main(){ vUv=uv; gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0); }`,fragmentShader:`varying vec2 vUv; uniform float time; float hash(vec2 p){ return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5453123);} float noise(vec2 p){ vec2 i=floor(p); vec2 f=fract(p); float a=hash(i); float b=hash(i+vec2(1.0,0.0)); float c=hash(i+vec2(0.0,1.0)); float d=hash(i+vec2(1.0,1.0)); vec2 u=f*f*(3.0-2.0*f); return mix(a,b,u.x)+(c-a)*u.y*(1.0-u.x)+(d-b)*u.x*u.y;} void main(){ float t=time*0.3; float n=noise(vUv*10.0+vec2(t*0.5,-t*0.3)); float glow=smoothstep(0.2,0.7,n); vec3 col=vec3(0.3+glow*0.7,0.2+glow*0.5,0.6+glow*0.9); gl_FragColor=vec4(col,1.0);}` ,metalness:1, roughness:0.25, transparent:true});

    // Background 1 + PRINCE letters
    let princeLetters=[], birthdayMesh=null, oneMesh=null; const princeText="PRINCE"; let loadedFont=null;
    new THREE.FontLoader().load("https://threejs.org/examples/fonts/helvetiker_bold.typeface.json", font=>{
        loadedFont=font;
        let oneGeo=new THREE.TextGeometry("1",{font,font,size:120,height:10,bevelEnabled:true,bevelThickness:5,bevelSize:3}); oneGeo.center();
        let oneMat=new THREE.MeshStandardMaterial({color:0x3399ff,emissive:0x112244,metalness:0.5,roughness:0.6}); oneMesh=new THREE.Mesh(oneGeo,oneMat);
        oneMesh.position.y=180; oneMesh.position.z=-50; scene.add(oneMesh);

        let birthdayGeo=new THREE.TextGeometry("HAPPY BIRTHDAY",{font,font,size:36,height:6,bevelEnabled:true,bevelThickness:3,bevelSize:1.5}); birthdayGeo.center();
        let birthdayMat=new THREE.MeshStandardMaterial({color:0xffd98c,emissive:0xffaa33,metalness:0.8,roughness:0.35}); birthdayMesh=new THREE.Mesh(birthdayGeo,birthdayMat);
        birthdayMesh.position.y=180; scene.add(birthdayMesh);

        // PRINCE letters
        const total=princeText.length; const size=140; const height=15; const spacing=size*0.95; const totalWidth=spacing*(total-1); const xOffset=-totalWidth/2;
        for(let i=0;i<total;i++){
            let geo=new THREE.TextGeometry(princeText[i],{font, size, height, bevelEnabled:true, bevelThickness:5, bevelSize:3});
            geo.center(); let mesh=new THREE.Mesh(geo,nebulaMat); mesh.position.x=xOffset+i*spacing; mesh.position.y=0; mesh.position.z=-800;
            mesh.scale.set(0.1,0.1,0.1); mesh.rotation.x=(Math.random()-0.5)*0.5; mesh.rotation.y=(Math.random()-0.5)*0.5;
            mesh.material.opacity=0; mesh.visible=false; princeLetters.push(mesh); scene.add(mesh);
        }

        let currentLetter=0; let orbitStart=false;
        function revealNextLetter(){if(currentLetter<princeLetters.length){let mesh=princeLetters[currentLetter]; mesh.visible=true;
            let finalZ=0, duration=120, frame=0; function animateLetter(){if(frame<=duration){let t=frame/duration; let overshoot=1+0.2*Math.sin(t*Math.PI);
                mesh.position.z=-800*(1-t)+finalZ*t; mesh.scale.set((0.1+0.9*t)*overshoot,(0.1+0.9*t)*overshoot,(0.1+0.9*t)*overshoot); mesh.material.opacity=t;
                mesh.rotation.x*=(1-t); mesh.rotation.y*=(1-t); frame++; requestAnimationFrame(animateLetter);}} animateLetter(); currentLetter++; if(currentLetter===princeLetters.length){ setTimeout(()=>orbitStart=true,600);}
            setTimeout(revealNextLetter,350);}} revealNextLetter();
    });

    function animatePhase4(){
        requestAnimationFrame(animatePhase4);
        stars.rotation.y+=0.0005;
        let positions=stars.geometry.attributes.position.array;
        for(let i=0;i<starCount;i++){positions[i*3+2]+=Math.sin(Date.now()*0.001+i)*0.01*starVel[i];}
        stars.geometry.attributes.position.needsUpdate=true;
        if(orbitStart){ angle+=0.0012; camera.position.x=Math.sin(angle)*400; camera.position.z=Math.cos(angle)*400;}
        camera.lookAt(0,50,0);
        nebulaMat.uniforms.time.value+=0.03;
        if(birthdayMesh){ let glow=0.5+0.5*Math.sin(Date.now()*0.002); birthdayMesh.material.emissiveIntensity=glow; birthdayMesh.material.emissive.setHex(0xffaa33);}
        renderer.render(scene,camera);
    }
    animatePhase4();
}

</script>
</body>
</html>
