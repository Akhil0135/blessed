<!-- FULL HTML CODE WITH UPDATED PHASE 4 (IMAX GLOW + FASTER ROTATION + BIG "1") -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>IMAX — Combined Phases</title>
<style>
    html,body{
        margin:0;
        padding:0;
        background:black;
        overflow:hidden;
        font-family:'Cinzel',serif;
    }

    /* PHASE CONTAINERS */
    .phase{
        position:absolute;
        inset:0;
        display:flex;
        align-items:center;
        justify-content:center;
        opacity:0;
        transition:opacity 2s ease-in-out;
    }

    /* CAMERA ROTATION */
    @keyframes spinCamera {
        0%   { transform: rotateX(0deg) rotateY(0deg) rotateZ(0deg) scale(1); }
        100% { transform: rotateX(25deg) rotateY(360deg) rotateZ(35deg) scale(1); }
    }

    /* IMAX GLOW FOR "1" */
    .imaxOne{
        font-size:260px;
        font-weight:900;
        letter-spacing:10px;
        background: radial-gradient(circle, #ffffff, #b5b5b5, #777);
        -webkit-background-clip:text;
        color:transparent;
        filter:
            drop-shadow(0 0 45px #ffffff)
            drop-shadow(0 0 90px #8ecbff)
            drop-shadow(0 0 120px #1e90ff);
    }

    /* Happy Birthday */
    .hbText{
        font-size:60px;
        margin-top:25px;
        letter-spacing:10px;
        text-transform:uppercase;
        background: linear-gradient(90deg,#fff,#ffe0b8);
        -webkit-background-clip:text;
        color:transparent;
        filter: drop-shadow(0 0 20px #ffeecb);
    }
</style>
</head>
<body>

<!-- ============================ -->
<!-- PHASE 1 (YOUR ORIGINAL)       -->
<!-- ============================ -->
<div id="phase1" class="phase" style="opacity:1; background:black;">
    <canvas id="moonCanvas"></canvas>
</div>

<!-- ============================ -->
<!-- PHASE 2 (DAIVIK PIXEL REVEAL) -->
<!-- ============================ -->
<div id="phase2" class="phase">
    <canvas id="textCanvas"></canvas>
</div>

<!-- ============================ -->
<!-- PHASE 3 (DAIVIK EVOLUTION OUTPUT) -->
<!-- ============================ -->
<div id="phase3" class="phase">
    <canvas id="evoCanvas"></canvas>
</div>

<!-- ============================ -->
<!-- PHASE 4 (UPDATED AS REQUESTED) -->
<!-- ============================ -->
<div id="phase4" class="phase" style="background:black;">
    <div id="phase4Content" style="position:absolute; text-align:center; transform-origin:center; animation: spinCamera 2.5s linear infinite;">
        <div class="imaxOne">1</div>
        <div class="hbText">HAPPY BIRTHDAY</div>
    </div>
</div>

<script>
// ===================
// TIMING SEQUENCE
// ===================
setTimeout(()=>{
    document.getElementById('phase1').style.opacity=0;
    document.getElementById('phase2').style.opacity=1;
},3000);

setTimeout(()=>{
    document.getElementById('phase2').style.opacity=0;
    document.getElementById('phase3').style.opacity=1;
},8000);

// 7 SECOND DELAY BEFORE PHASE 4
setTimeout(()=>{
    document.getElementById('phase3').style.opacity=0;
    document.getElementById('phase4').style.opacity=1;
},15000);
</script>

</body>
</html>
