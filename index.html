<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Captain America Constellation Verse — Phase 2</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
    html,body{
        margin:0;
        padding:0;
        overflow:hidden;
        background:#02040a; /* Deep space */
        font-family: "Cinzel", serif;
    }
    canvas{ display:block; }

    /* Verse appears after constellation */
    #verse {
        position:absolute;
        top:12%;
        left:50%;
        transform:translateX(-50%);
        font-size:48px;
        color:#ffe8b3;
        text-shadow:0 0 18px #fff5d1, 0 0 35px #cfa96b;
        opacity:0;
        transition:1.5s ease;
        white-space:nowrap;
        pointer-events:none;
    }
</style>

</head>
<body>

<canvas id="canvas"></canvas>
<div id="verse"></div>

<script>
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

function resize(){
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
}
resize();
window.onresize = resize;

// ----------------------------
// SHIELD STAR PROPERTIES
// ----------------------------
let starSpin = false;
let starAngle = 0;

let cx, cy, R;

// ----------------------------
// BACKGROUND STAR FIELD
// ----------------------------
let bgStars = [];
const TOTAL_STARS = 250;

for(let i=0;i<TOTAL_STARS;i++){
    bgStars.push({
        x: Math.random()*window.innerWidth,
        y: Math.random()*window.innerHeight,
        r: Math.random()*1.2 + 0.4
    });
}

// ----------------------------
// VERSE TARGET LETTER POSITIONS
// ----------------------------
const verse = "He counts the stars and calls them each by name — Psalm 147:4";
let letterPoints = [];

function generateLetterPoints(){
    letterPoints = [];
    const topY = 120;

    const spacing = 18;
    const startX = window.innerWidth/2 - (verse.length*spacing)/2;

    for(let i=0;i<verse.length;i++){
        letterPoints.push({
            x: startX + i*spacing,
            y: topY
        });
    }
}
generateLetterPoints();

// ----------------------------
// CLICK HANDLER
// ----------------------------
canvas.addEventListener("click",(e)=>{
    let dx = e.clientX - cx;
    let dy = e.clientY - cy;
    if(Math.hypot(dx,dy) <= R*0.28){
        starSpin = true;
        forming = true;
    }
});

// ----------------------------
// CONSTELLATION FORMING CONTROL
// ----------------------------
let forming = false;
let verseShown = false;

// ----------------------------
// DRAW SHIELD + STAR
// ----------------------------
function drawShield(){
    cx = canvas.width/2;
    cy = canvas.height/2;
    R = Math.min(canvas.width, canvas.height)/3;

    ctx.save();
    ctx.translate(cx, cy);

    // OUTER RED
    let g1 = ctx.createRadialGradient(0,0,R*0.2,0,0,R);
    g1.addColorStop(0,"#3c0000");
    g1.addColorStop(1,"#7a0000");
    ctx.fillStyle = g1;
    ctx.beginPath();
    ctx.arc(0,0,R,0,Math.PI*2);
    ctx.fill();

    // WHITE RING
    let g2 = ctx.createRadialGradient(0,0,R*0.1,0,0,R*0.75);
    g2.addColorStop(0,"#dadada");
    g2.addColorStop(1,"#f5f5f5");
    ctx.fillStyle = g2;
    ctx.beginPath();
    ctx.arc(0,0,R*0.75,0,Math.PI*2);
    ctx.fill();

    // INNER RED
    let g3 = ctx.createRadialGradient(0,0,R*0.1,0,0,R*0.5);
    g3.addColorStop(0,"#4b0000");
    g3.addColorStop(1,"#8c0000");
    ctx.fillStyle = g3;
    ctx.beginPath();
    ctx.arc(0,0,R*0.5,0,Math.PI*2);
    ctx.fill();

    // BLUE CENTER (reduced glow)
    let g4 = ctx.createRadialGradient(0,0,R*0.05,0,0,R*0.35);
    g4.addColorStop(0,"#b4c7e0");
    g4.addColorStop(1,"#001933");
    ctx.fillStyle = g4;
    ctx.beginPath();
    ctx.arc(0,0,R*0.35,0,Math.PI*2);
    ctx.fill();

    // STAR (static unless clicked)
    ctx.save();
    if(starSpin) ctx.rotate(starAngle);

    const starR = R*0.28;
    ctx.beginPath();
    for(let i=0;i<5;i++){
        let o = (Math.PI*2/5)*i - Math.PI/2;
        let n = o + Math.PI/5;
        ctx.lineTo(Math.cos(o)*starR, Math.sin(o)*starR);
        ctx.lineTo(Math.cos(n)*(starR*0.45), Math.sin(n)*(starR*0.45));
    }
    ctx.closePath();

    // reduced glow star
    ctx.shadowColor="rgba(255,255,255,0.18)";
    ctx.shadowBlur=4;

    let sg = ctx.createRadialGradient(0,0,starR*0.1,0,0,starR);
    sg.addColorStop(0,"#ffffff");
    sg.addColorStop(0.4,"#eeeeee");
    sg.addColorStop(1,"#7a7a7a");
    ctx.fillStyle = sg;
    ctx.fill();

    ctx.restore();
    ctx.restore();
}

// ----------------------------
// SHOW VERSE AFTER CONSTELLATION
// ----------------------------
function showVerse(){
    const v = document.getElementById("verse");
    v.textContent = verse;
    v.style.opacity = 1;
}

// ----------------------------
// MAIN ANIMATION LOOP
// ----------------------------
function loop(){
    ctx.clearRect(0,0,canvas.width,canvas.height);

    // Draw stars
    for(let i=0;i<bgStars.length;i++){
        let s = bgStars[i];

        if(forming && i < letterPoints.length){
            // move star toward letter position
            let tx = letterPoints[i].x;
            let ty = letterPoints[i].y;
            s.x += (tx - s.x)*0.04;
            s.y += (ty - s.y)*0.04;
        }

        ctx.fillStyle="white";
        ctx.beginPath();
        ctx.arc(s.x,s.y,s.r,0,Math.PI*2);
        ctx.fill();
    }

    // Check if constellation finished
    if(forming && !verseShown){
        let allClose = true;
        for(let i=0;i<letterPoints.length;i++){
            let s = bgStars[i];
            let t = letterPoints[i];
            if(Math.hypot(s.x - t.x, s.y - t.y) > 3){
                allClose = false;
                break;
            }
        }
        if(allClose){
            verseShown = true;

            // fade out stars slowly
            for(let i=0;i<letterPoints.length;i++){
                setTimeout(()=>{ bgStars[i].r *= 0.4; }, i*6);
            }

            setTimeout(()=>{
                for(let i=0;i<letterPoints.length;i++){
                    bgStars[i].r = 0;
                }
                showVerse();
            }, 1500);
        }
    }

    if(starSpin) starAngle += 0.035;

    drawShield();
    requestAnimationFrame(loop);
}
loop();
</script>

</body>
</html>
