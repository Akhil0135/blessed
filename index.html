<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>IMAX Nolan — Moon → Sun → Text Reveal</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg-night-1:#070617;
    --bg-night-2:#120430;
    --text-contrast:#FFDFA0;
  }
  html,body{
    height:100%;
    margin:0;
    background:var(--bg-night-1);
    font-family:"Cinzel",serif;
    overflow:hidden;
    color:var(--text-contrast);
    -webkit-font-smoothing:antialiased;
  }

  #stage{
    position:relative;
    width:100%;
    height:100%;
    overflow:hidden;
    perspective:1400px;
  }

  #sky{position:absolute;inset:0;background:linear-gradient(180deg,var(--bg-night-1),var(--bg-night-2) 55%);z-index:0;transition:background 1.4s ease}

  .star{position:absolute;width:3px;height:3px;border-radius:50%;background:rgba(255,255,255,0.95);box-shadow:0 0 8px rgba(255,255,255,0.8);opacity:0.9;filter:blur(.8px);animation:twinkle var(--tw) infinite alternate}
  @keyframes twinkle{0%{opacity:.2;transform:scale(.5)}50%{opacity:1;transform:scale(1.3)}100%{opacity:.25;transform:scale(.7)}}

  #moon{
    position:absolute;
    width:190px;
    height:190px;
    border-radius:50%;
    background:radial-gradient(circle at 35% 30%, #ffffff, #f1e3b5 45%, #d8c08a 100%);
    top:18%;
    left:14%;
    box-shadow:0 0 120px rgba(255,245,200,0.14),0 0 260px rgba(255,240,200,0.06);
    cursor:grab;
    z-index:60;
    pointer-events:auto;
    transition:transform .08s linear,opacity .3s ease,left .28s ease,top .28s ease;
    display:flex;
    align-items:center;
    justify-content:center;
    transform:translate(-50%,-50%) rotate(0deg);
  }
  #moon:active{cursor:grabbing}
  #moon .flare{position:absolute;inset:-40px;border-radius:50%;background:radial-gradient(circle, rgba(255,245,200,0.12), rgba(255,245,200,0));filter:blur(36px);pointer-events:none}

  #sun{
    position:absolute;
    width:780px;
    height:780px;
    border-radius:50%;
    right:6vw; 
    top:20px; /* fixed at top */
    background: radial-gradient(circle at 38% 34%, #fff8e8 0%, #ffd98f 12%, #ffb258 32%, #ff8a30 60%, rgba(200,80,30,0.6) 85%, rgba(200,80,30,0) 100%);
    box-shadow:0 0 280px 90px rgba(255,220,140,0.12),0 0 420px 260px rgba(255,180,90,0.04);
    opacity:0;
    z-index:55;
    transition:opacity 1.6s ease, transform 1.6s ease;
  }

  #message{
    position:absolute;
    left:6%;
    right:6%;
    top:62%;
    text-align:center;
    z-index:80;
    font-size:38px;
    letter-spacing:2px;
    color:#FFDFA0;
    text-shadow:0 6px 24px rgba(40,10,60,0.65);
    pointer-events:none;
    transform:translateZ(0);
    font-weight:700;
    line-height:1.3;
    font-family:"Cinzel",serif;
    text-transform:uppercase; /* ALL CAPS */
  }
  .letter{display:inline-block;opacity:0;transform:translateY(12px);transition:opacity .12s ease, transform .12s ease}

  #stars{position:absolute;inset:0;z-index:20;pointer-events:none}

</style>
</head>
<body>
<div id="stage">
  <div id="sky"></div>
  <div id="stars"></div>
  <div id="moon"><div class="flare"></div></div>
  <div id="sun"></div>
  <div id="message"></div>
</div>

<script>
/* ---------------- Config ---------------- */
const fullText = "ON THIS CALM BIRTHDAY EVE SO NEW, GOD SOFTLY WHISPERS, MY PLANS ARE MADE FOR YOU.";
const ROTATION_NEEDED = 360;

/* ---------------- Utils ---------------- */
const $ = s => document.querySelector(s);
const mk = (t,c='') => { const e=document.createElement(t); if(c) e.className=c; return e; };

/* ---------------- Elements ---------------- */
const stage = $('#stage');
const moon = $('#moon');
const sun = $('#sun');
const message = $('#message');
const starsWrap = $('#stars');

let rotationDeg = 0;
let dragging = false;
let lastX = 0;

/* ---------------- Build stars ---------------- */
function makeStars(n=160){
  for(let i=0;i<n;i++){
    const s = mk('div','star');
    s.style.setProperty('--tw', (1.2 + Math.random()*3.4) + 's');
    s.style.left = (Math.random()*100) + '%';
    s.style.top = (Math.random()*80) + '%';
    s.style.opacity = (0.6 + Math.random()*0.4).toFixed(2);
    s.dataset.baseOpacity = s.style.opacity;
    starsWrap.appendChild(s);
  }
}
makeStars();

/* ---------------- Build message letters ---------------- */
const letters = [];
for (let i=0;i<fullText.length;i++){
  const span = mk('span','letter');
  span.textContent = fullText[i] === ' ' ? '\u00A0' : fullText[i];
  message.appendChild(span);
  letters.push(span);
}

/* ---------------- Drag handling ---------------- */
function onPointerDown(e){
  dragging = true;
  lastX = e.clientX ?? (e.touches && e.touches[0].clientX) ?? 0;
}
function onPointerUp(){ dragging=false; }
function onPointerMove(e){
  if(!dragging) return;
  const clientX = e.clientX ?? (e.touches && e.touches[0].clientX) ?? lastX;
  const dx = clientX - lastX;
  lastX = clientX;
  if(dx <=0) return;
  rotationDeg += dx*0.9;
  if(rotationDeg > ROTATION_NEEDED) rotationDeg = ROTATION_NEEDED;
  updateSceneByRotation(rotationDeg/ROTATION_NEEDED);
}
moon.addEventListener('pointerdown', onPointerDown);
document.addEventListener('pointerup', onPointerUp);
document.addEventListener('pointermove', onPointerMove);

/* ---------------- Update visuals ---------------- */
function updateSceneByRotation(t){
  t = Math.max(0, Math.min(1,t));

  // Moon movement & fade
  const moonLeft = 14 + t*46;
  moon.style.left = moonLeft + '%';
  moon.style.transform = `translate(-50%,-50%) rotate(${-t*360}deg)`;
  moon.style.opacity = `${Math.max(0,1-t*1.2)}`;

  // Text reveal
  const lettersToShow = Math.floor(t * letters.length);
  for(let i=0;i<letters.length;i++){
    if(i < lettersToShow){
      letters[i].style.opacity = 1;
      letters[i].style.transform = 'translateY(0)';
      letters[i].style.transitionDelay = (i*6/1000) + 's';
    } else {
      letters[i].style.opacity = 0;
      letters[i].style.transform = 'translateY(12px)';
      letters[i].style.transitionDelay = '0s';
    }
  }

  // Sun appear (fixed top-right)
  sun.style.opacity = `${Math.min(1, t*1.05)}`;
  sun.style.transform = `scale(${0.8+0.6*t})`;

  // Stars fade
  starsWrap.querySelectorAll('.star').forEach(s=>{
    const base = +s.dataset.baseOpacity || 1;
    s.style.opacity = Math.max(0, base*(1-t*1.2));
  });
}

</script>
</body>
</html>
