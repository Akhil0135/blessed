<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IMAX Nolan Blessing</title>
<style>
    body {
        margin: 0;
        overflow: hidden;
        background: #03030f;
        font-family: "Cinzel", serif;
        color: white;
    }

    /* IMAX bars */
    .imax-top, .imax-bottom {
        position: fixed;
        left: 0;
        width: 100%;
        height: 90px;
        background: linear-gradient(to bottom, rgba(0,0,0,0.9), transparent);
        pointer-events: none;
        z-index: 10;
    }
    .imax-bottom {
        bottom: 0;
        top: auto;
        background: linear-gradient(to top, rgba(0,0,0,0.9), transparent);
    }

    /* Blessing text */
    #title {
        position: fixed;
        top: 20px;
        width: 100%;
        text-align: center;
        font-size: 44px;
        letter-spacing: 3px;
        opacity: 1;
        color: #fdfdfd;
        text-shadow: 0 0 20px #ffffff33, 0 0 40px #fff3;
        z-index: 20;
    }

    /* Moon */
    #moon {
        position: absolute;
        top: 120px;
        left: 120px;
        width: 140px;
        height: 140px;
        border-radius: 50%;
        background: radial-gradient(circle at 30% 30%, #ffffff, #d0d0d0 40%, #808080 70%, #404040);
        box-shadow: 0 0 40px #ffffff66, 0 0 100px #ffffff33;
        opacity: 0;
        pointer-events: auto;
        z-index: 5;
        transition: opacity 2s ease;
    }

    /* Sun */
    #sun {
        position: absolute;
        top: 140px;
        left: 140px;
        width: 0px;
        height: 0px;
        border-radius: 50%;
        background: radial-gradient(circle, #ffdd55, #ff8800);
        box-shadow: 0 0 50px #ffcc33aa, 0 0 140px #ff880044;
        opacity: 0;
        z-index: 1;
    }

    /* Message appearing with drag */
    #message {
        position: fixed;
        bottom: 130px;
        width: 100%;
        text-align: center;
        font-size: 28px;
        letter-spacing: 1px;
        opacity: 0;
        transition: opacity 0.5s linear;
        text-shadow: 0 0 10px #ffffff44;
        z-index: 20;
    }

    /* Stars */
    .star {
        position: absolute;
        width: 2px;
        height: 2px;
        background: white;
        opacity: 0;
        border-radius: 50%;
        animation: twinkle 3s infinite ease-in-out;
    }
    @keyframes twinkle {
        0%,100% { opacity: 0.1; }
        50% { opacity: 1; }
    }
</style>
</head>
<body>

<div class="imax-top"></div>
<div class="imax-bottom"></div>

<div id="title">GOD BLESS YOU</div>

<div id="moon"></div>
<div id="sun"></div>

<div id="message"></div>

<script>
/* ---------------------------- Stars ---------------------------- */
for (let i = 0; i < 350; i++) {
    let s = document.createElement("div");
    s.className = "star";
    s.style.top = Math.random() * window.innerHeight + "px";
    s.style.left = Math.random() * window.innerWidth + "px";
    s.style.animationDelay = Math.random() * 3 + "s";
    document.body.appendChild(s);
}

/* -------------------- Show moon after 2 sec -------------------- */
setTimeout(() => {
    document.getElementById("moon").style.opacity = 1;
}, 2000);

/* ----------------------- Dragging Logic ------------------------ */
let moon = document.getElementById("moon");
let sun = document.getElementById("sun");
let msg = document.getElementById("message");

let dragging = false;
let offsetX, offsetY;

moon.addEventListener("mousedown", (e) => {
    dragging = true;
    offsetX = e.clientX - moon.offsetLeft;
    offsetY = e.clientY - moon.offsetTop;
});

document.addEventListener("mouseup", () => dragging = false);

document.addEventListener("mousemove", (e) => {
    if (!dragging) return;

    let x = e.clientX - offsetX;
    let y = e.clientY - offsetY;

    moon.style.left = x + "px";
    moon.style.top = y + "px";

    /* Drag progression (0 to 1) based on horizontal movement */
    let progress = Math.min(Math.max(x / (window.innerWidth - 150), 0), 1);

    /* Sun evolution */
    sun.style.opacity = progress;
    sun.style.width = 200 * progress + "px";
    sun.style.height = 200 * progress + "px";
    sun.style.left = (x + 60) + "px";
    sun.style.top = (y + 60) + "px";

    /* Message evolution */
    msg.style.opacity = progress;
    msg.innerHTML = "On this calm birthday eve so new, God softly whispers, my plans are made for you.";
});
</script>

</body>
</html>
