<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>IMAX — Nolan × Avengers — Birthday Tribute</title>
<style>
  /* ---------- Reset & base ---------- */
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;background:#030114;font-family:Inter,system-ui,Segoe UI,Roboto,'Helvetica Neue',Arial;color:#fff;overflow:hidden}
  :root{--imax-letterbox:12vh;--accent:#e5f1ff}

  /* ---------- Stage ---------- */
  .stage{position:fixed;inset:0;display:grid;place-items:center;overflow:hidden}
  .letterbox-top,.letterbox-bottom{position:absolute;left:0;right:0;height:var(--imax-letterbox);background:linear-gradient(180deg,rgba(0,0,0,0.98),rgba(0,0,0,0.75));z-index:1000;pointer-events:none}
  .letterbox-top{top:0}
  .letterbox-bottom{bottom:0}

  /* ---------- Backdrops ---------- */
  .cosmic{position:absolute;inset:0;background:radial-gradient(circle at 20% 25%, #0b1440 0%, transparent 12%), radial-gradient(circle at 85% 80%, #2b0b2d 0%, transparent 12%), linear-gradient(180deg,#08061a 0%,#000 70%);z-index:1;transform-origin:center;filter:contrast(1.05) saturate(1.08)}
  .nebula{position:absolute;inset:-20%;z-index:2;pointer-events:none;mix-blend-mode:screen;background:radial-gradient(circle at 30% 40%, rgba(255,120,160,0.06), transparent 12%), radial-gradient(circle at 75% 70%, rgba(80,150,255,0.05), transparent 12%);filter:blur(36px) saturate(1.2)}
  .stars{position:absolute;inset:0;z-index:3;pointer-events:none}
  .stars:after{content:'';position:absolute;inset:0;background-image:radial-gradient(#fff 0.9px, transparent 1px);background-size:260px 260px;opacity:0.35;mix-blend-mode:screen;filter:blur(.2px)}

  /* ---------- Shield container ---------- */
  .shield-wrap{position:relative;z-index:30;display:grid;place-items:center;width:58vmin;height:58vmin;transform-style:preserve-3d;perspective:1200px}
  .shield-svg{width:100%;height:100%;transform-origin:center center;filter:drop-shadow(0 30px 90px rgba(0,0,0,0.75))}

  /* ---------- Shield entrance ---------- */
  .shield-enter{animation:shieldRise 2.6s cubic-bezier(.2,.9,.2,1) forwards, shieldBounce 0.9s 2.6s cubic-bezier(.2,.9,.2,1) both}
  @keyframes shieldRise{0%{transform:translateY(28vh) scale(.28) rotateX(18deg) rotate(-10deg);opacity:0}60%{opacity:1;transform:translateY(-2vh) scale(1.05) rotateX(4deg) rotate(6deg)}100%{transform:translateY(0) scale(1) rotateX(0) rotate(0);opacity:1}}
  @keyframes shieldBounce{0%{transform:translateY(0)}30%{transform:translateY(-1.2vh)}60%{transform:translateY(0)}100%{transform:translateY(0)}}

  /* ---------- Star evolution & core pulse ---------- */
  #shield-star{transform-origin:center center;opacity:0;transform:scale(0) rotate(0deg);pointer-events:auto;transition:transform 1.1s cubic-bezier(0.22,1,0.36,1), opacity .7s ease-out}
  .star-core{transform-origin:center center;filter:drop-shadow(0 6px 18px rgba(255,255,255,0.06));}
  .star-evolve{opacity:1 !important;transform:scale(1) rotate(360deg) !important}

  /* ---------- Sheen & metallic sweep ---------- */
  .sheen{position:absolute;inset:0;pointer-events:none;mix-blend-mode:screen}
  .sheen:before{content:'';position:absolute;inset:-50% -30% -50% -30%;background:linear-gradient(90deg,transparent 0%, rgba(255,255,255,0.04) 42%, rgba(255,255,255,0.12) 50%, rgba(255,255,255,0.04) 58%, transparent 100%);transform:translateX(-120%);animation:sheenMove 2.8s 2s cubic-bezier(.2,.9,.2,1) forwards}
  @keyframes sheenMove{to{transform:translateX(140%)}}

  /* ---------- Portal sparks & sparks ---------- */
  .portal-sparks, .cosmic-flares{position:absolute;inset:0;z-index:25;pointer-events:none}
  .spark{position:absolute;width:3px;height:3px;border-radius:50%;background:linear-gradient(180deg,#ffe8a0,#ff7a7a);opacity:0.9;box-shadow:0 6px 20px rgba(255,120,120,0.12);animation:sparkRise 2s linear infinite}
  @keyframes sparkRise{0%{transform:translateY(20px) scale(0.4);opacity:0}10%{opacity:1}100%{transform:translateY(-120px) scale(1);opacity:0}}

  /* ---------- Lightning ---------- */
  .lightning-layer{position:absolute;inset:0;z-index:28;pointer-events:none}
  .lightning{position:absolute;width:2px;height:120px;background:linear-gradient(180deg,rgba(160,220,255,0.9),rgba(80,160,255,0.6));box-shadow:0 0 28px rgba(120,200,255,0.22);transform:rotate(12deg);opacity:0.95;filter:blur(0.6px);animation:lightFade .28s ease-out}
  @keyframes lightFade{0%{opacity:1;transform:scaleY(1.1)}100%{opacity:0;transform:scaleY(0.2)}}

  /* ---------- Particles / Burst ---------- */
  .burst{position:fixed;left:0;top:0;width:100%;height:100%;pointer-events:none;z-index:27}
  .burst-particle{position:absolute;width:6px;height:6px;border-radius:50%;background:rgba(255,240,220,0.9);box-shadow:0 6px 18px rgba(255,200,120,0.12);transform-origin:center;animation:burstMove 1.6s cubic-bezier(.22,1,.36,1) forwards}
  @keyframes burstMove{0%{opacity:1;transform:translate(-50%,-50%) scale(0)}60%{opacity:1}100%{opacity:0;transform:translate(-50%,-50%) scale(1.8) translateY(-220px)}}

  /* ---------- HUD / Title ---------- */
  .title{position:absolute;bottom:calc(var(--imax-letterbox) + 6vh);left:50%;transform:translateX(-50%);text-align:center;z-index:40;pointer-events:none}
  .greeting{font-size:clamp(12px,1.6vmin,18px);letter-spacing:6px;color:rgba(230,240,255,0.8);text-transform:uppercase;font-weight:600;opacity:0;transform:translateY(8px);animation:greetIn .9s 3.6s cubic-bezier(.2,.9,.2,1) forwards}
  .name{font-family:"Cinzel",serif;font-weight:700;font-size:clamp(28px,4.6vmin,72px);letter-spacing:.02em;color:var(--accent);opacity:0;transform:translateY(18px) scale(.92);animation:nameIn 1s 3.9s cubic-bezier(.2,.9,.2,1) forwards}
  @keyframes greetIn{to{opacity:1;transform:translateY(0)}}
  @keyframes nameIn{to{opacity:1;transform:translateY(0) scale(1)}}

  /* ---------- Small UI ---------- */
  .ui{position:fixed;right:18px;bottom:18px;z-index:110}
  .btn{background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.06);padding:8px 12px;border-radius:8px;color:#cfe8ff;font-size:13px;backdrop-filter: blur(6px);cursor:pointer}

  /* ---------- IMAX shift class (aspect feel) ---------- */
  .imax-shift .letterbox-top,.imax-shift .letterbox-bottom{height:6vh;transition:height .36s ease}
  .imax-shift .cosmic{transform:scale(1.03);transition:transform .36s ease}

  /* ---------- small helpers ---------- */
  .caption{position:absolute;bottom:calc(var(--imax-letterbox) + 2vh);left:50%;transform:translateX(-50%);z-index:40;font-size:12px;color:rgba(200,220,255,0.6);letter-spacing:1px}
  .grain{position:absolute;inset:0;z-index:900;pointer-events:none;mix-blend-mode:overlay;opacity:0.06;background-image:linear-gradient(0deg, rgba(255,255,255,0.02) 1px, transparent 1px);background-size:100% 3px}

  /* ---------- Ripple and flares placeholders ---------- */
  .light-ripples,.space-bloom{position:absolute;inset:0;z-index:22;pointer-events:none}
  .ripple{position:absolute;width:10vmax;height:10vmax;border-radius:50%;border:1px solid rgba(160,200,255,0.06);transform:translate(-50%,-50%) scale(0);animation:rippleGrow 3s ease-out forwards}
  @keyframes rippleGrow{to{transform:translate(-50%,-50%) scale(1.6);opacity:0}}

  /* ---------- responsive tweaks ---------- */
  @media (max-aspect-ratio:3/4){:root{--imax-letterbox:9vh}} 
</style>
</head>
<body>
  <div class="stage" id="stage">
    <div class="cosmic" id="cosmic"></div>
    <div class="nebula"></div>
    <div class="stars"></div>
    <div class="cosmic-flares"></div>
    <div class="portal-sparks"></div>
    <div class="lightning-layer"></div>
    <div class="light-ripples"></div>
    <div class="space-bloom"></div>

    <div class="shield-wrap" id="shieldWrap" aria-hidden="true">
      <!-- Shield SVG (original artwork) -->
      <svg class="shield-svg" viewBox="0 0 200 200" id="shieldSVG" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Shield">
        <defs>
          <radialGradient id="metalGrad" cx="50%" cy="30%" r="70%">
            <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95"/>
            <stop offset="35%" stop-color="#e6eefc" stop-opacity="0.9"/>
            <stop offset="100%" stop-color="#b8c5d9" stop-opacity="1"/>
          </radialGradient>
          <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
            <feGaussianBlur stdDeviation="2.2" result="blur"/>
            <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
          </filter>
        </defs>

        <!-- outer rings -->
        <g id="rings" transform="translate(100,100)">
          <circle r="92" fill="#07122a" />
          <circle r="76" fill="#c62828" />
          <circle r="56" fill="#ffffff" />
          <circle r="36" fill="#254f95" />
        </g>

        <!-- central star (THIS ID USED BY SCRIPT) -->
        <g id="shield-star" transform="translate(100,100) scale(0.9)" opacity="0">
          <polygon class="star-core" points="0,-28 6,-8 26,-6 10,6 14,26 0,14 -14,26 -10,6 -26,-6 -6,-8" fill="#fff" filter="url(#glow)"/>
        </g>

      </svg>
      <div class="sheen" aria-hidden="true"></div>
    </div>

    <div class="hud">
      <div class="scan"></div>
    </div>

    <div class="title">
      <div class="greeting">Happy Birthday</div>
      <div class="name" id="nameText">Someone</div>
    </div>

    <div class="caption">An IMAX • Nolan-grade Avengers tribute</div>

    <div class="burst" id="burst"></div>
    <div class="grain"></div>
    <div class="letterbox-top"></div>
    <div class="letterbox-bottom"></div>

    <div class="ui">
      <button class="btn" id="replayBtn">Replay</button>
    </div>
  </div>

<script>
(function(){
  // Elements
  const stage = document.getElementById('stage');
  const shieldSVG = document.getElementById('shieldSVG');
  const shieldStar = document.getElementById('shield-star');
  const shieldWrap = document.getElementById('shieldWrap');
  const nameText = document.getElementById('nameText');
  const replayBtn = document.getElementById('replayBtn');
  const cosmicFlares = document.querySelector('.cosmic-flares');
  const portalSparks = document.querySelector('.portal-sparks');
  const lightningLayer = document.querySelector('.lightning-layer');
  const burst = document.getElementById('burst');
  const lightRipples = document.querySelector('.light-ripples');
  const spaceBloom = document.querySelector('.space-bloom');

  // Friendly name detection (best-effort)
  try{ const guess = document.title.match(/[A-Z][a-z]{2,}/g); if(guess && guess.length) nameText.textContent = guess[0]; }catch(e){}

  // Build dynamic visuals: flares, sparks
  function createFlares(){
    for(let i=0;i<6;i++){
      const f=document.createElement('div'); f.className='flare'; f.style.left=(10 + Math.random()*80)+'%'; f.style.top=(5 + Math.random()*70)+'%'; f.style.opacity = 0.7; cosmicFlares.appendChild(f);
    }
  }

  function createSparks(){
    for(let i=0;i<48;i++){
      const s=document.createElement('div'); s.className='spark'; s.style.left=(10 + Math.random()*80)+'%'; s.style.top=(40 + Math.random()*40)+'%'; s.style.animationDelay=(Math.random()*1.4)+'s'; portalSparks.appendChild(s);
    }
  }

  function lightningFlash(){
    const l=document.createElement('div'); l.className='lightning'; l.style.left=(10 + Math.random()*80)+'%'; l.style.top=(10 + Math.random()*80)+'%'; lightningLayer.appendChild(l);
    setTimeout(()=>{ if(l && l.parentNode) l.parentNode.removeChild(l); }, 360);
  }

  function makeBurst(){
    // create 80 particles originating near center
    for(let i=0;i<80;i++){
      const p=document.createElement('div'); p.className='burst-particle';
      const angle = Math.random()*Math.PI*2; const radius = 8 + Math.random()*24;
      p.style.left = `calc(50% + ${Math.cos(angle)*4}%)`; p.style.top = `calc(50% + ${Math.sin(angle)*4}%)`;
      p.style.background = `radial-gradient(circle at 30% 30%, rgba(255,240,220,0.95), rgba(255,200,120,0.85))`;
      p.style.animationDelay = (Math.random()*0.6)+'s';
      burst.appendChild(p);
    }
    setTimeout(()=>{ burst.innerHTML = ''; }, 2200);
  }

  function rippleOnce(){
    const r=document.createElement('div'); r.className='ripple'; r.style.left='50%'; r.style.top='50%'; lightRipples.appendChild(r);
    setTimeout(()=>{ if(r && r.parentNode) r.parentNode.removeChild(r); }, 3000);
  }

  function spaceBloomOnce(){
    spaceBloom.classList.add('active'); spaceBloom.style.transition='opacity .9s ease-out'; spaceBloom.style.opacity = 0.22;
    setTimeout(()=>{ spaceBloom.style.opacity = 0; }, 1200);
  }

  // Main animation sequence
  function runSequence(){
    // reset
    shieldSVG.classList.remove('shield-enter'); shieldStar.style.opacity = 0; shieldStar.style.transform = 'scale(0) rotate(0deg)';
    burst.innerHTML = ''; portalSparks.innerHTML = ''; cosmicFlares.innerHTML = '';

    // slow cinematic zoom
    stage.animate([{transform:'scale(1)'},{transform:'scale(1.04)'}],{duration:7800,fill:'forwards',easing:'linear'});

    // create visual elements
    createFlares(); createSparks();

    // show shield
    setTimeout(()=>{ shieldSVG.classList.add('shield-enter'); }, 200);

    // IMAX shift briefly when shield arrives
    setTimeout(()=>{ document.body.classList.add('imax-shift'); setTimeout(()=>{ document.body.classList.remove('imax-shift'); }, 1500); }, 2400);

    // star evolve from center timed after shield
    setTimeout(()=>{
      shieldStar.style.opacity = 1; shieldStar.style.transform = 'scale(1) rotate(360deg)'; shieldStar.classList.add('star-evolve');
    }, 1700);

    // sheen sweep and ripples
    setTimeout(()=>{ rippleOnce(); }, 2000);

    // small lightning bursts during reveal
    setTimeout(()=>{ lightningFlash(); setTimeout(lightningFlash, 260); }, 2100);

    // burst particles
    setTimeout(()=>{ makeBurst(); }, 2300);

    // space bloom
    setTimeout(()=>{ spaceBloomOnce(); }, 1800);

    // name reveal timing handled by CSS; nudge letter spacing for flair
    nameText.style.letterSpacing = '0.18em'; nameText.animate([{letterSpacing:'0.6em'},{letterSpacing:'0.02em'}],{duration:1200,delay:3800,easing:'cubic-bezier(.2,.9,.2,1)',fill:'forwards'});

    // subtle camera rumble
    setTimeout(()=>{ stage.animate([{transform:'translateY(0)'},{transform:'translateY(-6px)'},{transform:'translateY(0)'}],{duration:900,iterations:1,easing:'cubic-bezier(.2,.9,.2,1)'}); },2600);
  }

  // star interaction: evolve + click spin
  if(shieldStar){
    // ensure initial invisible state
    shieldStar.style.opacity = 0; shieldStar.style.transform = 'scale(0) rotate(0deg)';

    // click to spin
    shieldStar.addEventListener('click', ()=>{
      shieldStar.style.transition = 'transform 0.35s ease-out';
      shieldStar.style.transform = 'scale(1.04) rotate(720deg)';
      setTimeout(()=>{ shieldStar.style.transition = 'transform 1.1s cubic-bezier(0.22,1,0.36,1)'; shieldStar.style.transform = 'scale(1) rotate(0deg)'; }, 370);
    });

    // also add pointer cursor for discoverability
    shieldStar.style.cursor = 'pointer';
  }

  // keyboard / button controls
  replayBtn.addEventListener('click', ()=>{ runSequence(); });
  window.addEventListener('keydown',(e)=>{ if(e.code==='Space'){ e.preventDefault(); runSequence(); } });

  // subtle parallax
  stage.addEventListener('mousemove',(e)=>{
    const rect = stage.getBoundingClientRect();
    const dx = (e.clientX - rect.left)/rect.width - 0.5; const dy = (e.clientY - rect.top)/rect.height - 0.5;
    shieldWrap.style.transform = `translate3d(${dx*8}px,${dy*8}px,0) rotateX(${dy*3}deg) rotateY(${dx*3}deg)`;
  });
  stage.addEventListener('mouseleave', ()=>{ shieldWrap.style.transform = 'translateZ(0)'; });

  // auto-run on load
  window.addEventListener('load', ()=>{ runSequence(); });

  // periodic lightning to keep energy
  setInterval(()=>{ lightningFlash(); }, 3800);

})();
</script>
  <script>
    /* --- STAR EVOLUTION FROM CENTER --- */
    const star = document.getElementById('shield-star');
    if(star){
      // reset initial state
      star.style.opacity = 0;
      star.style.transformOrigin = 'center center';
      star.style.transform = 'scale(0) rotate(0deg)';
      star.style.transition = 'transform 1.2s cubic-bezier(0.22,1,0.36,1), opacity 0.8s ease-out';

      // evolve from centre
      setTimeout(()=>{
        star.style.opacity = 1;
        star.style.transform = 'scale(1) rotate(360deg)';
      }, 1200);

      // glow pulse
        star.style.filter = 'drop-shadow(0 0 12px #3ec5ff) drop-shadow(0 0 22px #3ec5ff)';

        // quick spin on click
      star.addEventListener('click', ()=>{
        star.style.transition = 'transform 0.28s ease-out';
        star.style.transform = 'scale(1.05) rotate(720deg)';
        // particle burst
        for(let i=0;i<20;i++){
          const p=document.createElement('div');
          p.className='star-particle';
          p.style.left=event.clientX+'px';
          p.style.top=event.clientY+'px';
          p.style.position='fixed';
          p.style.width='6px';
          p.style.height='6px';
          p.style.background='#3ec5ff';
          p.style.borderRadius='50%';
          p.style.opacity='1';
          p.style.transition='transform 0.8s ease-out, opacity 0.8s ease-out';
          document.body.appendChild(p);
          const angle=Math.random()*360;
          const dist=80+Math.random()*40;
          p.style.transform=`translate(${Math.cos(angle)*dist}px, ${Math.sin(angle)*dist}px)`;
          p.style.opacity='0';
          setTimeout(()=>p.remove(),800);
        }

        setTimeout(()=>{
          star.style.transition = 'transform 1s cubic-bezier(0.22,1,0.36,1)';
          star.style.transform = 'scale(1) rotate(0deg)';
        }, 300);
      });
    }
  </script>
</body>
</html>
