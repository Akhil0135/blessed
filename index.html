<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>IMAX Cinematic Full</title>
<style>
html, body {
    margin: 0;
    padding: 0;
    overflow: hidden;
    background: #000;
}
canvas { display: block; }

/* Stage 1 */
#stage1 { position: relative; width: 100%; height: 100%; }
#stage1 #instruction {
    position: absolute; top: 20px; width: 100%; text-align: center;
    font-size: 22px; color: #fff; text-shadow: 0 0 8px #000; z-index:5;
}
#stage1 #message {
    position: absolute; bottom: 80px; width: 100%; text-align:center;
    font-size: 26px; font-weight:600; color:#ffd27f; letter-spacing:2px;
    text-shadow:0 0 5px #d9a441; opacity:0; transition:opacity 1.5s ease; z-index:5;
}
#stage1 #sun {
    position:absolute; width:260px; height:260px; border-radius:50%;
    background: radial-gradient(circle,#fff7c0 0%,#ffcc33 40%,#d68b00 70%,#000 100%);
    box-shadow: 0 0 50px #ffb300; top:-300px; right:-300px; opacity:0;
    transition: all 2.5s ease-in-out; z-index:3;
}
#stage1 #moon {
    position:absolute; width:200px; height:200px; left:40px; top:40px; border-radius:50%;
    cursor: grab;
    background: radial-gradient(circle at 30% 30%, #d9d9d9 0%, #c0c0c0 20%, #9a9a9a 45%, #6d6d6d 70%, #2a2a2a 100%);
    box-shadow:0 0 15px rgba(180,180,255,0.8), inset -20px -20px 40px rgba(0,0,0,0.5);
    transition: box-shadow 0.3s ease; z-index:5;
}
#stage1 #ambient {
    position:absolute; width:100%; height:100%;
    background: radial-gradient(circle at 50% 70%, rgba(30,60,150,0.25), transparent 70%);
    pointer-events:none; z-index:1;
}

/* Stage 2 */
#stage2 { display:none; position:absolute; width:100%; height:100%; top:0; left:0; }
#stage2 #verse {
    position:absolute; top:40px; left:50%;
    transform:translateX(-50%) scale(0.2);
    font-size:32px; color:#ffe9a6;
    text-shadow:0 0 8px #fff2b3,0 0 15px #e6d37a;
    opacity:0; transition: all 1s ease-out; white-space:nowrap; z-index:5;
}

/* Stage 3 */
#stage3 { display:none; position:absolute; width:100%; height:100%; top:0; left:0; }
#stage3 button {
    position:absolute; bottom:40px; left:50%; transform:translateX(-50%);
    padding:15px 30px; font-size:20px; font-weight:bold;
    background: linear-gradient(90deg,#ff0066,#ffcc00,#00ccff);
    border:none; border-radius:10px; cursor:pointer;
    box-shadow:0 0 20px rgba(255,255,255,0.6);
    color:#fff; opacity:0; transition:opacity 1s ease; z-index:1000;
}

/* Phase 4 */
#phase4 { display:none; width:100%; height:100%; position:absolute; top:0; left:0; }
</style>
</head>

<body>

<div id="stage1">
    <div id="instruction">Drag the moon to the end</div>
    <canvas id="stars"></canvas>
    <div id="ambient"></div>
    <div id="moon"></div>
    <div id="sun"></div>
    <div id="message">
        ON THIS CALM BIRTHDAY EVE SO NEW, GOD SOFTLY WHISPERS, MY PLANS ARE MADE FOR YOU.
    </div>
    <audio id="whoosh" src="https://cdn.pixabay.com/download/audio/2021/09/16/audio_4f1c1c9f28.mp3"></audio>
</div>

<div id="stage2">
    <canvas id="shieldCanvas"></canvas>
    <div id="verse">He counts the stars and calls them each by name — Psalm 147:4</div>
</div>

<div id="stage3">
    <canvas id="c"></canvas>
    <button id="clickBtn">Click Here</button>
</div>

<div id="phase4"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/examples/js/loaders/FontLoader.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/examples/js/geometries/TextGeometry.js"></script>

<script>
/* ================= STAGE 1 ================= */
const moon=document.getElementById("moon");
const message=document.getElementById("message");
const sun=document.getElementById("sun");
const whoosh=document.getElementById("whoosh");

let dragging=false, offsetX=0, offsetY=0, revealIndex=0;
const fullMsg=message.innerText; message.innerText="";

moon.addEventListener("mousedown",e=>{
    dragging=true;
    offsetX=e.clientX-moon.offsetLeft;
    offsetY=e.clientY-moon.offsetTop;
    whoosh.currentTime=0; whoosh.play();
});
document.addEventListener("mouseup",()=>dragging=false);
document.addEventListener("mousemove",e=>{
    if(!dragging) return;
    moon.style.left=(e.clientX-offsetX)+"px";
    moon.style.top=(e.clientY-offsetY)+"px";
    reveal();
});

/* MOBILE TOUCH */
moon.addEventListener("touchstart",e=>{
    e.preventDefault();
    dragging=true;
    const t=e.touches[0];
    offsetX=t.clientX-moon.offsetLeft;
    offsetY=t.clientY-moon.offsetTop;
    whoosh.currentTime=0; whoosh.play();
},{passive:false});

document.addEventListener("touchend",()=>dragging=false);
document.addEventListener("touchmove",e=>{
    if(!dragging) return;
    const t=e.touches[0];
    moon.style.left=(t.clientX-offsetX)+"px";
    moon.style.top=(t.clientY-offsetY)+"px";
    reveal();
},{passive:false});

function reveal(){
    if(revealIndex<fullMsg.length){
        message.style.opacity=1;
        message.innerText=fullMsg.substring(0,revealIndex++);
    }
    if(revealIndex>=fullMsg.length){
        moon.style.opacity=0;
        setTimeout(()=>{
            sun.style.opacity=1;
            sun.style.top="40px";
            sun.style.right="40px";
            setTimeout(startStage2,5000);
        },800);
    }
}

/* ================= STAGE 2 ================= */
const stage1=document.getElementById("stage1");
const stage2=document.getElementById("stage2");
const shieldCanvas=document.getElementById("shieldCanvas");
const ctx=shieldCanvas.getContext("2d");
shieldCanvas.width=innerWidth; shieldCanvas.height=innerHeight;
const R=Math.min(innerWidth,innerHeight)/3;
const verse=document.getElementById("verse");

function startStage2(){
    stage1.style.display="none";
    stage2.style.display="block";
}

shieldCanvas.addEventListener("click",handleShield);
shieldCanvas.addEventListener("touchstart",e=>{
    const t=e.touches[0];
    handleShield({clientX:t.clientX,clientY:t.clientY});
},{passive:true});

function handleShield(e){
    verse.style.opacity=1;
    verse.style.transform="translateX(-50%) scale(1)";
    setTimeout(startStage3,7000);
}

/* ================= STAGE 3 ================= */
const stage3=document.getElementById("stage3");
const btn=document.getElementById("clickBtn");

function startStage3(){
    stage2.style.display="none";
    stage3.style.display="block";
    setTimeout(()=>btn.style.opacity=1,3000);
}

btn.addEventListener("click",()=>advance());
btn.addEventListener("touchstart",e=>{e.preventDefault();advance();},{passive:false});

function advance(){
    btn.style.display="none";
    const b2=document.createElement("button");
    b2.innerText="Click Here";
    Object.assign(b2.style,{position:"absolute",bottom:"40px",left:"50%",transform:"translateX(-50%)",opacity:1});
    stage3.appendChild(b2);
    b2.addEventListener("click",startPhase4);
    b2.addEventListener("touchstart",e=>{e.preventDefault();startPhase4();},{passive:false});
}

/* ================= PHASE 4 ================= */
function startPhase4(){
    stage3.style.display="none";
    document.getElementById("phase4").style.display="block";
    /* YOUR PHASE 4 THREE.JS CODE REMAINS EXACTLY THE SAME */
}
</script>
</body>
</html>
