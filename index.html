<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Phase 2 — MCU Shield 3D Star</title>
<style>
html, body {
    margin: 0;
    padding: 0;
    overflow: hidden;
    background: #0a0a1a; /* Cinematic deep blue-black background */
}
canvas {
    display: block;
}
</style>
</head>
<body>
<canvas id="shieldCanvas"></canvas>
<script>
// -------------------- CANVAS SETUP --------------------
const canvas = document.getElementById('shieldCanvas');
const ctx = canvas.getContext('2d');

function resize() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
}
resize();
window.onresize = resize;

// -------------------- STARRY BACKGROUND --------------------
const stars = [];
for (let i = 0; i < 200; i++) {
    stars.push({
        x: Math.random() * canvas.width,
        y: Math.random() * canvas.height,
        z: Math.random() * 1.5 + 0.5,
        tw: Math.random() * 0.02 + 0.005
    });
}

function drawStars() {
    ctx.fillStyle = "#0a0a1a";
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    stars.forEach(s => {
        const glow = (Math.sin(Date.now() * s.tw) + 1) * 0.5;
        ctx.fillStyle = `rgba(255,255,255,${glow})`;
        ctx.beginPath();
        ctx.arc(s.x, s.y, s.z, 0, Math.PI*2);
        ctx.fill();
    });
}

// -------------------- SHIELD PARAMETERS --------------------
const shieldRadius = 150; // Main radius
const shieldX = canvas.width / 2;
const shieldY = canvas.height / 2;
let angle = 0;

// Draw the shield
function drawShield(x, y, r, rotation) {
    ctx.save();
    ctx.translate(x, y);

    // --------- ROTATING OUTER RINGS ---------
    ctx.rotate(rotation);

    // Outer Red
    ctx.beginPath();
    ctx.arc(0, 0, r, 0, Math.PI*2);
    ctx.fillStyle = '#aa0000';
    ctx.fill();

    // Inner White
    ctx.beginPath();
    ctx.arc(0, 0, r*0.8, 0, Math.PI*2);
    ctx.fillStyle = '#ffffff';
    ctx.fill();

    // Inner Red
    ctx.beginPath();
    ctx.arc(0, 0, r*0.6, 0, Math.PI*2);
    ctx.fillStyle = '#aa0000';
    ctx.fill();

    ctx.restore();

    // --------- FIXED NAVY BLUE CENTER ---------
    ctx.save();
    ctx.translate(x, y);

    // Center Navy Blue Ring
    ctx.beginPath();
    ctx.arc(0, 0, r*0.4, 0, Math.PI*2);
    const metallicGradient = ctx.createRadialGradient(0,0,r*0.05,0,0,r*0.4);
    metallicGradient.addColorStop(0,'#6a7a8c');
    metallicGradient.addColorStop(0.5,'#001f3f');
    metallicGradient.addColorStop(1,'#001830');
    ctx.fillStyle = metallicGradient;
    ctx.fill();

    // --------- 3D METALLIC STAR ---------
    const starR = r*0.15;
    const starPoints = [];
    for (let i = 0; i < 5; i++) {
        starPoints.push({
            x: Math.cos((18 + i*72)*Math.PI/180)*starR,
            y: -Math.sin((18 + i*72)*Math.PI/180)*starR
        });
        starPoints.push({
            x: Math.cos((54 + i*72)*Math.PI/180)*(starR*0.5),
            y: -Math.sin((54 + i*72)*Math.PI/180)*(starR*0.5)
        });
    }

    // Create metallic gradient for star
    const starGradient = ctx.createRadialGradient(0,0,starR*0.1,0,0,starR);
    starGradient.addColorStop(0,'#ffffff');
    starGradient.addColorStop(0.3,'#dddddd');
    starGradient.addColorStop(0.6,'#aaaaaa');
    starGradient.addColorStop(1,'#555555');
    ctx.fillStyle = starGradient;

    ctx.beginPath();
    ctx.moveTo(starPoints[0].x, starPoints[0].y);
    for(let i=1;i<starPoints.length;i++){
        ctx.lineTo(starPoints[i].x, starPoints[i].y);
    }
    ctx.closePath();
    ctx.shadowColor = 'rgba(255,255,255,0.3)';
    ctx.shadowBlur = 8;
    ctx.fill();

    ctx.restore();
}

// -------------------- ANIMATION LOOP --------------------
function animate() {
    drawStars();
    angle += 0.01; // Smooth rotation of outer rings
    drawShield(shieldX, shieldY, shieldRadius, angle);

    requestAnimationFrame(animate);
}

animate();
</script>
</body>
</html>
