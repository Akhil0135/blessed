<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>IMAX Nolan — Final Cinematic (Moon → Sun)</title>
<style>
    html,body{
        margin:0;padding:0;
        background:#02020A;
        height:100%;
        overflow:hidden;
        font-family:"Cinzel",serif;
        color:white;
    }

    /* --- IMAX 70mm Grain --- */
    #grain{
        position:fixed;
        top:0;left:0;
        width:100%;height:100%;
        pointer-events:none;
        background:url('data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAEAAAABACAQAAAC1+jfqAAAAIUlEQVR4Ae3BAQ0AAADCoPdPbQ43oAAAAAAAAAAAAPgGzNQAAUkbAG4AAAAASUVORK5CYII=');
        opacity:0.09;
        mix-blend-mode:overlay;
        animation:grainMove 1.8s steps(6) infinite;
    }
    @keyframes grainMove{
        0%{transform:translate(0,0);}50%{transform:translate(2px,-2px);}100%{transform:translate(-1px,1px);} 
    }

    #scene{
        width:100%;height:100%;position:relative;
        background:radial-gradient(circle at 50% 80%, #120A2A, #02020A 80%);
        overflow:hidden;
    }

    /* Stars */
    .star{
        position:absolute;
        width:2px;height:2px;
        border-radius:50%;
        background:white;
        opacity:0.7;
        animation:twinkle 2s infinite ease-in-out;
    }
    @keyframes twinkle{
        0%,100%{opacity:0.3;}50%{opacity:1;}
    }

    /* Clouds */
    .cloud{
        position:absolute;
        top:20%;
        width:400px;height:150px;
        background:rgba(255,255,255,0.05);
        filter:blur(40px);
        border-radius:50%;
        animation: drift 50s linear infinite;
    }
    @keyframes drift{
        from{transform:translateX(-500px);} to{transform:translateX(1600px);}    }

    /* Fog */
    #fog{
        position:absolute;
        bottom:0;
        width:100%;height:45%;
        background:linear-gradient(to top, rgba(255,255,255,0.12), transparent);
        filter:blur(35px);
        opacity:0.35;
    }

    /* God Bless You */
    #gb{
        position:absolute;
        top:4%;
        width:100%;
        text-align:center;
        font-size:2.4rem;
        font-weight:600;
        letter-spacing:2px;
        text-shadow:0 0 25px rgba(255,220,180,0.55);
        z-index:10;
    }

    /* Moon at top-left */
    #moon{
        width:180px;height:180px;
        border-radius:50%;
        background:radial-gradient(circle,#F8F7FF,#CFCBEF 60%,#918CC5 100%);
        box-shadow:0 0 65px #C7C3FF;
        position:absolute;
        top:12%;left:8%;
        cursor:grab;
        transition:opacity 0.25s linear;
    }

    /* Sun at top-right evolving */
    #sun{
        width:120px;height:120px;
        border-radius:50%;
        background:radial-gradient(circle,#FFEAA8,#FF9E00 60%,#B46200 100%);
        box-shadow:0 0 150px #FFB834;
        position:absolute;
        top:12%;right:8%;
        transform:scale(0);
        opacity:0;
    }

    #flare{
        position:absolute;
        top:12%;right:8%;
        width:600px;height:600px;
        background:radial-gradient(circle, rgba(255,182,90,0.25), transparent 75%);
        transform:translate(50%,50%) scale(0);
        pointer-events:none;
        opacity:0;
        filter:blur(40px);
    }

    #message{
        position:absolute;
        bottom:11%;
        width:100%;
        text-align:center;
        font-size:2rem;
        opacity:0;
        transform:translateY(40px);
        text-shadow:0 0 30px rgba(255,235,190,0.55);
    }
</style>
</head>
<body>
<div id="scene">

    <div id="gb">God Bless You</div>

    <!-- Stars -->
    <script>
    for(let i=0;i<250;i++){
        const s=document.createElement('div');
        s.className='star';
        s.style.left=Math.random()*100+'%';
        s.style.top=Math.random()*100+'%';
        s.style.animationDuration=(1.5+Math.random()*2)+'s';
        document.body.appendChild(s);
    }
    </script>

    <div class="cloud" style="top:28%; animation-duration:55s;"></div>
    <div class="cloud" style="top:42%; animation-duration:70s;"></div>
    <div class="cloud" style="top:58%; animation-duration:90s;"></div>

    <div id="fog"></div>

    <div id="moon"></div>
    <div id="sun"></div>
    <div id="flare"></div>

    <div id="message">"On this calm birthday eve so new, God softly whispers, my plans are made for you."</div>
</div>

<div id="grain"></div>

<script>
const moon=document.getElementById("moon");
const sun=document.getElementById("sun");
const flare=document.getElementById("flare");
const message=document.getElementById("message");

let dragging=false;
let offsetX=0,offsetY=0;
let evo=0;

moon.addEventListener("mousedown",startDrag);
document.addEventListener("mousemove",drag);
document.addEventListener("mouseup",()=>dragging=false);

function startDrag(e){
    dragging=true;
    offsetX=e.clientX-moon.offsetLeft;
    offsetY=e.clientY-moon.offsetTop;
}

function drag(e){
    if(!dragging)return;

    moon.style.left=(e.clientX-offsetX)+"px";
    moon.style.top=(e.clientY-offsetY)+"px";

    evo+=0.01;
    if(evo>1)evo=1;

    updateScene();
}

function updateScene(){
    // Sun growth
    const sunScale=0+evo*5.8;
    const flareScale=0+evo*7.5;

    sun.style.transform=`scale(${sunScale})`;
    sun.style.opacity=evo;

    flare.style.transform=`translate(50%,50%) scale(${flareScale})`;
    flare.style.opacity=evo*0.85;

    // Moon fading
    moon.style.opacity=1-evo;
    moon.style.transform=`scale(${1-evo*0.7})`;

    // Message reveal
    message.style.opacity=evo;
    message.style.transform=`translateY(${40-40*evo}px)`;

    // Subtle camera push-in
    document.body.style.transform=`scale(${1+evo*0.02})`;
}
</script>
</body>
</html>
