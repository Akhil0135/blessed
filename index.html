<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cinematic Day Scene</title>
<style>
  body {
    margin: 0;
    height: 100vh;
    background: linear-gradient(to bottom, #0a0f24 0%, #000814 70%, #000000 100%);
    overflow: hidden;
    position: relative;
    transition: background 3s ease-in-out;
  }

  /* Crescent Moon */
  .moon-wrapper {
    position: absolute;
    top: 80px;
    right: 120px;
    width: 150px;
    height: 150px;
    z-index: 2;
    transform: rotate(-50deg);
    transition: opacity 2s ease-in-out;
  }

  /* Cross */
  .cross {
    position: absolute;
    top: 10px;
    left: 50%;
    transform: translateX(-50%);
    width: 160px;
    height: 260px;
    z-index: 3;
  }

  .vertical {
    position: absolute;
    left: 50%;
    transform: translateX(-50%);
    width: 32px;
    height: 260px;
    background: linear-gradient(to bottom, #f6e7a4, #d4a93f, #b88a2c);
    transition: background 3s ease-in-out, box-shadow 3s ease-in-out;
    box-shadow: 0 0 15px #d4a93f55;
  }

  .horizontal {
    position: absolute;
    top: 65px;
    left: 50%;
    transform: translateX(-50%);
    width: 190px;
    height: 32px;
    background: linear-gradient(to right, #f6e7a4, #d4a93f, #b88a2c);
    transition: background 3s ease-in-out, box-shadow 3s ease-in-out;
    box-shadow: 0 0 15px #d4a93f55;
  }

  /* Stars */
  .star {
    position: absolute;
    width: 3px;
    height: 3px;
    background: white;
    border-radius: 50%;
    opacity: 0.9;
    animation: twinkle 2.5s infinite ease-in-out;
    pointer-events: none;
    z-index: 1;
  }

  @keyframes twinkle {
    0% { opacity: 0.2; transform: scale(1); }
    50% { opacity: 1; transform: scale(1.5); }
    100% { opacity: 0.2; transform: scale(1); }
  }

  /* Sun */
  .sun {
    position: absolute;
    top: 80px;
    right: 120px;
    width: 150px;
    height: 150px;
    border-radius: 50%;
    background: radial-gradient(circle, #FFD700 0%, #FFA500 70%);
    box-shadow: 0 0 60px #FFD700aa, 0 0 150px #FFD70055;
    opacity: 0;
    z-index: 2;
    transition: opacity 2s ease-in-out, top 5s ease-in-out, box-shadow 3s ease-in-out;
  }

  /* Click Button */
  .click-btn {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    padding: 16px 34px;
    font-size: 22px;
    font-weight: bold;
    background: white;
    border: none;
    border-radius: 10px;
    cursor: pointer;
    opacity: 0;
    animation: reveal 1.2s forwards;
    z-index: 4;
  }

  @keyframes reveal {
    0% { opacity: 0; filter: blur(8px); transform: translate(-50%, -50%) scale(0.85); }
    100% { opacity: 1; filter: blur(0px); transform: translate(-50%, -50%) scale(1); }
  }

</style>
</head>
<body>

<!-- Crescent Moon -->
<div class="moon-wrapper">
  <svg viewBox="0 0 100 100" width="150" height="150">
    <circle cx="50" cy="50" r="50" fill="white"/>
    <circle cx="60" cy="50" r="50" fill="url(#bgGradient)"/>
    <defs>
      <linearGradient id="bgGradient" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#0a0f24"/>
        <stop offset="70%" stop-color="#000814"/>
        <stop offset="100%" stop-color="#000000"/>
      </linearGradient>
    </defs>
  </svg>
</div>

<!-- Cross -->
<div class="cross">
  <div class="vertical"></div>
  <div class="horizontal"></div>
</div>

<!-- Sun -->
<div class="sun"></div>

<script>
// Generate stars
for (let i = 0; i < 200; i++) {
  const star = document.createElement('div');
  star.classList.add('star');
  let x = Math.random() * window.innerWidth;
  let y = Math.random() * window.innerHeight;
  if ((x > window.innerWidth - 350 && y < 350) ||
      (x > window.innerWidth/2 - 140 && x < window.innerWidth/2 + 140 && y < 330)) {
    i--; continue;
  }
  star.style.left = x + 'px';
  star.style.top = y + 'px';
  star.style.animationDelay = Math.random() * 2 + 's';
  document.body.appendChild(star);
}

// Click button after 3 seconds
setTimeout(() => {
  const btn = document.createElement('button');
  btn.className = 'click-btn';
  btn.innerText = 'Click Here';
  document.body.appendChild(btn);

  btn.addEventListener('click', () => {
    // Fade out moon
    document.querySelector('.moon-wrapper').style.opacity = 0;

    // Remove stars
    document.querySelectorAll('.star').forEach(s => s.remove());

    // Hide button
    btn.style.display = 'none';

    // Change background to cinematic day
    document.body.style.background = 'linear-gradient(to bottom, #87CEFA 0%, #ADD8E6 70%, #E0FFFF 100%)';

    // Show sun with glow
    const sun = document.querySelector('.sun');
    sun.style.opacity = 1;
    sun.style.top = '50px';
    sun.style.boxShadow = '0 0 80px #FFD700aa, 0 0 200px #FFD70055';

    // Cross color for day with subtle glow
    document.querySelector('.vertical').style.background = 'linear-gradient(to bottom, #FF8C00, #FF6600)';
    document.querySelector('.horizontal').style.background = 'linear-gradient(to right, #FF8C00, #FF6600)';
    document.querySelector('.vertical').style.boxShadow = '0 0 25px #FF8C0055';
    document.querySelector('.horizontal').style.boxShadow = '0 0 25px #FF8C0055';
  });
}, 3000);
</script>

</body>
</html>
