<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Phase 1 – IMAX Nolan Night</title>

<style>
    body {
        margin: 0;
        overflow: hidden;
        background: radial-gradient(ellipse at center, #02020A 0%, #000000 80%);
        height: 100vh;
        font-family: "Inter", sans-serif;
    }

    /* Twinkling IMAX stars */
    .star {
        position: absolute;
        width: 2px;
        height: 2px;
        background: white;
        border-radius: 50%;
        opacity: 0.3;
        animation: twinkle 2s infinite ease-in-out alternate;
    }

    @keyframes twinkle {
        from { opacity: 0.2; transform: scale(1); }
        to   { opacity: 1;   transform: scale(1.6); }
    }

    /* Moon */
    #moon {
        position: absolute;
        top: 40px;
        left: 40px;
        width: 130px;
        height: 130px;
        background: radial-gradient(circle at 30% 30%, #FFFFFF, #CFCFCF 40%, #9A9A9A 70%, #5A5A5A 100%);
        border-radius: 50%;
        box-shadow: 0 0 40px rgba(255,255,255,0.4);
        cursor: grab;
        transition: box-shadow 0.3s ease;
    }

    /* Message Reveal */
    #message {
        position: absolute;
        bottom: 60px;
        width: 100%;
        text-align: center;
        color: #EDEDED;
        font-size: 26px;
        font-weight: 300;
        letter-spacing: 1px;
        opacity: 0;
        transition: opacity 2s ease;
        white-space: pre-line;
        text-shadow: 0 0 8px rgba(255,255,255,0.7);
    }
</style>
</head>
<body>

<!-- Moon -->
<div id="moon"></div>

<!-- Message -->
<div id="message">
On this calm birthday eve so new,
God softly whispers, my plans are made for you
</div>

<script>
/* ------------------ STARS GENERATION ------------------ */
for (let i = 0; i < 180; i++) {
    let s = document.createElement("div");
    s.className = "star";
    s.style.left = Math.random() * window.innerWidth + "px";
    s.style.top = Math.random() * window.innerHeight + "px";
    s.style.animationDelay = (Math.random() * 2) + "s";
    document.body.appendChild(s);
}

/* ------------------ MOON DRAGGING ------------------ */
const moon = document.getElementById("moon");
const message = document.getElementById("message");

let isDragging = false;
let offsetX = 0;

moon.addEventListener("mousedown", e => {
    isDragging = true;
    offsetX = e.clientX - moon.offsetLeft;
    moon.style.cursor = "grabbing";
});

document.addEventListener("mouseup", () => {
    isDragging = false;
    moon.style.cursor = "grab";
});

document.addEventListener("mousemove", e => {
    if (!isDragging) return;

    let newX = e.clientX - offsetX;

    // Keep moon within screen
    if (newX < 20) newX = 20;
    if (newX > window.innerWidth - 150) newX = window.innerWidth - 150;

    moon.style.left = newX + "px";

    // Reveal message when moon reaches 70% width
    if (newX > window.innerWidth * 0.65) {
        message.style.opacity = 1;
    }
});
</script>

</body>
</html>
