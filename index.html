<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Golden Cross Birthday</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Great+Vibes&display=swap');

body {
  margin: 0;
  height: 100vh;
  overflow: hidden;
  position: relative;
  background-color: #001f3f;
  transition: background 2s ease;
}

.cross { /* Proper Christian cross */
  position: absolute;
  top: 50px;
  left: 50%;
  transform: translateX(-50%);
  width: 60px;
  height: 120px;
}
.cross-vert {
  position: absolute;
  top: 0;
  left: 50%;
  transform: translateX(-50%);
  width: 20px;
  height: 120px;
  background-color: gold;
  transition: background-color 1s ease;
  z-index: 2;
}
.cross-hor {
  position: absolute;
  top: 35%;
  left: 50%;
  transform: translate(-50%, -50%);
  width: 60px;
  height: 20px;
  background-color: gold;
  transition: background-color 1s ease;
  z-index: 3;
}

/* Sun */
.sun {
  position: absolute;
  top: 50px;
  right: 50px;
  width: 120px;
  height: 120px;
  background-color: yellow;
  border-radius: 50%;
  box-shadow: 0 0 50px rgba(255,255,0,0.5);
  opacity: 0;
  transition: opacity 2s ease;
  z-index: 5;
}

/* Happy Birthday text */
#birthdayText {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%) scale(0);
  font-family: 'Great Vibes', cursive;
  font-size: 64px;
  color: #FFD700;
  text-shadow: 0 0 15px #FFD700, 0 0 30px #FFEC8B;
  opacity: 0;
  z-index: 50;
  transition: opacity 2s ease, transform 2s ease;
}

.show-text {
  opacity: 1;
  transform: translate(-50%, -50%) scale(1);
}

/* Button */
#clickButton {
  position: absolute;
  top: 200px;
  left: 50%;
  transform: translateX(-50%);
  padding: 10px 25px;
  font-size: 18px;
  background-color: gold;
  color: #001f3f;
  border: none;
  border-radius: 5px;
  cursor: pointer;
  display: block;
  z-index: 10;
}
</style>
</head>
<body>

<div class="cross">
  <div class="cross-vert"></div>
  <div class="cross-hor"></div>
</div>

<div class="sun" id="sun"></div>
<div id="birthdayText">Happy Birthday</div>

<button id="clickButton">Click Here</button>

<script>
const button = document.getElementById('clickButton');
const sun = document.getElementById('sun');
const birthdayText = document.getElementById('birthdayText');
let clickCount = 0;

button.addEventListener('click', () => {
  clickCount++;
  if(clickCount === 1){
    // show sun for day
    sun.style.opacity = '1';
    document.body.style.background = 'linear-gradient(to bottom, #87CEEB, #B0E0E6)';

    // hide button
    button.style.display = 'none';

    // show "Happy Birthday" text after sun appears
    setTimeout(() => {
      birthdayText.classList.add('show-text');
    }, 1000);
  }
});
</script>

</body>
</html>
