<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>IMAX Cinematic Full</title>
<style>
html, body {
    margin: 0;
    padding: 0;
    overflow: hidden;
    background: #000;
}
canvas { display: block; }

/* Stage 1 */
#stage1 { position: relative; width: 100%; height: 100%; }
#stage1 #instruction {
    position: absolute; top: 20px; width: 100%; text-align: center;
    font-size: 22px; color: #fff; text-shadow: 0 0 8px #000; z-index:5;
}
#stage1 #message {
    position: absolute; bottom: 80px; width: 100%; text-align:center;
    font-size: 26px; font-weight:600; color:#ffd27f; letter-spacing:2px;
    text-shadow:0 0 5px #d9a441; opacity:0; transition:opacity 1.5s ease; z-index:5;
}
#stage1 #sun {
    position:absolute; width:260px; height:260px; border-radius:50%;
    background: radial-gradient(circle,#fff7c0 0%,#ffcc33 40%,#d68b00 70%,#000 100%);
    box-shadow: 0 0 50px #ffb300; top:-300px; right:-300px; opacity:0; transition: all 2.5s ease-in-out; z-index:3;
}
#stage1 #moon {
    position:absolute; width:200px; height:200px; left:40px; top:40px; border-radius:50%;
    cursor: grab; background: radial-gradient(circle at 30% 30%, #d9d9d9 0%, #c0c0c0 20%, #9a9a9a 45%, #6d6d6d 70%, #2a2a2a 100%);
    box-shadow:0 0 15px rgba(180,180,255,0.8), inset -20px -20px 40px rgba(0,0,0,0.5);
    transition: box-shadow 0.3s ease; z-index:5;
}
#stage1 #ambient {
    position:absolute; width:100%; height:100%; background: radial-gradient(circle at 50% 70%, rgba(30,60,150,0.25), transparent 70%);
    pointer-events:none; z-index:1;
}

/* Stage 2 */
#stage2 { display:none; position:absolute; width:100%; height:100%; top:0; left:0; }
#stage2 #instructionStar {
    position:absolute; top:20px; width:100%; text-align:center;
    font-size:22px; color:#fff; text-shadow:0 0 8px #000; z-index:5;
}
#stage2 #verse {
    position:absolute; top:60px; left:50%; transform:translateX(-50%) scale(0.2);
    font-size:32px; color:#ffe9a6; text-shadow:0 0 8px #fff2b3,0 0 15px #e6d37a;
    opacity:0; transition: all 1s ease-out; white-space:nowrap; z-index:5;
}

/* Stage 3 */
#stage3 { display:none; position:absolute; width:100%; height:100%; top:0; left:0; }
#stage3 button {
    position:absolute; bottom:40px; left:50%; transform:translateX(-50%);
    padding:15px 30px; font-size:20px; font-weight:bold;
    background: linear-gradient(90deg, #ff0066, #ffcc00, #00ccff);
    border:none; border-radius:10px; cursor:pointer; box-shadow:0 0 20px rgba(255,255,255,0.6);
    color:#fff; opacity:0; transition:opacity 1s ease; z-index:1000;
}

/* Phase 4 container */
#phase4 { display:none; width:100%; height:100%; top:0; left:0; position:absolute; }
</style>
</head>
<body>

<!-- Stage 1 -->
<div id="stage1">
    <div id="instruction">Drag the moon to the end</div>
    <canvas id="stars"></canvas>
    <div id="ambient"></div>
    <div id="moon"></div>
    <div id="sun"></div>
    <div id="message">ON THIS CALM BIRTHDAY EVE SO NEW, GOD SOFTLY WHISPERS, MY PLANS ARE MADE FOR YOU.</div>
    <audio id="whoosh" src="https://cdn.pixabay.com/download/audio/2021/09/16/audio_4f1c1c9f28.mp3?filename=woosh-14795.mp3"></audio>
</div>

<!-- Stage 2 -->
<div id="stage2">
    <canvas id="shieldCanvas"></canvas>
    <div id="instructionStar">Click the star</div>
    <div id="verse">He counts the stars and calls them each by name — Psalm 147:4</div>
</div>

<!-- Stage 3 -->
<div id="stage3">
    <canvas id="c"></canvas>
    <button id="clickBtn">Click Here</button>
</div>

<!-- Phase 4 -->
<div id="phase4"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/examples/js/loaders/FontLoader.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/examples/js/geometries/TextGeometry.js"></script>

<script>
/* ---------------- STAGE 1 ---------------- */
const stage1=document.getElementById("stage1");
const moon=document.getElementById("moon");
const message=document.getElementById("message");
const sun=document.getElementById("sun");
const whoosh=document.getElementById("whoosh");
const starsCanvas=document.getElementById("stars");
const starsCtx=starsCanvas.getContext("2d");

function resize1(){ starsCanvas.width=window.innerWidth; starsCanvas.height=window.innerHeight; }
resize1(); window.onresize=resize1;

let stars=[]; for(let i=0;i<250;i++){ stars.push({x:Math.random()*starsCanvas.width, y:Math.random()*starsCanvas.height, z:Math.random()*1.5+0.5, tw:Math.random()*0.02+0.005}); }
function drawStars(){ starsCtx.clearRect(0,0,starsCanvas.width,starsCanvas.height); stars.forEach(s=>{ let glow=(Math.sin(Date.now()*s.tw)+1)*0.5; starsCtx.fillStyle=`rgba(255,255,255,${glow})`; starsCtx.beginPath(); starsCtx.arc(s.x,s.y,s.z,0,Math.PI*2); starsCtx.fill(); }); }

let dragging=false, offsetX, offsetY, revealIndex=0;
const fullMsg=message.innerText; message.innerText="";
moon.addEventListener("mousedown", e=>{ dragging=true; offsetX=e.clientX-moon.offsetLeft; offsetY=e.clientY-moon.offsetTop; moon.style.cursor="grabbing"; whoosh.currentTime=0; whoosh.play(); });
document.addEventListener("mouseup", ()=>{ dragging=false; moon.style.cursor="grab"; });
document.addEventListener("mousemove", e=>{ if(!dragging) return; moon.style.left=(e.clientX-offsetX)+"px"; moon.style.top=(e.clientY-offsetY)+"px"; if(revealIndex<fullMsg.length){ message.style.opacity=1; message.innerText=fullMsg.substring(0,revealIndex++);} if(revealIndex>=fullMsg.length){ moon.style.opacity=0; setTimeout(()=>{ sun.style.opacity=1; sun.style.top="40px"; sun.style.right="40px"; setTimeout(()=>{ startStage2(); },5000); },800); } });
function animate1(){ drawStars(); requestAnimationFrame(animate1); }
animate1();

/* ---------------- STAGE 2 ---------------- */
const stage2=document.getElementById("stage2");
const shieldCanvas=document.getElementById("shieldCanvas");
const shieldCtx=shieldCanvas.getContext("2d");
shieldCanvas.width=window.innerWidth; shieldCanvas.height=window.innerHeight;
let shieldX=shieldCanvas.width/2, shieldY=shieldCanvas.height/2;
let R=Math.min(shieldCanvas.width,shieldCanvas.height)/3;
let starSpin=false, starAngle=0;
const bgStars2=[]; for(let i=0;i<200;i++){ bgStars2.push({x:Math.random()*shieldCanvas.width,y:Math.random()*shieldCanvas.height,r:Math.random()*1.5+0.5,tw:Math.random()*0.02+0.005}); }
const verseDiv=document.getElementById("verse");

function drawShield(){ shieldCtx.save(); shieldCtx.translate(shieldX,shieldY); let g1=shieldCtx.createRadialGradient(0,0,R*0.2,0,0,R); g1.addColorStop(0,"#3c0000"); g1.addColorStop(1,"#7a0000"); shieldCtx.fillStyle=g1; shieldCtx.beginPath(); shieldCtx.arc(0,0,R,0,Math.PI*2); shieldCtx.fill(); let g2=shieldCtx.createRadialGradient(0,0,R*0.1,0,0,R*0.75); g2.addColorStop(0,"#dadada"); g2.addColorStop(1,"#f5f5f5"); shieldCtx.fillStyle=g2; shieldCtx.beginPath(); shieldCtx.arc(0,0,R*0.75,0,Math.PI*2); shieldCtx.fill(); let g3=shieldCtx.createRadialGradient(0,0,R*0.1,0,0,R*0.5); g3.addColorStop(0,"#4b0000"); g3.addColorStop(1,"#8c0000"); shieldCtx.fillStyle=g3; shieldCtx.beginPath(); shieldCtx.arc(0,0,R*0.5,0,Math.PI*2); shieldCtx.fill(); let g4=shieldCtx.createRadialGradient(0,0,R*0.05,0,0,R*0.35); g4.addColorStop(0,"#b4c7e0"); g4.addColorStop(1,"#001933"); shieldCtx.fillStyle=g4; shieldCtx.beginPath(); shieldCtx.arc(0,0,R*0.35,0,Math.PI*2); shieldCtx.fill(); shieldCtx.save(); if(starSpin) shieldCtx.rotate(starAngle); let starR=R*0.28; shieldCtx.beginPath(); for(let i=0;i<5;i++){ let o=(Math.PI*2/5)*i-Math.PI/2; let n=o+Math.PI/5; shieldCtx.lineTo(Math.cos(o)*starR,Math.sin(o)*starR); shieldCtx.lineTo(Math.cos(n)*starR*0.45,Math.sin(n)*starR*0.45); } shieldCtx.closePath(); shieldCtx.shadowColor="rgba(255,255,255,0.25)"; shieldCtx.shadowBlur=5; let sg=shieldCtx.createRadialGradient(0,0,starR*0.1,0,0,starR); sg.addColorStop(0,"#ffffff"); sg.addColorStop(0.4,"#eeeeee"); sg.addColorStop(1,"#7a7a7a"); shieldCtx.fillStyle=sg; shieldCtx.fill(); shieldCtx.restore(); shieldCtx.restore(); }
function animate2(){ shieldCtx.fillStyle="#0a0d19"; shieldCtx.fillRect(0,0,shieldCanvas.width,shieldCanvas.height); bgStars2.forEach(s=>{ const glow=(Math.sin(Date.now()*s.tw)+1)*0.5; shieldCtx.fillStyle=`rgba(255,255,255,${glow})`; shieldCtx.beginPath(); shieldCtx.arc(s.x,s.y,s.r,0,Math.PI*2); shieldCtx.fill(); }); drawShield(); if(starSpin) starAngle+=0.035; requestAnimationFrame(animate2); }
function startStage2(){ stage1.style.display="none"; stage2.style.display="block"; animate2(); }
shieldCanvas.addEventListener("click", e=>{ const dx=e.clientX-shieldX; const dy=e.clientY-shieldY; if(Math.sqrt(dx*dx+dy*dy)<=R*0.28){ starSpin=true; verseDiv.style.opacity=1; verseDiv.style.transform="translateX(-50%) scale(1)"; setTimeout(()=>{ startStage3(); },7000); } });

/* ---------------- STAGE 3 ---------------- */
const stage3=document.getElementById("stage3");
const c=document.getElementById("c");
const ctx3=c.getContext("2d");
function resize3(){ c.width=window.innerWidth; c.height=window.innerHeight; }
resize3(); window.onresize=resize3;

const bgStars3=[]; for(let i=0;i<180;i++){ bgStars3.push({x:Math.random()*c.width,y:Math.random()*c.height,size:Math.random()*1.1+0.2,tw:Math.random()*0.02+0.003}); }

function drawStarShape(){ bgStars3.forEach(s=>{ const glow=(Math.sin(Date.now()*s.tw)+1)*0.5; ctx3.fillStyle=`rgba(255,255,255,${glow})`; ctx3.beginPath(); ctx3.arc(s.x,s.y,s.size,0,Math.PI*2); ctx3.fill(); }); }

function mapTextToPoints(textStr){ const temp=document.createElement("canvas"); const tctx=temp.getContext("2d"); temp.width=c.width; temp.height=c.height; const fontSize=c.width/7; tctx.clearRect(0,0,temp.width,temp.height); tctx.fillStyle="#fff"; tctx.font="bold "+fontSize+"px Arial"; tctx.textAlign="center"; tctx.textBaseline="middle"; tctx.fillText(textStr,temp.width/2,temp.height/2); const imageData=tctx.getImageData(0,0,temp.width,temp.height).data; const points=[]; for(let y=0;y<temp.height;y+=6){ for(let x=0;x<temp.width;x+=6){ let index=(y*temp.width+x)*4; if(imageData[index+3]>200){ points.push({x,y}); }}} return points; }

let currentText="PRINCE"; let letterPoints=mapTextToPoints(currentText);
const particles=letterPoints.map(p=>({x:Math.random()*c.width,y:Math.random()*c.height,tx:p.x,ty:p.y,speed:Math.random()*0.08+0.04,size:Math.random()*1.8+1.2,color:null}));
let camera3={dx:0,dy:0,zoom:1};
function applyCamera(){ camera3.dx=Math.sin(Date.now()*0.0003)*15; camera3.dy=Math.cos(Date.now()*0.00025)*15; camera3.zoom=1+0.02*Math.sin(Date.now()*0.0002); ctx3.save(); ctx3.translate(c.width/2+camera3.dx,c.height/2+camera3.dy); ctx3.scale(camera3.zoom,camera3.zoom); ctx3.translate(-c.width/2,-c.height/2); }
function animate3(){ ctx3.clearRect(0,0,c.width,c.height); applyCamera(); drawStarShape(); const time=Date.now(); particles.forEach(p=>{ p.x+=(p.tx-p.x)*p.speed; p.y+=(p.ty-p.y)*p.speed; let fillColor=p.color||`hsl(${(p.x+p.y)%360},90%,70%)`; let shadowIntensity=p.color?(Math.sin(time*0.005)*0.5+0.5)*20:18; ctx3.fillStyle=fillColor; ctx3.shadowBlur=shadowIntensity; ctx3.shadowColor=fillColor; ctx3.beginPath(); ctx3.arc(p.x,p.y,p.size,0,Math.PI*2); ctx3.fill(); }); ctx3.restore(); requestAnimationFrame(animate3); }

function startStage3(){ stage2.style.display="none"; stage3.style.display="block"; animate3(); setTimeout(()=>{ document.getElementById("clickBtn").style.opacity=1; },3000); }

const btn=document.getElementById("clickBtn");
btn.addEventListener("click", ()=>{
    btn.style.display="none"; 
    const newText="DAIVIK";
    const newPoints=mapTextToPoints(newText);
    particles.forEach((p,i)=>{ const np=newPoints[i%newPoints.length]; p.tx=np.x; p.ty=np.y; p.color="#fff"; });

    const btn2=document.createElement("button");
    btn2.id="clickBtn2"; btn2.innerText="Click Here";
    Object.assign(btn2.style,{position:"absolute",bottom:"40px",left:"50%",transform:"translateX(-50%)"});
    stage3.appendChild(btn2);
    btn2.style.opacity=1;
    btn2.addEventListener("click", startPhase4);
});

/* ---------------- PHASE 4 DIRECT EMBEDDED ---------------- */
function startPhase4(){
    stage3.style.display="none";
    const phaseDiv=document.getElementById("phase4");
    phaseDiv.style.display="block";

    let scene = new THREE.Scene();
    scene.fog = new THREE.FogExp2(0x000000, 0.0012);
    let camera = new THREE.PerspectiveCamera(60, window.innerWidth/window.innerHeight, 0.1, 3000);
    camera.position.set(0,50,400);

    let renderer = new THREE.WebGLRenderer({antialias:true});
    renderer.setSize(window.innerWidth,window.innerHeight);
    renderer.setPixelRatio(window.devicePixelRatio);
    phaseDiv.appendChild(renderer.domElement);

    let starGeo = new THREE.BufferGeometry();
    let starCount = 2500;
    let starArr = new Float32Array(starCount*3);
    for(let i=0;i<starCount*3;i++){ starArr[i]=(Math.random()-0.5)*3000; }
    starGeo.setAttribute("position", new THREE.BufferAttribute(starArr,3));
    let starMat = new THREE.PointsMaterial({color:0xffffff,size:1});
    let stars = new THREE.Points(starGeo, starMat);
    scene.add(stars);

    function animatePhase4(){ requestAnimationFrame(animatePhase4); stars.rotation.y+=0.0006; renderer.render(scene,camera); }
    animatePhase4();
}
</script>
</body>
</html>
