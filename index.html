<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>IMAX Nolan Vision</title>
<style>
  body {
    margin: 0;
    background: black;
    overflow: hidden;
    font-family: 'Cinzel', serif;
  }

  /* Container */
  #scene {
    position: relative;
    width: 100vw;
    height: 100vh;
    overflow: hidden;
  }

  /* Moon */
  #moon {
    position: absolute;
    top: 40%;
    left: 5%;
    width: 160px;
    height: 160px;
    border-radius: 50%;
    background: radial-gradient(circle,
        #ffffff 0%,
        #d9d9d9 40%,
        #8c8c8c 70%,
        #3a3a3a 100%);
    box-shadow: 0 0 80px rgba(255,255,255,0.15);
    cursor: pointer;
    transition: opacity 0.4s ease-out;
  }

  /* Sun */
  #sun {
    position: absolute;
    top: -200px;
    right: -200px;
    width: 420px;
    height: 420px;
    border-radius: 50%;
    background: radial-gradient(circle,
        #ffecb3 0%,
        #ffcc33 40%,
        #ff8800 75%,
        #442200 100%);
    opacity: 0;
    transition: opacity 1.8s ease-in-out, top 2s ease-out, right 2s ease-out;
    pointer-events: none;
  }

  /* Stars */
  .star {
    position: absolute;
    width: 2px;
    height: 2px;
    background: white;
    border-radius: 50%;
    opacity: 0.8;
    animation: twinkle 2s infinite ease-in-out alternate;
  }

  @keyframes twinkle {
    from { opacity: 0.2; transform: scale(1); }
    to   { opacity: 1; transform: scale(1.7); }
  }

  /* Text */
  #msg {
    position: absolute;
    bottom: 40px;
    width: 100%;
    text-align: center;
    font-size: 22px;
    letter-spacing: 3px;
    color: white;
    opacity: 0;
    transition: color 2s ease-out;
    font-family: 'Cinzel', serif;
  }

  /* DARKER GALACTIC CROSS */
  #cross {
    position: absolute;
    top: -400px;
    left: 50%;
    transform: translateX(-50%);
    width: 160px;
    height: 420px;
    opacity: 0;
    transition: opacity 1.8s ease-out, top 2.4s ease-out;
  }

  /* Cross vertical + horizontal bars */
  #cross:before,
  #cross:after {
    content: "";
    position: absolute;
    background: linear-gradient(to bottom,
      #0a0a0a 0%,
      #131313 40%,
      #0d0d0d 75%,
      #000000 100%
    );
    box-shadow: 0 0 45px rgba(0,0,0,0.8);
  }

  /* Vertical bar */
  #cross:before {
    width: 45px;
    height: 420px;
    left: 50%;
    transform: translateX(-50%);
  }

  /* Horizontal bar */
  #cross:after {
    width: 200px;
    height: 45px;
    top: 140px;
    left: 50%;
    transform: translateX(-50%);
  }

</style>
</head>
<body>

<div id="scene"></div>

<div id="moon"></div>
<div id="sun"></div>

<div id="msg"></div>

<div id="cross"></div>

<script>
const moon = document.getElementById("moon");
const sun = document.getElementById("sun");
const msg = document.getElementById("msg");
const cross = document.getElementById("cross");
const scene = document.getElementById("scene");

let stars = [];

/* Generate IMAX stars */
for (let i = 0; i < 160; i++) {
  let s = document.createElement("div");
  s.className = "star";
  s.style.top = Math.random() * 100 + "vh";
  s.style.left = Math.random() * 100 + "vw";
  s.style.animationDuration = (1.5 + Math.random() * 2) + "s";
  scene.appendChild(s);
  stars.push(s);
}

/* Text */
const fullText = "ON THIS CALM BIRTHDAY EVE SO NEW, GOD SOFTLY WHISPERS, MY PLANS ARE MADE FOR YOU";

let revealed = 0;

moon.addEventListener("mousedown", startDrag);

function startDrag(e) {
  e.preventDefault();
  document.addEventListener("mousemove", drag);
  document.addEventListener("mouseup", endDrag);
}

function drag(e) {
  let x = e.clientX - 80;
  if (x < 0) x = 0;
  if (x > window.innerWidth - 160) x = window.innerWidth - 160;

  moon.style.left = x + "px";

  let p = x / (window.innerWidth - 160);

  moon.style.opacity = 1 - p;

  let lettersToShow = Math.floor(fullText.length * p);
  msg.textContent = fullText.substring(0, lettersToShow);
  msg.style.opacity = 1;

  if (p > 0.75) {
    sun.style.opacity = 1;
    sun.style.top = "40px";
    sun.style.right = "40px";

    stars.forEach(s => s.style.opacity = 0);
  }

  if (p > 0.92) {
    cross.style.opacity = 1;
    cross.style.top = "20px";
  }
}

function endDrag() {
  document.removeEventListener("mousemove", drag);
  document.removeEventListener("mouseup", endDrag);
}
</script>

</body>
</html>
