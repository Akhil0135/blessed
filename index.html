<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IMAX Nolan Cosmic Scene</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { width:100%; height:100%; overflow:hidden; background:#000; }

  canvas { display:block; width:100%; height:100%; }

  /* Cinematic subtle overlay for depth & vignette */
  #overlay {
    position:absolute;
    width:100%;
    height:100%;
    background: radial-gradient(circle at center, rgba(0,0,0,0.05) 0%, rgba(0,0,0,0.95) 100%);
    pointer-events:none;
    mix-blend-mode:multiply;
  }
</style>
</head>
<body>

<canvas id="imax"></canvas>
<div id="overlay"></div>

<script>
const canvas = document.getElementById('imax');
const ctx = canvas.getContext('2d');
let width = canvas.width = window.innerWidth;
let height = canvas.height = window.innerHeight;

// Particle class
class Particle {
  constructor() { this.reset(); }
  reset() {
    this.x = Math.random()*width - width/2;
    this.y = Math.random()*height - height/2;
    this.z = Math.random()*width;
    this.size = Math.random()*2+0.5;
    this.speed = Math.random()*0.8+0.2;
    this.color = `rgba(255,${Math.floor(Math.random()*200+55)},${Math.floor(Math.random()*200+55)},${Math.random()*0.6+0.4})`;
  }
  update() {
    this.z -= this.speed;
    if(this.z <= 1) this.reset();
  }
  draw() {
    const sx = (this.x * (width / this.z)) + width/2;
    const sy = (this.y * (width / this.z)) + height/2;
    const radius = this.size * (width / this.z);

    // Draw glowing particle
    const gradient = ctx.createRadialGradient(sx, sy, 0, sx, sy, radius);
    gradient.addColorStop(0, this.color);
    gradient.addColorStop(0.7, 'rgba(0,0,0,0.1)');
    gradient.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.beginPath();
    ctx.fillStyle = gradient;
    ctx.arc(sx, sy, radius, 0, Math.PI*2);
    ctx.fill();
  }
}

// Create particles
const particleCount = 500;
const particles = [];
for(let i=0;i<particleCount;i++) particles.push(new Particle());

// Camera movement
let cameraScale = 1;
let cameraOffsetX = 0;
let cameraOffsetY = 0;
let targetX = 0;
let targetY = 0;

document.addEventListener('mousemove', e => {
  targetX = (e.clientX - width/2)/60;
  targetY = (e.clientY - height/2)/60;
});

// Animate scene
function animate() {
  ctx.fillStyle = 'rgba(0,0,0,0.1)'; // cinematic trail for motion blur
  ctx.fillRect(0,0,width,height);

  cameraOffsetX += (targetX - cameraOffsetX) * 0.05;
  cameraOffsetY += (targetY - cameraOffsetY) * 0.05;
  cameraScale = 1 + Math.sin(Date.now()/7000)*0.02;

  ctx.setTransform(cameraScale,0,0,cameraScale,cameraOffsetX,cameraOffsetY);

  particles.forEach(p => { p.update(); p.draw(); });

  // Optional: subtle cosmic glow shafts
  for(let i=0;i<5;i++){
    const x = Math.random()*width;
    const y = Math.random()*height;
    const radius = Math.random()*200+100;
    const gradient = ctx.createRadialGradient(x, y, 0, x, y, radius);
    gradient.addColorStop(0,'rgba(255,255,255,0.02)');
    gradient.addColorStop(1,'rgba(0,0,0,0)');
    ctx.fillStyle = gradient;
    ctx.fillRect(0,0,width,height);
  }

  requestAnimationFrame(animate);
}

animate();

// Handle resize
window.addEventListener('resize', () => {
  width = canvas.width = window.innerWidth;
  height = canvas.height = window.innerHeight;
});
</script>

</body>
</html>
