<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Phase 2 — Captain America Shield</title>

<style>
    body {
        margin: 0;
        height: 100vh;
        background: radial-gradient(circle at center, #0b0f1a, #000);
        overflow: hidden;
        font-family: 'Cinzel', serif;
    }

    .shield {
        position: absolute;
        width: 450px;
        height: 450px;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        border-radius: 50%;
        background: conic-gradient(
            #b60000 0deg 90deg,
            white 90deg 135deg,
            #b60000 135deg 225deg,
            #001a4d 225deg 360deg
        );
        box-shadow: 0 0 60px rgba(255,0,0,0.4);
        transition: transform 1.2s linear;
    }

    .star {
        position: absolute;
        width: 200px;
        aspect-ratio: 1;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        pointer-events: auto;
        filter: drop-shadow(0 0 12px #fff);
    }

    .verse-letter {
        position: absolute;
        color: white;
        font-size: 26px;
        font-weight: 900;
        opacity: 0;
        transform: translate(-50%, -50%) scale(0.2);
        letter-spacing: 2px; /* UNIFORM SPACING */
        transition: all 0.6s ease-out;
        white-space: pre;
        text-shadow: 0 0 12px rgba(255,255,255,0.8);
    }
</style>
</head>

<body>

<div id="shield" class="shield"></div>

<svg class="star" id="star" viewBox="0 0 100 100">
    <polygon fill="silver" stroke="#d4d4d4" stroke-width="3"
      points="
        50,5 
        61,35 
        95,38 
        68,58 
        78,90 
        50,72 
        22,90 
        32,58 
        5,38 
        39,35
      "
    />
</svg>

<script>
const star = document.getElementById("star");
const shield = document.getElementById("shield");

let exploded = false;

star.addEventListener("click", () => {
    if (exploded) return;
    exploded = true;

    // Rotate star
    star.style.transition = "transform 2.8s ease-out";
    star.style.transform += " rotate(1080deg)";

    // Break shield
    shield.style.transition = "opacity 1.4s ease-out, transform 1.4s ease-out";
    shield.style.opacity = 0;
    shield.style.transform = "translate(-50%, -50%) scale(0.2) rotate(720deg)";

    setTimeout(() => {
        showVerse();
    }, 900);
});


function showVerse() {
    const verse = "He counts the number of the stars; He gives names to all of them. — Psalm 147:4";

    const centerX = window.innerWidth / 2;
    const centerY = window.innerHeight / 2; // star location
    const finalY = 80; // verse top position

    let delay = 0;

    for (let i = 0; i < verse.length; i++) {
        let letter = document.createElement("div");
        letter.className = "verse-letter";
        letter.textContent = verse[i];

        // Start at star center
        letter.style.left = centerX + "px";
        letter.style.top = centerY + "px";

        document.body.appendChild(letter);

        setTimeout(() => {
            letter.style.opacity = 1;
            letter.style.transform = "translate(-50%, -50%) scale(1)";
            letter.style.top = finalY + "px";

            // PERFECT CENTERING
            const totalWidth = verse.length * 20; 
            const offsetX = centerX - totalWidth / 2 + i * 20;
            letter.style.left = offsetX + "px";

        }, delay);

        delay += 50; // cinematic evolution speed
    }
}
</script>

</body>
</html>
