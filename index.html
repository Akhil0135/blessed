<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>IMAX PRINCE → DAIVIK</title>
<style>
    html, body {
        margin: 0;
        padding: 0;
        overflow: hidden;
        background: #000;
    }

    canvas {
        display: block;
    }

    #clickBtn {
        position: absolute;
        bottom: 40px;
        left: 50%;
        transform: translateX(-50%);
        padding: 15px 30px;
        font-size: 20px;
        font-weight: bold;
        background: linear-gradient(90deg, #ff0066, #ffcc00, #00ccff);
        border: none;
        border-radius: 10px;
        cursor: pointer;
        box-shadow: 0 0 20px rgba(255,255,255,0.6);
        color: #fff;
        opacity: 0;
        transition: opacity 1s ease;
        z-index: 1000;
    }
</style>
</head>
<body>
<canvas id="c"></canvas>
<button id="clickBtn">Click Here</button>

<script>
// ------------ SETUP ------------
const canvas = document.getElementById("c");
const ctx = canvas.getContext("2d");
const btn = document.getElementById("clickBtn");

function resize() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
}
resize();
window.onresize = resize;

// ------------ BACKGROUND TWINKLING STARS ------------
const bgStars = [];
const bgStarCount = 180;

for (let i = 0; i < bgStarCount; i++) {
    bgStars.push({
        x: Math.random() * canvas.width,
        y: Math.random() * canvas.height,
        size: Math.random() * 1.1 + 0.2,
        tw: Math.random() * 0.02 + 0.003
    });
}

function drawStarShape() {
    bgStars.forEach(s => {
        const glow = (Math.sin(Date.now() * s.tw) + 1) * 0.5;
        ctx.fillStyle = `rgba(255,255,255,${glow})`;
        ctx.beginPath();
        ctx.arc(s.x, s.y, s.size, 0, Math.PI * 2);
        ctx.fill();
    });
}

// ------------ PARTICLES FUNCTION ------------
function mapTextToPoints(textStr) {
    const temp = document.createElement("canvas");
    const tctx = temp.getContext("2d");
    temp.width = canvas.width;
    temp.height = canvas.height;

    const fontSize = canvas.width / 7;
    tctx.clearRect(0, 0, temp.width, temp.height);
    tctx.fillStyle = "#fff";
    tctx.font = "bold " + fontSize + "px Arial";
    tctx.textAlign = "center";
    tctx.textBaseline = "middle";
    tctx.fillText(textStr, temp.width / 2, temp.height / 2);

    const imageData = tctx.getImageData(0, 0, temp.width, temp.height).data;
    const points = [];
    for (let y = 0; y < temp.height; y += 6) {
        for (let x = 0; x < temp.width; x += 6) {
            let index = (y * temp.width + x) * 4;
            if (imageData[index + 3] > 200) {
                points.push({ x, y });
            }
        }
    }
    return points;
}

// ------------ INITIAL LETTERS ------------
let currentText = "PRINCE";
let letterPoints = mapTextToPoints(currentText);

const particles = letterPoints.map(p => ({
    x: Math.random() * canvas.width,
    y: Math.random() * canvas.height,
    tx: p.x,
    ty: p.y,
    speed: Math.random() * 0.08 + 0.04,
    size: Math.random() * 1.8 + 1.2,
    color: null // null = rainbow
}));

// ------------ ANIMATION LOOP ------------
function animate() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    drawStarShape();

    particles.forEach(p => {
        p.x += (p.tx - p.x) * p.speed;
        p.y += (p.ty - p.y) * p.speed;

        ctx.fillStyle = p.color || `hsl(${(p.x + p.y) % 360}, 90%, 70%)`;
        ctx.shadowBlur = 18;
        ctx.shadowColor = ctx.fillStyle;

        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
        ctx.fill();
    });

    requestAnimationFrame(animate);
}

animate();

// ------------ SHOW BUTTON AFTER 3 SECONDS ------------
setTimeout(() => {
    btn.style.opacity = 1;
}, 3000);

// ------------ CLICK EVENT TO CHANGE TEXT ------------
btn.addEventListener("click", () => {
    btn.style.display = "none"; // hide button

    const newText = "DAIVIK";
    const newPoints = mapTextToPoints(newText);

    // Reassign particle targets (reuse existing particles)
    particles.forEach((p, i) => {
        const np = newPoints[i % newPoints.length];
        p.tx = np.x;
        p.ty = np.y;
        p.color = "#fff"; // Make all DAIVIK letters white
    });
});
</script>
</body>
</html>
