<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>IMAX — Nolan Cosmic • Steel Shield Break</title>

<style>
/* ——— YOUR ORIGINAL STYLES ——— */
/* (All untouched except metallic star) */

*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#01010b;font-family:Inter,system-ui,Segoe UI,Roboto,'Helvetica Neue',Arial;color:#fff;overflow:hidden}
/* ... (everything same exactly as you sent) ... */

#shield-star{
    transform-box:fill-box;
    transform-origin:center center;
    cursor:pointer;
    z-index:30;
    pointer-events:auto;

    /* ✨ Metallic Star */
    fill:url(#metalStar);
    filter:drop-shadow(0 0 12px rgba(255,255,255,0.4));
}
</style>
</head>

<body>
<div class="stage">
  <!-- background layers (same) -->

  <div class="shield-wrap">
    <svg class="shield-svg" viewBox="0 0 200 200">

      <defs>
        <!-- Your gradients unchanged -->
        <radialGradient id="metalRed" cx="50%" cy="50%" r="50%"><stop offset="0%" stop-color="#ff4d4d"/><stop offset="100%" stop-color="#990000"/></radialGradient>
        <radialGradient id="metalWhite" cx="50%" cy="50%" r="50%"><stop offset="0%" stop-color="#ffffff"/><stop offset="100%" stop-color="#cccccc"/></radialGradient>
        <radialGradient id="metalBlue" cx="50%" cy="50%" r="50%"><stop offset="0%" stop-color="#4d90ff"/><stop offset="100%" stop-color="#003366"/></radialGradient>

        <!-- ⭐ Metallic chrome star -->
        <radialGradient id="metalStar" cx="50%" cy="50%" r="60%">
          <stop offset="0%" stop-color="#ffffff"/>
          <stop offset="30%" stop-color="#d0d0d0"/>
          <stop offset="70%" stop-color="#888"/>
          <stop offset="100%" stop-color="#444"/>
        </radialGradient>

        <radialGradient id="glint" cx="50%" cy="30%" r="50%">
          <stop offset="0%" stop-color="rgba(255,255,255,0.8)"/>
          <stop offset="60%" stop-color="rgba(255,255,255,0.0)"/>
        </radialGradient>
      </defs>

      <!-- SHIELD RINGS -->
      <g id="rings" transform="translate(100,100)">
        <circle r="92" fill="url(#metalRed)" />
        <circle r="76" fill="url(#metalWhite)" />
        <circle r="56" fill="url(#metalRed)" />
        <circle r="36" fill="url(#metalBlue)" />
        <circle r="92" fill="url(#glint)" id="glintLayer" style="opacity:0.3;mix-blend-mode:screen;" />
      </g>

      <!-- ⭐ STAR (unchanged but metallic) -->
      <g id="starGroup" transform="translate(100,100)">
        <polygon id="shield-star" 
          points="0,-28 6,-8 26,-6 10,6 14,26 0,14 -14,26 -10,6 -26,-6 -6,-8" />
      </g>

    </svg>
  </div>
</div>

<script>
/* ⭐ STAR SPIN — SHIELD BREAK — STAR STAYS  */
const star=document.getElementById('shield-star');
const glintLayer=document.getElementById('glintLayer');
const shield=document.querySelector('.shield-svg');

star.addEventListener('click', ()=>{
    star.style.transition='transform 0.5s linear';
    star.style.transform='scale(1) rotate(1080deg)';

    glintLayer.style.transition='opacity 0.2s ease-in-out';
    glintLayer.style.opacity=1;

    setTimeout(()=>{
        // star resets BUT remains visible
        star.style.transition='transform 1s ease-out';
        star.style.transform='scale(1) rotate(0deg)';
        glintLayer.style.opacity=0;

        // Now break shield
        shatterShield();
    },500);
});

/* ——— SHIELD SHATTER ———
   ⭐ STAR IS NOT REMOVED
   ✔ Rings removed
*/
function shatterShield(){
    const rings=document.getElementById('rings');
    rings.style.opacity = 0;

    const layers = [
        {r:92, fill:'url(#metalRed)', slices:8},
        {r:76, fill:'url(#metalWhite)', slices:6},
        {r:56, fill:'url(#metalRed)', slices:6},
        {r:36, fill:'url(#metalBlue)', slices:4}
    ];

    layers.forEach(layer=>{
        for(let i=0;i<layer.slices;i++){
            const piece=document.createElementNS('http://www.w3.org/2000/svg','path');
            
            const a0=i*(360/layer.slices);
            const a1=a0+(360/layer.slices);

            const R=layer.r;
            const r=layer.r*0.6;

            function px(angle,rad){return rad*Math.cos(angle*Math.PI/180);}
            function py(angle,rad){return rad*Math.sin(angle*Math.PI/180);}

            const d=`M ${px(a0,r)} ${py(a0,r)}
                     L ${px(a0,R)} ${py(a0,R)}
                     A ${R} ${R} 0 0 1 ${px(a1,R)} ${py(a1,R)}
                     L ${px(a1,r)} ${py(a1,r)}
                     A ${r} ${r} 0 0 0 ${px(a0,r)} ${py(a0,r)}`;

            piece.setAttribute('fill',layer.fill);
            piece.setAttribute('d',d);
            piece.style.transformOrigin='100px 100px';
            piece.style.transition='transform 1.2s ease-out, opacity 1.5s ease-out';

            shield.appendChild(piece);

            setTimeout(()=>{
                const dx=(Math.random()-0.5)*260;
                const dy=(Math.random()-0.5)*260;
                const rot=(Math.random()-0.5)*720;

                piece.style.transform=`translate(${dx}px,${dy}px) rotate(${rot}deg) scale(0.9)`;

                setTimeout(()=>piece.style.opacity=0,700);

            },40);
        }
    });
}

/* ——— ALL OTHER EFFECTS REMAIN SAME ——— */
</script>

</body>
</html>
