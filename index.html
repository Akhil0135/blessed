<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Golden Cross Birthday</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Great+Vibes&display=swap');

body {
  margin: 0;
  height: 100vh;
  overflow: hidden;
  position: relative;
  background-color: #001f3f; /* night */
  transition: background 2s ease;
}

/* Proper Christian cross */
.cross {
  position: absolute;
  top: 50px;
  left: 50%;
  transform: translateX(-50%);
  width: 60px;
  height: 120px;
}
.cross-vert {
  position: absolute;
  top: 0;
  left: 50%;
  transform: translateX(-50%);
  width: 20px;
  height: 120px;
  background-color: gold;
  transition: background-color 1s ease;
  z-index: 2;
}
.cross-hor {
  position: absolute;
  top: 35%;
  left: 50%;
  transform: translate(-50%, -50%);
  width: 60px;
  height: 20px;
  background-color: gold;
  transition: background-color 1s ease;
  z-index: 3;
}

/* VIBGYOR animation */
@keyframes vibgyor {
  0% { background-color: violet; }
  14% { background-color: indigo; }
  28% { background-color: blue; }
  42% { background-color: green; }
  57% { background-color: yellow; }
  71% { background-color: orange; }
  85% { background-color: red; }
  100% { background-color: violet; }
}

/* Button */
#clickButton {
  position: absolute;
  top: 200px;
  left: 50%;
  transform: translateX(-50%);
  padding: 10px 25px;
  font-size: 18px;
  background-color: gold;
  color: #001f3f;
  border: none;
  border-radius: 5px;
  cursor: pointer;
  display: none;
  z-index: 10;
}

/* Moon */
.moon {
  position: absolute;
  top: 50px;
  right: 50px;
  width: 120px;
  height: 120px;
  background-color: white;
  border-radius: 50%;
  box-shadow: 0 0 30px rgba(255,255,255,0.5);
  opacity: 0;
  transition: opacity 2s ease;
  z-index: 5;
}

/* Stars */
.stars {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  z-index: 1;
  opacity: 0;
  transition: opacity 2s ease;
}
.star {
  position: absolute;
  background-color: white;
  border-radius: 50%;
  opacity: 0.8;
  animation: twinkle 2s infinite alternate;
}
@keyframes twinkle {
  0% { opacity: 0.2; transform: scale(0.5); }
  50% { opacity: 1; transform: scale(1); }
  100% { opacity: 0.2; transform: scale(0.5); }
}

/* Sun */
.sun {
  position: absolute;
  top: 50px;
  right: 50px;
  width: 120px;
  height: 120px;
  background-color: yellow;
  border-radius: 50%;
  box-shadow: 0 0 50px rgba(255,255,0,0.5);
  opacity: 0;
  transition: opacity 2s ease;
  z-index: 5;
}

/* HAPPY BIRTHDAY text container */
#birthdayTextContainer {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  font-family: 'Great Vibes', cursive;
  font-size: 64px;
  color: red; /* bright red */
  z-index: 50;
  display: flex;
  gap: 5px;
}

/* Each letter */
.birthdayLetter {
  opacity: 0;
  transform: scale(0);
  transition: opacity 0.5s ease, transform 0.5s ease;
}
.birthdayLetter.show {
  opacity: 1;
  transform: scale(1);
}
</style>
</head>
<body>

<!-- Cross -->
<div class="cross">
  <div class="cross-vert"></div>
  <div class="cross-hor"></div>
</div>

<!-- Click button -->
<button id="clickButton">Click Here</button>

<!-- Moon, Stars, Sun -->
<div class="moon" id="moon"></div>
<div class="stars" id="stars"></div>
<div class="sun" id="sun"></div>

<!-- Birthday text container -->
<div id="birthdayTextContainer"></div>

<script>
const button = document.getElementById('clickButton');
const moon = document.getElementById('moon');
const stars = document.getElementById('stars');
const sun = document.getElementById('sun');
const birthdayContainer = document.getElementById('birthdayTextContainer');
const crossVert = document.querySelector('.cross-vert');
const crossHor = document.querySelector('.cross-hor');
let clickCount = 0;

// Show initial button after 3 seconds
setTimeout(() => { button.style.display = 'block'; }, 3000);

// Generate stars
const numStars = 100;
for (let i = 0; i < numStars; i++) {
  const star = document.createElement('div');
  star.className = 'star';
  star.style.top = Math.random() * 100 + '%';
  star.style.left = Math.random() * 100 + '%';
  const size = Math.random() * 4 + 2;
  star.style.width = size + 'px';
  star.style.height = size + 'px';
  star.style.animationDuration = (Math.random() * 3 + 2) + 's';
  stars.appendChild(star);
}

// Button click handler
button.addEventListener('click', () => {
  clickCount++;

  if (clickCount === 1) {
    // Night scene
    button.style.display = 'none';
    moon.style.opacity = '1';
    stars.style.opacity = '1';

    // Button returns after 7 seconds
    setTimeout(() => { button.style.display = 'block'; }, 7000);

  } else if (clickCount === 2) {
    // Day scene
    button.style.display = 'none';
    moon.style.opacity = '0';
    stars.style.opacity = '0';

    sun.style.opacity = '1';
    document.body.style.background = 'linear-gradient(to bottom, #87CEEB, #B0E0E6)';

    // VIBGYOR cross
    crossVert.style.animation = 'vibgyor 14s infinite linear';
    crossHor.style.animation = 'vibgyor 14s infinite linear';

    // Animate "HAPPY BIRTHDAY" letter by letter
    const text = "HAPPY BIRTHDAY";
    birthdayContainer.innerHTML = '';
    for (let i = 0; i < text.length; i++) {
      const span = document.createElement('span');
      span.classList.add('birthdayLetter');
      span.textContent = text[i];
      // Add extra space after "HAPPY"
      if (i === 4) { // after 'Y'
        span.style.marginRight = '20px'; // tab-like space
      }
      birthdayContainer.appendChild(span);
    }

    // Animate letters with 0.3s gap
    setTimeout(() => {
      const letters = birthdayContainer.querySelectorAll('.birthdayLetter');
      letters.forEach((letter, index) => {
        setTimeout(() => {
          letter.classList.add('show');
        }, index * 300); // 0.3 seconds gap
      });
    }, 1000); // start 1 second after sun appears
  }
});
</script>
</body>
</html>
