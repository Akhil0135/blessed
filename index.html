<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>Birthday Memory Journey</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    overflow:hidden;
    background:black;
    font-family:Georgia,serif;
}

canvas{
    position:absolute;
    width:100%;
    height:100%;
}

.scene{
    position:absolute;
    width:100%;
    height:100%;
    display:flex;
    align-items:center;
    justify-content:center;
    flex-direction:column;
    color:white;
    opacity:0;
    transition:2s;
}

.active{
    opacity:1;
}


#text{
    font-size:35px;
    text-align:center;
    text-shadow:0 0 20px gold;
    padding:20px;
}


.notebook{
    width:300px;
    height:220px;
    background:#eee;
    color:#333;
    border-radius:15px;
    padding:30px;
    font-size:25px;
    transform:rotate(-5deg);
    animation:open 3s infinite alternate;
}


@keyframes open{
from{
transform:rotate(-5deg) scale(1);
}
to{
transform:rotate(5deg) scale(1.1);
}
}


.name{
font-size:90px;
letter-spacing:10px;
color:#ffd86b;
text-shadow:
0 0 20px #ffae00,
0 0 50px #ff6600;
}


.flicker{
animation:flicker 1.5s infinite;
}


@keyframes flicker{

0%,100%{
opacity:1;
}

50%{
opacity:.35;
}

}


button{

margin-top:40px;
padding:15px 40px;
border-radius:30px;
border:none;
font-size:22px;
background:#ffcc55;
cursor:pointer;

}

</style>

</head>

<body>


<canvas id="stars"></canvas>


<div id="scene1" class="scene active">

<div class="notebook">

📖<br>

School Memories

<br><br>

✨

</div>


<div id="text">

Some friendships begin in classrooms...<br>
and stay forever.

</div>

</div>




<div id="scene2" class="scene">


<div id="text">

From silly laughs<br>
to unforgettable moments...

</div>


</div>




<div id="scene3" class="scene">


<div class="name">

KEERTHI

</div>


<div class="flicker" style="
font-size:22px;
margin-top:40px;
text-align:center;
">

"You are altogether beautiful, my darling;<br>
there is no flaw in you."<br>

— Song of Solomon 4:7

</div>


</div>





<div id="scene4" class="scene">


<div style="
font-size:55px;
color:#ffd27f;
text-shadow:0 0 30px gold;
">

HAPPY BIRTHDAY

</div>


<div class="name">

CHOTI ❤️

</div>


</div>






<button id="btn"
style="
position:absolute;
bottom:40px;
left:50%;
transform:translateX(-50%);
z-index:5;
">

START MEMORY

</button>





<script>


const canvas=document.getElementById("stars");
const ctx=canvas.getContext("2d");


function resize(){

canvas.width=innerWidth;
canvas.height=innerHeight;

}

resize();
onresize=resize;


let stars=[];


for(let i=0;i<300;i++){

stars.push({

x:Math.random()*innerWidth,
y:Math.random()*innerHeight,
r:Math.random()*2,
s:Math.random()*0.03

});

}



function animate(){

ctx.fillStyle="black";
ctx.fillRect(0,0,canvas.width,canvas.height);


stars.forEach(star=>{

star.y-=star.s;


if(star.y<0)
star.y=canvas.height;


ctx.fillStyle="white";
ctx.beginPath();
ctx.arc(star.x,star.y,star.r,0,Math.PI*2);
ctx.fill();


});


requestAnimationFrame(animate);

}

animate();



let current=1;


function next(){


document
.getElementById("scene"+current)
.classList.remove("active");


current++;


if(current>4)
current=1;


document
.getElementById("scene"+current)
.classList.add("active");


}



document
.getElementById("btn")
.onclick=()=>{


next();


setInterval(next,6000);


document.getElementById("btn").style.display="none";


};



</script>


</body>
</html>
