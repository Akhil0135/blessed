<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Golden Cross to Moon</title>
<style>
  body {
    margin: 0;
    height: 100vh;
    background-color: #001f3f; /* navy blue */
    display: flex;
    flex-direction: column;
    justify-content: flex-start;
    align-items: center;
    padding-top: 50px;
    overflow: hidden;
    transition: background-color 2s ease;
  }

  /* Cross container */
  .cross {
    position: relative;
    width: 20px;   
    height: 100px; 
  }

  /* Vertical bar */
  .cross::before {
    content: '';
    position: absolute;
    top: 0;
    left: 50%;
    transform: translateX(-50%);
    width: 20px;
    height: 100px;
    background-color: gold;
    box-shadow: 0 0 2px gold;
  }

  /* Horizontal bar */
  .cross::after {
    content: '';
    position: absolute;
    top: 40%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 60px;
    height: 20px;
    background-color: gold;
    box-shadow: 0 0 2px gold;
  }

  /* Button styling */
  #clickButton {
    margin-top: 50px;
    padding: 10px 25px;
    font-size: 18px;
    background-color: gold;
    color: #001f3f;
    border: none;
    border-radius: 5px;
    cursor: pointer;
    display: none; 
    box-shadow: 0 0 5px gold;
    transition: opacity 0.5s ease;
  }

  /* Moon styling */
  .moon {
    position: absolute;
    top: 20%;
    left: 50%;
    transform: translateX(-50%);
    width: 120px;
    height: 120px;
    background-color: white;
    border-radius: 50%;
    box-shadow: 0 0 30px rgba(255,255,255,0.5);
    opacity: 0;
    transition: opacity 2s ease;
    z-index: 1;
  }

  /* Stars container */
  .stars {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    z-index: 0;
    opacity: 0;
    transition: opacity 2s ease;
  }

  .star {
    position: absolute;
    background-color: white;
    border-radius: 50%;
    width: 2px;
    height: 2px;
    opacity: 0.8;
    animation: twinkle 2s infinite alternate;
  }

  @keyframes twinkle {
    0% { opacity: 0.2; transform: scale(0.5); }
    50% { opacity: 1; transform: scale(1); }
    100% { opacity: 0.2; transform: scale(0.5); }
  }
</style>
</head>
<body>
  <div class="cross"></div>
  <button id="clickButton">Click Here</button>
  
  <!-- Moon -->
  <div class="moon" id="moon"></div>
  <!-- Stars -->
  <div class="stars" id="stars"></div>

<script>
  // Show button after 3 seconds
  setTimeout(() => {
    document.getElementById('clickButton').style.display = 'block';
  }, 3000);

  // Generate stars
  const starsContainer = document.getElementById('stars');
  const numStars = 100;
  for(let i=0; i<numStars; i++){
    const star = document.createElement('div');
    star.className = 'star';
    star.style.top = Math.random() * 100 + '%';
    star.style.left = Math.random() * 100 + '%';
    star.style.width = Math.random() * 3 + 1 + 'px';
    star.style.height = star.style.width;
    star.style.animationDuration = (Math.random() * 3 + 2) + 's';
    starsContainer.appendChild(star);
  }

  // Click button action
  document.getElementById('clickButton').addEventListener('click', () => {
    // Hide button
    document.getElementById('clickButton').style.display = 'none';
    // Fade out cross
    document.querySelector('.cross').style.opacity = '0';
    document.querySelector('.cross').style.transition = 'opacity 2s ease';
    // Show moon and stars
    document.getElementById('moon').style.opacity = '1';
    document.getElementById('stars').style.opacity = '1';
  });
</script>
</body>
</html>
