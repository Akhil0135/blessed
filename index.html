<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>IMAX PRINCE → DAIVIK</title>
<style>
    html, body {
        margin: 0;
        padding: 0;
        overflow: hidden;
        background: #000;
    }
    canvas { display: block; }

    /* Click Here Button */
    #clickBtn {
        position: absolute;
        left: 50%;
        bottom: 60px;
        transform: translateX(-50%);
        padding: 14px 28px;
        font-size: 22px;
        font-weight: bold;
        background: #fff;
        color: #000;
        border: none;
        border-radius: 12px;
        cursor: pointer;
        opacity: 0;
        transition: opacity 0.8s;
        box-shadow: 0 0 20px rgba(255,255,255,0.8);
    }
</style>
</head>
<body>
<canvas id="c"></canvas>
<button id="clickBtn">Click Here</button>

<script>
const canvas = document.getElementById("c");
const ctx = canvas.getContext("2d");

function resize() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
    mapText();
}
resize();
window.onresize = resize;

// ------------ Background Twinkling Stars ------------
const bgStars = [];
const bgStarCount = 180;
for (let i = 0; i < bgStarCount; i++) {
    bgStars.push({
        x: Math.random() * canvas.width,
        y: Math.random() * canvas.height,
        size: Math.random() * 1.2 + 0.3,
        tw: Math.random() * 0.02 + 0.003
    });
}

function drawStars() {
    bgStars.forEach(s => {
        const glow = (Math.sin(Date.now() * s.tw) + 1) * 0.5;
        ctx.fillStyle = `rgba(255,255,255,${glow})`;
        ctx.beginPath();
        ctx.arc(s.x, s.y, s.size, 0, Math.PI*2);
        ctx.fill();
    });
}

// ------------ Letter Particles ------------
let currentText = "PRINCE";
const tempCanvas = document.createElement("canvas");
const tempCtx = tempCanvas.getContext("2d");
let points = [];

function mapText() {
    tempCanvas.width = canvas.width;
    tempCanvas.height = canvas.height;
    const fontSize = canvas.width / 7;

    tempCtx.clearRect(0,0,tempCanvas.width,tempCanvas.height);
    tempCtx.fillStyle = "#fff";
    tempCtx.font = "bold " + fontSize + "px Arial";
    tempCtx.textAlign = "center";
    tempCtx.textBaseline = "middle";
    tempCtx.fillText(currentText, tempCanvas.width/2, tempCanvas.height/2);

    const data = tempCtx.getImageData(0,0,tempCanvas.width,tempCanvas.height).data;
    points = [];
    for(let y=0; y<tempCanvas.height; y+=6){
        for(let x=0; x<tempCanvas.width; x+=6){
            const i = (y*tempCanvas.width + x)*4;
            if(data[i+3] > 200) points.push({x, y});
        }
    }

    resetParticles();
}

let particles = [];
function resetParticles() {
    particles = points.map(p => ({
        x: Math.random()*canvas.width,
        y: Math.random()*canvas.height,
        tx: p.x,
        ty: p.y,
        size: Math.random()*2 + 1.5,
        speed: Math.random()*0.08 + 0.04
    }));
}

// ------------ Camera (IMAX Nolan Drift) ------------
let zoom=1, rotation=0, driftX=0, driftY=0;
function applyCamera() {
    zoom += 0.0001;
    rotation += 0.00012;
    driftX = Math.sin(Date.now()*0.0003)*8;
    driftY = Math.cos(Date.now()*0.00025)*8;

    ctx.save();
    ctx.translate(canvas.width/2 + driftX, canvas.height/2 + driftY);
    ctx.scale(zoom, zoom);
    ctx.rotate(rotation);
    ctx.translate(-canvas.width/2, -canvas.height/2);
}

// ------------ Animation Loop ------------
function animate() {
    ctx.clearRect(0,0,canvas.width,canvas.height);
    applyCamera();
    drawStars();

    particles.forEach(p => {
        // Smooth movement to target
        p.x += (p.tx - p.x) * p.speed;
        p.y += (p.ty - p.y) * p.speed;

        // White shining glow
        const pulse = (Math.sin(Date.now()*0.004)+1)*0.5 + 0.4;
        ctx.fillStyle = `rgba(255,255,255,${pulse})`;
        ctx.shadowBlur = 18;
        ctx.shadowColor = "#fff";

        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size, 0, Math.PI*2);
        ctx.fill();
    });

    ctx.restore();
    requestAnimationFrame(animate);
}
animate();

// ------------ Click Here Button Handling ------------
const btn = document.getElementById("clickBtn");
setTimeout(() => { btn.style.opacity = 1; }, 3000);

btn.onclick = () => {
    currentText = "DAIVIK";
    mapText();
};
</script>
</body>
</html>
