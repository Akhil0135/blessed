<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cinematic Night to Day</title>
<style>
  body, html {
    margin: 0;
    padding: 0;
    overflow: hidden;
    width: 100%;
    height: 100%;
    background: linear-gradient(to top,#000005,#0b0b1a,#11112b); /* darker night */
    font-family: 'Cinzel', serif;
    transition: background 4s ease;
  }

  /* Cinematic Stars */
  .star {
    position: absolute;
    border-radius: 50%;
    background: radial-gradient(circle, #ffffff 0%, rgba(255,255,255,0) 70%);
    opacity: 0.8; /* brighter */
    box-shadow: 0 0 10px rgba(255,255,255,0.9);
    animation: twinkle 2s infinite alternate;
    transition: opacity 2s ease;
  }

  @keyframes twinkle {
    0% { opacity: 0.4; transform: scale(0.8); }
    50% { opacity: 1; transform: scale(1.3); }
    100% { opacity: 0.4; transform: scale(0.8); }
  }

  /* Aurora */
  .aurora {
    position: absolute;
    top: 0;
    width: 100%;
    height: 40vh;
    background: radial-gradient(circle at 50% 20%, rgba(0,255,200,0.25), transparent),
                radial-gradient(circle at 30% 10%, rgba(0,150,255,0.2), transparent),
                radial-gradient(circle at 70% 5%, rgba(150,80,255,0.2), transparent);
    filter: blur(30px);
    animation: auroraMove 20s ease-in-out infinite alternate;
    transition: opacity 3s ease;
  }

  @keyframes auroraMove {
    0% { transform: translateY(0px) scale(1); }
    100% { transform: translateY(-20px) scale(1.1); }
  }

  /* Clouds */
  .cloud {
    position: absolute;
    width: 250px;
    height: 100px;
    background: rgba(255,255,255,0.08);
    border-radius: 50%;
    filter: blur(25px);
    animation: moveCloud linear infinite;
    transition: background 4s ease;
  }

  @keyframes moveCloud {
    0% { left: -300px; }
    100% { left: 110%; }
  }

  /* Moon */
  .moon {
    position: absolute;
    width: 140px;
    height: 140px;
    background: radial-gradient(circle, #fffde6 0%, #f3e4b0 60%, #d9c180 100%);
    border-radius: 50%;
    top: 80px;
    left: -120px;
    box-shadow: 0 0 18px 4px rgba(255,255,200,0.4);
    animation: moonMove 25s linear forwards; /* faster */
    transition: opacity 3s ease;
  }

  @keyframes moonMove {
    0% { left: -150px; }
    100% { left: 70%; }
  }

  /* Shooting stars */
  .shooting-star {
    position: absolute;
    height: 2px;
    background: linear-gradient(0deg, rgba(255,255,255,0), white);
    border-radius: 50%;
    opacity: 0;
    transform-origin: top left;
  }

  @keyframes shoot {
    0% { transform: translate(0,0) rotate(-45deg); opacity: 1; }
    100% { transform: translate(-70vw,70vh) rotate(-45deg); opacity: 0; }
  }

  /* Message reveal */
  #message {
    position: absolute;
    top: 60%;
    width: 100%;
    text-align: center;
    font-size: 28px;
    color: #f9e9c9;
    opacity: 1;
    letter-spacing: 3px;
    transition: opacity 2s ease;
  }

  .letter {
    opacity: 0;
    display: inline-block;
    animation: revealLetter 1s forwards;
  }

  @keyframes revealLetter {
    0% { opacity: 0; filter: blur(5px); transform: translateY(5px); }
    100% { opacity: 1; filter: blur(0); transform: translateY(0); }
  }

  /* Click Here Button */
  #clickBtn {
    position: absolute;
    bottom: 15vh;
    left: 50%;
    transform: translateX(-50%);
    padding: 14px 32px;
    font-size: 20px;
    font-family: 'Cinzel', serif;
    background: rgba(255,255,255,0.12);
    border: 1px solid rgba(255,255,255,0.45);
    border-radius: 40px;
    color: #fff;
    cursor: pointer;
    opacity: 0;
    transition: opacity 1.5s ease;
    z-index: 200;
  }

  /* Button Float Animation */
  @keyframes btnFloat {
    0% { transform: translateX(-50%) translateY(0px); }
    50% { transform: translateX(-50%) translateY(-6px); }
    100% { transform: translateX(-50%) translateY(0px); }
  }

  #clickBtn.float {
    animation: btnFloat 3s ease-in-out infinite;
  }

  /* Sun */
  .sun {
    position: absolute;
    top: -200px;
    left: 50%;
    transform: translateX(-50%);
    width: 140px;
    height: 140px;
    border-radius: 50%;
    background: radial-gradient(circle, #ffdd59 0%, #ffb347 60%, #ff9500 100%);
    box-shadow: 0 0 60px 15px rgba(255,180,50,0.6);
    transition: top 4s ease;
    z-index: 30;
  }

  .sun.rise {
    top: 80px;
  }

</style>
</head>
<body>

<div class="aurora"></div>
<div class="moon"></div>
<div id="message"></div>
<button id="clickBtn">Click Here</button>
<div class="sun"></div>

<script>
  // Cinematic Stars (night only)
  const starCount = 300;
  const stars = [];
  for(let i=0;i<starCount;i++){
    const star=document.createElement('div');
    star.classList.add('star');
    star.style.top=Math.random()*window.innerHeight+'px';
    star.style.left=Math.random()*window.innerWidth+'px';
    const size = 2 + Math.random()*2;
    star.style.width = star.style.height = size + 'px';
    star.style.animationDuration = (1 + Math.random()*2)+'s';
    stars.push(star);
    document.body.appendChild(star);
  }

  // Clouds
  const cloudCount = 6;
  const clouds = [];
  for(let i=0;i<cloudCount;i++){
    const cloud=document.createElement('div');
    cloud.classList.add('cloud');
    cloud.style.top=(50 + Math.random()*250)+'px';
    cloud.style.animationDuration=(35 + Math.random()*40)+'s';
    document.body.appendChild(cloud);
    clouds.push(cloud);
  }

  // Moon
  const moon = document.querySelector('.moon');

  // Shooting stars
  let shootingInterval;
  function startShootingStars(){
    shootingInterval = setInterval(()=>{
      const star = document.createElement('div');
      star.classList.add('shooting-star');
      star.style.width = (12+Math.random()*6)+'px';
      star.style.top=Math.random()*200+'px';
      star.style.left=window.innerWidth+'px';
      const duration=2 + Math.random()*1.3;
      star.style.animation = `shoot ${duration}s linear forwards`;
      document.body.appendChild(star);
      setTimeout(()=>{ star.remove(); }, duration*1000);
    }, 600);
  }
  startShootingStars();

  // Message reveal
  const msg = "On this calm birthday eve so new, God softly whispers, my plans are made for you.";
  const messageDiv = document.getElementById("message");

  function revealMessage(){
    msg.split("").forEach((char,i)=>{
      const span = document.createElement('span');
      span.classList.add('letter');
      span.textContent = char === ' ' ? '\u00A0' : char;
      span.style.animationDelay = (0.5 * i)+'s'; // very slow
      messageDiv.appendChild(span);
    });
  }
  setTimeout(revealMessage, 1000);

  // Sun
  const sun = document.querySelector('.sun');

  // Click button trigger when moon is near end
  const clickBtn = document.getElementById('clickBtn');
  function checkMoonPosition(){
    const rect = moon.getBoundingClientRect();
    if(rect.left > window.innerWidth*0.65){
      clickBtn.style.opacity = 1;
      clickBtn.classList.add('float');
      clearInterval(moonInterval);
    }
  }
  const moonInterval = setInterval(checkMoonPosition, 200);

  // Click event: day transition
  clickBtn.addEventListener('click', ()=>{
    clickBtn.style.opacity = 0;
    clickBtn.style.pointerEvents = 'none';

    clearInterval(shootingInterval);

    document.querySelectorAll('.shooting-star').forEach(s => s.style.opacity=0);

    document.querySelector('.aurora').style.opacity=0;
    moon.style.opacity=0;

    stars.forEach(s => s.style.opacity=0);
    messageDiv.style.opacity=0;

    clouds.forEach(c => c.style.background='rgba(255,255,255,0.3)');

    document.body.style.background='linear-gradient(to top,#87CEEB 0%,#B0CFFB 100%)';
    sun.classList.add('rise');
  });
</script>

</body>
</html>
