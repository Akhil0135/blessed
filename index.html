<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Phase 4 — HAPPY BIRTHDAY PRINCE</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    overflow: hidden;
    background: #000;
  }
  canvas {
    display: block;
  }
</style>
</head>
<body>
<canvas id="c"></canvas>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r150/three.min.js"></script>
<script>
const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x000000, 0.002);

const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 2000);
camera.position.z = 400;

const renderer = new THREE.WebGLRenderer({canvas: document.getElementById('c'), antialias: true});
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(window.devicePixelRatio);

// Ambient light
const ambientLight = new THREE.AmbientLight(0xffffff, 0.7);
scene.add(ambientLight);

// Spot light for depth
const spotLight = new THREE.SpotLight(0xffddaa, 1.2);
spotLight.position.set(300, 400, 400);
spotLight.castShadow = true;
scene.add(spotLight);

// Text loader
const loader = new THREE.FontLoader();
loader.load('https://threejs.org/examples/fonts/helvetiker_bold.typeface.json', function(font) {
    const textGeometry = new THREE.TextGeometry('HAPPY BIRTHDAY PRINCE', {
        font: font,
        size: 40,
        height: 15,
        curveSegments: 12,
        bevelEnabled: true,
        bevelThickness: 2,
        bevelSize: 1,
        bevelOffset: 0,
        bevelSegments: 5
    });

    textGeometry.center();

    const textMaterial = new THREE.MeshStandardMaterial({
        color: 0xffcc00,
        emissive: 0xff9900,
        metalness: 0.8,
        roughness: 0.2
    });

    const textMesh = new THREE.Mesh(textGeometry, textMaterial);
    scene.add(textMesh);

    // Floating particles
    const particlesGeometry = new THREE.BufferGeometry();
    const particlesCount = 600;
    const posArray = new Float32Array(particlesCount * 3);

    for(let i=0;i<particlesCount*3;i++) {
        posArray[i] = (Math.random()-0.5) * 1000;
    }
    particlesGeometry.setAttribute('position', new THREE.BufferAttribute(posArray,3));

    const particlesMaterial = new THREE.PointsMaterial({
        color: 0xffffff,
        size: 3,
        transparent: true,
        opacity: 0.7
    });

    const particleSystem = new THREE.Points(particlesGeometry, particlesMaterial);
    scene.add(particleSystem);

    // Animation
    let angle = 0;
    function animate() {
        requestAnimationFrame(animate);
        angle += 0.001;
        camera.position.x = Math.sin(angle) * 400;
        camera.position.z = Math.cos(angle) * 400;
        camera.lookAt(0,0,0);

        particleSystem.rotation.y += 0.001;
        renderer.render(scene, camera);
    }
    animate();
});

window.addEventListener('resize', ()=>{
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
});
</script>
</body>
</html>
