<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Cinematic Birthday Eve</title>

<style>
  @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&display=swap');

  body,html{
    height:100%;
    margin:0;
    background:linear-gradient(to top,#030416 0%,#07122b 45%,#0b1833 100%);
    overflow:hidden;
    font-family:'Playfair Display', serif;
    color:#fff;
  }

  /* Stars */
  .star{
    position:absolute;
    width:2px;height:2px;
    border-radius:50%;
    background:#fff;
    opacity:0.7;
    animation:twinkle 2.5s infinite ease-in-out alternate;
  }
  @keyframes twinkle{
    0%{opacity:0.2;transform:scale(1)}
    100%{opacity:1;transform:scale(1.6)}
  }

  /* Moon */
  .moon{
    position:absolute;
    width:140px;height:140px;
    background:radial-gradient(circle,#fffbe0 0%,#efe0a0 60%,#d7c07a 100%);
    border-radius:50%;
    top:40px;left:-240px;
    box-shadow:0 0 12px 3px rgba(255,245,200,0.35);
    z-index:40;
    animation:moonMove 70s linear infinite;
  }
  @keyframes moonMove{
    0%{left:-240px;top:60px}
    50%{left:45%;top:80px}
    100%{left:115%;top:60px}
  }

  /* Aurora */
  .aurora{
    position:absolute;
    top:0;left:0;
    width:200%;height:45vh;
    background:linear-gradient(120deg,
      rgba(0,210,140,0.12),
      rgba(110,20,255,0.10),
      rgba(0,150,255,0.08)
    );
    filter:blur(48px);
    opacity:0.28;
    z-index:10;
    animation:auroraX 16s ease-in-out infinite alternate,
             auroraWave 6s ease-in-out infinite;
  }
  @keyframes auroraX{0%{transform:translateX(-6%)}100%{transform:translateX(6%)}}
  @keyframes auroraWave{0%{transform:translateY(0)}50%{transform:translateY(18px)}100%{transform:translateY(0)}}

  /* Clouds */
  .cloud{
    position:absolute;
    width:360px;height:140px;
    background:rgba(255,255,255,0.07);
    border-radius:50%;
    filter:blur(24px);
    opacity:1;
    animation:morph 8s ease-in-out infinite;
    box-shadow:0 0 26px rgba(255,255,255,0.05);
  }
  .cloud::before,.cloud::after{
    content:"";
    position:absolute;
    width:220px;height:110px;
    background:rgba(255,255,255,0.07);
    border-radius:50%;
    filter:blur(24px);
  }
  .cloud::before{left:60px;top:-34px}
  .cloud::after{left:160px;top:18px}

  .layer-back{opacity:0.55;z-index:12}
  .layer-mid{opacity:0.85;z-index:28}
  .layer-front{opacity:1;z-index:48}

  @keyframes morph{
    0%{transform:scale(1)}
    50%{transform:scale(1.08,0.94)}
    100%{transform:scale(1)}
  }

  /* Mist */
  .mist{
    position:absolute;
    bottom:0;
    width:120%;height:220px;
    left:-8%;
    background:radial-gradient(circle at 50% 40%,rgba(255,255,255,0.06),rgba(255,255,255,0));
    filter:blur(26px);
    opacity:0.75;
    z-index:22;
    animation:mistMove 20s linear infinite;
  }
  @keyframes mistMove{
    0%{transform:translateX(0)}
    100%{transform:translateX(80px)}
  }

  /* Shooting stars */
  .shoot{
    position:absolute;
    width:10px;height:3px;
    border-radius:50%;
    background:linear-gradient(0deg,rgba(255,255,255,0),#fff);
    filter:drop-shadow(0 0 6px rgba(255,255,255,0.6));
    z-index:70;
  }

  /* Message Container */
  .messageWrap{
    position:absolute;
    left:50%;top:48%;
    transform:translate(-50%,-50%);
    text-align:center;
    z-index:80;
  }

  /* Letter-by-letter reveal */
  .glowLetter{
    opacity:0;
    display:inline-block;
    transform:translateY(6px) scale(0.96);
    filter:blur(4px);
    transition:
      opacity 0.55s ease-out,
      transform 0.55s ease-out,
      filter 0.55s ease-out;
  }
  .glowLetter.visible{
    opacity:1;
    transform:translateY(0) scale(1);
    filter:blur(0);
    text-shadow:
      0 0 14px rgba(255,255,210,0.85),
      0 0 22px rgba(255,255,190,0.55);
  }

  /* Click Button */
  #clickBtn{
    position:absolute;
    bottom:14vh;left:50%;
    transform:translateX(-50%);
    padding:14px 34px;
    font-size:20px;
    background:rgba(255,255,255,0.12);
    border:1px solid rgba(255,255,255,0.45);
    border-radius:40px;
    backdrop-filter:blur(6px);
    color:#fff;
    opacity:0;
    pointer-events:none;
    transition:opacity 1.8s ease-out;
    z-index:120;
  }
  #clickBtn.reveal{
    opacity:1;
    pointer-events:auto;
    animation:btnFloat 3.4s ease-in-out infinite;
  }
  @keyframes btnFloat{
    0%{transform:translateX(-50%) translateY(0)}
    50%{transform:translateX(-50%) translateY(-6px)}
    100%{transform:translateX(-50%) translateY(0)}
  }

</style>
</head>
<body>

<div class="aurora"></div>
<div class="moon"></div>
<div id="cloudRoot"></div>
<div class="mist"></div>

<div class="messageWrap">
  <div id="msgText" style="font-size:36px;line-height:1.3;max-width:88vw;">
    On this calm birthday eve so new,<br>
    God softly whispers, ‘My plans are made for you.’
  </div>
</div>

<button id="clickBtn">Click Here</button>

<script>
/* Stars */
for(let i=0;i<220;i++){
  const s=document.createElement('div');
  s.className='star';
  s.style.left=Math.random()*100+'vw';
  s.style.top=Math.random()*100+'vh';
  const size=Math.random()*2+0.6;
  s.style.width=s.style.height=size+'px';
  s.style.animationDuration=(2+Math.random()*2.5)+'s';
  document.body.appendChild(s);
}

/* Clouds */
const cloudRoot=document.getElementById("cloudRoot");
const layers=[
  {cls:'layer-back',count:3,min:30,max:130,dur:80},
  {cls:'layer-mid',count:3,min:90,max:220,dur:60},
  {cls:'layer-front',count:3,min:160,max:320,dur:40},
];

layers.forEach(L=>{
  for(let i=0;i<L.count;i++){
    const c=document.createElement("div");
    c.className="cloud "+L.cls;
    c.style.top=(Math.random()*(L.max-L.min)+L.min)+'px';
    const duration=L.dur+Math.random()*30;
    c.style.animation=`moveCloud ${duration}s linear infinite, morph 7s ease-in-out infinite`;
    c.style.left=(-200 - Math.random()*600)+"px";
    cloudRoot.appendChild(c);
  }
});

const style=document.createElement("style");
style.innerHTML=`@keyframes moveCloud{0%{transform:translateX(-700px)}100%{transform:translateX(${window.innerWidth+300}px)}}`;
document.head.appendChild(style);

/* Shooting stars */
function shooting(){
  const s=document.createElement("div");
  s.className="shoot";
  s.style.top=(Math.random()*200)+'px';
  s.style.left=window.innerWidth+'px';
  const dur=1.2+Math.random()*1.5;
  s.style.transition=`transform ${dur}s linear, opacity ${dur}s linear`;
  document.body.appendChild(s);
  requestAnimationFrame(()=>{
    s.style.transform=`translate(-60vw,40vh) rotate(-45deg)`;
    s.style.opacity='1';
  });
  setTimeout(()=>{s.style.opacity='0'},dur*700);
  setTimeout(()=>s.remove(),dur*1200);
}
setInterval(shooting,1200);

/* LETTER-BY-LETTER REVEAL */
function moonGlowReveal(){
  const msg=document.getElementById("msgText");
  const txt=msg.innerHTML;

  let html="";
  for(let ch of txt){
    if(ch==="<"){html+=ch;continue;}
    if(ch===">"){html+=ch;continue;}
    html+=`<span class="glowLetter">${ch}</span>`;
  }
  msg.innerHTML=html;

  let delay=0;
  document.querySelectorAll(".glowLetter").forEach((L)=>{
    setTimeout(()=>L.classList.add("visible"),delay);
    delay+=85;
  });
}
setTimeout(moonGlowReveal,4500);

/* BUTTON SHOW AFTER MOON CROSSES SCREEN */
document.querySelector(".moon")
  .addEventListener("animationiteration",()=>{
    document.getElementById("clickBtn").classList.add("reveal");
  });
</script>

</body>
</html>
