<!-- Stage 4 -->
<div id="stage4" style="display:none;"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/examples/js/loaders/FontLoader.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/examples/js/geometries/TextGeometry.js"></script>

<script>
// ---------------- Stage 4 Setup ----------------
function startStage4(){
    document.getElementById("stage3").style.display="none";
    const stage4 = document.getElementById("stage4");
    stage4.style.display = "block";

    // Scene + Camera
    const scene = new THREE.Scene();
    scene.fog = new THREE.FogExp2(0x000000, 0.0012);

    const camera = new THREE.PerspectiveCamera(60, window.innerWidth/window.innerHeight, 0.1, 3000);
    camera.position.set(0,50,400);

    const renderer = new THREE.WebGLRenderer({antialias:true});
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(window.devicePixelRatio);
    stage4.appendChild(renderer.domElement);

    // Stars
    const starGeo = new THREE.BufferGeometry();
    const starCount = 2500;
    const starArr = new Float32Array(starCount*3);
    for(let i=0;i<starCount*3;i++) starArr[i]=(Math.random()-0.5)*3000;
    starGeo.setAttribute("position", new THREE.BufferAttribute(starArr,3));
    const starMat = new THREE.PointsMaterial({color:0xffffff, size:2.2});
    const stars = new THREE.Points(starGeo, starMat);
    scene.add(stars);

    const starVel = new Float32Array(starCount);
    for(let i=0;i<starCount;i++) starVel[i]=Math.random()*0.02+0.01;

    // Lights
    scene.add(new THREE.AmbientLight(0x666666,0.5));
    const keyLight = new THREE.PointLight(0x99ccff,2,2000);
    keyLight.position.set(180,200,140);
    scene.add(keyLight);
    const warmLight = new THREE.PointLight(0xffddaa,1.8,2000);
    warmLight.position.set(-120,160,-80);
    scene.add(warmLight);

    // Nebula Shader
    const nebulaMat = new THREE.ShaderMaterial({
        uniforms:{time:{value:0}},
        vertexShader:`varying vec2 vUv;void main(){vUv=uv;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0);}`,
        fragmentShader:`varying vec2 vUv;uniform float time;
        float hash(vec2 p){return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5453123);}
        float noise(vec2 p){vec2 i=floor(p);vec2 f=fract(p);float a=hash(i);float b=hash(i+vec2(1.0,0.0));
        float c=hash(i+vec2(0.0,1.0));float d=hash(i+vec2(1.0,1.0));vec2 u=f*f*(3.0-2.0*f);
        return mix(a,b,u.x)+(c-a)*u.y*(1.0-u.x)+(d-b)*u.x*u.y;}
        void main(){float t=time*0.3;float n=noise(vUv*10.0+vec2(t*0.5,-t*0.3));
        float glow=smoothstep(0.2,0.7,n);vec3 col=vec3(0.3+glow*0.7,0.2+glow*0.5,0.6+glow*0.9);
        gl_FragColor=vec4(col,1.0);}`
    });

    // PRINCE Text
    let princeLetters=[];
    let loadedFont=null;
    new THREE.FontLoader().load("https://threejs.org/examples/fonts/helvetiker_bold.typeface.json", font=>{
        loadedFont = font;
        const princeText = "PRINCE";
        const size = 140;
        const height = 15;
        const spacing = size*0.95;
        const xOffset = -spacing*(princeText.length-1)/2;

        for(let i=0;i<princeText.length;i++){
            let geo = new THREE.TextGeometry(princeText[i],{font:font,size:size,height:height,bevelEnabled:true,bevelThickness:5,bevelSize:3});
            geo.center();
            let mesh = new THREE.Mesh(geo, nebulaMat);
            mesh.position.x = xOffset + i*spacing;
            mesh.position.y = 0;
            mesh.position.z = -800;
            mesh.scale.set(0.1,0.1,0.1);
            mesh.rotation.x = (Math.random()-0.5)*0.5;
            mesh.rotation.y = (Math.random()-0.5)*0.5;
            mesh.material.opacity = 0;
            mesh.visible = false;
            princeLetters.push(mesh);
            scene.add(mesh);
        }

        let currentLetter = 0;
        function revealNextLetter(){
            if(currentLetter<princeLetters.length){
                let mesh = princeLetters[currentLetter];
                mesh.visible = true;
                let frame=0, duration=120;
                function animateLetter(){
                    if(frame<=duration){
                        let t = frame/duration;
                        mesh.position.z = -800*(1-t);
                        mesh.scale.set(0.1+0.9*t,0.1+0.9*t,0.1+0.9*t);
                        mesh.material.opacity = t;
                        frame++; requestAnimationFrame(animateLetter);
                    }
                }
                animateLetter();
                currentLetter++;
                setTimeout(revealNextLetter, 350);
            }
        }
        revealNextLetter();
    });

    // Animate Stage 4
    let angle=0;
    function animate(){
        requestAnimationFrame(animate);
        stars.rotation.y+=0.0005;
        let positions = stars.geometry.attributes.position.array;
        for(let i=0;i<starCount;i++) positions[i*3+2]+=Math.sin(Date.now()*0.001 + i)*0.01*starVel[i];
        stars.geometry.attributes.position.needsUpdate = true;
        if(loadedFont) angle += 0.0012;
        camera.position.x = Math.sin(angle)*400;
        camera.position.z = Math.cos(angle)*400;
        camera.lookAt(0,50,0);
        nebulaMat.uniforms.time.value += 0.03;
        renderer.render(scene,camera);
    }
    animate();

    window.addEventListener("resize",()=>{
        camera.aspect = window.innerWidth/window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
    });
}
</script>
