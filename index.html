<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ultimate Cinematic Night Scene</title>
<style>
  body, html {
    margin:0;
    padding:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:#000008;
    font-family:'Cinzel', serif;
  }

  /* --- CINEMATIC CLOUDS (ULTIMATE) --- */
  .cloud-layer {
    position:absolute;
    width:100%;
    height:100%;
    top:0;
    left:0;
    pointer-events:none; /* FIXED: CSS property must be hyphenated */
    overflow:hidden;
  }

  .cloud {
    position:absolute;
    width:600px;
    height:300px;
    background:radial-gradient(circle at 40% 40%, rgba(255,255,255,0.25), rgba(255,255,255,0.04) 60%, transparent 100%);
    filter: blur(35px) brightness(1.2); /* spaces between filters */
    opacity:0.45;
    border-radius:50%;
    animation:cloudDrift linear infinite;
  }

  .cloud.xl { width:900px; height:420px; opacity:0.35; filter: blur(45px); }
  .cloud.sm { width:450px; height:220px; opacity:0.5; filter: blur(30px); }

  @keyframes cloudDrift {
    0% { transform:translateX(-900px); }
    100% { transform:translateX(110%); }
  }

  /* CLOUD SHADOW LAYERS */
  .cloud-shadow {
    position:absolute;
    width:600px;
    height:300px;
    top:0;
    left:0;
    background:rgba(0,0,0,0.25);
    filter: blur(60px);
    opacity:0.15;
    border-radius:50%;
    animation:shadowDrift linear infinite;
    pointer-events:none;
  }

  @keyframes shadowDrift {
    0% { transform:translateX(-400px); }
    100% { transform:translateX(120%); }
  }

  /* STARS */
  #stars { position:absolute; inset:0; pointer-events:none; }
  .star {
    position:absolute;
    width:2px;
    height:2px;
    background:#fff;
    border-radius:50%;
    box-shadow:0 0 8px #ffffff;
    opacity:0.6;
    animation:twinkle 3s infinite ease-in-out;
  }

  @keyframes twinkle {
    0% { opacity:0.2; transform:scale(1); }
    50% { opacity:1; transform:scale(1.6); }
    100% { opacity:0.2; transform:scale(1); }
  }

  /* MOON */
  .moon {
    position:absolute;
    width:160px;
    height:160px;
    border-radius:50%;
    background:radial-gradient(circle, #fffdf0 0%, #f8e9b5 50%, #ddc690 100%);
    box-shadow:0 0 80px 40px rgba(255,240,200,0.4);
    top:90px;
    left:-200px;
    transition:opacity 2s ease;
    pointer-events:none;
  }

  /* MESSAGE */
  #message {
    position:absolute;
    top:65%;
    width:100%;
    font-size:30px;
    text-align:center;
    color:#f3dfc7;
    text-shadow:2px 2px 15px black;
    opacity:0;
    pointer-events:none;
  }

  .letter {
    opacity:0;
    display:inline-block;
    animation:letterReveal 0.4s forwards cubic-bezier(.17,.67,.2,1.65);
  }

  @keyframes letterReveal {
    0% { opacity:0; transform:translateY(20px) scale(0.8); }
    100% { opacity:1; transform:translateY(0) scale(1); }
  }

  /* BUTTON */
  #clickBtn {
    position:absolute;
    bottom:12vh;
    left:50%;
    transform:translateX(-50%);
    padding:15px 40px;
    border-radius:40px;
    background:rgba(255,255,255,0.1);
    color:white;
    border:1px solid rgba(255,255,255,0.35);
    opacity:0;
    pointer-events:none;
    font-size:20px;
    animation:btnFloat 3s infinite ease-in-out;
  }

  @keyframes btnFloat {
    0% { transform:translateX(-50%) translateY(0); }
    50% { transform:translateX(-50%) translateY(-7px); }
    100% { transform:translateX(-50%) translateY(0); }
  }
</style>
</head>
<body>

<div id="stars"></div>
<div class="cloud-layer" id="cloudLayer"></div>
<div class="cloud-layer" id="cloudShadows"></div>

<div class="moon" id="moon"></div>
<div id="message"></div>
<button id="clickBtn">Click Here</button>

<script>
/* STAR GENERATION */
const starsContainer = document.getElementById('stars');
for(let i=0;i<180;i++){
  const s=document.createElement('div');
  s.className='star';
  s.style.top=Math.random()*100 + '%';
  s.style.left=Math.random()*100 + '%';
  s.style.opacity = (0.2 + Math.random()*0.9).toString();
  s.style.transform = `scale(${0.6 + Math.random()*1.4})`;
  starsContainer.appendChild(s);
}

/* CLOUD GENERATION */
function createCloud(type){
  const c=document.createElement('div');
  c.className='cloud ' + type;
  // random vertical placement within upper half for cinematic layering
  c.style.top = (20 + Math.random()*35) + '%';
  c.style.animationDuration = (70 + Math.random()*60) + 's';
  document.getElementById('cloudLayer').appendChild(c);
}

for(let i=0;i<6;i++) createCloud('xl');
for(let i=0;i<4;i++) createCloud('sm');

/* SHADOW CLOUDS */
function createShadow(){
  const c=document.createElement('div');
  c.className='cloud-shadow';
  c.style.top = (30 + Math.random()*40) + '%';
  c.style.animationDuration = (90 + Math.random()*70) + 's';
  document.getElementById('cloudShadows').appendChild(c);
}

for(let i=0;i<5;i++) createShadow();

/* MESSAGE */
function revealMessage(){
  const msg = "On this calm birthday eve so new, God softly whispers, my plans are made for you.";
  const m = document.getElementById('message');
  m.innerHTML='';
  msg.split('').forEach((ch,i)=>{
    const span=document.createElement('span');
    span.textContent = ch===' ' ? '\u00A0' : ch;
    span.className='letter';
    span.style.animationDelay = (i*0.05)+'s';
    m.appendChild(span);
  });
  m.style.opacity=1;
}

/* MOON EASING MOVEMENT */
const moon = document.getElementById('moon');
let moonX = -200;
let t = 0;
const moonStop = window.innerWidth * 0.75;
const clickBtn = document.getElementById('clickBtn'); // FIXED: define button element reference
let revealed = false;

function easeOutCubic(x){ return 1 - Math.pow(1-x,3); }

function animateMoon(){
  if(t < 1){
    t += 0.0035;
    const eased = easeOutCubic(t);
    moonX = -200 + ( (moonStop + 200) * eased );
    moon.style.left = moonX + 'px';

    if(moonX > 60 && !revealed){
      revealed=true;
      revealMessage();
    }

    requestAnimationFrame(animateMoon);
  } else {
    // show button and enable pointer events correctly via JS camelCase
    clickBtn.style.opacity = '1';
    clickBtn.style.pointerEvents = 'auto'; // FIXED: correct JS property
  }
}

animateMoon();

/* Optional: clicking the button can trigger a simple day transition (example) */
clickBtn.addEventListener('click', () => {
  // Simple daytime visual change: fade out stars & lift background
  document.querySelectorAll('.star').forEach(s => s.style.opacity = '0');
  moon.style.opacity = '0';
  // bring clouds forward faster for daytime feel
  document.querySelectorAll('.cloud').forEach(c => c.style.filter = 'blur(8px) brightness(1.05)');
  // hide message
  document.getElementById('message').style.opacity = '0';
  // keep button usable or hide as desired
  clickBtn.style.pointerEvents = 'none';
  clickBtn.style.opacity = '0.6';
});
</script>
</body>
</html>
