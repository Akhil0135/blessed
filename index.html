<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>IMAX — Nolan Cosmic • Steel Star Pulse & Video Letters</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;margin:0;background:#000008;font-family:Inter,system-ui,Segoe UI,Roboto,'Helvetica Neue',Arial;color:#fff;overflow:hidden}

/* --- STAGE --- */
.stage{position:fixed;inset:0;display:grid;place-items:center;overflow:hidden}

/* --- BACKGROUND --- */
.nebula-layer{position:absolute;inset:-40%;mix-blend-mode:screen;filter:blur(200px) saturate(3);animation:nebulaDrift linear infinite;opacity:1}
.nebula1{background:radial-gradient(circle at 20% 40%, rgba(255,90,140,0.9), transparent 40%);animation-duration:120s;}
.nebula2{background:radial-gradient(circle at 80% 60%, rgba(90,150,255,0.8), transparent 45%);animation-duration:150s;}
.nebula3{background:radial-gradient(circle at 50% 50%, rgba(120,220,255,0.7), transparent 50%);animation-duration:180s;}
@keyframes nebulaDrift{0%{transform:translate(0,0) scale(1)}50%{transform:translate(300px,-200px) scale(1.3)}100%{transform:translate(0,0) scale(1)}}

/* --- PARTICLES --- */
.particles{position:absolute;inset:0;z-index:4;pointer-events:none;}
.particle{position:absolute;width:3px;height:3px;background:#fff;opacity:0.5;border-radius:50%;animation:particleDrift linear infinite;}
@keyframes particleDrift{0%{transform:translate(0,0)}100%{transform:translate(var(--x),var(--y))}}

/* --- GALAXY FOG --- */
.galaxy{position:absolute;inset:-20%;z-index:1;mix-blend-mode:screen;
background:radial-gradient(circle, rgba(255,255,255,0.1), transparent 70%),
           radial-gradient(circle, rgba(160,120,255,0.25), transparent 60%),
           radial-gradient(circle, rgba(120,180,255,0.25), transparent 65%);
filter:blur(120px);animation:galaxySpin 180s linear infinite;opacity:0.7}
@keyframes galaxySpin{0%{transform:rotate(0)}100%{transform:rotate(360deg)}}

/* --- SHIELD --- */
.shield-wrap{position:relative;z-index:10;display:grid;place-items:center;width:60vmin;height:60vmin;transform:translateZ(0)}
.shield-svg{width:100%;height:100%;transform-origin:center center;filter:drop-shadow(0 20px 60px rgba(0,0,0,0.7))}
#shield-star{transform-box:fill-box;transform-origin:center center;opacity:1;cursor:pointer;z-index:20;transition:transform 0.3s}

/* --- SONIC WAVES --- */
.wave{position:absolute;width:4vmin;height:4vmin;border:2px solid rgba(255,255,255,0.6);border-radius:50%;pointer-events:none;left:50%;top:50%;transform:translate(-50%,-50%) scale(0);animation:wavePulse 2.2s ease-out forwards;}
@keyframes wavePulse{0%{transform:translate(-50%,-50%) scale(0);opacity:1}50%{transform:translate(-50%,-50%) scale(2);opacity:0.4}100%{transform:translate(-50%,-50%) scale(3);opacity:0}}

/* --- LETTERS WITH VIDEO --- */
.letter{
  position:absolute;
  font-size:7vmin;
  font-weight:900;
  pointer-events:none;
  color:transparent;
  -webkit-background-clip:text;
  background-clip:text;
  -webkit-text-fill-color:transparent;
  text-shadow:0 0 4px #ff4d4d,0 0 6px #003366,0 0 10px rgba(255,255,255,0.3);
  opacity:0;
  transform:translate(-50%,-50%) scale(0.3);
  transition: transform 1s cubic-bezier(0.22,1,0.36,1), opacity 1s ease-out;
}

/* --- STAR PULSE --- */
@keyframes steelStarGlow{
  0%{fill:#b0b0b0;filter:drop-shadow(0 0 12px #fff);}
  30%{fill:#d0d0d0;filter:drop-shadow(0 0 35px #ccc);}
  60%{fill:#909090;filter:drop-shadow(0 0 40px #fff);}
  100%{fill:#b0b0b0;filter:drop-shadow(0 0 12px #fff);}
}

/* VIDEO FOR LETTERS */
#video-letter-bg{display:none;position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:50;}
</style>
</head>
<body>

<video id="video-letter-bg" src="galaxy.mp4" autoplay loop muted playsinline></video>

<div class="stage">
  <div class="nebula-layer nebula1"></div>
  <div class="nebula-layer nebula2"></div>
  <div class="nebula-layer nebula3"></div>
  <div class="particles"></div>
  <div class="galaxy"></div>

  <!-- SHIELD -->
  <div class="shield-wrap">
    <svg class="shield-svg" viewBox="0 0 200 200">
      <defs>
        <radialGradient id="metalRed" cx="50%" cy="50%" r="50%"><stop offset="0%" stop-color="#ff4d4d"/><stop offset="100%" stop-color="#990000"/></radialGradient>
        <radialGradient id="metalWhite" cx="50%" cy="50%" r="50%"><stop offset="0%" stop-color="#ffffff"/><stop offset="100%" stop-color="#cccccc"/></radialGradient>
        <radialGradient id="metalBlue" cx="50%" cy="50%" r="50%"><stop offset="0%" stop-color="#4d90ff"/><stop offset="100%" stop-color="#003366"/></radialGradient>
      </defs>
      <g id="rings" transform="translate(100,100)">
        <circle r="92" fill="url(#metalRed)" />
        <circle r="76" fill="url(#metalWhite)" />
        <circle r="56" fill="url(#metalRed)" />
        <circle r="36" fill="url(#metalBlue)" />
      </g>
      <g id="starGroup" transform="translate(100,100)">
        <polygon id="shield-star" points="0,-28 6,-8 26,-6 10,6 14,26 0,14 -14,26 -10,6 -26,-6 -6,-8"/>
      </g>
    </svg>
  </div>
</div>

<script>
const star=document.getElementById('shield-star');
const stage=document.querySelector('.stage');
const video=document.getElementById('video-letter-bg');
let lettersDone=false;

// Star click
star.addEventListener('click',()=>{
  star.style.transform='scale(1.3) rotate(1080deg)';
  setTimeout(()=>star.style.transform='scale(1) rotate(0deg)',500);
  if(!lettersDone){
    shatterShield();
    spawnWaves();
    steelStarPulse();
    setTimeout(addLetters,900);
    lettersDone=true;
  }
});

// Shield shatter
function shatterShield(){
  const rings=document.getElementById('rings');
  if(!rings) return;
  rings.style.opacity=0;
  setTimeout(()=>{ try{ rings.parentNode.removeChild(rings);}catch(e){} },1000);
}

// Sonic Waves
function spawnWaves(){
  for(let i=0;i<6;i++){
    const wave=document.createElement('div');
    wave.className='wave';
    wave.style.animationDelay=(i*0.2)+'s';
    stage.appendChild(wave);
    setTimeout(()=>wave.remove(),2500);
  }
}

// Star Steel Pulse
function steelStarPulse(){ star.style.animation='steelStarGlow 1.2s ease-in-out 4'; }

// Letters with video
function addLetters(){
  const letters="PRINCE".split('');
  const cx=window.innerWidth/2;
  const cy=window.innerHeight/2;
  video.style.display='block';
  letters.forEach((ch,i)=>{
    const d=document.createElement('div');
    d.className='letter';
    d.textContent=ch;
    d.style.background='url(galaxy.mp4)';
    d.style.backgroundSize='cover';
    document.body.appendChild(d);
    d.style.left=cx+'px';
    d.style.top=cy+'px';
    setTimeout(()=>{
      d.style.opacity=1;
      d.style.transform='translate(-50%,-50%) scale(1)';
      d.style.left=cx+(i-(letters.length-1)/2)*100+'px';
      d.style.top=cy+200+'px';
    },i*200);
  });
}
</script>
</body>
</html>
