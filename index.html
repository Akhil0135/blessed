<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cinematic Reveal</title>

<style>

/* -------- GLOBAL RESET -------- */
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

html,body{
  height:100%;
  width:100%;
  overflow:hidden;
  background:black;
  font-family: 'Poppins', sans-serif;
}


/* -------- CINEMATIC BACKGROUND -------- */
#scene{
  position:absolute;
  inset:0;
  background:radial-gradient(circle at bottom, #000014, #000000);
  overflow:hidden;
}

/* -------- MESSAGE BOX (CINEMATIC STYLIZED) -------- */
#message{
  position:absolute;
  top:50%;
  left:50%;
  transform:translate(-50%, -50%);
  width:80%;
  max-width:750px;
  padding:28px 38px;
  border-radius:22px;

  /* CINEMATIC DARK GLASS GRADIENT */
  background:
    linear-gradient(145deg, #000000cc, #110022cc, #000000cc),
    radial-gradient(circle at top, #5500ff22, transparent 70%);
  
  border:1px solid #ffffff22;
  backdrop-filter:blur(18px);
  -webkit-backdrop-filter:blur(18px);

  /* GLOW */
  box-shadow:
    0 0 40px #000a,
    0 0 90px #5500ff33,
    inset 0 0 25px #ffffff11;

  color:white;
  font-size:28px;
  font-weight:300;
  line-height:1.65;
  text-shadow:0 0 10px #000a;
}

/* -------- CINEMATIC BUTTON -------- */
#clickBtn{
  position:absolute;
  bottom:8%;
  left:50%;
  transform:translateX(-50%);
  padding:12px 28px;
  font-size:22px;
  font-weight:600;
  border:none;
  border-radius:14px;

  /* CINEMATIC GRADIENT */
  background:linear-gradient(135deg, #ff8a00, #ff2f6e, #6a00ff);
  background-size:300% 300%;
  animation:btnGlow 4s ease infinite;

  color:white;
  box-shadow:
    0 0 25px #0008,
    0 0 60px #ff2f6e88,
    inset 0 0 20px #ffffff33;

  cursor:pointer;
  display:none;
  z-index:50;
}

#clickBtn:active{
  transform:translateX(-50%) scale(0.94);
}

@keyframes btnGlow{
  0%{background-position:0% 50%;}
  50%{background-position:100% 50%;}
  100%{background-position:0% 50%;}
}

</style>
</head>


<body>

<div id="scene"></div>

<!-- MESSAGE BOX -->
<div id="message"></div>

<!-- CINEMATIC BUTTON -->
<button id="clickBtn">CLICK HERE</button>

<script>

/* -------- MESSAGE REVEAL LOGIC -------- */

let messageText = "Akhil sir… this is your ultra-cinematic message reveal. Everything has been stylised to perfection just like you wanted.";

let msgBox = document.getElementById("message");
let btn = document.getElementById("clickBtn");

let letters = messageText.split("");
let index = 0;

function revealMessage(){
    if(index < letters.length){
        msgBox.innerHTML += letters[index];
        index++;
        requestAnimationFrame(revealMessage);
    } else {
        // SHOW BUTTON AFTER FULL REVEAL
        btn.style.display = "block";
    }
}

revealMessage();

</script>

</body>
</html>
