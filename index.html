<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Cinematic Night</title>
<style>
    body {
        margin: 0;
        overflow: hidden;
        background: radial-gradient(circle at center, #0a0a14 0%, #000000 70%);
        font-family: 'Times New Roman', serif;
    }

    /* Moon */
    #moon {
        position: absolute;
        top: 60px;
        left: -200px;
        width: 180px;
        filter: drop-shadow(0 0 25px #ffffffaa);
        transition: left 0.1s linear;
    }

    /* Shooting Stars */
    .shooting-star {
        position: absolute;
        width: 2px;
        height: 80px;
        background: linear-gradient(to bottom, white, transparent);
        opacity: 0.8;
        transform: rotate(130deg);
        animation: shoot 2s linear infinite;
    }

    @keyframes shoot {
        0% { opacity:0; transform:translate(0,0) rotate(130deg); }
        10% { opacity:1; }
        100% { transform:translate(-600px,300px) rotate(130deg); opacity:0; }
    }

    /* Text Reveal */
    #message {
        position: absolute;
        bottom: 120px;
        width: 100%;
        text-align: center;
        font-size: 32px;
        color: #ffffff;
        letter-spacing: 1px;
        opacity: 0;
    }

    /* Click Button */
    #clickBtn {
        position: absolute;
        bottom: 40px;
        left: 50%;
        transform: translateX(-50%);
        padding: 14px 28px;
        font-size: 20px;
        border-radius: 40px;
        border: none;
        background: rgba(255,255,255,0.15);
        color: white;
        backdrop-filter: blur(6px);
        cursor: pointer;
        box-shadow: 0 0 12px #ffffff55;
        opacity: 0;
        transition: opacity 1.5s ease;
    }
</style>
</head>
<body>

<img id="moon" src="moon.png" />
<div id="message"></div>
<button id="clickBtn">Click Here</button>

<script>
// Shooting Stars
for (let i = 0; i < 12; i++) {
    let star = document.createElement('div');
    star.classList.add('shooting-star');
    star.style.top = Math.random() * 300 + 'px';
    star.style.left = Math.random() * window.innerWidth + 'px';
    star.style.animationDelay = Math.random() * 3 + 's';
    document.body.appendChild(star);
}

// Moon Movement + Message Reveal
const moon = document.getElementById('moon');
const msg = document.getElementById('message');
const button = document.getElementById('clickBtn');

const text = "On this calm birthday eve so new, God softly whispers, 'My plans are made for you.'";
let i = 0;
let moonX = -200;
const stopX = window.innerWidth - 320;

function animate() {
    if (moonX < stopX) {
        moonX += 1.2;
        moon.style.left = moonX + 'px';

        if (i < text.length) {
            msg.style.opacity = 1;
            msg.innerHTML += text.charAt(i);
            i++;
        }

        requestAnimationFrame(animate);
    } else {
        // Show button
        button.style.opacity = 1;
    }
}

animate();
</script>

</body>
</html>
