<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Cinematic PRINCE — Camera Orbit After Reveal</title>

<style>
    body,html{
        margin:0;
        padding:0;
        overflow:hidden;
        background:#000;
    }
    #overlayText{
        position:absolute;
        top:50%;
        left:50%;
        transform:translate(-50%,-50%);
        font-size:90px;
        font-family:'Cinzel',serif;
        font-weight:900;
        letter-spacing:20px;
        text-transform:uppercase;
        background:linear-gradient(90deg,#1cc2ff,#9d4dff,#ff2dfb);
        -webkit-background-clip:text;
        color:transparent;
        opacity:0;
        transition:1.5s ease;
        filter:drop-shadow(0 0 20px #00aaff);
    }
</style>
</head>

<body>

<div id="overlayText">PRINCE</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r150/three.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>

<script>
// ---------------------- SCENE SETUP ---------------------- //
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(65, window.innerWidth/window.innerHeight, 0.1, 2000);
camera.position.set(0, 0, 14);

const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(window.devicePixelRatio);
document.body.appendChild(renderer.domElement);

// ---------------------- GALACTIC BACKDROP ---------------------- //
const starGeo = new THREE.BufferGeometry();
const starCount = 1500;
const starPositions = [];

for(let i=0;i<starCount;i++){
    starPositions.push(
        (Math.random()-0.5)*400,
        (Math.random()-0.5)*400,
        (Math.random()-0.5)*400
    );
}

starGeo.setAttribute('position', new THREE.Float32BufferAttribute(starPositions, 3));

const starMat = new THREE.PointsMaterial({
    color: 0xffffff,
    size: 0.9,
    transparent: true
});

const stars = new THREE.Points(starGeo, starMat);
scene.add(stars);

// ---------------------- SPHERE (MOON-LIKE) ---------------------- //
const sphereGeo = new THREE.SphereGeometry(3.8, 64, 64);
const sphereMat = new THREE.MeshStandardMaterial({
    color: 0x888cff,
    roughness:0.7,
    metalness:0.3
});
const sphere = new THREE.Mesh(sphereGeo, sphereMat);
sphere.position.set(0,0,-4);
scene.add(sphere);

// ---------------------- LIGHTS ---------------------- //
const mainLight = new THREE.PointLight(0xffffff, 3);
mainLight.position.set(10,10,10);
scene.add(mainLight);

scene.add(new THREE.AmbientLight(0x334488, 0.6));

// ---------------------- CAMERA ORBIT CONTROL (DISABLED) ---------------------- //
let orbitEnabled = false; 
let angle = 0;

// ---------------------- PRINCE REVEAL ---------------------- //

function showPrince(){
    const txt = document.getElementById("overlayText");
    txt.style.opacity = 1;

    // Start camera orbit 2 seconds after reveal
    setTimeout(()=>{ orbitEnabled = true; }, 2000);
}

// Delay before PRINCE appears
setTimeout(showPrince, 3000);

// ---------------------- ANIMATION LOOP ---------------------- //
function animate(){
    requestAnimationFrame(animate);

    stars.rotation.y += 0.0006;
    sphere.rotation.y += 0.003;

    if(orbitEnabled){
        angle += 0.005;
        camera.position.x = Math.sin(angle)*14;
        camera.position.z = Math.cos(angle)*14;
        camera.lookAt(0,0,0);
    }

    renderer.render(scene,camera);
}
animate();

// ---------------------- RESIZE ---------------------- //
window.addEventListener("resize",()=>{
    camera.aspect = window.innerWidth/window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
});
</script>

</body>
</html>
