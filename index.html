<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Phase 4 — HAPPY BIRTHDAY PRINCE</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  body { margin:0; overflow:hidden; background:#000; }
  canvas { display:block; }
</style>
</head>
<body>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/examples/js/loaders/FontLoader.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/examples/js/geometries/TextGeometry.js"></script>

<script>
let scene = new THREE.Scene();
let camera = new THREE.PerspectiveCamera(60, window.innerWidth/window.innerHeight, 0.1, 2000);
camera.position.set(0, 60, 230);

let renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(window.devicePixelRatio);
document.body.appendChild(renderer.domElement);

// ------- Galaxy Background -------
let starGeo = new THREE.BufferGeometry();
let starCount = 1200;
let starPositions = new Float32Array(starCount * 3);
for (let i = 0; i < starCount * 3; i++) {
    starPositions[i] = (Math.random() - 0.5) * 2500;
}
starGeo.setAttribute('position', new THREE.BufferAttribute(starPositions, 3));
let starMat = new THREE.PointsMaterial({ color: 0xffffff, size: 2 });
let stars = new THREE.Points(starGeo, starMat);
scene.add(stars);

// ------- Lights -------
scene.add(new THREE.AmbientLight(0xffffff, 0.4));

let pointLight = new THREE.PointLight(0xffddaa, 2, 2000);
pointLight.position.set(80, 120, 80);
scene.add(pointLight);

// ------- Text -------
let textMesh = null;
let bigOneMesh = null;

const loader = new THREE.FontLoader();
loader.load("https://threejs.org/examples/fonts/helvetiker_regular.typeface.json", (font) => {

    // ---- Main HAPPY BIRTHDAY PRINCE ----
    const textGeo = new THREE.TextGeometry("HAPPY BIRTHDAY PRINCE", {
        font: font,
        size: 20,
        height: 4,
        curveSegments: 12,
        bevelEnabled: true,
        bevelThickness: 2,
        bevelSize: 1,
        bevelSegments: 5
    });

    textGeo.center();

    const textMat = new THREE.MeshStandardMaterial({
        color: 0xffe066,
        emissive: 0xffbb33,
        metalness: 0.7,
        roughness: 0.25
    });

    textMesh = new THREE.Mesh(textGeo, textMat);
    scene.add(textMesh);

    // ---- BIG "1" BEHIND EVERYTHING ----
    const oneGeo = new THREE.TextGeometry("1", {
        font: font,
        size: 120,        // VERY BIG
        height: 10,
        curveSegments: 12,
        bevelEnabled: true,
        bevelThickness: 3,
        bevelSize: 2,
        bevelSegments: 5
    });

    oneGeo.center();

    const oneMat = new THREE.MeshStandardMaterial({
        color: 0x4488ff,
        emissive: 0x224499,
        metalness: 0.6,
        roughness: 0.3
    });

    bigOneMesh = new THREE.Mesh(oneGeo, oneMat);
    bigOneMesh.position.z = -200;  // Push far behind
    bigOneMesh.position.y = -10;
    scene.add(bigOneMesh);
});

// -------- Camera ORBITING the scene --------
let angle = 0;

function animate() {
    requestAnimationFrame(animate);

    // galaxy subtle motion
    stars.rotation.y += 0.0004;
    stars.rotation.x += 0.0001;

    if (textMesh) {
        angle += 0.0018;

        // camera rotates around the whole scene
        camera.position.x = Math.sin(angle) * 250;
        camera.position.z = Math.cos(angle) * 250;

        camera.lookAt(0, 20, 0);
    }

    renderer.render(scene, camera);
}

animate();

// -------- Responsive --------
window.addEventListener("resize", () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
});
</script>

</body>
</html>
