<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cinematic Night Sky</title>
<style>
  body, html {
    margin: 0;
    padding: 0;
    overflow: hidden;
    width: 100%;
    height: 100%;
    background: #03040a;
    font-family: 'Cinzel', serif;
  }

  /* Stars */
  .star {
    position: absolute;
    width: 2px;
    height: 2px;
    background: white;
    border-radius: 50%;
    opacity: 0.55;
    box-shadow: 0 0 4px rgba(255,255,255,0.7);
    animation: twinkle 3s infinite ease-in-out;
  }
  @keyframes twinkle {
    0% { opacity: 0.2; }
    50% { opacity: 0.9; }
    100% { opacity: 0.3; }
  }

  /* Aurora */
  .aurora {
    position: absolute;
    top: 0;
    width: 100%;
    height: 45vh;
    background: radial-gradient(circle at 50% 20%, rgba(0,255,200,0.25), transparent),
                radial-gradient(circle at 30% 10%, rgba(0,150,255,0.22), transparent),
                radial-gradient(circle at 70% 5%, rgba(150,80,255,0.25), transparent);
    filter: blur(32px);
    animation: auroraMove 22s ease-in-out infinite alternate;
  }
  @keyframes auroraMove {
    0% { transform: translateY(0px) scale(1); }
    100% { transform: translateY(-35px) scale(1.1); }
  }

  /* Clouds */
  .cloud {
    position: absolute;
    width: 300px;
    height: 120px;
    background: rgba(255,255,255,0.07);
    border-radius: 50%;
    filter: blur(28px);
    animation: moveCloud linear infinite;
  }
  @keyframes moveCloud {
    0% { left: -350px; }
    100% { left: 110%; }
  }

  /* Moon */
  .moon {
    position: absolute;
    width: 150px;
    height: 150px;
    background: radial-gradient(circle, #fffde6 0%, #f3e4b0 60%, #d9c180 100%);
    border-radius: 50%;
    top: 110px;
    left: -160px;
    box-shadow: 0 0 22px 5px rgba(255,255,200,0.35);
    animation: moonMove 55s linear forwards;
  }
  @keyframes moonMove {
    0% { left: -150px; }
    100% { left: calc(100% - 210px); }
  }

  /* Shooting Stars */
  .shooting-star {
    position: absolute;
    width: 8px;
    height: 3px;
    background: linear-gradient(0deg, rgba(255,255,255,0), white);
    border-radius: 50%;
    opacity: 0;
    transform-origin: top left;
    animation: shoot linear forwards;
  }
  @keyframes shoot {
    0% { transform: translate(0,0) rotate(-45deg); opacity: 1; }
    100% { transform: translate(-75vw,75vh) rotate(-45deg); opacity: 0; }
  }

  /* Message */
  #message {
    position: absolute;
    top: 63%;
    width: 100%;
    text-align: center;
    font-size: 30px;
    color: #f9e9c9;
    opacity: 0;
    letter-spacing: 2px;
  }
  .letter {
    opacity: 0;
    display: inline-block;
    animation: revealLetter 0.55s forwards;
  }
  @keyframes revealLetter {
    0% { opacity: 0; filter: blur(6px); transform: translateY(6px); }
    100% { opacity: 1; filter: blur(0); transform: translateY(0); }
  }

  /* Button */
  #clickBtn {
    position: absolute;
    bottom: 50px;
    left: 50%;
    transform: translateX(-50%);
    padding: 14px 32px;
    font-size: 22px;
    border-radius: 40px;
    border: none;
    background: rgba(255,255,255,0.2);
    color: white;
    backdrop-filter: blur(6px);
    box-shadow: 0 0 12px rgba(255,255,255,0.3);
    cursor: pointer;
    opacity: 0;
    transition: 1.2s ease;
  }
</style>
</head>
<body>

<div class="aurora"></div>
<div class="moon"></div>
<div id="message"></div>
<button id="clickBtn">Click Here</button>

<script>
  /* Stars */
  for(let i=0;i<140;i++){
    const s=document.createElement('div');
    s.classList.add('star');
    s.style.top=Math.random()*window.innerHeight+'px';
    s.style.left=Math.random()*window.innerWidth+'px';
    document.body.appendChild(s);
  }

  /* Clouds */
  for(let i=0;i<6;i++){
    const c=document.createElement('div');
    c.classList.add('cloud');
    c.style.top=(60 + Math.random()*260)+'px';
    c.style.animationDuration=(38 + Math.random()*42)+'s';
    document.body.appendChild(c);
  }

  /* Shooting Stars */
  function shooting(){
    const st=document.createElement('div');
    st.classList.add('shooting-star');
    st.style.top=Math.random()*200+'px';
    st.style.left=window.innerWidth+'px';
    const d=2 + Math.random()*1.4;
    st.style.animationDuration=d+'s';
    document.body.appendChild(st);
    setTimeout(()=>st.remove(), d*1000);
  }
  setInterval(shooting, 1100);

  /* Message */
  const text = "On this calm birthday eve so new, God softly whispers, my plans are made for you.";
  const msgDiv = document.getElementById("message");

  function reveal(){
    text.split("").forEach((ch,i)=>{
      const sp=document.createElement('span');
      sp.classList.add('letter');
      sp.textContent = ch === ' ' ? '\u00A0' : ch;
      sp.style.animationDelay = (0.09 * i)+'s';
      msgDiv.appendChild(sp);
    });
    msgDiv.style.opacity = 1;
  }

  /* Moon trigger */
  const moon=document.querySelector('.moon');
  const btn=document.getElementById('clickBtn');

  const interval=setInterval(()=>{
    const r=moon.getBoundingClientRect();
    if(r.left > window.innerWidth*0.60){
      reveal();
      btn.style.opacity=1;
      clearInterval(interval);
    }
  }, 180);
</script>

</body>
</html>
