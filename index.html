<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>IMAX Cosmic — Moon → Sun (Final Best Version)</title>

<style>
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{height:100%;overflow:hidden;background:#000;}

  body{
    background:#000;
    transition:background 3s ease-in-out;
    position:relative;
    font-family:Inter,system-ui;
  }

  /* --- Background Cosmic Gradient (IMAX) --- */
  body.sunrise{
    background: radial-gradient(circle at center,
      #00122b 0%,
      #000a18 40%,
      #000008 100%
    );
  }

  /* ----- Stars ----- */
  .star{
    position:absolute;
    width:2px;
    height:2px;
    background:white;
    border-radius:50%;
    animation:twinkle 2.5s infinite ease-in-out;
    opacity:0.8;
  }

  @keyframes twinkle{
    0%{opacity:0.2;transform:scale(1);}
    50%{opacity:1;transform:scale(1.8);}
    100%{opacity:0.2;transform:scale(1);}
  }

  body.sunrise .star{
    transition:opacity 2s ease-out;
    opacity:0;
  }

  /* --- Moon --- */
  #moon{
    position:absolute;
    top:30%;
    left:50%;
    transform:translate(-50%,-50%);
    width:180px;
    height:180px;
    border-radius:50%;
    background: radial-gradient(circle at 30% 30%, #fff, #888, #444);
    box-shadow:0 0 50px #fff5;
    transition:opacity 3s ease-out, transform 3s ease-out;
  }

  body.sunrise #moon{
    opacity:0;
    transform:translate(-50%,-50%) scale(0.7);
  }

  /* --- Sun --- */
  #sun{
    position:absolute;
    top:-120px;
    right:-120px;
    width:260px;
    height:260px;
    background: radial-gradient(circle, #ffdd88, #ffbb33, #cc8211);
    border-radius:50%;
    box-shadow:0 0 60px #ffdd66aa;
    opacity:0;
    transition:opacity 3s ease-out, transform 3.5s ease-out;
    transform:translate(40px,40px) scale(0.7);
  }

  body.sunrise #sun{
    opacity:1;
    transform:translate(0,0) scale(1);
  }

  /* --- Message Text (Gold) --- */
  #msg{
    position:absolute;
    bottom:40px;
    width:100%;
    text-align:center;
    font-size:32px;
    font-weight:700;
    letter-spacing:4px;
    opacity:0;
    transition:opacity 2.5s ease-out;
    color:#d1a646;
    text-shadow:0 0 15px #000, 0 0 30px #000;
  }

  body.sunrise #msg{
    opacity:1;
  }

</style>
</head>

<body>

<div id="moon"></div>
<div id="sun"></div>

<!-- BEST gold message -->
<div id="msg">HIS DIVINE LIGHT WILL ALWAYS GUIDE YOUR PATH</div>

<script>
/* ---- Create BEST (Medium) IMAX Stars ---- */
function createStars(count){
  for(let i=0;i<count;i++){
    let s=document.createElement("div");
    s.className="star";
    s.style.left=Math.random()*100+"vw";
    s.style.top=Math.random()*100+"vh";
    s.style.animationDuration=(1.5+Math.random()*2)+"s";
    document.body.appendChild(s);
  }
}
createStars(130); // BEST DENSITY

/* --- Trigger Sunrise (No Day Sky) --- */
setTimeout(()=>{
  document.body.classList.add("sunrise");
},2000);
</script>

</body>
</html>
