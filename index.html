<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Phase 1 — IMAX Nolan Style</title>
<style>
  html, body {
    margin:0;
    padding:0;
    overflow:hidden;
    height:100%;
    background:#000;
    font-family:"Cinzel", serif;
  }

  #scene {
    position: relative;
    width: 100%;
    height: 100%;
    transform-origin: center center;
    touch-action: none;
  }

  canvas#stars {
    position:absolute;
    inset:0;
    display:block;
    z-index:1;
  }

  #moon, #sun {
    position:absolute;
    border-radius:50%;
    z-index:10;
    transform: translate(-50%,-50%);
    pointer-events:auto;
    box-shadow: 0 0 50px rgba(255,220,180,0.15);
    transition: opacity 1.8s ease, transform 1.6s ease, top 2.4s ease, left 2.4s ease, right 2.4s ease;
  }

  #moon {
    width: 160px; height: 160px;
    left: 72px; top: 72px;
    background: radial-gradient(circle at 30% 28%, #fffaf0 0%, #f0f0f0 20%, #cfcfcf 55%, #8f8f8f 100%);
    cursor: grab;
  }

  #sun {
    width: 260px; height: 260px;
    top: -260px; right: -260px;
    background: radial-gradient(circle at 40% 40%, #fff6d0 0%, #ffd36f 30%, #ff9b2b 65%, rgba(255,120,35,0.85) 80%);
    opacity:0;
  }

  #message {
    position:absolute;
    bottom:10vh;
    left:50%;
    transform:translateX(-50%);
    white-space:nowrap;
    font-size:20px;
    letter-spacing:3px;
    font-weight:600;
    color:#ffdca8; /* Soft golden */
    text-shadow: 0 0 18px rgba(255,200,140,0.12);
    opacity:0;
    z-index:20;
    transition:opacity 0.2s linear;
  }

  @media (min-width:1600px){
    #message { font-size:22px; letter-spacing:4px; }
    #moon { width:190px; height:190px; }
    #sun { width:320px; height:320px; }
  }
</style>
</head>
<body>
<div id="scene">
  <canvas id="stars"></canvas>
  <div id="moon"></div>
  <div id="sun"></div>
  <div id="message"></div>
</div>

<script>
const canvas = document.getElementById('stars');
const ctx = canvas.getContext('2d');
const moon = document.getElementById('moon');
const sun  = document.getElementById('sun');
const message = document.getElementById('message');
const scene = document.getElementById('scene');

let W = window.innerWidth, H = window.innerHeight;
function resize(){ W=innerWidth; H=innerHeight; canvas.width=W; canvas.height=H; }
resize(); window.addEventListener('resize', resize);

/* ---------------- Stars 3D with twinkle ---------------- */
function makeStars(count, depthScale){
  const a=[];
  for(let i=0;i<count;i++){
    a.push({
      x: Math.random()*W,
      y: Math.random()*H,
      size: (Math.random()*1.6+0.3)*depthScale,
      tw: Math.random()*0.02+0.003,
      depth: depthScale,
      baseAlpha: 0.5+Math.random()*0.6
    });
  }
  return a;
}
let farStars  = makeStars(220,0.7);
let midStars  = makeStars(140,1.0);
let nearStars = makeStars(70,1.5);

let starFade=1;

function drawStars(now){
  ctx.clearRect(0,0,W,H);
  const time=now*0.001;
  [farStars,midStars,nearStars].forEach(list=>{
    list.forEach(s=>{
      const glow=(Math.sin(time*(s.tw*60))+1)*0.5;
      const alpha=Math.max(0, glow*s.baseAlpha*starFade);
      ctx.beginPath();
      ctx.fillStyle=`rgba(255,255,255,${alpha})`;
      ctx.arc(s.x,s.y,s.size,0,Math.PI*2);
      ctx.fill();
    });
  });
}

/* ---------------- Slow cinematic zoom ---------------- */
let zoom=1;
function stepZoom(){ zoom+=(1.005-zoom)*0.00065; scene.style.transform=`scale(${zoom})`; requestAnimationFrame(stepZoom); }
requestAnimationFrame(stepZoom);

/* ---------------- Drag logic ---------------- */
let dragging=false, pointerId=null, startX=null, progress=0;
const fullText="ON THIS CALM BIRTHDAY EVE SO NEW, GOD SOFTLY WHISPERS, MY PLANS ARE MADE FOR YOU.";
message.textContent="";

moon.style.left=`72px`;
moon.style.top=`72px`;

function clamp(v,a,b){ return Math.max(a,Math.min(b,v)); }
function computeProgress(cx){ return clamp((cx-0.06*W)/(0.78*W-0.06*W),0,1); }

moon.addEventListener('pointerdown',ev=>{
  ev.preventDefault(); dragging=true; pointerId=ev.pointerId;
  moon.setPointerCapture(pointerId);
  startX=ev.clientX-moon.offsetLeft;
  moon.style.cursor='grabbing';
});
moon.addEventListener('pointerup',ev=>{ if(ev.pointerId!==pointerId)return; dragging=false; try{moon.releasePointerCapture(pointerId);}catch{} moon.style.cursor='grab'; });
moon.addEventListener('pointercancel',()=>{dragging=false; moon.style.cursor='grab';});
moon.addEventListener('pointermove',ev=>{
  if(!dragging||ev.pointerId!==pointerId) return;
  let left=clamp(ev.clientX-startX,8,W-8-moon.offsetWidth);
  let top=clamp(ev.clientY-moon.offsetHeight/2,8,H-8-moon.offsetHeight);
  moon.style.left=`${left}px`; moon.style.top=`${top}px`;

  const cx=left+moon.offsetWidth/2;
  progress=computeProgress(cx);

  starFade=1-progress;
  const letters=Math.floor(fullText.length*progress);
  if(letters>0){ message.style.opacity=1; message.textContent=fullText.slice(0,letters); } 
  else { message.style.opacity=0; message.textContent=""; }

  if(progress>=1) completeSequence();
});

window.addEventListener('pointerup',()=>{ dragging=false; moon.style.cursor='grab'; });

let completed=false;
function completeSequence(){
  if(completed) return;
  completed=true;
  starFade=0;
  message.style.opacity=1;
  message.textContent=fullText;

  moon.style.transition='opacity 1.8s ease, transform 1.8s ease';
  moon.style.opacity=0;
  moon.style.transform='translate(-50%,-50%) scale(1.08)';

  setTimeout(()=>{
    sun.style.transition='opacity 2.4s ease, top 2.4s cubic-bezier(.2,.9,.2,1), right 2.4s cubic-bezier(.2,.9,.2,1)';
    sun.style.opacity=1;
    sun.style.top=`${0.08*H}px`;
    sun.style.right=`${0.06*W}px`;
    sun.style.transform='translate(-50%,-50%) scale(1.03)';
  },600);
}

/* ---------------- Animation loop ---------------- */
function loop(t){ drawStars(t); requestAnimationFrame(loop); }
requestAnimationFrame(loop);
</script>
</body>
</html>
