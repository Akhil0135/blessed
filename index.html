<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>IMAX — Shield → Star → PRINCE</title>

<style>
/* ---------------- BASE ---------------- */
*{margin:0;padding:0;box-sizing:border-box}
html,body{
  height:100%;
  background:#000006;
  overflow:hidden;
  font-family:Inter,system-ui;
  -webkit-font-smoothing:antialiased;
}

.scene{
  width:100%;
  height:100%;
  position:relative;
}

/* ---------------- SHIELD ---------------- */
.shield{
  position:absolute;
  left:50%;
  top:50%;
  transform:translate(-50%,-50%) scale(0.4);
  width:260px;
  height:260px;
  border-radius:50%;
  background: conic-gradient(
    #000 0deg 30deg,
    #111 30deg 60deg,
    #222 60deg 90deg,
    #444 90deg 120deg,
    #555 120deg 150deg,
    #666 150deg 180deg,
    #555 180deg 210deg,
    #444 210deg 240deg,
    #222 240deg 270deg,
    #111 270deg 300deg,
    #000 300deg 360deg
  );
  box-shadow:0 0 50px #0af inset,0 0 30px #09f;
  opacity:0;
  animation:
    shieldIn 2.5s ease-out forwards,
    shieldSpin 5s linear infinite 2.5s;
}

@keyframes shieldIn{
  0%{transform:translate(-50%,-50%) scale(0.1);opacity:0}
  60%{opacity:1}
  100%{transform:translate(-50%,-50%) scale(1);opacity:1}
}
@keyframes shieldSpin{
  from{transform:translate(-50%,-50%) scale(1) rotate(0deg)}
  to{transform:translate(-50%,-50%) scale(1) rotate(360deg)}
}

/* ---------------- STAR ---------------- */
.star{
  position:absolute;
  left:50%;
  top:50%;
  transform:translate(-50%,-50%) scale(0.2);
  width:0;height:0;
  opacity:0;
  filter:drop-shadow(0 0 20px #08f);
  transition:filter .4s ease;
}
.star.show{
  opacity:1;
  width:160px;
  height:160px;
  transform:translate(-50%,-50%) scale(1);
}

.star svg{width:100%;height:100%}

/* ---------------- LETTERS ---------------- */
.letters{
  position:absolute;
  left:50%;
  top:72%;
  transform:translateX(-50%);
  display:flex;
  gap:12px;
}

.letter{
  font-size:58px;
  opacity:0;
  transform:translateY(40px) scale(0.8);
  filter:drop-shadow(0 0 10px #59f);
  transition:opacity .55s ease, transform .55s ease;
  color:#d9e4ff;
}
.letter.show{
  opacity:1;
  transform:translateY(0) scale(1);
}

/* ---------------- SPARKS ---------------- */
.spark{
  position:absolute;
  width:3px;
  height:3px;
  background:#aef;
  border-radius:50%;
  opacity:0;
  transition:opacity .6s ease;
}
</style>
</head>

<body>
<div class="scene">

  <!-- SHIELD -->
  <div class="shield" id="shield"></div>

  <!-- STAR -->
  <div class="star" id="star">
    <svg viewBox="0 0 100 100" fill="#d9e4ff">
      <polygon points="50,5 61,38 95,38 67,58 78,92 50,72 22,92 33,58 5,38 39,38"/>
    </svg>
  </div>

  <!-- LETTERS -->
  <div class="letters" id="letters"></div>

</div>

<script>
/* ELEMENTS */
const shield=document.getElementById("shield");
const star=document.getElementById("star");
const lettersLayer=document.getElementById("letters");

/* ---------------------------------------------------
   MAIN SEQUENCE
---------------------------------------------------*/

/* 1) STAR REVEAL AFTER SHIELD FINISHES */
setTimeout(()=>{
  shield.style.opacity=0;
  star.classList.add("show");

  steelPulse();
  spawnSparks(20);

  setTimeout(()=>revealLettersFromStar(), 900);

}, 2700);


/* ---------------- SPARKS ---------------- */
function spawnSparks(count=10){
  for(let i=0;i<count;i++){
    const s=document.createElement('div');
    s.className='spark';

    const angle=Math.random()*Math.PI*2;
    const dist=20+Math.random()*60;
    const x=50+Math.cos(angle)*dist;
    const y=50+Math.sin(angle)*dist;

    s.style.left=x+'vw';
    s.style.top=y+'vh';
    s.style.opacity=1;

    document.body.appendChild(s);

    setTimeout(()=>{s.style.opacity=0;}, 60+Math.random()*200);
    setTimeout(()=>{s.remove();}, 900);
  }
}

/* ---------------- STAR GLOW PULSE ---------------- */
function steelPulse(){
  star.style.filter='drop-shadow(0 0 20px rgba(150,170,255,0.4))';
  setTimeout(()=>star.style.filter='', 380);
}

/* ---------------- REVEAL PRINCE ---------------- */
function revealLettersFromStar(){
  const text="PRINCE";
  lettersLayer.innerHTML="";

  [...text].forEach((ch,idx)=>{
    const span=document.createElement('div');
    span.className='letter';
    span.textContent=ch;
    lettersLayer.appendChild(span);

    setTimeout(()=>{span.classList.add('show');}, 200 + idx*180);
  });
}
</script>
</body>
</html>
