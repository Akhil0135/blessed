<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IMAX Nolan Cinematic Scene</title>
<style>
html, body { margin:0; padding:0; width:100%; height:100%; background:#010108; overflow:hidden; font-family:'Cinzel', serif; }
#scene { position:relative; width:100%; height:100%; }
#gb { position:absolute; top:2%; width:100%; text-align:center; font-size:3rem; color:#fff; text-shadow:0 0 20px #fff; z-index:10; }
#moon { position:absolute; top:10%; left:5%; width:150px; height:150px; border-radius:50%; background:radial-gradient(circle,#f7f7ff,#d5d2f4,#8c86c5); box-shadow:0 0 70px #C7C3FF; cursor:grab; z-index:9; }
#sun { position:absolute; top:10%; right:5%; width:150px; height:150px; border-radius:50%; background:radial-gradient(circle,#FFE8A0,#FF8C00,#B45A00); box-shadow:0 0 200px rgba(255,165,90,0.85); transform:scale(0); opacity:0; z-index:8; }
#message { position:absolute; bottom:20%; width:100%; text-align:center; font-size:1.6rem; color:#fff; letter-spacing:2px; opacity:0; z-index:11; }
.star { position:absolute; width:2px; height:2px; background:white; border-radius:50%; animation:twinkle 2s infinite alternate; }
@keyframes twinkle { from{opacity:0.2;} to{opacity:1;} }
</style>
</head>
<body>
<div id="scene">
  <div id="gb">God Bless You</div>
  <div id="moon"></div>
  <div id="sun"></div>
  <div id="message">On this calm birthday eve so new, God softly whispers, my plans are made for you.</div>
</div>
<script>
const moon = document.getElementById('moon');
const sun = document.getElementById('sun');
const message = document.getElementById('message');
const scene = document.getElementById('scene');

// Generate stars
for(let i=0;i<150;i++){
  const star = document.createElement('div');
  star.className='star';
  star.style.top=Math.random()*100+'%';
  star.style.left=Math.random()*100+'%';
  star.style.animationDuration=1+Math.random()*3+'s';
  scene.appendChild(star);
}

// Drag logic
let dragging = false;
let offsetX = 0;
let fullText = message.innerText;
message.innerText = '';
moon.addEventListener('mousedown',(e)=>{ dragging=true; offsetX=e.clientX - moon.offsetLeft; });
window.addEventListener('mouseup',()=>{ dragging=false; });
window.addEventListener('mousemove',(e)=>{
  if(!dragging) return;
  let dx = e.clientX - offsetX;
  if(dx<0) dx=0; if(dx>300) dx=300;
  moon.style.left = 5 + dx/scene.offsetWidth*90 + '%';
  // Letter-by-letter reveal
  let progress = dx/300;
  let charCount = Math.floor(fullText.length*progress);
  message.innerText = fullText.substring(0,charCount);
  message.style.opacity = progress;
  // Sun evolution
  sun.style.transform = 'scale('+progress*6+')';
  sun.style.opacity = progress;
});
</script>
</body>
</html>
