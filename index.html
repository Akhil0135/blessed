<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>IMAX PRINCE — Ultra Cinematic Electric Version</title>
<style>
    html, body { margin: 0; padding: 0; overflow: hidden; background: #000; }
    canvas { display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
const canvas = document.getElementById("c");
const ctx = canvas.getContext("2d");
function resize(){ canvas.width = innerWidth; canvas.height = innerHeight; mapText(); }
resize(); onresize = resize;

// ------------ STAR-SHAPED TWINKLING BACKGROUND -------------
function starPositions(count){
    const pos = [];
    const cx = canvas.width/2;
    const cy = canvas.height/2;
    const spikes = 5;
    const outerR = Math.min(canvas.width, canvas.height) * 0.48;
    const innerR = outerR * 0.45;

    for(let i=0;i<count;i++){
        let t = Math.random()*Math.PI*2;
        let r = Math.random() < 0.5 ? outerR : innerR;
        pos.push({
            x: cx + Math.cos(t)*r,
            y: cy + Math.sin(t)*r,
            size: Math.random()*1.3+0.4,
            tw: Math.random()*0.012+0.004
        });
    }
    return pos;
}

let stars = starPositions(300);
function drawStars(){
    stars.forEach(s=>{
        let glow = (Math.sin(Date.now()*s.tw)+1)*0.5*0.9;
        ctx.fillStyle = `rgba(255,255,255,${glow})`;
        ctx.beginPath(); ctx.arc(s.x,s.y,s.size,0,Math.PI*2); ctx.fill();
    });
}

// ------------ MAP PRINCE TEXT -------------
const text = "PRINCE";
const tCanvas = document.createElement("canvas");
const tCtx = tCanvas.getContext("2d");
let points = [];
function mapText(){
    tCanvas.width = canvas.width;
    tCanvas.height = canvas.height;

    let fontSize = canvas.width/5.3;
    tCtx.clearRect(0,0,tCanvas.width,tCanvas.height);
    tCtx.fillStyle = "white";
    tCtx.font = `900 ${fontSize}px Arial Black`;
    tCtx.textAlign = "center";
    tCtx.textBaseline = "middle";
    tCtx.fillText(text, tCanvas.width/2, tCanvas.height/2);

    let data = tCtx.getImageData(0,0,tCanvas.width,tCanvas.height).data;
    points = [];

    for(let y=0;y<tCanvas.height;y+=5){
        for(let x=0;x<tCanvas.width;x+=5){
            let i = (y*tCanvas.width+x)*4;
            if(data[i+3] > 200) points.push({x,y});
        }
    }
    resetParticles();
}

// ------------ PARTICLES FOR PRINCE ------------
let particles = [];
function resetParticles(){
    particles = points.map(p=>({
        x: Math.random()*canvas.width,
        y: Math.random()*canvas.height,
        tx: p.x,
        ty: p.y,
        vx: (Math.random()-0.5)*6, // initial burst
        vy: (Math.random()-0.5)*6,
        size: Math.random()*2.5+1.8,
        speed: Math.random()*0.07+0.05,
        hue: Math.random()*360,
        spark: Math.random()*1
    }));
}
mapText();

// ------------ ELECTRIC SPARKLE + GRADIENT SHIFT ------------
function electricHue(base){ return (base + Math.sin(Date.now()*0.002)*120) % 360; }

// ------------ 3D CAMERA MOVEMENT ------------
let cam = { rot: 0, zoom: 1, tilt: 0 };
function applyCamera(){
    cam.rot += 0.00025;
    cam.zoom = 1 + Math.sin(Date.now()*0.0004)*0.03;
    cam.tilt = Math.sin(Date.now()*0.0003)*0.02;

    ctx.save();
    ctx.translate(canvas.width/2, canvas.height/2);
    ctx.rotate(cam.rot);
    ctx.transform(1, cam.tilt, cam.tilt, 1, 0, 0);
    ctx.scale(cam.zoom, cam.zoom);
    ctx.translate(-canvas.width/2, -canvas.height/2);
}

// ------------ BURST DELAY ------------
let forming = false;
setTimeout(()=> forming=true, 1800);

// ------------ ANIMATION LOOP ------------
function animate(){
    ctx.clearRect(0,0,canvas.width,canvas.height);

    applyCamera();
    drawStars();

    particles.forEach(p=>{
        if(forming){ // move toward letters
            p.vx += (p.tx - p.x) * p.speed * 0.08;
            p.vy += (p.ty - p.y) * p.speed * 0.08;
        }

        p.x += p.vx;
        p.y += p.vy;

        let hue = electricHue(p.hue);
        let pulse = (Math.sin(Date.now()*0.01 + p.spark*5)+1)*0.5+0.6;

        // Electric sparkle effect
        ctx.beginPath();
        ctx.fillStyle = `hsla(${hue},100%,65%,${pulse})`;
        ctx.shadowColor = `hsla(${hue},100%,75%,1)`;
        ctx.shadowBlur = 22 + Math.sin(Date.now()*0.02+p.spark)*12;
        ctx.arc(p.x,p.y,p.size + Math.sin(Date.now()*0.02+p.spark)*0.8,0,Math.PI*2);
        ctx.fill();
    });

    ctx.restore();
    requestAnimationFrame(animate);
}
animate();
</script>
</body>
</html>
