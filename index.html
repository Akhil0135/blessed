<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>IMAX – FULL CINEMATIC</title>
<style>
  body { margin:0; overflow:hidden; background:#000; }
  canvas { display:block; }
</style>
</head>
<body>

<!-- Stage 1 -->
<div id="stage1">
    <!-- Stage 1 content exactly as before -->
</div>

<!-- Stage 2 -->
<div id="stage2" style="display:none;">
    <!-- Stage 2 content exactly as before -->
</div>

<!-- Stage 3 -->
<div id="stage3" style="display:none;">
    <!-- Stage 3 content exactly as before -->
</div>

<!-- Stage 4 -->
<div id="stage4" style="display:none;"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/examples/js/loaders/FontLoader.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/examples/js/geometries/TextGeometry.js"></script>

<script>
// ==================== STAGE 1, 2, 3 SCRIPTS ====================
// Keep exactly as in your original codes
// Stage 1 → Stage 2 → Stage 3 logic unchanged

// In Stage 3, after DAIVIK evolution, add 3-second delay
btn.addEventListener("click", ()=>{
    btn.style.display="none"; 
    const newText="DAIVIK";
    const newPoints=mapTextToPoints(newText);
    particles.forEach((p,i)=>{
        const np=newPoints[i%newPoints.length];
        p.tx=np.x;
        p.ty=np.y;
        p.color="#fff";
    });

    // 3-second delay before Stage 4
    setTimeout(()=>{ startStage4(); }, 3000);
});

// ==================== STAGE 4 SCRIPT ====================
function startStage4(){
    stage3.style.display="none";
    const stage4 = document.getElementById("stage4");
    stage4.style.display="block";

    // ---------------- Scene + Camera ----------------
    let scene = new THREE.Scene();
    scene.fog = new THREE.FogExp2(0x000000, 0.0012);

    let camera = new THREE.PerspectiveCamera(60, window.innerWidth/window.innerHeight, 0.1, 3000);
    camera.position.set(0, 50, 400);

    let renderer = new THREE.WebGLRenderer({antialias:true});
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(window.devicePixelRatio);
    stage4.appendChild(renderer.domElement);

    // ---------------- Stars ----------------
    let starGeo = new THREE.BufferGeometry();
    let starCount = 2500;
    let starArr = new Float32Array(starCount * 3);
    for(let i=0;i<starCount*3;i++){
        starArr[i] = (Math.random() - 0.5) * 3000;
    }
    starGeo.setAttribute("position", new THREE.BufferAttribute(starArr, 3));
    let starMat = new THREE.PointsMaterial({ color:0xffffff, size:2.2 });
    let stars = new THREE.Points(starGeo, starMat);
    scene.add(stars);
    let starVel = new Float32Array(starCount);
    for(let i=0;i<starCount;i++){ starVel[i] = Math.random()*0.02 + 0.01; }

    // ---------------- Lights ----------------
    let ambient = new THREE.AmbientLight(0x666666, 0.5);
    scene.add(ambient);
    let keyLight = new THREE.PointLight(0x99ccff, 2, 2000);
    keyLight.position.set(180, 200, 140);
    scene.add(keyLight);
    let warmLight = new THREE.PointLight(0xffddaa, 1.8, 2000);
    warmLight.position.set(-120, 160, -80);
    scene.add(warmLight);

    // ---------------- Glowing Nebula Shader ----------------
    const nebulaMat = new THREE.ShaderMaterial({
        uniforms: { time:{ value:0 } },
        vertexShader: `...`,  // Use exactly your Phase 4 shaders
        fragmentShader: `...`,
        metalness: 1,
        roughness: 0.25,
        transparent: true
    });

    // ---------------- Text ----------------
    let princeLetters = [];
    let birthdayMesh=null, oneMesh=null;
    const princeText = "PRINCE";
    let loadedFont=null;

    new THREE.FontLoader().load(
        "https://threejs.org/examples/fonts/helvetiker_bold.typeface.json",
        font => {
            loadedFont = font;
            // Create 1, HAPPY BIRTHDAY, PRINCE letters exactly as in Phase 4
        }
    );

    // ---------------- Animate ----------------
    let angle=0;
    function animate(){
        requestAnimationFrame(animate);
        stars.rotation.y += 0.0005;
        let positions = stars.geometry.attributes.position.array;
        for(let i=0;i<starCount;i++){
            positions[i*3+2] += Math.sin(Date.now()*0.001 + i)*0.01*starVel[i];
        }
        stars.geometry.attributes.position.needsUpdate = true;

        angle += 0.0012;
        camera.position.x = Math.sin(angle)*400;
        camera.position.z = Math.cos(angle)*400;
        camera.lookAt(0,50,0);

        nebulaMat.uniforms.time.value += 0.03;
        renderer.render(scene,camera);
    }
    animate();

    window.addEventListener("resize",()=>{
        camera.aspect = window.innerWidth/window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
    });
}
</script>

</body>
</html>
