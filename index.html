<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>IMAX • Nolan Cinematic Vision</title>
<style>
  html,body{margin:0;padding:0;height:100%;background:#000;overflow:hidden;font-family:Inter,system-ui}

  canvas{width:100%;height:100%;display:block;background:radial-gradient(circle at center,#0a0a15,#000);
  }

  /* Cinematic Title */
  .title{
    position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);
    color:#fff;font-size:3vw;letter-spacing:0.4vw;font-weight:300;
    opacity:0;animation:titleFade 6s ease forwards 4s;
    text-shadow:0 0 20px #00aaff;
  }

  @keyframes titleFade{
    0%{opacity:0;letter-spacing:2vw;filter:blur(20px)}
    40%{opacity:1;letter-spacing:0.4vw;filter:blur(0px)}
    100%{opacity:0;filter:blur(15px)}
  }
@keyframes shieldRotate {
  0% { transform: translate(-50%, -50%) scale(1.1) rotate(0deg); }
  100% { transform: translate(-50%, -50%) scale(1.1) rotate(360deg); }
}

@keyframes starSpin {
  0% { transform: rotate(0deg); }
  100% { transform: rotate(360deg); }
}

.shield-spin {
  animation: shieldRotate 14s linear infinite;
}

#shield svg polygon {
  transform-origin: 256px 256px;
  transform: translate(0,0) scale(1);
  animation: starSpin 4s linear infinite;
}

</style>
</head>
<body>
<canvas id="cinema"></canvas>


<script>
/* ---------------- 3D Cinematic Space Simulation ---------------- */
const canvas = document.getElementById('cinema');
const ctx = canvas.getContext('2d');
canvas.width = innerWidth;
canvas.height = innerHeight;

let stars = Array.from({length:1500}, () => {
  return {
    x: (Math.random()-0.5)*2000,
    y: (Math.random()-0.5)*2000,
    z: Math.random()*2000,
  };
});

function animate(){
  ctx.fillStyle = '#000';
  ctx.fillRect(0,0,canvas.width,canvas.height);

  for(let s of stars){
    s.z -= 4;
    if(s.z <= 1) s.z = 2000;

    let sx = (s.x / s.z) * 800 + canvas.width/2;
    let sy = (s.y / s.z) * 800 + canvas.height/2;
    let size = Math.max(0, 2 - s.z/1000);

    ctx.fillStyle = 'white';
    ctx.beginPath();
    ctx.arc(sx, sy, size, 0, Math.PI*2);
    ctx.fill();
  }
  requestAnimationFrame(animate);
}

animate();
// --- SHOOTING STAR IMPACT (Shield Break Only, Star Stays) ---

const shootingStar = document.createElement('div');
shootingStar.id = 'shootingStar';
shootingStar.style.position = 'absolute';
shootingStar.style.width = '5px';
shootingStar.style.height = '160px';
shootingStar.style.background = 'white';
shootingStar.style.top = '-300px';
shootingStar.style.left = '-300px';
shootingStar.style.transform = 'rotate(45deg)';
shootingStar.style.filter = 'blur(1px) drop-shadow(0 0 25px white)';
shootingStar.style.opacity = '0';
document.body.appendChild(shootingStar);

setTimeout(() => {
  shootingStar.style.transition = 'all 1.1s ease-out';
  shootingStar.style.opacity = '1';
  shootingStar.style.top = '50%';
  shootingStar.style.left = '50%';
  shootingStar.style.transform = 'translate(-50%, -50%) rotate(45deg)';
}, 2000);

shootingStar.addEventListener('transitionend', () => {
  const shieldSVG = document.querySelector('#shield svg');
  const outerRings = shieldSVG.querySelectorAll('circle');
  outerRings.forEach(ring => {
    ring.style.transition = 'all 0.8s ease-out';
    ring.style.filter = 'brightness(4) blur(6px)';
    ring.style.opacity = '0';
    ring.style.transform = 'scale(1.3)';
  });
});

// --- CRACK SHATTER + SHIELD PIECES FLY APART ---

function createCracks() {
  const crack = document.createElement('div');
  crack.className = 'crackLine';
  crack.style.position = 'absolute';
  crack.style.top = '50%';
  crack.style.left = '50%';
  crack.style.width = '2px';
  crack.style.height = '180px';
  crack.style.background = 'white';
  crack.style.transform = 'translate(-50%, -50%) rotate(' + Math.random() * 180 + 'deg)';
  crack.style.opacity = '0.7';
  crack.style.filter = 'drop-shadow(0 0 10px white)';
  document.body.appendChild(crack);

  setTimeout(() => {
    crack.style.transition = 'opacity 0.5s ease-out';
    crack.style.opacity = '0';
  }, 400);
}

shootingStar.addEventListener('transitionend', () => {
  const shieldSVG = document.querySelector('#shield svg');
  const outerRings = shieldSVG.querySelectorAll('circle');

  // CRACK EFFECT
  for (let i = 0; i < 6; i++) createCracks();

  // SHIELD PIECES FLY OUT
  outerRings.forEach((ring, i) => {
    ring.style.transition = 'all 1.4s cubic-bezier(0.2, 0.8, 0.3, 1)';
    ring.style.filter = 'brightness(5) blur(4px)';
    ring.style.opacity = '0';
    ring.style.transform = `translate(${(i-2)*60}px, ${(i-2)*40}px) scale(1.3)`;
  });
});

// --- SHOCKWAVE + CAMERA SHAKE + PARTICLES + SOUND SYNC ---

// Create Shockwave
function createShockwave() {
  const wave = document.createElement('div');
  wave.id = 'shockwave';
  wave.style.position = 'absolute';
  wave.style.top = '50%';
  wave.style.left = '50%';
  wave.style.width = '20px';
  wave.style.height = '20px';
  wave.style.border = '3px solid white';
  wave.style.borderRadius = '50%';
  wave.style.transform = 'translate(-50%, -50%) scale(0)';
  wave.style.opacity = '0.9';
  wave.style.filter = 'blur(3px) drop-shadow(0 0 25px white)';
  wave.style.transition = 'all 1.6s ease-out';
  document.body.appendChild(wave);

  setTimeout(() => {
    wave.style.transform = 'translate(-50%, -50%) scale(20)';
    wave.style.opacity = '0';
  }, 10);
}

// CAMERA SHAKE
function cameraShake() {
  document.body.style.animation = 'shake 0.4s ease-out';
  setTimeout(() => (document.body.style.animation = ''), 500);
}

// PARTICLE BURST
function particleBurst() {
  for (let i = 0; i < 30; i++) {
    const p = document.createElement('div');
    p.className = 'particle';
    p.style.position = 'absolute';
    p.style.top = '50%';
    p.style.left = '50%';
    p.style.width = '4px';
    p.style.height = '4px';
    p.style.background = 'white';
    p.style.borderRadius = '50%';
    p.style.filter = 'drop-shadow(0 0 10px white)';
    p.style.transform = 'translate(-50%, -50%)';

    document.body.appendChild(p);

    const angle = Math.random() * Math.PI * 2;
    const distance = 150 + Math.random() * 150;

    p.style.transition = 'all 1.2s ease-out';
    p.style.transform = `translate(${Math.cos(angle) * distance}px, ${Math.sin(angle) * distance}px)`;
    p.style.opacity = '0';

    setTimeout(() => p.remove(), 1500);
  }
}

// SOUND SYNC PLACEHOLDER (attach your sound later)
function playImpactSound() {
  console.log('IMAX Impact Sound Triggered');
}

// Enhance Existing Impact Event
shootingStar.addEventListener('transitionend', () => {
  createShockwave();
  cameraShake();
  particleBurst();
  playImpactSound();
});

// CSS FOR CAMERA SHAKE + PARTICLES + WAVE
const style = document.createElement('style');
style.innerHTML = `
@keyframes shake {
  0% { transform: translate(0, 0); }
  25% { transform: translate(6px, -6px); }
  50% { transform: translate(-6px, 4px); }
  75% { transform: translate(4px, 6px); }
 100% { transform: translate(0, 0); }
}
`;
document.head.appendChild(style);

</script>
<div id="shield"></div>
<script>
// Add Captain America Shield SVG in center
const shield = document.getElementById('shield');
shield.innerHTML = `
<svg class="shield-spin" width="280" height="280" viewBox="0 0 512 512" style="position:absolute;top:50%;left:50%;transform:translate(-50%,-50%) scale(1.1);filter:drop-shadow(0 0 35px #ff000066)">
  <defs>
    <!-- Metallic Red -->
    <radialGradient id="metalRed" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#ff5555"/>
      <stop offset="50%" stop-color="#b20000"/>
      <stop offset="100%" stop-color="#4a0000"/>
    </radialGradient>

    <!-- Metallic White -->
    <linearGradient id="metalWhite" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="50%" stop-color="#d0d0d0"/>
      <stop offset="100%" stop-color="#9e9e9e"/>
    </linearGradient>

    <!-- Metallic Blue -->
    <radialGradient id="metalBlue" cx="50%" cy="40%" r="70%">
      <stop offset="0%" stop-color="#4db8ff"/>
      <stop offset="50%" stop-color="#004c97"/>
      <stop offset="100%" stop-color="#001a33"/>
    </radialGradient>

    <!-- Star Chrome Effect -->
    <linearGradient id="starChrome" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="40%" stop-color="#e3e3e3"/>
      <stop offset="80%" stop-color="#8f8f8f"/>
      <stop offset="100%" stop-color="#ffffff"/>
    </linearGradient>
  </defs>

  <circle cx="256" cy="256" r="250" fill="url(#metalRed)"/>
  <circle cx="256" cy="256" r="200" fill="url(#metalWhite)"/>
  <circle cx="256" cy="256" r="150" fill="url(#metalRed)"/>
  <circle cx="256" cy="256" r="100" fill="url(#metalBlue)"/>

  <g transform="translate(256,256) scale(0.75) translate(-256,-256)">
  <polygon points="256,150 281,230 366,230 297,280 322,360 256,310 190,360 215,280 146,230 231,230" fill="url(#starChrome)"/>
</g>
</svg>`;
</script>
</body>
</html>
