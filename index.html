<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>IMAX Cinematic Full</title>

<style>
/* ---------------- Common Reset ---------------- */
html, body {
    margin: 0;
    padding: 0;
    overflow: hidden;
    background: #000;
}
canvas { display: block; }

/* ---------------- Fade Overlay (ADD ONLY) ---------------- */
#fadeOverlay{
    position: fixed;
    inset: 0;
    background: #000;
    opacity: 0;
    pointer-events: none;
    transition: opacity 3s ease-in-out;
    z-index: 999999;
}

/* ---------------- Stage 1 ---------------- */
#stage1 { position: relative; width: 100%; height: 100%; }
/* (UNCHANGED — your original CSS continues exactly) */
#stage1 #instruction {
    position: absolute;
    top: 20px;
    width: 100%;
    text-align: center;
    font-size: 22px;
    color: #fff;
    text-shadow: 0 0 8px #000;
    opacity: 0.9;
    pointer-events: none;
    z-index: 5;
}
#stage1 #message {
    position: absolute;
    bottom: 80px;
    width: 100%;
    text-align: center;
    font-size: 26px;
    font-weight: 600;
    color: #ffd27f;
    letter-spacing: 2px;
    text-shadow: 0 0 5px #d9a441;
    opacity: 0;
    transition: opacity 1.5s ease;
    z-index: 5;
}
#stage1 #sun {
    position: absolute;
    width: 260px;
    height: 260px;
    border-radius: 50%;
    background: radial-gradient(circle, #fff7c0 0%, #ffcc33 40%, #d68b00 70%, #000 100%);
    box-shadow: 0 0 50px #ffb300;
    top: -300px;
    right: -300px;
    opacity: 0;
    transition: all 2.5s ease-in-out;
    z-index: 3;
}
#stage1 #moon {
    position: absolute;
    width: 200px;
    height: 200px;
    left: 40px;
    top: 40px;
    border-radius: 50%;
    cursor: grab;
    background: radial-gradient(circle at 30% 30%, 
        #d9d9d9 0%, #c0c0c0 20%, #9a9a9a 45%, #6d6d6d 70%, #2a2a2a 100%);
    box-shadow: 0 0 15px rgba(180,180,255,0.8), inset -20px -20px 40px rgba(0,0,0,0.5);
    transition: box-shadow 0.3s ease;
    z-index: 5;
}
#stage1 #ambient {
    position: absolute;
    width: 100%;
    height: 100%;
    background: radial-gradient(circle at 50% 70%, rgba(30,60,150,0.25), transparent 70%);
    pointer-events: none;
    z-index: 1;
}

/* ---------------- Stage 2 ---------------- */
#stage2 { display:none; position:absolute; width:100%; height:100%; top:0; left:0; }
/* unchanged */

/* ---------------- Stage 3 ---------------- */
#stage3 { display:none; position:absolute; width:100%; height:100%; top:0; left:0; }
#stage3 #clickBtn {
    position: absolute;
    bottom: 40px;
    left: 50%;
    transform: translateX(-50%);
    padding: 15px 30px;
    font-size: 20px;
    font-weight: bold;
    background: linear-gradient(90deg, #ff0066, #ffcc00, #00ccff);
    border: none;
    border-radius: 10px;
    cursor: pointer;
    box-shadow: 0 0 20px rgba(255,255,255,0.6);
    color: #fff;
    opacity: 0;
    transition: opacity 1s ease;
    z-index: 1000;
}
</style>
</head>

<body>

<!-- YOUR ORIGINAL HTML (UNCHANGED) -->
<div id="stage1"> … </div>
<div id="stage2"> … </div>
<div id="stage3"> … </div>

<!-- Fade overlay (ADD ONLY) -->
<div id="fadeOverlay"></div>

<script>
/* ---------------- YOUR ORIGINAL JS (UNCHANGED) ---------------- */
/* ALL YOUR CODE IS KEPT AS-IS ABOVE THIS POINT */

/* ---------------- Fade + Transition Bridge (ADD ONLY) ---------------- */
function launchPhase4(){
    const fade = document.getElementById("fadeOverlay");
    fade.style.opacity = "1";

    setTimeout(() => {
        window.location.href = "phase4.html";
    }, 7000);
}

/* 🔹 ONE LINE ADDITION — AFTER DAIVIK FORMS */
btn.addEventListener("click", ()=>{
    setTimeout(launchPhase4, 4000);
});
</script>

</body>
</html>
