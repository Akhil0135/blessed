<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>IMAX • Nolan Vision</title>

<style>
    @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@700&display=swap');

    /* ---------- GLOBAL ---------- */
    body {
        margin: 0;
        overflow: hidden;
        background: radial-gradient(circle at center, #02040f 0%, #000000 100%);
        font-family: 'Cinzel', serif;
    }

    /* ---------- STARFIELD ---------- */
    .star {
        position: absolute;
        width: 2px;
        height: 2px;
        background: white;
        border-radius: 50%;
        opacity: 0;
        animation: twinkle 2s infinite ease-in-out;
    }
    @keyframes twinkle {
        0% { opacity: 0; transform: scale(0.3); }
        50% { opacity: 1; transform: scale(1); }
        100% { opacity: 0; transform: scale(0.3); }
    }

    /* ---------- MOON ---------- */
    #moon {
        position: absolute;
        width: 180px;
        height: 180px;
        border-radius: 50%;
        background: radial-gradient(circle at 30% 30%, #ffffff, #bcbcbc, #6f6f6f);
        box-shadow: 0 0 40px #ffffffaa;
        top: 50%;
        left: 10%;
        transform: translateY(-50%);
        cursor: grab;
        transition: opacity 0.3s linear;
    }

    /* ---------- SUN ---------- */
    #sun {
        position: absolute;
        width: 260px;
        height: 260px;
        border-radius: 50%;
        background: radial-gradient(circle, #ffde73, #ff8a00);
        top: -200px;
        right: -200px;
        opacity: 0;
        transition: all 1.4s ease-out;
        box-shadow: 0 0 100px #ffb400aa;
    }

    /* ---------- MESSAGE ---------- */
    #msg {
        position: absolute;
        bottom: 40px;
        width: 100%;
        text-align: center;
        font-size: 28px;
        letter-spacing: 4px;
        color: #fff;
        opacity: 1;
        text-shadow: 0 0 12px #ffffff55;
        font-weight: 700;
        white-space: nowrap;
    }

    /* ---------- CROSS ---------- */
    #cross {
        position: absolute;
        top: -500px;
        left: 50%;
        transform: translateX(-50%);
        width: 90px;
        height: 260px;
        opacity: 0;
        transition: all 2s ease-out;
        background: url('https://i.imgur.com/fGQdV6z.png') no-repeat center/contain;
        filter: drop-shadow(0 0 20px #ffffff55);
    }
</style>
</head>

<body>

<div id="sun"></div>
<div id="moon"></div>
<div id="msg">YOUR MESSAGE WILL APPEAR HERE</div>
<div id="cross"></div>

<script>
/* ---------- STAR GENERATION ---------- */
for (let i = 0; i < 180; i++) {
    const s = document.createElement("div");
    s.className = "star";
    s.style.top = Math.random() * window.innerHeight + "px";
    s.style.left = Math.random() * window.innerWidth + "px";
    s.style.animationDelay = Math.random() * 2 + "s";
    document.body.appendChild(s);
}

const moon = document.getElementById("moon");
const sun  = document.getElementById("sun");
const msg  = document.getElementById("msg");
const cross = document.getElementById("cross");

let dragging = false;

/* ---------- MESSAGE TEXT ---------- */
const fullText = "HAPPY FIRST BIRTHDAY MY LITTLE PRINCE";
let revealLength = 0;

/* ---------- DRAG ---------- */
moon.onmousedown = () => dragging = true;
document.onmouseup = () => dragging = false;

document.onmousemove = (e) => {
    if (!dragging) return;

    moon.style.left = e.clientX - 90 + "px";
    moon.style.top  = e.clientY - 90 + "px";

    /* Moon fade */
    const fade = Math.min(1, e.clientX / window.innerWidth);
    moon.style.opacity = 1 - fade;

    /* Reveal text */
    revealLength = Math.floor(fade * fullText.length);
    msg.textContent = fullText.substring(0, revealLength);

    /* Stars fade when sun comes */
    if (fade > 0.7) {
        document.querySelectorAll('.star').forEach(star => {
            star.style.opacity = 0;
        });
    }

    /* Trigger sun evolution */
    if (fade > 0.8) {
        sun.style.opacity = 1;
        sun.style.top = "40px";
        sun.style.right = "40px";

        msg.style.color = "#1a3c92";

        /* Bring cross after full reveal */
        setTimeout(() => {
            cross.style.top = "50px";
            cross.style.opacity = 1;
        }, 1500);
    }
};
</script>

</body>
</html>
