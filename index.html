<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IMAX Nolan Star — Radiant Revelation</title>

<style>
    html,body{
        margin:0; padding:0; height:100%; overflow:hidden;
        background:#000;
        font-family: "Cinzel", serif;
        color:white;
    }

    /* ------ Cosmic Background ------ */
    #space {
        position:absolute;
        inset:0;
        background:radial-gradient(circle at center, #0a0a15 0%, #000 70%);
        filter:brightness(1.4);
    }

    /* ------ Metallic Star ------ */
    #star {
        position:absolute;
        top:50%; left:50%;
        width:120px; height:120px;
        background: radial-gradient(circle at 30% 30%, #fff 0%, #d0d0d0 40%, #7a7a7a 70%, #2b2b2b 100%);
        clip-path: polygon(
            50% 0%, 61% 35%, 98% 35%,
            68% 57%, 79% 91%, 50% 70%,
            21% 91%, 32% 57%, 2% 35%,
            39% 35%
        );
        transform: translate(-50%, -50%) scale(1);
        box-shadow:0 0 40px 10px #ffd700aa, inset 0 0 25px #ffffff;
        animation: starPulse 3s infinite ease-in-out;
        z-index:5;
    }

    @keyframes starPulse {
        0% { transform:translate(-50%,-50%) scale(1);}
        50% { transform:translate(-50%,-50%) scale(1.15);}
        100% { transform:translate(-50%,-50%) scale(1);}
    }

    /* ------ Radiations ------ */
    .ray {
        position:absolute;
        top:50%; left:50%;
        width:2px; height:0;
        background:linear-gradient(to bottom, #fff, #ffe08a);
        transform-origin:top;
        opacity:0;
        filter:blur(0.5px);
    }

    /* ------ Letters at bottom ------ */
    #letters {
        position:absolute;
        bottom:40px;
        left:50%;
        transform:translateX(-50%);
        display:flex;
        gap:25px;
        font-size:48px;
        letter-spacing:4px;
    }

    .letter {
        opacity:0;
        transform:translateY(60px) scale(0.2);
        filter:blur(20px);
        transition:all 1.4s ease-out;
        text-shadow:0 0 25px #ffd37f;
    }

    /* Cosmic Dust */
    .dust {
        position: absolute;
        width:2px; height:2px;
        background:white;
        opacity:0.4;
        border-radius:50%;
        animation: floatDust 6s infinite ease-in-out;
        filter:blur(1px);
    }
    @keyframes floatDust {
        0% { transform:translateY(0) scale(1); opacity:0.4; }
        50% { transform:translateY(-40px) scale(1.6); opacity:1; }
        100% { transform:translateY(0) scale(1); opacity:0.4; }
    }

</style>
</head>
<body>

<div id="space"></div>

<!-- Metallic Star -->
<div id="star"></div>

<!-- Letters -->
<div id="letters">
    <div class="letter" id="L1">P</div>
    <div class="letter" id="L2">R</div>
    <div class="letter" id="L3">I</div>
    <div class="letter" id="L4">N</div>
    <div class="letter" id="L5">C</div>
    <div class="letter" id="L6">E</div>
</div>

<script>
/* ---------- Create IMAX Radiations ---------- */
function createRadiations() {
    const count = 60;
    for(let i=0;i<count;i++){
        let r=document.createElement("div");
        r.className="ray";
        let angle=(360/count)*i;
        r.style.transform=`rotate(${angle}deg)`;
        document.body.appendChild(r);

        setTimeout(()=> {
            r.style.transition="height 1.4s ease-out, opacity 1.4s ease-out";
            r.style.height="240px";
            r.style.opacity="1";
        }, 300);

        // crack effect
        setTimeout(()=>{
            r.style.opacity="0";
            r.style.height="300px";
            r.style.filter="blur(8px)";
        }, 1700);
    }
}

/* ---------- IMAX Cracking + Letter Evolution ---------- */
function evolveLetters() {
    let delay = 0;
    const letters = ["L1","L2","L3","L4","L5","L6"];

    letters.forEach((id)=> {
        let el=document.getElementById(id);

        setTimeout(()=>{
            el.style.opacity="1";
            el.style.transform="translateY(0px) scale(1)";
            el.style.filter="blur(0px)";
        }, delay);

        delay += 700;   // IMAX stagger
    });
}

/* ---------- Cosmic Dust ---------- */
function dust() {
    for(let i=0;i<60;i++){
        let d=document.createElement("div");
        d.className="dust";
        d.style.left= (Math.random()*100)+"vw";
        d.style.top= (Math.random()*100)+"vh";
        d.style.animationDelay= (Math.random()*4)+"s";
        document.body.appendChild(d);
    }
}

/* ---------- Sequence ---------- */
setTimeout(createRadiations, 400);
setTimeout(evolveLetters, 2400);
dust();

</script>

</body>
</html>
