<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Phase 1 — IMAX Cinematic Night</title>

<style>
    html, body {
        margin: 0; padding: 0;
        width: 100%; height: 100%;
        overflow: hidden;
        background: black;
        font-family: "Cinzel", serif;
    }

    /* --- 3D Twinkling Stars --- */
    .star {
        position: absolute;
        width: 2px; height: 2px;
        background: white;
        border-radius: 50%;
        opacity: 0;
        animation: twinkle 4s infinite ease-in-out alternate;
    }
    @keyframes twinkle {
        0% { opacity: 0; transform: scale(0.2); }
        50% { opacity: 1; transform: scale(1); }
        100% { opacity: 0.3; transform: scale(0.4); }
    }

    /* --- Moon --- */
    #moon {
        position: absolute;
        width: 130px;
        height: 130px;
        top: 50px;
        left: 50px;
        background: radial-gradient(circle at 30% 30%, #ffffff, #d5d5d5, #9e9e9e);
        border-radius: 50%;
        box-shadow: 0 0 40px 20px rgba(255,255,255,0.4);
        cursor: grab;
        user-select: none;
    }

    /* --- Sun (Hidden initially) --- */
    #sun {
        position: absolute;
        width: 150px;
        height: 150px;
        top: -200px;
        right: -200px;
        background: radial-gradient(circle at 30% 30%, #fff3c0, #ffcc33, #ff8800);
        border-radius: 50%;
        box-shadow: 0 0 50px 30px rgba(255,180,0,0.5);
        opacity: 0;
    }

    /* --- Cinematic Message --- */
    #msg {
        position: absolute;
        bottom: 15%;
        width: 100%;
        text-align: center;
        font-size: 22px;
        letter-spacing: 2px;
        color: #ffd88a; /* Soft Cinematic Gold */
        text-shadow: 0 0 8px #775500;
        opacity: 0;
    }
</style>
</head>

<body>

<div id="moon"></div>
<div id="sun"></div>
<div id="msg"></div>

<script>
/* -------------------------------
   3D STAR GENERATION
--------------------------------*/
for (let i = 0; i < 250; i++) {
    const s = document.createElement("div");
    s.className = "star";
    s.style.left = Math.random() * window.innerWidth + "px";
    s.style.top = Math.random() * window.innerHeight + "px";
    s.style.animationDelay = (Math.random() * 4) + "s";
    s.style.transform = `scale(${0.3 + Math.random() * 1.5})`;
    document.body.appendChild(s);
}

const moon = document.getElementById("moon");
const sun = document.getElementById("sun");
const msg = document.getElementById("msg");

let dragging = false;

/* Full message line */
const fullText = "ON THIS CALM BIRTHDAY EVE SO NEW, GOD SOFTLY WHISPERS, MY PLANS ARE MADE FOR YOU.";
let revealed = 0;

/* -------------------------------
   DRAG MOON
--------------------------------*/
moon.addEventListener("mousedown", () => dragging = true);
window.addEventListener("mouseup", () => dragging = false);

window.addEventListener("mousemove", (e) => {
    if (!dragging) return;

    // Make moon follow cursor perfectly
    moon.style.left = (e.clientX - 65) + "px";
    moon.style.top = (e.clientY - 65) + "px";

    // Fade stars based on horizontal movement
    const progress = Math.min(e.clientX / window.innerWidth, 1);
    document.querySelectorAll(".star").forEach(star => {
        star.style.opacity = 1 - progress;
    });

    // Reveal message letter-by-letter parallel to drag
    let lettersToShow = Math.floor(progress * fullText.length);
    if (lettersToShow > revealed) {
        revealed = lettersToShow;
        msg.textContent = fullText.substring(0, revealed);
        msg.style.opacity = 1;
    }

    // When message fully revealed → moon fades → sun comes
    if (revealed >= fullText.length) {
        moon.style.transition = "1.5s ease";
        moon.style.opacity = "0";

        sun.style.transition = "2.5s ease";
        sun.style.opacity = "1";
        sun.style.top = "50px";
        sun.style.right = "50px";
    }
});
</script>

</body>
</html>
