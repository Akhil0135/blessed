<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>IMAX Cinematic Full</title>

<style>
html, body {
    margin: 0;
    padding: 0;
    overflow: hidden;
    background: #000;
}
canvas { display: block; }

/* ---------------- STAGE 1 ---------------- */
#stage1 { position: relative; width: 100%; height: 100%; }
#instruction {
    position:absolute; top:20px; width:100%; text-align:center;
    font-size:22px; color:#fff; z-index:5;
}
#message {
    position:absolute; bottom:80px; width:100%; text-align:center;
    font-size:26px; color:#ffd27f; opacity:0; transition:opacity 1.5s;
}
#moon {
    position:absolute; width:200px; height:200px; left:40px; top:40px;
    border-radius:50%; cursor:grab;
    background: radial-gradient(circle at 30% 30%, #d9d9d9 0%, #9a9a9a 60%, #2a2a2a 100%);
    box-shadow:0 0 15px rgba(180,180,255,0.8);
    z-index:5;
    touch-action:none;
}
#sun {
    position:absolute; width:260px; height:260px; border-radius:50%;
    background: radial-gradient(circle,#fff7c0 0%,#ffcc33 40%,#000 100%);
    box-shadow:0 0 50px #ffb300;
    top:-300px; right:-300px; opacity:0; transition:all 2.5s;
}

/* ---------------- STAGE 2 ---------------- */
#stage2 { display:none; position:absolute; width:100%; height:100%; }
#stage2Instruction{
    position:absolute; top:20px; width:100%; text-align:center;
    font-size:22px; color:#fff; z-index:5;
}
#verse {
    position:absolute; top:60px; left:50%; transform:translateX(-50%) scale(0.2);
    font-size:32px; color:#ffe9a6; opacity:0; transition:1s;
}

/* ---------------- STAGE 3 ---------------- */
#stage3 { display:none; position:absolute; width:100%; height:100%; }
#stage3 button {
    position:absolute; bottom:40px; left:50%; transform:translateX(-50%);
    padding:15px 30px; font-size:20px; font-weight:bold;
    border:none; border-radius:10px;
    background:linear-gradient(90deg,#ff0066,#ffcc00,#00ccff);
    color:#fff; cursor:pointer; opacity:0; transition:1s;
}

/* ---------------- PHASE 4 ---------------- */
#phase4 { display:none; position:absolute; width:100%; height:100%; }
</style>
</head>

<body>

<!-- STAGE 1 -->
<div id="stage1">
    <div id="instruction">Drag the moon to the end</div>
    <canvas id="stars"></canvas>
    <div id="moon"></div>
    <div id="sun"></div>
    <div id="message">ON THIS CALM BIRTHDAY EVE SO NEW, GOD SOFTLY WHISPERS, MY PLANS ARE MADE FOR YOU.</div>
</div>

<!-- STAGE 2 -->
<div id="stage2">
    <div id="stage2Instruction">Click the star</div>
    <canvas id="shieldCanvas"></canvas>
    <div id="verse">He counts the stars and calls them each by name — Psalm 147:4</div>
</div>

<!-- STAGE 3 -->
<div id="stage3">
    <canvas id="c"></canvas>
    <button id="clickBtn">Click Here</button>
</div>

<!-- PHASE 4 -->
<div id="phase4"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/examples/js/loaders/FontLoader.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/examples/js/geometries/TextGeometry.js"></script>

<script>
/* ---------------- STAGE 1 MOBILE FIX ---------------- */
const moon=document.getElementById("moon");
const sun=document.getElementById("sun");
const message=document.getElementById("message");
let dragging=false, offsetX=0, offsetY=0, revealIndex=0;
const fullMsg=message.innerText; message.innerText="";

function pos(e){
    if(e.touches) return {x:e.touches[0].clientX,y:e.touches[0].clientY};
    return {x:e.clientX,y:e.clientY};
}
function startDrag(e){
    dragging=true;
    const p=pos(e);
    offsetX=p.x-moon.offsetLeft;
    offsetY=p.y-moon.offsetTop;
}
function stopDrag(){ dragging=false; }
function moveDrag(e){
    if(!dragging) return;
    const p=pos(e);
    moon.style.left=(p.x-offsetX)+"px";
    moon.style.top=(p.y-offsetY)+"px";

    if(revealIndex<fullMsg.length){
        message.style.opacity=1;
        message.innerText=fullMsg.substring(0,revealIndex++);
    }
    if(revealIndex>=fullMsg.length){
        moon.style.opacity=0;
        setTimeout(()=>{
            sun.style.opacity=1;
            sun.style.top="40px";
            sun.style.right="40px";
            setTimeout(startStage2,5000);
        },800);
    }
}

moon.addEventListener("mousedown",startDrag);
moon.addEventListener("touchstart",startDrag);
document.addEventListener("mouseup",stopDrag);
document.addEventListener("touchend",stopDrag);
document.addEventListener("mousemove",moveDrag);
document.addEventListener("touchmove",moveDrag,{passive:false});

/* ---------------- STAGE 2 ---------------- */
const stage1=document.getElementById("stage1");
const stage2=document.getElementById("stage2");
const shieldCanvas=document.getElementById("shieldCanvas");
const ctx2=shieldCanvas.getContext("2d");
shieldCanvas.width=innerWidth; shieldCanvas.height=innerHeight;
const verse=document.getElementById("verse");
let spin=false;

function drawShield(){
    ctx2.clearRect(0,0,shieldCanvas.width,shieldCanvas.height);
    ctx2.translate(innerWidth/2,innerHeight/2);
    ctx2.fillStyle="#900";
    ctx2.beginPath(); ctx2.arc(0,0,150,0,Math.PI*2); ctx2.fill();
    ctx2.restore();
}
function animate2(){
    drawShield();
    if(spin) verse.style.opacity=1;
    requestAnimationFrame(animate2);
}
function startStage2(){
    stage1.style.display="none";
    stage2.style.display="block";
    animate2();
}
shieldCanvas.addEventListener("click",()=>{ spin=true; setTimeout(startStage3,7000); });

/* ---------------- STAGE 3 ---------------- */
const stage3=document.getElementById("stage3");
const c=document.getElementById("c");
const ctx3=c.getContext("2d");
c.width=innerWidth; c.height=innerHeight;

function startStage3(){
    stage2.style.display="none";
    stage3.style.display="block";
    document.getElementById("clickBtn").style.opacity=1;
}

/* ---------------- PHASE 4 ---------------- */
document.getElementById("clickBtn").onclick=()=>{
    stage3.style.display="none";
    document.getElementById("phase4").style.display="block";
    // Phase 4 unchanged – your existing Three.js scene continues
};
</script>
</body>
</html>
