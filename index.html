<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1.0" />
<title>IMAX Nolan Cinematic Moon → Birthday</title>
<style>
  /* ---------- Base / Canvas ---------- */
  html,body{height:100%;margin:0;background:#070712;font-family:"Cinzel",serif;overflow:hidden;color:#fff}
  #scene{position:relative;width:100%;height:100%;overflow:hidden;perspective:1400px;will-change:transform}

  /* ---------- Letterbox (Nolan IMAX feel) ---------- */
  .letterbox{
    position:absolute;left:0;right:0;height:8vh;background:linear-gradient(#000,transparent);
    z-index:9998;pointer-events:none;
  }
  .letterbox.top{top:0}
  .letterbox.bottom{bottom:0;transform:translateY(2vh)}

  /* ---------- Sky / grade / film ---------- */
  #sky{position:absolute;inset:0;background:linear-gradient(180deg,#071023 0%,#120034 55%,#1b003a 100%);transition:background 1400ms cubic-bezier(.2,.9,.2,1);z-index:1}
  .grade {
    position:absolute;inset:0;pointer-events:none;mix-blend-mode:soft-light;
    background:linear-gradient(180deg, rgba(255,190,140,0.02), rgba(10,6,20,0.06));
    opacity:0.98; z-index:900;
    filter:contrast(1.06) saturate(1.08);
  }
  .film-grain {
    position:absolute;inset:0;pointer-events:none;z-index:995;opacity:0.06;
    background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64"><filter id="g"><feTurbulence baseFrequency="0.8" numOctaves="2" stitchTiles="stitch"/></filter><rect width="100%" height="100%" filter="url(#g)" fill="white"/></svg>');
    mix-blend-mode:overlay;
  }

  /* ---------- Vignette ---------- */
  .vignette{
    position:absolute;inset:0;pointer-events:none;z-index:996;
    background:radial-gradient(ellipse at 50% 35%, rgba(0,0,0,0) 40%, rgba(0,0,0,0.55) 100%);
    transition:opacity 900ms ease;
  }

  /* ---------- Moon ---------- */
  #moon{
    position:absolute;top:18%;left:14%;
    width:200px;height:200px;border-radius:50%;
    background:radial-gradient(circle at 35% 30%,#fffef4 0%, #f0e6c4 40%, #d4c089 100%);
    box-shadow:0 0 110px rgba(255,245,200,0.5), 0 12px 40px rgba(0,0,0,0.25);
    z-index:60; cursor:grab; transition:opacity 700ms, transform 120ms linear;
    will-change:transform,opacity; touch-action:none;
  }
  #moon:active{cursor:grabbing}

  /* ---------- Stars ---------- */
  .star{position:absolute;width:2px;height:2px;border-radius:50%;background:#fff;box-shadow:0 0 6px rgba(255,255,255,0.9);opacity:0.9;animation:twinkle 2.6s infinite alternate;z-index:30;filter:blur(0.8px)}
  @keyframes twinkle{0%{opacity:0.25;transform:scale(0.7)}50%{opacity:1;transform:scale(1.45)}100%{opacity:0.25;transform:scale(0.7)}}

  /* ---------- Clouds (soft painterly) ---------- */
  .cloud{position:absolute;border-radius:50%;filter:blur(14px) saturate(.95);mix-blend-mode:screen;opacity:0.85;background:radial-gradient(circle at 30% 30%, rgba(255,255,255,0.98) 0%, rgba(255,255,255,0.6) 28%, rgba(255,255,255,0.12) 58%, rgba(255,255,255,0) 100%);z-index:40}

  /* ---------- Sun (IMAX MASSIVE, fixed top-right) ---------- */
  #sun{
    position:absolute; top:4%; right:4%; width:720px; height:720px; border-radius:50%;
    background: radial-gradient(circle at 36% 36%, rgba(255,255,255,1) 0%, rgba(255,245,210,1) 10%, rgba(255,210,120,1) 28%, rgba(255,150,40,0.9) 52%, rgba(210,80,20,0.65) 78%, rgba(170,60,20,0) 100%);
    pointer-events:none; z-index:700; transform-origin:center; opacity:0; transition:opacity 900ms cubic-bezier(.2,.9,.2,1), transform 900ms cubic-bezier(.2,.9,.2,1);
    box-shadow:0 0 240px 120px rgba(255,240,200,0.16), 0 0 540px 280px rgba(255,200,130,0.05);
    will-change:opacity,transform,filter; filter:saturate(1.06) ;
  }
  .sun .corona{position:absolute; left:50%; top:50%; transform:translate(-50%,-50%); width:220%; height:220%; border-radius:50%; background: radial-gradient(circle, rgba(255,255,255,0.14) 0%, rgba(255,210,120,0.06) 20%, rgba(255,160,60,0.02) 50%, rgba(255,100,40,0) 100%); filter:blur(38px); opacity:0; transition:opacity 700ms}
  .sun-rays{position:absolute; top:50%; left:50%; width:2600px; height:2600px; border-radius:50%; transform:translate(-50%,-50%) scale(0.3); opacity:0; filter:blur(48px); mix-blend-mode:screen; pointer-events:none; transition:opacity 900ms, transform 900ms; z-index:680}

  /* ---------- Message (clear contrast) ---------- */
  #msg{
    position:absolute; bottom:18%; left:50%; transform:translateX(-50%);
    max-width:88%; text-align:center; font-size:28px; letter-spacing:1.6px; line-height:1.2;
    color:#ffd; text-shadow: 0 6px 22px rgba(30,10,40,0.55);
    z-index:780; opacity:0; transition:opacity 180ms linear; pointer-events:none;
    font-weight:700;
  }

  /* ---------- Rotation indicator ---------- */
  #rotationIndicator{position:absolute; left:50%; bottom:6%; transform:translateX(-50%); width:86%; height:8px; background:rgba(255,255,255,0.07); border-radius:6px; z-index:990}
  #rotationProgress{height:100%; width:0%; background:linear-gradient(90deg,#ffd89a,#ffbc6b); border-radius:6px; transition:width 80ms linear}

  /* ---------- Button ---------- */
  #btn{position:absolute; left:50%; bottom:6.6%; transform:translateX(-50%); z-index:1001;
       display:inline-block;padding:14px 34px;border-radius:12px;border:0; cursor:pointer;
       background:linear-gradient(90deg,#6a00ff,#bf00ff); color:#fff; font-weight:800;
       box-shadow:0 14px 60px rgba(80,0,150,0.35); opacity:0; transition:opacity 450ms}
  #btn:active{transform:translateX(-50%) scale(.98)}

  /* ---------- Cross (Christian) ---------- */
  #cross{position:absolute; left:50%; top:12%; transform:translateX(-50%) scale(.85); opacity:0; z-index:995; pointer-events:none;
         transition:transform 900ms cubic-bezier(.2,.9,.2,1), opacity 900ms}
  .cross-vertical{position:relative;width:34px;height:320px;background:linear-gradient(180deg,#fffbdf,#ffd15f); border-radius:3px; box-shadow:0 24px 120px rgba(255,200,55,0.12) inset}
  .cross-horizontal{position:absolute; left:50%; transform:translateX(-50%); width:230px;height:34px; top:calc(320px*0.35); background:linear-gradient(90deg,#fff1a5,#ffc06b); border-radius:3px; box-shadow:0 24px 120px rgba(255,200,55,0.12) inset}

  /* ---------- Birthday overlay ---------- */
  #birthdayPhase{position:absolute;inset:0;opacity:0;pointer-events:none;z-index:980;transition:opacity 900ms}
  #happyText{position:absolute;top:38%;left:50%;transform:translateX(-50%) scale(.7);font-size:4.2rem;font-weight:900;
             background:linear-gradient(90deg,#ff4d6d,#ffd44d,#6ef0d6,#9b5cff);
             -webkit-background-clip:text;-webkit-text-fill-color:transparent; text-align:center;
             text-shadow:0 0 36px rgba(255,200,80,0.35); opacity:0; transition:opacity 900ms, transform 900ms; z-index:999}

  /* ---------- Fireworks dots ---------- */
  .firework{position:absolute;width:8px;height:8px;border-radius:50%;opacity:0;pointer-events:none;z-index:999;box-shadow:0 0 40px;}
</style>
</head>
<body>
  <div id="scene">
    <div id="sky"></div>

    <!-- letterbox bars -->
    <div class="letterbox top"></div>
    <div class="letterbox bottom"></div>

    <!-- main layers -->
    <div id="moon" aria-hidden="true"></div>
    <div id="sun" aria-hidden="true">
      <div class="corona"></div>
    </div>
    <div class="sun-rays" aria-hidden="true"></div>

    <!-- clouds (populated by JS) -->
    <!-- stars (populated by JS) -->

    <div class="grade"></div>
    <div class="film-grain"></div>
    <div class="vignette"></div>

    <div id="msg">On this calm birthday eve so new, God softly whispers, my plans are made for you.</div>

    <div id="rotationIndicator"><div id="rotationProgress"></div></div>
    <button id="btn" aria-pressed="false">Click Here</button>

    <div id="cross" aria-hidden="true">
      <div class="cross-vertical"></div>
      <div class="cross-horizontal"></div>
    </div>

    <div id="birthdayPhase"></div>
    <div id="happyText">🎉 Happy Birthday! 🎉</div>
  </div>

<script>
/* ---------------------------
   Utility & scene setup
   --------------------------- */
const scene = document.getElementById('scene');
const moon  = document.getElementById('moon');
const sun   = document.getElementById('sun');
const sunCorona = sun.querySelector('.corona');
const sunRays = document.querySelector('.sun-rays');
const msg   = document.getElementById('msg');
const btn   = document.getElementById('btn');
const cross = document.getElementById('cross');
const sky   = document.getElementById('sky');
const rotBar = document.getElementById('rotationProgress');
const vignette = document.querySelector('.vignette');
const birthdayPhase = document.getElementById('birthdayPhase');
const happyText = document.getElementById('happyText');

let stars = [];
let clouds = [];
let fireworksTimer = null;

/* keep the original full text */
const FULL_TEXT = msg.innerText;
msg.textContent = ''; // start empty (revealed by rotation)

/* small helper: clamp */
const clamp = (v,a,b)=> Math.max(a,Math.min(b,v));

/* ---------- Stars ---------- */
function createStars(n=160){
  for(let i=0;i<n;i++){
    const s = document.createElement('div');
    s.className='star';
    const t = Math.random()*90;
    const l = Math.random()*100;
    s.style.top = t + '%';
    s.style.left = l + '%';
    s.style.opacity = (0.3 + Math.random()*0.9);
    s.style.animationDuration = (1.6 + Math.random()*2.8) + 's';
    scene.appendChild(s);
    stars.push(s);
  }
}
createStars(160);

/* ---------- Clouds ---------- */
function createClouds(n=6){
  for(let i=0;i<n;i++){
    const c = document.createElement('div');
    c.className='cloud';
    c.style.width = (220 + Math.random()*500) + 'px';
    c.style.height= (80 + Math.random()*140) + 'px';
    c.style.top = (6 + i*11 + Math.random()*6) + '%';
    c.style.left = (-20 + i*18 + Math.random()*6) + '%';
    c.speed = 0.05 + Math.random()*0.18;
    c.style.opacity = 0.65 + Math.random()*0.25;
    scene.appendChild(c);
    clouds.push(c);
  }
}
createClouds(6);

/* ---------- Interactive rotation state ---------- */
let isDragging = false;
let lastX = 0;
let rotationPx = 0;     // accumulate pixels converted to percent of 360
let evolutionDone = false;
let phaseTwoStarted = false;
const PIXELS_FOR_FULL = window.innerWidth * 0.9; // require a generous right drag to complete
const clampRotationTo360 = v => clamp(v,0,PIXELS_FOR_FULL);

/* keep pointer capture strictly on moon so dragging only while pointer is down on moon */
moon.addEventListener('pointerdown', (e)=>{
  e.preventDefault();
  isDragging = true;
  lastX = e.clientX;
  moon.setPointerCapture && moon.setPointerCapture(e.pointerId);
  moon.style.cursor = 'grabbing';
});
moon.addEventListener('pointerup', (e)=>{
  isDragging = false;
  moon.style.cursor = 'grab';
  try { moon.releasePointerCapture && moon.releasePointerCapture(e.pointerId); } catch(e){}
});
document.addEventListener('pointercancel', ()=>{ isDragging=false; moon.style.cursor='grab'; });

/* ---------- Main pointermove — only active while dragging ON THE MOON ---------- */
document.addEventListener('pointermove',(e)=>{
  if(!isDragging) return;
  const dx = e.clientX - lastX;
  lastX = e.clientX;

  /* user wanted "only one-way" rotation: ignore negative deltas */
  if(dx <= 0) return;

  rotationPx += dx;
  rotationPx = clampRotationTo360(rotationPx);

  const progress = clamp(rotationPx / PIXELS_FOR_FULL, 0, 1); // 0..1
  applySceneProgress(progress);
});

/* ---------- Apply scene states by progress (0..1) ---------- */
function applySceneProgress(p){
  // Rotation visual on moon — map p to 0..360 degrees anticlockwise negative for cinematic feel
  const deg = - Math.round(p*360);
  moon.style.transform = `translate(-50%,-50%) rotate(${deg}deg)`;

  // Message reveal proportionally
  const lettersToShow = Math.floor(FULL_TEXT.length * p);
  msg.textContent = FULL_TEXT.substring(0, lettersToShow);
  msg.style.opacity = lettersToShow > 0 ? 1 : 0;

  // Sun bloom & scale (IMAX)
  sun.style.opacity = p;
  const sunScale = 0.35 + 0.95 * p; // huge IMAX scale
  sun.style.transform = `translateZ(0) scale(${sunScale})`;
  sunCorona.style.opacity = Math.min(1, p*1.0);
  sunRays.style.opacity = Math.min(0.95, p*1.05);
  sunRays.style.transform = `translate(-50%,-50%) scale(${0.3 + 0.9*p})`;

  // Sky subtle shift toward day only at big p (we keep overall dark mood as requested; day effects appear only at full reveal)
  // Keep base dark overall to preserve IMAX Nolan look; when near complete, add very bright highlights (not full white).
  const skyTopNight = [7,16,35]; // rgb for night tone (r,g,b)
  const skyTopDay   = [170,210,255]; // day highlight
  const mix = Math.pow(p,1.1);
  const r = Math.round(skyTopNight[0] + (skyTopDay[0]-skyTopNight[0])*mix);
  const g = Math.round(skyTopNight[1] + (skyTopDay[1]-skyTopNight[1])*mix);
  const b = Math.round(skyTopNight[2] + (skyTopDay[2]-skyTopNight[2])*mix);
  sky.style.background = `linear-gradient(180deg, rgb(${r},${g},${b}) 0%, #120034 55%, #1b003a 100%)`;

  // Stars fade out smoothly as day comes
  stars.forEach(s => { s.style.opacity = String((1 - p) * (0.35 + Math.random()*0.65)); });

  // Moon fades out
  moon.style.opacity = String(1 - p);

  // Rotation progress bar
  rotBar.style.width = `${Math.round(p*100)}%`;

  // Cinematic camera breath (tiny dolly)
  scene.style.transform = `translateZ(0) scale(${1 + p*0.025})`;

  // Vignette adjustments for day
  vignette.style.opacity = String(0.6 - p*0.45);

  // Once fully revealed, lock and show button after 3s
  if(p >= 0.999 && !evolutionDone){
    evolutionDone = true;
    // ensure fully 1.0 exact
    rotationPx = PIXELS_FOR_FULL;
    setTimeout(()=>{ showFirstButton(); }, 3000);
  }
}

/* ---------- Show first button (after full reveal) ---------- */
function showFirstButton(){
  if(btn.style.opacity === '1') return;
  btn.textContent = 'Click Here';
  btn.style.opacity = '1';
  btn.disabled = false;
}

/* ---------- Button click flow:
   1st click → reveal cross cinematic, hide button; 3s later bring button back labeled "Birthday"
   2nd click → birthday phase: hide most elements, reveal HAPPY text + fireworks
*/
let clickStage = 0;
btn.addEventListener('click', ()=>{
  if(clickStage === 0){
    // first click: reveal cross
    btn.style.opacity = '0';
    setTimeout(()=> btn.style.display='none', 600);
    cinematicCrossReveal();
    clickStage = 1;
    setTimeout(()=> {
      // re-show button as second-stage
      btn.style.display = 'block';
      btn.textContent = 'Click Here for Birthday!';
      btn.style.opacity = '1';
    }, 3000);
    return;
  }

  if(clickStage === 1){
    // Birthday phase: keep cross, fade everything else and start birthday visuals
    btn.style.opacity = '0';
    setTimeout(()=> btn.style.display='none', 600);
    startBirthdayPhase();
    clickStage = 2;
    return;
  }
});

/* ---------- Cross reveal animation ---------- */
function cinematicCrossReveal(){
  cross.style.opacity = '1';
  cross.style.transform = 'translateX(-50%) scale(1.12) rotate(-1deg)';
  cross.style.filter = 'drop-shadow(0 40px 140px rgba(255,200,80,0.14))';
  // small pulse
  setTimeout(()=> { cross.style.transform = 'translateX(-50%) scale(1) rotate(0deg)'; }, 1200);
  // glow pulse loops a few times
  let pulses = 0;
  const pulse = setInterval(()=>{
    cross.style.transform = 'translateX(-50%) scale(1.05)';
    setTimeout(()=> cross.style.transform = 'translateX(-50%) scale(1)', 280);
    pulses++;
    if(pulses > 3) clearInterval(pulse);
  }, 600);
}

/* ---------- Birthday visuals ---------- */
function startBirthdayPhase(){
  // fade core scene parts smoothly
  const fadeOutElems = [moon, sun, sunRays, ...stars];
  fadeOutElems.forEach(el => el.style.transition = 'opacity 900ms ease');

  // fade out: stars, msg, moon, sun
  stars.forEach(s => s.style.opacity = '0');
  msg.style.opacity = '0';
  moon.style.opacity = '0';
  sun.style.opacity = '0';
  sunRays.style.opacity = '0';

  // transform sky + birthday overlay
  birthdayPhase.style.background = 'linear-gradient(180deg,#ffefcc,#ffd9e1)';
  birthdayPhase.style.opacity = '1';

  // reveal happy text with scale + glow
  setTimeout(()=>{
    happyText.style.opacity = '1';
    happyText.style.transform = 'translateX(-50%) scale(1)';
    happyText.style.filter = 'drop-shadow(0 40px 80px rgba(255,160,80,0.25))';
    // start repeating fireworks
    fireworksTimer = setInterval(spawnFirework, 420);
  }, 450);

  // subtle camera pop
  scene.style.transition = 'transform 900ms cubic-bezier(.2,.9,.2,1)';
  scene.style.transform = 'scale(1.03)';
}

/* ---------- Firework (simple particle) ---------- */
function spawnFirework(){
  const fw = document.createElement('div');
  fw.className = 'firework';
  const left = 15 + Math.random()*70;
  const top = 20 + Math.random()*50;
  fw.style.left = left + '%';
  fw.style.top  = top  + '%';
  const hue = 30 + Math.random()*320;
  fw.style.background = `radial-gradient(circle, hsl(${hue} 90% 70%), hsl(${(hue+30)%360} 85% 55%))`;
  fw.style.boxShadow = `0 0 30px rgba(255,255,255,0.25), 0 0 60px hsla(${hue},80%,60%,0.55)`;
  scene.appendChild(fw);
  // animate
  fw.animate([
    { transform: 'scale(0)', opacity: 1 },
    { transform: 'scale(3.8)', opacity: 0 }
  ], { duration: 900 + Math.random()*400, easing: 'cubic-bezier(.2,.9,.2,1)', fill: 'forwards' });
  setTimeout(()=> fw.remove(), 1500);
}

/* ---------- Clouds drift, stars twinkle (loop) ---------- */
setInterval(()=>{
  clouds.forEach(c => {
    const cur = parseFloat(c.style.left || '0');
    let nx = cur + c.speed;
    if(nx > 120) nx = -40 - Math.random()*20;
    c.style.left = nx + '%';
  });
}, 60);

setInterval(()=>{
  // gentle flicker for bright elements (fireflies not used heavily here)
  // small random breathe for grade + vignette
  const b = 0.98 + Math.sin(Date.now()/4000)*0.01;
  document.querySelector('.grade').style.opacity = b;
}, 500);

/* ---------- Shooting stars (top-left / top-right variety) ---------- */
function spawnShooting(){
  const s = document.createElement('div');
  s.className = 'star'; s.style.width='3px'; s.style.height='30px';
  s.style.borderRadius='6px';
  s.style.filter='blur(.8px)';
  // start corner random
  const fromLeft = Math.random() > 0.5;
  s.style.left = (fromLeft? -5 : 105) + '%';
  s.style.top  = (5 + Math.random()*30) + '%';
  s.style.transform = `rotate(${fromLeft?25:-25}deg)`;
  s.style.opacity = '0.95';
  scene.appendChild(s);
  const totalX = (fromLeft? window.innerWidth*1.2 : -window.innerWidth*1.2);
  const dur = 900 + Math.random()*1200;
  s.animate([
    { transform: s.style.transform + ' translateX(0) translateY(0)', opacity: 1 },
    { transform: s.style.transform + ` translateX(${totalX}px) translateY(${window.innerHeight*0.8}px)`, opacity: 0 }
  ], { duration: dur, easing: 'cubic-bezier(.2,.6,.2,1)' });
  setTimeout(()=> s.remove(), dur+60);
}
setInterval(()=> { if(Math.random() < 0.6) spawnShooting(); }, 900);

/* ---------- Responsiveness: recalc PIXELS_FOR_FULL on resize ---------- */
window.addEventListener('resize', ()=>{
  // require a generous drag across width for full reveal
  const newReq = window.innerWidth * 0.9;
  // keep relative progress
  const progress = clampRotationTo360(rotationPx) / PIXELS_FOR_FULL;
  // update constant
  PIXELS_FOR_FULL = newReq; // note: PIXELS_FOR_FULL declared earlier as const; adjust approach: use a variable instead
});

/* Fix PIXELS_FOR_FULL as variable (redeclare here) */
let PIXELS_FOR_FULL = window.innerWidth * 0.9; // override earlier const behavior

/* ensure pointer cursor initial style */
moon.style.cursor = 'grab';

/* safeguard: if user clicks button before evolutionDone, ignore */
btn.addEventListener('click', (ev)=>{
  // if first click but evolution not finished, ignore until visible
  if(!evolutionDone && clickStage === 0) return;
});

/* Accessibility: allow Enter to trigger when focus on button */
btn.addEventListener('keydown', (e)=>{
  if(e.key === 'Enter' || e.key === ' ') { e.preventDefault(); btn.click(); }
});

/* End of script */
</script>
</body>
</html>
