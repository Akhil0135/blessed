<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Phase 4 — HAPPY BIRTHDAY PRINCE</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  body { margin:0; overflow:hidden; background:#000; }
  canvas { display:block; }
</style>
</head>
<body>

<script src="https://cdn.jsdelivr.net/npm/three@0.159.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.159.0/examples/js/geometries/TextGeometry.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.159.0/examples/js/loaders/FontLoader.js"></script>

<script>
let scene = new THREE.Scene();
let camera = new THREE.PerspectiveCamera(60, window.innerWidth/window.innerHeight, 0.1, 2000);
camera.position.set(0, 30, 120);

let renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setSize(window.innerWidth, window.innerHeight);
document.body.appendChild(renderer.domElement);

// ---------- Galaxy Stars ----------
let starGeo = new THREE.BufferGeometry();
let starCount = 1000;
let starPositions = new Float32Array(starCount * 3);
for (let i=0; i<starCount*3; i++){
    starPositions[i] = (Math.random()-0.5)*2000;
}
starGeo.setAttribute('position', new THREE.BufferAttribute(starPositions, 3));
let starMat = new THREE.PointsMaterial({color:0xffffff, size:1.5});
let stars = new THREE.Points(starGeo, starMat);
scene.add(stars);

// ---------- Lighting ----------
let ambientLight = new THREE.AmbientLight(0xffffff, 0.5);
scene.add(ambientLight);
let pointLight = new THREE.PointLight(0xffddaa, 2, 1000);
pointLight.position.set(50,100,50);
scene.add(pointLight);

// ---------- Text ----------
let textMesh;
let loader = new THREE.FontLoader();
loader.load('https://threejs.org/examples/fonts/helvetiker_regular.typeface.json', function(font){
    let textGeo = new THREE.TextGeometry('HAPPY BIRTHDAY PRINCE', {
        font: font,
        size: 10,
        height: 3,
        curveSegments: 12,
        bevelEnabled: true,
        bevelThickness: 1,
        bevelSize: 0.5,
        bevelOffset: 0,
        bevelSegments: 5
    });
    textGeo.center(); // perfectly center

    let textMat = new THREE.MeshStandardMaterial({
        color: 0xffcc33,
        emissive: 0xffaa00,
        metalness: 0.6,
        roughness: 0.3
    });

    textMesh = new THREE.Mesh(textGeo, textMat);
    scene.add(textMesh);
});

// ---------- Camera Orbit ----------
let angle = 0;
function animate(){
    requestAnimationFrame(animate);
    stars.rotation.y += 0.0005; // subtle galaxy rotation
    if(textMesh){
        angle += 0.002;
        camera.position.x = Math.sin(angle)*120;
        camera.position.z = Math.cos(angle)*120;
        camera.lookAt(textMesh.position);
    }
    renderer.render(scene, camera);
}
animate();

// ---------- Handle Resize ----------
window.addEventListener('resize', ()=>{
    camera.aspect = window.innerWidth/window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
});
</script>

</body>
</html>
