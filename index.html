<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Cinematic Day/Night Birthday Experience</title>
<style>
  body {
    margin: 0;
    height: 100vh;
    overflow: hidden;
    display: flex;
    justify-content: center;
    align-items: center;
    background: #001f3f;
    position: relative;
    transition: background 2s ease-in-out;
  }

  /* Camera drift */
  .cameraMove {
    animation: camMove 18s ease-in-out infinite alternate;
  }
  @keyframes camMove {
    from { transform: scale(1); }
    to { transform: scale(1.05) translateY(-12px); }
  }

  /* Perfect Gold Cross */
  .cross {
    position: absolute;
    top: 40px;
    width: 60px;
    height: 160px;
    background: gold;
    filter: drop-shadow(0 0 12px rgba(255,215,0,0.8));
    z-index: 20;
  }
  .cross::before {
    content: '';
    position: absolute;
    top: 45px;
    left: -50px;
    width: 160px;
    height: 40px;
    background: gold;
  }

  /* Night Moon */
  .moon {
    position: absolute;
    top: 80px;
    right: 100px;
    width: 140px;
    height: 140px;
    border-radius: 50%;
    background: radial-gradient(circle, #ffffff, #cccccc);
    box-shadow: 0 0 40px 15px rgba(255,255,255,0.8);
    opacity: 0;
    transition: opacity 2s ease-in-out;
  }

  /* Stars */
  .star {
    position: absolute;
    width: 4px;
    height: 4px;
    background: white;
    border-radius: 50%;
    animation: twinkle 2s infinite ease-in-out;
    opacity: 0;
  }
  @keyframes twinkle {
    0% { opacity: 0.3; }
    50% { opacity: 1; }
    100% { opacity: 0.3; }
  }

  /* Day Sun */
  .sun {
    position: absolute;
    top: 80px;
    right: 100px;
    width: 150px;
    height: 150px;
    border-radius: 50%;
    background: radial-gradient(circle, #ffe066, #ffcd00, #ffb700);
    box-shadow: 0 0 40px 15px rgba(255,200,0,0.9);
    opacity: 0;
    transition: opacity 2s ease-in-out;
  }

  /* Balloons */
  .balloon {
    position: absolute;
    bottom: -200px;
    width: 55px;
    height: 75px;
    border-radius: 50% 50% 45% 45%;
    animation: rise 7s linear infinite;
    filter: drop-shadow(0 5px 5px rgba(0,0,0,0.5));
    z-index: 20;
  }
  @keyframes rise {
    0% { transform: translateY(0) rotate(0deg); }
    50% { transform: translateY(-60vh) rotate(4deg); }
    100% { transform: translateY(-120vh) rotate(-4deg); }
  }

  /* Confetti */
  .confetti {
    position: absolute;
    width: 10px;
    height: 14px;
    animation: fall 3.5s linear forwards;
    opacity: 0.9;
    z-index: 30;
  }
  @keyframes fall {
    from { transform: translateY(-50px) rotate(0deg); }
    to { transform: translateY(120vh) rotate(360deg); }
  }

  /* Birthday Text */
  #birthdayText {
    position: absolute;
    top: 50%;
    transform: translateY(-50%);
    font-size: 70px;
    font-family: "Brush Script MT", cursive;
    display: flex;
    gap: 5px;
    color: red;
  }
  .letter {
    opacity: 0;
    transform: scale(0.2) rotate(-15deg);
    transition: 0.4s ease;
  }
  .letter.show {
    opacity: 1;
    transform: scale(1) rotate(0deg);
  }

</style>
</head>
<body class="cameraMove">

<div class="cross" id="cross"></div>
<div class="moon" id="moon"></div>
<div class="sun" id="sun"></div>
<div id="birthdayText"></div>

<script>
function createStars() {
  for (let i = 0; i < 80; i++) {
    const star = document.createElement("div");
    star.classList.add("star");
    star.style.left = Math.random() * window.innerWidth + "px";
    star.style.top = Math.random() * window.innerHeight + "px";
    star.style.opacity = 1;
    document.body.appendChild(star);
  }
}

function nightMode() {
  document.body.style.background = "#001f3f";
  document.getElementById("moon").style.opacity = 1;
  createStars();
}

function dayMode() {
  document.body.style.background = "linear-gradient(#87CEFA, #d0eaff)";
  document.querySelectorAll('.star').forEach(s => s.remove());
  document.getElementById("moon").style.opacity = 0;
  document.getElementById("sun").style.opacity = 1;
  document.getElementById("cross").style.background = "linear-gradient(red, orange, yellow, green, blue, indigo, violet)";
  document.getElementById("cross").style.filter = "drop-shadow(0 0 12px rgba(255,255,255,0.9))";
  document.querySelector('.cross').style.setProperty('--hue', '360');
}

// Text Animation
function showBirthdayText() {
  const container = document.getElementById("birthdayText");
  container.innerHTML = "";

  const text = "HAPPY BIRTHDAY";

  for (let i = 0; i < text.length; i++) {
    const span = document.createElement("span");
    span.textContent = text[i];
    span.classList.add("letter");
    if (i === 5) span.style.marginRight = "30px";
    container.appendChild(span);
  }

  const letters = document.querySelectorAll(".letter");
  letters.forEach((l, index) => {
    setTimeout(() => {
      l.classList.add("show");
    }, index * 100);
  });
}

// Balloons
function createBalloons() {
  setInterval(() => {
    const b = document.createElement("div");
    b.classList.add("balloon");
    const colors = ["#ff4d4d", "#ffcc00", "#66ccff", "#ff99ff", "#33ff77"];
    b.style.background = colors[Math.floor(Math.random() * colors.length)];
    b.style.left = Math.random() * window.innerWidth + "px";
    document.body.appendChild(b);
    setTimeout(() => b.remove(), 9000);
  }, 500);
}

// Confetti
function confettiExplosion() {
  for (let i = 0; i < 150; i++) {
    const c = document.createElement("div");
    c.classList.add("confetti");
    const colors = ["red", "yellow", "blue", "green", "purple", "orange"]; 
    c.style.background = colors[Math.floor(Math.random() * colors.length)];
    c.style.left = Math.random() * window.innerWidth + "px";
    document.body.appendChild(c);
    setTimeout(() => c.remove(), 4000);
  }
}

// Sequence
setTimeout(nightMode, 500);
setTimeout(showBirthdayText, 1500);
setTimeout(createBalloons, 2000);
setTimeout(confettiExplosion, 3000);
setTimeout(dayMode, 8000);

</script>
</body>
</html>
