<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>IMAX Constellation Reveal — For Akhil Sir</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
html,body{
    margin:0;
    padding:0;
    overflow:hidden;
    background:#02030a;
}
canvas{display:block;}
</style>

</head>
<body>
<canvas id="c"></canvas>

<script>
const canvas = document.getElementById("c");
const ctx = canvas.getContext("2d");
function resize(){ canvas.width=innerWidth; canvas.height=innerHeight; }
resize(); onresize=resize;

/* ---------------- BACKGROUND STAR FIELD ---------------- */
let bgStars = [];
let totalStars = 420;

for(let i=0;i<totalStars;i++){
    bgStars.push({
        x: Math.random()*innerWidth,
        y: Math.random()*innerHeight,
        r: Math.random()*1.5+0.3,
        phase: Math.random()*Math.PI*2,
        tw: Math.random()*0.05 + 0.01,
        targetX:null,
        targetY:null
    });
}

/* ---------------- SHIELD POSITION ---------------- */
let shieldX, shieldY, R;
let starSpin=false, starAngle=0;
let forming = false;

/* ---------------- VERSE TO FORM ---------------- */
const verse = "HE COUNTS THE STARS";
let letterPoints = []; // each target position for each star being used

function generateLetterTargets(){
    let xStart = innerWidth/2 - verse.length*18;
    let y = innerHeight*0.15;

    for(let i=0;i<verse.length;i++){
        let ch = verse[i];
        if(ch===" "){
            xStart+=45;
            continue;
        }

        // each letter uses 10 stars
        for(let s=0;s<10;s++){
            letterPoints.push({
                x: xStart + (Math.random()*35-17),
                y: y + (Math.random()*35-17)
            });
        }

        xStart += 35;
    }

    // assign targets to background stars
    for(let i=0;i<letterPoints.length;i++){
        bgStars[i].targetX = letterPoints[i].x;
        bgStars[i].targetY = letterPoints[i].y;
    }
}

/* ---------------- DRAW SHIELD ---------------- */
function drawShield(){
    shieldX = innerWidth/2;
    shieldY = innerHeight/2 + innerHeight*0.20;
    R = Math.min(innerWidth, innerHeight)/3;

    ctx.save();
    ctx.translate(shieldX, shieldY);

    // outer ring
    const g1 = ctx.createRadialGradient(0,0,0,0,0,R);
    g1.addColorStop(0,"#300");
    g1.addColorStop(1,"#700");
    ctx.fillStyle = g1;
    ctx.beginPath(); ctx.arc(0,0,R,0,Math.PI*2); ctx.fill();

    // white ring
    const g2 = ctx.createRadialGradient(0,0,0,0,0,R*0.75);
    g2.addColorStop(0,"#cfcfcf");
    g2.addColorStop(1,"#e5e5e5");
    ctx.fillStyle = g2;
    ctx.beginPath(); ctx.arc(0,0,R*0.75,0,Math.PI*2); ctx.fill();

    // red ring
    const g3 = ctx.createRadialGradient(0,0,0,0,0,R*0.5);
    g3.addColorStop(0,"#400");
    g3.addColorStop(1,"#900");
    ctx.fillStyle = g3;
    ctx.beginPath(); ctx.arc(0,0,R*0.5,0,Math.PI*2); ctx.fill();

    // blue center (reduced glow)
    const g4 = ctx.createRadialGradient(0,0,0,0,0,R*0.35);
    g4.addColorStop(0,"#9ab0cc");
    g4.addColorStop(1,"#00172f");
    ctx.fillStyle = g4;
    ctx.beginPath(); ctx.arc(0,0,R*0.35,0,Math.PI*2); ctx.fill();

    // star (glow reduced)
    ctx.save();
    if(starSpin) ctx.rotate(starAngle);
    ctx.shadowColor="rgba(255,255,255,0.15)";
    ctx.shadowBlur=2;

    const r = R*0.28;
    ctx.beginPath();
    for(let i=0;i<5;i++){
        let a1=(Math.PI*2/5)*i - Math.PI/2;
        let a2=a1+Math.PI/5;
        ctx.lineTo(Math.cos(a1)*r, Math.sin(a1)*r);
        ctx.lineTo(Math.cos(a2)*(r*0.45), Math.sin(a2)*(r*0.45));
    }
    ctx.closePath();
    ctx.fillStyle="#fff";
    ctx.fill();
    ctx.restore();

    ctx.restore();
}

/* ---------------- DRAW BACKGROUND / MOVING STARS ---------------- */
function drawStars(){
    for(let s of bgStars){

        // before click → twinkling
        if(!forming){
            s.phase += s.tw;
            let alpha = 0.4 + Math.sin(s.phase)*0.3;
            ctx.fillStyle = `rgba(255,255,255,${alpha})`;
        } 
        else {
            // move stars toward constellation targets
            if(s.targetX!==null){
                s.x += (s.targetX - s.x)*0.04;
                s.y += (s.targetY - s.y)*0.04;
            }
            ctx.fillStyle = "white";
        }

        ctx.beginPath();
        ctx.arc(s.x,s.y,s.r,0,Math.PI*2);
        ctx.fill();
    }
}

/* ---------------- DRAW CONSTELLATION LINES AFTER FORMATION ---------------- */
function drawConstellationLines(){
    if(!forming) return;

    // draw only after stars reached positions
    for(let i=0;i<letterPoints.length;i+=10){
        for(let j=0;j<10;j++){
            let a = bgStars[i+j];
            let b = bgStars[i + ((j+1)%10)];
            ctx.strokeStyle="rgba(255,255,255,0.4)";
            ctx.lineWidth=1;
            ctx.beginPath();
            ctx.moveTo(a.x,a.y);
            ctx.lineTo(b.x,b.y);
            ctx.stroke();
        }
    }
}

/* ---------------- MAIN LOOP ---------------- */
function animate(){
    ctx.clearRect(0,0,innerWidth,innerHeight);

    drawStars();
    drawShield();
    drawConstellationLines();

    if(starSpin){
        starAngle += 0.04;
    }

    requestAnimationFrame(animate);
}
animate();

/* ---------------- CLICK EVENT ---------------- */
canvas.addEventListener("click", e=>{
    let dx=e.clientX-shieldX, dy=e.clientY-shieldY;
    if(Math.sqrt(dx*dx+dy*dy)<=R*0.28){
        starSpin=true;
        forming=true;
        generateLetterTargets(); // stars start moving toward forming the verse
    }
});
</script>
</body>
</html>
