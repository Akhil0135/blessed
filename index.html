<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cinematic Night to Day with Rain and Rainbow</title>
<style>
  body {
    margin: 0;
    height: 100vh;
    background: linear-gradient(to bottom, #0a0f24 0%, #000814 70%, #000000 100%);
    overflow: hidden;
    position: relative;
    transition: background 3s ease-in-out;
  }

  /* Crescent Moon */
  .moon-wrapper {
    position: absolute;
    top: 80px;
    right: 120px;
    width: 150px;
    height: 150px;
    z-index: 2;
    transform: rotate(-50deg);
    transition: opacity 2s ease-in-out;
  }

  /* Cross */
  .cross {
    position: absolute;
    top: 10px;
    left: 50%;
    transform: translateX(-50%);
    width: 160px;
    height: 260px;
    z-index: 3;
  }

  .vertical {
    position: absolute;
    left: 50%;
    transform: translateX(-50%);
    width: 32px;
    height: 260px;
    background: linear-gradient(to bottom, #f6e7a4, #d4a93f, #b88a2c);
    transition: background 3s ease-in-out;
  }

  .horizontal {
    position: absolute;
    top: 65px;
    left: 50%;
    transform: translateX(-50%);
    width: 190px;
    height: 32px;
    background: linear-gradient(to right, #f6e7a4, #d4a93f, #b88a2c);
    transition: background 3s ease-in-out;
  }

  /* Stars */
  .star {
    position: absolute;
    width: 3px;
    height: 3px;
    background: white;
    border-radius: 50%;
    opacity: 0.9;
    animation: twinkle 2.5s infinite ease-in-out;
    pointer-events: none;
    z-index: 1;
  }

  @keyframes twinkle {
    0% { opacity: 0.2; transform: scale(1); }
    50% { opacity: 1; transform: scale(1.5); }
    100% { opacity: 0.2; transform: scale(1); }
  }

  /* Sun */
  .sun {
    position: absolute;
    top: 80px;
    right: 120px;
    width: 150px;
    height: 150px;
    border-radius: 50%;
    background: radial-gradient(circle, #FFD700 0%, #FFA500 70%);
    box-shadow: 0 0 60px #FFD700aa, 0 0 120px #FFD70055;
    opacity: 0;
    z-index: 2;
    transition: opacity 2s ease-in-out, top 5s ease-in-out;
  }

  /* Rain drops */
  .raindrop {
    position: absolute;
    width: 2px;
    height: 15px;
    background: rgba(255,255,255,0.7);
    animation: fall linear infinite;
    z-index: 1;
  }

  @keyframes fall {
    0% { transform: translateY(-20px); opacity: 1; }
    100% { transform: translateY(100vh); opacity: 0; }
  }

  /* Rainbow */
  .rainbow {
    position: absolute;
    bottom: 0;
    left: 50%;
    transform: translateX(-50%);
    width: 100%;
    height: 50%;
    background: linear-gradient(to right, red, orange, yellow, green, blue, indigo, violet);
    opacity: 0;
    border-radius: 50%;
    z-index: 0;
    transition: opacity 3s ease-in-out;
  }

  /* Click Button */
  .click-btn {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    padding: 16px 34px;
    font-size: 22px;
    font-weight: bold;
    background: white;
    border: none;
    border-radius: 10px;
    cursor: pointer;
    opacity: 0;
    animation: reveal 1.2s forwards;
    z-index: 4;
  }

  @keyframes reveal {
    0% { opacity: 0; filter: blur(8px); transform: translate(-50%, -50%) scale(0.85); }
    100% { opacity: 1; filter: blur(0px); transform: translate(-50%, -50%) scale(1); }
  }
</style>
</head>
<body>

<!-- Crescent Moon -->
<div class="moon-wrapper">
  <svg viewBox="0 0 100 100" width="150" height="150">
    <circle cx="50" cy="50" r="50" fill="white"/>
    <circle cx="60" cy="50" r="50" fill="url(#bgGradient)"/>
    <defs>
      <linearGradient id="bgGradient" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#0a0f24"/>
        <stop offset="70%" stop-color="#000814"/>
        <stop offset="100%" stop-color="#000000"/>
      </linearGradient>
    </defs>
  </svg>
</div>

<!-- Cross -->
<div class="cross">
  <div class="vertical"></div>
  <div class="horizontal"></div>
</div>

<!-- Sun -->
<div class="sun"></div>

<!-- Rainbow -->
<div class="rainbow"></div>

<script>
// Generate stars
for (let i = 0; i < 200; i++) {
  const star = document.createElement('div');
  star.classList.add('star');

  let x = Math.random() * window.innerWidth;
  let y = Math.random() * window.innerHeight;

  // Avoid moon + cross zones
  if ((x > window.innerWidth - 350 && y < 350) ||
      (x > window.innerWidth/2 - 140 && x < window.innerWidth/2 + 140 && y < 330)) {
    i--;
    continue;
  }

  star.style.left = x + 'px';
  star.style.top = y + 'px';
  star.style.animationDelay = Math.random() * 2 + 's';
  document.body.appendChild(star);
}

// Show click button after 3 seconds
setTimeout(() => {
  const btn = document.createElement('button');
  btn.className = 'click-btn';
  btn.innerText = 'Click Here';
  document.body.appendChild(btn);

  btn.addEventListener('click', () => {
    // Fade out moon
    document.querySelector('.moon-wrapper').style.opacity = 0;

    // Remove stars
    document.querySelectorAll('.star').forEach(s => s.remove());

    // Hide button
    btn.style.display = 'none';

    // Change background to day
    document.body.style.background = 'linear-gradient(to bottom, #87CEFA 0%, #ADD8E6 70%, #E0FFFF 100%)';

    // Show sun
    const sun = document.querySelector('.sun');
    sun.style.opacity = 1;
    sun.style.top = '50px'; // Slight rise

    // Cross color for day
    document.querySelector('.vertical').style.background = 'linear-gradient(to bottom, #FF8C00, #FF6600)';
    document.querySelector('.horizontal').style.background = 'linear-gradient(to right, #FF8C00, #FF6600)';

    // Rainbow
    document.querySelector('.rainbow').style.opacity = 0.8;

    // Add rain
    for(let i=0; i<200; i++){
      const drop = document.createElement('div');
      drop.className = 'raindrop';
      drop.style.left = Math.random() * window.innerWidth + 'px';
      drop.style.animationDuration = 1 + Math.random()*1 + 's';
      drop.style.opacity = 0.2 + Math.random()*0.5;
      document.body.appendChild(drop);
    }
  });
}, 3000);
</script>

</body>
</html>
