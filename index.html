<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>IMAX Nolan — Moon → Sun → Big Cross → Birthday Reveal</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&family=IM+Fell+English+SC&display=swap" rel="stylesheet">
<style>
  :root{
    --bg-night-1:#070617;
    --bg-night-2:#120430;
    --text-color:#ffdFA0;
    --cross-color:#fff8e8;
  }
  html,body{
    margin:0;
    height:100%;
    background:var(--bg-night-1);
    font-family:"Cinzel", serif;
    overflow:hidden;
    color:var(--text-color);
  }

  #stage{
    position:relative;
    width:100%;
    height:100%;
    perspective:1400px;
  }

  #sky{
    position:absolute;
    inset:0;
    background:linear-gradient(180deg,var(--bg-night-1),var(--bg-night-2) 55%);
    z-index:0;
  }

  /* stars in IMAX/Nolan style */
  #stars{position:absolute;inset:0;z-index:20;pointer-events:none;}
  .star{
    position:absolute;
    width:2px;
    height:2px;
    border-radius:50%;
    background:rgba(255,255,255,0.8);
    box-shadow:0 0 10px rgba(255,255,255,0.5),0 0 20px rgba(255,255,255,0.2);
    animation:twinkle 3s infinite alternate;
    transform: translateZ(0px);
  }
  @keyframes twinkle{
    0%{opacity:0.2; transform: scale(0.8);}
    50%{opacity:1; transform: scale(1.3);}
    100%{opacity:0.2; transform: scale(0.9);}
  }

  /* moon */
  #moon{
    position:absolute;
    width:190px;
    height:190px;
    border-radius:50%;
    background:radial-gradient(circle at 35% 30%, #ffffff, #f1e3b5 45%, #d8c08a 100%);
    top:18%;
    left:14%;
    box-shadow:0 0 120px rgba(255,245,200,0.14),0 0 260px rgba(255,240,200,0.06);
    cursor:grab;
    z-index:60;
    display:flex;
    align-items:center;
    justify-content:center;
    transform:translate(-50%,-50%) rotate(0deg);
    transition:opacity .2s linear;
  }
  #moon:active{cursor:grabbing}
  #moon .flare{
    position:absolute; inset:-40px; border-radius:50%;
    background:radial-gradient(circle, rgba(255,245,200,0.12), rgba(255,245,200,0));
    filter:blur(36px);
    pointer-events:none;
  }

  /* sun */
  #sun{
    position:absolute;
    width:300px;
    height:300px;
    border-radius:50%;
    top:5%;
    right:5%;
    background: radial-gradient(circle at 38% 34%, #fff8e8 0%, #ffd98f 12%, #ffb258 32%, #ff8a30 60%, rgba(200,80,30,0.6) 85%, rgba(200,80,30,0) 100%);
    box-shadow:0 0 280px 90px rgba(255,220,140,0.12),0 0 420px 260px rgba(255,180,90,0.04);
    z-index:55;
    pointer-events:none;
    opacity:0;
    transition:opacity .3s linear;
  }

  /* big cross */
  #cross{
    position:absolute;
    top:-400px;
    left:50%;
    transform:translateX(-50%) scale(0.3);
    width:60px;
    height:200px;
    z-index:70;
    opacity:0;
    background-color:var(--cross-color);
    box-shadow:0 0 40px 15px rgba(255,248,232,0.4),0 0 120px 40px rgba(255,248,232,0.2);
    transition: all 1.5s ease-in-out;
  }
  #cross::before{
    content:'';
    position:absolute;
    left:50%;
    top:40%;
    transform:translate(-50%,-50%);
    width:140px;
    height:40px;
    background-color:var(--cross-color);
    box-shadow:0 0 40px 15px rgba(255,248,232,0.4),0 0 120px 40px rgba(255,248,232,0.2);
  }

  /* message */
  #message{
    position:absolute;
    bottom:6%;
    left:50%;
    transform:translateX(-50%);
    white-space:nowrap;
    font-family:"IM Fell English SC", serif;
    font-size:18px;
    letter-spacing:2px;
    color:#ffdFA0;
    z-index:80;
  }
  .letter{
    display:inline-block;
    opacity:0;
    transform:translateY(12px);
    transition:opacity .1s ease, transform .1s ease;
  }

  @media (max-width:720px){
    #moon{width:140px;height:140px;}
    #sun{width:200px;height:200px;}
    #message{font-size:14px;}
    #cross{width:40px;height:140px;}
    #cross::before{width:100px;height:28px;}
  }
</style>
</head>
<body>
<div id="stage">
  <div id="sky"></div>
  <div id="stars"></div>
  <div id="moon"><div class="flare"></div></div>
  <div id="sun"></div>
  <div id="cross"></div>
  <div id="message"></div>
</div>

<script>
const fullText = "ON THIS CALM BIRTHDAY EVE SO NEW, GOD SOFTLY WHISPERS, MY PLANS ARE MADE FOR YOU.";
const moon = document.getElementById('moon');
const sun = document.getElementById('sun');
const starsWrap = document.getElementById('stars');
const message = document.getElementById('message');
const cross = document.getElementById('cross');

let dragging = false;
let lastX = 0;
let progress = 0; // 0..1

// Create cinematic IMAX/Nolan stars
const stars = [];
for(let i=0;i<160;i++){
  const s = document.createElement('div');
  s.className='star';
  s.style.left = Math.random()*100+'%';
  s.style.top = Math.random()*80+'%';
  s.style.opacity = 0.2 + Math.random()*0.8;
  s.style.animationDuration = (2 + Math.random()*2)+'s';
  s.style.transform = `translateZ(${Math.random()*400}px)`; // 3D depth effect
  starsWrap.appendChild(s);
  stars.push(s);
}

// Split message into letters
const letters=[];
for(let i=0;i<fullText.length;i++){
  const span=document.createElement('span');
  span.className='letter';
  span.textContent = fullText[i]===' ' ? '\u00A0' : fullText[i];
  message.appendChild(span);
  letters.push(span);
}

// Drag handlers
moon.addEventListener('pointerdown', e=>{
  dragging=true;
  lastX=e.clientX ?? e.touches?.[0]?.clientX ?? 0;
});
document.addEventListener('pointerup', e=>dragging=false);
document.addEventListener('pointermove', e=>{
  if(!dragging) return;
  const clientX=e.clientX ?? e.touches?.[0]?.clientX ?? lastX;
  const dx=clientX-lastX;
  lastX=clientX;
  if(dx<=0) return;
  progress += dx*0.0025;
  if(progress>1) progress=1;
  updateScene(progress);
});

// Update scene based on progress
function updateScene(t){
  t=Math.max(0,Math.min(1,t));

  // Moon fade and move right
  moon.style.opacity = 1-t;
  moon.style.left = 14 + t*46 + '%';
  moon.style.transform=`translate(-50%,-50%) rotate(${-t*360}deg)`;

  // Sun appear fully at top-right
  sun.style.opacity = t;

  // Stars twinkle until t~0.95, then fade
  stars.forEach((s)=>{
    if(t<0.95){
      s.style.opacity = 0.2 + Math.random()*0.8;
    } else {
      s.style.opacity = 0;
    }
  });

  // Reveal message letters in parallel
  const lettersToShow=Math.floor(t*letters.length);
  for(let i=0;i<letters.length;i++){
    if(i<lettersToShow){
      letters[i].style.opacity=1;
      letters[i].style.transform='translateY(0)';
    } else {
      letters[i].style.opacity=0;
      letters[i].style.transform='translateY(12px)';
    }
  }

  // Show big cross softly after sun fully appears (t>0.95)
  if(t>0.95){
    cross.style.top='10%';
    cross.style.opacity=0.85;
    cross.style.transform='translateX(-50%) scale(1)';
  }
}
</script>
</body>
</html>
