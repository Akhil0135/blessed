<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>IMAX Cosmic Vision — Akhil Sir</title>

<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&family=IM+Fell+English+SC&display=swap" rel="stylesheet">

<style>
:root{
  --gold:#ffd46b;
  --cross-color:#4b006f;
}

/* BASE */
html, body {
  margin: 0;
  height: 100%;
  background: black;
  font-family:"Cinzel", serif;
  overflow:hidden;
  color:var(--gold);
  transition: background 2s ease-in-out;
}

/* STAGE */
#stage{
  position:relative;
  width:100%;
  height:100%;
  perspective:1600px;
}

/* STARS */
.star{
  position:absolute;
  width:2px;
  height:2px;
  border-radius:50%;
  background:white;
  opacity:0.15;
  filter:blur(0.4px);
  transform: translateZ(0px);
}
.star.depth2{opacity:0.4; transform:scale(1.6);}
.star.depth3{opacity:0.9; transform:scale(2.2);}

/* MOON */
#moon{
  position:absolute;
  width:180px;
  height:180px;
  border-radius:50%;
  background:radial-gradient(circle at 40% 34%, #ffffff, #ebdfc0 45%, #bca887 80%, #4b3d2e 100%);
  top:28%;
  left:10%;
  box-shadow:0 0 100px rgba(255,245,200,0.25);
  cursor:grab;
  transform:translate(-50%,-50%);
  transition:opacity 0.25s linear;
}
#moon:active{cursor:grabbing;}
#moon .flare{
  position:absolute;
  inset:-50px;
  border-radius:50%;
  background:radial-gradient(circle, rgba(255,240,200,0.15), transparent 70%);
  filter:blur(65px);
  transition: all 1s ease-out;
}

/* SUN */
#sun{
  position:absolute;
  width:360px;
  height:360px;
  border-radius:50%;
  top:-220px;
  right:-220px;
  opacity:0;
  pointer-events:none;
  background: radial-gradient(circle at 38% 34%,
      #fffbe8 0%,
      #ffe79c 14%,
      #ffbe55 38%,
      #ff8e2d 58%,
      rgba(180,60,10,0.4) 80%,
      rgba(150,40,0,0) 100%);
  box-shadow:
    0 0 280px 60px rgba(255,180,80,0.18),
    0 0 500px 140px rgba(255,150,60,0.1);
  transition:opacity 1.4s ease-in-out, top 2.1s ease-out, right 2.1s ease-out, transform 2s ease-in-out;
}

/* MESSAGE */
#message{
  position:absolute;
  bottom:6%;
  left:50%;
  transform:translateX(-50%);
  white-space:nowrap;
  font-size:19px;
  letter-spacing:3px;
  font-family:"IM Fell English SC", serif;
  color:white;
  opacity:0;
  transition: color 2s ease-out, text-shadow 2s ease-out;
}

/* CROSS untouched */
#cross{position:absolute;top:-460px;left:50%;transform:translateX(-50%);opacity:0;width:50px;height:400px;pointer-events:none;}
#cross:after{content:"";position:absolute;width:180px;height:40px;top:120px;left:50%;transform:translateX(-50%);}
</style>
</head>

<body>
<div id="stage">
  <div id="stars"></div>
  <div id="moon"><div class="flare"></div></div>
  <div id="sun"></div>
  <div id="cross"></div>
  <div id="message"></div>
</div>

<script>
const fullText = "ON THIS CALM BIRTHDAY EVE SO NEW, GOD SOFTLY WHISPERS, MY PLANS ARE MADE FOR YOU.";

const moon=document.getElementById("moon");
const sun=document.getElementById("sun");
const starsWrap=document.getElementById("stars");
const message=document.getElementById("message");
const cross=document.getElementById("cross");

let dragging=false, lastX=0, progress=0;
const stars=[];

/* STAR GENERATION WITH DEPTH */
for(let i=0;i<170;i++){
  const s=document.createElement("div");
  let depth = Math.random();
  if(depth<0.33) s.className="star depth1";
  else if(depth<0.66) s.className="star depth2";
  else s.className="star depth3";

  s.style.left=Math.random()*100+"%";
  s.style.top=Math.random()*80+"%";
  s.dataset.z = (depth+0.5)*400; // for 3D movement
  starsWrap.appendChild(s);
  stars.push(s);
}

/* MESSAGE LETTERS */
const letters=[];
for(let i=0;i<fullText.length;i++){
  const L=document.createElement("span");
  L.className="letter";
  L.textContent = fullText[i]===" " ? "\u00A0" : fullText[i];
  L.style.opacity=0;
  L.style.transition="opacity .12s ease, transform .12s ease";
  L.style.display="inline-block";
  L.style.transform="translateY(10px)";
  message.appendChild(L);
  letters.push(L);
}

/* DRAG LOGIC */
moon.addEventListener("pointerdown", e=>{ dragging=true; lastX=e.clientX; });
document.addEventListener("pointerup", ()=>dragging=false);
document.addEventListener("pointermove", e=>{
  if(!dragging) return;
  let dx=e.clientX-lastX;
  lastX=e.clientX;
  if(dx<=0) return;
  progress += dx*0.0025;
  if(progress>1) progress=1;
  update(progress);
});

/* UPDATE SCENE */
function update(t){
  moon.style.opacity=1-t;
  moon.style.left = (10 + t*50)+"%";

  /* background transition black → dark blue */
  if(t>0.1){
    document.body.style.background=
      "radial-gradient(circle at center, #000c1e 0%, #001833 50%, #00040a 100%)";
  }

  /* Sun appear with subtle scaling */
  sun.style.opacity=t;
  if(t>0.7){
    sun.style.top="40px";
    sun.style.right="40px";
    sun.style.transform=`scale(${0.8 + 0.2*t})`;
  }

  /* Stars 3D parallax */
  stars.forEach(s=>{
    const z = parseFloat(s.dataset.z);
    const moveX = t*50*(z/400);
    const moveY = t*30*(z/400);
    s.style.transform = `translate(${moveX}px, ${moveY}px) translateZ(${z}px)`;
    if(t>0.9) s.style.opacity=0;
  });

  /* Gold message reveal */
  let show=Math.floor(t*letters.length);
  for(let i=0;i<letters.length;i++){
    if(i<show){ 
      letters[i].style.opacity=1;
      letters[i].style.transform="translateY(0)";
      letters[i].style.textShadow="0 0 8px rgba(255,210,107,0.7)";
    }
  }
  if(t>0.7){
    message.style.color="var(--gold)";
    message.style.opacity=1;
  }

  /* Cross untouched */
  if(t>0.92){
    cross.style.opacity=1;
    cross.style.top="30px";
  }
}
</script>
</body>
</html>
