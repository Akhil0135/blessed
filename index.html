<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>IMAX Constellation Verse — For Akhil Sir</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
    html,body{
        margin:0;
        padding:0;
        overflow:hidden;
        background:#03040a;  /* deep space black */
        font-family: "Cinzel", serif;
    }
    canvas{ display:block; }

    .beam{
        position:absolute;
        width:40vw;
        height:40vh;
        top:0;
        left:50%;
        transform:translateX(-50%);
        background:radial-gradient(circle,#ffffff40 0%, transparent 70%);
        filter:blur(40px);
        opacity:0;
        transition:2s ease-out;
        pointer-events:none;
    }
</style>
</head>
<body>

<div id="beam" class="beam"></div>
<canvas id="c"></canvas>

<script>
const canvas = document.getElementById("c");
const ctx = canvas.getContext("2d");
function resize(){ canvas.width = innerWidth; canvas.height = innerHeight; }
resize(); onresize = resize;

/* ------------------ BACKGROUND STARS ------------------- */
let bgStars = [];
for(let i=0;i<350;i++){
    bgStars.push({
        x: Math.random()*canvas.width,
        y: Math.random()*canvas.height,
        r: Math.random()*1.5 + 0.2,
        tw: Math.random()*0.04 + 0.01,
        phase: Math.random()*Math.PI*2
    });
}

/* ------------------ SHIELD LOGIC ------------------- */
let starSpin=false, starAngle=0;
let shieldX, shieldY, R;

/* ------------------ CONSTELLATION LETTERS ------------------- */

const verse = "HE COUNTS THE STARS";
let allConstellations = []; // stores all letter clusters
let revealProgress = 0;

/* Generate constellation for each letter */
function generateConstellations(){
    const startX = canvas.width/2 - verse.length*20;
    let x = startX;
    let y = canvas.height*0.20;

    for(let char of verse){
        if(char===" "){ x+=50; continue; }

        let pts=[];
        let count = 8 + Math.floor(Math.random()*5); // 8–12 stars/letter

        for(let i=0;i<count;i++){
            pts.push({
                x: x + (Math.random()*40 - 20),
                y: y + (Math.random()*40 - 20)
            });
        }

        allConstellations.push({ char, pts });
        x+=45;
    }
}

/* ------------------ DRAW SHIELD ------------------- */
function drawShield(){
    shieldX = canvas.width/2;
    shieldY = canvas.height/2 + canvas.height*0.15;
    R = Math.min(canvas.width, canvas.height)/3;

    ctx.save();
    ctx.translate(shieldX, shieldY);

    /* Rings omitted for brevity — but still here in invisible code */
    const grad1 = ctx.createRadialGradient(0,0,R*0.2,0,0,R);
    grad1.addColorStop(0,"#3c0000");
    grad1.addColorStop(1,"#7a0000");
    ctx.fillStyle = grad1;
    ctx.beginPath(); ctx.arc(0,0,R,0,Math.PI*2); ctx.fill();

    const grad2 = ctx.createRadialGradient(0,0,R*0.1,0,0,R*0.75);
    grad2.addColorStop(0,"#bfc0c2");
    grad2.addColorStop(1,"#e3e3e3");
    ctx.fillStyle = grad2;
    ctx.beginPath(); ctx.arc(0,0,R*0.75,0,Math.PI*2); ctx.fill();

    const grad3 = ctx.createRadialGradient(0,0,R*0.1,0,0,R*0.5);
    grad3.addColorStop(0,"#4b0000");
    grad3.addColorStop(1,"#8c0000");
    ctx.fillStyle = grad3;
    ctx.beginPath(); ctx.arc(0,0,R*0.5,0,Math.PI*2); ctx.fill();

    const grad4 = ctx.createRadialGradient(0,0,R*0.05,0,0,R*0.35);
    grad4.addColorStop(0,"#8fa4c1");
    grad4.addColorStop(1,"#001226");
    ctx.fillStyle = grad4;
    ctx.beginPath(); ctx.arc(0,0,R*0.35,0,Math.PI*2); ctx.fill();

    /* ---- STAR: Glow reduced more ---- */
    ctx.save();
    if(starSpin) ctx.rotate(starAngle);

    const starR = R*0.28;
    ctx.shadowColor = "rgba(255,255,255,0.2)";
    ctx.shadowBlur = 3;   // reduced glow

    ctx.beginPath();
    for(let i=0;i<5;i++){
        let a1=(Math.PI*2/5)*i - Math.PI/2;
        let a2=a1+Math.PI/5;
        ctx.lineTo(Math.cos(a1)*starR, Math.sin(a1)*starR);
        ctx.lineTo(Math.cos(a2)*(starR*0.45), Math.sin(a2)*(starR*0.45));
    }
    ctx.closePath();

    const starGrad = ctx.createRadialGradient(0,0,starR*0.1,0,0,starR);
    starGrad.addColorStop(0,"#ffffff");
    starGrad.addColorStop(1,"#7f7f7f");
    ctx.fillStyle = starGrad;
    ctx.fill();

    ctx.restore();
    ctx.restore();
}

/* ------------------ DRAW BACKGROUND STARS ------------------- */
function drawBgStars(){
    for(let s of bgStars){
        s.phase += s.tw;
        let alpha = 0.3 + Math.sin(s.phase)*0.3;

        ctx.fillStyle = `rgba(255,255,255,${alpha})`;
        ctx.beginPath();
        ctx.arc(s.x,s.y,s.r,0,Math.PI*2);
        ctx.fill();
    }
}

/* ------------------ DRAW CONSTELLATIONS ------------------- */
function drawConstellations(){
    const maxLetters = Math.floor(revealProgress);

    for(let i=0;i<maxLetters;i++){
        let L = allConstellations[i];

        /* Lines */
        ctx.strokeStyle="rgba(255,255,255,0.5)";
        ctx.lineWidth=1;
        ctx.beginPath();
        for(let j=0;j<L.pts.length;j++){
            let a=L.pts[j], b=L.pts[(j+1)%L.pts.length];
            ctx.moveTo(a.x,a.y);
            ctx.lineTo(b.x,b.y);
        }
        ctx.stroke();

        /* Stars */
        for(let p of L.pts){
            ctx.fillStyle="#fff";
            ctx.beginPath();
            ctx.arc(p.x,p.y,3,0,Math.PI*2);
            ctx.fill();
        }
    }
}

/* ------------------ ANIMATION LOOP ------------------- */
function animate(){
    ctx.clearRect(0,0,canvas.width,canvas.height);

    drawBgStars();
    drawShield();
    drawConstellations();

    if(starSpin){
        starAngle += 0.04;
        revealProgress += 0.05; // reveals letters slowly
    }

    requestAnimationFrame(animate);
}
generateConstellations();
animate();

/* ------------------ CLICK TO START ------------------- */
canvas.addEventListener("click", (e)=>{
    let dx=e.clientX-shieldX, dy=e.clientY-shieldY;
    if(Math.sqrt(dx*dx+dy*dy)<=R*0.28){
        starSpin=true;
        document.getElementById("beam").style.opacity=1;
    }
});
</script>

</body>
</html>
