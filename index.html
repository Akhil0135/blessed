<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>IMAX Nolan — Moon → Day → Birthday Reveal</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg-night-1:#070617;
  --bg-night-2:#120430;
  --text-color:#ffdFA0; /* Benhur-style golden */
}
html,body{
  height:100%;
  margin:0;
  background:var(--bg-night-1);
  font-family:"Cinzel",serif;
  overflow:hidden;
  color:var(--text-color);
}
#stage{
  position:relative;
  width:100%;
  height:100%;
  overflow:hidden;
  perspective:1400px;
}
#sky{position:absolute;inset:0;background:linear-gradient(180deg,var(--bg-night-1),var(--bg-night-2) 55%);z-index:0;}
.grain{position:absolute;inset:0;pointer-events:none;z-index:700;opacity:0.06;background-image:radial-gradient(circle, rgba(255,255,255,0.02) 0.5px, transparent 0.5px);background-size:4px 4px;mix-blend-mode:overlay}
#stars{position:absolute;inset:0;z-index:20;pointer-events:none}
#moon{
  position:absolute;
  width:140px;
  height:140px;
  border-radius:50%;
  background:radial-gradient(circle at 35% 30%, #ffffff, #f1e3b5 45%, #d8c08a 100%);
  top:18%;
  left:14%;
  box-shadow:0 0 120px rgba(255,245,200,0.14),0 0 260px rgba(255,240,200,0.06);
  cursor:grab;
  z-index:60;
  pointer-events:auto;
  transition:transform .08s linear,opacity .9s ease,left .28s ease,top .28s ease;
  display:flex;
  align-items:center;
  justify-content:center;
  transform:translate(-50%,-50%) rotate(0deg);
}
#moon:active{cursor:grabbing}
#moon .flare{position:absolute;inset:-40px;border-radius:50%;background:radial-gradient(circle, rgba(255,245,200,0.12), rgba(255,245,200,0));filter:blur(36px);pointer-events:none}

#sun{
  position:absolute;
  width:200px;
  height:200px;
  border-radius:50%;
  right:60px;
  top:-200px;
  background: radial-gradient(circle at 38% 34%, #fff8e8 0%, #ffd98f 12%, #ffb258 32%, #ff8a30 60%, rgba(200,80,30,0.6) 85%, rgba(200,80,30,0) 100%);
  box-shadow:0 0 140px 45px rgba(255,220,140,0.12),0 0 210px 130px rgba(255,180,90,0.04);
  opacity:0;
  pointer-events:none;
  z-index:55;
  transition:top 1.8s cubic-bezier(.2,.9,.2,1),opacity 1.8s ease, transform 1.8s ease;
  will-change:transform,opacity,top;
}
.sun .corona{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:220%;height:220%;border-radius:50%;background:radial-gradient(circle, rgba(255,255,255,0.12), rgba(255,210,120,0.04), rgba(255,160,60,0)); filter:blur(20px);opacity:0;transition:opacity 0.9s ease}

#message{
  position:absolute;
  left:6%;
  right:6%;
  top:62%;
  text-align:center;
  z-index:80;
  font-size:36px;
  letter-spacing:2px;
  color:var(--text-color);
  text-shadow:0 6px 24px rgba(40,10,60,0.65);
  font-family:"Cinzel",serif;
  font-weight:900;
  text-transform:uppercase;
  white-space:nowrap;
  overflow:hidden;
}

.letter{display:inline-block;opacity:0;transform:translateY(12px);transition:opacity .12s ease, transform .12s ease}

/* shooting stars */
.shoot{
  position:absolute;
  width:3px;
  height:18px;
  background:linear-gradient(180deg, rgba(255,255,255,0.95), rgba(255,255,255,0.6));
  border-radius:2px;
  box-shadow:0 0 10px rgba(255,255,255,0.9);
  z-index:95;
  pointer-events:none;
  transform-origin:center;
  filter:blur(.6px);
}
</style>
</head>
<body>
<div id="stage">
  <div id="sky"></div>
  <div class="grain"></div>
  <div id="stars"></div>
  <div id="moon"><div class="flare"></div></div>
  <div id="sun"><div class="corona"></div></div>
  <div id="message"></div>
</div>
<script>
const stage = document.getElementById('stage');
const moon = document.getElementById('moon');
const sun = document.getElementById('sun');
const message = document.getElementById('message');
const starsWrap = document.getElementById('stars');

const fullText = "ON THIS CALM BIRTHDAY EVE SO NEW, GOD SOFTLY WHISPERS, MY PLANS ARE MADE FOR YOU.";
const letters = [];

for(let i=0;i<fullText.length;i++){
  const span = document.createElement('span');
  span.textContent = fullText[i] === ' ' ? '\u00A0' : fullText[i];
  span.className = 'letter';
  message.appendChild(span);
  letters.push(span);
}

let rotationDeg = 0;
let dragging = false;
let lastX = 0;

function makeStars(n=100){
  for(let i=0;i<n;i++){
    const s = document.createElement('div');
    s.className='shoot';
    s.style.left=(Math.random()*100)+'%';
    s.style.top=(Math.random()*80)+'%';
    s.style.opacity=0.6+Math.random()*0.4;
    starsWrap.appendChild(s);
  }
}
makeStars();

moon.addEventListener('pointerdown', e=>{dragging=true; lastX=e.clientX;});
document.addEventListener('pointerup', ()=>{dragging=false;});
document.addEventListener('pointermove', e=>{
  if(!dragging) return;
  const dx = (e.clientX - lastX);
  lastX = e.clientX;
  if(dx<=0) return;
  rotationDeg += dx * 1;
  if(rotationDeg>360) rotationDeg=360;
  updateScene(rotationDeg/360);
});

function updateScene(t){
  t=Math.min(Math.max(t,0),1);
  // moon fade & move
  moon.style.left = (14 + t*46)+'%';
  moon.style.opacity = 1 - t;
  moon.style.transform=`translate(-50%,-50%) rotate(${-t*360}deg)`;

  // reveal letters
  const lettersToShow = Math.floor(t*letters.length);
  for(let i=0;i<letters.length;i++){
    if(i<lettersToShow){
      letters[i].style.opacity=1;
      letters[i].style.transform='translateY(0)';
    } else{
      letters[i].style.opacity=0;
      letters[i].style.transform='translateY(12px)';
    }
  }

  // sun dramatic rise from top-right
  sun.style.opacity=t;
  sun.style.top = (-200 + t*240) + 'px'; // starts off screen, ends at 40px
  sun.style.transform=`scale(${0.6+0.4*t})`;

  // stars fade
  starsWrap.querySelectorAll('.shoot').forEach(s=>{s.style.opacity = Math.max(0, 0.9*(1-t));});
}

// initial hint pulse on moon
moon.animate([
  { transform: 'translate(-50%,-50%) scale(1)' },
  { transform: 'translate(-50%,-50%) scale(1.035)' },
  { transform: 'translate(-50%,-50%) scale(1)' }
], { duration:2200, easing:'ease-in-out', iterations:Infinity });

</script>
</body>
</html>
