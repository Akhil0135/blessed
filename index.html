<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>IMAX Constellation Verse — Akhil Sir</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
    html,body{
        margin:0;
        padding:0;
        overflow:hidden;
        background:#03040a;
        font-family:"Cinzel",serif;
    }

    canvas{
        position:absolute;
        top:0;
        left:0;
        pointer-events:none; /* FIX: prevents blocking clicks */
    }

    #shieldCanvas{
        pointer-events:auto; /* Only shield canvas receives clicks */
    }

    #finalVerse{
        position:absolute;
        top:40px;
        left:50%;
        transform:translateX(-50%);
        font-size:36px;
        color:#ffd98a;
        text-shadow:0 0 15px #fff2c3;
        opacity:0;
        transition:1.5s ease-out;
        white-space:nowrap;
        pointer-events:none;
    }
</style>
</head>
<body>

<canvas id="bgStars"></canvas>
<canvas id="constellationCanvas"></canvas>
<canvas id="shieldCanvas"></canvas>

<div id="finalVerse">He counts the stars and calls them each by name — Psalm 147:4</div>

<script>
/* --------------------------------------------------
   CANVAS SETUP
-------------------------------------------------- */
const bg = document.getElementById("bgStars");
const constCanvas = document.getElementById("constellationCanvas");
const shieldCanvas = document.getElementById("shieldCanvas");

const bgCtx = bg.getContext("2d");
const cCtx = constCanvas.getContext("2d");
const sCtx = shieldCanvas.getContext("2d");

function resize(){
    bg.width = constCanvas.width = shieldCanvas.width = window.innerWidth;
    bg.height = constCanvas.height = shieldCanvas.height = window.innerHeight;
}
resize();
window.onresize = resize;

/* --------------------------------------------------
   BACKGROUND STARFIELD
-------------------------------------------------- */
let bgStars = [];
const STAR_COUNT = 350;

for(let i=0;i<STAR_COUNT;i++){
    bgStars.push({
        x: Math.random()*bg.width,
        y: Math.random()*bg.height,
        r: Math.random()*1.5+0.3,
        speed: Math.random()*0.15+0.05
    });
}

function drawBgStars(){
    bgCtx.clearRect(0,0,bg.width,bg.height);

    for(let s of bgStars){
        bgCtx.globalAlpha = 0.3 + Math.random()*0.3;
        bgCtx.fillStyle="white";
        bgCtx.beginPath();
        bgCtx.arc(s.x,s.y,s.r,0,Math.PI*2);
        bgCtx.fill();

        s.y += s.speed;
        if(s.y > bg.height) s.y = 0;
    }
}

/* --------------------------------------------------
   SHIELD + STAR
-------------------------------------------------- */
let starSpin=false;
let starAngle=0;
let shieldX, shieldY, R;

function drawShield(){
    shieldX = shieldCanvas.width/2;
    shieldY = shieldCanvas.height/2;
    R = Math.min(shieldCanvas.width, shieldCanvas.height)/3;

    sCtx.save();
    sCtx.translate(shieldX, shieldY);

    // Outer red
    const g1 = sCtx.createRadialGradient(0,0,R*0.2,0,0,R);
    g1.addColorStop(0,"#3c0000");
    g1.addColorStop(1,"#7a0000");
    sCtx.fillStyle=g1;
    sCtx.beginPath();
    sCtx.arc(0,0,R,0,Math.PI*2);
    sCtx.fill();

    // White ring
    const g2 = sCtx.createRadialGradient(0,0,R*0.1,0,0,R*0.75);
    g2.addColorStop(0,"#dcdcdc");
    g2.addColorStop(1,"#f7f7f7");
    sCtx.fillStyle=g2;
    sCtx.beginPath();
    sCtx.arc(0,0,R*0.75,0,Math.PI*2);
    sCtx.fill();

    // Inner red
    const g3 = sCtx.createRadialGradient(0,0,R*0.1,0,0,R*0.5);
    g3.addColorStop(0,"#4b0000");
    g3.addColorStop(1,"#8c0000");
    sCtx.fillStyle=g3;
    sCtx.beginPath();
    sCtx.arc(0,0,R*0.5,0,Math.PI*2);
    sCtx.fill();

    // Blue center
    const g4 = sCtx.createRadialGradient(0,0,R*0.07,0,0,R*0.35);
    g4.addColorStop(0,"#b9ccdf");
    g4.addColorStop(1,"#001833");
    sCtx.fillStyle=g4;
    sCtx.beginPath();
    sCtx.arc(0,0,R*0.35,0,Math.PI*2);
    sCtx.fill();

    // Star
    sCtx.save();
    if(starSpin) sCtx.rotate(starAngle);

    const sr = R*0.28;
    sCtx.beginPath();
    for(let i=0;i<5;i++){
        let a = (Math.PI*2/5)*i - Math.PI/2;
        let b = a + Math.PI/5;
        sCtx.lineTo(Math.cos(a)*sr, Math.sin(a)*sr);
        sCtx.lineTo(Math.cos(b)*(sr*0.45), Math.sin(b)*(sr*0.45));
    }
    sCtx.closePath();

    sCtx.shadowBlur=4;
    sCtx.shadowColor="rgba(255,255,255,0.25)";

    const sg = sCtx.createRadialGradient(0,0,sr*0.1,0,0,sr);
    sg.addColorStop(0,"#ffffff");
    sg.addColorStop(1,"#7b7b7b");
    sCtx.fillStyle=sg;
    sCtx.fill();

    sCtx.restore();
    sCtx.restore();
}

/* --------------------------------------------------
   CONSTELLATION EFFECT
-------------------------------------------------- */
const verse = "He counts the stars and calls them each by name — Psalm 147:4";
let constellationStars = [];
let forming = false;

function spawnConstellation(){
    forming = true;
    constellationStars = [];

    const baseX = window.innerWidth/2 - verse.length*6;

    for(let i=0;i<verse.length;i++){
        let src = bgStars[Math.floor(Math.random()*bgStars.length)];

        constellationStars.push({
            x: src.x,
            y: src.y,
            tx: baseX + i*12,
            ty: 60,
            p: 0
        });
    }
}

function drawConstellation(){
    if(!forming) return;

    cCtx.clearRect(0,0,constCanvas.width,constCanvas.height);

    for(let s of constellationStars){
        s.p += 0.02;
        if(s.p > 1) s.p = 1;

        s.x += (s.tx - s.x)*0.08;
        s.y += (s.ty - s.y)*0.08;

        cCtx.fillStyle="rgba(255,220,150,0.9)";
        cCtx.beginPath();
        cCtx.arc(s.x, s.y, 2.2, 0, Math.PI*2);
        cCtx.fill();
    }

    // When all stars settled
    if(constellationStars.every(s => s.p === 1)){
        setTimeout(()=>{
            document.getElementById("finalVerse").style.opacity = 1;
        },400);
    }
}

/* --------------------------------------------------
   CLICK HANDLER (NOW WORKS PERFECT)
-------------------------------------------------- */
shieldCanvas.addEventListener("click", (e)=>{
    let dx = e.clientX - shieldX;
    let dy = e.clientY - shieldY;
    let dist = Math.sqrt(dx*dx + dy*dy);

    if(dist <= R*0.28){
        starSpin = true;
        spawnConstellation();
    }
});

/* --------------------------------------------------
   MAIN LOOP
-------------------------------------------------- */
function animate(){
    drawBgStars();

    sCtx.clearRect(0,0,shieldCanvas.width,shieldCanvas.height);
    drawShield();

    if(starSpin){
        starAngle += 0.035;
    }

    drawConstellation();

    requestAnimationFrame(animate);
}
animate();
</script>

</body>
</html>
