<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>IMAX Phase 4 — PRINCE</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
    html, body {
        margin: 0;
        padding: 0;
        overflow: hidden;
        background: #000;
    }
    canvas { display: block; }
</style>
</head>
<body>
<canvas id="galaxy"></canvas>

<script>
const canvas = document.getElementById("galaxy");
const ctx = canvas.getContext("2d");

function resize() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
}
resize();
window.onresize = resize;

// Galaxy stars
const stars = [];
for (let i = 0; i < 600; i++) {
    stars.push({
        x: Math.random() * canvas.width,
        y: Math.random() * canvas.height,
        size: Math.random() * 1.6 + 0.2,
        tw: Math.random() * 0.02 + 0.003
    });
}

// Convert PRINCE text → points
function textToPoints(textStr) {
    const temp = document.createElement("canvas");
    const tctx = temp.getContext("2d");

    temp.width = canvas.width;
    temp.height = canvas.height;

    const fontSize = canvas.width / 6;

    tctx.fillStyle = "#fff";
    tctx.font = "bold " + fontSize + "px Arial";
    tctx.textAlign = "center";
    tctx.textBaseline = "middle";
    tctx.fillText(textStr, temp.width / 2, temp.height / 2);

    const img = tctx.getImageData(0, 0, temp.width, temp.height).data;

    const points = [];
    for (let y = 0; y < temp.height; y += 6) {
        for (let x = 0; x < temp.width; x += 6) {
            let idx = (y * temp.width + x) * 4;
            if (img[idx + 3] > 200) {
                points.push({ x, y });
            }
        }
    }
    return points;
}

let points = textToPoints("PRINCE");

// Camera rotation
let angle = 0;

// Draw Loop
function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    // Galaxy stars
    stars.forEach(s => {
        const glow = (Math.sin(Date.now() * s.tw) + 1) * 0.5;
        ctx.fillStyle = `rgba(255,255,255,${glow})`;
        ctx.beginPath();
        ctx.arc(s.x, s.y, s.size, 0, Math.PI * 2);
        ctx.fill();
    });

    // Text points with rotation
    ctx.save();
    ctx.translate(canvas.width / 2, canvas.height / 2);

    angle += 0.003;  // Slow cinematic rotation
    const cosA = Math.cos(angle);
    const sinA = Math.sin(angle);

    points.forEach(p => {
        let rx = (p.x - canvas.width / 2);
        let ry = (p.y - canvas.height / 2);

        // Rotate around the center
        let x2 = rx * cosA - ry * sinA;
        let y2 = rx * sinA + ry * cosA;

        ctx.fillStyle = "#fff";
        ctx.shadowColor = "#fff";
        ctx.shadowBlur = 15;

        ctx.beginPath();
        ctx.arc(x2, y2, 2, 0, Math.PI * 2);
        ctx.fill();
    });

    ctx.restore();

    requestAnimationFrame(draw);
}

draw();
</script>
</body>
</html>
