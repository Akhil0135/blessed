<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Cinematic Night Sky</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    overflow: hidden;
    width: 100%;
    height: 100%;
    background: radial-gradient(circle at center, #000000 0%, #020204 40%, #000000 100%);
    font-family: 'Cinzel', serif;
  }

  /* Vignette cinematic effect */
  .vignette {
    position: fixed;
    inset: 0;
    pointer-events: none;
    background: radial-gradient(circle, rgba(0,0,0,0) 40%, rgba(0,0,0,0.6) 100%);
    z-index: 999;
  }

  /* Stars */
  .star {
    position: absolute;
    width: 2px;
    height: 2px;
    background: white;
    border-radius: 50%;
    opacity: 0.9;
    box-shadow: 0 0 8px rgba(255,255,255,0.8);
    animation: twinkle 2.2s infinite alternate;
  }

  @keyframes twinkle {
    0% { opacity: 0.3; transform: scale(1); }
    50% { opacity: 1; transform: scale(1.6); }
    100% { opacity: 0.3; transform: scale(1); }
  }

  /* Moon */
  .moon {
    position: absolute;
    width: 150px;
    height: 150px;
    background: radial-gradient(circle, #fffde8 0%, #f5e5b5 55%, #d4c086 100%);
    border-radius: 50%;
    top: 90px;
    left: -180px;
    box-shadow: 0 0 25px 8px rgba(255,255,200,0.45);
    animation: moonMove 58s linear forwards;
  }

  @keyframes moonMove {
    from { left: -200px; }
    to { left: calc(100% - 260px); }
  }

  /* Shooting Stars */
  .shooting-star {
    position: absolute;
    width: 6px;
    height: 2px;
    background: linear-gradient(0deg, rgba(255,255,255,0), #ffffff);
    border-radius: 50%;
    opacity: 0;
    transform-origin: top left;
    animation: shoot 2.5s linear forwards;
    filter: drop-shadow(0 0 6px white);
  }

  @keyframes shoot {
    0% { transform: translate(0,0) rotate(-45deg); opacity: 1; }
    100% { transform: translate(-80vw,60vh) rotate(-45deg); opacity: 0; }
  }

  /* Message */
  #message {
    position: absolute;
    top: 62%;
    width: 100%;
    text-align: center;
    font-size: 30px;
    color: #f5e6c5;
    opacity: 0;
    letter-spacing: 4px;
    text-shadow: 0 0 12px rgba(255,255,255,0.8);
  }

  .letter {
    opacity: 0;
    display: inline-block;
    animation: revealLetter 0.55s forwards;
  }

  @keyframes revealLetter {
    0% { opacity: 0; filter: blur(6px); transform: translateY(6px); }
    100% { opacity: 1; filter: blur(0); transform: translateY(0); }
  }
</style>
</head>
<body>

<div class="moon"></div>
<div id="message"></div>
<div class="vignette"></div>

<script>
  /* Stars */
  const starCount = 260;
  for(let i = 0; i < starCount; i++){
    const star = document.createElement('div');
    star.classList.add('star');
    star.style.top = Math.random() * window.innerHeight + 'px';
    star.style.left = Math.random() * window.innerWidth + 'px';
    star.style.animationDuration = (1.7 + Math.random()*2.4) + 's';
    document.body.appendChild(star);
  }

  /* Shooting Stars */
  function createShootingStar(){
    const star = document.createElement('div');
    star.classList.add('shooting-star');
    star.style.top = (30 + Math.random()*230) + 'px';
    star.style.left = window.innerWidth + 'px';
    const duration = 1.8 + Math.random()*1.4;
    star.style.animationDuration = duration + 's';
    document.body.appendChild(star);
    setTimeout(() => star.remove(), duration * 1000);
  }

  /* Much higher frequency */
  setInterval(createShootingStar, 900);
  setInterval(createShootingStar, 1400);
  setInterval(createShootingStar, 2000);


  /* Message Reveal */
  const msg = "On this calm birthday eve so new, God softly whispers, my plans are made for you.";
  const messageDiv = document.getElementById("message");

  function revealMessage(){
    msg.split("").forEach((char, i) => {
      const span = document.createElement('span');
      span.classList.add('letter');
      span.textContent = char === ' ' ? '\u00A0' : char;
      span.style.animationDelay = (0.08 * i) + 's';
      messageDiv.appendChild(span);
    });
    messageDiv.style.opacity = 1;
  }

  /* Trigger when moon almost reaches end */
  const moon = document.querySelector('.moon');
  const interval = setInterval(() => {
    const rect = moon.getBoundingClientRect();
    if(rect.left >= window.innerWidth * 0.63){
      revealMessage();
      clearInterval(interval);
    }
  }, 160);

</script>
</body>
</html>
